name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
      name: Web (Next.js)
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: web
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: 'npm'
            cache-dependency-path: web/package-lock.json

        - name: Install deps
          run: npm ci

        - name: Lint
          run: npm run lint

        - name: Typecheck
          run: npm run typecheck

        # İçerik metinlerinin içindeki bağlantılar kodda değil VERİDE duruyor;
        # lint, typecheck ve build üçü de bunları görmez. Bir konu yeniden
        # adlandırıldığında bağlantı sessizce eskiyor ve okuyucu 404 buluyor.
        # İlk denetimde 18 bağlantının 3'ü kırıktı.
        #
        # Yönlendirmesi olan adres kırık sayılmaz; düzeltme yolu iki tane:
        # next.config.js redirects listesine ekle, ya da içerikten bağlantıyı
        # kaldır.
        - name: İçerik bağlantı denetimi
          run: node scripts/link-denetim.cjs

        # Sınav hazırlık ürününde bozuk bir soru arayüz hatası değil, YANLIŞ
        # BİLGİdir: doğru cevabı olmayan ya da var olmayan bir şıkkı işaret
        # eden soru, kullanıcıya konuyu yanlış öğretir. Bu da veride durduğu
        # için diğer kapılara takılmıyor.
        - name: Soru ve kart yapı denetimi
          run: node scripts/soru-denetim.cjs

        # Araç indeksi (content/arac-index.json) ELLE üretiliyor ve üreteç
        # CI'da çalışmıyor. Biri araç ekleyip betiği çalıştırmayı unutursa
        # indeks sessizce bayatlıyor. Bedeli görünür: ana sayfadaki araç
        # sayısı bu dosyadan geliyor, çünkü çalışma zamanında app/tools
        # okunamıyor (sunucusuz ortamda kaynak dizin yok).
        #
        # Bu adım HİÇBİR ŞEY YAZMAZ; indeksi bellekte yeniden hesaplayıp
        # karşılaştırır, fark varsa hangi aracın eksik/fazla/değişmiş
        # olduğunu yazar ve düşer. Düşerse çare tek satır:
        #   node scripts/arac-metadata.cjs
        - name: Araç indeksi senkron mu
          run: node scripts/arac-metadata.cjs --kontrol

        # Başlık indeksi (content/baslik-index.json) da ELLE üretiliyor ve
        # üreteci CI'da çalışmıyordu — araç indeksiyle birebir aynı boşluk.
        # Bayatlarsa paylaşım kartı başlığı slug'dan türetilir: "Akut Böbrek
        # Hasarı" yerine "akut-bobrek-hasari" basılır. Sayfa bozulmaz ama
        # paylaşılan her bağlantı daha kötü görünür.
        #
        # Bu adım HİÇBİR ŞEY YAZMAZ; indeksi bellekte yeniden hesaplayıp
        # karşılaştırır ve eksik/fazla/değişmiş başlıkları tek tek yazar.
        # Düşerse çare tek satır:
        #   node scripts/baslik-index.cjs
        - name: Başlık indeksi senkron mu
          run: node scripts/baslik-index.cjs --kontrol

        # İlgili Konular indeksi (content/ilgili-index.json) üçüncü elle
        # üretilen dosya. Bayatlarsa konu sayfasındaki "İlgili Konular"
        # bloğu yeniden adlandırılmış ya da kaldırılmış bir hedefe bağlanır.
        #
        # Bunu link-denetim GÖRMÜYOR: o yalnızca content/canonical ve
        # content/premium ağaçlarını geziyor, bu dosya content kökünde.
        - name: İlgili Konular indeksi senkron mu
          run: node scripts/ilgili-index.cjs --kontrol

        # Arayüz kaynağındaki, ÜÇ KAPIDAN DA GEÇEN kusurlar: bozuk kodlama
        # (UTF-8 metnin CP1252 okunmuş hâli), alt niteliği olmayan görsel,
        # rel verilmeden açılan yeni sekme, <form> içinde varsayılan submit
        # olan düğme ve iç içe tıklanabilir öge.
        #
        # Hepsi geçerli TypeScript ve geçerli JSX olduğu için lint, typecheck
        # ve build üçü de göremiyor; kusur yalnızca ekranda ya da ekran
        # okuyucuda görünüyor. Üç yönetim sayfası bir dönem başlıklarını
        # "BÃ¶lÃ¼m" diye basıyordu ve dördü de yeşildi.
        #
        # Denetim kendini sınayabiliyor: --negatif bilerek bozuk bir dosya
        # bırakıp yakalandığını gösterir.
        - name: Arayüz denetimi
          run: node scripts/arayuz-denetim.cjs

        - name: Arayüz denetimi kendini sınıyor mu
          run: node scripts/arayuz-denetim.cjs --negatif

        # Render'ın İÇİNDE tanımlanan bileşen her render'da yeni kimlik alır;
        # React kontrolü söküp yeniden takar ve ODAK KAYBOLUR. Kullanıcı bunu
        # iki kez bildirdi ("170 yazmak için kutuya üç kez tıklamak gerekiyor").
        # 19 araçta elle düzeltildi — bu adım geri gelmesini engelliyor.
        - name: İç bileşen denetimi
          run: node scripts/ic-bilesen-denetim.cjs

        - name: İç bileşen denetimi kendini sınıyor mu
          run: node scripts/ic-bilesen-denetim.cjs --negatif

        # Kontrast: ARAÇ tarafı ölçümle sıfıra indirildi (her bulgu tarayıcıda
        # tek tek doğrulandı), bu adımlar geri gelmesini engelliyor. Kapsam
        # bilerek `app/tools` — yönetici ve genel alan HENÜZ ÖLÇÜLMEDİ ve
        # ölçülmemiş bir iddia CI'a yazılmaz; onlar rapor kipinde kalıyor.
        - name: Saydamlık denetimi (araçlar)
          run: node scripts/saydamlik-denetim.cjs --kapi

        - name: Saydamlık denetimi kendini sınıyor mu
          run: node scripts/saydamlik-denetim.cjs --negatif

        - name: Renk çifti denetimi (araçlar)
          run: node scripts/renk-cifti-denetim.cjs --kapi

        - name: Renk çifti denetimi kendini sınıyor mu
          run: node scripts/renk-cifti-denetim.cjs --negatif

        - name: Build
          env:
            NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'http://127.0.0.1:4000' }}
            # lib/db.ts içe aktarılırken fırlatıyor, bu yüzden değişken build
            # sırasında TANIMLI olmalı. Erişilebilir bir veritabanı gerekmiyor:
            # hiçbir sayfa prerender sırasında sorgu atmıyor, ulaşılamaz sahte
            # bir URI ile build 166 sayfayı üretiyor. Gerçek bir secret varsa
            # o kullanılır.
            MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/ci-build' }}
          run: npm run build

  server:
      name: Server (Express) + Docker push
      runs-on: ubuntu-latest
      # DockerHub secret'lari tanimli degilse imaj adimlari ATLANIR, dusmez.
      # Boylece is yesil kalir; secret eklendigi gun hat kendiliginden calisir.
      env:
        DOCKER_HAZIR: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
      defaults:
        run:
          working-directory: server
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: 'npm'
            cache-dependency-path: server/package-lock.json

        - name: Install deps
          run: npm ci

        - name: Lint (optional)
          run: npm run lint --if-present

        - name: Tests (optional)
          run: npm test --if-present

        # --- Docker bölümünü sadece 'push' eventlerinde çalıştır ---
        - name: Set up Docker Buildx
          if: ${{ github.event_name == 'push' && env.DOCKER_HAZIR == 'true' }}
          uses: docker/setup-buildx-action@v3

        - name: Login to DockerHub
          if: ${{ github.event_name == 'push' && env.DOCKER_HAZIR == 'true' }}
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}   # bodidik
            password: ${{ secrets.DOCKERHUB_TOKEN }}      # dckr_pat_...

        - name: Docker metadata
          if: ${{ github.event_name == 'push' && env.DOCKER_HAZIR == 'true' }}
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: bodidik/medisea-server
            tags: |
              type=raw,value=latest
              type=sha,format=short

        - name: Build and push Docker image
          if: ${{ github.event_name == 'push' && env.DOCKER_HAZIR == 'true' }}
          uses: docker/build-push-action@v5
          with:
            context: ./server
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
