<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KOAH alevlenmesinde solunum desteği</title>
<desc id="d">Hedef oksijen satürasyonu yüzde 88–92. NIV ölçütlerinden en az biri varsa NIV ilk moddur: PaCO2 45 mmHg ve üzeri ile pH 7,35 ve altı, solunum kası yorgunluğu bulgularıyla ağır dispne, oksijene rağmen kalıcı hipoksemi. İnvaziv ventilasyon endikasyonları NIV ya da HFNT'ye rağmen yaşamı tehdit eden hipoksemi, tolere edememe, solunum veya kardiyak arrest, bilinç azalması, masif aspirasyon, sekresyon temizleyememe, ağır hemodinamik instabilite ve ağır aritmidir.</desc>
<style>
.a{animation-duration:10s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,18%{opacity:0;transform:translateY(8px)}21%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,18%{stroke-dashoffset:1}23%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,37%{opacity:0;transform:translateY(8px)}40%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,37%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,55%{opacity:0;transform:translateY(8px)}58%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,55%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,74%{opacity:0;transform:translateY(8px)}77%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,74%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="53" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kontrollü oksijen</text><text x="320" y="73" text-anchor="middle" font-size="13" fill="#1e3a8a">hedef SpO₂ %88–92 (titre edilir)</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M320,96 L320,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s2"><rect x="40" y="134" width="560" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">NIV: en az biri</text><text x="320" y="194" text-anchor="middle" font-size="13" fill="#78350f">PaCO₂ ≥ 45 mmHg ve pH ≤ 7,35</text><text x="320" y="214" text-anchor="middle" font-size="13" fill="#78350f">solunum kası yorgunluğu bulgulu ağır dispne</text><text x="320" y="234" text-anchor="middle" font-size="13" fill="#78350f">oksijene rağmen kalıcı hipoksemi</text><text x="320" y="254" text-anchor="middle" font-size="13" fill="#78350f">akut solunum yetmezliğinde başlangıç modu</text></g><g class="a s3"><path class="a ciz" pathLength="1" d="M320,284 L320,318" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s3"><rect x="40" y="322" width="560" height="180" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="377" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">İnvaziv ventilasyon</text><text x="320" y="397" text-anchor="middle" font-size="13" fill="#7f1d1d">HFNT/NIV'e rağmen yaşamı tehdit eden hipoksemi · tolere edememe</text><text x="320" y="417" text-anchor="middle" font-size="13" fill="#7f1d1d">solunum/kardiyak arrest sonrası · azalmış bilinç, kontrolsüz ajitasyon</text><text x="320" y="437" text-anchor="middle" font-size="13" fill="#7f1d1d">masif aspirasyon, sürekli kusma · sekresyon temizleyememe</text><text x="320" y="457" text-anchor="middle" font-size="13" fill="#7f1d1d">yanıtsız ağır hemodinamik instabilite · ağır aritmi</text></g><g class="a s5"><text x="320" y="532" text-anchor="middle" font-size="12" fill="#475569">Kaynak: GOLD 2026 Şekil 4.8–4.9; SpO₂ hedefi UpToDate (2B).</text></g>
</svg>
