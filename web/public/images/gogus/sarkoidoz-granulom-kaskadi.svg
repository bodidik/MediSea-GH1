<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 495" width="640" height="495" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sarkoidozda granülom kaskadı ve üç olası son</title>
<desc id="d">Genetik olarak yatkın bireyde tanımlanamamış bir antijen (mikrobiyal, çevresel ya da mesleki partikül) alveoler makrofaj ve dendritik hücrelerce HLA sınıf II ile CD4 T hücresine sunulur. Th1 ve Th17.1 yanıtı baskınlaşır, regülatör T hücre baskılaması yetersiz kalır. IFN-γ, TNF-α, IL-12 ve IL-2 makrofajları epiteloid ve çok çekirdekli dev hücrelere dönüştürür ve nekrotizan olmayan granülom oluşur; makrofajlarda mTORC1 aktivasyonu granülom oluşumunu sürdürür. Üç son vardır: çoğu hastada granülom kendiliğinden çözülür; yaklaşık dörtte birinde akciğer hastalığı ilerler ve fibroza gidebilir; aktive makrofajlar parathormondan bağımsız 1-alfa-hidroksilaz ile kalsitriol üreterek hiperkalsiüri ve hiperkalsemiye yol açar.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="495" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Tetikleyici</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">yatkın birey (HLA-DRB1) + tanımlanamayan antijen</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">mikrobiyal · silika · küf · pestisit · ilaç</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Antijen sunumu</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">alveoler makrofaj / dendritik hücre</text><text x="160" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">HLA sınıf II → CD4+ T hücre</text><rect x="330" y="112" width="300" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">T hücre kutuplaşması</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">Th1 ve Th17.1 baskın (IFN-γ)</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">Treg baskılaması yetersiz</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="620" height="93" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="240.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Granülom</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">IFN-γ · TNF-α · IL-12 · IL-2</text><text x="320" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">epiteloid + çok çekirdekli dev hücre</text><text x="320" y="294.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">makrofajda mTORC1 aktivasyonu → sürer</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,315 L320,330" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="333" width="193.333" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="106.667" y="359.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Çözülme</text><text x="106.667" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">çoğu hasta</text><text x="106.667" y="396.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">kendiliğinden remisyon</text><rect x="223.333" y="333" width="193.333" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="359.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">İlerleme</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">~%25 ilerleyici akciğer</text><text x="320" y="396.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">fibroz · PH · aspergilloma</text><rect x="436.667" y="333" width="193.333" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="533.333" y="359.00" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Kalsitriol</text><text x="533.333" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">1-α-hidroksilaz (PTH’den bağımsız)</text><text x="533.333" y="396.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">hiperkalsiüri · hiperkalsemi</text></g>
<g class="a o5"><text x="320" y="443" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">TNF-α neden hedef: refrakter hastalıkta infliksimab; mTORC1 ve JAK-STAT araştırma hedefi.</text><text x="320" y="471" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: UpToDate, Pathology and pathogenesis of sarcoidosis (2026); Drakopanagiotakis ve ark., IJMS 2026</text></g>
</svg>
