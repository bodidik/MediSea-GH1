<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">TKP ampirik antibiyotik: yer ve risk</title>
<desc id="d">Ayaktan, ek hastalığı olmayan hastada amoksisilin veya doksisiklin; makrolid yalnızca pnömokokta makrolid direnci yüzde yirmi beşin altındaysa. Ek hastalıkta amoksisilin-klavulanat ya da sefalosporin artı makrolid veya doksisiklin, ya da solunum florokinolonu. Serviste beta-laktam artı makrolid ya da solunum florokinolonu; Fransız 2025 kılavuzu ağır olmayan hastada beta-laktam tek başına yeterli sayar. Ağır TKP de beta-laktam artı makrolid. MRSA veya Pseudomonas kapsamı solunum yolu örneğinde daha önce izole edilmişse ya da yakın yatış ve parenteral antibiyotikle birlikte yerel risk varsa eklenir ve kültür sonucuna göre 48 saatte daraltılır.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="478" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="300" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="36.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Ayaktan, ek hastalık yok</text><text x="160" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">Amoksisilin 1 g × 3 veya doksisiklin</text><text x="160" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">makrolid: yerel direnç &lt;%25 ise</text><rect x="330" y="10" width="300" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="36.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Ayaktan, ek hastalık var</text><text x="480" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">Amoks-klav veya sefalosporin +</text><text x="480" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">makrolid/doksi · ya da R-FQ</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Servis (ağır değil)</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">β-laktam + makrolid ya da R-FQ</text><text x="160" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">Fransız 2025: β-laktam tek başına</text><rect x="330" y="112" width="300" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Ağır TKP</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">β-laktam + makrolid</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">(alternatif: β-laktam + R-FQ)</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="620" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="240.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">MRSA / Pseudomonas kapsamı</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">Daha önce solunum örneğinde izole edildiyse: ekle</text><text x="320" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">son 90 günde yatış + IV antibiyotik + yerel risk: kültür al, ağırsa ekle</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="620" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="342.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">48–72. saat</text><text x="320" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">Kültür, antijen ve PCR sonucuna göre daralt ya da kes</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">günlük klinik stabilite değerlendirmesi</text></g>
<g class="a o5"><text x="320" y="426" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">R-FQ: solunum florokinolonu (levofloksasin 750 mg, moksifloksasin 400 mg)</text><text x="320" y="454" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ATS/IDSA 2019 · Fillatre 2025 · ERS/ESICM 2023</text></g>
</svg>
