<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">GOLD 2026 izlem tedavisi</title>
<desc id="d">İdame alan hastada önce teknik ve uyum gözden geçirilir; hem dispne hem alevlenme varsa alevlenme yolu izlenir. Dispnede LABA artı LAMA'ya geçilir, sonra cihaz değişimi, rehabilitasyon ve varsa ensifentrin düşünülür. Alevlenmede monoterapiden LABA artı LAMA'ya, oradan eozinofil 100 ve üstünde üçlüye geçilir. Üçlüye rağmen alevlenmede eozinofil 300 ve üzerindeyse dupilumab kronik bronşit varlığında ya da mepolizumab, sigara içmeyende azitromisin, FEV1 yüzde 50 altı kronik bronşit ve yatış öyküsünde roflumilast düşünülür.</desc>
<style>
.a{animation-duration:14s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,12%{opacity:0;transform:translateY(8px)}15%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,12%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,23%{opacity:0;transform:translateY(8px)}26%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,23%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,35%{opacity:0;transform:translateY(8px)}38%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,35%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,46%{opacity:0;transform:translateY(8px)}49%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,46%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,58%{opacity:0;transform:translateY(8px)}61%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,58%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,69%{opacity:0;transform:translateY(8px)}72%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,69%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,81%{opacity:0;transform:translateY(8px)}84%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,81%{stroke-dashoffset:1}86%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="700" fill="#ffffff"/>
<g class="a m s1"><rect x="90" y="20" width="460" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="47" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Gözden geçir · değerlendir · ayarla</text><text x="320" y="67" text-anchor="middle" font-size="13" fill="#0f172a">teknik ve uyum · rehabilitasyon · eşlik eden hastalık</text><text x="320" y="87" text-anchor="middle" font-size="13" fill="#0f172a">ikisi birden hedefse: alevlenme yolu</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M210,104 L140,146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M430,104 L470,146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s2"><rect x="15" y="150" width="230" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="130" y="183" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">DİSPNE</text><text x="130" y="203" text-anchor="middle" font-size="13" fill="#78350f">kalıcı nefes darlığı</text></g><g class="a m s3"><rect x="265" y="150" width="360" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="445" y="183" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">ALEVLENME</text><text x="445" y="203" text-anchor="middle" font-size="13" fill="#7f1d1d">orta veya ağır atak</text></g><g class="a s4"><path class="a ciz" pathLength="1" d="M130,226 L130,262" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M445,226 L445,262" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s4"><rect x="15" y="266" width="230" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="130" y="316" text-anchor="middle" font-size="13" fill="#1e3a8a">tekli bronkodilatörden</text><text x="130" y="336" text-anchor="middle" font-size="13" fill="#1e3a8a">LABA + LAMA</text></g><g class="a m s5"><rect x="265" y="266" width="360" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="445" y="296" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">LABA + LAMA'da atak</text><text x="445" y="316" text-anchor="middle" font-size="13" fill="#1e3a8a">eoz ≥ 100: LABA + LAMA + ICS</text><text x="445" y="336" text-anchor="middle" font-size="13" fill="#1e3a8a">eoz &lt; 100: azitromisin (içmeyen)</text><text x="445" y="356" text-anchor="middle" font-size="13" fill="#1e3a8a">veya roflumilast</text></g><g class="a s6"><path class="a ciz" pathLength="1" d="M130,376 L130,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M445,376 L445,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s6"><rect x="15" y="416" width="230" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="130" y="456" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Yetmezse</text><text x="130" y="476" text-anchor="middle" font-size="13" fill="#064e3b">cihaz/molekül değişimi</text><text x="130" y="496" text-anchor="middle" font-size="13" fill="#064e3b">rehabilitasyon</text><text x="130" y="516" text-anchor="middle" font-size="13" fill="#064e3b">ensifentrin (varsa)</text></g><g class="a m s7"><rect x="265" y="416" width="360" height="200" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="445" y="471" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Üçlüde atak sürüyorsa</text><text x="445" y="491" text-anchor="middle" font-size="13" fill="#4c1d95">eoz ≥ 300: dupilumab (kronik bronşit varsa)</text><text x="445" y="511" text-anchor="middle" font-size="13" fill="#4c1d95">ya da mepolizumab (kronik bronşit olsun olmasın)</text><text x="445" y="531" text-anchor="middle" font-size="13" fill="#4c1d95">içmeyen: azitromisin (direnç gözet)</text><text x="445" y="551" text-anchor="middle" font-size="13" fill="#4c1d95">FEV₁ &lt; %50 + kronik bronşit + ağır atak:</text><text x="445" y="571" text-anchor="middle" font-size="13" fill="#4c1d95">roflumilast</text></g><g class="a s8"><text x="320" y="660" text-anchor="middle" font-size="12" fill="#475569">Kaynak: GOLD 2026, Bölüm 3. Bu algoritma başlangıçtaki ABE grubundan bağımsız uygulanır.</text></g>
</svg>
