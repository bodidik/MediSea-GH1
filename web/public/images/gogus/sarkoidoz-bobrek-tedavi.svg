<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 461" width="640" height="461" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sarkoid interstisyel nefrit ve kalsiyum bozukluklarında tedavi yolu</title>
<desc id="d">Sarkoid interstisyel nefritte tanı ekstrarenal sarkoidoz bulgusu, böbrek biyopsisinde interstisyel nefrit ve diğer nedenlerin dışlanmasına dayanır. Biyopside yüzde 50 ila 75’i aşan fibroz varsa ve böbrek 8 cm’den küçükse immünsüpresyon genellikle verilmez. Diğer hastalarda prednizon günde 1 mg/kg (en çok 80 mg) 6–8 hafta, sonra 4–5 ayda 10 mg idameye inilir ve 6–9 ay daha sürdürülür. Randomize çalışmada pulse metilprednizolon yalnız oral prednizona göre üstün değildi; birincil sonlanım oral kolda daha sık sağlandı. Steroide dirençli ya da intoleransta metotreksat, azatiyoprin, mikofenolat; son çare TNF antagonisti. Hiperkalsemide glukokortikoid ya da ketokonazol, diyet kalsiyumu azaltılır, tiazid kontrendikedir. Taş önlemede günde en az 2 litre idrar ve D vitamini takviyesinden kaçınma; normokalsemik hiperkalsiürik taşta tiazid denenirse kalsiyum 1 hafta sonra ve 2–3 ayda bir izlenir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="461" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="59" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Sarkoid interstisyel nefrit</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">ekstrarenal sarkoidoz + biyopside interstisyel nefrit + dışlama</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,77 L320,92" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="95" width="300" height="93" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="129.50" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Fibroz &gt;%50–75 + böbrek &lt;8 cm</text><text x="160" y="149.50" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">immünsüpresyon genellikle YOK</text><text x="160" y="166.50" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">yanıt beklenmez</text><rect x="330" y="95" width="300" height="93" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="480" y="121.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Diğerleri: prednizon</text><text x="480" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">1 mg/kg (en çok 80) × 6–8 hafta</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">4–5 ayda 10 mg → 6–9 ay daha</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">pulse MP EK YARAR YOK (RKÇ)</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="620" height="59" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="240.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Dirençli / intolerans</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">MTX · AZA · MMF → son çare anti-TNF</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,281 L320,296" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="299" width="300" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="325.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Hiperkalsemi</text><text x="160" y="345.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">glukokortikoid ya da ketokonazol</text><text x="160" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">diyet Ca ↓ · D vit kes · TİAZİD YOK</text><rect x="330" y="299" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="480" y="325.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Taş / nefrokalsinoz</text><text x="480" y="345.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">idrar ≥2 L/gün · D vit takviyesi yok</text><text x="480" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">normokalsemide tiazid: Ca 1 hf, 2–3 ayda</text></g>
<g class="a o5"><text x="320" y="409" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Tam yanıtın en iyi öngördürücüsü 1. aydaki yanıt; fibroz arttıkça kazanım azalır.</text><text x="320" y="437" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: UpToDate (2026); Mahévas 2009 (Medicine); Mahévas 2023 (NDT); Rajakariar 2006 (Kidney Int)</text></g>
</svg>
