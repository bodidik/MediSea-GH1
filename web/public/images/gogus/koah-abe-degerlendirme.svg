<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">GOLD 2026 ABE değerlendirmesi</title>
<desc id="d">Bronkodilatör sonrası FEV1/FVC 0,7 altı tanıyı doğrular. FEV1 ile GOLD 1–4 hava akımı kısıtlanması derecelenir. Son bir yılda bir veya daha fazla orta ya da ağır alevlenme varsa semptomdan bağımsız Grup E. Hiç orta veya ağır alevlenme yoksa mMRC 0–1 ve CAT 10 altı Grup A, mMRC 2 ve üstü ya da CAT 10 ve üstü Grup B.</desc>
<style>
.a{animation-duration:11s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}18%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,31%{opacity:0;transform:translateY(8px)}34%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,31%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,46%{opacity:0;transform:translateY(8px)}49%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,46%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,61%{opacity:0;transform:translateY(8px)}64%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,61%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,77%{opacity:0;transform:translateY(8px)}80%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,77%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a m s1"><rect x="120" y="20" width="400" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="50" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Spirometrik tanı</text><text x="320" y="70" text-anchor="middle" font-size="13" fill="#0f172a">bronkodilatör sonrası FEV₁/FVC &lt; 0,7</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M320,90 L320,122" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s2"><rect x="40" y="126" width="560" height="84" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="153" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kısıtlanma derecesi (FEV₁ %)</text><text x="320" y="173" text-anchor="middle" font-size="13" fill="#1e3a8a">GOLD 1 ≥80 · GOLD 2 50–79 · GOLD 3 30–49 · GOLD 4 &lt;30</text><text x="320" y="193" text-anchor="middle" font-size="13" fill="#1e3a8a">ABE grubunu belirlemez</text></g><g class="a s3"><path class="a ciz" pathLength="1" d="M320,210 L320,242" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s3"><rect x="120" y="246" width="400" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Son 1 yılda orta/ağır alevlenme?</text></g><g class="a s4"><path class="a ciz" pathLength="1" d="M420,316 L480,360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M220,316 L170,360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s4"><rect x="340" y="364" width="285" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="482.5" y="404" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Grup E</text><text x="482.5" y="424" text-anchor="middle" font-size="13" fill="#7f1d1d">≥1 orta veya ağır alevlenme</text><text x="482.5" y="444" text-anchor="middle" font-size="13" fill="#7f1d1d">semptomdan bağımsız</text><text x="482.5" y="464" text-anchor="middle" font-size="13" fill="#7f1d1d">(GOLD 2026 değişikliği)</text></g><g class="a m s5"><rect x="15" y="364" width="150" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="90" y="404" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Grup A</text><text x="90" y="424" text-anchor="middle" font-size="13" fill="#064e3b">0 alevlenme</text><text x="90" y="444" text-anchor="middle" font-size="13" fill="#064e3b">mMRC 0–1</text><text x="90" y="464" text-anchor="middle" font-size="13" fill="#064e3b">CAT &lt; 10</text></g><g class="a m s6"><rect x="175" y="364" width="150" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="250" y="404" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Grup B</text><text x="250" y="424" text-anchor="middle" font-size="13" fill="#78350f">0 alevlenme</text><text x="250" y="444" text-anchor="middle" font-size="13" fill="#78350f">mMRC ≥ 2</text><text x="250" y="464" text-anchor="middle" font-size="13" fill="#78350f">CAT ≥ 10</text></g><g class="a s6"><text x="320" y="530" text-anchor="middle" font-size="12" fill="#475569">Kaynak: GOLD 2026, Şekil 2.13. Yalnız tedavi almamış hastada başlangıç içindir.</text></g>
</svg>
