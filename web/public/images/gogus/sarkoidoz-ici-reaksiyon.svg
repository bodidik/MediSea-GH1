<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 461" width="640" height="461" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kontrol noktası inhibitörü alan hastada yeni LAP: reaksiyon mu nüks mü</title>
<desc id="d">İmmün kontrol noktası inhibitörüyle ilişkili sarkoid benzeri reaksiyon çoğunlukla tedavinin ilk 3 ila 6 ayında görülür; adjuvan melanomda ortanca 2,8 ayda ilk kontrol görüntülemesinde yakalanır, 3 hafta ile 2 yıl arasında ve tedavi kesildikten sonra da bildirilmiştir. Sıklık büyük metastatik çalışma veri setlerinde binde 5’in altında, gerçek yaşam adjuvan kohortlarında yüzde 20’nin üzerindedir; pembrolizumab alan melanom hastalarında sistematik derlemede yüzde 1,5 ila 1,8 ve ortalama başlangıç 7,1 ay. Simetrik bilateral hiler LAP, perilenfatik mikronodüller, stabil ya da gerileyen seyir ve cilt granülomu reaksiyonu düşündürür; asimetrik, tümörün drenaj paterninde, ilerleyici büyüme ve yükselen tümör belirteci nüksü. FDG-PET ikisini ayıramaz; EBUS-TBNA ile doku tanısı alınır. Reaksiyon çoğunlukla izlemle ya da kortikosteroidle yönetilir ve pembrolizumab sıklıkla sürdürülür.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="461" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="59" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Kontrol noktası inhibitörü + yeni intratorasik LAP</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">çoğu ilk 3–6 ay (adjuvan melanom: ortanca 2,8 ay) · 3 hf–2 yıl, kesildikten sonra da</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,77 L320,92" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="95" width="300" height="93" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="121.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Reaksiyonu düşündürür</text><text x="160" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">SİMETRİK bilateral hiler LAP</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">perilenfatik mikronodül</text><text x="160" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">stabil / gerileyen · cilt granülomu</text><rect x="330" y="95" width="300" height="93" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="121.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Nüksü düşündürür</text><text x="480" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">ASİMETRİK, drenaj paterni</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">seri görüntülemede büyüme</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">yükselen tümör belirteci</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="620" height="59" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="240.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">FDG-PET ayıramaz → doku tanısı</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">EBUS-TBNA: granülom mu, malign hücre mi?</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,281 L320,296" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="299" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="325.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Reaksiyon</text><text x="160" y="345.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">izlem ya da kortikosteroid</text><text x="160" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">pembrolizumab sıklıkla sürdürülür</text><rect x="330" y="299" width="300" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="333.50" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Nüks</text><text x="480" y="353.50" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">onkolojik tedavi değişikliği</text></g>
<g class="a o5"><text x="320" y="409" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Sıklık: metastatik çalışmalarda &lt;%0,5 · adjuvan gerçek yaşamda &gt;%20 · pembrolizumab-melanom %1,5–1,8.</text><text x="320" y="437" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: Lee ve ark., Biomedicines 2026; Khan ve ark., Cureus 2026</text></g>
</svg>
