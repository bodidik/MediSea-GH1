<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">HKP: 48–72. saat ve süre</title>
<desc id="d">Ampirik tedaviden önce solunum yolu örneği alınır. 48 ila 72 saatte klinik yanıt ve kültür sonuçlarıyla yeniden değerlendirilir. Etken bulunduysa tedavi duyarlı tek ajana daraltılır; P. aeruginosa enfeksiyonunda şok ya da yüksek ölüm riski yoksa duyarlı tek ajan yeterlidir. Kültür negatif ve hasta düzeliyorsa anti-MRSA ve ikinci Gram negatif ajan kesilir, başka tanı aranır. Tedavi süresi yedi gündür; prokalsitonin klinik ölçütlerle birlikte kesme kararına yardımcı olur.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="478" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">0. saat</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Solunum örneği (balgam / aspirat) ve kan kültürü,</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">sonra hemen ampirik tedavi</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="620" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="138.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">48–72. saat: yeniden değerlendir</text><text x="320" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">Klinik yanıt + kültür + duyarlılık</text><text x="320" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">tanı hâlâ pnömoni mi?</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="300" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Etken belli</text><text x="160" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">Duyarlı tek ajana daralt;</text><text x="160" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">şok yoksa P. aeruginosa’da tekli</text><rect x="330" y="214" width="300" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Kültür negatif, düzeliyor</text><text x="480" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">Anti-MRSA ve ikinci ajanı kes;</text><text x="480" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">başka tanıyı düşün</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="620" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="342.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Süre: 7 gün</text><text x="320" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">Prokalsitonin + klinik ölçütler kesme kararına yardım eder</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">yanıtsızlıkta komplikasyon ve direnç ara</text></g>
<g class="a o5"><text x="320" y="426" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Prokalsitonin, CRP, CPIS tedaviye BAŞLAMA kararında kullanılmaz</text><text x="320" y="454" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: IDSA/ATS 2016 · Chastre 2003 · Pugh 2015</text></g>
</svg>
