<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 563" width="640" height="563" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Granülom görüldüğünde dışlama sırası</title>
<desc id="d">Nekrotizan olmayan granülom tek başına sarkoidoz demek değildir. Önce infeksiyon dışlanır: dokuda aside dirençli bakteri ve mantar boyası ile kültür; nontüberküloz mikobakterilerde boya duyarsızdır. Sonra maruziyet öyküsü: berilyum, silika, kuş ve küf; berilyumda kan ya da BAL berilyum lenfosit proliferasyon testi. Sonra ilaçlar: kontrol noktası inhibitörü, anti-TNF, interferon, antiretroviral. Sonra immün yetmezlik: hipogamaglobulinemi, tekrarlayan infeksiyon ve otoimmünitede CVID ve GLILD. Sonra malignite: asimetrik LAP ve seri görüntülemede büyüme; granülom gören patolog malign hücre aramayı sürdürür. Histolojide vaskülit, Langerhans hücreli histiyositoz, Erdheim-Chester ve yabancı cisim ayrılır. Ancak bunlar dışlanıp başka bir organda da uyumlu bulgu varsa sarkoidoz tanısı güvenlidir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.o6{animation-name:o6}@keyframes o6{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.o6 .ciz{animation-name:o6c}@keyframes o6c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="563" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="59" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Nekrotizan olmayan granülom</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">tek başına sarkoidoz DEĞİL — dışlama tanısı</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,77 L320,92" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="95" width="300" height="93" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="121.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">1. İnfeksiyon</text><text x="160" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">ARB + mantar boyası ve KÜLTÜR</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">NTM’de boya duyarsız</text><text x="160" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">immünsüpresyon öncesi BAL kültürü</text><rect x="330" y="95" width="300" height="93" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="121.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">2. Maruziyet</text><text x="480" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">berilyum → BeLPT (kan/BAL)</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">silika · kuş · küf (HP)</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">meslek öyküsü</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="300" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="160" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">3. İlaç</text><text x="160" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">kontrol noktası inhibitörü</text><text x="160" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">anti-TNF · interferon · ART</text><rect x="330" y="214" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="480" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">4. İmmün yetmezlik</text><text x="480" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">hipogamaglobulinemi + infeksiyon</text><text x="480" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">→ CVID / GLILD</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="620" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="342.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">5. Malignite / histoloji</text><text x="320" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">asimetrik LAP, büyüme → malign hücre ara</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">vaskülit · LCH (CD1a/S100) · Erdheim-Chester · yabancı cisim</text></g>
<g class="a o5"><path class="ciz" pathLength="1" d="M320,400 L320,415" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="418" width="620" height="59" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320" y="444.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">Sarkoidoz</text><text x="320" y="464.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">dışlama tamam + BAŞKA bir organda uyumlu bulgu</text></g>
<g class="a o6"><text x="320" y="511" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Yüksek tanı skoru bile CVID, ANCA vasküliti ve berilyozu ayıramaz.</text><text x="320" y="539" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: UpToDate, Clinical manifestations and diagnosis of sarcoidosis (2026), Differential diagnosis</text></g>
</svg>
