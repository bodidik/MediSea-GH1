<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hastane kaynaklı pnömoni: zaman ve ventilatör</title>
<desc id="d">Yatışta kuluçkada olmayan ve yatıştan en az 48 saat sonra gelişen pnömoni hastane kaynaklıdır. Ventilatörde olmayan hastada gelişirse ventilatörle ilişkili olmayan HKP adını alır; bu hasta pnömoni nedeniyle sonradan entübe edilirse ventile HKP denir. Entübasyondan en az 48 saat sonra gelişen pnömoni ventilatörle ilişkili pnömonidir. Sağlık hizmetiyle ilişkili pnömoni kategorisi kaldırıldı; toplumdan gelen hasta için dirençli patojen riski bireysel değerlendirilir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="478" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Yatış (0. saat)</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Bu sırada kuluçkada olan pnömoni</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">hastane kaynaklı sayılmaz</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="300" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">≥48 saat sonra, ventilatörde değil</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">Hastane kaynaklı pnömoni (HKP)</text><text x="160" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ventilatörle ilişkili olmayan HKP</text><rect x="330" y="112" width="300" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Entübasyondan ≥48 saat sonra</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">Ventilatörle ilişkili</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">pnömoni (VİP)</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="620" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="240.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">HKP nedeniyle entübe edilirse</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">Ventile HKP: sonradan solunum desteği</text><text x="320" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">gerektiren HKP — en yüksek riskli grup</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="620" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="342.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">SHİP kategorisi yok</text><text x="320" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">Toplumdan gelen hastada dirençli patojen riski</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">bireysel değerlendirilir (bkz. TKP)</text></g>
<g class="a o5"><text x="320" y="426" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">IDSA/ATS 2016: HKP ve VİP ayrı tanımlar; VİP, HKP alt grubu değildir</text><text x="320" y="454" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: IDSA/ATS 2016 · ATS/IDSA 2019</text></g>
</svg>
