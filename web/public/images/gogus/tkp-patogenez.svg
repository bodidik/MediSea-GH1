<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">TKP patogenezi: mikroaspirasyondan iki yüzlü hastalığa</title>
<desc id="d">Mikroorganizma akciğere çoğunlukla orofaringeal sekresyonların mikroaspirasyonuyla ulaşır. Alveoler makrofaj ilk nöbetçidir; patojen kapsül ve toksinlerle kaçarsa (pnömokokta pnömolizin, kompleman inhibisyonu) nötrofiller çağrılır ve IL-1β, IL-18 gibi sitokinler salınır. Yanıt yerel kalırsa konsolidasyon ve klinik pnömoni gelişir; düzensiz ve sistemikleşirse sepsis, septik şok ve ARDS gelişir. Hastalık bu yüzden hem enfeksiyöz hem immünolojiktir: antibiyotik patojeni, kortikosteroid gibi tedaviler konak yanıtını hedefler.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.o6{animation-name:o6}@keyframes o6{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.o6 .ciz{animation-name:o6c}@keyframes o6c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="580" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="300" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="160" y="36.00" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Giriş yolu</text><text x="160" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Orofaringeal sekresyonların</text><text x="160" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">mikroaspirasyonu (en sık)</text><rect x="330" y="10" width="300" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="480" y="36.00" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Konak zemini</text><text x="480" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Yaş, diyabet, KOAH, disfaji,</text><text x="480" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">immünsüpresyon, sigara</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="620" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="138.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">İlk savunma</text><text x="320" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">Alveoler makrofaj patojeni tanır</text><text x="320" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">(TLR2, TLR4, inflamazom)</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="620" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="240.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Patojen kaçarsa</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">Kapsül fagositozu engeller; pnömolizin</text><text x="320" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">hücreyi deler, kompleman baskılanır</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="342.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Yerel yanıt</text><text x="160" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">Nötrofil akını, IL-1β, IL-18</text><text x="160" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">→ konsolidasyon, klinik pnömoni</text><rect x="330" y="316" width="300" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="342.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Düzensiz sistemik yanıt</text><text x="480" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">Sitokin taşması → sepsis,</text><text x="480" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">septik şok, ARDS</text></g>
<g class="a o5"><path class="ciz" pathLength="1" d="M320,400 L320,415" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="418" width="620" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="444.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">İki yüzlü hastalık</text><text x="320" y="464.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">Antibiyotik patojeni hedefler; kortikosteroid ve</text><text x="320" y="481.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">immünmodülasyon konak yanıtını hedefler</text></g>
<g class="a o6"><text x="320" y="528" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Mortaliteyi akciğerdeki yaygınlıktan çok organ disfonksiyonu belirler</text><text x="320" y="556" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: Ferriero 2026 · Blot 2025 · Asis 2026</text></g>
</svg>
