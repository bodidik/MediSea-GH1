<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 529" width="640" height="529" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Yüksek kalsiyum ya da kalsiyum taşında sarkoidoza varma yolu</title>
<desc id="d">Hiperkalsemi ya da kalsiyum taşı ve nefrokalsinozda ilk adım parathormondur. Parathormon yüksek ya da uygunsuz normalse primer hiperparatiroidi düşünülür. Parathormon düşük ya da düşük-normalse 1,25-dihidroksi D vitamini ölçülür; yüksekse kalsitriol aracılı hiperkalsemi vardır ve sarkoidoz ile diğer granülomatöz hastalıklar araştırılır. Taş ya da nefrokalsinoz ancak hiperkalsemi ve/veya hiperkalsiüri ile aşırı 1-alfa-hidroksilaz aktivitesi gösterildikten sonra sarkoidoza bağlanır. Böbrek yetmezliğinin çoğu nedeninde kalsiyum düşük-normaldir; böbrek yetmezliğinde yüksek ya da üst-normal kalsiyum sarkoidozu düşündürür. Erkeklerde hiperkalsemi kadınlardan daha sıktır.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.o6{animation-name:o6}@keyframes o6{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.o6 .ciz{animation-name:o6c}@keyframes o6c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="529" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="59" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Hiperkalsemi · Ca taşı · nefrokalsinoz</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">24 saatlik idrar kalsiyumu · böbrek USG</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,77 L320,92" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="95" width="620" height="59" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="121.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">PTH</text><text x="320" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ilk ve ayıran test</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,162 L320,177" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="180" width="300" height="59" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="206.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">PTH yüksek / uygunsuz normal</text><text x="160" y="226.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">→ primer hiperparatiroidi</text><rect x="330" y="180" width="300" height="59" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="206.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">PTH düşük / düşük-normal</text><text x="480" y="226.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ 1,25-(OH)₂ D ölç</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,247 L320,262" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="265" width="300" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="291.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">1,25-(OH)₂ D yüksek</text><text x="160" y="311.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">kalsitriol aracılı: sarkoidoz ve</text><text x="160" y="328.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">diğer granülomatöz hastalıklar</text><rect x="330" y="265" width="300" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="480" y="299.50" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">1,25-(OH)₂ D yüksek değil</text><text x="480" y="319.50" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">başka neden ara</text></g>
<g class="a o5"><path class="ciz" pathLength="1" d="M320,349 L320,364" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="367" width="620" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320" y="393.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">İpuçları</text><text x="320" y="413.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">taş/nefrokalsinoz ancak 1-α-hidroksilaz aktivitesi gösterilince sarkoidoza bağlanır</text><text x="320" y="430.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">böbrek yetmezliğinde YÜKSEK kalsiyum → sarkoidoz düşün · erkekte hiperkalsemi daha sık (ACCESS)</text></g>
<g class="a o6"><text x="320" y="477" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Normal serum kalsiyumu böbrek riskini dışlamaz — hiperkalsiüri daha sık.</text><text x="320" y="505" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: UpToDate, Kidney disease in sarcoidosis (2026); ACCESS (Baughman 2001)</text></g>
</svg>
