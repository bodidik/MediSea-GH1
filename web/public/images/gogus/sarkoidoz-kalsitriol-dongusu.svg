<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 529" width="640" height="529" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sarkoidozda kalsitriol döngüsü ve tedavinin kestiği noktalar</title>
<desc id="d">Granülomdaki aktive makrofajlar 25-hidroksi D vitaminini 1-alfa-hidroksilaz ile aktif kalsitriole çevirir. Böbrekteki enzimin aksine bu ekstrarenal enzim normal geri bildirim baskılanmasına yanıt vermez; bu, 1983’te sarkoidozlu hastaların alveoler makrofaj kültürlerinde gösterildi. Kalsitriol barsaktan kalsiyum emilimini artırır (hastaların yarısına kadar), önce hiperkalsiüri (yaklaşık yüzde 40), böbreğin atım kapasitesi aşılınca hiperkalsemi (yüzde 2 ila 20) gelişir; parathormon baskılanır. Sonuç nefrokalsinoz, böbrek taşı ve ağır hiperkalsemide akut böbrek hasarıdır. Glukokortikoid granülomatöz inflamasyonu baskılayarak, ketokonazol 1-alfa-hidroksilazı inhibe ederek döngüyü keser; D vitamini takviyesi döngüye yakıt ekler, tiazid hiperkalsemide kalsiyum tutar.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.o6{animation-name:o6}@keyframes o6{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.o6 .ciz{animation-name:o6c}@keyframes o6c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="529" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="59" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">25-OH D vitamini</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">(güneş, diyet, takviye — takviye döngüye yakıt ekler)</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,77 L320,92" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="95" width="620" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="121.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Granülom makrofajı: 1-α-hidroksilaz</text><text x="320" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">geri bildirime YANIT VERMEZ (Adams 1983)</text><text x="320" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">kesenler: glukokortikoid (inflamasyon) · ketokonazol (enzim)</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,179 L320,194" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="197" width="620" height="59" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="223.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">1,25-(OH)₂ D (kalsitriol) ↑</text><text x="320" y="243.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">barsakta kalsiyum emilimi ↑ (%50’ye kadar)</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,264 L320,279" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="282" width="300" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="308.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Hiperkalsiüri ~%40</text><text x="160" y="328.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">önce ve daha sık</text><text x="160" y="345.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">tiazid: hiperkalsemide YASAK</text><rect x="330" y="282" width="300" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="308.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Hiperkalsemi %2–20</text><text x="480" y="328.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">atım kapasitesi aşılınca</text><text x="480" y="345.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">PTH baskılanır (düşük)</text></g>
<g class="a o5"><path class="ciz" pathLength="1" d="M320,366 L320,381" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="384" width="620" height="59" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="410.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Böbrek</text><text x="320" y="430.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">nefrokalsinoz · Ca oksalat/fosfat taşı · ağır hiperkalsemide ABH (geri döner)</text></g>
<g class="a o6"><text x="320" y="477" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Aynı döngü birçok başka kronik granülomatöz hastalıkta da çalışır.</text><text x="320" y="505" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: UpToDate, Kidney disease in sarcoidosis (2026); Adams ve ark., J Clin Invest 1983</text></g>
</svg>
