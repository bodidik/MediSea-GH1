<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" width="640" height="376" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">TKP: süre ve kortikosteroid kararı</title>
<desc id="d">Antibiyotik süresi klinik stabiliteye göre belirlenir. Ağır olmayan TKP 3. günde stabilse en az üç gün, 5 günden kısa tedavi yeterlidir; stabilite 5. günde gelirse beş gün, diğer komplike olmayan durumlarda yedi gün. Ağır TKP en az beş gün alır. Komplikasyonda süre uzar. Kortikosteroid ağır olmayan TKP’de verilmez. Ağır TKP’de influenza dışında önerilir; CAPE COD rejimi hidrokortizon 200 mg/gün, 4 ya da 7 gün sonra azaltılarak toplam 8 ya da 14 gün.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="376" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Her gün sor: hasta stabil mi?</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Ateş ≤37,8 °C, nabız &lt;100, solunum &lt;24, SKB ≥90,</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">SpO₂ ≥%90, bilinç normal, ağızdan beslenebiliyor</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="193.333" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="106.667" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Stabil: 3. gün</text><text x="106.667" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">Ağır değil →</text><text x="106.667" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">3 gün yeterli</text><rect x="223.333" y="112" width="193.333" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="146.50" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Stabil: 5. gün</text><text x="320" y="166.50" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">5 gün</text><rect x="436.667" y="112" width="193.333" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="533.333" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Ağır TKP</text><text x="533.333" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">≥5 gün; komplikasyon</text><text x="533.333" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">varsa uzat</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="300" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="160" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Kortikosteroid: ağır değil</text><text x="160" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">Verme (güçlü öneri):</text><text x="160" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">hiperglisemi var, yarar yok</text><rect x="330" y="214" width="300" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Kortikosteroid: ağır TKP</text><text x="480" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">Hidrokortizon 200 mg/gün,</text><text x="480" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">erken; influenzada verme</text></g>
<g class="a o4"><text x="320" y="324" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Fransız 2025: steroid dışı kalanlar influenza, miyelosupresyon, aspirasyon</text><text x="320" y="352" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ATS 2025 · Dinh 2021 · Dequin 2023 · Blot 2025</text></g>
</svg>
