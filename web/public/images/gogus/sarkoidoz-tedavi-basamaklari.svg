<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 563" width="640" height="563" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Pulmoner sarkoidozda tedavi basamakları ve her basamağın kanıtı</title>
<desc id="d">Pulmoner sarkoidozun çoğu tedavi gerektirmez; asemptomatik hastada izlem önerilir. Semptomatik hafif tutulumda düşük doz prednizon ya da yüksek doz inhale steroid, ya da izlem. Ağır ya da ilerleyici hastalıkta hızlı progresyon yoksa metotreksat: PREDMETH çalışmasında 24. haftada FVC açısından prednizona eşdeğerdi. Hızlı progresyonda prednizon 20 ila 40 mg köprüsü ile metotreksat. SARCORT çalışmasında 40 mg prednizolon 20 mg’dan üstün değildi. Metotreksat yetersizse azatiyoprin, leflunomid ya da mikofenolat; bunlar da yetersizse iki ajan kombinasyonu ya da TNF antagonisti. İnfliksimab faz 2 çalışmasında FVC’yi yüzde 2,5 artırdı. Efzofitimod faz 3 EFZO-FIT çalışmasında steroid dozunu plasebodan fazla azaltmadı. Evre IV hastalık ya da WHO sınıf III–IV pulmoner hipertansiyonda akciğer nakline sevk edilir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.o6{animation-name:o6}@keyframes o6{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.o6 .ciz{animation-name:o6c}@keyframes o6c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="563" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="59" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Asemptomatik</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">İZLEM — ilk yıl 3–6 ayda bir semptom + spirometri + DLCO</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,77 L320,92" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="95" width="300" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="121.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Semptomatik, hafif</text><text x="160" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">prednizon 5–10 mg (20 mg ile yanıt sına)</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">ya da yüksek doz inhale steroid · ya da izlem</text><rect x="330" y="95" width="300" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="121.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Ağır / ilerleyici</text><text x="480" y="141.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">hızlı progresyon yok → MTX 15 mg/hafta</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">hızlı → prednizon 20–40 mg + MTX</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,179 L320,194" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="197" width="620" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="223.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">Kanıt</text><text x="320" y="243.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">PREDMETH 2025: MTX = prednizon (FVC, 24. hf)</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">SARCORT 2023: 40 mg, 20 mg’dan üstün değil</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,281 L320,296" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="299" width="300" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="160" y="333.50" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">MTX yetersiz</text><text x="160" y="353.50" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">azatiyoprin · leflunomid · mikofenolat</text><rect x="330" y="299" width="300" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="325.00" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">İkinci basamak da yetersiz</text><text x="480" y="345.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">iki ajan birlikte ya da anti-TNF</text><text x="480" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">infliksimab: FVC +%2,5 (faz 2)</text></g>
<g class="a o5"><path class="ciz" pathLength="1" d="M320,383 L320,398" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="401" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="427.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Son evre</text><text x="320" y="447.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">evre IV fibroz ya da WHO III–IV PH → akciğer nakli sevki</text><text x="320" y="464.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">EFZO-FIT 2026 (efzofitimod): steroid azaltmada plaseboya üstünlük YOK</text></g>
<g class="a o6"><text x="320" y="511" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Hedef: steroidi MTX ile 3–6 ayda, yalnız steroidle ~1 yılda bırakmak.</text><text x="320" y="539" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: UpToDate 2026; Kahlmann 2025 (NEJM); Dhooria 2023 (ERJ); Baughman 2006 (AJRCCM); Culver 2026 (Lancet Respir Med)</text></g>
</svg>
