<g class="a o2"><path class="ciz" pathLength="1" d="M320,128 L320,143" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="146" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="172.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Ayıran öykü</text><text x="320" y="192.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">HP: kuş · küf · tarım — maruziyet sorulmazsa sarkoidoz sanılır</text><text x="320" y="209.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">sarkoidoz: ekstratorasik tutulum, simetrik hiler LAP</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,230 L320,245" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="248" width="620" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320" y="274.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">BAL ne katar? (Welker 2004, 1971 hasta)</text><text x="320" y="294.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">İAH şüphesinde lenfosit %30–50 + düşük granülosit:</text><text x="320" y="311.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">sarkoidoz olasılığı %33,7 → %68,1 · CD4/CD8 sarkoidoz ve HP’de bilgilendirici</text></g>
<g class="a o4"><text x="320" y="358" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">BAL sayımı sık hastalıklarda yol gösterir, nadir hastalıkta olasılığı pek değiştirmez.</text><text x="320" y="386" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: UpToDate (2026); Welker ve ark., Eur Respir J 2004</text></g>
</svg>
