</defs>
<rect width="640" height="495" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Şüphe + herkese temel değerlendirme</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">grafi · tam kan · biyokimya · serum KALSİYUM · EKG</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">göz muayenesi · endemik bölgede IGRA/TDT · maruziyet ve ilaç öyküsü</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="300" height="93" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Biyopsisiz tanı</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">Löfgren (infeksiyon dışlanınca)</text><text x="160" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">Heerfordt · lupus pernio + hiler LAP</text><text x="160" y="192.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">tanı skoru ≥10 (özgüllük &gt;%99)</text><rect x="330" y="112" width="300" height="93" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Asemptomatik evre I</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">biyopsi ↔ yakın izlem eşdeğer</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ortak karar; semptom, sitopeni,</text><text x="480" y="192.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">anormal muayene → biyopsi</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,213 L320,228" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="231" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="257.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Ulaşılabilir lezyon</text><text x="160" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">cilt (EN değil) · periferik LN</text><text x="160" y="294.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">parotis · lakrimal · konjonktiva</text><rect x="330" y="231" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="480" y="257.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Yalnız intratorasik</text><text x="480" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">EBUS-TBNA + eş zamanlı BAL</text><text x="480" y="294.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">tanısızsa → mediastinoskopi / VATS</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,315 L320,330" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="333" width="620" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="359.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Doku + dışlama</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">nekrotizan olmayan granülom + ARB/mantar boya ve kültür</text><text x="320" y="396.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">diğer organlar: WASOG organ değerlendirme aracı</text></g>
<g class="a o5"><text x="320" y="443" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Tanı hiçbir zaman tam kesin değil (ATS 2020): granülom + uyumlu tablo + dışlama.</text><text x="320" y="471" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ATS 2020 (Crouser ve ark.); UpToDate, Clinical manifestations and diagnosis (2026); WASOG 2014</text></g>
</svg>
