<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">GOLD 2026 başlangıç tedavisi</title>
<desc id="d">Tedavi almamış hastada Grup A bir bronkodilatör, Grup B LABA artı LAMA, Grup E LABA artı LAMA alır; kan eozinofili 300 ve üzerindeyse LABA, LAMA ve ICS üçlüsü düşünülür. Tüm hastalara kurtarıcı kısa etkili bronkodilatör yazılır.</desc>
<style>
.a{animation-duration:9s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,18%{opacity:0;transform:translateY(8px)}21%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,18%{stroke-dashoffset:1}23%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,37%{opacity:0;transform:translateY(8px)}40%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,37%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,55%{opacity:0;transform:translateY(8px)}58%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,55%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,74%{opacity:0;transform:translateY(8px)}77%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,74%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="400" fill="#ffffff"/>
<g class="a m s1"><rect x="120" y="20" width="400" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="56" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Yeni başlanan idame (tedavi naif)</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M180,82 L110,120" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M320,82 L320,120" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M460,82 L530,120" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s3"><rect x="15" y="124" width="190" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="110" y="179" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Grup A</text><text x="110" y="199" text-anchor="middle" font-size="13" fill="#064e3b">bir bronkodilatör</text><text x="110" y="219" text-anchor="middle" font-size="13" fill="#064e3b">uzun etkili tercih</text></g><g class="a m s3"><rect x="225" y="124" width="190" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="189" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Grup B</text><text x="320" y="209" text-anchor="middle" font-size="13" fill="#78350f">LABA + LAMA</text></g><g class="a m s4"><rect x="435" y="124" width="190" height="140" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="530" y="169" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Grup E</text><text x="530" y="189" text-anchor="middle" font-size="13" fill="#7f1d1d">LABA + LAMA</text><text x="530" y="209" text-anchor="middle" font-size="13" fill="#7f1d1d">eoz ≥ 300: üçlü</text><text x="530" y="229" text-anchor="middle" font-size="13" fill="#7f1d1d">düşün (+ICS)</text></g><g class="a m s5"><rect x="60" y="290" width="520" height="84" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="327" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Herkese kurtarıcı kısa etkili bronkodilatör</text><text x="320" y="347" text-anchor="middle" font-size="13" fill="#1e3a8a">LABA + ICS teşvik edilmez · astım eşlikse ICS zorunlu</text></g>
</svg>
