<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Erişkin ALL'de tanıdan idameye tedavi akışı</title>
<desc id="d">Tanıda kemik iliği, immünofenotip, sitogenetik ve BCR::ABL1, lomber ponksiyon ve HLA tiplemesi. Ph-negatifte çok ilaçlı indüksiyon, genç erişkinde pediatrik esinli, CD20 pozitifse rituksimab; Ph-pozitifte TKİ ile indüksiyon. Ardından konsolidasyon ve blinatumomab, MRD, SSS profilaksisi ve 2–3 yıl idame. Yüksek risk ya da MRD pozitifliğinde ilk remisyonda allojenik nakil. Nüks ya da dirençte blinatumomab, inotuzumab, CAR-T, T-ALL'de nelarabin ve nakil.</desc>
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}18%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,32%{opacity:0;transform:translateY(8px)}35%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,32%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(8px)}71%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,68%{stroke-dashoffset:1}73%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,84%{opacity:0;transform:translateY(8px)}87%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="620" fill="#ffffff"/>
<g class="a m s1"><rect x="60" y="14" width="520" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="40" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Tanı: ilik ≥%20 lenfoid blast</text><text x="320" y="62" text-anchor="middle" font-size="13" fill="#0f172a">immünofenotip · sitogenetik/FISH · BCR::ABL1</text><text x="320" y="82" text-anchor="middle" font-size="13" fill="#0f172a">lomber ponksiyon · HLA tiplemesi · TLS önlemi</text></g>
<g class="a s2"><path class="a ciz" pathLength="1" d="M220,94 L160,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M420,94 L480,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s2"><rect x="15" y="132" width="295" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Ph-negatif</text><text x="162" y="184" text-anchor="middle" font-size="13" fill="#064e3b">vinkristin + steroid + antrasiklin</text><text x="162" y="204" text-anchor="middle" font-size="13" fill="#064e3b">± asparaginaz, siklofosfamid</text><text x="162" y="224" text-anchor="middle" font-size="13" fill="#064e3b">≤40 yaş pediatrik esinli · CD20+ rituksimab</text></g>
<g class="a m s2"><rect x="330" y="132" width="295" height="120" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Ph-pozitif (~%25)</text><text x="477" y="184" text-anchor="middle" font-size="13" fill="#7f1d1d">TKİ + kemoterapi</text><text x="477" y="204" text-anchor="middle" font-size="13" fill="#7f1d1d">ponatinib imatinibe üstün</text><text x="477" y="224" text-anchor="middle" font-size="13" fill="#7f1d1d">TKİ + steroid + blinatumomab</text></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,252 L320,280" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s3"><rect x="60" y="284" width="520" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="310" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Tam remisyon (erişkinde %80–90) → MRD</text><text x="320" y="334" text-anchor="middle" font-size="13" fill="#78350f">konsolidasyon 6–8 kür + blinatumomab</text><text x="320" y="356" text-anchor="middle" font-size="13" fill="#78350f">SSS profilaksisi (yoksa SSS nüksü ≥%35)</text><text x="320" y="374" text-anchor="middle" font-size="12" fill="#78350f">idame: 6-MP + metotreksat, 2–3 yıl</text></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,384 L320,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s4"><rect x="60" y="416" width="520" height="66" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="442" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Yüksek risk ya da MRD+ → ilk remisyonda allo-nakil</text><text x="320" y="466" text-anchor="middle" font-size="13" fill="#4c1d95">ilk remisyonda nakil %50–60 kür</text></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,482 L320,510" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s5"><rect x="60" y="514" width="520" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="540" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Nüks / direnç</text><text x="320" y="564" text-anchor="middle" font-size="13" fill="#1e3a8a">blinatumomab · inotuzumab · CD19 CAR-T · T-ALL'de nelarabin → nakil</text></g>
<g class="a s6"><text x="320" y="606" text-anchor="middle" font-size="12" fill="#475569">Kaynak: Goldman-Cecil 27 (Walter, Appelbaum); Conn's 2026 (Vale, Hunter).</text></g>
</svg>
