<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">DOAC'ın elektif cerrahi öncesi kesilmesi ve yeniden başlanması</title>
<desc id="d">PAUSE yaklaşımı: düşük ya da orta kanama riskli girişimde DOAC ameliyattan bir gün önce kesilir ve yaklaşık 24 saat sonra başlanır; yüksek kanama riskinde iki gün önce kesilir ve 48 ila 72 saat sonra başlanır. CrCl 30 ila 50 olan dabigatran hastasında kesme bir doz daha erken, düşük riskte iki gün, yüksek riskte dört gün öncedir. Köprüleme yapılmaz ve rutin pıhtılaşma testi gerekmez. Kalp cerrahisinde aralıklar daha uzundur.</desc>
<style>
.a{animation-duration:11s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}18%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,31%{opacity:0;transform:translateY(8px)}34%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,31%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,46%{opacity:0;transform:translateY(8px)}49%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,46%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,61%{opacity:0;transform:translateY(8px)}64%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,61%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,77%{opacity:0;transform:translateY(8px)}80%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,77%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a m s1"><rect x="120" y="20" width="400" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="50" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Elektif girişim · DOAC</text><text x="320" y="70" text-anchor="middle" font-size="13" fill="#0f172a">köprüleme YOK · rutin düzey ölçümü YOK</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M220,90 L150,134" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M420,90 L490,134" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s2"><rect x="15" y="138" width="295" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="188" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Düşük/orta kanama riski</text><text x="162.5" y="208" text-anchor="middle" font-size="13" fill="#064e3b">ameliyattan 1 gün önce kes</text><text x="162.5" y="228" text-anchor="middle" font-size="13" fill="#064e3b">(son doz: −2. gün)</text><text x="162.5" y="248" text-anchor="middle" font-size="13" fill="#064e3b">~24 saat sonra yeniden başla</text></g><g class="a m s3"><rect x="330" y="138" width="295" height="150" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="188" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Yüksek kanama riski</text><text x="477.5" y="208" text-anchor="middle" font-size="13" fill="#7f1d1d">ameliyattan 2 gün önce kes</text><text x="477.5" y="228" text-anchor="middle" font-size="13" fill="#7f1d1d">(son doz: −3. gün)</text><text x="477.5" y="248" text-anchor="middle" font-size="13" fill="#7f1d1d">48–72 saat sonra yeniden başla</text></g><g class="a s4"><path class="a ciz" pathLength="1" d="M320,288 L320,322" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s4"><rect x="40" y="326" width="560" height="104" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="363" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Dabigatran, CrCl 30–50 mL/dk</text><text x="320" y="383" text-anchor="middle" font-size="13" fill="#78350f">düşük/orta riskte 2 gün, yüksek riskte 4 gün önce kes</text><text x="320" y="403" text-anchor="middle" font-size="13" fill="#78350f">Xa inhibitörlerinde CrCl'e göre uzatma yok (CrCl ≥30)</text></g><g class="a s5"><path class="a ciz" pathLength="1" d="M320,430 L320,464" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s5"><rect x="40" y="468" width="560" height="96" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="501" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Kalp cerrahisi (SCA/STS 2026)</text><text x="320" y="521" text-anchor="middle" font-size="13" fill="#4c1d95">normal böbrek ≥2 gün · Xa: CrCl &lt;50 ≥3 gün, &lt;30 ≥4 gün</text><text x="320" y="541" text-anchor="middle" font-size="13" fill="#4c1d95">dabigatran, böbrek yetmezliği: ≥5 gün</text></g><g class="a s6"><text x="320" y="588" text-anchor="middle" font-size="12" fill="#475569">Kaynak: UpToDate (Douketis, Lip; PAUSE); Budd 2026.</text></g>
</svg>
