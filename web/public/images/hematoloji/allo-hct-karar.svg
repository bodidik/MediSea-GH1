<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AML'de allojenik nakil kararı</title>
<desc id="d">Tanıda HLA tiplemesi ve donör araması başlar. İlk tam remisyonda ELN riski ve MRD belirler: iyi riskte konsolidasyon, MRD pozitif seçilmiş gençte nakil; orta riskte konsolidasyon ya da nakil; kötü riskte nakil. Nüks ya da refrakterde önce remisyon, sonra miyeloablatif hazırlıkla nakil. Donör sırası: HLA uyumlu kardeş, uyumlu akraba dışı, haploidentik ya da kordon kanı. Hazırlık: miyeloablatif daha az nüks daha fazla nakil ölümü; MRD pozitifte yararı belirgin; azaltılmış yoğunlukla 80 yaşa kadar nakil.</desc>
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}18%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,32%{opacity:0;transform:translateY(8px)}35%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,32%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(8px)}71%,100%{opacity:1;transform:none}}
.s6{animation-name:s6}@keyframes s6{0%,84%{opacity:0;transform:translateY(8px)}87%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a m s1"><rect x="60" y="14" width="520" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="40" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Tanıda: HLA tiplemesi (hasta, kardeş, ebeveyn, çocuk)</text><text x="320" y="62" text-anchor="middle" font-size="13" fill="#0f172a">kardeş donör yoksa alternatif arama hemen başlar</text></g>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,76 L320,102" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s2"><rect x="60" y="106" width="520" height="44" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="134" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">İlk tam remisyon: ELN riski + MRD</text></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M180,150 L113,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M320,150 L320,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M460,150 L527,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s3"><rect x="15" y="184" width="196" height="104" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="113" y="210" text-anchor="middle" font-size="14" font-weight="800" fill="#064e3b">İyi risk</text><text x="113" y="232" text-anchor="middle" font-size="12" fill="#064e3b">konsolidasyon</text><text x="113" y="252" text-anchor="middle" font-size="12" fill="#064e3b">MRD+ (nüks &gt;%35–40):</text><text x="113" y="272" text-anchor="middle" font-size="12" fill="#064e3b">seçilmiş gençte nakil</text></g>
<g class="a m s3"><rect x="222" y="184" width="196" height="104" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="210" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">Orta risk</text><text x="320" y="232" text-anchor="middle" font-size="12" fill="#78350f">konsolidasyon ya da nakil</text><text x="320" y="252" text-anchor="middle" font-size="12" fill="#78350f">nakil: DFS ~%50, TRM ~%20</text><text x="320" y="272" text-anchor="middle" font-size="12" fill="#78350f">kemoterapi: DFS ~%30</text></g>
<g class="a m s3"><rect x="429" y="184" width="196" height="104" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="527" y="210" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Kötü risk</text><text x="527" y="232" text-anchor="middle" font-size="12" fill="#7f1d1d">ilk remisyonda nakil</text><text x="527" y="252" text-anchor="middle" font-size="12" fill="#7f1d1d">nakil: 4 yıl OS ~%40</text><text x="527" y="272" text-anchor="middle" font-size="12" fill="#7f1d1d">kemoterapi: 5 yıl %15–30</text></g>
<g class="a m s4"><rect x="60" y="306" width="520" height="66" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="332" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Nüks / refrakter: önce remisyon, sonra nakil</text><text x="320" y="356" text-anchor="middle" font-size="13" fill="#1e3a8a">çoğu hastada miyeloablatif hazırlık (güçlü öneri)</text></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,372 L320,398" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s5"><rect x="15" y="402" width="295" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="162" y="428" text-anchor="middle" font-size="14" font-weight="800" fill="#4c1d95">Donör</text><text x="162" y="452" text-anchor="middle" font-size="12" fill="#4c1d95">1. HLA uyumlu kardeş</text><text x="162" y="472" text-anchor="middle" font-size="12" fill="#4c1d95">2. uyumlu akraba dışı (sonuç benzer)</text><text x="162" y="492" text-anchor="middle" font-size="12" fill="#4c1d95">3. haploidentik (PTCy) · kordon kanı</text><text x="162" y="512" text-anchor="middle" font-size="12" fill="#4c1d95">germline yatkınlıkta taşıyıcı akrabadan kaçın</text></g>
<g class="a m s5"><rect x="330" y="402" width="295" height="140" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="477" y="428" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Hazırlık</text><text x="477" y="452" text-anchor="middle" font-size="12" fill="#0f172a">MAC: az nüks, fazla nakil ölümü</text><text x="477" y="472" text-anchor="middle" font-size="12" fill="#0f172a">uzun dönem OS benzer</text><text x="477" y="492" text-anchor="middle" font-size="12" fill="#0f172a">MRD+'da MAC yararı belirgin</text><text x="477" y="512" text-anchor="middle" font-size="12" fill="#0f172a">RIC/NMA ile 80 yaşa kadar</text></g>
<g class="a s6"><text x="320" y="580" text-anchor="middle" font-size="12" fill="#475569">Kaynak: UpToDate (Larson, Uy; Larson); Goldman-Cecil 27 (Walter, Appelbaum).</text></g>
</svg>
