<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KLL: tanıdan tedavi seçimine</title>
<desc id="d">Kronik lenfositik lösemi, olgun görünümlü monoklonal B lenfositlerin kanda, kemik iliğinde ve lenfoid dokularda birikmesidir; erişkinde en sık lösemidir ve tanıda ortanca yaş yaklaşık 70'tir. Tanı için kanda en az üç ay süren 5000/µL ve üzeri klonal B lenfosit ve akım sitometrisinde hafif zincir kısıtlaması, CD19, zayıf CD20, CD23 ve CD5 gerekir; kemik iliği tanı için gerekmez. Rai ve Binet evreleri muayene ve kan sayımına dayanır. Tedavi öncesi FISH ile del(17p), TP53 mutasyonu ve IGHV mutasyon durumu bakılır; del(13q) tek başınaysa iyi, del(17p) ya da TP53 mutasyonunda kemoimmünoterapiye yanıt kötüdür. Belirtisiz erken evrede izlenir; iwCLL aktif hastalık ölçütleri karşılanınca tedavi başlanır: ilerleyici kemik iliği yetmezliği, büyük ya da ilerleyici dalak ve lenf düğümü, iki ayda yüzde 50'den fazla lenfosit artışı ya da altı aydan kısa katlanma süresi, tedaviye dirençli otoimmün sitopeni, belirgin genel belirtiler. Del(17p) ya da TP53 mutasyonunda sürekli akalabrutinib ya da zanubrutinib; IGHV mutasyonlu hastalıkta sabit süreli venetoklaks ile obinutuzumab gibi tedaviler önerilir. Hipogammaglobulinemi enfeksiyonun başlıca nedenidir; tekrarlayan ağır enfeksiyon ve IgG 500'ün altında IVIG verilir. Hastaların yüzde 2 ile 9'unda Richter dönüşümü gelişir; tanı biyopsiyle konur.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
