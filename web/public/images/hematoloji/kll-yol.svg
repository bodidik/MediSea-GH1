çoğu belirtisiz</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ağrısız LAP · dalak</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">hipogamaglobulinemi</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Evre ve genetik</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">Rai / Binet</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">FISH: del(17p) · 11q · 13q</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">TP53 · IGHV durumu</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Belirtisiz erken evre: izle</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#064e3b">erken tedavi sağkalımı uzatmadı</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">iwCLL aktif hastalık</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#7f1d1d">Hb &lt;10 · PLT &lt;100 bin</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#7f1d1d">dalak ≥6 cm · LAP ≥10 cm</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#7f1d1d">LDT &lt;6 ay · B belirtileri</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">İlk tedavi</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#4c1d95">17p/TP53: sürekli BTKİ</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#4c1d95">IGHV mutasyonlu:</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#4c1d95">sabit süreli VenO</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Komplikasyonlar</text><text x="320" y="634.5" text-anchor="middle" font-size="13" fill="#1e3a8a">enfeksiyon: IgG &lt;500 + ağır enfeksiyon → IVIG</text><text x="320" y="654.5" text-anchor="middle" font-size="13" fill="#1e3a8a">OİHA %4–10 · İTP %2–5 · Evans</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Richter dönüşümü (%2–9)</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#7f1d1d">PET/BT'de en yüksek SUV'dan biyopsi</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#7f1d1d">ortanca sağkalım 5–8 ay</text></g>
