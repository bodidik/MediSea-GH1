<rect width="640" height="830" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M260,96 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M380,96 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,266 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,266 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,376 L165,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,376 L477,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,540 L220,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,540 L420,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,684 L320,714" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="53.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">t(9;22) → BCR::ABL1 kinazı</text><text x="320" y="73.5" text-anchor="middle" font-size="13" fill="#0f172a">Ph kromozomu · çoğunlukla p210 · tek risk etkeni radyasyon</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Klinik</text><text x="162.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">yarısına kadarı belirtisiz</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">granülositoz · bazofili</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">splenomegali · yorgunluk</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Tanı</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">karyotip/FISH: t(9;22)</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">PCR: BCR::ABL1</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">kemik iliği: evre</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Evre (ICC)</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#7f1d1d">hızlanmış: blast %10–19 · bazofil ≥%20 · blastik: blast ≥%20</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Düşük risk</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">imatinib</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">ya da 2. kuşak TKİ</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">ya da asiminib</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Yüksek risk</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#4c1d95">2. kuşak TKİ</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#4c1d95">ya da asiminib</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#4c1d95">(erken ilerleme daha az)</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Yanıt: BCR::ABL1 (IS)</text><text x="320" y="634.5" text-anchor="middle" font-size="13" fill="#1e3a8a">3. ay ≤%10 · 6. ay ≤%1 · 12. ay ≤%0,1 olumlu</text><text x="320" y="654.5" text-anchor="middle" font-size="13" fill="#1e3a8a">T315I: ponatinib ya da asiminib 200 mg × 2</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Tedavisiz remisyon</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#064e3b">TKİ ≥3 yıl + derin yanıt ≥2 yıl → kes</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#064e3b">yakın PCR izlemi · yaklaşık yarısı sürdürür</text></g>
</svg>
