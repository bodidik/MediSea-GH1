<rect width="640" height="830" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M260,96 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M380,96 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,266 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,266 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,376 L165,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,376 L477,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,540 L220,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,540 L420,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,684 L320,714" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="53.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Trombosit ≥%30 düşüş / yeni tromboz</text><text x="320" y="73.5" text-anchor="middle" font-size="13" fill="#0f172a">tipik 5–10. gün · son 100 günde heparin varsa &lt;24 saat</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">4Ts 0–3: düşük</text><text x="162.5" y="196.5" text-anchor="middle" font-size="13" fill="#064e3b">HİT riski &lt;%1</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#064e3b">test ve tedavi genelde yok</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#064e3b">ECMO/YBÜ'de seçilmiş test</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">4Ts ≥4: orta/yüksek</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#7f1d1d">tüm heparini kes</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#7f1d1d">terapötik heparin dışı</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#7f1d1d">antikoagülan başla</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Yapma: varfarin · profilaktik trombosit · VKF</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#78350f">varfarini kes, K vitamini ver · yalnız kesmek yetmez (tromboz %53)</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">IgG immün test</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#1e3a8a">negatif → HİT dışlanır</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#1e3a8a">pozitif → klinikle yorumla</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#1e3a8a">OD arttıkça olasılık artar</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Fonksiyonel test</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#4c1d95">SRA / HIPA / MEA</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#4c1d95">doğrulama için</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#4c1d95">uzman merkezde</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">İlaç seçimi</text><text x="320" y="634.5" text-anchor="middle" font-size="13" fill="#1e3a8a">böbrek yetmezliği: argatroban · karaciğer: bivalirudin/danaparoid/fonda</text><text x="320" y="654.5" text-anchor="middle" font-size="13" fill="#1e3a8a">stabil: fondaparinuks ya da DOAC · arteriyel trombozda DOAC'tan kaçın</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Süre ve geçiş</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#064e3b">trombozsuz ≥4 hafta · trombozlu 3 ay</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#064e3b">varfarin: trombosit &gt;150 bin, ≤5 mg, ≥5 gün çakıştır</text></g>
</svg>
