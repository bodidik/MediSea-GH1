<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">HİT şüphesinden tedaviye</title>
<desc id="d">Heparin alan hastada trombosit yüzde 30 ya da daha fazla düşer ya da yeni tromboz gelişirse, özellikle heparinin 4 ile 14. günleri arasında, HİT düşünülür. 4Ts skoru hesaplanır. 0 ile 3 puan düşük olasılıktır, HİT riski yüzde 1'in altındadır; genellikle test ve tedavi gerekmez, yalnız ECMO gibi seçilmiş yoğun bakım hastasında test düşünülür. 4 puan ve üzeri orta ya da yüksek olasılıktır: tüm heparin kaynakları, yıkama solüsyonları dahil, hemen kesilir ve terapötik dozda heparin dışı antikoagülan başlanır; varfarin kesilip K vitaminiyle geri çevrilir; profilaktik trombosit transfüzyonu ve vena kava filtresi kullanılmaz. Yalnız heparini kesmek yetmez: izole HİT'te 30 günlük tromboz riski yüzde 53'tür. Antikor testi yalnız IgG ölçen yüksek duyarlıklı immün testle yapılır; negatifse HİT dışlanır. Pozitif sonuç klinik olasılıkla birlikte yorumlanır; optik dansite yükseldikçe olasılık artar; doğrulama için fonksiyonel trombosit aktivasyon testi kullanılır. Tedavi seçimi: böbrek yetmezliğinde argatroban, karaciğer yetmezliğinde bivalirudin, danaparoid ya da fondaparinuks, stabil hastada fondaparinuks ya da doğrudan oral antikoagülan. Varfarine trombosit 150 binin üstüne çıkınca, düşük dozla ve en az 5 gün çakıştırarak geçilir. Süre: trombozsuz HİT'te en az 4 hafta, trombozlu HİT'te 3 ay.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
