<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Miyeloproliferatif neoplazide genetik yol</title>
<desc id="d">Miyeloproliferatif neoplaziler klonal hematopoetik kök hücre hastalıklarıdır: bir ya da daha fazla myeloid seride çoğalma, olgunlaşması etkili kan sitozu, kemik iliği hiperselülaritesi ya da fibrozu ve splenomegali. Önce BCR::ABL1 sorulur: t(9;22) Philadelphia kromozomu varsa kronik miyeloid lösemi. Philadelphia negatifse sürücü mutasyon: polisitemia verada JAK2 yüzde 100 (ekzon 14 ya da 12); esansiyel trombositemide JAK2 yüzde 60–65, CALR yüzde 20–25, MPL yaklaşık yüzde 3; primer miyelofibrozda JAK2 yüzde 60–65, CALR yüzde 20–25, MPL yaklaşık yüzde 7. Üçü de yoksa üçlü negatif. Diğer MPN'ler: kronik eozinofilik lösemi, kronik nötrofilik lösemi, sınıflanamayan MPN. Ortak riskler: tromboz ve kanama (en çok PV ve ET'de; çok yüksek trombositte edinsel von Willebrand), akut lösemiye dönüşüm, miyelofibroz ya da etkisiz hematopoezle kemik iliği yetmezliği. En sık yakınma yorgunluk.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M220,104 L150,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M420,104 L480,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M480,226 L480,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Klonal kök hücre hastalığı · ilk soru BCR::ABL1</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Myeloid çoğalma · olgun kan sitozu · hiperselüler/fibrotik ilik</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#334155">· splenomegali</text></g>
<g class="a m s2"><rect x="10" y="132" width="280" height="94" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="150" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Ph+ · t(9;22)</text><text x="150" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">→ Kronik miyeloid lösemi</text><text x="150" y="208" text-anchor="middle" font-size="12" fill="#7f1d1d">Granülositik seri baskın</text></g>
<g class="a m s2"><rect x="330" y="132" width="300" height="94" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="480" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Ph negatif</text><text x="480" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">→ sürücü mutasyon:</text><text x="480" y="208" text-anchor="middle" font-size="12" fill="#1e3a8a">JAK2 · CALR · MPL</text></g>
<g class="a m s3"><rect x="10" y="252" width="620" height="200" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Sürücü mutasyon sıklığı</text><text x="40" y="310" font-size="12" font-weight="800" fill="#064e3b">Hastalık</text><text x="250" y="310" font-size="12" font-weight="800" fill="#064e3b">JAK2</text><text x="380" y="310" font-size="12" font-weight="800" fill="#064e3b">CALR</text><text x="510" y="310" font-size="12" font-weight="800" fill="#064e3b">MPL</text><text x="40" y="340" font-size="12" fill="#064e3b">Polisitemia vera</text><text x="250" y="340" font-size="12" fill="#064e3b">%100 (ekzon 14/12)</text><text x="380" y="340" font-size="12" fill="#064e3b">—</text><text x="510" y="340" font-size="12" fill="#064e3b">—</text><text x="40" y="370" font-size="12" fill="#064e3b">Esansiyel trombositemi</text><text x="250" y="370" font-size="12" fill="#064e3b">%60–65</text><text x="380" y="370" font-size="12" fill="#064e3b">%20–25</text><text x="510" y="370" font-size="12" fill="#064e3b">~%3</text><text x="40" y="400" font-size="12" fill="#064e3b">Primer miyelofibroz</text><text x="250" y="400" font-size="12" fill="#064e3b">%60–65</text><text x="380" y="400" font-size="12" fill="#064e3b">%20–25</text><text x="510" y="400" font-size="12" fill="#064e3b">~%7</text><text x="320" y="434" text-anchor="middle" font-size="12" fill="#064e3b">Üçü de yoksa: üçlü negatif</text></g>
<g class="a m s4"><rect x="40" y="472" width="560" height="96" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="500" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Diğer MPN'ler</text><text x="320" y="526" text-anchor="middle" font-size="12" fill="#4c1d95">Kronik eozinofilik lösemi · kronik nötrofilik lösemi</text><text x="320" y="548" text-anchor="middle" font-size="12" fill="#4c1d95">· sınıflanamayan MPN</text></g>
<g class="a m s5"><rect x="40" y="588" width="560" height="158" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="616" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Ortak riskler</text><text x="320" y="642" text-anchor="middle" font-size="12" fill="#78350f">Tromboz ve kanama — en çok PV ve ET'de</text><text x="320" y="664" text-anchor="middle" font-size="12" fill="#78350f">Çok yüksek trombositte edinsel von Willebrand → kanama</text><text x="320" y="686" text-anchor="middle" font-size="12" fill="#78350f">Splanknik ven trombozu gizli PV'nin ilk bulgusu olabilir</text><text x="320" y="708" text-anchor="middle" font-size="12" fill="#78350f">Akut lösemiye dönüşüm · miyelofibrozla ilik yetmezliği</text><text x="320" y="730" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">En sık yakınma: yorgunluk (PV %85 · ET %72 · PMF %84)</text></g>
</svg>
