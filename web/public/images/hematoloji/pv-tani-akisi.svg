<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Eritrositozda polisitemia vera tanı akışı (UpToDate, Conn's 2026)</title>
<desc id="d">Kalıcı yüksek hemoglobin ya da hematokrit ve satürasyon yüzde 92'nin üstünde: JAK2 V617F ve serum EPO. V617F var ve EPO düşük: PV, kemik iliği şart değil. V617F var, EPO normal: PV olası, öteki MPN'lerden ayırmak için kemik iliği. V617F yok, EPO düşük: JAK2 ekzon 12; yoksa kemik iliği ya da konjenital polisitemi. V617F yok, EPO normal ya da yüksek: PV değil, sekonder neden araştır.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="78" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="40" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Kalıcı Hb &gt;16,5 / &gt;16,0 g/dL</text><text x="320" y="58" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">ya da Hct &gt;%49 / &gt;%48 · SpO2 &gt;%92</text><text x="320" y="76" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">→ JAK2 V617F + serum EPO</text></g><g class="a" style="animation-delay:2.40s"><line x1="200" y1="92" x2="110" y2="132" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="280" y1="92" x2="260" y2="132" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="360" y1="92" x2="380" y2="132" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="440" y1="92" x2="530" y2="132" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/></g><g class="a" style="animation-delay:4.80s"><rect x="14" y="134" width="146" height="92" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="87" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">V617F + EPO ↓</text><text x="87" y="176" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">PV</text><text x="87" y="194" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Kemik iliği</text><text x="87" y="212" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">şart değil</text><rect x="170" y="134" width="146" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="243" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">V617F + EPO N</text><text x="243" y="176" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">PV olası</text><text x="243" y="194" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Kemik iliği</text><text x="243" y="212" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">(öteki MPN?)</text><rect x="326" y="134" width="146" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="399" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">V617F yok</text><text x="399" y="176" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">EPO ↓</text><text x="399" y="194" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">→ JAK2</text><text x="399" y="212" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">ekzon 12</text><rect x="482" y="134" width="146" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="555" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">V617F yok</text><text x="555" y="176" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">EPO N / ↑</text><text x="555" y="194" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">PV değil</text><text x="555" y="212" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">→ sekonder neden</text></g><g class="a" style="animation-delay:7.20s"><line x1="399" y1="226" x2="399" y2="262" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="250" y="264" width="300" height="78" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="400" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Ekzon 12 yoksa</text><text x="400" y="308" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Kemik iliği · konjenital polisitemi?</text><text x="400" y="326" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">3 ay sonra Hb ve EPO'yu yinele</text></g><g class="a" style="animation-delay:9.60s"><line x1="555" y1="226" x2="555" y2="362" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="380" y="364" width="248" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="504" y="398" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Sekonder nedenler</text><text x="504" y="416" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Hipoksi: akciğer, şant, uyku apnesi</text><text x="504" y="434" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Sigara, CO, yüksek irtifa</text><text x="504" y="452" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">EPO salgılayan tümör, testosteron</text></g><g class="a" style="animation-delay:12.00s"><rect x="14" y="364" width="350" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="189" y="398" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Uyarı</text><text x="189" y="416" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Budd-Chiari / splanknik trombozda</text><text x="189" y="434" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">sayımlar normal görünse de</text><text x="189" y="452" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">PV'yi ara (özellikle genç kadın)</text></g><g class="a" style="animation-delay:14.40s"><rect x="14" y="492" width="614" height="54" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="321" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Tanı: 3 majör ya da ilk 2 majör + düşük EPO (ICC 2022 = WHO 5)</text></g>
</svg>
