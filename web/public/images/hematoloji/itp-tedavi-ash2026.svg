<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Erişkin primer İTP tedavisi: ASH 2026</title>
<desc id="d">Erişkin primer İTP'de tedavinin amacı trombosit sayısını normale çıkarmak değil, kanamayı önlemek ve yaşam kalitesini korumaktır. Kanaması olmayan ve trombosit sayısı 30 binin üstündeki yeni tanılı hasta genellikle hastaneye yatırılmaz. Kritik kanamada trombosit transfüzyonu, IVIG 1 g/kg, yüksek doz kortikosteroid, traneksamik asit ve trombopoietin reseptör agonisti birlikte verilir; yanıt yoksa acil splenektomi düşünülür. Başlangıç tedavisi gereken hastada ASH 2026, kortikosteroide rituksimab ya da trombopoietik ajan eklenmesini önerir; bu ikisi yoksa tek başına kortikosteroid. Kortikosteroid 6 haftayı geçmemelidir; tanı belirsizse önce 2 haftalık kısa kür yapılabilir. Kortikosteroid sonrası ek tedavi gereken hastada trombopoietik ajan güçlü öneriyle, rituksimab koşullu öneriyle önerilir; bunları alamayan ya da istemeyen hastada BTK inhibitörü, mikofenolat ya da SYK inhibitörü, en sonda azatiyoprin. Yanıt yetersizliği ya da yan etkide başka bir trombopoietik ajana geçilebilir. Splenektomi remisyon olasılığı nedeniyle mümkünse tanıdan en az bir yıl ertelenir; öncesinde aşılar en az iki hafta önce yapılır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
