<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Warfarin mi DOAC mı: karar basamakları</title>
<desc id="d">Mekanik kalp kapağı, orta-ağır romatizmal mitral stenoz ya da yüksek riskli antifosfolipid sendromu varsa warfarin kullanılır. Yoksa çoğu AF ve VTE hastasında DOAC tercih edilir. Gastrointestinal kanama riski yüksekse apiksaban ya da dabigatran; CrCl 25–30'un altındaysa genellikle apiksaban, bazı hastalarda warfarin; maliyet ya da doza uyum sorunu varsa warfarin makuldür.</desc>
<style>
.a{animation-duration:11s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,18%{opacity:0;transform:translateY(8px)}21%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,18%{stroke-dashoffset:1}23%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,38%{opacity:0;transform:translateY(8px)}41%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,38%{stroke-dashoffset:1}43%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,58%{opacity:0;transform:translateY(8px)}61%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,58%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,78%{opacity:0;transform:translateY(8px)}81%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a m s1"><rect x="70" y="16" width="500" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">DOAC'ın kullanılmadığı durum var mı?</text><text x="320" y="68" text-anchor="middle" font-size="13" fill="#0f172a">mekanik kapak · orta-ağır romatizmal mitral stenoz</text><text x="320" y="88" text-anchor="middle" font-size="13" fill="#0f172a">yüksek riskli (üçlü pozitif) APS · DOAC'la bağdaşmayan etkileşim</text></g>
<g class="a s2"><path class="a ciz" pathLength="1" d="M210,108 L150,150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M430,108 L490,150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s2"><rect x="20" y="154" width="270" height="96" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="155" y="188" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">EVET → warfarin</text><text x="155" y="212" text-anchor="middle" font-size="13" fill="#7f1d1d">INR izlemiyle</text><text x="155" y="232" text-anchor="middle" font-size="12" fill="#7f1d1d">RE-ALIGN · TRAPS</text></g>
<g class="a m s2"><rect x="350" y="154" width="270" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="485" y="188" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">HAYIR → DOAC</text><text x="485" y="212" text-anchor="middle" font-size="13" fill="#064e3b">çoğu AF ve VTE hastası</text><text x="485" y="232" text-anchor="middle" font-size="12" fill="#064e3b">hemorajik inme RR 0,49</text></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M485,250 L485,284" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s3"><rect x="40" y="288" width="580" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="330" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">DOAC seçerken hastaya bak</text><text x="330" y="344" text-anchor="middle" font-size="13" fill="#78350f">Gİ kanama riski yüksek → apiksaban ya da dabigatran</text><text x="330" y="368" text-anchor="middle" font-size="13" fill="#78350f">CrCl &lt;25–30 → genellikle apiksaban (bazen warfarin)</text><text x="330" y="392" text-anchor="middle" font-size="13" fill="#78350f">ağır dispepsi → dabigatrandan kaçın</text><text x="330" y="416" text-anchor="middle" font-size="13" fill="#78350f">BMI &gt;40 ya da &gt;120 kg (VTE) → apiksaban ya da rivaroksaban</text></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M330,438 L330,464" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s4"><rect x="40" y="468" width="580" height="56" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="330" y="502" text-anchor="middle" font-size="13" fill="#4c1d95">maliyet ya da doz uyumu sorunu → warfarin makul</text></g>
<g class="a s5"><text x="320" y="548" text-anchor="middle" font-size="12" fill="#475569">Kaynak: UpToDate (Manning, Singer, Lip; Leung); Elsevier ilaç bilgisi.</text></g>
</svg>
