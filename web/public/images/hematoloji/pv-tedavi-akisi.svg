<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Polisitemia vera tedavi akışı (UpToDate, Conn's 2026, NICE 2023)</title>
<desc id="d">Bütün hastalar: hematokrit yüzde 45'in altında, düşük doz aspirin, kardiyovasküler risk kontrolü. Düşük risk (60 yaş ve altı, tromboz yok): flebotomi ve aspirin; belirti, splenomegali ya da flebotomi yükünde interferon. Yüksek risk (60 yaş üstü ya da tromboz): hidroksiüre ya da interferon; gebelik olasılığında interferon; venöz trombozda antikoagülasyon. Direnç ya da intoleransta öteki ilaca geç; ikisine de yanıtsızlıkta ruksolitinib ya da yaşlıda busulfan.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="70" y="14" width="500" height="96" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="40" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Bütün hastalar</text><text x="320" y="58" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Hematokrit &lt;%45 (Grade 1B)</text><text x="320" y="76" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Düşük doz aspirin 40–100 mg/gün (Grade 2C)</text><text x="320" y="94" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Sigara, KB, lipit, kilo kontrolü</text></g><g class="a" style="animation-delay:2.40s"><line x1="220" y1="110" x2="160" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="420" y1="110" x2="480" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/></g><g class="a" style="animation-delay:4.80s"><rect x="14" y="152" width="300" height="110" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="164" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Düşük risk</text><text x="164" y="203" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">≤60 yaş (Conn's: &lt;60), tromboz yok</text><text x="164" y="221" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Flebotomi + aspirin</text><text x="164" y="239" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Yük/belirti → interferon</text><rect x="326" y="152" width="300" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="476" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Yüksek risk</text><text x="476" y="203" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">&gt;60 yaş (Conn's: ≥60) ya da tromboz</text><text x="476" y="221" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Hidroksiüre ya da interferon</text><text x="476" y="239" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Gebelik olasılığı → interferon</text></g><g class="a" style="animation-delay:7.20s"><line x1="476" y1="262" x2="476" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="326" y="292" width="300" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="476" y="323" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Venöz tromboz öyküsü</text><text x="476" y="341" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Sitoredüksiyon + antikoagülasyon</text></g><g class="a" style="animation-delay:9.60s"><line x1="320" y1="380" x2="320" y2="404" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="70" y="406" width="500" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="430" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Direnç ya da intolerans (ELN)</text><text x="320" y="448" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Hidroksiüre → interferon · interferon → hidroksiüre</text><text x="320" y="466" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Ruksolitinib: HU direnci/intoleransı (NICE, FDA)</text><text x="320" y="484" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">UpToDate: ikisine yanıtsızda · yaşlıda busulfan</text></g><g class="a" style="animation-delay:12.00s"><rect x="14" y="514" width="612" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="545" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Kaçın</text><text x="320" y="563" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Flebotomide demir · klorambusil, 32P, pipobroman · anagrelid</text></g>
</svg>
