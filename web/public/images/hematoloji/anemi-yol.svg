<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Anemide yol: MCV ve retikülosit</title>
<desc id="d">Anemi: hemoglobin erkekte yaklaşık 130 g/L, kadında 115 g/L altında. İlk eksen MCV: mikrositik (MCV 78 fL altı, hipokrom MCH 26 pg altı) demir eksikliği ve talasemi; normositik ve normokrom akut kan kaybı, çoğu hemolitik anemi, kronik hastalık anemisi (hafif mikrositoz olabilir) ve kemik iliği yetmezliği; makrositik (MCV 98 fL üstü) megaloblastik anemiler ve miyelodisplazi. İkinci eksen retikülosit: iliğin üretimi artınca retikülosit yüzde 1'in ya da 100×10⁹/L'nin üstüne çıkar; akut kanama sonrası toparlanma ve hemolitik anemide. Retikülosit yanıtının olmaması üretim yetersizliğini gösterir. Hemolitik anemide eritrosit ömrü 120 günden 1 günün altına inebilir; normositik anemi, yüksek retikülosit, hiperbilirubinemi ve yüksek LDH tipiktir. Demir eksikliği dünyada en sık anemi nedeni ve en sık mikrositik hipokrom tablodur; genellikle kronik kan kaybını, sıklıkla gizli sindirim kanalı kanamasını gösterir. Megaloblastik anemiler demir eksikliği ve kronik hastalık anemisinden sonra en sık; nörolojik tutulum yalnız B12 eksikliğinde. Aplastik anemi: kemik iliği hipoplazisine bağlı pansitopeni.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a m s1"><rect x="40" y="14" width="560" height="74" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Anemi: Hb erkekte &lt;~130 g/L · kadında &lt;~115 g/L</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">İlk eksen MCV, ikinci eksen retikülosit</text></g>
<g class="a m s2"><rect x="10" y="104" width="200" height="250" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="110" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">Mikrositik</text><text x="110" y="154" text-anchor="middle" font-size="12" fill="#78350f">MCV &lt;78 fL</text><text x="110" y="172" text-anchor="middle" font-size="12" fill="#78350f">MCH &lt;26 pg</text><text x="110" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Demir eksikliği</text><text x="110" y="222" text-anchor="middle" font-size="11" fill="#78350f">dünyada en sık neden;</text><text x="110" y="238" text-anchor="middle" font-size="11" fill="#78350f">gizli GİS kanaması ara</text><text x="110" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Talasemi</text></g>
<g class="a m s2"><rect x="220" y="104" width="200" height="250" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Normositik</text><text x="320" y="154" text-anchor="middle" font-size="12" fill="#1e3a8a">MCV ve MCH normal</text><text x="320" y="186" text-anchor="middle" font-size="12" fill="#1e3a8a">Akut kan kaybı</text><text x="320" y="206" text-anchor="middle" font-size="12" fill="#1e3a8a">Çoğu hemolitik anemi</text><text x="320" y="226" text-anchor="middle" font-size="12" fill="#1e3a8a">Kronik hastalık anemisi</text><text x="320" y="242" text-anchor="middle" font-size="11" fill="#1e3a8a">(hafif mikrositoz olabilir)</text><text x="320" y="264" text-anchor="middle" font-size="12" fill="#1e3a8a">Kemik iliği yetmezliği</text></g>
<g class="a m s2"><rect x="430" y="104" width="200" height="250" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="530" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#4c1d95">Makrositik</text><text x="530" y="154" text-anchor="middle" font-size="12" fill="#4c1d95">MCV &gt;98 fL</text><text x="530" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Megaloblastik</text><text x="530" y="204" text-anchor="middle" font-size="11" fill="#4c1d95">B12 · folat</text><text x="530" y="222" text-anchor="middle" font-size="11" fill="#4c1d95">nöropati yalnız B12'de</text><text x="530" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Miyelodisplazi</text></g>
<g class="a m s3"><rect x="40" y="372" width="560" height="170" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Retikülosit</text><text x="320" y="426" text-anchor="middle" font-size="12" fill="#064e3b">Artmış üretim: retikülosit &gt;%1 ya da &gt;100×10⁹/L</text><text x="320" y="448" text-anchor="middle" font-size="12" fill="#064e3b">→ akut kanama sonrası toparlanma · hemolitik anemi</text><text x="320" y="478" text-anchor="middle" font-size="12" fill="#064e3b">Retikülosit yanıtı yok → üretim yetersizliği</text><text x="320" y="500" text-anchor="middle" font-size="12" fill="#064e3b">(hematinik eksikliği, kronik hastalık, kemik iliği yetmezliği)</text></g>
<g class="a m s4"><rect x="40" y="558" width="560" height="188" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="586" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Hemoliz ve ilik yetmezliği</text><text x="320" y="612" text-anchor="middle" font-size="12" fill="#7f1d1d">Hemoliz: eritrosit ömrü 120 günden &lt;1 güne inebilir</text><text x="320" y="634" text-anchor="middle" font-size="12" fill="#7f1d1d">Normositik + retikülosit ↑ + hiperbilirubinemi + LDH ↑</text><text x="320" y="656" text-anchor="middle" font-size="12" fill="#7f1d1d">Kalıtsal: orak hücre, talasemi, sferositoz</text><text x="320" y="676" text-anchor="middle" font-size="12" fill="#7f1d1d">Edinsel: otoimmün, sıtma, mikroanjiyopatik</text><text x="320" y="710" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Aplastik anemi: ilik hipoplazisine bağlı pansitopeni</text></g>
</svg>
