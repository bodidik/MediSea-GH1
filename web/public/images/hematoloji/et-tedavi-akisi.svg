<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Esansiyel trombositemide riske göre tedavi (revize IPSET-tromboz; UpToDate ve Tefferi 2024)</title>
<desc id="d">Revize IPSET-tromboz: çok düşük risk (60 yaş ve altı, tromboz yok, JAK2 yabani) izlem ya da aspirin; düşük risk (JAK2 mutant) aspirin, belirti sürerse günde iki doz; orta risk (60 yaş üstü, JAK2 yabani) aspirin ya da aspirin ve hidroksiüre; yüksek risk (tromboz öyküsü ya da 60 yaş üstü JAK2 mutant) sitoredüksiyon ve aspirin: 40 yaş ve üstünde hidroksiüre, 40 yaş altında ya da gebelik olasılığında interferon. Arteriyel tromboz öyküsünde günde iki doz aspirin, venöz trombozda antikoagülasyon. Trombosit 1 milyonun üstündeyse aspirinden önce edinsel von Willebrand.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="620" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Revize IPSET-tromboz</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Yaş &gt;60 · tromboz öyküsü · JAK2 mutasyonu</text></g><g class="a" style="animation-delay:2.40s"><line x1="200" y1="76" x2="85" y2="112" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="270" y1="76" x2="245" y2="112" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="370" y1="76" x2="395" y2="112" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="440" y1="76" x2="555" y2="112" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/></g><g class="a" style="animation-delay:4.80s"><rect x="14" y="114" width="146" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="87" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Çok düşük</text><text x="87" y="166" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">≤60 · JAK2 yok</text><text x="87" y="184" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">İzlem ya da</text><text x="87" y="202" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">aspirin</text><rect x="170" y="114" width="146" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="243" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Düşük</text><text x="243" y="166" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">≤60 · JAK2 var</text><text x="243" y="184" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Aspirin; sürerse</text><text x="243" y="202" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">günde iki doz</text><rect x="326" y="114" width="146" height="112" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="399" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Orta</text><text x="399" y="166" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">&gt;60 · JAK2 yok</text><text x="399" y="184" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Aspirin ya da</text><text x="399" y="202" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">aspirin + HU</text><rect x="482" y="114" width="146" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="555" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Yüksek</text><text x="555" y="166" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Tromboz ya da</text><text x="555" y="184" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">&gt;60 + JAK2</text><text x="555" y="202" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Sitoredüksiyon</text></g><g class="a" style="animation-delay:7.20s"><line x1="555" y1="226" x2="470" y2="262" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="555" y1="226" x2="600" y2="262" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="330" y="264" width="150" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="405" y="297" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">≥40 yaş</text><text x="405" y="315" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Hidroksiüre</text><text x="405" y="333" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">+ aspirin</text><rect x="490" y="264" width="138" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="559" y="297" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">&lt;40 ya da</text><text x="559" y="315" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">gebelik olasılığı</text><text x="559" y="333" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Interferon</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="264" width="300" height="92" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="164" y="297" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Tromboz öyküsü</text><text x="164" y="315" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Arteriyel: günde iki doz aspirin</text><text x="164" y="333" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Venöz: antikoagülasyon</text></g><g class="a" style="animation-delay:12.00s"><rect x="14" y="376" width="614" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="321" y="411" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Hidroksiüreye direnç ya da intolerans</text><text x="321" y="429" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">UpToDate: interferon · Tefferi 2024: peg-interferon ya da busulfan</text></g><g class="a" style="animation-delay:14.40s"><rect x="14" y="474" width="614" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="321" y="501" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Trombosit &gt;1.000.000/µL ya da kanama</text><text x="321" y="519" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Aspirinden önce ristosetin kofaktörü (edinsel vWS)</text></g><g class="a" style="animation-delay:16.80s"><rect x="14" y="556" width="614" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="321" y="588" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Kaçın: anagrelid birinci basamakta değil · gebelikte hidroksiüre ve anagrelid</text></g>
</svg>
