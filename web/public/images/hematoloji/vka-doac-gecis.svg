<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Oral antikoagülanlar arasında geçiş</title>
<desc id="d">Warfarinden DOAC'a: warfarin kesilir, INR izlenir; dabigatran ve apiksaban INR 2'nin altında, edoksaban 2,5 ve altında, rivaroksaban 3'ün altında başlanır. DOAC'tan warfarine: dabigatranda böbrek işlevine göre 3, 2 ya da 1 gün örtüşme; apiksaban ve rivaroksabanda parenteral köprü ya da oral örtüşme; edoksabanda doz yarıya indirilip warfarin eklenir, INR iki gün en az 2 olunca edoksaban kesilir. DOAC'tan başka DOAC'a örtüşme yoktur.</desc>
<style>
.a{animation-duration:11s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}18%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,35%{opacity:0;transform:translateY(8px)}38%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,35%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,55%{opacity:0;transform:translateY(8px)}58%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,55%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,75%{opacity:0;transform:translateY(8px)}78%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="640" fill="#ffffff"/>
<g class="a m s1"><rect x="120" y="16" width="400" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Oral antikoagülan geçişi</text><text x="320" y="64" text-anchor="middle" font-size="13" fill="#0f172a">amaç: boşluk yok · üst üste binme yok</text></g>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,78 L320,104" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s2"><rect x="30" y="108" width="580" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Warfarin → DOAC: warfarini kes, INR'yi izle</text><text x="320" y="164" text-anchor="middle" font-size="13" fill="#064e3b">dabigatran · apiksaban: INR &lt;2 olunca başla</text><text x="320" y="186" text-anchor="middle" font-size="13" fill="#064e3b">edoksaban: INR ≤2,5 olunca başla</text><text x="320" y="208" text-anchor="middle" font-size="13" fill="#064e3b">rivaroksaban: INR &lt;3 olunca başla</text><text x="320" y="236" text-anchor="middle" font-size="12" fill="#064e3b">warfarin etkisinin kaybolması birkaç gün sürer</text></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,258 L320,284" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s3"><rect x="30" y="288" width="580" height="190" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">DOAC → warfarin: ÖRTÜŞME gerekir</text><text x="320" y="344" text-anchor="middle" font-size="13" fill="#78350f">dabigatran: CrCl ≥50 → 3 gün · 30–50 → 2 gün · 15–30 → 1 gün</text><text x="320" y="370" text-anchor="middle" font-size="13" fill="#78350f">apiksaban · rivaroksaban: parenteral köprü (prospektüs)</text><text x="320" y="390" text-anchor="middle" font-size="13" fill="#78350f">ya da INR terapötik olana dek oral örtüşme (ASH)</text><text x="320" y="416" text-anchor="middle" font-size="13" fill="#78350f">edoksaban: dozu yarıya indir + warfarin;</text><text x="320" y="436" text-anchor="middle" font-size="13" fill="#78350f">INR iki gün ≥2 olunca edoksabanı kes</text><text x="320" y="462" text-anchor="middle" font-size="12" fill="#78350f">INR'yi sıradaki DOAC dozundan hemen önce ölç</text></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,478 L320,504" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s4"><rect x="30" y="508" width="580" height="86" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="536" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">DOAC → DOAC (ya da LMWH): örtüşme YOK</text><text x="320" y="562" text-anchor="middle" font-size="13" fill="#4c1d95">yenisini, eskisinin sıradaki doz saatinde başlat</text><text x="320" y="582" text-anchor="middle" font-size="12" fill="#4c1d95">akut VTE: dabigatran ve edoksaban 5–10 gün parenteral tedaviden sonra</text></g>
<g class="a s5"><text x="320" y="622" text-anchor="middle" font-size="12" fill="#475569">Kaynak: UpToDate (Leung; Manning, Singer, Lip); prospektüsler, ASH 2018.</text></g>
</svg>
