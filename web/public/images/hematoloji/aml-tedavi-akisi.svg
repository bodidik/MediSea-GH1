<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Erişkin AML'de tanıdan remisyon sonrasına tedavi akışı</title>
<desc id="d">Tanıda kemik iliği, immünofenotip, sitogenetik ve hızlı FLT3, NPM1, IDH testleri; APL şüphesinde hemen ATRA. Yoğun tedaviye uygun hastada 7+3; FLT3 mutasyonunda midostaurin ya da quizartinib, CD33 pozitif iyi riskte gemtuzumab, yaşlıda tedaviyle ilişkili ya da miyelodisplaziyle ilişkili AML'de CPX-351. Uygun olmayan hastada HMA ile venetoklaks, IDH1 mutasyonunda azasitidin ile ivosidenib. Tam remisyonda ELN riski ve MRD'ye göre: iyi riskte konsolidasyon, orta riskte konsolidasyon ya da nakil, kötü riskte allojenik nakil; nakil olamayan 55 yaş üstü orta ya da kötü riskte oral azasitidin idamesi.</desc>
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}18%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,32%{opacity:0;transform:translateY(8px)}35%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,32%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(8px)}71%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,68%{stroke-dashoffset:1}73%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,84%{opacity:0;transform:translateY(8px)}87%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="640" fill="#ffffff"/>
<g class="a m s1"><rect x="60" y="14" width="520" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="40" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Tanı: ilik/kan blast ≥%20 (tanımlayıcı genetikte daha az)</text><text x="320" y="62" text-anchor="middle" font-size="13" fill="#0f172a">immünofenotip · sitogenetik · hızlı FLT3 / NPM1 / IDH</text><text x="320" y="82" text-anchor="middle" font-size="13" fill="#b91c1c">APL şüphesi → doğrulama beklemeden ATRA</text></g>
<g class="a s2"><path class="a ciz" pathLength="1" d="M220,94 L160,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M420,94 L480,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s2"><rect x="15" y="132" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162" y="158" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Yoğun tedaviye uygun</text><text x="162" y="182" text-anchor="middle" font-size="13" fill="#064e3b">7+3: sitarabin 7 gün + antrasiklin 3 gün</text><text x="162" y="202" text-anchor="middle" font-size="13" fill="#064e3b">FLT3: midostaurin / quizartinib (ITD)</text><text x="162" y="222" text-anchor="middle" font-size="13" fill="#064e3b">CD33+ iyi risk: gemtuzumab</text><text x="162" y="242" text-anchor="middle" font-size="13" fill="#064e3b">yaşlı t-AML / AML-MR: CPX-351</text></g>
<g class="a m s2"><rect x="330" y="132" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477" y="158" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Yoğun tedaviye uygun değil</text><text x="477" y="182" text-anchor="middle" font-size="13" fill="#7f1d1d">HMA + venetoklaks</text><text x="477" y="202" text-anchor="middle" font-size="13" fill="#7f1d1d">IDH1: azasitidin + ivosidenib</text><text x="477" y="222" text-anchor="middle" font-size="13" fill="#7f1d1d">risk: ELN 2024 düşük yoğunluk</text><text x="477" y="242" text-anchor="middle" font-size="13" fill="#7f1d1d">kırılganda destek bakımı</text></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M162,262 L162,290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s3"><rect x="15" y="294" width="610" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="320" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Nadir iliği (14–22. gün) → tam remisyon %60–80</text><text x="320" y="344" text-anchor="middle" font-size="13" fill="#78350f">hiposelüler değil ya da blast ≥%5 → yeniden indüksiyon</text><text x="320" y="362" text-anchor="middle" font-size="12" fill="#78350f">remisyonda MRD (akım sitometri / qPCR)</text></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M160,370 L110,400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M320,370 L320,400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M480,370 L530,400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s4"><rect x="15" y="404" width="196" height="104" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="113" y="430" text-anchor="middle" font-size="14" font-weight="800" fill="#064e3b">İyi risk</text><text x="113" y="452" text-anchor="middle" font-size="12" fill="#064e3b">konsolidasyon</text><text x="113" y="472" text-anchor="middle" font-size="12" fill="#064e3b">MRD+ seçilmiş gençte</text><text x="113" y="490" text-anchor="middle" font-size="12" fill="#064e3b">nakil seçenek</text></g>
<g class="a m s4"><rect x="222" y="404" width="196" height="104" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="430" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">Orta risk</text><text x="320" y="452" text-anchor="middle" font-size="12" fill="#78350f">konsolidasyon ya da</text><text x="320" y="472" text-anchor="middle" font-size="12" fill="#78350f">allojenik nakil —</text><text x="320" y="490" text-anchor="middle" font-size="12" fill="#78350f">bireysel karar</text></g>
<g class="a m s4"><rect x="429" y="404" width="196" height="104" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="527" y="430" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Kötü risk</text><text x="527" y="452" text-anchor="middle" font-size="12" fill="#7f1d1d">ilk remisyonda</text><text x="527" y="472" text-anchor="middle" font-size="12" fill="#7f1d1d">allojenik nakil</text><text x="527" y="490" text-anchor="middle" font-size="12" fill="#7f1d1d">(CR1'de kür %50–60)</text></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,508 L320,536" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s5"><rect x="60" y="540" width="520" height="66" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="566" text-anchor="middle" font-size="14" font-weight="800" fill="#4c1d95">Nakil olmayan ≥55 yaş, orta/kötü risk: oral azasitidin</text><text x="320" y="588" text-anchor="middle" font-size="13" fill="#4c1d95">FLT3 inhibitörü alan: idamede sürdür</text></g>
<g class="a s6"><text x="320" y="628" text-anchor="middle" font-size="12" fill="#475569">Kaynak: Goldman-Cecil 27 (Walter, Appelbaum); UpToDate (Larson, Uy); ELN 2024.</text></g>
</svg>
