<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ADPKD: tanıdan tedaviye (KDIGO 2025)</title>
<desc id="d">Aile öyküsü varsa ultrasonla tanı: 15–39 yaşta toplam en az 3 kist, 40–59 yaşta her böbrekte en az 2, 60 yaş üstünde her böbrekte en az 4. 16–40 yaşta MR'da toplam 10 ya da daha fazla kist. Aile öyküsü yoksa her böbrekte en az 10 kist (5 mm ve üzeri) ve mümkünse genetik test. Herkese: ev ölçümüyle 18–49 yaşta ve KBH G1–G2'de kan basıncı 110/75 ya da altı (tolere edilirse); 50 yaş üstü ya da G3–G5'te ofis sistolik 120 altı. Günde en az 2–3 litre su (eGFR 30 ve üzeri), sodyum günde 2 g altı, protein 0,8–1 g/kg. Hızlı ilerleme riski Mayo görüntüleme sınıfıyla: boya göre düzeltilmiş toplam böbrek hacmi yıllık büyümesi 1A yüzde 1,5 altı, 1B 1,5–3, 1C 3–4,5, 1D 4,5–6, 1E 6 üstü; yalnız tipik (sınıf 1) görüntülemede geçerli. Belirsizse PROPKD 6 üstü ek kanıt. Hızlı ilerleme riski olan ve eGFR 25 ve üzeri erişkinde tolvaptan: 45 mg uyanınca, 15 mg 8 saat sonra, titre edilir; ilk 18 ay her ay, sonra 3 ayda bir karaciğer testleri. Kist enfeksiyonunda 4–6 hafta, mümkünse lipitte çözünen antibiyotik. Kişisel subaraknoid kanama öyküsü ya da ailede anevrizma, subaraknoid kanama ya da açıklanamayan ani ölümde intrakraniyal anevrizma taraması.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,176 L320,200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,346 L320,370" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,540 L320,564" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="162" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Tanı</text><text x="320" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Aile öyküsü var — ultrason</text><text x="320" y="90" text-anchor="middle" font-size="12" fill="#334155">15–39 yaş: toplam ≥3 kist · 40–59: her böbrekte ≥2 · 60+: her böbrekte ≥4</text><text x="320" y="112" text-anchor="middle" font-size="12" fill="#334155">16–40 yaş MR: toplam ≥10 kist</text><text x="320" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Aile öyküsü yok</text><text x="320" y="160" text-anchor="middle" font-size="12" fill="#334155">Her böbrekte ≥10 kist (≥5 mm) + mümkünse genetik test</text></g>
<g class="a m s2"><rect x="40" y="202" width="560" height="144" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Herkese</text><text x="320" y="256" text-anchor="middle" font-size="12" fill="#1e3a8a">KB: 18–49 yaş, G1–G2 → ev ölçümüyle ≤110/75 (tolere edilirse)</text><text x="320" y="278" text-anchor="middle" font-size="12" fill="#1e3a8a">≥50 yaş ya da G3–G5 → ofis sistolik &lt;120</text><text x="320" y="302" text-anchor="middle" font-size="12" fill="#1e3a8a">Su ≥2–3 L/gün (eGFR ≥30) · sodyum &lt;2 g/gün</text><text x="320" y="324" text-anchor="middle" font-size="12" fill="#1e3a8a">Protein 0,8–1 g/kg/gün</text></g>
<g class="a m s3"><rect x="40" y="372" width="560" height="168" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Hızlı ilerleme riski: Mayo sınıfı (htTKV)</text><text x="320" y="426" text-anchor="middle" font-size="12" fill="#78350f">Yıllık büyüme: 1A &lt;%1,5 · 1B %1,5–3 · 1C %3–4,5</text><text x="320" y="448" text-anchor="middle" font-size="12" fill="#78350f">1D %4,5–6 · 1E &gt;%6</text><text x="320" y="472" text-anchor="middle" font-size="12" fill="#78350f">Yalnız tipik görüntülemede (sınıf 1) geçerli; sınıf 2 hariç</text><text x="320" y="496" text-anchor="middle" font-size="12" fill="#78350f">Belirsizse PROPKD &gt;6 ek kanıt</text><text x="320" y="518" text-anchor="middle" font-size="12" fill="#78350f">Önce eGFR düşüşünün başka nedenlerini dışla</text></g>
<g class="a m s4"><rect x="40" y="566" width="560" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="594" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Tolvaptan — risk var ve eGFR ≥25</text><text x="320" y="620" text-anchor="middle" font-size="12" fill="#064e3b">45 mg uyanınca + 15 mg 8 saat sonra, yavaş titre</text><text x="320" y="642" text-anchor="middle" font-size="12" fill="#064e3b">Karaciğer testleri: ilk 18 ay her ay, sonra 3 ayda bir</text><text x="320" y="664" text-anchor="middle" font-size="12" fill="#064e3b">Transaminaz &gt;3 kat: tolvaptanla ~%5, plaseboyla %1</text></g>
<g class="a m s5"><rect x="40" y="706" width="560" height="100" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="734" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Komplikasyon</text><text x="320" y="760" text-anchor="middle" font-size="12" fill="#7f1d1d">Kist enfeksiyonu: 4–6 hafta, lipitte çözünen antibiyotik</text><text x="320" y="782" text-anchor="middle" font-size="12" fill="#7f1d1d">Anevrizma taraması: kişisel SAK ya da ailede anevrizma/SAK/ani ölüm</text></g>
</svg>
