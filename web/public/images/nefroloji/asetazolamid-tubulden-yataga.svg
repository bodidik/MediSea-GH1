<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Asetazolamid: tübülden yatağa</title>
<desc id="d">Asetazolamid proksimal tübülde karbonik anhidraz IV ve II'yi engeller, sodyum bikarbonat geri emilimi azalır, bikarbonatüri olur. Tek başına diürez mütevazıdır: kaçan sıvıyı Henle kulbu geri alır, oluşan asidoz etkiyi köreltir. Kıvrım diüretiğine eklenince ADVOR'da 3 günde başarılı dekonjesyon yüzde 42,2'ye karşı 30,5. Ödemli hastada metabolik alkalozu düzeltir, hiperkapnik akciğer hastasında önemli. Asidoz solunumu uyarır: santral apne, yüksek irtifa. Yan etkiler: parestezi her 2,3 hastada bir, tat bozukluğu 18'de bir, doza bağlı. Böbrek işlevi kötüleşmesi OR 1,81, çoğu hemodinamik.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="56" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="38" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Proksimal tübül: CA IV ve CA II engellenir</text><text x="320" y="56" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">NaHCO₃ geri emilimi ↓ → bikarbonatüri</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="70" x2="320" y2="98" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="120" y="100" width="400" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Tek başına neden zayıf?</text><text x="320" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Kaçan sıvıyı Henle kulbu geri alır</text><text x="320" y="158" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Asidoz etkiyi giderek köreltir</text></g><g class="a" style="animation-delay:4.80s"><line x1="220" y1="170" x2="120" y2="198" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="320" y1="170" x2="320" y2="198" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="420" y1="170" x2="520" y2="198" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="200" width="196" height="120" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="112" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Kıvrım diüretiğine ek</text><text x="112" y="256" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">ADVOR: 500 mg IV</text><text x="112" y="274" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Dekonjesyon</text><text x="112" y="292" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">%42,2 vs %30,5</text><rect x="222" y="200" width="196" height="120" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Metabolik alkaloz</text><text x="320" y="256" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Ödemli hastada</text><text x="320" y="274" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">fazla HCO₃⁻ atılır</text><text x="320" y="292" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Hiperkapnide önemli</text><rect x="430" y="200" width="196" height="120" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="528" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Solunum</text><text x="528" y="256" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Hafif asidoz</text><text x="528" y="274" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">santral apne ↓</text><text x="528" y="292" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">irtifa, Cheyne-Stokes</text></g><g class="a" style="animation-delay:7.20s"><rect x="14" y="340" width="300" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="164" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Yan etkiler (NNH)</text><text x="164" y="392" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Parestezi 2,3 · yorgunluk 11</text><text x="164" y="410" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Poliüri 17 · tat bozukluğu 18</text><text x="164" y="428" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Parestezi ve tat doza bağlı</text><rect x="326" y="340" width="300" height="112" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="476" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Böbrek ve elektrolit</text><text x="476" y="392" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Kreatinin hafif ↑ (geri bildirim)</text><text x="476" y="410" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Ağ meta-analizi OR 1,81</text><text x="476" y="428" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Hipokalemi · kalsiyum fosfat taşı</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="472" width="612" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="505" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Dikkat</text><text x="320" y="523" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">İleri KOAH ve asidemide asidozu derinleştirebilir</text><text x="320" y="541" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Alkalozlu hiperkapnik hastada ise yarar sağlar</text><text x="320" y="559" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">En düşük etkili doz; yemekle al</text></g>
</svg>
