<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ABH'de böbrek replasman tedavisi: başlama, yöntem seçimi ve doz</title>
<desc id="d">KDIGO 2012: sıvı, elektrolit ve asit-baz dengesinde hayatı tehdit eden değişiklik varsa KRT acil başlanır. Kararda tek bir üre ya da kreatinin eşiği değil; genel klinik bağlam, KRT ile düzeltilebilecek durumlar ve laboratuvar eğilimleri esas alınır. Hayatı tehdit eden durumlar: hücre içine kaydırma önlemleri tükendikten sonra hiperkalemi, asidemi, akciğer ödemi, üremik komplikasyonlar; salisilat, etilen glikol, metanol, metformin gibi zehirlenmelerde ilaç da uzaklaştırılır. ABH'ye bağlı metabolik asidoz çoğu kez bikarbonatla düzelir. Sürekli ve aralıklı KRT birbirini tamamlar; hemodinamik olarak dengesiz hastada ve akut beyin hasarı ya da kafa içi basınç artışında sürekli KRT önerilir (2B). Küçük solütün hızla uzaklaştırılması gerektiğinde (ağır hiperkalemi, bazı zehirlenmeler, tümör lizis) aralıklı hemodiyaliz yeğlenebilir. Doz: aralıklı ya da uzatılmış KRT'de haftalık Kt/V 3,9 (1A); sürekli KRT'de 20–25 mL/kg/saat efluent (1A), bunun için çoğu kez 25–30 mL/kg/saat reçete gerekir. ATN çalışmasında (1124 hasta) haftalık Kt/V yaklaşık 6,5 ile 3,9 karşılaştırıldı; 60 günlük ölüm yüzde 53,6 ve 51,5, böbrek işlevinin düzelmesi yüzde 15,4 ve 18,4 idi. Diyaliz ve replasman sıvısında tampon olarak laktat yerine bikarbonat kullanılır. KRT, böbrek işlevi yeterince düzelince ya da bakım hedefleriyle uyumsuz olunca kesilir; düzelmeyi hızlandırmak için diüretik önerilmez.</desc>
<!-- 17 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: aki-semalar.cjs -->
<style>
