<g class="a bag"><rect x="330" y="42" width="290" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="475" y="79.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Acil değilse: BAĞLAM</text><text x="475" y="96.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">tek bir üre/kreatinin eşiği YOK</text><text x="475" y="113.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">laboratuvar EĞİLİMLERİ</text><text x="475" y="130.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">sıvı yükü ve beslenme ihtiyacı</text><text x="475" y="147.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">beklenen solüt yükü (TLS)</text><text x="475" y="164.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">diğer organların toleransı</text></g>
