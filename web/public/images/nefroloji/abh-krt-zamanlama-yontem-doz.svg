.acil .ciz{animation-name:acilc}@keyframes acilc{0%,6%{stroke-dashoffset:1}10%,100%{stroke-dashoffset:0}}
.bag{animation-name:bag}@keyframes bag{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.bag .ciz{animation-name:bagc}@keyframes bagc{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.mod{animation-name:mod}@keyframes mod{0%,30%{opacity:0;transform:translateY(7px)}33%,100%{opacity:1;transform:none}}
.mod .ciz{animation-name:modc}@keyframes modc{0%,30%{stroke-dashoffset:1}34%,100%{stroke-dashoffset:0}}
.m1{animation-name:m1}@keyframes m1{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.m1 .ciz{animation-name:m1c}@keyframes m1c{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.m2{animation-name:m2}@keyframes m2{0%,42%{opacity:0;transform:translateY(7px)}45%,100%{opacity:1;transform:none}}
.m2 .ciz{animation-name:m2c}@keyframes m2c{0%,42%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.m3{animation-name:m3}@keyframes m3{0%,48%{opacity:0;transform:translateY(7px)}51%,100%{opacity:1;transform:none}}
.m3 .ciz{animation-name:m3c}@keyframes m3c{0%,48%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
.doz{animation-name:doz}@keyframes doz{0%,58%{opacity:0;transform:translateY(7px)}61%,100%{opacity:1;transform:none}}
.doz .ciz{animation-name:dozc}@keyframes dozc{0%,58%{stroke-dashoffset:1}62%,100%{stroke-dashoffset:0}}
.d2{animation-name:d2}@keyframes d2{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.d2 .ciz{animation-name:d2c}@keyframes d2c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,80%{opacity:0;transform:translateY(7px)}83%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,80%{stroke-dashoffset:1}84%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
