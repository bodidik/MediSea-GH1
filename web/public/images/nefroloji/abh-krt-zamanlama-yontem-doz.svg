<g class="a d2"><rect x="20" y="512" width="600" height="92" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="546" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Daha fazla doz daha iyi değil: ATN çalışması (1124 hasta)</text><text x="320" y="563" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">haftalık Kt/V ~6,5 vs 3,9 → 60. gün ölüm %53,6 vs %51,5</text><text x="320" y="580" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">böbrek işlevinin düzelmesi %15,4 vs %18,4</text></g>
