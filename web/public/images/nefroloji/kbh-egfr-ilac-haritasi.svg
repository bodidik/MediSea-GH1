<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KBH'de eGFR düştükçe hangi ilaç başlar, hangisi sürer</title>
<desc id="d">eGFR düştükçe ilaç haritası. ACEi ya da ARB: albüminüride G1–G4'te başlanır; G4–G5'te sürdürülür, STOP-ACEi'de kesmenin yararı olmadı. SGLT2i: eGFR 20 ve üstünde başlanır; 20'nin altında sürdürmek makul; diyalizde randomize kanıt yok. Finerenon: tip 2 diyabet, eGFR 25 üstü, potasyum 4,8 ve altında, albüminüri sürüyorsa başlanır. GLP-1 RA: metformin ve SGLT2i'ye karşın hedefe ulaşamayan tip 2 diyabette; düşük eGFR'de genellikle doz ayarı yok. Statin: 50 yaş ve üstünde eGFR 60 altında statin ya da statin ve ezetimib. Asidoz: bikarbonat 18 altı KDIGO örnek eşiği; Davidson 22 üstü hedef.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="56" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="38" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">eGFR düştükçe ilaç haritası</text><text x="320" y="56" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Katmanlar birbirinin yerine değil üstüne</text></g><g class="a" style="animation-delay:2.40s"><line x1="220" y1="70" x2="165" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="420" y1="70" x2="475" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="102" width="300" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="164" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">ACEi ya da ARB</text><text x="164" y="154" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Albüminüride G1–G4'te başla</text><text x="164" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">G4–G5'te sürdür (STOP-ACEi)</text><text x="164" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Kreatinin artışı ≤%30</text><rect x="326" y="102" width="300" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="476" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">SGLT2 inhibitörü</text><text x="476" y="154" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">eGFR ≥20'de başla</text><text x="476" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">&lt;20'de sürdürmek makul</text><text x="476" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Diyalizde RKÇ yok</text></g><g class="a" style="animation-delay:4.80s"><rect x="14" y="234" width="300" height="112" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="164" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Finerenon</text><text x="164" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Tip 2 diyabet · eGFR &gt;25</text><text x="164" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">K⁺ ≤4,8 · albüminüri sürüyor</text><text x="164" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Hiperkalemi RR 2,31: izle</text><rect x="326" y="234" width="300" height="112" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="476" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">GLP-1 RA</text><text x="476" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Metformin + SGLT2i yetmezse</text><text x="476" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">FLOW: ölüm %12,8 vs %15,8</text><text x="476" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Düşük eGFR'de doz ayarı yok</text></g><g class="a" style="animation-delay:7.20s"><rect x="14" y="366" width="300" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="164" y="400" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Statin</text><text x="164" y="418" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">≥50 yaş, eGFR &lt;60 (1A)</text><text x="164" y="436" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">SHARP: simvastatin + ezetimib</text><text x="164" y="454" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Olay %11,3 vs %13,4</text><rect x="326" y="366" width="300" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="476" y="400" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Metabolik asidoz</text><text x="476" y="418" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">KDIGO: &lt;18 örnek eşik</text><text x="476" y="436" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Davidson: &gt;22 tut</text><text x="476" y="454" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">UpToDate: normal aralık</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="498" width="612" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="527" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Hasta gün kuralı</text><text x="320" y="545" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Kusma, ishal, ateşte RASi, diüretik, SGLT2i ve metformine ara;</text><text x="320" y="563" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">24–48 saat normal yeyip içince yeniden başla</text></g>
</svg>
