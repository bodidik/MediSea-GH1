<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Azalmış böbrek perfüzyonunda tübül sağlamken ve tübül hasarında idrar fizyolojisi</title>
<desc id="d">Hacim azalması ve hipotansiyon vazopressin salınımını güçlü uyarır: distal tübül ve toplayıcı kanal suya tam geçirgen olur, Henle kulpundaki düşük akım iç medullada yoğunlaştırmayı destekler. İdrar hacmi en aza iner, yoğunluğu en üste çıkar (500 mOsm/kg'ın üstü). Oligüri ve azotemi varken yüksek idrar ozmolalitesi ile düşük idrar sodyumu tübül işlevinin sağlam olduğunu gösterir, ama bu durum 'iyi huylu' ya da kendiliğinden 'prerenal' sayılmamalıdır: glomerülonefrit gibi hastalıklarda da erken dönemde tübül sağlam olabilir, sepsis ise tipik idrar değişikliği olmadan böbrek işlevini bozabilir. Tübüller hasarlanınca en yüksek yoğunlaştırma yeteneği bozulur ve idrar hacmi normal bile olabilir (oligürik olmayan ABH). Ağır oligüri ve anüri tübül hasarından olduğu gibi idrar yolu tıkanıklığından ve tam arter ya da ven tıkanmasından da olur. Hasarlı böbrek, ortalama arter basıncı yaklaşık 65 mmHg'nin üstünde akımı sabit tutan otoregülasyonunu kaybeder.</desc>
