<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" width="640" height="780" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Glomerüler hastalıkta klinik tablo ve olası tanı</title>
<desc id="d">Glomerüler hastalık beş klinik tabloyla gelir: yalnız proteinüri, yalnız hematüri, nefrotik sendrom, nefritik sendrom ve hızlı ilerleyen glomerülonefrit. Nefrotik sendrom: günde 3,5 gramdan fazla proteinüri, ödem, hiperlipidemi, hipoproteinemi; minimal değişiklik hastalığı hep nefrotik tablo yapar; membranöz nefropatide hastaların yüzde 70'inde PLA2R, yüzde 5–10'unda THSD7A antikoru; fokal segmental glomerüloskleroz. Nefritik sendrom ve yalnız hematüri: dismorfik eritrosit ve eritrosit silendiri; hematüri santrifüj idrarda büyük büyütme alanında 2'den fazla eritrosit; yalnız glomerüler hematürinin en sık nedenleri IgA nefropatisi, Alport sendromu ve ince bazal membran nefropatisi; IgA nefropatisinde aralıklı makroskopik hematüri. Hızlı ilerleyen glomerülonefrit: hızlı böbrek işlevi kaybı, sıklıkla oligüri, yaygın kresent; anti-GBM (yüzde 95'inde dolaşan antikor), immün kompleks ve pauci-immün (ANCA) tipleri. Çoğu glomerüler hastalık hem nefrotik hem nefritik bulgu verebilir; kesin tanıda altın standart böbrek biyopsisi.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="780" fill="#ffffff"/>
<g class="a m s1"><rect x="40" y="14" width="560" height="74" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Glomerüler hastalığın klinik tabloları</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Çoğu hastalık hem nefrotik hem nefritik bulgu verebilir → biyopsi</text></g>
<g class="a m s2"><rect x="10" y="104" width="300" height="250" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="160" y="132" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Nefrotik sendrom</text><text x="160" y="158" text-anchor="middle" font-size="12" fill="#1e3a8a">Proteinüri &gt;3,5 g/gün</text><text x="160" y="178" text-anchor="middle" font-size="12" fill="#1e3a8a">Ödem · hiperlipidemi · hipoproteinemi</text><text x="160" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Minimal değişiklik</text><text x="160" y="230" text-anchor="middle" font-size="11" fill="#1e3a8a">hep nefrotik tablo</text><text x="160" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Membranöz nefropati</text><text x="160" y="276" text-anchor="middle" font-size="11" fill="#1e3a8a">PLA2R %70 · THSD7A %5–10</text><text x="160" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">FSGS</text></g>
<g class="a m s3"><rect x="330" y="104" width="300" height="250" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="480" y="132" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Nefritik · yalnız hematüri</text><text x="480" y="158" text-anchor="middle" font-size="12" fill="#7f1d1d">Dismorfik eritrosit, eritrosit silendiri</text><text x="480" y="178" text-anchor="middle" font-size="12" fill="#7f1d1d">Hematüri: &gt;2 eritrosit/büyük büyütme</text><text x="480" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Yalnız glomerüler hematüri:</text><text x="480" y="232" text-anchor="middle" font-size="12" fill="#7f1d1d">IgA nefropatisi · Alport</text><text x="480" y="252" text-anchor="middle" font-size="12" fill="#7f1d1d">· ince bazal membran</text><text x="480" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Akut nefritte ayırıcı tanı:</text><text x="480" y="304" text-anchor="middle" font-size="11" fill="#7f1d1d">enfeksiyon sonrası GN · IgA · MPGN/C3G</text><text x="480" y="324" text-anchor="middle" font-size="11" fill="#7f1d1d">· kresentik GN</text></g>
<g class="a m s4"><rect x="40" y="372" width="560" height="200" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Hızlı ilerleyen glomerülonefrit (RPGN)</text><text x="320" y="426" text-anchor="middle" font-size="12" fill="#78350f">Hızlı böbrek işlevi kaybı · sıklıkla oligüri/anüri · yaygın kresent</text><text x="120" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Anti-GBM</text><text x="120" y="488" text-anchor="middle" font-size="11" fill="#78350f">α3(IV) kollajen NC1</text><text x="120" y="506" text-anchor="middle" font-size="11" fill="#78350f">antikor ~%95'inde</text><text x="320" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">İmmün kompleks</text><text x="320" y="488" text-anchor="middle" font-size="11" fill="#78350f">IgA, lupus, enfeksiyon</text><text x="320" y="506" text-anchor="middle" font-size="11" fill="#78350f">sonrası, C3G</text><text x="520" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Pauci-immün</text><text x="520" y="488" text-anchor="middle" font-size="11" fill="#78350f">ANCA; PR3 + akciğer/üst</text><text x="520" y="506" text-anchor="middle" font-size="11" fill="#78350f">solunum yolu → nüks sık</text><text x="320" y="548" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Kresentli GN, RPGN'nin çoğunun altında yatan lezyon</text></g>
<g class="a m s5"><rect x="40" y="590" width="560" height="176" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="618" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Primer mi, sekonder mi?</text><text x="320" y="644" text-anchor="middle" font-size="12" fill="#4c1d95">Aynı lezyon hem böbreğe sınırlı hem sistemik hastalığın parçası olabilir</text><text x="320" y="672" text-anchor="middle" font-size="12" fill="#4c1d95">IgA nefropatisi ↔ IgA vasküliti</text><text x="320" y="692" text-anchor="middle" font-size="12" fill="#4c1d95">Pauci-immün GN ↔ küçük damar vasküliti</text><text x="320" y="712" text-anchor="middle" font-size="12" fill="#4c1d95">Anti-GBM GN ↔ Goodpasture sendromu</text><text x="320" y="732" text-anchor="middle" font-size="12" fill="#4c1d95">Membranöz nefropati ↔ SLE · MPGN ↔ kriyoglobulinemi</text></g>
</svg>
