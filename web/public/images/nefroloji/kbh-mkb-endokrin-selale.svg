<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KBH-MKB: endokrin şelale ve kısır döngü</title>
<desc id="d">GFR düşer, fosfor dengesi bozulur. Osteositler FGF-23 salgılar; FGF-23 böbrekte NaPi-IIa/c taşıyıcılarını baskılayarak fosfatüri yapar, bunun için Klotho gerekir. Klotho erken evrede azalır, FGF-23 direnci gelişir ve FGF-23 daha da artar. FGF-23 1-alfa-hidroksilazı baskılar, kalsitriol düşer, bağırsaktan kalsiyum ve fosfor emilimi azalır ve hipokalsemi gelişir. Hipokalsemi ve hiperfosfatemi paratiroidi uyarır: sekonder hiperparatiroidizm ve hiperplazi.</desc>
<!-- 15 sn'lik döngü; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kbh-sema.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%,94%{opacity:1;transform:none}100%{opacity:0}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
