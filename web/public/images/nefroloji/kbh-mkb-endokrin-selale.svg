<g class="a s9"><path class="a ciz" pathLength="1" d="M475,466 L475,494" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="340" y="498" width="270" height="52" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="475" y="520" font-size="15" font-weight="800" text-anchor="middle" fill="#7f1d1d">Kalsitriol ↓</text><text x="475" y="539" font-size="12.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">aktif D vitamini</text></g>
<g class="a s10"><path class="a ciz" pathLength="1" d="M338,524 L292,524" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="30" y="498" width="260" height="52" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="160" y="529.5" font-size="15" font-weight="800" text-anchor="middle" fill="#1e293b">Bağırsak: Ca ve P emilimi ↓</text></g>
<g class="a s11"><path class="a ciz" pathLength="1" d="M160,552 L160,586" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="30" y="590" width="260" height="50" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="620.5" font-size="15" font-weight="800" text-anchor="middle" fill="#7f1d1d">Hipokalsemi</text><rect x="350" y="590" width="260" height="50" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="620.5" font-size="15" font-weight="800" text-anchor="middle" fill="#78350f">Hiperfosfatemi</text></g>
<g class="a s12"><path class="a ciz" pathLength="1" d="M160,642 L250,676" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M480,642 L390,676" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="190" y="680" width="260" height="50" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="701" font-size="15" font-weight="800" text-anchor="middle" fill="#0c4a6e">Paratiroid bezi</text><text x="320" y="720" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">uyarılır (CaSR)</text></g>
<g class="a s13"><path class="a ciz" pathLength="1" d="M320,732 L320,756" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
