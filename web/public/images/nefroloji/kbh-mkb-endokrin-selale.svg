<g class="a s3"><g class="a nabiz m"><rect x="30" y="198" width="250" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="155" y="225" font-size="15" font-weight="800" text-anchor="middle" fill="#0c4a6e">Osteosit → FGF-23 ↑</text><text x="155" y="244" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">en erken devreye giren yanıt</text></g></g>

<g class="a s4"><rect x="330" y="186" width="280" height="150" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
<text x="346" y="208" font-size="12.5" font-weight="800" fill="#475569">BÖBREK TÜBÜLÜ</text>
<rect x="346" y="220" width="120" height="46" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="406" y="239" font-size="15" font-weight="800" text-anchor="middle" fill="#1e293b">NaPi-IIa/c</text><text x="406" y="258" font-size="12.5" font-weight="500" text-anchor="middle" fill="#1e293b">fosfor emilimi</text>
</g>
<g class="a s4"><g class="a direnc"><path class="a ciz" pathLength="1" d="M282,226 L338,238" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#tbar)"/><text x="406" y="298" font-size="14" font-weight="800" text-anchor="middle" fill="#0369a1">Fosfatüri</text><text x="406" y="316" font-size="11.5" text-anchor="middle" fill="#0369a1">(FGF-23 etkisi Klotho ister)</text></g></g>
<g class="a s5"><rect x="484" y="220" width="110" height="46" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="539" y="239" font-size="15" font-weight="800" text-anchor="middle" fill="#4c1d95">Klotho ↓</text><text x="539" y="258" font-size="12.5" font-weight="500" text-anchor="middle" fill="#4c1d95">erken evrede</text></g>
<g class="a carpi m"><path d="M584,206 L602,224 M602,206 L584,224" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/></g>
