<g class="a s2"><path class="a ciz" pathLength="1" d="M320,78 L320,108" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="210" y="112" width="220" height="50" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="133" font-size="15" font-weight="800" text-anchor="middle" fill="#78350f">Fosfor ↑ eğilimi</text><text x="320" y="152" font-size="12.5" font-weight="500" text-anchor="middle" fill="#78350f">fosfor atılamaz</text></g>
