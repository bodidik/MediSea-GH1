.s4 .ciz{animation-name:c4}@keyframes c4{0%,19%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,27%{opacity:0;transform:translateY(8px)}30%,94%{opacity:1;transform:none}100%{opacity:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,27%{stroke-dashoffset:1}32%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,33%{opacity:0;transform:translateY(8px)}36%,94%{opacity:1;transform:none}100%{opacity:0}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,39%{opacity:0;transform:translateY(8px)}42%,94%{opacity:1;transform:none}100%{opacity:0}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,39%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,47%{opacity:0;transform:translateY(8px)}50%,94%{opacity:1;transform:none}100%{opacity:0}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,47%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
.s9{animation-name:s9}@keyframes s9{0%,53%{opacity:0;transform:translateY(8px)}56%,94%{opacity:1;transform:none}100%{opacity:0}}
.s9 .ciz{animation-name:c9}@keyframes c9{0%,53%{stroke-dashoffset:1}58%,100%{stroke-dashoffset:0}}
.s10{animation-name:s10}@keyframes s10{0%,59%{opacity:0;transform:translateY(8px)}62%,94%{opacity:1;transform:none}100%{opacity:0}}
.s10 .ciz{animation-name:c10}@keyframes c10{0%,59%{stroke-dashoffset:1}64%,100%{stroke-dashoffset:0}}
.s11{animation-name:s11}@keyframes s11{0%,65%{opacity:0;transform:translateY(8px)}68%,94%{opacity:1;transform:none}100%{opacity:0}}
.s11 .ciz{animation-name:c11}@keyframes c11{0%,65%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
.s12{animation-name:s12}@keyframes s12{0%,72%{opacity:0;transform:translateY(8px)}75%,94%{opacity:1;transform:none}100%{opacity:0}}
.s12 .ciz{animation-name:c12}@keyframes c12{0%,72%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
.s13{animation-name:s13}@keyframes s13{0%,79%{opacity:0;transform:translateY(8px)}82%,94%{opacity:1;transform:none}100%{opacity:0}}
.s13 .ciz{animation-name:c13}@keyframes c13{0%,79%{stroke-dashoffset:1}84%,100%{stroke-dashoffset:0}}
.direnc{animation-name:direnc}@keyframes direnc{0%,33%{opacity:1}37%,94%{opacity:.25}100%{opacity:1}}
.nabiz{animation-name:nabiz}@keyframes nabiz{0%,42%{transform:scale(1)}45%{transform:scale(1.08)}48%,100%{transform:scale(1)}}
