<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" width="640" height="780" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KBH-MKB: osteoporoz ilacı kararı</title>
<desc id="d">eGFR 30 ve üstünde, KBH-MKB bulgusu yoksa karar KBH olmayan hastadaki gibidir. eGFR 30 altında ya da KBH-MKB bulgusu varsa ve kırılganlık kırığı yoksa ilaç önerilmez, KBH-MKB yönetilir. Kırık varsa önce renal osteodistrofi dışlanır. eGFR 15–30 arasında KBH-MKB bulgusu yoksa ilaç önerilir. eGFR 15 altında KBH-MKB bulgusu yoksa, varsa biyopsiyle bakılır ve ilaç yalnız tekrarlayan kırıktan ölüm riski yüksekse düşünülür; biyopsi yapılamıyorsa BSAP yüksek ve PTH 350 pg/mL üstü adinamik kemiği olası dışı kılar. G4–G5D'de KBH-MKB bulgusu varsa antirezorptif verilmez.</desc>
<!-- 15 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:15s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
