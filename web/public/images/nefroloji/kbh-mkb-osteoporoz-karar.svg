.s2 .ciz{animation-name:c2}@keyframes c2{0%,9%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,18%{opacity:0;transform:translateY(8px)}21%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,18%{stroke-dashoffset:1}23%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,28%{opacity:0;transform:translateY(8px)}31%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,28%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,37%{opacity:0;transform:translateY(8px)}40%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,37%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,46%{opacity:0;transform:translateY(8px)}49%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,46%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,55%{opacity:0;transform:translateY(8px)}58%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,55%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,64%{opacity:0;transform:translateY(8px)}67%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,64%{stroke-dashoffset:1}69%,100%{stroke-dashoffset:0}}
.s9{animation-name:s9}@keyframes s9{0%,74%{opacity:0;transform:translateY(8px)}77%, 100%{opacity:1;transform:none}}
.s9 .ciz{animation-name:c9}@keyframes c9{0%,74%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
.s10{animation-name:s10}@keyframes s10{0%,83%{opacity:0;transform:translateY(8px)}86%, 100%{opacity:1;transform:none}}
.s10 .ciz{animation-name:c10}@keyframes c10{0%,83%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="780" fill="#ffffff"/>
<g class="a m s1"><rect x="120" y="20" width="400" height="72" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="51" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Düşük KMY veya kırılganlık kırığı</text><text x="320" y="71" text-anchor="middle" font-size="13" fill="#0f172a">önce: KBH-MKB bulgusu ve eGFR</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M210,92 L125,136" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M430,92 L470,136" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s3"><rect x="15" y="140" width="220" height="104" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="125" y="177" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">eGFR ≥ 30, KBH-MKB yok</text><text x="125" y="197" text-anchor="middle" font-size="13" fill="#064e3b">KBH olmayan hasta</text><text x="125" y="217" text-anchor="middle" font-size="13" fill="#064e3b">gibi karar ver</text></g><g class="a m s4"><rect x="260" y="140" width="365" height="104" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="442.5" y="187" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">eGFR &lt; 30 ya da KBH-MKB bulgusu</text><text x="442.5" y="207" text-anchor="middle" font-size="13" fill="#78350f">Kırılganlık kırığı var mı?</text></g><g class="a s5"><path class="a ciz" pathLength="1" d="M340,244 L190,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M545,244 L475,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><text x="245" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">yok</text></g><g class="a s5"><text x="530" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">var</text></g><g class="a m s6"><rect x="15" y="304" width="300" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="165" y="341" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">İlaç önerilmez (2C)</text><text x="165" y="361" text-anchor="middle" font-size="13" fill="#0f172a">KBH-MKB'yi yönet</text><text x="165" y="381" text-anchor="middle" font-size="13" fill="#0f172a">DXA tek başına risk ölçütü değil</text></g><g class="a m s7"><rect x="330" y="304" width="295" height="104" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="351" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Renal osteodistrofiyi dışla</text><text x="477.5" y="371" text-anchor="middle" font-size="13" fill="#1e3a8a">biyokimya · biyopsi (varsa)</text></g><g class="a s8"><path class="a ciz" pathLength="1" d="M380,408 L120,468" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M475,408 L330,468" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M570,408 L540,468" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s9"><rect x="15" y="472" width="200" height="188" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="115" y="531" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">eGFR 15–30</text><text x="115" y="551" text-anchor="middle" font-size="13" fill="#064e3b">bulgu YOK:</text><text x="115" y="571" text-anchor="middle" font-size="13" fill="#064e3b">ilaç önerilir</text><text x="115" y="591" text-anchor="middle" font-size="13" fill="#064e3b">doz ve süre uzman</text><text x="115" y="611" text-anchor="middle" font-size="13" fill="#064e3b">kararıyla</text></g><g class="a m s9"><rect x="225" y="472" width="205" height="188" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="327.5" y="531" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">eGFR &lt; 15</text><text x="327.5" y="551" text-anchor="middle" font-size="13" fill="#78350f">bulgu YOK (biyopsi):</text><text x="327.5" y="571" text-anchor="middle" font-size="13" fill="#78350f">yalnız tekrar kırıktan</text><text x="327.5" y="591" text-anchor="middle" font-size="13" fill="#78350f">ölüm riski yüksekse</text><text x="327.5" y="611" text-anchor="middle" font-size="13" fill="#78350f">seçilmiş hastada</text></g><g class="a m s9"><rect x="440" y="472" width="185" height="188" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="532.5" y="531" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">G4–G5D</text><text x="532.5" y="551" text-anchor="middle" font-size="13" fill="#7f1d1d">bulgu VAR:</text><text x="532.5" y="571" text-anchor="middle" font-size="13" fill="#7f1d1d">antirezorptif</text><text x="532.5" y="591" text-anchor="middle" font-size="13" fill="#7f1d1d">VERİLMEZ</text><text x="532.5" y="611" text-anchor="middle" font-size="13" fill="#7f1d1d">önce sHPT yönetimi</text></g><g class="a s10"><rect x="15" y="676" width="610" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="708" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Biyopsi yapılamıyorsa: BSAP yüksek ve iPTH &gt; 350 pg/mL</text><text x="320" y="732" text-anchor="middle" font-size="13" fill="#0f172a">adinamik kemiği olası dışı kılar (UpToDate, Miller)</text></g>
</svg>
