t-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">proteinüride yarar daha büyük</text><text x="320" y="509" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">kreatinin 4 haftada >%30</text><text x="320" y="526" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">artmadıkça sürdür (KDIGO)</text><text x="320" y="543" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">ACEi + ARB + DRİ birlikte YOK</text><rect x="430" y="372" width="200" height="196" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="530" y="407" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">NSAİİ · kalsinörin inh.</text><text x="530" y="424" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">afferent vazokonstriksiyon</text><text x="530" y="441" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">P_GC ↓ · albüminüri ↓</text><text x="530" y="458" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">AMA peritübüler akım ↓</text><text x="530" y="475" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">O₂ sunumu ↓</text><text x="530" y="492" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">yüksek dozda GFR kaybı</text><text x="530" y="509" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">HIZLANABİLİR</text><text x="530" y="526" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">albüminüri düşüşü tek başına</text><text x="530" y="543" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">koruma kanıtı değildir</text></g>
<g class="a son"><rect x="10" y="584" width="620" height="136" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="623" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Klinik çıkarımlar</text><text x="320" y="640" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">SGLT2i'de yol diyabet tipine göre değişir: T1D'de afferent daralma, T2D'de efferent dilatasyon</text><text x="320" y="657" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">iki yol da P_GC'yi düşürür; başlangıç eGFR düşüşü hasar değil hemodinamik uyumdur</text><text x="320" y="674" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">EMPA-REG aracılık analizi: böbrek yararının en güçlü aracısı albüminüri değil Hct/Hb artışı</text><text x="320" y="691" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">yüksek tuz alımı SGLT2i'nin TGF etkisini zayıflatabilir (deneysel veri)</text></g>

