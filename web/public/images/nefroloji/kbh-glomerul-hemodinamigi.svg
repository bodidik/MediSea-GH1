<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" width="640" height="730" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Glomerül hemodinamiği: tübüloglomerüler geri bildirim, SGLT2 inhibitörü, RAS blokajı ve NSAİİ</title>
<desc id="d">Afferent arteriyol kanı glomerüle getirir, efferent arteriyol götürür; glomerül içi hidrostatik basıncı (P_GC) ikisinin direnci belirler. SGLT2 inhibitörü proksimal tübülde sodyum ve glukoz geri emilimini azaltır, makula densaya daha çok sodyum ulaşır. Makula densa hücrelerinde enerji gerektiren sodyum geri emilimi ATP'nin adenozine dönüşümünü artırır; adenozin afferent arteriyol düz kasındaki A1 reseptörüne bağlanır ve afferent daralır, P_GC ve albüminüri düşer, GFR geri dönüşlü biçimde azalır (ortalama yaklaşık 5 mL/dk/1,73 m², ilacı kesince geri gelir). ACE inhibitörü ve ARB efferent arteriyolü ağırlıklı genişletir; P_GC ve albüminüri düşer, peritübüler akım ve oksijen sunumu artar ve GFR kaybı yavaşlar. NSAİİ ve kalsinörin inhibitörleri afferent arteriyolü daraltır; P_GC ve albüminüri düşer ama peritübüler akım azalır ve özellikle yüksek dozda GFR kaybı hızlanabilir. Tip 2 diyabette SGLT2 inhibitörü yanıtında efferent dilatasyon daha belirgin olabilir. SGLT2 inhibisyonunda korteksin oksijenlenmesi artar, medullanınki azalır.</desc>
