<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Diüretikler nefron boyunca nerede etki eder?</title>
<desc id="d">Nefron boyunca diüretiklerin etki yeri ve en yüksek dozda atılabilen süzülmüş sodyum oranı. Proksimal tübül: asetazolamid karbonik anhidrazı keserek NaCl ve NaHCO3 kaybı yapar, net diürez görece azdır; ana diüretik kullanımı metabolik alkalozlu ödemli hasta. Mannitol geri emilmeyen şeker alkolüdür; proksimal tübülde ve daha çok Henle kulpunda sodyum ve su geri emilimini keser, sudan zengin diürez yapar; ödemde genellikle kullanılmaz. Henle kulpunun çıkan kalın kolu: kıvrım diüretikleri (furosemid, bumetanid, torsemid, etakrinik asit) NKCC2'yi keser, süzülmüş sodyumun yüzde 20–25'ine kadar atılım; kalsiyum geri emilimi paraselüler olduğundan kalsiyum atılımı artar. Distal kıvrımlı tübül: tiyazidler NCC'yi keser, en fazla yüzde 3–5; kalsiyum geri emilimini artırır; idrar seyreltmeyi bozarak hiponatremi yapabilir. Bağlantı tübülü ve toplayıcı kanal: potasyum tutucular (amilorid, triamteren ENaC'yi doğrudan tıkar; spironolakton, eplerenon, finerenon mineralokortikoid reseptörünü keser), yalnız yüzde 1–2; potasyum ve hidrojen atılımı azalır, hiperkalemi ve metabolik asidoz olabilir. Trimetoprim de ENaC'yi tıkayıp hiperkalemi yapabilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a m s1"><rect x="40" y="14" width="560" height="64" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="40" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Nefron boyunca diüretik etki yerleri</text><text x="320" y="62" text-anchor="middle" font-size="12" fill="#334155">Sağdaki yüzde: en yüksek dozda atılabilen süzülmüş sodyum</text></g>
<g class="a m s1"><rect x="40" y="96" width="560" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="60" y="124" font-size="14" font-weight="800" fill="#4c1d95">Proksimal tübül</text><text x="60" y="150" font-size="12" font-weight="700" fill="#4c1d95">Asetazolamid — karbonik anhidraz</text><text x="60" y="170" font-size="12" fill="#4c1d95">NaCl + NaHCO3 kaybı · net diürez görece az</text><text x="60" y="190" font-size="12" fill="#4c1d95">Ödem + metabolik alkalozda</text><text x="60" y="214" font-size="12" font-weight="700" fill="#4c1d95">Mannitol — proksimal + daha çok Henle; sudan zengin diürez</text></g>
<g class="a m s2"><rect x="40" y="252" width="560" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="60" y="280" font-size="14" font-weight="800" fill="#7f1d1d">Henle çıkan kalın kol</text><text x="580" y="280" text-anchor="end" font-size="15" font-weight="800" fill="#7f1d1d">%20–25</text><text x="60" y="306" font-size="12" font-weight="700" fill="#7f1d1d">Kıvrım diüretikleri — NKCC2</text><text x="60" y="326" font-size="12" fill="#7f1d1d">Furosemid · bumetanid · torsemid · etakrinik asit</text><text x="60" y="350" font-size="12" fill="#7f1d1d">Kalsiyum paraselüler emilir → kalsiyum atılımı ARTAR</text></g>
<g class="a m s3"><rect x="40" y="398" width="560" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="60" y="426" font-size="14" font-weight="800" fill="#1e3a8a">Distal kıvrımlı tübül</text><text x="580" y="426" text-anchor="end" font-size="15" font-weight="800" fill="#1e3a8a">%3–5</text><text x="60" y="452" font-size="12" font-weight="700" fill="#1e3a8a">Tiyazidler — NCC</text><text x="60" y="474" font-size="12" fill="#1e3a8a">Kalsiyum geri emilimi ARTAR → hiperkalsiürik taşta</text><text x="60" y="496" font-size="12" fill="#1e3a8a">İdrar seyreltmeyi bozar → hiponatremi</text></g>
<g class="a m s4"><rect x="40" y="544" width="560" height="148" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="60" y="572" font-size="14" font-weight="800" fill="#064e3b">Bağlantı tübülü · toplayıcı kanal</text><text x="580" y="572" text-anchor="end" font-size="15" font-weight="800" fill="#064e3b">%1–2</text><text x="60" y="598" font-size="12" font-weight="700" fill="#064e3b">Amilorid, triamteren — ENaC'yi doğrudan tıkar</text><text x="60" y="620" font-size="12" font-weight="700" fill="#064e3b">Spironolakton, eplerenon, finerenon — MR antagonisti</text><text x="60" y="644" font-size="12" fill="#064e3b">K⁺ ve H⁺ atılımı azalır → hiperkalemi, metabolik asidoz</text><text x="60" y="668" font-size="12" fill="#064e3b">Trimetoprim de ENaC'yi tıkar → hiperkalemi</text></g>
<g class="a m s5"><rect x="40" y="706" width="560" height="44" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="733" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Potasyum tutucular çoğunlukla kıvrım ya da tiyazidle birlikte, K⁺ kaybını azaltmak için</text></g>
</svg>
