<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 636" width="640" height="636" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hemodiyaliz seansında akut komplikasyonlar: ne zaman ortaya çıkar, ne yapılır?</title>
<desc id="d">Tip A diyalizör reaksiyonu (anafilaktik) çoğunlukla seansın ilk 5 dakikasında, bazen 30 dakikaya dek başlar: nefes darlığı, sıcaklık hissi, yaklaşan felaket duygusu, ağır olgularda anafilaksi; nedenler arasında etilen oksit, AN69 membran, kontamine diyalizat, yeniden kullanımda yetersiz dezenfeksiyon ve heparin vardır. Seans hemen durdurulur, hatlar klemplenir, devredeki kan hastaya geri VERİLMEZ; gerekirse adrenalin, steroid, antihistaminik. Tip B reaksiyon genellikle en az 20 dakika sonra göğüs ve sırt ağrısıyla gelir, destek tedaviyle 60 dakikada geçer; miyokard iskemisi dışlanmalıdır. Bulantı ve kusma sıklıkla ilk saatte ve hipotansiyonla ilişkilidir. Kramplar sıvı ve elektrolit kaymasına bağlıdır, kuru ağırlığa inildiğinin erken işaretidir; 50 mL yüzde 50 dekstroz hızlı rahatlatır. Dengesizlik sendromu beyin suyunun akut artışıyla, ağır üremide hızlı temizlemeyle ortaya çıkar: bulantı, kusma, baş ağrısı, nöbet, koma; seans durdurulur, 24 saatte düzelir; önlemek için ilk seans yaklaşık 2 saat tutulup sonraki seanslar 15–30 dakika uzatılır. Masif hemoliz (porto şarabı renkli ven hattı, pembe plazma) tıkanmış hatlar ya da hipotonik veya kloramin gibi kimyasallarla kirlenmiş diyalizattan olur ve ölümcül hiperkalemi yapar: seans durdurulur, hatlar klemplenir, kan geri VERİLMEZ. Hava embolisinde ven hattı klemplenir, hasta sol yan ve baş aşağı yatırılır, yüzde 100 oksijen verilir. Ani kardiyak ölüm ve aritmi hemodiyaliz hastalarındaki ölümlerin yaklaşık yüzde 25'idir.</desc>
