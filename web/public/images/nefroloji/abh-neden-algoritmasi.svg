<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ABH'de nedene göre değerlendirme algoritması</title>
<desc id="d">KDIGO 2012 Şekil 5'e göre ABH saptanınca öykü ve muayene, klinik testler, laboratuvar değerleri ve evre belirlenir. Sırayla sorulur: Böbrek perfüzyonu azalmış mı? Evetse sıvı kaybı, kalp yetersizliği ya da renal vazokonstriksiyon. Tıkanıklık düşünülüyor mu? Ultrasonla tıkanıklık aranır. Özgül bir tanı var mı? Akut interstisyel nefrit, glomerülonefrit, trombotik mikroanjiyopati, renal mikroanjiyopati, miyelom. Değilse özgül olmayan ABH: iskemik, toksik, inflamatuvar (ör. sepsis) ve diğerleri. ABH yoksa yüksek riskli hastada izlem sürer. Azalmış böbrek perfüzyonu, akut glomerülonefrit, vaskülit, interstisyel nefrit, trombotik mikroanjiyopati ve idrar yolu tıkanıklığı hemen tanı ve özgül tedavi gerektirir; bunlar için hacim durumu ve idrar tanı indeksleri, idrar sedimenti, seroloji ve hematoloji, böbrek ultrasonu kullanılır.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: aki-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
