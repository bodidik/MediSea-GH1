.dg .ciz{animation-name:dgc}@keyframes dgc{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.p{animation-name:p}@keyframes p{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.p .ciz{animation-name:pc}@keyframes pc{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.pk{animation-name:pk}@keyframes pk{0%,26%{opacity:0;transform:translateY(7px)}29%,100%{opacity:1;transform:none}}
.pk .ciz{animation-name:pkc}@keyframes pkc{0%,26%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.t{animation-name:t}@keyframes t{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.t .ciz{animation-name:tc}@keyframes tc{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.tk{animation-name:tk}@keyframes tk{0%,42%{opacity:0;transform:translateY(7px)}45%,100%{opacity:1;transform:none}}
.tk .ciz{animation-name:tkc}@keyframes tkc{0%,42%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.s{animation-name:s}@keyframes s{0%,52%{opacity:0;transform:translateY(7px)}55%,100%{opacity:1;transform:none}}
.s .ciz{animation-name:sc}@keyframes sc{0%,52%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.sk{animation-name:sk}@keyframes sk{0%,58%{opacity:0;transform:translateY(7px)}61%,100%{opacity:1;transform:none}}
.sk .ciz{animation-name:skc}@keyframes skc{0%,58%{stroke-dashoffset:1}62%,100%{stroke-dashoffset:0}}
.n{animation-name:n}@keyframes n{0%,68%{opacity:0;transform:translateY(7px)}71%,100%{opacity:1;transform:none}}
.n .ciz{animation-name:nc}@keyframes nc{0%,68%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.nk{animation-name:nk}@keyframes nk{0%,74%{opacity:0;transform:translateY(7px)}77%,100%{opacity:1;transform:none}}
.nk .ciz{animation-name:nkc}@keyframes nkc{0%,74%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,86%{opacity:0;transform:translateY(7px)}89%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,86%{stroke-dashoffset:1}90%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
