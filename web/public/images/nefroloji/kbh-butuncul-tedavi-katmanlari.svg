<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KBH'de bütüncül tedavi: yaşam tarzından hedefe yönelik ilaçlara katmanlar</title>
<desc id="d">KDIGO 2024 bütüncül yaklaşımı katmanlar halinde kurar. Temel: sigara içilmemesi, haftada en az 150 dakika orta yoğunlukta fiziksel etkinlik, uygun vücut ağırlığı, KBH G3–G5'te 0,8 g/kg/gün protein (1,3'ün üstünden kaçınma), günde 2 g'ın altında sodyum. Birinci basamak ilaçlar: albüminüride en yüksek tolere edilen dozda ACEi ya da ARB, SGLT2 inhibitörü, statin temelli tedavi; hedef sistolik kan basıncı tolere edilirse 120 mmHg'nin altı. Hedefe yönelik tedaviler: tip 2 diyabet ve albüminüride steroid olmayan MRA (finerenon), glisemik hedefe ulaşılamayan tip 2 diyabette uzun etkili GLP-1 reseptör agonisti, kan basıncı için dihidropiridin kalsiyum kanal blokörü ya da diüretik, aterosklerotik hastalıkta antiagregan, dirençli hipertansiyonda steroid MRA. Komplikasyonlar: anemi, mineral-kemik bozukluğu, asidoz ve potasyum bozuklukları. Finerenon potasyum 4,8 mmol/L ve altındayken başlanır: eGFR 25–59'da 10 mg, 60 ve üstünde 20 mg; potasyum 1. ayda, sonra 4 ayda bir ölçülür; 4,9–5,5'te sürdürülür, 5,5'in üstünde ara verilir.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kbh-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.k1{animation-name:k1}@keyframes k1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.k1 .ciz{animation-name:k1c}@keyframes k1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.k2{animation-name:k2}@keyframes k2{0%,14%{opacity:0;transform:translateY(7px)}17%,100%{opacity:1;transform:none}}
.k2 .ciz{animation-name:k2c}@keyframes k2c{0%,14%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.k3{animation-name:k3}@keyframes k3{0%,30%{opacity:0;transform:translateY(7px)}33%,100%{opacity:1;transform:none}}
.k3 .ciz{animation-name:k3c}@keyframes k3c{0%,30%{stroke-dashoffset:1}34%,100%{stroke-dashoffset:0}}
.k4{animation-name:k4}@keyframes k4{0%,46%{opacity:0;transform:translateY(7px)}49%,100%{opacity:1;transform:none}}
.k4 .ciz{animation-name:k4c}@keyframes k4c{0%,46%{stroke-dashoffset:1}50%,100%{stroke-dashoffset:0}}
.fin{animation-name:fin}@keyframes fin{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.fin .ciz{animation-name:finc}@keyframes finc{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,80%{opacity:0;transform:translateY(7px)}83%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,80%{stroke-dashoffset:1}84%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a k1"><rect x="10" y="494" width="620" height="132" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="24" y="518" font-size="14" font-weight="900" text-anchor="start" fill="#14532d">1 · Herkese — yaşam tarzı (temel)</text><text x="24" y="540" font-size="11.5" font-weight="500" text-anchor="start" fill="#14532d">• sigara yok · egzersiz ≥150 dk/hafta</text><text x="330" y="540" font-size="11.5" font-weight="500" text-anchor="start" fill="#14532d">• uygun VKİ · sedanter kalmamak</text><text x="24" y="558" font-size="11.5" font-weight="500" text-anchor="start" fill="#14532d">• protein 0,8 g/kg/gün (G3–G5)</text><text x="330" y="558" font-size="11.5" font-weight="500" text-anchor="start" fill="#14532d">• >1,3 g/kg/gün'den kaçın</text><text x="24" y="576" font-size="11.5" font-weight="500" text-anchor="start" fill="#14532d">• sodyum &lt;2 g/gün (≈ NaCl &lt;5 g)</text><text x="330" y="576" font-size="11.5" font-weight="500" text-anchor="start" fill="#14532d">• bitkisel ağırlıklı, az işlenmiş diyet</text></g>
<g class="a k2"><rect x="10" y="352" width="620" height="132" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="24" y="376" font-size="14" font-weight="900" text-anchor="start" fill="#0c4a6e">2 · Birinci basamak ilaçlar</text><text x="24" y="398" font-size="11.5" font-weight="500" text-anchor="start" fill="#0c4a6e">• RASi: en yüksek TOLERE edilen doz</text><text x="330" y="398" font-size="11.5" font-weight="500" text-anchor="start" fill="#0c4a6e">• SGLT2i: eGFR ≥20'de başla</text><text x="24" y="416" font-size="11.5" font-weight="500" text-anchor="start" fill="#0c4a6e">• statin ya da statin + ezetimib (≥50 yaş, G3–G5)</text><text x="330" y="416" font-size="11.5" font-weight="500" text-anchor="start" fill="#0c4a6e">• SKB hedefi &lt;120 (tolere edilirse)</text><text x="24" y="434" font-size="11.5" font-weight="500" text-anchor="start" fill="#0c4a6e">• eGFR &lt;30'da da RASi sürdür</text><text x="330" y="434" font-size="11.5" font-weight="500" text-anchor="start" fill="#0c4a6e">• STOP-ACEi: kesmenin yararı yok</text></g>
<g class="a k3"><rect x="10" y="210" width="620" height="132" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="24" y="234" font-size="14" font-weight="900" text-anchor="start" fill="#581c87">3 · Hedefe yönelik tedaviler</text><text x="24" y="256" font-size="11.5" font-weight="500" text-anchor="start" fill="#581c87">• T2D + albüminüri: ns-MRA (finerenon)</text><text x="330" y="256" font-size="11.5" font-weight="500" text-anchor="start" fill="#581c87">• T2D, hedef dışı: GLP-1 RA (semaglutid)</text><text x="24" y="274" font-size="11.5" font-weight="500" text-anchor="start" fill="#581c87">• KB için DHP-KKB ya da diüretik</text><text x="330" y="274" font-size="11.5" font-weight="500" text-anchor="start" fill="#581c87">• dirençli HT: steroid MRA</text><text x="24" y="292" font-size="11.5" font-weight="500" text-anchor="start" fill="#581c87">• ASKVH: düşük doz aspirin</text><text x="330" y="292" font-size="11.5" font-weight="500" text-anchor="start" fill="#581c87">• AF: VKA yerine NOAK (G1–G4)</text></g>
<g class="a k4"><rect x="10" y="68" width="620" height="132" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="24" y="92" font-size="14" font-weight="900" text-anchor="start" fill="#78350f">4 · Komplikasyonların yönetimi</text><text x="24" y="114" font-size="11.5" font-weight="500" text-anchor="start" fill="#78350f">• anemi · KBH-MKB</text><text x="330" y="114" font-size="11.5" font-weight="500" text-anchor="start" fill="#78350f">• metabolik asidoz (HCO₃ &lt;18 olmasın)</text><text x="24" y="132" font-size="11.5" font-weight="500" text-anchor="start" fill="#78350f">• potasyum bozuklukları</text><text x="330" y="132" font-size="11.5" font-weight="500" text-anchor="start" fill="#78350f">• semptomatik hiperürisemi: KOİ</text><text x="24" y="150" font-size="11.5" font-weight="500" text-anchor="start" fill="#78350f">• ilaç dozu GFR'ye göre</text><text x="330" y="150" font-size="11.5" font-weight="500" text-anchor="start" fill="#78350f">• kontrast · gadolinyum önlemi</text></g>
<g class="a fin"><rect x="236" y="8" width="394" height="54" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="433" y="31.5" font-size="12.5" font-weight="800" text-anchor="middle" fill="#1e293b">Finerenon: K ≤4,8 başla · 4,9–5,5 sürdür · >5,5 ara ver</text><text x="433" y="48.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">eGFR 25–59 → 10 mg · ≥60 → 20 mg · K: 1. ay, sonra 4 ayda bir</text></g>
<g class="a son"><text x="16" y="30" font-size="13" font-weight="800" text-anchor="start" fill="#0f172a">Katmanlar birbirinin</text><text x="16" y="48" font-size="13" font-weight="800" text-anchor="start" fill="#0f172a">YERİNE değil ÜSTÜNE kurulur</text></g>

</svg>
