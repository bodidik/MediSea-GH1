<g class="a b3"><rect x="166" y="208.8" width="44" height="91.19999999999999" rx="5" fill="#a78bfa"/><text x="188" y="202.8" font-size="11.5" font-weight="800" text-anchor="middle" fill="#4c1d95">%7,6</text><text x="188" y="316" font-size="10" font-weight="700" text-anchor="middle" fill="#475569">eGFR −%25</text></g>
<g class="a b4"><rect x="234" y="174" width="44" height="126" rx="5" fill="#a78bfa"/><text x="256" y="168" font-size="11.5" font-weight="800" text-anchor="middle" fill="#4c1d95">%10,5</text><text x="256" y="316" font-size="10" font-weight="700" text-anchor="middle" fill="#475569">bileşik</text></g>
<g class="a dal"><rect x="330" y="44" width="290" height="118" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="475" y="74" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Arka plan dalgalanması</text><text x="475" y="91" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">kontrast ALMAYAN yatan hastaların</text><text x="475" y="108" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">%6–35'i "kontrast nefropatisi"</text><text x="475" y="125" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">sayılırdı (günlük SCr oynaması)</text><text x="475" y="142" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">→ diğer ABH nedenlerini de ara</text><rect x="330" y="176" width="290" height="132" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="475" y="213" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Tanım</text><text x="475" y="230" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">KDIGO: diğer ABH ile AYNI ölçüt</text><text x="475" y="247" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">eski: 48 sa içinde SCr ≥0,5 mg/dL</text><text x="475" y="264" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">ya da %25 ↑</text><text x="475" y="281" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">azınlıkta zirve 5. güne dek gecikir</text></g>
