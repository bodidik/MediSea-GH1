<g class="a k2"><path class="a ciz" pathLength="1" d="M212,531 L224,531" stroke="#0284c7" stroke-width="2.2" fill="none" marker-end="url(#okM)"/><rect x="226" y="494" width="190" height="74" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="321" y="519" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">2 · Kontrast</text><text x="321" y="536" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">en düşük doz</text><text x="321" y="553" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">iso/düşük ozmolar (1B)</text></g>
<g class="a k3"><path class="a ciz" pathLength="1" d="M418,531 L430,531" stroke="#0284c7" stroke-width="2.2" fill="none" marker-end="url(#okM)"/><rect x="432" y="494" width="188" height="74" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="526" y="519" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">3 · Hacim</text><text x="526" y="536" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">IV izotonik NaCl ya da</text><text x="526" y="553" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">NaHCO₃ (1A)</text></g>
<g class="a k4"><rect x="20" y="580" width="600" height="44" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="607" font-size="13" font-weight="800" text-anchor="middle" fill="#1e293b">Yalnız oral sıvı YETMEZ (1C) · oral NAC yalnız IV sıvıyla birlikte (2D)</text></g>
<g class="a yok"><rect x="20" y="634" width="600" height="48" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="663" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">ÖNERİLMEZ: teofilin (2C) · fenoldopam (1B) · profilaktik HD/hemofiltrasyon (2C)</text></g>

