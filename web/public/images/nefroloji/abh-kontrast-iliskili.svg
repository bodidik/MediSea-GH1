<g class="a b1"><rect x="30" y="260.4" width="44" height="39.599999999999994" rx="5" fill="#a78bfa"/><text x="52" y="254.4" font-size="11.5" font-weight="800" text-anchor="middle" fill="#4c1d95">%3,3</text><text x="52" y="316" font-size="10" font-weight="700" text-anchor="middle" fill="#475569">SCr +0,5</text></g>
