.b1 .ciz{animation-name:b1c}@keyframes b1c{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.b2{animation-name:b2}@keyframes b2{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.b2 .ciz{animation-name:b2c}@keyframes b2c{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
