.b3 .ciz{animation-name:b3c}@keyframes b3c{0%,16%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.b4{animation-name:b4}@keyframes b4{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.b4 .ciz{animation-name:b4c}@keyframes b4c{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.dal{animation-name:dal}@keyframes dal{0%,28%{opacity:0;transform:translateY(7px)}31%,100%{opacity:1;transform:none}}
.dal .ciz{animation-name:dalc}@keyframes dalc{0%,28%{stroke-dashoffset:1}32%,100%{stroke-dashoffset:0}}
.risk{animation-name:risk}@keyframes risk{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.risk .ciz{animation-name:riskc}@keyframes riskc{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.k1{animation-name:k1}@keyframes k1{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.k1 .ciz{animation-name:k1c}@keyframes k1c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.k2{animation-name:k2}@keyframes k2{0%,56%{opacity:0;transform:translateY(7px)}59%,100%{opacity:1;transform:none}}
.k2 .ciz{animation-name:k2c}@keyframes k2c{0%,56%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.k3{animation-name:k3}@keyframes k3{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.k3 .ciz{animation-name:k3c}@keyframes k3c{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.k4{animation-name:k4}@keyframes k4{0%,68%{opacity:0;transform:translateY(7px)}71%,100%{opacity:1;transform:none}}
.k4 .ciz{animation-name:k4c}@keyframes k4c{0%,68%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.yok{animation-name:yok}@keyframes yok{0%,78%{opacity:0;transform:translateY(7px)}81%,100%{opacity:1;transform:none}}
.yok .ciz{animation-name:yokc}@keyframes yokc{0%,78%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
