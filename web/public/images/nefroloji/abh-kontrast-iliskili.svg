<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" width="640" height="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kontrast ilişkili ABH: tanım tuzağı, risk ve korunma basamakları</title>
<desc id="d">KDIGO 2012, damar içi iyotlu kontrast sonrası ABH'nin diğer ABH'lerle aynı ölçütlerle tanımlanıp evrelenmesini ve başka nedenlerin de aranmasını önerir. Literatürdeki eski 'kontrast nefropatisi' tanımı 48 saat içinde kreatininin en az 0,5 mg/dL ya da yüzde 25 artmasıdır. Tanım sonucu belirler: Oxilan kayıtlarında oran kreatinin 0,5 mg/dL artışıyla yüzde 3,3, yüzde 25 artışla 10,2, eGFR'de yüzde 25 düşüşle 7,6, bileşik tanımla 10,5 idi. Kontrast almayan hastanede yatan hastaların yüzde 6–35'i, kreatinin günlük oynaması yüzünden kontrast alsalardı 'kontrast nefropatisi' sayılırdı. Normal böbrek işlevinde, diyabet olsa bile risk yüzde 1–2; önceden böbrek işlev bozukluğu ve KBH ile diyabet birlikteliği, kalp yetersizliği, ileri yaş ve nefrotoksik ilaçla yüzde 25'e çıkabilir. Hastanede yeni ABH'nin üçüncü sık nedenidir (yüzde 11). Korunma: risk değerlendirmesi ve böbrek işlevinin taranması, alternatif görüntüleme, en düşük kontrast dozu, iso ya da düşük ozmolar kontrast (1B), izotonik sodyum klorür ya da sodyum bikarbonatla damar içi hacim genişletme (1A), yalnız oral sıvıdan kaçınma (1C), damar içi sıvıyla birlikte oral NAC (2D); teofilin (2C), fenoldopam (1B) ve profilaktik hemodiyaliz ya da hemofiltrasyon (2C) önerilmez.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: aki-semalar.cjs -->
<style>
