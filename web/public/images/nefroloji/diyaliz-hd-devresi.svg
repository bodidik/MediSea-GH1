<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" width="640" height="680" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hemodiyaliz devresi: damar yolundan diyalizöre ve geri, güvenlik monitörleri ve su arıtımı</title>
<desc id="d">Kan pompası kanı damar yolundan alır, diyalizörden geçirip hastaya geri verir; kan akımı tipik olarak 250–450 mL/dakikadır ve herhangi bir anda vücut dışında yaklaşık 200–250 mL kan bulunur. Arter basıncı pompadan önce ölçülür (aşırı emmeyi önlemek için); yüksek negatif arter basıncı olgunlaşmamış erişim, stenoz ya da damar duvarına emmeyi düşündürür. Ven basıncı kan erişime dönmeden önce ölçülür; yüksekliği ven çıkışında stenoz, kateterin ven ucunda pıhtı ya da hatların bükülmesini düşündürür. Diyalizat ters yönde 500–800 mL/dakikayla akar ve genellikle kan akımından 100–200 mL/dk fazla ayarlanır; diyalizat tarafındaki negatif basınç ultrafiltrasyonu belirler. Güvenlik: hava tuzağı (hava embolisi), kan kaçağı dedektörü ve diyalizat iletkenliği. Her seansta 100–120 litre su kullanılır; su yumuşatıcı, karbon filtre (kloramin çok düşük düzeyde bile hemoliz yapar), ters ozmoz ya da deiyonizasyonla arıtılır. Tipik diyalizat: sodyum 137 (135–148), potasyum 2 (0–3), kalsiyum 2,5 mEq/L, magnezyum 0,75, klor 106, bikarbonat 33, asetat 4 mEq/L, dekstroz 100–200 mg/dL.</desc>
