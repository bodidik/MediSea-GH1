<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" width="640" height="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ultrafiltrasyon, plazma yeniden dolumu ve intradiyalitik hipotansiyon</title>
<desc id="d">Diyaliz sıvıyı damar içinden hızla çeker; kan basıncının korunması, damar dışı bölmeden damar içine sıvı geçişine (plazma yeniden dolumu) bağlıdır. Ultrafiltrasyon hızı yeniden dolumu aşarsa hipotansiyon gelişir. Hipotansiyon hemodiyalizin en sık akut komplikasyonudur, seansların yüzde 30'una dek görülür ve diyabetlilerde sıktır. Risk etkenleri: aşırı ultrafiltrasyon ve seanslar arası büyük kilo artışı, otonom ve vazoaktif yanıt bozukluğu, ozmolar kaymalar, seans öncesi antihipertansif, azalmış kalp rezervi, düşük diyalizat sodyumu, yüksek diyalizat sıcaklığı, yemek. Kateterli hastada bakteriyemi, ayrıca aritmi, tamponad, hemoliz, diyalizör reaksiyonu, kanama ve hava embolisi düşünülür. Tedavi: ultrafiltrasyonu durdur, kan akımını azalt, 100–250 mL izotonik salin ya da tuzdan fakir albümin. Önleme: kuru ağırlığın dikkatli belirlenmesi, ultrafiltrasyonun başta daha fazla yapılması, saatte 13 mL/kg'ı aşan sıvı çekiminden kaçınılması (kardiyovasküler ölümle ilişkili), diyalizatın soğutulması, diyalizat kalsiyumunun artırılması, seansta ağır yemekten kaçınma, aneminin düzeltilmesi. Midodrin konusunda kaynaklar ayrışır. Kronik volüm yükü hipertansiyon ve sol ventrikül hipertrofisine, tekrarlayan hipotansiyon ise bölgesel duvar hareket bozukluklarına yol açar.</desc>
