<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" width="640" height="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KBH-MKB: intakt PTH ile renal osteodistrofi yorumu</title>
<desc id="d">İntakt PTH üç bölgeye ayrılır. Diyalizde kalıcı olarak 100 pg/mL altı adinamik kemiği düşündürür; diyaliz dışında tek başına göstermez, başlangıçta yüksekken aktif D vitamini altında normalin üst sınırının altına inmesi düşündürür. 100 ile 450 pg/mL arası kemik türünü öngörmez; kemik ağrısı ya da açıklanamayan hiperkalsemi veya hipofosfatemi varsa BSAP bakılır, 20 ng/mL ve üstü adinamik kemiği neredeyse dışlar. 450 pg/mL üstü osteitis fibroza kistika ve/veya mikst üremik osteodistrofiyi düşündürür, 500 pg/mL üstünde adinamik kemik olası değildir. Belirteçler uyumsuzsa ve sonuç kararı değiştirecekse kemik biyopsisi yapılır.</desc>
<!-- 14 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:14s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,10%{opacity:0;transform:translateY(8px)}13%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,10%{stroke-dashoffset:1}15%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,20%{opacity:0;transform:translateY(8px)}23%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,20%{stroke-dashoffset:1}25%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,31%{opacity:0;transform:translateY(8px)}34%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,31%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,41%{opacity:0;transform:translateY(8px)}44%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,41%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,51%{opacity:0;transform:translateY(8px)}54%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,51%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,61%{opacity:0;transform:translateY(8px)}64%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,61%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,72%{opacity:0;transform:translateY(8px)}75%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,72%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
.s9{animation-name:s9}@keyframes s9{0%,82%{opacity:0;transform:translateY(8px)}85%, 100%{opacity:1;transform:none}}
.s9 .ciz{animation-name:c9}@keyframes c9{0%,82%{stroke-dashoffset:1}87%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="690" fill="#ffffff"/>
<g class="a m s1"><rect x="150" y="20" width="340" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="53" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">İntakt PTH</text><text x="320" y="73" text-anchor="middle" font-size="13" fill="#0f172a">tek değer değil, eğilim · aynı yöntem</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M230,96 L110,146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M320,96 L320,146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M410,96 L530,146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s3"><rect x="15" y="150" width="195" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="112.5" y="200" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">&lt; 100 pg/mL</text><text x="112.5" y="220" text-anchor="middle" font-size="13" fill="#4c1d95">kalıcıysa</text><text x="112.5" y="240" text-anchor="middle" font-size="13" fill="#4c1d95">diyalizde adinamik</text><text x="112.5" y="260" text-anchor="middle" font-size="13" fill="#4c1d95">kemiği düşündürür</text></g><g class="a m s4"><rect x="222" y="150" width="196" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="200" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">100–450 pg/mL</text><text x="320" y="220" text-anchor="middle" font-size="13" fill="#78350f">kemik türünü</text><text x="320" y="240" text-anchor="middle" font-size="13" fill="#78350f">ÖNGÖRMEZ</text><text x="320" y="260" text-anchor="middle" font-size="13" fill="#78350f">normal · yüksek · düşük</text></g><g class="a m s5"><rect x="430" y="150" width="195" height="150" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="527.5" y="200" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">&gt; 450 pg/mL</text><text x="527.5" y="220" text-anchor="middle" font-size="13" fill="#7f1d1d">OFC ve/veya MUO</text><text x="527.5" y="240" text-anchor="middle" font-size="13" fill="#7f1d1d">düşündürür; &gt; 500'de</text><text x="527.5" y="260" text-anchor="middle" font-size="13" fill="#7f1d1d">adinamik olası değil</text></g><g class="a s6"><path class="a ciz" pathLength="1" d="M112,300 L112,345" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M320,300 L320,345" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s6"><rect x="15" y="350" width="195" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="112.5" y="390" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Diyaliz dışı</text><text x="112.5" y="410" text-anchor="middle" font-size="13" fill="#4c1d95">&lt; 100 tek başına</text><text x="112.5" y="430" text-anchor="middle" font-size="13" fill="#4c1d95">göstermez; yüksekten</text><text x="112.5" y="450" text-anchor="middle" font-size="13" fill="#4c1d95">aktif D altında</text><text x="112.5" y="470" text-anchor="middle" font-size="13" fill="#4c1d95">ÜSN altına iniş</text></g><g class="a m s7"><rect x="222" y="350" width="403" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="423.5" y="390" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Semptom varsa BSAP</text><text x="423.5" y="410" text-anchor="middle" font-size="13" fill="#78350f">kemik ağrısı · açıklanamayan hiperkalsemi/hipofosfatemi</text><text x="423.5" y="430" text-anchor="middle" font-size="13" fill="#78350f">≥ 20 ng/mL: adinamik kemik neredeyse dışlanır</text><text x="423.5" y="450" text-anchor="middle" font-size="13" fill="#78350f">(özellikle PTH &gt; 200 pg/mL ise)</text><text x="423.5" y="470" text-anchor="middle" font-size="13" fill="#78350f">düşük/sınırda BSAP + düşük PTH: uyumlu, kanıt değil</text></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,500 L320,545" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s8"><rect x="95" y="550" width="450" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="583" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Belirteçler uyumsuz, sonuç kararı değiştirecek</text><text x="320" y="603" text-anchor="middle" font-size="13" fill="#1e3a8a">tetrasiklin çift etiketli iliak kemik biyopsisi</text></g><g class="a s9"><text x="320" y="664" text-anchor="middle" font-size="12" fill="#475569">Eşikler UpToDate (Nickolas, Quarles); bireysel hastada duyarlılık ve özgüllük sınırlıdır. ÜSN: normalin üst sınırı.</text></g>
</svg>
