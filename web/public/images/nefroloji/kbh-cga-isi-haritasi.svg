<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KDIGO 2024: KBH'nin GFR ve albüminüri kategorileri, risk ısı haritası ve izlem sıklığı</title>
<desc id="d">KBH, sağlık açısından sonucu olan böbrek yapı ya da işlev bozukluğunun en az 3 ay sürmesidir ve neden, GFR kategorisi (G1–G5) ve albüminüri kategorisine (A1–A3) göre sınıflanır (CGA). GFR kategorileri: G1 90 ve üstü, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29, G5 15'in altı mL/dk/1,73 m². Albüminüri: A1 30 mg/g altı, A2 30–299, A3 300 mg/g ve üstü. Renk ilerleme riskini gösterir: yeşil düşük, sarı orta, turuncu yüksek, kırmızı ve koyu kırmızı çok yüksek. Hücredeki sayı yılda kaç kez GFR ve albüminüri ölçüleceğine rehberdir: G1 ve G2'de 1, 1, 3; G3a'da 1, 2, 3; G3b'de 2, 3, 3; G4'te 3, 3, 4 ve üstü; G5'te 4 ve üstü. Başka hasar belirteci yoksa G1–G2 A1 KBH değildir.</desc>
