<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kan gazını adım adım çözümleme</title>
<desc id="d">Beş adım: pH'a bak (7,35 altı asidemi, 7,45 üstü alkalemi); primer bozukluğu bul (HCO3 ya da PCO2); beklenen kompanzasyonu hesapla (Winters 1,5 × HCO3 + 8 ± 2; alkalozda 0,7; respiratuvarda akut 1 ya da 2, kronik 3,5–4 ya da 4–5 mEq/L her 10 mmHg için); anyon açığını hesapla ve albümine göre düzelt (2,5 mEq/L her 1 g/dL); yüksek açıkta delta oranı, normal açıkta idrar anyon açığı, metabolik alkalozda idrar klorürü.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="900" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,100 L320,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,262 L320,290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,476 L320,504" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M220,606 L108,650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M320,606 L320,650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M420,606 L532,650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="18" width="560" height="82" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">1 · pH</text><text x="320" y="66" text-anchor="middle" font-size="13" fill="#0f172a">&lt;7,35 asidemi · &gt;7,45 alkalemi</text><text x="320" y="86" text-anchor="middle" font-size="13" fill="#0f172a">normal pH karma bozukluğu dışlamaz</text></g>
<g class="a m s2"><rect x="40" y="130" width="560" height="132" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="156" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">2 · Primer bozukluk</text><text x="180" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Asidemi</text><text x="180" y="206" text-anchor="middle" font-size="13" fill="#1e3a8a">HCO₃⁻ ↓ → metabolik asidoz</text><text x="180" y="228" text-anchor="middle" font-size="13" fill="#1e3a8a">PCO₂ ↑ → respiratuvar asidoz</text><text x="460" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Alkalemi</text><text x="460" y="206" text-anchor="middle" font-size="13" fill="#1e3a8a">HCO₃⁻ ↑ → metabolik alkaloz</text><text x="460" y="228" text-anchor="middle" font-size="13" fill="#1e3a8a">PCO₂ ↓ → respiratuvar alkaloz</text></g>
<g class="a m s3"><rect x="40" y="292" width="560" height="184" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="318" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">3 · Beklenen kompanzasyon</text><text x="320" y="344" text-anchor="middle" font-size="13" fill="#78350f">Metabolik asidoz: PCO₂ = 1,5 × HCO₃⁻ + 8 ± 2</text><text x="320" y="366" text-anchor="middle" font-size="13" fill="#78350f">Metabolik alkaloz: +0,7 mmHg / 1 mEq/L HCO₃⁻</text><text x="320" y="392" text-anchor="middle" font-size="13" fill="#78350f">Her 10 mmHg PCO₂ için HCO₃⁻ değişimi:</text><text x="320" y="414" text-anchor="middle" font-size="13" fill="#78350f">asidoz akut +1 · kronik +3,5–4</text><text x="320" y="436" text-anchor="middle" font-size="13" fill="#78350f">alkaloz akut −2 · kronik −4–5</text><text x="320" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">beklenenin dışı → ikinci bozukluk</text></g>
<g class="a m s4"><rect x="40" y="506" width="560" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="534" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">4 · Anyon açığı (her hastada)</text><text x="320" y="558" text-anchor="middle" font-size="13" fill="#4c1d95">Na⁺ − (Cl⁻ + HCO₃⁻) · normal ~4–12, laboratuvara bağlı</text><text x="320" y="582" text-anchor="middle" font-size="13" fill="#4c1d95">+2,5 × (4,5 − albümin g/dL)</text></g>
<g class="a m s5"><rect x="10" y="652" width="196" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="108" y="684" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Yüksek açık</text><text x="108" y="708" text-anchor="middle" font-size="13" fill="#7f1d1d">Δ açık ÷ Δ HCO₃⁻</text><text x="108" y="734" text-anchor="middle" font-size="13" fill="#7f1d1d">&lt;1 ek normal açıklı</text><text x="108" y="756" text-anchor="middle" font-size="13" fill="#7f1d1d">~1 basit</text><text x="108" y="778" text-anchor="middle" font-size="13" fill="#7f1d1d">1–2 laktik (ort. 1,6)</text><text x="108" y="800" text-anchor="middle" font-size="13" fill="#7f1d1d">&gt;2 ek alkaloz</text><text x="108" y="830" text-anchor="middle" font-size="12" fill="#7f1d1d">GOLDMARK</text></g>
<g class="a m s5"><rect x="222" y="652" width="196" height="200" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="684" text-anchor="middle" font-size="14" font-weight="800" fill="#064e3b">Normal açık</text><text x="320" y="708" text-anchor="middle" font-size="13" fill="#064e3b">idrar anyon açığı</text><text x="320" y="734" text-anchor="middle" font-size="13" fill="#064e3b">−20 ile −50 → ishal</text><text x="320" y="756" text-anchor="middle" font-size="13" fill="#064e3b">pozitif → RTA</text><text x="320" y="778" text-anchor="middle" font-size="13" fill="#064e3b">±20 → yorumlanamaz</text></g>
<g class="a m s5"><rect x="434" y="652" width="196" height="200" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="532" y="684" text-anchor="middle" font-size="14" font-weight="800" fill="#0c4a6e">Metabolik alkaloz</text><text x="532" y="708" text-anchor="middle" font-size="13" fill="#0c4a6e">idrar Cl⁻</text><text x="532" y="734" text-anchor="middle" font-size="13" fill="#0c4a6e">&lt;20 → kusma,</text><text x="532" y="756" text-anchor="middle" font-size="13" fill="#0c4a6e">etkisi geçmiş diüretik</text><text x="532" y="782" text-anchor="middle" font-size="13" fill="#0c4a6e">&gt;20 → mineralokortikoid,</text><text x="532" y="804" text-anchor="middle" font-size="13" fill="#0c4a6e">etkin diüretik,</text><text x="532" y="826" text-anchor="middle" font-size="13" fill="#0c4a6e">Bartter/Gitelman</text></g>
</svg>
