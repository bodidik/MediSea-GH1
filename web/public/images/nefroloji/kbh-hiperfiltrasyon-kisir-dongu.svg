<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KBH'nin kendi kendini sürdüren ilerlemesi: nefron kaybı ve hiperfiltrasyon döngüsü</title>
<desc id="d">Nefron kaybından sonra kalan nefronlara yük biner: afferent arteriyol genişler, böbrek kan akımı ve glomerül içi basınç artar, glomerüler hiperfiltrasyon gelişir. Hiperfiltrasyon oksijen tüketimini artırır; oksidatif stres, proinflamatuvar sitokinler ve TGF-beta gibi profibrotik etkenler devreye girer. Sonuçta albüminüri, podosit kaybı, glomerüloskleroz ve tübülointerstisyel hasar gelişir ve yeni nefronlar kaybedilir. Döngüyü yüksek protein alımı (afferent dilatasyon), diyabet (glukoz yükü proksimal sodyum geri emilimini artırır, makula densaya ulaşan sodyum azalır, tübüloglomerüler geri bildirim baskılanır, afferent arteriyol anormal genişler) ve tuz-hipertansiyon (intrarenal anjiyotensin II, kan basıncı) hızlandırır. KBH'de böbrek dokusunun oksijenlenmesi belirgin azalmıştır; albüminüri yalnız glomerül bariyer hasarını değil mikrovasküler işlev bozukluğunu ve bozulmuş oksijen sunumunu da yansıtır.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kbh-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.n1{animation-name:n1}@keyframes n1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.n1 .ciz{animation-name:n1c}@keyframes n1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o1{animation-name:o1}@keyframes o1{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.n2{animation-name:n2}@keyframes n2{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.n2 .ciz{animation-name:n2c}@keyframes n2c{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.n3{animation-name:n3}@keyframes n3{0%,26%{opacity:0;transform:translateY(7px)}29%,100%{opacity:1;transform:none}}
.n3 .ciz{animation-name:n3c}@keyframes n3c{0%,26%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.n4{animation-name:n4}@keyframes n4{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.n4 .ciz{animation-name:n4c}@keyframes n4c{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.mer{animation-name:mer}@keyframes mer{0%,56%{opacity:0;transform:translateY(7px)}59%,100%{opacity:1;transform:none}}
.mer .ciz{animation-name:merc}@keyframes merc{0%,56%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.hiz{animation-name:hiz}@keyframes hiz{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.hiz .ciz{animation-name:hizc}@keyframes hizc{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,84%{opacity:0;transform:translateY(7px)}87%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,84%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
.nab{animation-name:nab;transform-box:fill-box;transform-origin:center}@keyframes nab{0%,58%{transform:scale(1)}62%{transform:scale(1.07)}66%{transform:scale(1)}70%{transform:scale(1.07)}74%,100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
