<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hemodiyaliz dozu: Kt/V, üre azalma oranı ve haftalık üre testere dişi</title>
<desc id="d">Diyaliz dozu seans başına fraksiyonel üre klirensinden türetilir: Kt/V, diyalizör üre klirensi (K) ile seans süresinin (t) çarpımının üre dağılım hacmine (V, yaklaşık toplam vücut suyu) oranıdır. Doz ayda bir, seans öncesi ve sonrası BUN ile ölçülür; seans sonrası örnek resirkülasyonu önlemek için standart yöntemle (akımı durdurma ya da yavaşlatma) alınır. Haftada üç seansta hedef: üre azalma oranı yüzde 65–70'in üstü, Kt/V en az 1,2 (dengelenmiş değerde 1,05); bunu verebilmek için reçetelenen Kt/V en az 1,3 olmalıdır. Haftada üçten farklı programlarda standart Kt/V en az 2,0. Çoğu hasta haftada 9–12 saat diyalize gerek duyar. HEMO çalışmasında seans başına üre klirensindeki büyük fark ölümü değiştirmedi. Haftada 6 seans (FHN) hipertansiyon ve hiperfosfatemi kontrolünü, sol ventrikül kütlesini ve fiziksel sağlığı iyileştirdi. Uzun hafta sonu aralığından sonra ölüm ve kalp yetersizliği nedeniyle yatış artar; ani kardiyak ölüm 3 günlük arada 2 günlük aradan sıktır. Doz yalnız üreyle değil sıvı çekimi, potasyum, fosfat ve asidoz kontrolüyle de değerlendirilir; rezidüel böbrek işlevi korunmalıdır.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: dz-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.eks{animation-name:eks}@keyframes eks{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.eks .ciz{animation-name:eksc}@keyframes eksc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.egri{animation-name:egri}@keyframes egri{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.egri .ciz{animation-name:egric}@keyframes egric{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.haf{animation-name:haf}@keyframes haf{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.haf .ciz{animation-name:hafc}@keyframes hafc{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.hed{animation-name:hed}@keyframes hed{0%,54%{opacity:0;transform:translateY(7px)}57%,100%{opacity:1;transform:none}}
.hed .ciz{animation-name:hedc}@keyframes hedc{0%,54%{stroke-dashoffset:1}58%,100%{stroke-dashoffset:0}}
.kan{animation-name:kan}@keyframes kan{0%,68%{opacity:0;transform:translateY(7px)}71%,100%{opacity:1;transform:none}}
.kan .ciz{animation-name:kanc}@keyframes kanc{0%,68%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,82%{opacity:0;transform:translateY(7px)}85%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,82%{stroke-dashoffset:1}86%,100%{stroke-dashoffset:0}}
.ure{stroke-dasharray:1;animation-name:ure}@keyframes ure{0%,8%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
