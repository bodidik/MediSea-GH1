<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" width="640" height="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hemodiyaliz damar yolu: arteriyovenöz fistülün mantığı, yer sırası, zamanlama ve komplikasyonlar</title>
<desc id="d">Arteriyovenöz fistülde bir arter bir vene bağlanır (ör. Brescia-Cimino: bilekte sefalik ven radiyal artere uç-yan anastomoz) ve ven arterleşir; böylece büyük iğnelerle (genellikle 15–16 G) girilebilir. Fistül, tüm seçenekler içinde uzun dönem açık kalma oranı en yüksek olan damar yoludur. Yer sırası: bilekte radiyosefalik, diğer önkol primer fistülleri, dirsekte brakiyosefalik, transpoze brakiyobazilik ven fistülü; ilk fistüller baskın olmayan kola açılır. GFR 30'un altına inince kalıcı erişime uygun venlere girişim yapılmaz, subklavyen kateter ve PICC'den kaçınılır. Fistül hemodiyaliz başlangıcından en az 6 ay önce, greft 3–6 hafta önce açılır. Greft (çoğu politetrafloroetilen) fistül açılamazsa kullanılır; en önemli komplikasyonu greft–ven anastomozundaki intimal hiperplaziye bağlı tromboz ve yetersizliktir. Greft ve özellikle kateterlerde enfeksiyon fistülden çok daha sıktır. Tünelli kateter genellikle iç juguler vene, var olan ya da planlanan fistülün karşı tarafına takılır; subklavyen stenoz aynı taraf kolda kalıcı erişimi engelleyebilir. Yüzde 50'nin üstünde, bulgu ya da tromboz öyküsüyle birlikte olan stenoz cerrahi revizyon ya da anjiyoplastiyle düzeltilir. Kateter, ön pompa arter basıncı −250 mmHg'de en az 300 mL/dk akım veremiyorsa işlev bozukluğu vardır. Enfekte kateter, parenteral antibiyotikle 36–48 saatte düzelme yoksa ya da hasta dengesizse çıkarılır.</desc>
