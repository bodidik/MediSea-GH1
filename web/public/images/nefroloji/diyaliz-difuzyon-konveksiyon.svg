<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Diyaliz membranında difüzyon ve konveksiyon: hangi molekül ne kadar temizlenir?</title>
<desc id="d">Hemodiyalizde solüt temizlenmesi büyük ölçüde difüzyonla olur: atık maddeler yarı geçirgen membrandan konsantrasyon gradyanı yönünde kandan diyalizata geçer. Difüzyon hızı gradyanın büyüklüğü, membran yüzey alanı ve membranın kütle aktarım katsayısıyla artar; kan ve diyalizatın ters yönde (karşı akım) akması gradyanı en üstte tutar. Molekül büyüdükçe geçiş yavaşlar: üre (60 Da) çok iyi temizlenir, kreatininin (113 Da) klirensi ürenin yaklaşık yüzde 20 altındadır. Beta-2 mikroglobulin (11.800 Da) yüksek akışlı membranlarla daha iyi temizlense de anürik hastada serum düzeyi belirgin yüksek kalır ve diyalize bağlı amiloidozun nedenidir. Proteine bağlı maddelerin yalnız serbest kısmı geçebilir. Fosfat plazmadan hızla uzaklaştırılır ama hücre içi ve kemikle dengelenme yavaştır; asıl belirleyici haftalık diyaliz süresidir. Konveksiyonda hidrostatik ya da ozmotik basınç suyu membrandan iter, su da solütleri sürükler (ultrafiltrasyon); hemofiltrasyonda baskın mekanizma budur ve daha büyük molekülleri uzaklaştırabilir.</desc>
