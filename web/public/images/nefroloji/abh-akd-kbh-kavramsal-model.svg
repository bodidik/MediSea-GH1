<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ABH, akut böbrek hastalığı (AKD) ve KBH ilişkisi; ABH'nin kavramsal modeli</title>
<desc id="d">ABH, akut böbrek hastalıkları ve bozukluklarının (AKD) bir alt kümesidir; ABH de, ABH olmayan AKD de KBH'nin üstüne binebilir. AKD: ABH, ya da 3 aydan kısa süren GFR 60'ın altı, ya da 3 aydan kısa süren GFR'de en az yüzde 35 düşüş veya kreatininde yüzde 50'den fazla artış, ya da 3 aydan kısa süren böbrek hasarı. KBH: 3 aydan uzun süren GFR 60'ın altı ya da böbrek hasarı. Kavramsal modelde önceki risk durumundan hasara, GFR düşüşüne, böbrek yetmezliğine ve ölüme ilerleme vardır; her basamakta iyileşme mümkündür. Hasar belirteçleri (NGAL, KIM-1, IL-18) erken yükselir, kreatinin ve üre geride kalır; işlev bozuldukça tedavi penceresi kapanır ve ölüm artar. ABH'den iyileşen hastaların yaklaşık yüzde 30'u KBH, kardiyovasküler hastalık ve ölüm açısından artmış risk taşır; bu nedenle ABH'den 3 ay sonra değerlendirme önerilir.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: aki-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.akd{animation-name:akd}@keyframes akd{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.akd .ciz{animation-name:akdc}@keyframes akdc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.aki{animation-name:aki}@keyframes aki{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.aki .ciz{animation-name:akic}@keyframes akic{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.kbh{animation-name:kbh}@keyframes kbh{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.kbh .ciz{animation-name:kbhc}@keyframes kbhc{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.tan{animation-name:tan}@keyframes tan{0%,30%{opacity:0;transform:translateY(7px)}33%,100%{opacity:1;transform:none}}
.tan .ciz{animation-name:tanc}@keyframes tanc{0%,30%{stroke-dashoffset:1}34%,100%{stroke-dashoffset:0}}
.zin{animation-name:zin}@keyframes zin{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.zin .ciz{animation-name:zinc}@keyframes zinc{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.pen{animation-name:pen}@keyframes pen{0%,60%{opacity:0;transform:translateY(7px)}63%,100%{opacity:1;transform:none}}
.pen .ciz{animation-name:penc}@keyframes penc{0%,60%{stroke-dashoffset:1}64%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,78%{opacity:0;transform:translateY(7px)}81%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,78%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
.pencere{stroke-dasharray:1;animation-name:pencere}@keyframes pencere{0%,60%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a akd"><ellipse cx="210" cy="140" rx="180" ry="112" fill="#fef3c7" fill-opacity="0.7" stroke="#d97706" stroke-width="2"/><text x="110" y="70" font-size="18" font-weight="900" text-anchor="middle" fill="#92400e">AKD</text><text x="110" y="88" font-size="11" font-weight="600" text-anchor="middle" fill="#92400e">akut böbrek hastalığı</text></g>
<g class="a aki"><ellipse cx="200" cy="160" rx="96" ry="62" fill="#fecaca" fill-opacity="0.85" stroke="#dc2626" stroke-width="2"/><text x="170" y="160" font-size="18" font-weight="900" text-anchor="middle" fill="#7f1d1d">ABH</text><text x="170" y="178" font-size="11" font-weight="600" text-anchor="middle" fill="#7f1d1d">(AKI)</text></g>
<g class="a kbh"><ellipse cx="400" cy="160" rx="150" ry="96" fill="#bfdbfe" fill-opacity="0.55" stroke="#2563eb" stroke-width="2"/><text x="470" y="150" font-size="18" font-weight="900" text-anchor="middle" fill="#1e3a8a">KBH</text><text x="470" y="168" font-size="11" font-weight="600" text-anchor="middle" fill="#1e3a8a">> 3 ay</text><text x="306" y="186" font-size="10.5" font-weight="800" text-anchor="middle" fill="#4c1d95">ABH/AKD</text><text x="306" y="199" font-size="10.5" font-weight="800" text-anchor="middle" fill="#4c1d95">KBH üstüne</text></g>
<g class="a tan"><rect x="20" y="270" width="600" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="299.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">İşlevsel tanımlar (KDIGO 2012, Tablo 11)</text><text x="320" y="316.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">ABH: SCr 7 günde %50 ↑ · ya da 2 günde 0,3 mg/dL ↑ · ya da oligüri</text><text x="320" y="333.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">AKD: ABH · ya da &lt;3 ay GFR &lt;60 · ya da &lt;3 ay GFR ≥%35 ↓ / SCr >%50 ↑ · ya da &lt;3 ay hasar</text><text x="320" y="350.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">KBH: >3 ay GFR &lt;60 ya da >3 ay böbrek hasarı · NKD: GFR ≥60, hasar yok, SCr kararlı</text></g>
<g class="a zin"><text x="320" y="400" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Kavramsal model: ilerleme sağa, iyileşme sola</text><circle cx="60" cy="450" r="38" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><text x="60" y="455" font-size="12" font-weight="900" text-anchor="middle" fill="#a16207">Risk ↑</text><circle cx="184" cy="450" r="38" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="184" y="455" font-size="12" font-weight="900" text-anchor="middle" fill="#c2410c">Hasar</text><circle cx="308" cy="450" r="38" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="308" y="455" font-size="12" font-weight="900" text-anchor="middle" fill="#dc2626">GFR ↓</text><circle cx="432" cy="450" r="38" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><text x="432" y="455" font-size="12" font-weight="900" text-anchor="middle" fill="#b91c1c">Yetmezlik</text><circle cx="556" cy="450" r="38" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/><text x="556" y="455" font-size="12" font-weight="900" text-anchor="middle" fill="#7e22ce">Ölüm</text><path class="a ciz" pathLength="1" d="M102,442 L142,442" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/><path class="a ciz" pathLength="1" d="M142,460 L102,460" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><path class="a ciz" pathLength="1" d="M226,442 L266,442" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/><path class="a ciz" pathLength="1" d="M266,460 L226,460" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><path class="a ciz" pathLength="1" d="M350,442 L390,442" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/><path class="a ciz" pathLength="1" d="M390,460 L350,460" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><path class="a ciz" pathLength="1" d="M474,442 L514,442" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/></g>
<g class="a pen"><path class="a pencere" pathLength="1" d="M30,520 L610,520" stroke="#0284c7" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/><text x="30" y="510" font-size="11.5" font-weight="800" text-anchor="start" fill="#0369a1">hasar belirteçleri (NGAL, KIM-1, IL-18) ERKEN</text><text x="610" y="510" font-size="11.5" font-weight="800" text-anchor="end" fill="#0369a1">kreatinin ve üre GEÇ yükselir →</text><text x="320" y="540" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">tedavi penceresi işlev bozuldukça kapanır; ölüm artar</text></g>
<g class="a son"><rect x="20" y="558" width="600" height="72" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="582" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Uzun vade</text><text x="320" y="599" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ABH'den iyileşenlerin ~%30'u KBH, KVH ve ölüm açısından yüksek riskte kalır</text><text x="320" y="616" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ 3. ayda yeniden değerlendir: düzelme mi, yeni KBH mi, var olan KBH'nin kötüleşmesi mi?</text></g>

</svg>
