<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KDIGO akut böbrek hasarı tanımı ve evrelemesi: kreatinin ve idrar ölçütleri</title>
<desc id="d">KDIGO 2012'ye göre ABH şunlardan biridir: serum kreatininin 48 saat içinde en az 0,3 mg/dL artması; kreatininin son 7 gün içinde olduğu bilinen ya da varsayılan bir sürede bazal değerin en az 1,5 katına çıkması; ya da idrarın 6 saat boyunca 0,5 mL/kg/saatin altında olması. Evre 1: kreatinin bazalin 1,5–1,9 katı ya da en az 0,3 mg/dL artış; idrar 6–12 saat boyunca 0,5 mL/kg/sa altı. Evre 2: kreatinin 2,0–2,9 katı; idrar 12 saat ya da daha uzun 0,5 altı. Evre 3: kreatinin 3 katı ya da 4,0 mg/dL ve üstü ya da KRT başlanması; idrar 24 saat ya da daha uzun 0,3 mL/kg/sa altı ya da 12 saat ya da daha uzun anüri. Kreatinin ve idrar farklı evre gösterirse yüksek olan evre alınır. Şekildeki örnek hastada bazal 1,0 mg/dL; 2. günde 0,3 mg/dL'lik artışla tanı konur, 5. günde 2 katla evre 2, 6. günde 3 katla evre 3'e çıkar.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: aki-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.eks{animation-name:eks}@keyframes eks{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.eks .ciz{animation-name:eksc}@keyframes eksc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.egri{animation-name:egri}@keyframes egri{0%,6%{opacity:0;transform:translateY(7px)}9%,100%{opacity:1;transform:none}}
.egri .ciz{animation-name:egric}@keyframes egric{0%,6%{stroke-dashoffset:1}10%,100%{stroke-dashoffset:0}}
.m1{animation-name:m1}@keyframes m1{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.m1 .ciz{animation-name:m1c}@keyframes m1c{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.m2{animation-name:m2}@keyframes m2{0%,32%{opacity:0;transform:translateY(7px)}35%,100%{opacity:1;transform:none}}
.m2 .ciz{animation-name:m2c}@keyframes m2c{0%,32%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.m3{animation-name:m3}@keyframes m3{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.m3 .ciz{animation-name:m3c}@keyframes m3c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.ev1{animation-name:ev1}@keyframes ev1{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.ev1 .ciz{animation-name:ev1c}@keyframes ev1c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.ev2{animation-name:ev2}@keyframes ev2{0%,60%{opacity:0;transform:translateY(7px)}63%,100%{opacity:1;transform:none}}
.ev2 .ciz{animation-name:ev2c}@keyframes ev2c{0%,60%{stroke-dashoffset:1}64%,100%{stroke-dashoffset:0}}
.ev3{animation-name:ev3}@keyframes ev3{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.ev3 .ciz{animation-name:ev3c}@keyframes ev3c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
.not{animation-name:not}@keyframes not{0%,82%{opacity:0;transform:translateY(7px)}85%,100%{opacity:1;transform:none}}
.not .ciz{animation-name:notc}@keyframes notc{0%,82%{stroke-dashoffset:1}86%,100%{stroke-dashoffset:0}}
.kreg{stroke-dasharray:1;animation-name:kreg}@keyframes kreg{0%,6%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a eks"><text x="20" y="32" font-size="14" font-weight="800" text-anchor="start" fill="#0f172a">Bazal kreatinin 1,0 mg/dL olan bir hasta — örnek seyir (şematik)</text><line x1="70" y1="300" x2="600" y2="300" stroke="#475569" stroke-width="1.5"/><line x1="70" y1="300" x2="70" y2="60" stroke="#475569" stroke-width="1.5"/><text x="62" y="286.3076923076923" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">1</text><text x="62" y="197.84615384615387" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">2</text><text x="62" y="109.38461538461539" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">3</text><text x="62" y="56" font-size="11" font-weight="700" text-anchor="end" fill="#475569">SCr</text><text x="70" y="318" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">0. gün</text><text x="145.71428571428572" y="318" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">1. gün</text><text x="221.42857142857142" y="318" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">2. gün</text><text x="297.1428571428571" y="318" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">3. gün</text><text x="372.85714285714283" y="318" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">4. gün</text><text x="448.57142857142856" y="318" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">5. gün</text><text x="524.2857142857142" y="318" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">6. gün</text><text x="600" y="318" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">7. gün</text><line x1="70" y1="238.0769230769231" x2="600" y2="238.0769230769231" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="6 4"/><text x="604" y="242.0769230769231" font-size="11" font-weight="800" text-anchor="start" fill="#ca8a04">1,5×</text><line x1="70" y1="193.84615384615387" x2="600" y2="193.84615384615387" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="6 4"/><text x="604" y="197.84615384615387" font-size="11" font-weight="800" text-anchor="start" fill="#ea580c">2×</text><line x1="70" y1="105.38461538461539" x2="600" y2="105.38461538461539" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="604" y="109.38461538461539" font-size="11" font-weight="800" text-anchor="start" fill="#dc2626">3×</text></g>
<g class="a egri"><path class="a kreg" pathLength="1" d="M70.0,282.3 L145.7,277.9 L221.4,248.7 L297.1,233.7 L372.9,216.0 L448.6,180.6 L524.3,92.1 L600.0,78.8" stroke="#0f172a" stroke-width="3.2" fill="none"/></g>
<g class="a m1"><circle cx="221.42857142857142" cy="248.6923076923077" r="7" fill="#a16207" stroke="#fff" stroke-width="2.5"/><text x="211.42857142857142" y="214.6923076923077" font-size="11.5" font-weight="800" text-anchor="end" fill="#a16207">≥0,3 mg/dL / 48 sa</text><text x="211.42857142857142" y="228.6923076923077" font-size="11.5" font-weight="600" text-anchor="end" fill="#a16207">→ ABH tanısı</text></g>
<g class="a m2"><circle cx="448.57142857142856" cy="180.5769230769231" r="7" fill="#c2410c" stroke="#fff" stroke-width="2.5"/><text x="438.57142857142856" y="166.5769230769231" font-size="11.5" font-weight="800" text-anchor="end" fill="#c2410c">2,0–2,9× → Evre 2</text></g>
<g class="a m3"><circle cx="524.2857142857142" cy="92.11538461538467" r="7" fill="#b91c1c" stroke="#fff" stroke-width="2.5"/><text x="514.2857142857142" y="78.11538461538467" font-size="11.5" font-weight="800" text-anchor="end" fill="#b91c1c">≥3× → Evre 3</text></g>
<g class="a ev1"><rect x="20" y="344" width="600" height="62" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="56" y="381" font-size="15" font-weight="900" text-anchor="middle" fill="#713f12">Evre 1</text><text x="104" y="366" font-size="11.5" font-weight="600" text-anchor="start" fill="#713f12">1,5–1,9 × bazal</text><text x="104" y="382" font-size="11.5" font-weight="600" text-anchor="start" fill="#713f12">ya da ≥0,3 mg/dL (≥26,5 μmol/L) artış</text><text x="392" y="366" font-size="11.5" font-weight="600" text-anchor="start" fill="#713f12">&lt;0,5 mL/kg/sa</text><text x="392" y="382" font-size="11.5" font-weight="600" text-anchor="start" fill="#713f12">6–12 saat</text></g>
<g class="a ev2"><rect x="20" y="412" width="600" height="62" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="56" y="449" font-size="15" font-weight="900" text-anchor="middle" fill="#7c2d12">Evre 2</text><text x="104" y="434" font-size="11.5" font-weight="600" text-anchor="start" fill="#7c2d12">2,0–2,9 × bazal</text><text x="392" y="434" font-size="11.5" font-weight="600" text-anchor="start" fill="#7c2d12">&lt;0,5 mL/kg/sa</text><text x="392" y="450" font-size="11.5" font-weight="600" text-anchor="start" fill="#7c2d12">≥12 saat</text></g>
<g class="a ev3"><rect x="20" y="480" width="600" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="56" y="517" font-size="15" font-weight="900" text-anchor="middle" fill="#7f1d1d">Evre 3</text><text x="104" y="502" font-size="11.5" font-weight="600" text-anchor="start" fill="#7f1d1d">≥3,0 × bazal · ya da SCr ≥4,0 mg/dL</text><text x="104" y="518" font-size="11.5" font-weight="600" text-anchor="start" fill="#7f1d1d">ya da KRT başlanması</text><text x="392" y="502" font-size="11.5" font-weight="600" text-anchor="start" fill="#7f1d1d">&lt;0,3 mL/kg/sa ≥24 sa</text><text x="392" y="518" font-size="11.5" font-weight="600" text-anchor="start" fill="#7f1d1d">ya da anüri ≥12 saat</text></g>
<g class="a not"><text x="104" y="338" font-size="12" font-weight="900" text-anchor="start" fill="#0f172a">Serum kreatinin</text><text x="392" y="338" font-size="12" font-weight="900" text-anchor="start" fill="#0f172a">İdrar çıkışı</text><rect x="20" y="552" width="600" height="82" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="572.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Okuma kuralları</text><text x="320" y="589.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">kreatinin ve idrar farklı evre gösterirse YÜKSEK olan evre alınır</text><text x="320" y="606.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">SCr ≥4,0 ile evre 3 için önce tanım ölçütü (0,3 / 48 sa ya da 1,5×) sağlanmalı</text><text x="320" y="623.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">1,5× ölçütü: artış son 7 günde olmuş ya da öyle varsayılıyor olmalı</text></g>

</svg>
