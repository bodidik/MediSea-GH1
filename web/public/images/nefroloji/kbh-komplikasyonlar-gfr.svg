<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">GFR düştükçe KBH komplikasyonları: anemi, metabolik asidoz, mineral-kemik bozukluğu ve hiperkalemi</title>
<desc id="d">Büyük bir gerçek yaşam veri tabanında (KDIGO 2024 Tablo 29) 65 yaş altı erkeklerde ortalama hemoglobin eGFR 60'ın üstünde 15 g/dL civarındayken 45–59'da 14,1, 30–44'te 12,9, 15–29'da 11,7 ve 15'in altında 10,9 g/dL'ye iner. CKD-PC kohortlarında anemi (erkekte Hb 12'nin, kadında 11 g/dL'nin altı) G3 A1'de diyabetlilerde yüzde 14,9, diyabetsizlerde yüzde 11,5 iken G5 A3'te yüzde 60,7 ve 57,4'tür. Serum bikarbonatı eGFR 60'ın altında giderek düşer; bikarbonat 22 mmol/L'nin altı G3 A1'de yüzde 7,7 ve 6,7'den G5 A3'te yüzde 38,3 ve 35,9'a çıkar. Kalsiyum, fosfat, D vitamini metabolitleri, PTH ve FGF23 değişiklikleri erken başlar ve GFR düştükçe ilerler. Hiperkalemi eGFR 60'ın üstünde nadirdir ve GFR düştükçe sıklaşır.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kbh-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.eks{animation-name:eks}@keyframes eks{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.eks .ciz{animation-name:eksc}@keyframes eksc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.hb{animation-name:hb}@keyframes hb{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.hb .ciz{animation-name:hbc}@keyframes hbc{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.hbn{animation-name:hbn}@keyframes hbn{0%,24%{opacity:0;transform:translateY(7px)}27%,100%{opacity:1;transform:none}}
.hbn .ciz{animation-name:hbnc}@keyframes hbnc{0%,24%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}
.an{animation-name:an}@keyframes an{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.an .ciz{animation-name:anc}@keyframes anc{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.as{animation-name:as}@keyframes as{0%,48%{opacity:0;transform:translateY(7px)}51%,100%{opacity:1;transform:none}}
.as .ciz{animation-name:asc}@keyframes asc{0%,48%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
.mkb{animation-name:mkb}@keyframes mkb{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.mkb .ciz{animation-name:mkbc}@keyframes mkbc{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.k{animation-name:k}@keyframes k{0%,74%{opacity:0;transform:translateY(7px)}77%,100%{opacity:1;transform:none}}
.k .ciz{animation-name:kc}@keyframes kc{0%,74%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,86%{opacity:0;transform:translateY(7px)}89%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,86%{stroke-dashoffset:1}90%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="620" fill="#ffffff"/>

<g class="a eks"><text x="20" y="30" font-size="13" font-weight="800" text-anchor="start" fill="#0f172a">A · Ortalama hemoglobin (g/dL), &lt;65 yaş erkek</text><line x1="60" y1="300" x2="330" y2="300" stroke="#475569" stroke-width="1.4"/><line x1="60" y1="300" x2="60" y2="78" stroke="#475569" stroke-width="1.4"/><line x1="55" y1="300" x2="60" y2="300" stroke="#475569"/><text x="52" y="304" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">10</text><line x1="55" y1="230" x2="60" y2="230" stroke="#475569"/><text x="52" y="234" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">12</text><line x1="55" y1="160" x2="60" y2="160" stroke="#475569"/><text x="52" y="164" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">14</text><line x1="55" y1="90" x2="60" y2="90" stroke="#475569"/><text x="52" y="94" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">16</text><text x="78" y="316" font-size="9.5" font-weight="500" text-anchor="middle" fill="#64748b">90–104</text><text x="117" y="316" font-size="9.5" font-weight="500" text-anchor="middle" fill="#64748b">75–89</text><text x="156" y="316" font-size="9.5" font-weight="500" text-anchor="middle" fill="#64748b">60–74</text><text x="195" y="316" font-size="9.5" font-weight="500" text-anchor="middle" fill="#64748b">45–59</text><text x="234" y="316" font-size="9.5" font-weight="500" text-anchor="middle" fill="#64748b">30–44</text><text x="273" y="316" font-size="9.5" font-weight="500" text-anchor="middle" fill="#64748b">15–29</text><text x="312" y="316" font-size="9.5" font-weight="500" text-anchor="middle" fill="#64748b">&lt;15</text><text x="195" y="334" font-size="10.5" font-weight="600" text-anchor="middle" fill="#475569">eGFR kategorisi (mL/dk/1,73 m²)</text></g>
<g class="a hb"><path class="a ciz" pathLength="1" d="M78.0,125.0 L117.0,125.0 L156.0,128.5 L195.0,156.5 L234.0,198.5 L273.0,240.5 L312.0,268.5" stroke="#dc2626" stroke-width="3.2" fill="none"/><circle cx="78" cy="125" r="4" fill="#dc2626"/><circle cx="117" cy="125" r="4" fill="#dc2626"/><circle cx="156" cy="128.49999999999997" r="4" fill="#dc2626"/><circle cx="195" cy="156.50000000000003" r="4" fill="#dc2626"/><circle cx="234" cy="198.5" r="4" fill="#dc2626"/><circle cx="273" cy="240.50000000000003" r="4" fill="#dc2626"/><circle cx="312" cy="268.5" r="4" fill="#dc2626"/></g>
<g class="a hbn"><text x="201" y="146.50000000000003" font-size="11" font-weight="800" text-anchor="start" fill="#b91c1c">14,1</text><text x="240" y="188.5" font-size="11" font-weight="800" text-anchor="start" fill="#b91c1c">12,9</text><text x="279" y="230.50000000000003" font-size="11" font-weight="800" text-anchor="start" fill="#b91c1c">11,7</text><text x="310" y="286.5" font-size="11" font-weight="800" text-anchor="end" fill="#b91c1c">10,9</text></g>
<g class="a an"><text x="360" y="30" font-size="13" font-weight="800" text-anchor="start" fill="#0f172a">B · Sıklık: G3 A1 → G5 A3 (CKD-PC)</text><line x1="360" y1="300" x2="630" y2="300" stroke="#475569" stroke-width="1.4"/><rect x="372" y="261.26" width="34" height="38.74" rx="4" fill="#fca5a5"/><text x="389" y="255.26" font-size="11" font-weight="800" text-anchor="middle" fill="#0f172a">%14,9</text><text x="389" y="316" font-size="10.5" font-weight="700" text-anchor="middle" fill="#475569">G3A1</text><rect x="412" y="142.17999999999998" width="34" height="157.82000000000002" rx="4" fill="#dc2626"/><text x="429" y="136.17999999999998" font-size="11" font-weight="800" text-anchor="middle" fill="#0f172a">%60,7</text><text x="429" y="316" font-size="10.5" font-weight="700" text-anchor="middle" fill="#475569">G5A3</text><text x="410" y="334" font-size="11" font-weight="800" text-anchor="middle" fill="#7f1d1d">anemi (DM+)</text></g>
<g class="a as"><rect x="500" y="279.98" width="34" height="20.02" rx="4" fill="#c4b5fd"/><text x="517" y="273.98" font-size="11" font-weight="800" text-anchor="middle" fill="#0f172a">%7,7</text><text x="517" y="316" font-size="10.5" font-weight="700" text-anchor="middle" fill="#475569">G3A1</text><rect x="540" y="200.42000000000002" width="34" height="99.58" rx="4" fill="#7c3aed"/><text x="557" y="194.42000000000002" font-size="11" font-weight="800" text-anchor="middle" fill="#0f172a">%38,3</text><text x="557" y="316" font-size="10.5" font-weight="700" text-anchor="middle" fill="#475569">G5A3</text><text x="538" y="334" font-size="11" font-weight="800" text-anchor="middle" fill="#4c1d95">HCO₃ &lt;22 (DM+)</text><text x="495" y="66" font-size="10" font-weight="500" text-anchor="middle" fill="#475569">diyabetsizde: anemi %11,5 → %57,4 · HCO₃ &lt;22 %6,7 → %35,9</text></g>
<g class="a mkb"><rect x="10" y="356" width="300" height="112" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="383" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">Mineral-kemik bozukluğu</text><text x="160" y="400" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">Ca · P · D vit · PTH · FGF23</text><text x="160" y="417" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">değişiklikleri ERKEN başlar</text><text x="160" y="434" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">GFR düştükçe ilerler (KDIGO 2017)</text><text x="160" y="451" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">→ ayrıntı: KBH-MKB sayfası</text></g>
<g class="a k"><rect x="330" y="356" width="300" height="112" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="383" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">Hiperkalemi</text><text x="480" y="400" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">eGFR >60'ta nadir, GFR ↓ sıklaşır</text><text x="480" y="417" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">orta: K 6,0–6,4 → 24 sa tekrar / hastane</text><text x="480" y="434" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ağır: K ≥6,5 → hemen EKG + tedavi</text><text x="480" y="451" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">RASi/MRA'yı kesmek SON çare</text></g>
<g class="a son"><rect x="10" y="484" width="620" height="124" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="525.5" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Asidoz ve anemide tedavi çerçevesi (KDIGO 2024)</text><text x="320" y="542.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">HCO₃ 18 mmol/L'nin altına inmesin: ilaç ± diyet · BiCARB'da klinik yarar gösterilmedi</text><text x="320" y="559.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">tedavi HCO₃'ü normalin üstüne çıkarmamalı; KB, K ve sıvı dengesini bozmamalı</text><text x="320" y="576.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">anemi: Hb erken ve giderek düşer; ayrıntı KDIGO anemi kılavuzunda (güncelleniyor)</text></g>

</svg>
