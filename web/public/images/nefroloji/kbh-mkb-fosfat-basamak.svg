<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" width="640" height="740" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">KBH-MKB: fosfat yönetiminde basamaklar</title>
<desc id="d">Önce karar: fosfat ilerleyici ya da kalıcı yüksekse tedavi düşünülür, normofosfatemide önleyici başlanmaz. Diyette fosfat kısıtlanır, kaynağı gözetilir. G5D hastada kalıcı hiperfosfatemide diyalizle uzaklaştırma artırılır. İlaçta kalsiyum bazlı bağlayıcının dozu kısıtlanır, alüminyum uzun süreli kullanılmaz. Fosfat normale doğru düşürülür, erişkinde hiperkalsemiden kaçınılır, kalsiyum, fosfat ve PTH birlikte ve seri izlenir.</desc>
<!-- 13 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:13s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,10%{opacity:0;transform:translateY(8px)}13%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,10%{stroke-dashoffset:1}15%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,20%{opacity:0;transform:translateY(8px)}23%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,20%{stroke-dashoffset:1}25%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,31%{opacity:0;transform:translateY(8px)}34%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,31%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,41%{opacity:0;transform:translateY(8px)}44%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,41%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,51%{opacity:0;transform:translateY(8px)}54%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,51%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,61%{opacity:0;transform:translateY(8px)}64%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,61%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,72%{opacity:0;transform:translateY(8px)}75%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,72%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
.s9{animation-name:s9}@keyframes s9{0%,82%{opacity:0;transform:translateY(8px)}85%, 100%{opacity:1;transform:none}}
.s9 .ciz{animation-name:c9}@keyframes c9{0%,82%{stroke-dashoffset:1}87%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="740" fill="#ffffff"/>
<g class="a m s1"><rect x="70" y="20" width="500" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="57" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">1 · Karar</text><text x="320" y="77" text-anchor="middle" font-size="13" fill="#0f172a">fosfat ilerleyici ya da kalıcı yüksek mi? (4.1.5)</text><text x="320" y="97" text-anchor="middle" font-size="13" fill="#0f172a">normofosfatemide önleyici tedavi yok</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M320,124 L320,158" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s3"><rect x="70" y="162" width="500" height="104" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="199" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">2 · Diyet</text><text x="320" y="219" text-anchor="middle" font-size="13" fill="#064e3b">fosfat alımını sınırla (4.1.8 · 2D)</text><text x="320" y="239" text-anchor="middle" font-size="13" fill="#064e3b">kaynağı gözet: hayvansal · bitkisel · katkı maddesi</text></g><g class="a s4"><path class="a ciz" pathLength="1" d="M320,266 L320,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s5"><rect x="70" y="304" width="500" height="104" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="341" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">3 · Diyaliz (G5D)</text><text x="320" y="361" text-anchor="middle" font-size="13" fill="#1e3a8a">kalıcı hiperfosfatemide uzaklaştırmayı artır (4.1.9 · 2C)</text><text x="320" y="381" text-anchor="middle" font-size="13" fill="#1e3a8a">diyalizat Ca 1,25–1,50 mmol/L (4.1.4 · 2C)</text></g><g class="a s6"><path class="a ciz" pathLength="1" d="M320,408 L320,442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s7"><rect x="70" y="446" width="500" height="104" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="483" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · İlaç</text><text x="320" y="503" text-anchor="middle" font-size="13" fill="#78350f">kalsiyum bazlı bağlayıcıda dozu kısıtla (4.1.6 · 2B)</text><text x="320" y="523" text-anchor="middle" font-size="13" fill="#78350f">alüminyumu uzun süreli kullanma (4.1.7 · 1C)</text></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,550 L320,584" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s9"><rect x="70" y="588" width="500" height="118" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="622" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Hedef ve izlem</text><text x="320" y="642" text-anchor="middle" font-size="13" fill="#4c1d95">fosfatı normale DOĞRU düşür (4.1.2 · 2C)</text><text x="320" y="662" text-anchor="middle" font-size="13" fill="#4c1d95">erişkinde hiperkalsemiden kaçın (4.1.3 · 2C)</text><text x="320" y="682" text-anchor="middle" font-size="13" fill="#4c1d95">Ca, P ve PTH birlikte, seri (4.1.1)</text></g>
</svg>
