<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">IgA nefropatisi: patogenezden tedaviye</title>
<desc id="d">Birinci adım, dört vuruş: galaktozu eksik IgA1 artar, ona karşı IgG ve IgA otoantikorları oluşur, dolaşımda immün kompleks kurulur, kompleksler mezangiyuma çöker ve böbrek hasarı başlar. İkinci adım, tanı: makroskopik hematüri, kalıcı mikroskopik hematüri ya da yavaş ilerleyen böbrek işlev kaybında düşünülür; böbrek biyopsisinde immünfloresanla baskın ya da eş baskın mezangiyal IgA ile konur; her raporda Oxford MEST-C skoru bulunur. Üçüncü adım, risk: üç ya da daha fazla özellik çok yüksek risk demektir: proteinüri günde 1 gramın üstünde, orta düzey mikroskopik hematüri, böbrek işlevinde ilerleyici kayıp, biyopside aktif lezyon. Dördüncü adım, destek tedavisi herkese: proteinüri günde 0,5 gramın üstündeyse ACE inhibitörü ya da ARB, yetmezse SGLT2 inhibitörü, atrasentan ya da sparsentan; üç ile altı ayda yeniden değerlendirilir. Beşinci adım, bağışıklık tedavisi: destek tedavisine rağmen proteinüri günde 1 gramın üstünde ve hematüri sürüyorsa sistemik glukokortikoit önerilir; seçenekler hedefli salımlı budesonid, mikofenolat ile düşük doz glukokortikoit, sibeprenlimab ve iptakopandır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,150 L320,172" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,296 L320,318" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,464 L320,486" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,610 L320,632" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="136" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">1 · Dört vuruş</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#4c1d95">① Galaktozu eksik IgA1 (Gd-IgA1) artar</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#4c1d95">② Gd-IgA1'e karşı IgG ve IgA otoantikorları</text><text x="320" y="110" text-anchor="middle" font-size="12" fill="#4c1d95">③ Dolaşımda immün kompleks</text><text x="320" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">④ Mezangiyuma çökme → hücre etkinleşmesi, kompleman, hasar</text></g>
<g class="a m s2"><rect x="40" y="174" width="560" height="122" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">2 · Tanı</text><text x="320" y="226" text-anchor="middle" font-size="12" fill="#1e3a8a">Makroskopik hematüri (ÜSYE ile) · kalıcı mikroskopik hematüri</text><text x="320" y="248" text-anchor="middle" font-size="12" fill="#1e3a8a">Biyopsi: baskın/eş baskın mezangiyal IgA (immünfloresan)</text><text x="320" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Her raporda Oxford MEST-C skoru</text></g>
<g class="a m s3"><rect x="40" y="320" width="560" height="144" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="348" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">3 · Risk: ≥3 özellik = çok yüksek risk</text><text x="320" y="372" text-anchor="middle" font-size="12" fill="#7f1d1d">Proteinüri ≥1 g/gün (bazı yazarlar ≥0,5)</text><text x="320" y="394" text-anchor="middle" font-size="12" fill="#7f1d1d">Orta düzey mikroskopik hematüri (≥1+ ya da &gt;10 eritrosit/BBA)</text><text x="320" y="416" text-anchor="middle" font-size="12" fill="#7f1d1d">eGFR &lt;60 ya da yılda &gt;3 mL/dk/1,73 m² kayıp</text><text x="320" y="440" text-anchor="middle" font-size="12" fill="#7f1d1d">Aktif lezyon: M1 · E1 · C1/C2 · podosit hipertrofili S1</text></g>
<g class="a m s4"><rect x="40" y="488" width="560" height="122" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="516" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">4 · Destek tedavisi: herkese</text><text x="320" y="540" text-anchor="middle" font-size="12" fill="#064e3b">Proteinüri ≥0,5 g/gün → ACE inhibitörü ya da ARB</text><text x="320" y="562" text-anchor="middle" font-size="12" fill="#064e3b">Yetmezse SGLT2i · atrasentan · sparsentan (ACEi/ARB kesilir)</text><text x="320" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">3–6 ayda yeniden risk değerlendirmesi</text></g>
<g class="a m s5"><rect x="40" y="634" width="560" height="168" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="662" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">5 · Bağışıklık tedavisi</text><text x="320" y="686" text-anchor="middle" font-size="12" fill="#78350f">Destek tedavisine rağmen ≥1 g/gün + orta düzey hematüri</text><text x="320" y="710" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Çoğu hastada önerilen: sistemik glukokortikoit</text><text x="320" y="734" text-anchor="middle" font-size="12" fill="#78350f">Seçenekler: TRF-budesonid · MMF + düşük doz GK</text><text x="320" y="756" text-anchor="middle" font-size="12" fill="#78350f">Sibeprenlimab (anti-APRIL) · iptakopan (faktör B)</text><text x="320" y="782" text-anchor="middle" font-size="12" fill="#78350f">İzlem 1–3 ayda bir: KB · UPCR · eGFR · idrar tahlili</text></g>
</svg>
