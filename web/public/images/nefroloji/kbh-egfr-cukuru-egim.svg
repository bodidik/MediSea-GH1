<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hemodinamik etkili tedavide eGFR seyri: başlangıç çukuru ve yavaşlayan kronik eğim</title>
<desc id="d">RAS inhibitörü ya da SGLT2 inhibitörü başlanınca glomerül içi basınç düştüğü için eGFR ilk haftalarda geri dönüşlü biçimde düşer; bu düşüş hasar değildir. Sonraki kronik eğim belirgin yavaşlar ve eğriler bir süre sonra kesişir; uzun vadede tedavi kolu daha yüksek eGFR'de kalır. EMPA-KIDNEY'de kronik eğim empagliflozinle yılda −1,37, plaseboyla −2,75 mL/dk/1,73 m² idi (fark 1,37). KDIGO 2024: KBH'de sonraki ölçümde %20'yi aşan eGFR değişimi beklenen değişkenliği aşar; hemodinamik etkili tedavi başlananlarda eşik %30'dur. ACEi ya da ARB başlanınca ya da doz artırılınca 2–4 hafta içinde kreatinin ve potasyum kontrol edilir; kreatinin 4 haftada %30'dan fazla artmadıkça tedavi sürdürülür. Düşüş %30'u aşarsa AKI nedenleri, hacim açığı, NSAİİ ve diüretik gibi eşlik eden ilaçlar ve renal arter stenozu araştırılır. SGLT2i başlangıcı izlem sıklığını değiştirmeyi gerektirmez. Eğri şematiktir; başlangıç eGFR'si ve çukur derinliği temsilidir.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kbh-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.eks{animation-name:eks}@keyframes eks{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.eks .ciz{animation-name:eksc}@keyframes eksc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.pl{animation-name:pl}@keyframes pl{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.pl .ciz{animation-name:plc}@keyframes plc{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.td{animation-name:td}@keyframes td{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.td .ciz{animation-name:tdc}@keyframes tdc{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.cuk{animation-name:cuk}@keyframes cuk{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.cuk .ciz{animation-name:cukc}@keyframes cukc{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.egim{animation-name:egim}@keyframes egim{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.egim .ciz{animation-name:egimc}@keyframes egimc{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.kes{animation-name:kes}@keyframes kes{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.kes .ciz{animation-name:kesc}@keyframes kesc{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.kur{animation-name:kur}@keyframes kur{0%,76%{opacity:0;transform:translateY(7px)}79%,100%{opacity:1;transform:none}}
.kur .ciz{animation-name:kurc}@keyframes kurc{0%,76%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="600" fill="#ffffff"/>

<g class="a eks"><line x1="70" y1="330" x2="610" y2="330" stroke="#475569" stroke-width="1.6"/><line x1="70" y1="330" x2="70" y2="60" stroke="#475569" stroke-width="1.6"/><text x="70" y="40" font-size="12" font-weight="800" text-anchor="start" fill="#334155">eGFR (mL/dk/1,73 m²) — şematik</text><text x="610" y="352" font-size="11.5" font-weight="600" text-anchor="end" fill="#475569">zaman (ay) →</text><line x1="70" y1="330" x2="70" y2="335" stroke="#475569"/><text x="70" y="349" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">0</text><line x1="250" y1="330" x2="250" y2="335" stroke="#475569"/><text x="250" y="349" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">12</text><line x1="430" y1="330" x2="430" y2="335" stroke="#475569"/><text x="430" y="349" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">24</text><line x1="610" y1="330" x2="610" y2="335" stroke="#475569"/><text x="610" y="349" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">36</text></g>
<g class="a pl"><path class="a ciz" pathLength="1" d="M70.0,125.7 L610.0,278.9" stroke="#94a3b8" stroke-width="3.2" fill="none" stroke-dasharray="1"/><text x="606" y="300.92857142857144" font-size="12" font-weight="800" text-anchor="end" fill="#475569">plasebo: −2,75 / yıl</text></g>
<g class="a td"><path class="a ciz" pathLength="1" d="M70.0,125.7 L85.0,170.3 L610.0,244.5" stroke="#0284c7" stroke-width="3.6" fill="none"/><text x="606" y="218.4940476190476" font-size="12" font-weight="800" text-anchor="end" fill="#0369a1">empagliflozin: −1,37 / yıl</text></g>
<g class="a cuk"><circle cx="85" cy="170.28571428571425" r="6" fill="#0284c7"/><path class="a ciz" pathLength="1" d="M93,176.28571428571425 C130,237.14285714285714 160,255.71428571428572 190,263.1428571428571" stroke="#0284c7" stroke-width="1.6" fill="none" marker-end="url(#okM)"/><rect x="194" y="245.1428571428571" width="196" height="60" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="292" y="263.1428571428571" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">başlangıç "çukuru"</text><text x="292" y="280.1428571428571" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">P_GC ↓ → geri dönüşlü</text><text x="292" y="297.1428571428571" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">hasar değil, uyum</text></g>
<g class="a egim"><text x="250" y="84.8571428571428" font-size="12" font-weight="800" text-anchor="middle" fill="#0f172a">kronik eğim yarıya iner (fark 1,37 / yıl)</text></g>
<g class="a kes"><text x="385" y="140.57142857142853" font-size="11.5" font-weight="700" text-anchor="middle" fill="#15803d">eğriler kesişir → uzun vadede</text><text x="385" y="154.57142857142853" font-size="11.5" font-weight="700" text-anchor="middle" fill="#15803d">tedavi kolu daha yüksek eGFR'de</text></g>
<g class="a kur"><rect x="10" y="380" width="300" height="206" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="428.5" font-size="14" font-weight="800" text-anchor="middle" fill="#14532d">Ne zaman BEKLENEN?</text><text x="160" y="445.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">RASi/SGLT2i başlangıcında düşüş</text><text x="160" y="462.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">KBH'de ardışık ölçümde ≤%20 oynama</text><text x="160" y="479.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">hemodinamik tedavide ≤%30 düşüş</text><text x="160" y="496.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">→ SÜRDÜR; SGLT2i'yi düşüş</text><text x="160" y="513.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">nedeniyle kesme (KDIGO 3.7.3)</text><text x="160" y="530.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">eGFR &lt;20'ye inse de sürdürülebilir</text><text x="160" y="547.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">(diyaliz/nakil başlayana dek)</text><rect x="330" y="380" width="300" height="206" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="428.5" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">Ne zaman ARAŞTIR?</text><text x="480" y="445.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ACEi/ARB sonrası 2–4 hafta: Kr + K</text><text x="480" y="462.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">kreatinin 4 haftada >%30 ↑ ya da</text><text x="480" y="479.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">eGFR >%30 ↓ → AKI nedenleri</text><text x="480" y="496.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">hacim açığını düzelt</text><text x="480" y="513.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">NSAİİ, diüretik gözden geçir</text><text x="480" y="530.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">renal arter stenozunu düşün</text><text x="480" y="547.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ACR'nin iki katına çıkması da anlamlı</text></g>

</svg>
