<g class="a kom"><rect x="20" y="616" width="600" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="642" font-size="12.5" font-weight="800" text-anchor="middle" fill="#581c87">Peritonit: lökosit >100/mm³ ve ≥%50 nötrofil · bulanık sıvı + ağrı · çoğu gram (+) kok</text><text x="320" y="659" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">periton içi ya da oral antibiyotik; Pseudomonas veya mayada KATETER ÇIKARILIR</text><text x="320" y="676" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">metabolik: dekstrozdan yüzlerce kalori, kilo, hiperglisemi, hipertrigliseridemi, protein kaybı</text></g>

