<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Periton diyalizi: periton zarında difüzyon, dekstrozla ultrafiltrasyon ve taşıyıcı tipleri</title>
<desc id="d">Periton diyalizinde 1,5–3 litre dekstrozlu çözelti karın boşluğuna verilir ve genellikle 2–4 saat bekletilir. Atık maddeler difüzyonla ve ultrafiltrasyonun yarattığı konveksiyonla periton kapillerlerinden diyalizata geçer; hemodiyalizden farklı olarak sıvı çekimini transmembran basınç değil çözeltinin hipertonisitesi (dekstroz) sağlar. Difüzyon zamanla yavaşlar ve plazma ile dengelenince durur; bu sırada glukoz kana emilir, ozmotik gradyan söner. Periton eşitlenme testi (PET) kreatinin ve glukozun aktarım hızını ölçer: hızlı (yüksek) taşıyıcılar glukozu çabuk emer, uzun gündüz beklemelerinde ultrafiltrasyon verimini yitirir, daha çok albümin kaybeder ve kısa, sık değişim (çoğu kez siklör) gerektirir; yavaş taşıyıcılar az sayıda, büyük hacimli değişimle iyi gider. İkodekstrin emilmeyen bir karbonhidrattır, uzun beklemede daha verimli ultrafiltrasyon sağlar. SAPD'de günde 3–5 elle değişim ve gece bekletmesi, SSPD'de gece otomatik siklör kullanılır. Komplikasyonlar: peritonit (periton sıvısında lökosit 100/mm³'ün üstü, en az yüzde 50 nötrofil; çoğu gram pozitif kok), tünel enfeksiyonu, kilo artışı, hiperglisemi, hipertrigliseridemi, protein kaybı ve rezidüel üremi. Hidrofilik gram negatif çomak (Pseudomonas) ya da maya peritonitinde kateter çıkarılır.</desc>
