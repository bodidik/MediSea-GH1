<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ABH'de KRT pratiği: diyaliz kateteri yeri ve antikoagülasyon seçimi</title>
<desc id="d">KDIGO 2012: ABH'de KRT tünelsiz, kafsız diyaliz kateteriyle başlanır (2D). Ven seçiminde sıra: sağ juguler, femoral, sol juguler, en son baskın taraf subklavyen ven. Kateter ultrason eşliğinde takılır (1A); juguler ya da subklavyen kateterde ilk kullanımdan önce akciğer grafisi çekilir (1B). Yoğun bakımda tünelsiz kateter giriş yerine topikal antibiyotik (2C) ve antibiyotik kilit (2C) önerilmez. Antikoagülasyon, kanama riski ve pıhtılaşma bozukluğu yoksa ve hasta zaten sistemik antikoagülan almıyorsa önerilir (1B). Aralıklı KRT'de fraksiyone olmayan ya da düşük molekül ağırlıklı heparin (1C); sürekli KRT'de kontrendikasyon yoksa heparin yerine bölgesel sitrat (2B), sitrat kontrendikeyse heparin (2C). Kanama riski artmış hastada sürekli KRT'de antikoagülansız yerine bölgesel sitrat (2C), bölgesel heparinizasyondan kaçınma (2C). HIT'te tüm heparin kesilir; doğrudan trombin inhibitörü ya da faktör Xa inhibitörü kullanılır (1A); ağır karaciğer yetmezliği yoksa argatroban (2C). Biyouyumlu membranlı diyalizör önerilir (2C).</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: aki-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.vb{animation-name:vb}@keyframes vb{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.vb .ciz{animation-name:vbc}@keyframes vbc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.v0{animation-name:v0}@keyframes v0{0%,6%{opacity:0;transform:translateY(7px)}9%,100%{opacity:1;transform:none}}
.v0 .ciz{animation-name:v0c}@keyframes v0c{0%,6%{stroke-dashoffset:1}10%,100%{stroke-dashoffset:0}}
.v1{animation-name:v1}@keyframes v1{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.v1 .ciz{animation-name:v1c}@keyframes v1c{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.v2{animation-name:v2}@keyframes v2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.v2 .ciz{animation-name:v2c}@keyframes v2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.v3{animation-name:v3}@keyframes v3{0%,24%{opacity:0;transform:translateY(7px)}27%,100%{opacity:1;transform:none}}
.v3 .ciz{animation-name:v3c}@keyframes v3c{0%,24%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}
.kat{animation-name:kat}@keyframes kat{0%,32%{opacity:0;transform:translateY(7px)}35%,100%{opacity:1;transform:none}}
.kat .ciz{animation-name:katc}@keyframes katc{0%,32%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.ab{animation-name:ab}@keyframes ab{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.ab .ciz{animation-name:abc}@keyframes abc{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.a1{animation-name:a1}@keyframes a1{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.a1 .ciz{animation-name:a1c}@keyframes a1c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.a2{animation-name:a2}@keyframes a2{0%,58%{opacity:0;transform:translateY(7px)}61%,100%{opacity:1;transform:none}}
.a2 .ciz{animation-name:a2c}@keyframes a2c{0%,58%{stroke-dashoffset:1}62%,100%{stroke-dashoffset:0}}
.a3{animation-name:a3}@keyframes a3{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.a3 .ciz{animation-name:a3c}@keyframes a3c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
.hit{animation-name:hit}@keyframes hit{0%,76%{opacity:0;transform:translateY(7px)}79%,100%{opacity:1;transform:none}}
.hit .ciz{animation-name:hitc}@keyframes hitc{0%,76%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="700" fill="#ffffff"/>

<g class="a vb"><text x="20" y="30" font-size="15" font-weight="900" text-anchor="start" fill="#0f172a">A · Diyaliz kateteri: hangi ven?</text></g>
<g class="a v0"><rect x="20" y="44" width="140" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="48" y="88" font-size="26" font-weight="900" text-anchor="middle" fill="#16a34a">1</text><text x="108" y="76" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Sağ juguler</text><text x="108" y="94" font-size="10.5" font-weight="600" text-anchor="middle" fill="#14532d">ilk seçim</text><path class="a ciz" pathLength="1" d="M162,79 L170,79" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a v1"><rect x="172" y="44" width="140" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="200" y="88" font-size="26" font-weight="900" text-anchor="middle" fill="#0284c7">2</text><text x="260" y="76" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Femoral</text><text x="260" y="94" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0c4a6e"></text><path class="a ciz" pathLength="1" d="M314,79 L322,79" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a v2"><rect x="324" y="44" width="140" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="352" y="88" font-size="26" font-weight="900" text-anchor="middle" fill="#d97706">3</text><text x="412" y="76" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Sol juguler</text><text x="412" y="94" font-size="10.5" font-weight="600" text-anchor="middle" fill="#78350f"></text><path class="a ciz" pathLength="1" d="M466,79 L474,79" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a v3"><rect x="476" y="44" width="140" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="504" y="88" font-size="26" font-weight="900" text-anchor="middle" fill="#dc2626">4</text><text x="564" y="76" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Subklavyen</text><text x="564" y="94" font-size="10.5" font-weight="600" text-anchor="middle" fill="#7f1d1d">en son (baskın taraf)</text></g>
<g class="a kat"><rect x="20" y="126" width="600" height="92" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="151.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Takma kuralları</text><text x="320" y="168.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">tünelsiz, kafsız kateterle başla (2D) · ULTRASON eşliğinde (1A)</text><text x="320" y="185.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">juguler/subklavyende ilk kullanımdan önce akciğer grafisi (1B)</text><text x="320" y="202.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">YB'de giriş yerine topikal antibiyotik ve antibiyotik kilit YOK (2C)</text></g>
<g class="a ab"><text x="20" y="250" font-size="15" font-weight="900" text-anchor="start" fill="#0f172a">B · Antikoagülasyon</text><rect x="20" y="262" width="600" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="295" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Kanama riski / koagülopati yok ve sistemik antikoagülan almıyorsa → antikoagülasyon (1B)</text></g>
<g class="a a1"><rect x="20" y="334" width="290" height="104" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="165" y="365.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Aralıklı KRT</text><text x="165" y="382.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">fraksiyone olmayan ya da</text><text x="165" y="399.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">DMAH heparin (1C)</text><text x="165" y="416.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">kanama riski ↑ → antikoagülansız</text></g>
<g class="a a2"><rect x="330" y="334" width="290" height="104" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="475" y="365.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">Sürekli KRT</text><text x="475" y="382.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">BÖLGESEL SİTRAT (2B)</text><text x="475" y="399.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">sitrat kontrendikeyse heparin (2C)</text><text x="475" y="416.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">kanama riski ↑: sitrat > hiç (2C)</text></g>
<g class="a a3"><rect x="20" y="452" width="600" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="478" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Kanama riski artmış hastada</text><text x="320" y="495" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">sürekli KRT'de bölgesel heparinizasyondan KAÇIN (2C)</text><text x="320" y="512" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">sistemik antikoagülasyon gerektiren altta yatan durum varsa ona göre uyarla</text></g>
<g class="a hit"><rect x="20" y="542" width="600" height="96" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="569.5" font-size="14" font-weight="800" text-anchor="middle" fill="#581c87">HIT</text><text x="320" y="586.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">TÜM heparin kesilir → doğrudan trombin inh. ya da faktör Xa inh. (1A)</text><text x="320" y="603.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">ağır karaciğer yetmezliği yoksa argatroban (2C)</text><text x="320" y="620.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">danaparoid · fondaparinuks seçenektir</text><rect x="20" y="650" width="600" height="40" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="675" font-size="13" font-weight="800" text-anchor="middle" fill="#1e293b">Diyalizör: biyouyumlu membran (2C) · tampon: bikarbonat</text></g>

</svg>
