.son{animation-name:son}@keyframes son{0%,72%{opacity:0;transform:translateY(7px)}75%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,72%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
