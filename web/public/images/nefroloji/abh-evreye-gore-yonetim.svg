<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ABH'de evreye göre yönetim: yüksek riskten evre 3'e eklenen eylemler</title>
<desc id="d">KDIGO 2012 Şekil 4: yüksek riskli hastada ve tüm evrelerde tüm nefrotoksik ajanlar mümkünse kesilir, hacim durumu ve perfüzyon basıncı sağlanır, işlevsel hemodinamik izlem düşünülür, serum kreatinin ve idrar çıkışı izlenir, hiperglisemiden kaçınılır, radyokontrast işlemlerine seçenek aranır. Evre 1'den itibaren invaziv olmayan tanısal inceleme yapılır ve invaziv inceleme düşünülür. Evre 2'den itibaren ilaç dozlarındaki değişiklik denetlenir, böbrek replasman tedavisi ve yoğun bakıma yatış düşünülür. Evre 3'te mümkünse subklavyen kateterden kaçınılır. Gölge yoğunluğu, evre ilerledikçe eylemin önceliğinin arttığını gösterir. Eylemler ABH tanısından önce, risk altındaki hastada başlar.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: aki-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.bas{animation-name:bas}@keyframes bas{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
