<g class="a b10"><rect x="300" y="450" width="320" height="34" rx="8" fill="url(#g2)" stroke="#475569" stroke-width="1"/><text x="310" y="472" font-size="12" font-weight="800" text-anchor="start" fill="#0f172a">Yoğun bakıma yatışı düşün</text></g>
<g class="a b11"><rect x="420" y="487" width="200" height="34" rx="8" fill="url(#g2)" stroke="#475569" stroke-width="1"/><text x="430" y="509" font-size="12" font-weight="800" text-anchor="start" fill="#0f172a">Subklavyen kateterden kaçın</text></g>
