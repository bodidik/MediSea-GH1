<g class="a bas"><text x="20" y="30" font-size="14" font-weight="800" text-anchor="start" fill="#0f172a">Eylem ABH tanısından ÖNCE başlar; evre arttıkça yenileri EKLENİR</text><text x="90" y="62" font-size="13" font-weight="900" text-anchor="middle" fill="#0369a1">Yüksek risk</text><line x1="20" y1="72" x2="20" y2="520" stroke="#94a3b8" stroke-dasharray="4 4"/><text x="230" y="62" font-size="13" font-weight="900" text-anchor="middle" fill="#a16207">Evre 1</text><line x1="160" y1="72" x2="160" y2="520" stroke="#94a3b8" stroke-dasharray="4 4"/><text x="360" y="62" font-size="13" font-weight="900" text-anchor="middle" fill="#c2410c">Evre 2</text><line x1="300" y1="72" x2="300" y2="520" stroke="#94a3b8" stroke-dasharray="4 4"/><text x="520" y="62" font-size="13" font-weight="900" text-anchor="middle" fill="#b91c1c">Evre 3</text><line x1="420" y1="72" x2="420" y2="520" stroke="#94a3b8" stroke-dasharray="4 4"/></g>
<g class="a b0"><rect x="20" y="80" width="600" height="34" rx="8" fill="url(#g0)" stroke="#475569" stroke-width="1"/><text x="30" y="102" font-size="12" font-weight="800" text-anchor="start" fill="#0f172a">Tüm nefrotoksik ajanları mümkünse kes</text></g>
<g class="a b1"><rect x="20" y="117" width="600" height="34" rx="8" fill="url(#g0)" stroke="#475569" stroke-width="1"/><text x="30" y="139" font-size="12" font-weight="800" text-anchor="start" fill="#0f172a">Hacim durumu ve perfüzyon basıncını sağla</text></g>
<g class="a b2"><rect x="20" y="154" width="600" height="34" rx="8" fill="url(#g0)" stroke="#475569" stroke-width="1"/><text x="30" y="176" font-size="12" font-weight="800" text-anchor="start" fill="#0f172a">İşlevsel hemodinamik izlemi düşün</text></g>
<g class="a b3"><rect x="20" y="191" width="600" height="34" rx="8" fill="url(#g0)" stroke="#475569" stroke-width="1"/><text x="30" y="213" font-size="12" font-weight="800" text-anchor="start" fill="#0f172a">Serum kreatinin ve idrar çıkışını izle</text></g>
