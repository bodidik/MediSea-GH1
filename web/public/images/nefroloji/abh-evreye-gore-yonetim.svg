.b9{animation-name:b9}@keyframes b9{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.b9 .ciz{animation-name:b9c}@keyframes b9c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
