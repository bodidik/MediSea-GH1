.b0{animation-name:b0}@keyframes b0{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.b0 .ciz{animation-name:b0c}@keyframes b0c{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
