<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="612" fill="#ffffff"/>

<g class="a bar"><defs><linearGradient id="rg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#bbf7d0"/><stop offset="0.25" stop-color="#fef08a"/><stop offset="0.55" stop-color="#fdba74"/><stop offset="1" stop-color="#f87171"/></linearGradient></defs><rect x="182" y="80" width="36" height="440" rx="10" fill="url(#rg)" stroke="#64748b" stroke-width="1.4"/><line x1="176" y1="520" x2="182" y2="520" stroke="#475569"/><text x="172" y="524" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">%0</text><line x1="176" y1="432" x2="182" y2="432" stroke="#475569"/><text x="172" y="436" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">%10</text><line x1="176" y1="344" x2="182" y2="344" stroke="#475569"/><text x="172" y="348" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">%20</text><line x1="176" y1="256" x2="182" y2="256" stroke="#475569"/><text x="172" y="260" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">%30</text><line x1="176" y1="168" x2="182" y2="168" stroke="#475569"/><text x="172" y="172" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">%40</text><line x1="176" y1="80" x2="182" y2="80" stroke="#475569"/><text x="172" y="84" font-size="11" font-weight="500" text-anchor="end" fill="#64748b">%50</text><text x="200" y="58" font-size="12" font-weight="800" text-anchor="middle" fill="#334155">böbrek yetmezliği riski</text><rect x="10" y="80" width="150" height="128" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="85" y="115" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">KFRE girdileri</text><text x="85" y="132" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">yaş · cinsiyet</text><text x="85" y="149" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">eGFR · ACR</text><text x="85" y="166" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">(8 değişken: + Ca,</text><text x="85" y="183" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">P, HCO₃, albümin)</text><rect x="10" y="222" width="150" height="112" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="85" y="249" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Geçerlilik</text><text x="85" y="266" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">yalnız G3–G5</text><text x="85" y="283" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">C ≈ 0,88–0,91</text><text x="85" y="300" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">>30 ülke,</text><text x="85" y="317" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">>1 milyon hasta</text></g>
<g class="a isr"><g class="a isrm"><circle cx="200" cy="520" r="11" fill="#0f172a" stroke="#ffffff" stroke-width="3"/><text x="222" y="524" font-size="11.5" font-weight="800" text-anchor="start" fill="#0f172a">hasta</text></g></g>
<g class="a e1"><line x1="220" y1="484.8" x2="300" y2="484.8" stroke="#ca8a04" stroke-width="2" stroke-dasharray="5 4"/><rect x="300" y="454.8" width="330" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="465" y="480.8" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">5 yıllık risk %3–5</text><text x="465" y="497.8" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">→ NEFROLOJİ SEVKİ</text><text x="465" y="514.8" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">(eGFR &lt;30 ve kalıcı >%20 düşüş de sevk ölçütü)</text></g>
<g class="a e2"><line x1="220" y1="432" x2="300" y2="432" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><rect x="300" y="368" width="330" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="465" y="394" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">2 yıllık risk >%10</text><text x="465" y="411" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">→ MULTİDİSİPLİNER BAKIM</text><text x="465" y="428" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">diyet · ilaç yönetimi · eğitim · psikososyal</text></g>
<g class="a e3"><line x1="220" y1="168" x2="300" y2="168" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><rect x="300" y="116" width="330" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="465" y="139" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">2 yıllık risk >%40</text><text x="465" y="156" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ KRT HAZIRLIĞI</text><text x="465" y="173" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">modalite eğitimi (HD · PD · nakil · konservatif)</text><text x="465" y="190" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">damar yolu planı · nakil sevki</text><text x="465" y="207" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">GFR &lt;15–20 ise de preemptif plan</text></g>
