<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" width="640" height="612" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Böbrek yetmezliği risk denklemi (KFRE): mutlak riskten bakım basamağına</title>
<desc id="d">KDIGO 2024, KBH G3–G5'te dışsal olarak doğrulanmış bir denklemle böbrek yetmezliği mutlak riskinin hesaplanmasını önerir (1A). KFRE dört değişkenle (yaş, cinsiyet, eGFR, ACR) ya da sekiz değişkenle (artı kalsiyum, fosfat, bikarbonat, albümin) 2 ve 5 yıllık tedavi gerektiren böbrek yetmezliği riskini verir; 30'dan fazla ülkede 1 milyondan fazla hastada doğrulanmıştır. Eşikler eGFR ölçütlerine EK olarak kullanılır: 5 yıllık risk yüzde 3–5 nefroloji sevki; 2 yıllık risk yüzde 10'un üstü multidisipliner bakım; 2 yıllık risk yüzde 40'ın üstü modalite eğitimi, damar yolu planı ve nakil sevki zamanlaması. GFR 15–20'nin altına inince ya da 2 yıllık risk yüzde 40'ı aşınca preemptif nakil ve diyaliz erişimi planlanır. Denklem G1–G2'de geçerli olmayabilir; IgA nefropatisi ve ADPKD'de hastalığa özgü denklem kullanılır.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kbh-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.bar{animation-name:bar}@keyframes bar{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.bar .ciz{animation-name:barc}@keyframes barc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.isr{animation-name:isr}@keyframes isr{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.isr .ciz{animation-name:isrc}@keyframes isrc{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.e1{animation-name:e1}@keyframes e1{0%,24%{opacity:0;transform:translateY(7px)}27%,100%{opacity:1;transform:none}}
.e1 .ciz{animation-name:e1c}@keyframes e1c{0%,24%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}
.e2{animation-name:e2}@keyframes e2{0%,46%{opacity:0;transform:translateY(7px)}49%,100%{opacity:1;transform:none}}
.e2 .ciz{animation-name:e2c}@keyframes e2c{0%,46%{stroke-dashoffset:1}50%,100%{stroke-dashoffset:0}}
.e3{animation-name:e3}@keyframes e3{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.e3 .ciz{animation-name:e3c}@keyframes e3c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
.alt{animation-name:alt}@keyframes alt{0%,84%{opacity:0;transform:translateY(7px)}87%,100%{opacity:1;transform:none}}
.alt .ciz{animation-name:altc}@keyframes altc{0%,84%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
.isrm{animation-name:isrm}@keyframes isrm{0%,8%{transform:translateY(0)}22%{transform:translateY(-35.2px)}30%,36%{transform:translateY(-35.2px)}50%,56%{transform:translateY(-105.6px)}72%,100%{transform:translateY(-369.6px)}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
