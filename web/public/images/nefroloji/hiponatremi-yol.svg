<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hiponatremi: tanıdan güvenli düzeltmeye</title>
<desc id="d">Hiponatremide ilk adım serum osmolalitesidir. Normal ya da yüksek osmolalite yalancı hiponatremiyi ya da hiperglisemi, mannitol gibi hipertonik nedenleri düşündürür; glukozdaki her 100 mg/dL artış sodyumu yaklaşık 2 mEq/L düşürür. Hipotonik hiponatremide idrar osmolalitesi bakılır: 100'ün altında ise idrar en dilüdür ve aşırı su ya da düşük solüt alımı düşünülür. 100'ün üstünde ise idrar sodyumu ve hacim durumu değerlendirilir: düşük idrar sodyumu hipovolemi ya da ödemli durumları, yüksek idrar sodyumu SIAD, diüretik, böbrek tuz kaybı ya da hormon eksikliğini düşündürür. Ağır belirti varsa 100 mL yüzde 3 salin 10 dakikada verilir, belirti sürerse iki kez daha tekrarlanır. Hedef 24 saatte 4 ile 6 mEq/L artıştır. Osmotik demiyelinizasyon riski yüksek olan hastada, yani sodyum 105 ve altında, hipokalemi, alkol, malnütrisyon ya da karaciğer hastalığında, sınır 24 saatte 8 mEq/L; diğerlerinde 24 saatte 10 ile 12, 48 saatte 18 mEq/L. Aşırı düzeltme riski varsa desmopressin 1 ile 2 mikrogram 6 ile 8 saatte bir verilir. Sınır aşılırsa yüzde 5 dekstroz 3 mL/kg/saat ve desmopressin 2 mikrogramla sodyum geri düşürülebilir. Kronik SIAD'da sıvı kısıtlaması günde 800 mL'nin altı, ardından üre, tuz tableti ile loop diüretiği ya da tolvaptan.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
