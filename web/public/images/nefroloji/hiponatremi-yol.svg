dle" font-size="13" fill="#1e3a8a">en dilü idrar</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">aşırı su alımı</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">düşük solüt (bira, çay-ekmek)</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">İdrar osm &gt;100</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ADH etkisi var</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">idrar Na + hacim durumu</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">→ neden</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">İdrar Na düşük: hipovolemi, ödemli durum</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#4c1d95">yüksek: SIAD · diüretik · tuz kaybı · kortizol/tiroit eksikliği</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Ağır belirti</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#7f1d1d">100 mL %3 NaCl / 10 dk</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#7f1d1d">sürerse ×2 (toplam 300)</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#7f1d1d">hedef +4–6 mEq/L</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Düzeltme sınırı</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">yüksek ODS riski: ≤8/24 sa</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">diğerleri: 10–12/24 sa</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">ve 18/48 sa</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Aşırı düzeltmeyi önle / geri al</text><text x="320" y="634.5" text-anchor="middle" font-size="13" fill="#064e3b">desmopressin 1–2 µg her 6–8 sa + yavaş %3 salin</text><text x="320" y="654.5" text-anchor="middle" font-size="13" fill="#064e3b">sınır aşıldıysa %5 dekstroz 3 mL/kg/sa + desmopressin 2 µg</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kronik SIAD</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#1e3a8a">sıvı &lt;800 mL/gün → üre 15–30 g · tuz + furosemid · tolvaptan</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#1e3a8a">tolvaptan ≤30 gün, karaciğer hastalığında yok</text></g>
