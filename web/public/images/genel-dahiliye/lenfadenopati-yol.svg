stroke-width="2"/><text x="320" y="288" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Malignite kuşkusu</text><text x="320" y="308" text-anchor="middle" font-size="13" fill="#7f1d1d">&gt;40 yaş · supraklaviküler</text><text x="320" y="328" text-anchor="middle" font-size="13" fill="#7f1d1d">sert ya da hızla büyüyen</text><text x="320" y="348" text-anchor="middle" font-size="13" fill="#7f1d1d">ateş, terleme, kilo kaybı</text></g><g class="a m s2"><rect x="434" y="246" width="196" height="134" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="532" y="288" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Nedeni belirsiz</text><text x="532" y="308" text-anchor="middle" font-size="13" fill="#78350f">lokalize: 3–4 hafta izle</text><text x="532" y="328" text-anchor="middle" font-size="13" fill="#78350f">yaygın: tam kan,</text><text x="532" y="348" text-anchor="middle" font-size="13" fill="#78350f">akciğer grafisi, HIV</text></g><g class="a m s3"><rect x="40" y="416" width="560" height="146" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="464" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Biyopsi</text><text x="320" y="484" text-anchor="middle" font-size="13" fill="#1e3a8a">sıra: supraklaviküler › boyun › koltuk altı › kasık</text><text x="320" y="504" text-anchor="middle" font-size="13" fill="#1e3a8a">lenfoma: eksizyonel · ulaşılamıyorsa kalın iğne</text><text x="320" y="524" text-anchor="middle" font-size="13" fill="#1e3a8a">ince iğne: daha çok kanser nüksü için</text></g><g class="a m s4"><rect x="40" y="600" width="560" height="96" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="643" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Boyunda tek sert nod</text><text x="320" y="663" text-anchor="middle" font-size="13" fill="#4c1d95">önce baş-boyun mukozası · lezyon yoksa en büyük nodu çıkar</text></g><g class="a m s5"><rect x="40" y="730" width="560" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="770" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Uyarı: glukokortikoid verme</text><text x="320" y="790" text-anchor="middle" font-size="13" fill="#7f1d1d">lenfoma, lösemi ve Castleman tanısını gizler</text><text x="320" y="810" text-anchor="middle" font-size="13" fill="#7f1d1d">kanıt yoksa antibiyotik de verme</text></g>
</svg>
