<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Lenfödem: tanıdan tedaviye</title>
<desc id="d">Şişen ekstremitede önce öykü: lenf nodu diseksiyonu, radyoterapi, travma gibi tetikleyici var mı. Muayene: başlangıçta yumuşak ve çukurlaşan ödem, sonra çukurlaşma azalır; Stemmer işareti, ikinci ayak parmağının tabanında deri katlantısının kaldırılamaması, lenfödemi düşündürür ama negatif olması dışlamaz. Lipödemde yağ birikimi simetrik ve ağrılıdır, ayaklar genellikle tutulmaz, ekstremiteyi kaldırmak etkisizdir. Gerekirse görüntüleme: alt ekstremitede lenfosintigrafi birincil yöntem; ICG lenfografisi, MR lenfografi; yöntemler standart değil. Evre (ISL): 0 subklinik, I erken, II orta, III ağır; I–III içinde hacim farkı yüzde 20 altı hafif, 20–40 orta, 40 üstü ağır. Tedavi: tam dekonjestif tedavi iki evrelidir; evre 1 yoğun: cilt ve tırnak bakımı, egzersiz, manuel lenf drenajı ve bası, haftada 5 gün, genellikle 2–4 hafta; evre 2 sürdürme: kompresyon giysisi 20–50 mmHg ve üzeri, hastanın tolere ettiği en yüksek bası; beklenen hacim azalmasına ulaşılmazsa aralıklı pnömatik kompresyon eklenir. Diüretik yalnız lenfödem için verilmez. Konservatif tedaviye yanıtsız seçilmiş hastada cerrahi: fizyolojik (lenfovenöz bypass, lenf nodu nakli; erken evrede umut verici) ya da azaltıcı (liposuction, eksizyon). Cilt enfeksiyonu (selülit, erizipel, lenfanjit) en sık komplikasyon.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="800" fill="#ffffff"/>
<g class="a m s1"><rect x="40" y="14" width="560" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Şişen ekstremite: öykü ve muayene</text><text x="320" y="68" text-anchor="middle" font-size="12" fill="#334155">Tetikleyici: lenf nodu diseksiyonu · radyoterapi · travma</text><text x="320" y="90" text-anchor="middle" font-size="12" fill="#334155">Başta yumuşak, çukurlaşan ödem; ilerledikçe çukurlaşma azalır</text><text x="320" y="112" text-anchor="middle" font-size="12" fill="#334155">Stemmer işareti: 2. ayak parmağı tabanında deri kaldırılamaz</text><text x="320" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Pozitifse düşündürür — negatifse dışlamaz</text></g>
<g class="a m s2"><rect x="10" y="170" width="300" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="160" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">Lipödem mi?</text><text x="160" y="224" text-anchor="middle" font-size="12" fill="#78350f">Simetrik, orantısız, ağrılı yağ</text><text x="160" y="246" text-anchor="middle" font-size="12" fill="#78350f">Ayaklar genellikle tutulmaz</text><text x="160" y="268" text-anchor="middle" font-size="12" fill="#78350f">Kaldırmak etkisiz · tetikleyici yok</text><text x="160" y="290" text-anchor="middle" font-size="12" fill="#78350f">Lenfatik görüntüleme genellikle normal</text></g>
<g class="a m s2"><rect x="330" y="170" width="300" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="480" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Görüntüleme (gerekirse)</text><text x="480" y="224" text-anchor="middle" font-size="12" fill="#1e3a8a">Alt ekstremite: lenfosintigrafi</text><text x="480" y="246" text-anchor="middle" font-size="12" fill="#1e3a8a">ICG lenfografi · MR lenfografi</text><text x="480" y="268" text-anchor="middle" font-size="12" fill="#1e3a8a">Yöntemler standart değil</text><text x="480" y="290" text-anchor="middle" font-size="12" fill="#1e3a8a">Venöz yetmezlik/DVT ayrımı</text></g>
<g class="a m s3"><rect x="40" y="326" width="560" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="354" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Evre (ISL)</text><text x="320" y="380" text-anchor="middle" font-size="12" fill="#4c1d95">0 subklinik · I hafif · II orta · III ağır</text><text x="320" y="404" text-anchor="middle" font-size="12" fill="#4c1d95">Hacim farkı: &lt;%20 hafif · %20–40 orta · &gt;%40 ağır</text></g>
<g class="a m s4"><rect x="40" y="452" width="560" height="190" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="480" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Tam dekonjestif tedavi — iki evre</text><text x="320" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Evre 1 yoğun: haftada 5 gün, genellikle 2–4 hafta</text><text x="320" y="528" text-anchor="middle" font-size="12" fill="#064e3b">Cilt-tırnak bakımı · egzersiz · manuel lenf drenajı · bası</text><text x="320" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Evre 2 sürdürme: kompresyon giysisi 20–50+ mmHg</text><text x="320" y="576" text-anchor="middle" font-size="12" fill="#064e3b">Tolere edilen en yüksek bası en yararlı</text><text x="320" y="602" text-anchor="middle" font-size="12" fill="#064e3b">Hacim hedefine ulaşılmazsa + aralıklı pnömatik kompresyon</text><text x="320" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Diüretik yalnız lenfödem için verilmez</text></g>
<g class="a m s5"><rect x="40" y="658" width="560" height="128" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="686" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Yanıtsız, seçilmiş hasta → cerrahi</text><text x="320" y="712" text-anchor="middle" font-size="12" fill="#7f1d1d">Fizyolojik: lenfovenöz bypass, lenf nodu nakli (erken evrede umut verici)</text><text x="320" y="734" text-anchor="middle" font-size="12" fill="#7f1d1d">Azaltıcı: liposuction, eksizyon</text><text x="320" y="762" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">En sık komplikasyon: selülit, erizipel, lenfanjit</text></g>
</svg>
