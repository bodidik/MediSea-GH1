<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Erişkin Still hastalığında tedavi ve hedefler (EULAR/PReS 2024, UpToDate 2026)</title>
<desc id="d">Tanı dışlama tanısıdır. Makrofaj aktivasyon sendromu kuşkusunda yüksek doz glukokortikoid ve anakinra, siklosporin ya da interferon gama inhibitörü. MAS yoksa hafif hastalıkta 7–14 günlük NSAİİ denemesi, orta-ağır hastalıkta erkenden IL-1 ya da IL-6 inhibitörü ve kısa glukokortikoid. Ara hedefler: 7. gün ateş yok ve CRP yarıdan fazla düşmüş; 4. hafta ateş yok, CRP normal; 3. ay glukokortikoid erişkinde 0,1 mg/kg/gün altında klinik inaktif hastalık; 6. ay glukokortikoidsiz klinik inaktif hastalık. Glukokortikoidsiz 3–6 ay inaktif hastalıktan sonra biyolojik azaltılır.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Kuşku: ateş ≥39 °C ≥7 gün + döküntü</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">+ artralji + yüksek CRP, nötrofil, ferritin</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="76" x2="320" y2="98" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="120" y="100" width="400" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Dışla: enfeksiyon · malignite · ilaç · diğer</text></g><g class="a" style="animation-delay:4.80s"><line x1="250" y1="150" x2="140" y2="176" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="390" y1="150" x2="500" y2="176" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="178" width="300" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="164" y="213" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">MAS kuşkusu</text><text x="164" y="231" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Yüksek doz glukokortikoid +</text><text x="164" y="249" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">anakinra / siklosporin / IFNγ inh.</text><rect x="326" y="178" width="300" height="96" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="476" y="213" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">MAS yok</text><text x="476" y="231" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Hafif: NSAİİ 7–14 gün</text><text x="476" y="249" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Orta-ağır: IL-1 ya da IL-6 inh.</text></g><g class="a" style="animation-delay:7.20s"><line x1="476" y1="274" x2="476" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="176" y="302" width="450" height="50" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="401" y="332" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Erken IL-1/IL-6 + kısa glukokortikoid (EULAR RS6–7)</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="372" width="614" height="132" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="321" y="416" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Ara hedefler (EULAR RS5)</text><text x="321" y="434" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">7. gün: ateş yok, CRP &gt;%50 düşük · 4. hafta: CRP normal</text><text x="321" y="452" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">3. ay: klinik inaktif, glukokortikoid &lt;0,1 mg/kg/gün</text><text x="321" y="470" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">6. ay: glukokortikoidsiz klinik inaktif hastalık</text></g><g class="a" style="animation-delay:12.00s"><rect x="14" y="520" width="614" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="321" y="549" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">3–6 ay glukokortikoidsiz inaktif → biyolojik azaltılır</text><text x="321" y="567" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Yanıtsız: merkez, JAK inhibitörü, emapalumab</text></g>
</svg>
