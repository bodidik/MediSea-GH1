<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Behçet tanı ölçütleri: ISG 1990 ile ICBD 2014 — puanlama, duyarlılık ve özgüllük</title>
<desc id="d">Behçet için patognomonik bir test yoktur. ISG 1990 ölçütleri 7 ülkede 12 merkezden 914 hasta ve kontrollerle geliştirildi: oral ülser ile birlikte genital ülser, tipik göz lezyonu, tipik deri lezyonu ya da pozitif paterji testinden ikisi gerekir. ICBD 2014, 27 ülkeden 2556 klinik Behçet hastası ve 1163 kontrolle geliştirildi: göz lezyonu, oral aft ve genital aft ikişer puan; deri lezyonu, merkezi sinir sistemi tutulumu ve damar bulgusu birer puan; paterji testi yapıldıysa bir puan; 4 ve üzeri puan Behçet olarak sınıflandırılır, oral ülser zorunlu değildir. Doğrulama grubunda ICBD duyarlılığı yüzde 94,8 (93,4–95,9), ISG yüzde 85,0; özgüllük ICBD yüzde 90,5 (87,9–92,8), ISG yüzde 96,0. Paterjinin yapıldığı ülkelerde paterji puanı duyarlılığı yüzde 95,5'ten 98,5'e çıkarırken özgüllüğü yüzde 92,1'den 91,6'ya indirdi.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.t1{animation-name:t1}@keyframes t1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.t1 .ciz{animation-name:t1c}@keyframes t1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.t2{animation-name:t2}@keyframes t2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.t2 .ciz{animation-name:t2c}@keyframes t2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.t3{animation-name:t3}@keyframes t3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.t3 .ciz{animation-name:t3c}@keyframes t3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.t4{animation-name:t4}@keyframes t4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.t4 .ciz{animation-name:t4c}@keyframes t4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.t5{animation-name:t5}@keyframes t5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.t5 .ciz{animation-name:t5c}@keyframes t5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.t6{animation-name:t6}@keyframes t6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.t6 .ciz{animation-name:t6c}@keyframes t6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.t7{animation-name:t7}@keyframes t7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.t7 .ciz{animation-name:t7c}@keyframes t7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
