<rect width="640" height="720" fill="#ffffff"/>
<g class="a t1"><rect x="10" y="10" width="300" height="200" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="160" y="51.5" font-size="15" font-weight="800" text-anchor="middle" fill="#0c4a6e">ISG 1990</text><text x="160" y="72.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">914 hasta · 12 merkez · 7 ülke</text><text x="160" y="90.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">ZORUNLU: tekrarlayan oral ülser</text><text x="160" y="108.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">+ şunlardan 2'si:</text><text x="160" y="126.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">genital ülser</text><text x="160" y="144.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">tipik göz lezyonu</text><text x="160" y="162.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">tipik deri lezyonu</text><text x="160" y="180.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">pozitif paterji testi</text><rect x="330" y="10" width="300" height="200" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="60.5" font-size="15" font-weight="800" text-anchor="middle" fill="#581c87">ICBD 2014</text><text x="480" y="81.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">2556 hasta + 1163 kontrol · 27 ülke</text><text x="480" y="99.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">2 puan: göz · oral aft · genital aft</text><text x="480" y="117.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">1 puan: deri · MSS · damar</text><text x="480" y="135.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">1 puan: paterji (yapıldıysa)</text><text x="480" y="153.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">≥ 4 puan = Behçet</text><text x="480" y="171.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">oral ülser ZORUNLU DEĞİL</text></g>
<g class="a t2"><text x="320" y="248" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Doğrulama grubunda performans</text><rect x="10" y="262" width="620" height="32" rx="8" fill="#f1f5f9"/><text x="140" y="283" font-size="11.5" font-weight="600" text-anchor="middle" fill="#334155"></text><text x="280" y="283" font-size="12" font-weight="800" text-anchor="middle" fill="#334155">Duyarlılık</text><text x="510" y="283" font-size="12" font-weight="800" text-anchor="middle" fill="#334155">Özgüllük</text></g>
<g class="a t3"><text x="110" y="324" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">ISG 1990</text><rect x="190" y="310" width="144.5" height="20" rx="4" fill="#7dd3fc"/><text x="366.5" y="325" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">%85,0</text><rect x="440" y="310" width="105.6" height="20" rx="4" fill="#7dd3fc"/><text x="577.6" y="325" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">%96,0</text></g>
<g class="a t4"><text x="110" y="364" font-size="12.5" font-weight="800" text-anchor="middle" fill="#581c87">ICBD 2014</text><rect x="190" y="350" width="161.16" height="20" rx="4" fill="#c4b5fd"/><text x="383.15999999999997" y="365" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">%94,8</text><rect x="440" y="350" width="99.55" height="20" rx="4" fill="#c4b5fd"/><text x="571.55" y="365" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">%90,5</text></g>
<g class="a t5"><rect x="10" y="400" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="433.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Paterji eklenince (paterjinin yapıldığı ülkeler)</text><text x="320" y="452.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">ICBD duyarlılığı %95,5 → %98,5 · özgüllük %92,1 → %91,6</text></g>
<g class="a t6"><rect x="10" y="492" width="620" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="523.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Ne anlama geliyor?</text><text x="320" y="544.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ICBD 10 hastadan ~1'ini daha yakalıyor; bedeli ~5 puanlık özgüllük kaybı</text><text x="320" y="562.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ISG'de oral ülseri olmayan hasta (ör. önce göz ya da damar tutulumu) ölçütü karşılayamıyor</text><text x="320" y="580.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ikisi de sınıflama ölçütü: tek hastada tanı klinik yargıdır, patognomonik test yok</text></g>
<g class="a t7"><text x="320" y="690" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ISG 1990 (Lancet); ICBD 2014 (J Eur Acad Dermatol Venereol) — yayın özetleri</text></g>
</svg>
