<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" width="640" height="780" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gut: ataktan hedef ürata</title>
<desc id="d">Gutta ataktan hedef ürata yol. Ataktan kuşkulanınca önce septik artrit düşünülür: ateş, bağışıklık baskılanması ya da hastanın alışık olmadığı bir tablo varsa eklem sıvısı alınır; kristal görülse bile kültür izlenir. Atak tedavisi ilk saatlerde başlar: prednizon 40 mg, NSAİİ (naproksen 500 mg günde iki kez) ya da kolşisin (ilk gün 1–1,2 mg, bir saat sonra 0,5–0,6 mg; sonra günde iki kez 0,5–0,6 mg); bir-iki eklemde eklem içi steroid; septik artrit dışlanana kadar steroid ve IL-1 inhibitörü verilmez. Ürat düşürücü kullanan hastada ilaç atak sırasında kesilmez. Atak geçtikten sonra, en az iki hafta sonra ölçülen serum ürat gerçek tabanı gösterir. Ürat düşürücü tedavi yılda iki ve üstü atak, tofüs ya da radyolojik hasar varsa başlanır; NICE kronik böbrek hastalığı evre 3–5 ve diüretik kullanımını da sayar. Allopurinol 100 mg ile başlanır (evre 3 ve üstü KBH'de eGFR başına 1,5 mg'ı geçmez), iki-dört haftada bir artırılır; başlarken üç-altı ay düşük doz kolşisin profilaksisi verilir. Hedef serum ürat 6 mg/dL altı, tofüste 5 mg/dL altıdır. Hedefe ulaşılınca tedavi genellikle ömür boyu sürer; ürat önce üç ayda, sonra altı ayda bir, bir yıl sonra yılda bir ölçülür.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,83%{opacity:0;transform:translateY(8px)}86%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,83%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="780" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,100 L320,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M320,230 L320,258" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M320,360 L320,388" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M320,470 L320,498" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M320,620 L320,648" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="40" y="18" width="560" height="82" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Akut monoartrit: önce septik artrit</text><text x="320" y="64" text-anchor="middle" font-size="13" fill="#7f1d1d">ateş · bağışıklık baskısı · alışılmadık tablo → eklem sıvısı</text><text x="320" y="84" text-anchor="middle" font-size="13" fill="#7f1d1d">kristal görülse bile kültürü izle</text></g><g class="a m s2"><rect x="40" y="130" width="560" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="155" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Atağı hemen tedavi et</text><text x="320" y="175" text-anchor="middle" font-size="13" fill="#78350f">prednizon 40 mg · NSAİİ · kolşisin (ilk gün 1,5–1,8 mg)</text><text x="320" y="195" text-anchor="middle" font-size="13" fill="#78350f">1–2 eklem: eklem içi steroid</text><text x="320" y="215" text-anchor="middle" font-size="13" fill="#78350f">septik dışlanana dek steroid / IL-1 yok</text></g><g class="a m s3"><rect x="40" y="260" width="560" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="295" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Atak geçtikten ≥2 hafta sonra</text><text x="320" y="315" text-anchor="middle" font-size="13" fill="#0f172a">serum ürat (atakta %12–43 normal çıkar)</text><text x="320" y="335" text-anchor="middle" font-size="13" fill="#0f172a">böbrek işlevi · ilaçlar · eşlik eden hastalıklar</text></g><g class="a m s4"><rect x="40" y="390" width="560" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="425" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Ürat düşürücü kime</text><text x="320" y="445" text-anchor="middle" font-size="13" fill="#1e3a8a">≥2 atak/yıl · tofüs · radyolojik hasar (NICE: + KBH 3–5, diüretik)</text></g><g class="a m s5"><rect x="40" y="500" width="560" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="535" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Allopurinol: düşük başla, hedefe çık</text><text x="320" y="555" text-anchor="middle" font-size="13" fill="#4c1d95">100 mg (KBH ≥3: ≤1,5 mg × eGFR) · 2–4 haftada bir artır</text><text x="320" y="575" text-anchor="middle" font-size="13" fill="#4c1d95">HLA-B*5801: Han Çinli, Tay, Koreli, Afrika kökenli</text><text x="320" y="595" text-anchor="middle" font-size="13" fill="#4c1d95">3–6 ay düşük doz kolşisin profilaksisi</text></g><g class="a m s6"><rect x="40" y="650" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="690" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Hedef ve izlem</text><text x="320" y="710" text-anchor="middle" font-size="13" fill="#064e3b">ürat &lt;6 mg/dL · tofüste &lt;5 mg/dL</text><text x="320" y="730" text-anchor="middle" font-size="13" fill="#064e3b">genellikle ömür boyu · atakta kesme</text></g>
</svg>
