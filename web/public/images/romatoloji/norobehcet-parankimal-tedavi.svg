<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Parankimal nöro-Behçet tedavi basamakları</title>
<desc id="d">Akut atakta yüksek doz glukokortikoid verilir; bir derlemenin aktardığı şema metilprednizolon 500–1000 mg günde, 3–5 gün, sonra oral prednizolon 1 mg/kg/gün üç hafta ve azaltmadır. İdamede azatiyoprin ilk seçenektir; alternatifler mikofenolat, metotreksat ve siklofosfamittir. İlk basamak yetersizse ya da tablo agresifse infliksimab gibi bir TNF inhibitörü eklenir. Dirençli olguda tosilizumab küçük bir seride denenmiştir. Ağır tutulumda en az 18–24 ay immünsüpresyon sürdürülür.</desc>
<style>
.a{animation-duration:14s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,12%{opacity:0;transform:translateY(8px)}15%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,12%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,23%{opacity:0;transform:translateY(8px)}26%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,23%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,35%{opacity:0;transform:translateY(8px)}38%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,35%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,46%{opacity:0;transform:translateY(8px)}49%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,46%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,58%{opacity:0;transform:translateY(8px)}61%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,58%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,69%{opacity:0;transform:translateY(8px)}72%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,69%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,81%{opacity:0;transform:translateY(8px)}84%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,81%{stroke-dashoffset:1}86%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="700" fill="#ffffff"/>
<g class="a m s1"><rect x="70" y="20" width="500" height="104" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="57" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Akut atak</text><text x="320" y="77" text-anchor="middle" font-size="13" fill="#7f1d1d">metilprednizolon 500–1000 mg/gün, 3–5 gün</text><text x="320" y="97" text-anchor="middle" font-size="13" fill="#7f1d1d">→ prednizolon 1 mg/kg/gün 3 hafta, sonra azalt</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M320,124 L320,158" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s2"><rect x="70" y="162" width="500" height="104" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="199" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">İdame: ilk seçenek</text><text x="320" y="219" text-anchor="middle" font-size="13" fill="#064e3b">azatiyoprin</text><text x="320" y="239" text-anchor="middle" font-size="13" fill="#064e3b">alternatif: mikofenolat · metotreksat · siklofosfamit</text></g><g class="a s3"><path class="a ciz" pathLength="1" d="M320,266 L320,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s3"><rect x="70" y="304" width="500" height="66" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="342" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Yeterli mi? Tablo agresif mi?</text></g><g class="a s4"><path class="a ciz" pathLength="1" d="M200,370 L140,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M440,370 L500,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><text x="150" y="394" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">yeterli</text></g><g class="a s5"><text x="495" y="394" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">yetersiz / agresif</text></g><g class="a m s4"><rect x="15" y="416" width="270" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="150" y="456" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Sürdür</text><text x="150" y="476" text-anchor="middle" font-size="13" fill="#064e3b">en az 18–24 ay (ağır tutulum)</text><text x="150" y="496" text-anchor="middle" font-size="13" fill="#064e3b">steroidi azalt</text></g><g class="a m s5"><rect x="300" y="416" width="325" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="462.5" y="456" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">TNF inhibitörü ekle</text><text x="462.5" y="476" text-anchor="middle" font-size="13" fill="#4c1d95">infliksimab (AZA ile birlikte sık)</text><text x="462.5" y="496" text-anchor="middle" font-size="13" fill="#4c1d95">ya da siklofosfamit</text></g><g class="a s6"><path class="a ciz" pathLength="1" d="M462,526 L462,560" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s6"><rect x="300" y="564" width="325" height="96" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="462.5" y="597" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Dirençli olgu</text><text x="462.5" y="617" text-anchor="middle" font-size="13" fill="#78350f">tosilizumab: 11 hastalık seri</text><text x="462.5" y="637" text-anchor="middle" font-size="13" fill="#78350f">araştırma düzeyinde</text></g><g class="a s8"><text x="320" y="684" text-anchor="middle" font-size="12" fill="#475569">Kaynak: UpToDate (Smith, Yazici); doz şeması Al-omoush 2025'in aktardığı derleme.</text></g>
</svg>
