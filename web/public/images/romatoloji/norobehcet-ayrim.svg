<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Nöro-Behçet: parankimal ve parankim dışı tutulum</title>
<desc id="d">Nörolojik tutulum önce parankimal ve parankim dışı olarak ayrılır. Parankimal tutulumda yüksek doz glukokortikoid ile immünsüpresif birlikte verilir. Parankim dışı tutulumda, yani serebral venöz trombozda, glukokortikoid ile birlikte antikoagülasyon ya da immünsüpresyon olgu bazında, uzmanla birlikte planlanır. Her iki durumda da siklosporinden kaçınılır, çünkü nörotoksisitesi hastalığın kendisinden ayırt edilemeyebilir.</desc>
<style>
.a{animation-duration:11s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}18%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,31%{opacity:0;transform:translateY(8px)}34%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,31%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,46%{opacity:0;transform:translateY(8px)}49%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,46%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,61%{opacity:0;transform:translateY(8px)}64%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,61%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,77%{opacity:0;transform:translateY(8px)}80%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,77%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="520" fill="#ffffff"/>
<g class="a m s1"><rect x="120" y="20" width="400" height="72" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="51" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Behçet'te yeni nörolojik bulgu</text><text x="320" y="71" text-anchor="middle" font-size="13" fill="#0f172a">MR · gerekirse MR/BT venografi</text></g><g class="a s2"><path class="a ciz" pathLength="1" d="M230,92 L150,140" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M410,92 L490,140" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s3"><rect x="15" y="144" width="290" height="170" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="160" y="194" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Parankimal</text><text x="160" y="214" text-anchor="middle" font-size="13" fill="#7f1d1d">beyin sapı, bazal gangliyon, beyaz cevher</text><text x="160" y="234" text-anchor="middle" font-size="13" fill="#7f1d1d">yüksek doz glukokortikoid</text><text x="160" y="254" text-anchor="middle" font-size="13" fill="#7f1d1d">+ immünsüpresif</text><text x="160" y="274" text-anchor="middle" font-size="13" fill="#7f1d1d">(arka üveit gibi tedavi edilir)</text></g><g class="a m s4"><rect x="335" y="144" width="290" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="480" y="194" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Parankim dışı</text><text x="480" y="214" text-anchor="middle" font-size="13" fill="#1e3a8a">serebral venöz tromboz</text><text x="480" y="234" text-anchor="middle" font-size="13" fill="#1e3a8a">glukokortikoid +</text><text x="480" y="254" text-anchor="middle" font-size="13" fill="#1e3a8a">antikoagülasyon ve/veya</text><text x="480" y="274" text-anchor="middle" font-size="13" fill="#1e3a8a">immünsüpresyon: olgu bazında</text></g><g class="a s5"><path class="a ciz" pathLength="1" d="M160,314 L280,370" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M480,314 L360,370" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s5"><rect x="90" y="374" width="460" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="409" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Her iki yolda: siklosporinden kaçın</text><text x="320" y="429" text-anchor="middle" font-size="13" fill="#78350f">nörotoksisitesi hastalık atağından ayırt edilemeyebilir</text><text x="320" y="449" text-anchor="middle" font-size="13" fill="#78350f">nörolojik epizot artışıyla ilişkili bulunmuş</text></g><g class="a s6"><text x="320" y="502" text-anchor="middle" font-size="12" fill="#475569">Kaynak: UpToDate (Smith, Yazici); Al-omoush 2025.</text></g>
</svg>
