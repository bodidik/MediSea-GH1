<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Romatoid artrit: tanıdan hedefe tedaviye</title>
<desc id="d">Birinci adım, şüphe: küçük eklemlerde simetrik şişlik ve bir saatten uzun sabah tutukluğu; en sık el bileği, MCP ve PIP; DIP tutulumu çoğu kez eşlik eden osteoartrittir. İkinci adım, sınıflama: 2010 ACR/EULAR, 10 üzerinden 6 ve üstü kesin romatoid artrit. Üçüncü adım, laboratuvar ve görüntüleme: IgM RF yüzde 75 pozitif, anti-CCP özgüllüğü yüzde 95'e yakın; sinovyal sıvıda 5000 ile 50000 lökosit; ilk grafi bulgusu periartiküler osteopeni. Dördüncü adım, başlangıç: metotreksat haftada 10 ile 25 miligram ve günde 1 miligram folik asit, köprü olarak düşük ya da orta doz glukokortikoit. Beşinci adım, hedefe göre tedavi: 3 ile 6 ayda hedefe ulaşılmadıysa üçlü oral tedavi ya da biyolojik veya JAK inhibitörü eklenir; remisyon SDAI 3,3 ve altı; yerleşik hastalıkta DMARD'ın tamamen kesilmesi neredeyse her zaman nükse yol açar.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,150 L320,172" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,274 L320,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,420 L320,442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,566 L320,588" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="20" width="560" height="130" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="320" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">1 · Şüphe</text><text x="320" y="74" text-anchor="middle" font-size="12" fill="#0c4a6e">El ve ayağın küçük eklemlerinde simetrik şişlik</text><text x="320" y="96" text-anchor="middle" font-size="12" fill="#0c4a6e">Sabah tutukluğu &gt;1 saat, hareketle açılır</text><text x="320" y="118" text-anchor="middle" font-size="12" fill="#0c4a6e">En sık: el bileği · MCP · PIP</text><text x="320" y="140" text-anchor="middle" font-size="12" fill="#0c4a6e">DIP çoğu kez eşlik eden osteoartrit</text></g>
<g class="a m s2"><rect x="40" y="174" width="560" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">2 · Sınıflama (2010 ACR/EULAR)</text><text x="320" y="228" text-anchor="middle" font-size="12" fill="#334155">Eklem 0–5 · seroloji 0–3 · akut faz 0–1 · süre 0–1</text><text x="320" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">≥6/10 = kesin RA</text></g>
<g class="a m s3"><rect x="40" y="298" width="560" height="122" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="326" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">3 · Laboratuvar ve görüntüleme</text><text x="320" y="350" text-anchor="middle" font-size="12" fill="#334155">IgM RF %75 pozitif · anti-CCP özgüllüğü ≈%95</text><text x="320" y="372" text-anchor="middle" font-size="12" fill="#334155">Sinovyal sıvı 5000–50.000/μL, nötrofil baskın</text><text x="320" y="394" text-anchor="middle" font-size="12" fill="#334155">İlk grafi bulgusu periartiküler osteopeni · MR/US daha erken</text></g>
<g class="a m s4"><rect x="40" y="444" width="560" height="122" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="472" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · Başlangıç</text><text x="320" y="496" text-anchor="middle" font-size="12" fill="#78350f">Metotreksat haftada 10–25 mg (ağızdan / deri altı)</text><text x="320" y="518" text-anchor="middle" font-size="12" fill="#78350f">+ günde 1 mg folik asit</text><text x="320" y="542" text-anchor="middle" font-size="12" fill="#78350f">DMARD etkisi 6–12 hafta → köprü: düşük-orta doz glukokortikoit</text></g>
<g class="a m s5"><rect x="40" y="590" width="560" height="212" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="618" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">5 · Hedefe göre tedavi</text><text x="320" y="644" text-anchor="middle" font-size="12" fill="#064e3b">3–6 ayda düşük etkinlik / remisyon yoksa:</text><text x="320" y="666" text-anchor="middle" font-size="12" fill="#064e3b">üçlü oral (MTX + sülfasalazin + hidroksiklorokin)</text><text x="320" y="688" text-anchor="middle" font-size="12" fill="#064e3b">ya da MTX + TNF inhibitörü / TNF dışı biyolojik / JAK inhibitörü</text><text x="320" y="718" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Remisyon: SDAI ≤3,3</text><text x="320" y="748" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Yerleşik hastalıkta DMARD'ı tamamen kesmek</text><text x="320" y="770" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">neredeyse her zaman nüks demektir</text></g>
</svg>
