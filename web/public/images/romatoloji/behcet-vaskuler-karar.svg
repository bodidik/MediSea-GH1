<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Behçet'te damar tutulumu: tromboz inflamasyondur — immünsüpresyon, antikoagülan ve anevrizma (EULAR 2018)</title>
<desc id="d">EULAR 2008'e göre Behçet'te venöz trombozun temel patolojisi damar duvarının inflamasyonudur; trombüs duvara yapışıktır ve emboli yapmaz, tromboz sık olmasına karşın pulmoner emboli nadirdir. EULAR 2018'e göre akut derin ven trombozunda glukokortikoid ile azatiyoprin, siklofosfamid ya da siklosporin A önerilir (III, C); vena kava gibi büyük ven trombozunda siklofosfamid saklanabilir. EULAR'ın üç retrospektif çalışmalık meta-analizinde immünsüpresif artı antikoagülan alanlarda yalnız antikoagülan alanlara göre tekrarlama riski RR 0,17 (0,08–0,35) idi; immünsüpresife antikoagülan eklemek ise anlamlı yarar sağlamadı (RR 0,75; 0,48–1,17). Dirençli venöz trombozda monoklonal anti-TNF düşünülebilir; antikoagülan, genel kanama riski düşükse ve eşlik eden pulmoner arter anevrizması dışlandıysa eklenebilir. Pulmoner arter anevrizmasında yüksek doz glukokortikoid (üç gün damar içi metilprednizolon, sonra 1 mg/kg/gün) ve aylık damar içi siklofosfamid; dirençli olguda anti-TNF; büyük kanama riski varsa açık cerrahi yerine embolizasyon. Aort ve periferik arter anevrizmasında onarımdan önce siklofosfamid ve kortikosteroid gerekir; hasta belirtiliyse cerrahi ya da stent geciktirilmez.</desc>
