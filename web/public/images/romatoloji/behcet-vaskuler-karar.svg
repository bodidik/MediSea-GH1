<rect width="640" height="700" fill="#ffffff"/>
<g class="a v1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="34.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Temel ilke</text><text x="320" y="54.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">trombozun nedeni damar DUVARININ inflamasyonu: trombüs duvara yapışık, emboli nadir</text><text x="320" y="71.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">tedavinin hedefi pıhtı değil, inflamasyon (EULAR 2008)</text></g>
<g class="a v2"><rect x="10" y="100" width="300" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="160" y="129.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Akut DVT · III/C</text><text x="160" y="149.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">glukokortikoid +</text><text x="160" y="166.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">AZA, siklofosfamid ya da</text><text x="160" y="183.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">siklosporin A</text><text x="160" y="200.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">vena kava / büyük ven: siklofosfamid</text><rect x="330" y="100" width="300" height="120" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="480" y="129.25" font-size="12.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">EULAR meta-analizi (3 retrospektif)</text><text x="480" y="149.25" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">İS + AK ↔ yalnız AK: nüks</text><text x="480" y="166.25" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">RR 0,17 (0,08–0,35)</text><text x="480" y="183.25" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">AK + İS ↔ yalnız İS: nüks</text><text x="480" y="200.25" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">RR 0,75 (0,48–1,17) — anlamsız</text></g>
<g class="a v3"><rect x="10" y="234" width="620" height="92" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="258.25" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Dirençli venöz tromboz · III/C</text><text x="320" y="278.25" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">monoklonal anti-TNF düşünülebilir</text><text x="320" y="295.25" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">antikoagülan EKLENEBİLİR — iki şartla: genel kanama riski düşük</text><text x="320" y="312.25" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">VE eşlik eden pulmoner arter anevrizması DIŞLANMIŞ</text></g>
<g class="a v4"><rect x="10" y="340" width="300" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="367.5" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Pulmoner arter anevrizması</text><text x="160" y="387.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">yüksek doz GC: 3 gün İV</text><text x="160" y="404.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">metilprednizolon → 1 mg/kg/gün</text><text x="160" y="421.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">+ aylık İV siklofosfamid</text><text x="160" y="438.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">dirençli: anti-TNF</text><text x="160" y="455.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">kanama/yüksek risk:</text><text x="160" y="472.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">EMBOLİZASYON &gt; açık cerrahi</text><rect x="330" y="340" width="300" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="376" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Aort / periferik anevrizma</text><text x="480" y="396" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">onarımdan ÖNCE</text><text x="480" y="413" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">siklofosfamid + kortikosteroid</text><text x="480" y="430" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">belirtili hastada cerrahi</text><text x="480" y="447" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">ya da stent GECİKTİRİLMEZ</text><text x="480" y="464" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">(2018'de yeni öneri)</text></g>
<g class="a v5"><rect x="10" y="504" width="620" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="528.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Serebral ven trombozu (ilk atak)</text><text x="320" y="548.75" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">yüksek doz glukokortikoid, sonra azaltma · kısa süre antikoagülan eklenebilir</text><text x="320" y="565.75" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">kafa dışı damar tutulumu için TARAMA gerekli</text></g>
<g class="a v6"><text x="320" y="612" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">2008 → 2018: antikoagülan "önerilmez"den "şartlı eklenebilir"e geçti;</text><text x="320" y="636" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0f172a">kanıt düzeyi hâlâ III (tanımlayıcı çalışmalar) — damar tutulumunda RCT yok.</text><text x="320" y="680" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: EULAR 2018 öneri 4–6, 9 ve meta-analizi; EULAR 2008 öneri 3–4</text></g>
</svg>
