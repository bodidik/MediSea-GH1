<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Behçet sendromunda organa göre tedavi: EULAR 2018 önerileri ve kanıt düzeyleri</title>
<desc id="d">EULAR 2018'e göre tedavi organ tutulumuna ve ağırlığa göre kişiselleştirilir; göz, damar, sinir sistemi ve gastrointestinal tutulum kötü prognozla ilişkili olabilir ve bulgular zamanla hafifleyebilir. Mukokutanöz tutulum: oral ve genital ülserde topikal steroid; tekrarlayan lezyonları önlemede önce kolşisin, özellikle baskın lezyon eritema nodozum ya da genital ülserse (kanıt IB, öneri A); seçilmiş hastada azatiyoprin, talidomid, interferon alfa, TNF inhibitörü ya da apremilast (IB, A). Eklem: akut artritte ilk tedavi kolşisin, monoartritte eklem içi glukokortikoid, tekrarlayan ya da kronik olguda azatiyoprin, interferon alfa ya da TNF inhibitörü (IB, A). Arka segmenti tutan göz hastalığında azatiyoprin (IB), siklosporin A (IB), interferon alfa (IIA) ya da monoklonal anti-TNF (IIA); sistemik glukokortikoid yalnız immünsüpresifle birlikte. Akut görmeyi tehdit eden üveitte yüksek doz glukokortikoid, infliksimab ya da interferon alfa (IIA, B). Gastrointestinal tutulum endoskopi ya da görüntülemeyle doğrulanır; NSAİİ ülseri, inflamatuvar barsak hastalığı ve tüberküloz dışlanır; atakta glukokortikoid ile 5-ASA ya da azatiyoprin, ağır ya da dirençli olguda anti-TNF ve/veya talidomid (III, C). Parankimal nörolojik atakta yüksek doz glukokortikoid ve azatiyoprin, siklosporinden kaçınılır, ağır hastalıkta anti-TNF ilk basamakta da düşünülür (III, C).</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.o6{animation-name:o6}@keyframes o6{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.o6 .ciz{animation-name:o6c}@keyframes o6c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="34.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Ortak ilkeler (EULAR 2018)</text><text x="320" y="54.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">amaç: alevlenmeyi hızla bastırıp kalıcı organ hasarını önlemek · çok disiplinli bakım</text><text x="320" y="71.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">yaş, cinsiyet, organ ve ağırlığa göre kişiselleştir · göz, damar, sinir, GİS = kötü prognoz</text></g>
<g class="a o2"><rect x="10" y="100" width="300" height="132" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="127" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Mukokutanöz · IB/A</text><text x="160" y="147" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">ülser: topikal steroid</text><text x="160" y="164" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">önleme: önce KOLŞİSİN</text><text x="160" y="181" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">(eritema nodozum, genital ülser)</text><text x="160" y="198" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">seçilmişte: AZA, talidomid,</text><text x="160" y="215" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">IFN-α, anti-TNF, apremilast</text><rect x="330" y="100" width="300" height="132" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="480" y="135.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Eklem · IB/A</text><text x="480" y="155.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">akut artrit: önce KOLŞİSİN</text><text x="480" y="172.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">monoartrit: eklem içi steroid</text><text x="480" y="189.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">tekrarlayan / kronik:</text><text x="480" y="206.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">AZA, IFN-α ya da anti-TNF</text></g>
<g class="a o3"><rect x="10" y="246" width="620" height="112" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="271.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Göz (arka segment) · IB/IIA</text><text x="320" y="291.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">her hastada: AZA (IB) · siklosporin A (IB) · IFN-α (IIA) · monoklonal anti-TNF (IIA)</text><text x="320" y="308.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">sistemik glukokortikoid YALNIZ immünsüpresifle birlikte</text><text x="320" y="325.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">akut görmeyi tehdit eden atak: yüksek doz GC, infliksimab ya da IFN-α (IIA/B) · tek gözde: + göz içi GC</text><text x="320" y="342.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">izole ön üveit: genç, erkek, erken başlangıçta sistemik tedavi düşünülebilir (IV/D)</text></g>
<g class="a o4"><rect x="10" y="372" width="300" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="399.5" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Gastrointestinal · III/C</text><text x="160" y="419.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">önce DOĞRULA: endoskopi/görüntüleme</text><text x="160" y="436.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">dışla: NSAİİ ülseri, İBH, tüberküloz</text><text x="160" y="453.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">atak: GC + 5-ASA ya da AZA</text><text x="160" y="470.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ağır/dirençli: anti-TNF ± talidomid</text><text x="160" y="487.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">perforasyon, kanama, tıkanma:</text><text x="160" y="504.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ACİL cerrahi konsültasyon</text><rect x="330" y="372" width="300" height="150" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="399.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Sinir sistemi · III/C</text><text x="480" y="419.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">parankimal atak: yüksek doz GC</text><text x="480" y="436.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">+ AZA; SİKLOSPORİNDEN KAÇIN</text><text x="480" y="453.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">ağır: anti-TNF (ilk basamakta da)</text><text x="480" y="470.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">serebral ven trombozu: yüksek doz</text><text x="480" y="487.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">GC, kısa süre antikoagülan eklenebilir</text><text x="480" y="504.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">+ kafa dışı damar taraması</text></g>
<g class="a o5"><rect x="10" y="536" width="620" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="560.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">Damar (ayrıntı: Şekil 2)</text><text x="320" y="580.75" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">DVT: GC + immünsüpresif (AZA, siklofosfamid, siklosporin A) · dirençli: anti-TNF</text><text x="320" y="597.75" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">pulmoner arter anevrizması: yüksek doz GC + siklofosfamid · kanamada embolizasyon &gt; açık cerrahi</text></g>
<g class="a o6"><text x="320" y="644" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">Kanıt düzeyi: IB = en az bir RCT · IIA = randomize olmayan kontrollü · III = tanımlayıcı · IV = uzman görüşü</text><text x="320" y="668" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Göz, deri-mukoza ve eklemde kanıt RCT'ye dayanıyor; damar, sinir ve GİS'te çoğunlukla gözlemsel.</text><text x="320" y="730" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: EULAR 2018 (Hatemi ve ark., Ann Rheum Dis 2018), Tablo 1</text></g>
</svg>
