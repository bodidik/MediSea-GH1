hor="middle" font-size="13" fill="#78350f">tedavi altında gelişmiş olabilir</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">ilk MİK duyarlı olsa bile</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">hVISA · VISA · nadiren VRSA</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Gizli odak?</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#7f1d1d">tanınmamış apse</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#7f1d1d">metastatik enfeksiyon</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#7f1d1d">bakteriyemi uzadıkça komplikasyon</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">MİK yöntemiyle ölç: mikrodilüsyon, agar, Etest</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#0f172a">tam 24 saat · disk ve otomatik sistem yetmez · MİK 2'de doğrula</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">CLSI sınıfı</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#1e3a8a">≤2 duyarlı · 4–8 VISA · ≥16 VRSA</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#1e3a8a">hVISA: doğrulanmış rutin test yok</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#1e3a8a">en doğrusu popülasyon analizi</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Yanıt var mı?</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">vankomisin ya da daptomisinle</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">temizleniyorsa aynı ilaçla sürdür</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">yanıt yoksa sonraki adım</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Yanıt yok: odağa göre seç</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#4c1d95">kaynak kontrolü var, derin odak yok: telavansin, seftarolin ya da linezolid</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#4c1d95">derin odak var: daptomisin 8–10 mg/kg + seftarolin</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#4c1d95">daptomisin TEK BAŞINA verilmez: tedavi altında direnç</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Yayılımı önle</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#7f1d1d">temas önlemi ve el hijyeni · gereksiz kateteri çıkar</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#7f1d1d">enfeksiyon hastalıkları ve halk sağlığı danışması · izolat referansa</text></g>
</svg>
