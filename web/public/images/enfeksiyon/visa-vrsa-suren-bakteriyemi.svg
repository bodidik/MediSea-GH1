<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Süren S. aureus bakteriyemisi: azalmış vankomisin duyarlılığı ne zaman, nasıl aranır</title>
<desc id="d">Uygun kaynak kontrolüne ve görünüşte uygun tedaviye karşın steril bölgeden S. aureus 2 ila 3 günden uzun süre üremeye devam ediyorsa iki olasılık düşünülür. Birincisi tedavi altında gelişmiş azalmış vankomisin duyarlılığıdır, ilk izolatın MİK'i duyarlı aralıkta olsa bile. İkincisi gözden kaçmış apse ya da metastatik odaktır. Laboratuvarda MİK yöntemiyle ölçüm gerekir: mikrodilüsyon, agar dilüsyon ya da Etest, tam 24 saat inkübasyonla; disk difüzyon ve otomatik sistemler yetmez. MİK 2 µg/mL olan izolatta doğrulama yapılır, şüpheli izolat referans laboratuvarına gönderilir. CLSI'ye göre MİK 4 ila 8 µg/mL orta duyarlı yani VISA, 16 ve üstü dirençli yani VRSA'dır; heterorezistan VISA için doğrulanmış rutin test yoktur, en doğru yöntem popülasyon analizidir. Vankomisin ya da daptomisine yanıt veren hasta aynı ilaçla sürdürebilir. Yanıt yoksa, kaynak kontrol edilmiş ve derin odak dışlanmışsa duyarlılığa göre telavansin, seftarolin ya da linezolid ile tek ilaç tedavisi makuldür. Derin odak varsa 8 ila 10 mg/kg daptomisin ile seftarolin birleşimi tercih edilir. Daptomisin tek başına kullanılmaz, tedavi altında direnç riskini artırır. Temas önlemleri ve el hijyeni sıkılaştırılır, gereksiz kateter çıkarılır, enfeksiyon hastalıkları ve halk sağlığı birimine danışılır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
