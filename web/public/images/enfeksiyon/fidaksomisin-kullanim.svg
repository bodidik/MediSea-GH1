<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Fidaksomisin: ne zaman, hangi şema, nerede kullanılmaz</title>
<desc id="d">Fidaksomisin C. difficile enfeksiyonunda kullanılan, bağırsaktan çok az emilen bir ilaçtır. Fulminan olmayan ilk atakta UpToDate'in önerdiği ilaçtır: günde iki kez 200 mg, 10 gün. Dört randomize denemenin birleşik analizinde ilk iyileşme vankomisinle aynıydı, ama tedaviden dört hafta sonra iyileşmiş kalma fidaksomisinde daha sıktı; göreli risk 1,16. Uzatılmış aralıklı şemada ilk beş gün günde iki kez, 7. ile 25. günler arasında gün aşırı bir kez 200 mg verilir; yatan 364 hastalık denemede 30. gün iyileşme yüzde 70'e karşı 59, nüks yüzde 2'ye karşı 17 idi. İlk nüks vankomisinden sonraysa fidaksomisin şemalarından biri seçilir; ikinci nükste de önerilir ve ardından fekal mikrobiyota ürünü verilir. Azaltılarak kesilen vankomisin başarısız olmuş 46 hastada azaltılarak aralıklı fidaksomisinle 30. ve 90. gün iyileşme yüzde 74 ve 61 idi. Fidaksomisin mikrobiyomu çok az bozar. Fulminan hastalıkta kanıt ve deneyim olmadığı için kullanılmaz. Uzun süreli baskılamada ve ikincil korunmada verisi yoktur.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
