hor="middle" font-size="13" fill="#064e3b">önerilen ilaç</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#064e3b">200 mg günde iki kez, 10 gün</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#064e3b">özellikle yüksek nüks riskinde</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kanıt</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">4 deneme, 1673 hasta</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ilk iyileşme eşit (GR 1,00)</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">4. hafta iyileşme GR 1,16</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Uzatılmış aralıklı şema</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#4c1d95">1–5. gün 200 mg × 2 · 7–25. gün gün aşırı 200 mg × 1</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">364 hasta (yatan)</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#1e3a8a">30. gün iyileşme %70'e karşı %59</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#1e3a8a">nüks %2'ye karşı %17</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#1e3a8a">karşılaştırma: vankomisin 10 gün</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Nükslerde</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">ilk nüks vankomisin sonrasıysa</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">2. nüks: + fekal mikrobiyota ürünü</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">kurtarma: 46 hastada %74 / %61</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Kullanılmaz</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#7f1d1d">fulminan kolit: kanıt ve deneyim yok → vankomisin + damar içi metronidazol</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#7f1d1d">uzun süreli baskılama ve ikincil korunma: veri yok</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#7f1d1d">ilk nüks fidaksomisin sonrasıysa: azaltılarak kesilen vankomisin yeğlenir</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Ciddi hastalıkta</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#0f172a">denemede iyileşme %82'ye karşı %88 (vankomisin): benzer</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#0f172a">gözlemsel çalışmada 30 gün nüks %2,4'e karşı %13,6</text></g>
