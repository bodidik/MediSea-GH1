<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Glikopeptitler: hedef, direnç ve hangi ilacın hangi direnç tipine etkili olduğu</title>
<desc id="d">Glikopeptitlerin hedefi hücre duvarı öncülünün D-alanil-D-alanin ucudur. Vankomisin ve teikoplanin bu uca bağlanıp çapraz bağlanmayı engeller. Lipoglikopeptitler buna ek olarak zara tutunur: telavansin zarı depolarize eder, oritavansin zar bütünlüğünü bozar, dalbavansin uzun yan zinciriyle zara bağlanıp yarı ömrünü uzatır. Enterokokta direnç, ucun D-alanil-D-laktata dönüşmesidir; vankomisin bağlanma afinitesi yaklaşık bin kat düşer. vanA kümesi yüksek düzey vankomisin ve teikoplanin direnci verir; buna oritavansin etkilidir, dalbavansin etkili değildir. vanB kümesini teikoplanin ve dalbavansin iyi uyarmadığı için suş onlara duyarlı kalır; telavansin de yalnız vanB'ye etkilidir. vanC D-alanil-D-serin yapar ve E. gallinarum ile E. casseliflavus'ta doğal, düşük düzey dirençtir; MİK 8 ila 16 µg/mL. S. aureus'ta VISA gen kazanımı değil, kalınlaşmış duvarın ilacı tuzağa düşürmesidir; VRSA ise enterokoktan vanA'nın aktarılmasıdır ve çok nadirdir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,13%{opacity:0;transform:translateY(8px)}16%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,13%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,25%{opacity:0;transform:translateY(8px)}28%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,25%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,38%{opacity:0;transform:translateY(8px)}41%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,38%{stroke-dashoffset:1}43%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,63%{opacity:0;transform:translateY(8px)}66%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,63%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,75%{opacity:0;transform:translateY(8px)}78%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,75%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,88%{opacity:0;transform:translateY(8px)}91%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,88%{stroke-dashoffset:1}93%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="830" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M260,96 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M380,96 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,266 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,266 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,376 L165,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,376 L477,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,540 L220,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,540 L420,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,684 L320,714" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="53.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Hedef: D-Ala-D-Ala ucu</text><text x="320" y="73.5" text-anchor="middle" font-size="13" fill="#0f172a">hücre duvarı öncülü · bağlanınca çapraz bağlanma durur</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Glikopeptitler</text><text x="162.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">vankomisin · teikoplanin</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">uca hidrojen bağıyla tutunur</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">zar etkisi yok</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Lipoglikopeptitler</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#4c1d95">telavansin: zarı depolarize eder</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#4c1d95">oritavansin: zar bütünlüğünü bozar</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#4c1d95">dalbavansin: zara tutunur, uzun ömür</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Enterokok direnci: uç D-Ala-D-Lac olur</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#7f1d1d">vankomisin afinitesi ~1000 kat düşer · genler van kümelerinde</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">vanA</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#7f1d1d">vankomisin + teikoplanin yüksek düzey</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#7f1d1d">oritavansin ETKİLİ</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#7f1d1d">dalbavansin etkisiz</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">vanB</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">teikoplanin ve dalbavansin uyarmaz</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">bu yüzden ikisine duyarlı</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">telavansin de yalnız vanB'ye</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">vanC: doğal, düşük düzey</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#064e3b">D-Ala-D-Ser · E. gallinarum ve E. casseliflavus</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#064e3b">vankomisin MİK 8–16 µg/mL</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#064e3b">çoğu 32 µg/mL ile inhibe olur</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">S. aureus</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#4c1d95">VISA: gen kazanımı yok, kalın duvar ilacı tuzağa düşürür</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#4c1d95">VRSA: enterokoktan vanA aktarımı (Tn1546) · çok nadir</text></g>
</svg>
