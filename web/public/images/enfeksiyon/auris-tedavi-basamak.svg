<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">C. auris enfeksiyonunda tedavi basamakları</title>
<desc id="d">Candidozyma auris enfeksiyonunda her izolatın antifungal duyarlılığı test edilir ve tedavi sonuca göre yönlendirilir. Erişkinde ve 2 aydan büyük çocukta ilk seçenek ekinokandindir; anidulafungin, kaspofungin ve mikafungin eşit etkilidir. Direnç tedavi sırasında birkaç haftada, FKS1 sıcak nokta mutasyonlarıyla gelişebileceği için kan kültürüyle yakından izlenir. Ekinokandin direnci saptanırsa ya da 5 gün içinde düzelme yoksa günde 5 mg/kg lipozomal amfoterisin B'ye geçilir; EUCAST'a göre vahşi tip C. auris amfoterisin için artırılmış maruziyetle duyarlıdır, yani yüksek doz gerekir. 2 aydan küçük bebekte ilk seçenek günde 1 mg/kg amfoterisin B deoksikolattır. Azoller genellikle işe yaramaz; izolatların çoğu flukonazole dirençlidir. Merkezi sinir sisteminde ekinokandin tek başına BOS'a zayıf geçtiği için güvenilmez; lipozomal amfoterisin B çoğu kez flusitozin ya da ekinokandinle birlikte verilir. Flusitozin hızla direnç geliştirdiği için tek başına verilmez. Fosmanogepiks, ibrexafungerp ve rezafungin gibi yeni ilaçlar umut verir ama C. auris verisi azdır.</desc>
