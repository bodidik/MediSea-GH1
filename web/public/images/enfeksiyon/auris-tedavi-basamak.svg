le" font-size="13" fill="#064e3b">erişkin ve &gt;2 aylık çocuk</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#064e3b">anidula-, kaspo-, mikafungin eşit</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#064e3b">EUCAST S ≤0,25 mg/L</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Yakın izlem</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">direnç ~2 haftada gelişebilir</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">FKS1 sıcak noktaları</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">kontrol kan kültürleri</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Direnç ya da 5 günde yanıt yok</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#4c1d95">lipozomal amfoterisin B 5 mg/kg/gün (standart 3 değil)</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Amfoterisin ve EUCAST</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#1e3a8a">S ≤0,001 · R &gt;2 mg/L</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#1e3a8a">vahşi tip = artırılmış maruziyet</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#1e3a8a">→ yüksek doz gerekir</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Azoller</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#7f1d1d">çoğu izolat flukonazole dirençli</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#7f1d1d">ERG11, TAC1b mutasyonları</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#7f1d1d">genellikle işe yaramaz</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Özel durumlar</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#4c1d95">&lt;2 aylık bebek: amfoterisin B deoksikolat 1 mg/kg/gün</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#4c1d95">merkezi sinir sistemi: ekinokandin tek başına güvenilmez → L-AmB ± flusitozin</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#4c1d95">flusitozin asla tek başına: direnç hızla gelişir</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Yeni ilaçlar</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#064e3b">fosmanogepiks: 9 hastalık çalışmada 8'i iyileşti · ibrexafungerp, rezafungin</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#064e3b">C. auris verisi az; çoğu onaysız ya da başka endikasyonda onaylı</text></g>
