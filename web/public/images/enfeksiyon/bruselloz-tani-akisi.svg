<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bruselloz: tanı akışı</title>
<desc id="d">Uyumlu klinik ve maruziyet varsa kan kültürü ve seroloji istenir, laboratuvar uyarılır. Kültürde üreme ya da iki hafta arayla en az dört kat titre artışı kesin tanıdır. SAT en az 1:160 ya da PCR pozitifliği olası tanıdır. İkisi de negatifse kliniğe göre sinovyal sıvı, görüntüleme ya da lomber ponksiyon yapılır; sonuç çıkmazsa kemik iliği biyopsisi, karaciğer tutulumu varsa karaciğer biyopsisi yapılır.</desc>
<!-- 13.5 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:13.5s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,11%{opacity:0;transform:translateY(8px)}14%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,11%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,22%{opacity:0;transform:translateY(8px)}25%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,22%{stroke-dashoffset:1}27%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,33%{opacity:0;transform:translateY(8px)}36%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,44%{opacity:0;transform:translateY(8px)}47%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,44%{stroke-dashoffset:1}49%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,56%{opacity:0;transform:translateY(8px)}59%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,56%{stroke-dashoffset:1}61%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,67%{opacity:0;transform:translateY(8px)}70%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,78%{opacity:0;transform:translateY(8px)}81%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,78%{stroke-dashoffset:1}83%,100%{stroke-dashoffset:0}}
.s9{animation-name:s9}@keyframes s9{0%,89%{opacity:0;transform:translateY(8px)}92%, 100%{opacity:1;transform:none}}
.s9 .ciz{animation-name:c9}@keyframes c9{0%,89%{stroke-dashoffset:1}94%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,112 L320,146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M200,242 L120,281" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M320,242 L320,281" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M440,242 L525,281" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M527,415 L527,451" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M262,547 L262,581" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M375,640 L396,640" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="80" y="20" width="480" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="50.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Uyumlu klinik + maruziyet</text><text x="320" y="70.5" text-anchor="middle" font-size="13" fill="#0f172a">ateş · halsizlik · gece terlemesi · artralji</text><text x="320" y="90.5" text-anchor="middle" font-size="13" fill="#0f172a">çiğ süt ürünü · hayvan teması · laboratuvar</text></g><g class="a m s2"><rect x="80" y="150" width="480" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="180.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kan kültürü + seroloji</text><text x="320" y="200.5" text-anchor="middle" font-size="13" fill="#1e3a8a">tam kan sayımı · karaciğer testleri</text><text x="320" y="220.5" text-anchor="middle" font-size="13" fill="#1e3a8a">laboratuvarı önceden uyar (BSL-3 önlemi)</text></g><g class="a m s3"><rect x="15" y="285" width="195" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="112.5" y="324.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Kesin tanı</text><text x="112.5" y="344.5" text-anchor="middle" font-size="13" fill="#064e3b">kültürde üreme ya da</text><text x="112.5" y="364.5" text-anchor="middle" font-size="13" fill="#064e3b">2 hafta arayla</text><text x="112.5" y="384.5" text-anchor="middle" font-size="13" fill="#064e3b">≥4 kat titre artışı</text></g><g class="a m s4"><rect x="222" y="285" width="196" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="324.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Olası tanı</text><text x="320" y="344.5" text-anchor="middle" font-size="13" fill="#78350f">SAT ≥1:160 ya da</text><text x="320" y="364.5" text-anchor="middle" font-size="13" fill="#78350f">örnekte Brucella</text><text x="320" y="384.5" text-anchor="middle" font-size="13" fill="#78350f">DNA'sı (PCR)</text></g><g class="a m s5"><rect x="430" y="285" width="195" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="527.5" y="334.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Kültür + seroloji</text><text x="527.5" y="354.5" text-anchor="middle" font-size="13" fill="#4c1d95">negatif ama</text><text x="527.5" y="374.5" text-anchor="middle" font-size="13" fill="#4c1d95">şüphe sürüyor</text></g><g class="a m s6"><rect x="150" y="455" width="475" height="92" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="387.5" y="485.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Bulguya göre ilerle</text><text x="387.5" y="505.5" text-anchor="middle" font-size="13" fill="#4c1d95">eklem: sinovyal sıvı + görüntüleme</text><text x="387.5" y="525.5" text-anchor="middle" font-size="13" fill="#4c1d95">nörolojik: lomber ponksiyon</text></g><g class="a m s7"><rect x="150" y="585" width="225" height="110" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="262.5" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Kemik iliği biyopsisi</text><text x="262.5" y="634.5" text-anchor="middle" font-size="13" fill="#0f172a">kültür + histopatoloji</text><text x="262.5" y="654.5" text-anchor="middle" font-size="13" fill="#0f172a">önceki antibiyotikten</text><text x="262.5" y="674.5" text-anchor="middle" font-size="13" fill="#0f172a">duyarlılığı düşmez</text></g><g class="a m s8"><rect x="400" y="585" width="225" height="110" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="512.5" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Karaciğer biyopsisi</text><text x="512.5" y="634.5" text-anchor="middle" font-size="13" fill="#0f172a">kemik iliği tanı</text><text x="512.5" y="654.5" text-anchor="middle" font-size="13" fill="#0f172a">koydurmadıysa ve</text><text x="512.5" y="674.5" text-anchor="middle" font-size="13" fill="#0f172a">karaciğer tutulumu varsa</text></g><g class="a s9"><text x="320" y="738" text-anchor="middle" font-size="12" fill="#475569">Akış UpToDate (Bosilkovski, 2026). SAT: standart tüp aglütinasyon testi.</text></g>
</svg>
