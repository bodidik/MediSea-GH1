<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ağır S. aureus enfeksiyonunda vankomisin: doz ve izlem yolu</title>
<desc id="d">Ağır S. aureus enfeksiyonu bakteriyemi, endokardit, osteomiyelit, protez eklem enfeksiyonu, yatış gerektiren pnömoni ya da kritik hastalık demektir. Yükleme dozu gerçek kiloya göre 20 ila 35 mg/kg'dır, en çok 3000 mg; kritik hastada 25 ila 30, diyalizde, obezitede ve sürekli infüzyonda 20 mg/kg. İdame dozu 8 ila 12 saatte bir 15 ila 20 mg/kg'dır; tek doz 2000 mg'ı, obezitede günlük doz 4500 mg'ı düzey izlemi gerektirmedikçe aşmaz. Sonra iki soru sorulur: böbrek işlevi stabil mi, eczacı ve EAA hesaplayıcısı var mı? Evetse EAA rehberli dozlama yapılır: hedef EAA/MİK 400 ila 600 mg·saat/L'dir, MİK 1 µg/mL varsayımıyla; Bayes hesaplayıcısıyla ilk 24 ila 48 saatte bir tepe ve bir çukur, birinci derece denklemlerle dördüncü doz çevresinde iki düzey alınır. Hayırsa çukur rehberli dozlama yapılır: dördüncü dozdan önceki 30 dakikada çukur, ağır enfeksiyonda hedef 15 ila 20 µg/mL; böbrek işlevi dengesizse düzeye göre doz verilir. Tedavi 48 ila 72 saati aşarsa düzey ve kreatinin en az haftada bir izlenir; doz değişince dördüncü dozdan önce yeniden ölçülür. Uyarılar: MİK 2 ve üstündeyse hedefe ulaşılamaz, başka ilaç düşünülür; piperasilin-tazobaktam, aminoglikozit, kıvrım diüretiği, kontrast ve vazopresör böbrek hasarı riskini artırır; böbrek hasarı gelişirse vankomisin kesilir.</desc>
