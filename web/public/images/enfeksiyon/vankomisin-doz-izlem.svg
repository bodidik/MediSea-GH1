hor="middle" font-size="13" fill="#1e3a8a">20–35 mg/kg gerçek kilo, ≤3000 mg</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">kritik hasta: 25–30 mg/kg</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">diyaliz, obezite, sürekli inf.: 20</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">İlk idame dozu</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">15–20 mg/kg, 8–12 saatte bir</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">tek doz ≤2000 mg</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">obezitede günlük ≤4500 mg</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Böbrek işlevi stabil mi? Eczacı ve EAA aracı var mı?</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#0f172a">iki soru, iki yol</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Evet: EAA rehberli</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">EAA/MİK 400–600 (MİK 1)</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">Bayes: 24–48 sa, tepe + çukur</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">denklem: 4. doz çevresi, 2 düzey</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Hayır: çukur rehberli</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">4. dozdan önceki 30 dk</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">ağır enfeksiyonda 15–20 µg/mL</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">dengesiz böbrek: düzeye göre doz</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Sürekli izlem</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#4c1d95">tedavi 48–72 saati aşarsa düzey + kreatinin en az haftalık</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#4c1d95">doz değişince 4. dozdan önce yeniden ölç</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#4c1d95">toplam günlük doz EAA'yı orantılı değiştirir; aralık değiştirmek orantılı değil</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Dur ve düşün</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#7f1d1d">MİK ≥2: hedefe ulaşılamaz, başka ilaç</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#7f1d1d">pip-tazo, aminoglikozit, kontrast eşlik ediyorsa ABH riski · ABH: kes</text></g>
