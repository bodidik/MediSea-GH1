<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Karbapeneme dirençli Enterobacterales: karbapenemaza göre tedavi</title>
<desc id="d">Karbapeneme dirençli Enterobacterales'te önce izolatın kinolon ya da trimetoprim-sülfametoksazol gibi standart bir ilaca duyarlı olup olmadığına bakılır. Sonra karbapenemaz testi yapılır: fenotipik test ya da PCR paneli; test yoksa duyarlılık profili ve son 12 ayda karbapenemazın sık olduğu bölgede bakım alma öyküsü yol gösterir. Karbapenemaz negatifse seftazidim-avibaktam, meropenem-vaborbaktam ya da imipenem-relebaktam verilir, sefiderokol alternatiftir; ABD'de karbapeneme dirençli suşların yaklaşık yüzde 70'i karbapenemaz üretmez. Karbapenemaz pozitifse türüne bakılır; seftazidim-avibaktam direnci metallo-beta-laktamazı düşündürür. KPC'de seftazidim-avibaktam ya da meropenem-vaborbaktam, daha az veriyle imipenem-relebaktam verilir, sefiderokol alternatiftir; seftazidim-avibaktam altında direnç gelişimi yaklaşık yüzde 20'dir. Türkiye'de en sık görülen OXA-48 türünde seftazidim-avibaktam verilir, sefiderokol alternatiftir; meropenem-vaborbaktam ve imipenem-relebaktam güvenilmez. NDM, VIM ve IMP gibi metallo-beta-laktamazlarda aztreonam-avibaktam ya da seftazidim-avibaktam artı aztreonam verilir, sefiderokol olası alternatiftir; seftazidim-avibaktam, meropenem-vaborbaktam ve imipenem-relebaktam tek başına etkisizdir. Polimiksinlerden kaçınılır: daha çok ölüm ve böbrek hasarıyla ilişkilidirler. Tigesiklin ve eravasiklin kanda ve idrarda yeterli düzeye ulaşmaz.</desc>
