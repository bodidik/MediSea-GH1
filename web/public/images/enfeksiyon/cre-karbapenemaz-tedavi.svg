ze="13" fill="#1e3a8a">fenotipik test ya da PCR paneli</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">yoksa: duyarlılık profili + öykü</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">(12 ayda riskli bölge, bakım)</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Karbapenemaz negatif</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">CAZ-AVI · MVB · IMI-REL</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">sefiderokol alternatif</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">ABD'de CRE'nin ~%70'i</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Karbapenemaz pozitif: türüne bak</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#0f172a">CAZ-AVI direnci MBL'yi düşündürür</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">KPC</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">CAZ-AVI ya da MVB (IMI-REL)</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">sefiderokol alternatif</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">CAZ-AVI altında direnç ~%20</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill=