<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bruselloz: tutuluma ve hastaya göre tedavi</title>
<desc id="d">Spondilit, nörobruselloz ya da endokardit yoksa altı haftalık doksisiklin artı aminoglikozid, oral seçenek olarak doksisiklin artı rifampin verilir. Spondilitte aminoglikozide ek doksisiklin ve rifampin en az 12 hafta. Nörobrusellozda seftriakson 4 ila 6 hafta, rifampin ve doksisiklin en az 12 hafta. Endokarditte aminoglikozid dört hafta, rifampin ve doksisiklin en az 12 hafta, tüm hastalara cerrahi konsültasyon. Gebelikte 36 haftadan önce rifampin artı TMP-SMX, 36 haftadan sonra doğuma kadar rifampin. RB51 suşunda rifampin kullanılmaz; doksisiklin artı TMP-SMX verilir. Tek ilaç ve altı haftadan kısa tedavi kabul edilmez.</desc>
<!-- 13.5 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:13.5s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,11%{opacity:0;transform:translateY(8px)}14%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,11%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,22%{opacity:0;transform:translateY(8px)}25%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,22%{stroke-dashoffset:1}27%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,33%{opacity:0;transform:translateY(8px)}36%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,44%{opacity:0;transform:translateY(8px)}47%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,44%{stroke-dashoffset:1}49%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,56%{opacity:0;transform:translateY(8px)}59%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,56%{stroke-dashoffset:1}61%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,67%{opacity:0;transform:translateY(8px)}70%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,78%{opacity:0;transform:translateY(8px)}81%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,78%{stroke-dashoffset:1}83%,100%{stroke-dashoffset:0}}
.s9{animation-name:s9}@keyframes s9{0%,89%{opacity:0;transform:translateY(8px)}92%, 100%{opacity:1;transform:none}}
.s9 .ciz{animation-name:c9}@keyframes c9{0%,89%{stroke-dashoffset:1}94%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="800" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M230,96 L162,131" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M410,96 L477,131" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="120" y="20" width="400" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="52.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Önce sor</text><text x="320" y="72.5" text-anchor="middle" font-size="13" fill="#0f172a">spondilit · SSS · endokardit · gebelik · RB51</text></g><g class="a m s2"><rect x="15" y="135" width="295" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="184.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Odak yok ya da diğer odak</text><text x="162.5" y="204.5" text-anchor="middle" font-size="13" fill="#064e3b">(sakroiliit, periferik artrit)</text><text x="162.5" y="224.5" text-anchor="middle" font-size="13" fill="#064e3b">D 6 hf + S 14–21 g ya da G 7–10 g</text><text x="162.5" y="244.5" text-anchor="middle" font-size="13" fill="#064e3b">oral: D + R 6 hf</text></g><g class="a m s3"><rect x="330" y="135" width="295" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="184.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Spondilit</text><text x="477.5" y="204.5" text-anchor="middle" font-size="13" fill="#78350f">D + R ≥12 hf</text><text x="477.5" y="224.5" text-anchor="middle" font-size="13" fill="#78350f">+ S 14–21 g ya da G 7–14 g</text><text x="477.5" y="244.5" text-anchor="middle" font-size="13" fill="#78350f">bulgu sürerse uzat</text></g><g class="a m s4"><rect x="15" y="305" width="295" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="162.5" y="354.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Nörobruselloz</text><text x="162.5" y="374.5" text-anchor="middle" font-size="13" fill="#4c1d95">seftriakson 4–6 hf</text><text x="162.5" y="394.5" text-anchor="middle" font-size="13" fill="#4c1d95">+ R + D ≥12 hf</text><text x="162.5" y="414.5" text-anchor="middle" font-size="13" fill="#4c1d95">çoğu kez 4–6 aya uzar</text></g><g class="a m s5"><rect x="330" y="305" width="295" height="150" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="354.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Endokardit</text><text x="477.5" y="374.5" text-anchor="middle" font-size="13" fill="#7f1d1d">aminoglikozid 4 hf</text><text x="477.5" y="394.5" text-anchor="middle" font-size="13" fill="#7f1d1d">+ R + D ≥12 hf</text><text x="477.5" y="414.5" text-anchor="middle" font-size="13" fill="#7f1d1d">herkese cerrahi konsültasyon</text></g><g class="a m s6"><rect x="15" y="475" width="295" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="524.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Gebelik (odak yok)</text><text x="162.5" y="544.5" text-anchor="middle" font-size="13" fill="#1e3a8a">&lt;36 hf: R + TMP-SMX 6 hf, folat</text><text x="162.5" y="564.5" text-anchor="middle" font-size="13" fill="#1e3a8a">≥36 hf: doğuma dek R</text><text x="162.5" y="584.5" text-anchor="middle" font-size="13" fill="#1e3a8a">doğumdan sonra 6 haftaya tamamla</text></g><g class="a m s7"><rect x="330" y="475" width="295" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="477.5" y="524.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">RB51 aşı suşu</text><text x="477.5" y="544.5" text-anchor="middle" font-size="13" fill="#0f172a">rifampine dirençli</text><text x="477.5" y="564.5" text-anchor="middle" font-size="13" fill="#0f172a">D + TMP-SMX 6 hf</text><text x="477.5" y="584.5" text-anchor="middle" font-size="13" fill="#0f172a">maruziyeti sor</text></g><g class="a m s8"><rect x="80" y="660" width="480" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="692.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Tek ilaç ve &lt;6 hafta: kabul edilmez</text><text x="320" y="712.5" text-anchor="middle" font-size="13" fill="#7f1d1d">yüksek relaps; relapsta önce fokal odak ara</text></g><g class="a s9"><text x="320" y="778" text-anchor="middle" font-size="12" fill="#475569">Rejimler UpToDate (Bosilkovski, 2026); erişkin için. Dozlar metindedir.</text></g>
</svg>
