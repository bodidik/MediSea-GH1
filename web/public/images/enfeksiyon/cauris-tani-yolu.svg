<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">C. auris: laboratuvarda doğru tanımlama</title>
<desc id="d">Klinik örnekten üreyen maya, eski kütüphaneli biyokimyasal sistemlerde sıklıkla Candida haemulonii ya da duobushaemulonii olarak yanlış tanımlanır. Bu isimler, tanımlanamayan maya ya da flukonazole dirençli Candida raporu C. auris şüphesi uyandırmalıdır. Kesin tanı güncel kütüphaneli MALDI-TOF ya da rDNA dizilemesiyle konur. Doğrulanan izolatta antifungal duyarlılık testi yapılır, olgu bildirilir ve temaslılar taranır.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="478" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Klinik örnekten maya üredi</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Kan, idrar, yara, solunum yolu,</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">kateter ucu</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="300" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Biyokimyasal sistem</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">C. haemulonii / duobushaemulonii</text><text x="160" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ya da “tanımlanamadı” — alarm</text><rect x="330" y="112" width="300" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="480" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Güncel MALDI-TOF</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">ya da D1-D2 / ITS dizileme</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">→ C. auris doğrulandı</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="620" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="240.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">Doğrulanınca</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">Antifungal duyarlılık testi · bildirim</text><text x="320" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">temas önlemleri · temaslı taraması</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="620" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="342.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Tarama</text><text x="320" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">Aksilla + kasık klasik; el + burun bileşik örneği</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">daha duyarlı bulundu · PCR daha hızlı</text></g>
<g class="a o5"><text x="320" y="426" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Flukonazole dirençli her “Candida” raporunda C. auris’i düşün</text><text x="320" y="454" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: Chowdhary 2026 · Salmanton-García 2026</text></g>
</svg>
