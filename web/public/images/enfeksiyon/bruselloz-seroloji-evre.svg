<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bruselloz: seroloji hastalığın evresine göre okunur</title>
<desc id="d">Akut hastalıkta testlerin hepsi pozitif olabilir, ama erken dönemde yanlış negatif sonuç yaygındır. Kronik ya da komplike hastalıkta aglütine etmeyen antikor artar, SAT negatif kalabilir; 2-merkaptoetanol, Brucellacapt, Coombs ve ELISA IgG pozitif olabilir. SAT negatif ama şüphe varsa B. canis için ayrı seroloji, kültür ya da PCR istenir. Tedavi sonrasında titre kür göstermez: IgG düşüşü yanıtı destekler, düşmeme ya da yükselme relaps ya da fokal odağı düşündürür; PCR izlemde kullanılmaz.</desc>
<!-- 10.5 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:10.5s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,14%{opacity:0;transform:translateY(8px)}17%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,14%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,29%{opacity:0;transform:translateY(8px)}32%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,29%{stroke-dashoffset:1}34%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,43%{opacity:0;transform:translateY(8px)}46%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,43%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,57%{opacity:0;transform:translateY(8px)}60%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,57%{stroke-dashoffset:1}62%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,71%{opacity:0;transform:translateY(8px)}74%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,71%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,86%{opacity:0;transform:translateY(8px)}89%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,86%{stroke-dashoffset:1}91%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="650" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M240,96 L165,136" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M400,96 L475,136" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M320,290 L320,326" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,422 L165,461" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,422 L475,461" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="150" y="20" width="340" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="52.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Brucella serolojisi</text><text x="320" y="72.5" text-anchor="middle" font-size="13" fill="#0f172a">evreyi ve klinik tabloyu sor</text></g><g class="a m s2"><rect x="15" y="140" width="295" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="179.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Akut hastalık</text><text x="162.5" y="199.5" text-anchor="middle" font-size="13" fill="#064e3b">testlerin hepsi pozitif olabilir</text><text x="162.5" y="219.5" text-anchor="middle" font-size="13" fill="#064e3b">SAT: en çok deneyim</text><text x="162.5" y="239.5" text-anchor="middle" font-size="13" fill="#064e3b">erken dönemde yanlış negatif</text><text x="162.5" y="259.5" text-anchor="middle" font-size="13" fill="#064e3b">yaygın</text></g><g class="a m s3"><rect x="330" y="140" width="295" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="179.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Kronik · komplike</text><text x="477.5" y="199.5" text-anchor="middle" font-size="13" fill="#78350f">aglütine etmeyen antikor artar</text><text x="477.5" y="219.5" text-anchor="middle" font-size="13" fill="#78350f">SAT negatif kalabilir</text><text x="477.5" y="239.5" text-anchor="middle" font-size="13" fill="#78350f">2-ME · Brucellacapt · Coombs</text><text x="477.5" y="259.5" text-anchor="middle" font-size="13" fill="#78350f">ELISA IgG pozitif olabilir</text></g><g class="a m s4"><rect x="80" y="330" width="480" height="92" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="360.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">SAT negatif, şüphe sürüyor</text><text x="320" y="380.5" text-anchor="middle" font-size="13" fill="#4c1d95">yüksek titrede prozon olabilir</text><text x="320" y="400.5" text-anchor="middle" font-size="13" fill="#4c1d95">B. canis SAT ile saptanmaz: ayrı seroloji, kültür, PCR</text></g><g class="a m s5"><rect x="15" y="465" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="504.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Tedavi sonrası titre</text><text x="162.5" y="524.5" text-anchor="middle" font-size="13" fill="#1e3a8a">IgG düşüşü yanıtı destekler</text><text x="162.5" y="544.5" text-anchor="middle" font-size="13" fill="#1e3a8a">düşmeme ya da yükselme:</text><text x="162.5" y="564.5" text-anchor="middle" font-size="13" fill="#1e3a8a">relaps · fokal odak</text></g><g class="a m s6"><rect x="330" y="465" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="504.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Kür ölçütü değil</text><text x="477.5" y="524.5" text-anchor="middle" font-size="13" fill="#7f1d1d">IgG yıllarca yüksek kalabilir</text><text x="477.5" y="544.5" text-anchor="middle" font-size="13" fill="#7f1d1d">negatif seroloji dışlamaz</text><text x="477.5" y="564.5" text-anchor="middle" font-size="13" fill="#7f1d1d">PCR izlemde kullanılmaz</text></g><g class="a s7"><text x="320" y="628" text-anchor="middle" font-size="12" fill="#475569">İki testi birlikte kullanmak farklı evrelerdeki antikorları yakalar (UpToDate, 2026).</text></g>
</svg>
