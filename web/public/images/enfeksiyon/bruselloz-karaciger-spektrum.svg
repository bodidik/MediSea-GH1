<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Brusellozda karaciğer: bulgudan karara</title>
<desc id="d">Brusellozda karaciğer tutulumu geniş bir yelpazededir. En sık görünüm hafif aminotransferaz yüksekliğidir; akut evrede daha sıktır ve hedefe yönelik tedaviyle geriler, ayrıca biyopsi gerekmez. Olguların yaklaşık yüzde üçünde sarılıkla giden klinik hepatit olur. Karaciğer biyopsisi ancak tablo atipikse ya da açıklanamıyorsa yapılır; non-kazeifiye granülom brusellozu düşündürür ama ona özgü değildir, sarkoidoz ve tüberküloz başta olmak üzere birçok nedenle görülür. Yıllar sonra ateş ve kilo kaybıyla gelen hastada kronik hepatosplenik süpüratif bruselloz düşünülür; tomografide kar tanesi kalsifikasyonu görülebilir ve seroloji yalancı negatif olabilir. Sirozlu hastada asit varsa spontan bakteriyel peritonit akla gelir: asit nötrofili en az iki yüz elli ve mikrobiyolojik doğrulama gerekir, kan kültürü çoğu olguda pozitiftir. Çok nadiren ağır sepsis, akut karaciğer hasarı ve yaygın damar içi pıhtılaşma birlikte görülür. Rifampisin hepatotoksiktir: enzimler normalin beş katını aşarsa ya da sentez işlevi bozulursa aminoglikozid ile doksisiklin tercih edilir.</desc>
