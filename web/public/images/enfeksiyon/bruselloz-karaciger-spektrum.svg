5" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="189.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Klinik hepatit (~%3)</text><text x="477.5" y="209.5" text-anchor="middle" font-size="13" fill="#78350f">sarılık · hepatomegali</text><text x="477.5" y="229.5" text-anchor="middle" font-size="13" fill="#78350f">belirgin enzim artışı</text></g><g class="a m s4"><rect x="15" y="295" width="295" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="162.5" y="329.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Atipik ya da açıklanamıyor</text><text x="162.5" y="349.5" text-anchor="middle" font-size="13" fill="#4c1d95">→ karaciğer biyopsisi</text><text x="162.5" y="369.5" text-anchor="middle" font-size="13" fill="#4c1d95">non-kazeifiye granülom</text><text x="162.5" y="389.5" text-anchor="middle" font-size="13" fill="#4c1d95">brusellozu DÜŞÜNDÜRÜR,</text><text x="162.5" y="409.5" text-anchor="middle" font-size="13" fill="#4c1d95">ona ÖZGÜ DEĞİLDİR</text></g><g class="a m s5"><rect x="330" y="295" width="295" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="339.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Yıllar sonra ateş, kilo kaybı</text><text x="477.5" y="359.5" text-anchor="middle" font-size="13" fill="#78350f">→ CHSB</text><text x="477.5" y="379.5" text-anchor="middle" font-size="13" fill="#78350f">BT: kar tanesi kalsifikasyonu</text><text x="477.5" y="399.5" text-anchor="middle" font-size="13" fill="#78350f">seroloji yalancı negatif olabilir</text></g><g class="a m s6"><rect x="15" y="460" width="295" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="494.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Siroz + asit</text><text x="162.5" y="514.5" text-anchor="middle" font-size="13" fill="#1e3a8a">→ SBP düşün</text><text x=