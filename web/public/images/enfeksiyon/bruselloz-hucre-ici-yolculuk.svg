<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Brucella'nın hücre içi yolculuğu: dört evre</title>
<desc id="d">Brucella hücre içine alındıktan sonra dört evreden geçer. İlk on iki saatte bakteri endozomal vakuol içindedir; vakuol asitlenir, bakterilerin yaklaşık yüzde onu bu aşamadan sağ çıkar ve çoğalma geçici olarak durur. Asidik stres ve besin kısıtlılığı sekiz ile on ikinci saatlerde VirB tip dört salgı sistemini uyarır; salgılanan efektörler vakuolü endoplazmik retikulum membranlarıyla sararak çoğalmaya izin veren replikatif vakuole dönüştürür. On iki ile kırk sekizinci saatler arasında yoğun çoğalma olur ve efektörler konak hücreyi yeniden şekillendirir: BspA ve BspL endoplazmik retikulumla ilişkili yıkımı, BspF ve RicA veziküler trafiği, BtpA ve BtpB ile BPE123 enerji metabolizmasını, NyxA ve NyxB ise çekirdeği hedefler. Kırk sekiz ile yetmiş ikinci saatlerde vakuol otofajik biçime dönüşür; demir kısıtlılığı altında mitofaji uyarılır ve bakteri konak membranına sarılı olarak dışarı salınır, bu da onu antikorlardan ve hücre içine giremeyen aminoglikozidlerden korur.</desc>
<!-- 10 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:10s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,83%{opacity:0;transform:translateY(8px)}86%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,83%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,130 L320,171" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M320,285 L320,326" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M320,480 L320,521" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M320,655 L320,696" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="15" y="20" width="610" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="49.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">① 0–12. saat · endozomal vakuol (eBCV)</text><text x="320" y="69.5" text-anchor="middle" font-size="13" fill="#1e3a8a">vakuol asitlenir, lizozomla kontrollü füzyon</text><text x="320" y="89.5" text-anchor="middle" font-size="13" fill="#1e3a8a">bakterilerin yaklaşık %10'u sağ kalır</text><text x="320" y="109.5" text-anchor="middle" font-size="13" fill="#1e3a8a">çoğalma geçici durur — ama virülans genleri AÇILIR</text></g><g class="a m s2"><rect x="15" y="175" width="610" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="204.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">② 8–12. saat · VirB tip IV salgı sistemi açılır</text><text x="320" y="224.5" text-anchor="middle" font-size="13" fill="#4c1d95">asidik stres + besin kısıtlılığı tetikler</text><text x="320" y="244.5" text-anchor="middle" font-size="13" fill="#4c1d95">efektörler vakuolü ER membranlarıyla sardırır</text><text x="320" y="264.5" text-anchor="middle" font-size="13" fill="#4c1d95">→ replikatif vakuol (rBCV)</text></g><g class="a m s3"><rect x="15" y="330" width="610" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="369.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">③ 12–48. saat · yoğun çoğalma, konak yeniden şekillendirilir</text><text x="320" y="389.5" text-anchor="middle" font-size="13" fill="#064e3b">BspA · BspL: ER ilişkili yıkım yolağı (ERAD)</text><text x="320" y="409.5" text-anchor="middle" font-size="13" fill="#064e3b">BspF · RicA · BspB: veziküler trafik</text><text x="320" y="429.5" text-anchor="middle" font-size="13" fill="#064e3b">BtpA · BtpB · BPE123: enerji metabolizması, Warburg benzeri kayma</text><text x="320" y="449.5" text-anchor="middle" font-size="13" fill="#064e3b">NyxA · NyxB: çekirdek, SENP3 yer değiştirir</text></g><g class="a m s4"><rect x="15" y="525" width="610" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="564.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">④ 48–72. saat · çıkış (egress)</text><text x="320" y="584.5" text-anchor="middle" font-size="13" fill="#78350f">vakuol otofajik biçime döner (aBCV): LAMP-1 var, LC3 YOK</text><text x="320" y="604.5" text-anchor="middle" font-size="13" fill="#78350f">demir kısıtlılığı → HIF-1α/BNIP3L ekseni → mitofaji</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#78350f">bakteri konak membranına SARILI çıkar</text></g><g class="a m s5"><rect x="60" y="700" width="520" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="732.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Klinik karşılığı: membranla kaplı çıkış</text><text x="320" y="752.5" text-anchor="middle" font-size="13" fill="#7f1d1d">antikordan ve hücre içine giremeyen aminoglikozidden korur</text></g><g class="a s6"><text x="320" y="798" text-anchor="middle" font-size="12" fill="#475569">Evreler ve efektörler Marchesini 2024 derlemesinden; hücre kültürü modellerine aittir.</text></g>
</svg>
