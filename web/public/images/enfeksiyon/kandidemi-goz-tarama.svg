<rect width="640" height="830" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M260,96 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M380,96 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,266 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,266 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,376 L165,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,376 L477,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,540 L220,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,540 L420,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,684 L320,714" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="53.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Kandidemi: göz tutulmuş olabilir</text><text x="320" y="73.5" text-anchor="middle" font-size="13" fill="#0f172a">göz tutulumu %4–23 · endoftalmi %0,9–3</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Ne zaman bakılır?</text><text x="162.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">nötropeni yok: ~7. gün</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">nötropenide: nötrofil toparlanınca</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">göz yakınması varsa: hemen</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Belirtiye güvenilmez</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">bilinci açık hastaların ancak</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">%31–50'si yakınır</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">entübe hasta hiç söyleyemez</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Genişletilmiş fundus muayenesi</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#0f172a">sınırı belirsiz beyaz retina lezyonu ± vitreusta kartopu</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Korioretinit (vitrit yok)</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">sistemik azol: flukonazol</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">ya da vorikonazol</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">makula tehdit altındaysa + intravitreal</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Endoftalmi (vitrit var)</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#7f1d1d">sistemik azol + intravitreal</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#7f1d1d">AmB-d 5–10 µg ya da vori 100 µg</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#7f1d1d">yoğun vitritte vitrektomi</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Ekinokandin vitreusa geçmez</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#4c1d95">göz tutulumu bulunduysa göze geçen ilaca geçilir</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#4c1d95">flukonazol vitreusta plazmanın ~%70'i</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#4c1d95">azole dirençli türde: lipozomal amfoterisin B ± flusitozin</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Süre</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#1e3a8a">en az 4–6 hafta</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#1e3a8a">seri göz muayenesinde lezyonlar gerileyene kadar</text></g>
</svg>
