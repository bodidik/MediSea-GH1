<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kandidemide göz: tara, bul, tedaviyi değiştir</title>
<desc id="d">Kandidemide göz tutulabilir: çalışmalara göre göz tutulumu yüzde 4 ila 23, endoftalmi yüzde 0,9 ila 3. Nötropenisi olmayan hastada muayene için en uygun zaman yedinci gün civarıdır; nötropenide nötrofil toparlanınca bakılır, göz yakınması varsa hemen. Belirtiye güvenilmez: bilinci açık hastaların ancak yüzde 31 ila 50'si yakınır, entübe hasta hiç söyleyemez. Genişletilmiş fundus muayenesinde sınırı belirsiz beyaz retina lezyonu, bazen vitreusta kartopu görünümü bulunur. Vitritsiz korioretinitte sistemik azol, flukonazol ya da vorikonazol verilir; makula tehdit altındaysa intravitreal ilaç eklenir. Vitritli endoftalmide sistemik azole intravitreal amfoterisin B deoksikolat 5 ila 10 mikrogram ya da vorikonazol 100 mikrogram eklenir; yoğun vitritte vitrektomi yapılır. Ekinokandin vitreusa geçmez; göz tutulumu bulunduysa göze geçen ilaca geçilir. Flukonazolün vitreus düzeyi plazmanın yaklaşık yüzde 70'idir. Azole dirençli türde lipozomal amfoterisin B, flusitozinle ya da flusitozinsiz verilir. Tedavi en az 4 ila 6 hafta, seri göz muayenesinde lezyonlar gerileyene kadar sürer.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
