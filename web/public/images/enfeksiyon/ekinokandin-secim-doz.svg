<text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#7f1d1d">→ bu odaklarda başka ilaç</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Direnç kuşkusu → test iste</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#4c1d95">C. glabrata (önceki ekinokandin)</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#4c1d95">C. auris · C. parapsilosis salgını</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#4c1d95">5 gündür süren fungemi</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Hangi ekinokandin? Hastaya bak</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#0f172a">dördünün farkı spektrumda değil, farmakokinetikte</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Karaciğer</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">anidulafungin: ayar yok</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">kaspofungin Child-Pugh B:</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">etiket 35 mg · UpToDate tam doz</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Etkileşim</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#1e3a8a">rifampisin, fenitoin, deksa