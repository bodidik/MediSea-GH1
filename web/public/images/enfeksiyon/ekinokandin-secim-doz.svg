<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 724" width="640" height="724" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ekinokandin: hangi ilaç, hangi doz?</title>
<desc id="d">Kandidemi ve invaziv kandidiyaziste ilk seçenek ekinokandindir; dört ilaç birbirinin yerine kullanılabilir. Beyin omurilik sıvısı, beyin, göz ve idrarda düzey düşük kalır, bu odaklarda başka ilaç gerekir. Önceki ekinokandin maruziyetinden sonra C. glabrata, C. auris, C. parapsilosis salgını ve beş gündür süren fungemide duyarlılık testi istenir. İlaç seçimini hastanın özellikleri belirler, çünkü dört ilacın farkı farmakokinetiktedir. Karaciğer yetmezliğinde anidulafungin ayar istemez; kaspofungin için etiket Child-Pugh B'de idameyi 35 mg'a indirir, UpToDate tam dozu yeğler. Rifampisin, fenitoin ya da deksametazon gibi indükleyicilerle kaspofungin idamesi günde 70 mg'dır; siklosporin kaspofungin maruziyetini yüzde 35 artırır. 75 kilogramın üstünde sepsis ya da mekanik ventilasyon varsa günlük doz yüzde 25 ila 50 artırılır; ECMO'da en az etkilenen anidulafungindir. Kalıtsal fruktoz intoleransında anidulafungin kontrendikedir; rezafungin ışığa duyarlılık yapabilir.</desc>
