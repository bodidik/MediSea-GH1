<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Mantar enfeksiyonunda tanı yolu: biçim, test, ilaç sınıfı</title>
<desc id="d">Örnek alınır ve doğrudan mikroskopi ile histopatoloji yapılır: kalkoflor beyazı ya da KOH, dokuda GMS (tüm mantarlar için en iyi boya) ve PAS, kriptokok kapsülü için müsikarmin. Sonra kültür ve tanımlama (MALDI-TOF, gen dizileme) ile kültür dışı testler gelir. Maya: Candida için kültür ve beta-D-glukan; Cryptococcus için serum ve BOS kriptokok antijeni, Çini mürekkebi özgül ama duyarlılığı düşük. Küf: Aspergillus için galaktomannan, beta-D-glukan ve nükleik asit amplifikasyonu; Mucorales için doku. Dimorfik: 25 derecede küf, 37 derecede maya; idrar antijeni (Histoplasma, Blastomyces, Coccidioides) ve seroloji. İlaç sınıfları: azoller ergosterol sentezini (CYP51) keser, flukonazol mayalarda; polienler ergosterole bağlanır ve geniş spektrumludur; ekinokandinler beta-1,3-D-glukan sentazını keser, Candida'da fungisittir, göz ve SSS'ye girişi zayıftır. Mukozal örnekte kültür çoğu kez flora gösterir; tanı klinik ve mikroskopiyle konur.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,112 L320,136" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M200,226 L112,256" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M320,226 L320,256" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M440,226 L528,256" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,508 L320,534" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="98" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Örnek → doğrudan mikroskopi ve doku</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Kalkoflor beyazı / KOH · dokuda GMS (en iyi) ve PAS</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#334155">Müsikarmin: kriptokok kapsülü</text></g>
<g class="a m s2"><rect x="40" y="138" width="560" height="88" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="166" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kültür + kültür dışı testler</text><text x="320" y="190" text-anchor="middle" font-size="12" fill="#1e3a8a">Tanımlama: MALDI-TOF, gen dizileme · duyarlılık testi</text><text x="320" y="210" text-anchor="middle" font-size="12" fill="#1e3a8a">Mukozal kültür çoğu kez flora → klinik + mikroskopi</text></g>
<g class="a m s3"><rect x="10" y="258" width="200" height="250" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="110" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Maya</text><text x="110" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Candida</text><text x="110" y="332" text-anchor="middle" font-size="12" fill="#78350f">kültür · β-D-glukan</text><text x="110" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Cryptococcus</text><text x="110" y="382" text-anchor="middle" font-size="12" fill="#78350f">serum / BOS antijeni</text><text x="110" y="402" text-anchor="middle" font-size="12" fill="#78350f">(duyarlı ve özgül)</text><text x="110" y="428" text-anchor="middle" font-size="11" fill="#78350f">Çini mürekkebi: özgül,</text><text x="110" y="446" text-anchor="middle" font-size="11" fill="#78350f">duyarlılığı düşük</text></g>
<g class="a m s3"><rect x="220" y="258" width="200" height="250" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Küf</text><text x="320" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Aspergillus</text><text x="320" y="332" text-anchor="middle" font-size="12" fill="#064e3b">galaktomannan</text><text x="320" y="352" text-anchor="middle" font-size="12" fill="#064e3b">β-D-glukan · NAAT</text><text x="320" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Mucorales, Fusarium</text><text x="320" y="402" text-anchor="middle" font-size="12" fill="#064e3b">doku + kültür</text></g>
<g class="a m s3"><rect x="430" y="258" width="200" height="250" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="530" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Dimorfik</text><text x="530" y="312" text-anchor="middle" font-size="12" fill="#4c1d95">25 °C küf · 37 °C maya</text><text x="530" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Histoplasma,</text><text x="530" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Blastomyces,</text><text x="530" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Coccidioides</text><text x="530" y="408" text-anchor="middle" font-size="12" fill="#4c1d95">idrar antijeni · seroloji</text><text x="530" y="428" text-anchor="middle" font-size="12" fill="#4c1d95">kanlı besiyeri</text></g>
<g class="a m s5"><rect x="40" y="536" width="560" height="270" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="566" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">İlaç sınıfı: hedef ve kapsam</text><text x="320" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Azoller</text><text x="320" y="618" text-anchor="middle" font-size="12" fill="#7f1d1d">CYP51 → ergosterol sentezi durur · flukonazol mayalarda</text><text x="320" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Polienler (amfoterisin B)</text><text x="320" y="670" text-anchor="middle" font-size="12" fill="#7f1d1d">ergosterole bağlanır · en geniş kapsam</text><text x="320" y="702" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Ekinokandinler</text><text x="320" y="722" text-anchor="middle" font-size="12" fill="#7f1d1d">β-1,3-D-glukan sentazı (FKS) · Candida'da fungisit</text><text x="320" y="742" text-anchor="middle" font-size="12" fill="#7f1d1d">göz ve SSS'ye girişi zayıf</text><text x="320" y="774" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Flusitozin</text><text x="320" y="794" text-anchor="middle" font-size="12" fill="#7f1d1d">direnç yüzünden tek başına verilmez</text></g>
</svg>
