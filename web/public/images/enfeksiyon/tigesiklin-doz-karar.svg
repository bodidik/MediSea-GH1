<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tigesiklin: kime, hangi dozla</title>
<desc id="d">Önce kullanılmaması gereken durumlar elenir: diyabetik ayak, hastane ve ventilatör ilişkili pnömoni, idrar yolu enfeksiyonu, barsak perforasyonunda tek başına. Etiket endikasyonlarında (komplike karın içi, komplike deri ve yumuşak doku, toplum kökenli pnömoni) 100 mg yükleme ve 12 saatte bir 50 mg. Çoklu ilaca dirençli A. baumannii ya da S. maltophilia'da kombinasyonla 200 mg yükleme ve 12 saatte bir 100 mg. Child-Pugh C'de yükleme aynı, idame yarıya iner; böbrek yetmezliği ve diyalizde ayar yok. Başlangıçta ve tedavi boyunca karaciğer testleri, fibrinojen dahil pıhtılaşma testleri ve kan şekeri izlenir. Kaynak: UpToDate 2026.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a" style="animation-delay:0s"><rect x="140" y="14" width="360" height="52" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="36" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Başka uygun seçenek var mı?</text><text x="320" y="55" text-anchor="middle" font-size="11" fill="#3730a3">Kara kutu: mortalite farkı %0,6 → varsa onu kullan</text></g>
<g class="a" style="animation-delay:.3s"><line x1="320" y1="66" x2="320" y2="92" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><text x="330" y="84" font-size="10.5" fill="#475569">yok</text>
<rect x="60" y="96" width="520" height="84" rx="10" fill="#fff1f2" stroke="#fda4af"/><text x="320" y="117" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9f1239">Önce ele: tigesiklin KULLANILMAZ</text><text x="320" y="138" text-anchor="middle" font-size="11" fill="#881337">Diyabetik ayak (eşdeğerlik yok) · HAP/VAP (mortalite yüksek)</text><text x="320" y="156" text-anchor="middle" font-size="11" fill="#881337">İdrar yolu enfeksiyonu (idrar düzeyi yetersiz)</text><text x="320" y="173" text-anchor="middle" font-size="11" fill="#881337">Barsak perforasyonunda tek başına (sepsis daha sık)</text></g>
<g class="a" style="animation-delay:.6s"><line x1="200" y1="180" x2="170" y2="214" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="440" y1="180" x2="470" y2="214" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/>
<rect x="24" y="218" width="282" height="118" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="165" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Etiket endikasyonu</text><text x="165" y="259" text-anchor="middle" font-size="10.5" fill="#166534">Komplike karın içi · deri-yumuşak doku</text><text x="165" y="274" text-anchor="middle" font-size="10.5" fill="#166534">Toplum kökenli pnömoni (alternatif)</text><text x="165" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">100 mg yükleme</text><text x="165" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">sonra 12 saatte bir 50 mg</text></g>
<g class="a" style="animation-delay:.9s"><rect x="334" y="218" width="282" height="118" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="475" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">Çoklu ilaca dirençli etken</text><text x="475" y="259" text-anchor="middle" font-size="10.5" fill="#92400e">A. baumannii · S. maltophilia</text><text x="475" y="274" text-anchor="middle" font-size="10.5" fill="#92400e">kombinasyonun parçası olarak</text><text x="475" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">200 mg yükleme</text><text x="475" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">sonra 12 saatte bir 100 mg</text></g>
<g class="a" style="animation-delay:1.2s"><line x1="165" y1="336" x2="165" y2="364" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="475" y1="336" x2="475" y2="364" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/>
<rect x="24" y="368" width="282" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="165" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Karaciğer</text><text x="165" y="410" text-anchor="middle" font-size="10.5" fill="#334155">Child A–B: ayar yok</text><text x="165" y="427" text-anchor="middle" font-size="10.5" fill="#334155">Child C: yükleme aynı, idame %50</text><text x="165" y="444" text-anchor="middle" font-size="10.5" fill="#334155">(mikobakteride ayar yok)</text>
<rect x="334" y="368" width="282" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="475" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Böbrek</text><text x="475" y="410" text-anchor="middle" font-size="10.5" fill="#334155">Hiçbir düzeyde ayar yok</text><text x="475" y="427" text-anchor="middle" font-size="10.5" fill="#334155">HD · PD · CRRT · PIRRT: ek doz yok</text><text x="475" y="444" text-anchor="middle" font-size="10.5" fill="#334155">(az diyalize olur)</text></g>
<g class="a" style="animation-delay:1.5s"><rect x="24" y="474" width="592" height="72" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="320" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Tedavi boyunca izle</text><text x="320" y="516" text-anchor="middle" font-size="10.5" fill="#1e40af">Karaciğer testleri · fibrinojen, PT, aPTT (başlangıçta ve düzenli) · kan şekeri</text><text x="320" y="534" text-anchor="middle" font-size="10.5" fill="#1e40af">İnfüzyon 30–60 dk · ≤1 mg/mL · çözelti sarı-turuncu olmalı</text></g>
</svg>
