<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Dalbavansin vermeden önce kontrol listesi</title>
<desc id="d">Dalbavansin vermeden önce sekiz şey kontrol edilir. Tek kesin kontrendikasyon dalbavansine ya da formülün bir bileşenine aşırı duyarlılıktır. Glikopeptitlere karşı önceki aşırı duyarlılık dikkatle sorulur, çünkü çapraz duyarlılık olabilir. Başlangıçta kan üre azotu, kreatinin ve karaciğer testleri bakılır. Kreatinin klirensi 30 mL/dk'nın altındaysa ve hasta düzenli diyalizde değilse doz azaltılır: tek doz şemada 1,125 g, iki doz şemada 750 mg ve bir hafta sonra 375 mg; düzenli hemodiyalizde ayar gerekmez ve diyaliz zamanından bağımsız verilir. Orta ya da ağır karaciğer yetersizliğinde, yani Child-Pugh B ya da C'de, çalışılmadığı için dikkatle kullanılır; ALT normalin üç katını aşabilir ve kesince geri döner. İnfüzyon 30 dakikadan kısa sürerse vankomisin infüzyon reaksiyonuna benzer tablo olabilir. C. difficile ishali tedaviden iki aydan uzun süre sonra bile görülebilir. Gebelikte veri azdır ve uzun yarı ömür fetüs maruziyetinde hesaba katılır. Ağır glikopeptit reaksiyonu öyküsünde daptomisin ya da linezolid gibi yapıca ilişkisiz bir ilaç seçilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,13%{opacity:0;transform:translateY(8px)}16%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,13%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,25%{opacity:0;transform:translateY(8px)}28%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,25%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,38%{opacity:0;transform:translateY(8px)}41%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,38%{stroke-dashoffset:1}43%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,63%{opacity:0;transform:translateY(8px)}66%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,63%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,75%{opacity:0;transform:translateY(8px)}78%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,75%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,88%{opacity:0;transform:translateY(8px)}91%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,88%{stroke-dashoffset:1}93%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="830" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M260,96 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M380,96 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,266 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,266 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,376 L165,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,376 L477,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,540 L220,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,540 L420,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,684 L320,714" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="53.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Tek kesin kontrendikasyon</text><text x="320" y="73.5" text-anchor="middle" font-size="13" fill="#7f1d1d">dalbavansine ya da formülün bir bileşenine aşırı duyarlılık</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="162.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Glikopeptit öyküsü</text><text x="162.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">vankomisin, teikoplanin, telavansin</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">çapraz duyarlılık olabilir</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">reaksiyon tipini belirle</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Başlangıç testleri</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#0f172a">kan üre azotu, kreatinin</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#0f172a">AST, ALT, bilirubin</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#0f172a">infüzyon ve süperenfeksiyon izlemi</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">CrCl &lt;30 ve düzenli diyaliz yok: dozu azalt</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#1e3a8a">tek doz 1,125 g · iki doz 750 mg + 1 hafta sonra 375 mg · düzenli HD'de ayar yok</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Karaciğer</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">Child-Pugh B–C: çalışılmadı</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">dikkatle kullan</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">ALT &gt;3 kat, kesince geri döner</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">İnfüzyon</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#4c1d95">30 dakikadan kısa sürerse</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#4c1d95">VİR benzeri kızarma, ürtiker</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#4c1d95">durdur ya da yavaşlat</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Geç ve uzun etkiler</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#7f1d1d">C. difficile ishali tedaviden 2 aydan uzun süre sonra bile</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#7f1d1d">gebelikte veri az · uzun yarı ömür fetüs maruziyetini uzatır</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#7f1d1d">yarı ömür ~346 saat: yan etki geri alınamaz</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="759.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Ağır glikopeptit reaksiyonunda alternatif</text><text x="320" y="779.5" text-anchor="middle" font-size="13" fill="#064e3b">yapıca ilişkisiz ilaç: daptomisin, linezolid (enfeksiyona ve duyarlılığa göre)</text></g>
</svg>
