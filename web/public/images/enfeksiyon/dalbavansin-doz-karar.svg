<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Dalbavansin: kime ve hangi şemayla</title>
<desc id="d">Duyarlı Gram pozitif enfeksiyonda dalbavansin. ABSSSI: tek doz 1,5 g ya da 1. gün 1 g ve 8. gün 500 mg, çocukta kiloya göre. Komplike S. aureus bakteriyemisi: kısa etkili IV tedaviyle klinik düzelme ve 10 gün içinde kültür temizliği varsa, protez materyali ve sol kalp endokarditi yoksa 1. ve 8. gün 1,5 g. İlaç enjekte eden hastada endokardit idamesi: 1,5 g sonra iki haftada bir 1 g ya da 1 g sonra haftada 500 mg, toplam 6 hafta. Osteomiyelit ve diskit: 1. ve 8. gün 1,5 g, uzun tedavide TDM ile çukur düzeyi 8 mikrogram/mL üstü. Her şemada CrCl 30 altında ve diyalize girmeyen hastada doz azalır; hemodiyalizde ayar yok; infüzyon 30 dakika.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="56" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="38" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Duyarlı Gram pozitif enfeksiyon</text><text x="320" y="56" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">vanA VRE ve Gram negatif: etkisiz</text></g><g class="a" style="animation-delay:2.40s"><line x1="220" y1="70" x2="165" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="420" y1="70" x2="475" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="102" width="300" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="164" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">ABSSSI (onaylı)</text><text x="164" y="154" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Tek doz 1,5 g</text><text x="164" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">ya da 1 g + 8. gün 500 mg</text><text x="164" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Çocuk: 22,5 / 18 mg/kg</text><rect x="326" y="102" width="300" height="112" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="476" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Komplike S. aureus bakteriyemisi</text><text x="476" y="154" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Düzelme + 10 günde kültür temiz</text><text x="476" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Protez ve sol kalp IE yok</text><text x="476" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">1. ve 8. gün 1,5 g (DOTS)</text></g><g class="a" style="animation-delay:4.80s"><rect x="14" y="234" width="300" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="164" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">İlaç enjekte edende endokardit</text><text x="164" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">1,5 g → 2 haftada bir 1 g</text><text x="164" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">ya da 1 g → haftada 500 mg</text><text x="164" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Toplam 6 hafta</text><rect x="326" y="234" width="300" height="112" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="476" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Osteomiyelit · diskit</text><text x="476" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">1. ve 8. gün 1,5 g</text><text x="476" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Uzun tedavide TDM:</text><text x="476" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">çukur &gt; 8 μg/mL</text></g><g class="a" style="animation-delay:7.20s"><rect x="14" y="366" width="612" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="395" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Böbrek: CrCl &lt; 30 ve diyalizsiz → doz azalır</text><text x="320" y="413" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Tek doz 1,125 g · ya da 750 mg + 1 hafta sonra 375 mg</text><text x="320" y="431" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Aralıklı hemodiyalizde ayar yok</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="470" width="612" height="76" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="495" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">İnfüzyon 30 dakika</text><text x="320" y="513" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Daha hızlıysa vankomisin benzeri infüzyon reaksiyonu</text><text x="320" y="531" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Glikopeptit alerjisini önceden sor</text></g>
</svg>
