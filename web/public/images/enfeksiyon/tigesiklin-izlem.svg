<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tigesiklin tedavisinde izlem</title>
<desc id="d">Başlangıçta karaciğer testleri, fibrinojen, PT ve aPTT, kan şekeri ve gerekirse amilaz-lipaz bakılır. Tedavi boyunca kan şekeri ve pıhtılaşma testleri düzenli izlenir. Fibrinojen düşüşü, PT ya da aPTT uzaması veya kanamada ilaç kesilir. Hipoglisemide IV dekstroz verilir; kesildikten sonra da günlerce izlenir. Pankreatit şüphesi ya da ilaca bağlı karaciğer hasarında ilaç kesilir. Diyaliz, ağır karaciğer yetmezliği ve yüksek doz riski artırır. Kaynaklar: UpToDate 2026, Hakeam 2024.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="520" fill="#ffffff"/>
<g class="a" style="animation-delay:0s"><rect x="90" y="14" width="460" height="70" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="36" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Başlangıçta</text><text x="320" y="56" text-anchor="middle" font-size="11" fill="#3730a3">Karaciğer testleri · fibrinojen, PT, aPTT · kan şekeri</text><text x="320" y="73" text-anchor="middle" font-size="11" fill="#3730a3">Risk: diyaliz / CRRT · Child C · yüksek doz · insülin, sülfonilüre</text></g>
<g class="a" style="animation-delay:.3s"><line x1="320" y1="84" x2="320" y2="110" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="90" y="114" width="460" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Tedavi boyunca düzenli</text><text x="320" y="155" text-anchor="middle" font-size="11" fill="#334155">Kan şekeri · pıhtılaşma testleri · karaciğer testleri · karın ağrısı</text></g>
<g class="a" style="animation-delay:.6s"><line x1="180" y1="166" x2="110" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="320" y1="166" x2="320" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="460" y1="166" x2="530" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/>
<rect x="14" y="204" width="196" height="150" rx="10" fill="#fff1f2" stroke="#fda4af"/><text x="112" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9f1239">Hipoglisemi</text><text x="112" y="246" text-anchor="middle" font-size="10.5" fill="#881337">diyabetlide &lt;70, diğerinde &lt;55</text><text x="112" y="264" text-anchor="middle" font-size="10.5" fill="#881337">ilk 6 saatten haftalara dek</text><text x="112" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#9f1239">IV dekstroz</text><text x="112" y="309" text-anchor="middle" font-size="10.5" fill="#881337">insülin yarıdan çok azalabilir</text><text x="112" y="327" text-anchor="middle" font-size="10.5" fill="#881337">kesildikten sonra da</text><text x="112" y="343" text-anchor="middle" font-size="10.5" fill="#881337">günlerce izle</text></g>
<g class="a" style="animation-delay:.9s"><rect x="222" y="204" width="196" height="150" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">Koagülopati</text><text x="320" y="246" text-anchor="middle" font-size="10.5" fill="#92400e">fibrinojen düşüşü</text><text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#92400e">PT / aPTT uzaması · kanama</text><text x="320" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">İlacı kes</text><text x="320" y="309" text-anchor="middle" font-size="10.5" fill="#92400e">doza ve süreye bağlı;</text><text x="320" y="327" text-anchor="middle" font-size="10.5" fill="#92400e">kesince düzeldiği</text><text x="320" y="343" text-anchor="middle" font-size="10.5" fill="#92400e">bildirildi</text></g>
<g class="a" style="animation-delay:1.2s"><rect x="430" y="204" width="196" height="150" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="528" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Pankreas · karaciğer</text><text x="528" y="246" text-anchor="middle" font-size="10.5" fill="#5b21b6">pankreatit şüphesi</text><text x="528" y="264" text-anchor="middle" font-size="10.5" fill="#5b21b6">ilaca bağlı karaciğer hasarı</text><text x="528" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">İlacı kes</text><text x="528" y="309" text-anchor="middle" font-size="10.5" fill="#5b21b6">risk etkeni olmayanda da</text><text x="528" y="327" text-anchor="middle" font-size="10.5" fill="#5b21b6">ölümcül pankreatit;</text><text x="528" y="343" text-anchor="middle" font-size="10.5" fill="#5b21b6">karaciğer etkisi geç çıkabilir</text></g>
<g class="a" style="animation-delay:1.5s"><rect x="14" y="376" width="612" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="398" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Ayrıca kes, görülürse</text><text x="320" y="420" text-anchor="middle" font-size="10.5" fill="#334155">Antianabolik etki: BUN artışı, azotemi, asidoz, hiperfosfatemi</text><text x="320" y="439" text-anchor="middle" font-size="10.5" fill="#334155">Psödotümör serebri · fotosensitivite · fiks ilaç erüpsiyonu</text><text x="320" y="458" text-anchor="middle" font-size="10.5" fill="#334155">Anafilaksi: uygulama sırasında izle</text><text x="320" y="482" text-anchor="middle" font-size="10.5" fill="#334155">C. difficile ishali tedaviden 2 aydan uzun süre sonra da görülebilir</text></g>
</svg>
