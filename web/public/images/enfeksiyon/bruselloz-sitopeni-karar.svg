elik</text><text x="147.5" y="229.5" text-anchor="middle" font-size="13" fill="#064e3b">antibiyotikle geriler</text><text x="147.5" y="249.5" text-anchor="middle" font-size="13" fill="#064e3b">ek işlem gerekmez</text></g><g class="a m s3"><rect x="300" y="160" width="325" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="462.5" y="199.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Derin ya da ilerleyen sitopeni</text><text x="462.5" y="219.5" text-anchor="middle" font-size="13" fill="#78350f">antibiyotiğe rağmen düzelmiyor</text><text x="462.5" y="239.5" text-anchor="middle" font-size="13" fill="#78350f">→ üç yolu birden sor</text></g><g class="a m s4"><rect x="15" y="320" width="196" height="155" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="113" y="362" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">HLH</text><text x="113" y="382" text-anchor="middle" font-size="13" fill="#7f1d1d">ateş · splenomegali</text><text x="113" y="402" text-anchor="middle" font-size="13" fill="#7f1d1d">ferritin ↑ · TG ↑</text><text x="113" y="422" text-anchor="middle" font-size="13" fill="#7f1d1d">fibrinojen ↓</text><text x="113" y="442" text-anchor="middle" font-size="13" fill="#7f1d1d">HLH-2004: 8 ölçütün ≥5'i</text></g><g class="a m s5"><rect x="222" y="320" width="196" height="155" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="362" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">İmmün yıkım</text><text x="320" y="382" text-anchor="middle" font-size="13" fill="#4c1d95">hemoliz: direkt</text><text x="320" y="402" text-anchor="middle" font-size="13" fill="#4c1d95">Coombs pozitif → OİHA</text><text x="320" y="422" text-anchor="middle" font-size="13" fill="#4c1d95">izole trombositopeni:</text><text x="320" y="442" text-anchor="middle" font-size="13" fill="#4c1d95">megakaryosit korunmuş: İTP</text></g><g class="a m s6"><rect x="429" y="320" widt