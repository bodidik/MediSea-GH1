<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" width="640" height="790" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Brusellozda sitopeni: ne zaman daha ileri gidilir</title>
<desc id="d">Brusellozlu hastada sitopeni genellikle hafiftir: anemi yaklaşık yüzde yirmi yedi, trombositopeni yüzde on iki, lökopeni yüzde dokuz, pansitopeni yüzde birin altında. Hafif sitopeni hedefe yönelik antibiyotikle geriler, ek işlem gerekmez. Derin ya da ilerleyen sitopenide üç yol ayrılır. Ateş, splenomegali, yüksek ferritin, yüksek trigliserid ve düşük fibrinojen varsa hemofagositik lenfohistiyositoz düşünülür; HLH iki bin dört ölçütlerinden sekizinin en az beşi aranır. İzole hemoliz bulgularında direkt Coombs testi bakılır, pozitifse otoimmün hemolitik anemi; izole trombositopenide kemik iliğinde megakaryositler korunmuşsa immün trombositopeni. Pıhtılaşma bozulmuşsa yaygın damar içi pıhtılaşma düşünülür. Her üç yolda da ilk basamak hedefe yönelik kombine antibiyotiktir; brusellozla ilişkili hemofagositik sendrom çoğu olguda kemoterapi gerektirmez, derlenen on iki olgunun altısı yalnız antibiyotikle, beşi antibiyotik ve kortikosteroidle yönetilmiştir. Ağır olguda kısa süreli kortikosteroid ve immünoglobulin eklenir. Ağrısız lenfadenopati, splenomegali, kilo kaybı ve pansitopeni birlikteliği lenfomayı taklit edebilir.</desc>
