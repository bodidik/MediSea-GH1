<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">C. auris: hastanede yayılım ve kontrol noktaları</title>
<desc id="d">Kolonize hasta çoğunlukla belirti vermez ve uzun süre taşıyıcı kalır. Hastane yüzeyleri, paylaşılan tıbbi cihazlar ve eller aracılığıyla başka hastalara geçer. Kolonize hastaların bir kısmında, özellikle santral kateter, yoğun bakım ve mekanik ventilasyon varlığında invaziv enfeksiyon gelişir. Her basamakta bir kontrol önlemi vardır: tarama, temas önlemleri, uygun dezenfektanla temizlik ve deri yükünün azaltılması.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="478" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Kolonize hasta</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">Belirtisiz; aylarca taşıyıcı kalabilir</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">kontrol: tarama ve bayraklama</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="300" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Çevre ve cihaz</text><text x="160" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">Yüzeyler, paylaşılan ekipman</text><text x="160" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">kontrol: klor bazlı dezenfeksiyon</text><rect x="330" y="112" width="300" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="480" y="138.00" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Eller</text><text x="480" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Sağlık çalışanı teması</text><text x="480" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">kontrol: el hijyeni, temas önlemi</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="620" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="240.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Yeni hasta kolonize olur</text><text x="320" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">Yoğun bakım, uzun süreli bakım, santral kateter</text><text x="320" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">kontrol: tek kişilik oda, cihaz yönetimi</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="620" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="342.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">İnvaziv enfeksiyon</text><text x="320" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">Kolonize hastaların %20–25’ine kadarında</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">kandidemi, cihaz ilişkili, MSS enfeksiyonu</text></g>
<g class="a o5"><text x="320" y="426" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Önlemler tek tek değil, paket olarak uygulanınca etkili</text><text x="320" y="454" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: Salmanton-García 2026 · Ji 2026</text></g>
</svg>
