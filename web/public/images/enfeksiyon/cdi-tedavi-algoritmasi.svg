<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Erişkinde C. difficile enfeksiyonu: atak sırasına ve ağırlığa göre tedavi</title>
<desc id="d">C. difficile enfeksiyonunda önce tetikleyen antibiyotik mümkünse kesilir, temas önlemi alınır, sıvı ve elektrolit düzeltilir. Tedavi ağırlığa ve atak sırasına göre seçilir. Fulminan olmayan ilk atakta fidaksomisin günde iki kez 200 mg, 10 gün önerilir; yoksa ağız yoluyla vankomisin günde dört kez 125 mg, 10 gün. Ciddi olmayan hastalıkta bu ikisi yoksa metronidazol seçenektir. İlk nüks vankomisinden sonraysa fidaksomisin, fidaksomisinden sonraysa azaltılarak kesilen vankomisin verilir. İkinci nükste fidaksomisin şemalarından biri ve ardından ticari fekal mikrobiyota ürünü önerilir. Üçüncü ve sonraki nükslerde uzun süreli fidaksomisin ya da vankomisin şeması ile geleneksel fekal mikrobiyota nakli ya da ürünü verilir; nakil yapılamıyorsa günde bir kez 125 mg vankomisinle baskılama düşünülür. Fulminan hastalıkta, yani hipotansiyon, şok, ileus ya da megakolonda, ağız ya da nazogastrik yolla günde dört kez 500 mg vankomisin ile 8 saatte bir 500 mg damar içi metronidazol verilir; ileus varsa rektal vankomisin eklenir; fidaksomisin kullanılmaz ve erken cerrahi danışma istenir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,13%{opacity:0;transform:translateY(8px)}16%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,13%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,25%{opacity:0;transform:translateY(8px)}28%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,25%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,38%{opacity:0;transform:translateY(8px)}41%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,38%{stroke-dashoffset:1}43%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,63%{opacity:0;transform:translateY(8px)}66%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,63%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,75%{opacity:0;transform:translateY(8px)}78%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,75%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,88%{opacity:0;transform:translateY(8px)}91%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,88%{stroke-dashoffset:1}93%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="830" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M260,96 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M380,96 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,266 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,266 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,376 L165,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,376 L477,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,540 L220,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,540 L420,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,684 L320,714" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="53.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Belirti + pozitif test (ya da çok yüksek şüphe)</text><text x="320" y="73.5" text-anchor="middle" font-size="13" fill="#0f172a">tetikleyen antibiyotiği kes · temas önlemi, sabun-su · sıvı</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Fulminan değil</text><text x="162.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ciddi: lökosit &gt;15.000 ya da</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">kreatinin ≥1,5 (ya da %50 artış)</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ciddide cerrahi gereği de düşün</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Fulminan kolit</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#7f1d1d">hipotansiyon ya da şok</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#7f1d1d">ileus ya da megakolon</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#7f1d1d">hemen yatış, erken cerrahi danışma</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">İlk atak: fidaksomisin 200 mg × 2, 10 gün</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#064e3b">yoksa vankomisin 125 mg × 4, 10 gün · damar içi vankomisin etkisiz</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">İlk nüks</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">önce vankomisin → fidaksomisin</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">önce fidaksomisin → azaltılarak</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">kesilen vankomisin</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Fulminan tedavi</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#7f1d1d">vankomisin 500 mg × 4 (ağız/NG)</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#7f1d1d">+ metronidazol 500 mg × 3 damar içi</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#7f1d1d">ileusta rektal vankomisin · fidaksomisin YOK</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">İkinci ve sonraki nüksler</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#4c1d95">2. nüks: fidaksomisin şeması + ticari fekal mikrobiyota ürünü</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#4c1d95">3. nüks ve sonrası: uzun şema + fekal mikrobiyota nakli ya da ürünü</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#4c1d95">nakil yapılamıyorsa: vankomisin 125 mg günde bir, baskılama</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Süre ve izlem</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#0f172a">ilk tedavi 10 gün; ciddi/fulminanda yavaş iyileşmede 14 gün</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#0f172a">iyileşen hastada dışkı testi tekrarlanmaz: %50'ye varan pozitiflik sürer</text></g>
</svg>
