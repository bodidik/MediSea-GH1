<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" width="640" height="790" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bruselloz: tedavi süresi ve bitirme kararı</title>
<desc id="d">Süreyi rejim değil tutulum belirler. Odak yoksa altı hafta. Spondilitte en az 12 hafta; bulgu ya da görüntüleme sürüyorsa uzatılır. Nörobrusellozda en az 12 hafta, çoğu kez 4 ila 6 ay, BOS ve klinik normale dönene dek. Endokarditte aminoglikozid dört hafta, diğer ikisi en az 12 hafta, çoğu kez 4 ila 6 ay; ameliyat edilmeyen protez kapak ya da apsede daha uzun. Bitirme kararı kliniktir: seroloji süreyi belirlemez, titre yıllarca pozitif kalabilir. Semptom dönerse önce fokal odak aranır, izolata duyarlılık bakılır; çoğu relaps aynı rejimin tekrarıyla düzelir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,13%{opacity:0;transform:translateY(8px)}16%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,13%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,25%{opacity:0;transform:translateY(8px)}28%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,25%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,38%{opacity:0;transform:translateY(8px)}41%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,38%{stroke-dashoffset:1}43%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,63%{opacity:0;transform:translateY(8px)}66%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,63%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,75%{opacity:0;transform:translateY(8px)}78%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,75%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,88%{opacity:0;transform:translateY(8px)}91%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,88%{stroke-dashoffset:1}93%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="790" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M240,96 L165,136" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M400,96 L477,136" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M162,420 L220,461" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M477,420 L420,461" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M320,575 L320,616" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="110" y="20" width="420" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="52.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Süreyi rejim değil TUTULUM belirler</text><text x="320" y="72.5" text-anchor="middle" font-size="13" fill="#0f172a">tek ilaç ve 6 haftadan kısa tedavi kabul edilmez</text></g><g class="a m s2"><rect x="15" y="140" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="189.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Odak yok</text><text x="162.5" y="209.5" text-anchor="middle" font-size="13" fill="#064e3b">6 hafta</text><text x="162.5" y="229.5" text-anchor="middle" font-size="13" fill="#064e3b">aminoglikozid ilk 7–21 gün</text></g><g class="a m s3"><rect x="330" y="140" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="179.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Spondilit</text><text x="477.5" y="199.5" text-anchor="middle" font-size="13" fill="#78350f">en az 12 hafta</text><text x="477.5" y="219.5" text-anchor="middle" font-size="13" fill="#78350f">bulgu ya da görüntüleme</text><text x="477.5" y="239.5" text-anchor="middle" font-size="13" fill="#78350f">sürüyorsa uzat</text></g><g class="a m s4"><rect x="15" y="290" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="162.5" y="329.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Nörobruselloz</text><text x="162.5" y="349.5" text-anchor="middle" font-size="13" fill="#4c1d95">en az 12 hafta</text><text x="162.5" y="369.5" text-anchor="middle" font-size="13" fill="#4c1d95">çoğu kez 4–6 ay</text><text x="162.5" y="389.5" text-anchor="middle" font-size="13" fill="#4c1d95">BOS + klinik normale dek</text></g><g class="a m s5"><rect x="330" y="290" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="329.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Endokardit</text><text x="477.5" y="349.5" text-anchor="middle" font-size="13" fill="#7f1d1d">en az 12 hafta</text><text x="477.5" y="369.5" text-anchor="middle" font-size="13" fill="#7f1d1d">çoğu kez 4–6 ay</text><text x="477.5" y="389.5" text-anchor="middle" font-size="13" fill="#7f1d1d">ameliyatsız protez/apsede uzar</text></g><g class="a m s6"><rect x="80" y="465" width="480" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="494.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Bitirme kararı KLİNİK</text><text x="320" y="514.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ateş, halsizlik, fokal bulgu geriledi mi</text><text x="320" y="534.5" text-anchor="middle" font-size="13" fill="#1e3a8a">seroloji süreyi belirlemez: titre yıllarca pozitif kalabilir</text><text x="320" y="554.5" text-anchor="middle" font-size="13" fill="#1e3a8a">fokal tutulumda yanıt için görüntüleme tekrarlanır</text></g><g class="a m s7"><rect x="80" y="620" width="480" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="649.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Semptom döndü: önce FOKAL ODAK ara</text><text x="320" y="669.5" text-anchor="middle" font-size="13" fill="#78350f">relaps genellikle ilk 6 ayda, 12 aya kadar</text><text x="320" y="689.5" text-anchor="middle" font-size="13" fill="#78350f">direnç nadir; yine de izolata duyarlılık bak</text><text x="320" y="709.5" text-anchor="middle" font-size="13" fill="#78350f">çoğu relaps aynı rejimin tekrarıyla düzelir</text></g><g class="a s8"><text x="320" y="768" text-anchor="middle" font-size="12" fill="#475569">Süreler UpToDate (Bosilkovski, 2026). Erişkin için; dozlar sayfa metnindedir.</text></g>
</svg>
