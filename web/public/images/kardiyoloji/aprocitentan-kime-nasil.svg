.s4 .ciz{animation-name:c4}@keyframes c4{0%,38%{stroke-dashoffset:1}43%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,63%{opacity:0;transform:translateY(8px)}66%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,63%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,75%{opacity:0;transform:translateY(8px)}78%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,75%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,88%{opacity:0;transform:translateY(8px)}91%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,88%{stroke-dashoffset:1}93%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="830" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M260,96 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M380,96 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,266 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,266 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,376 L165,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,376 L477,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,540 L220,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,540 L420,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,684 L320,714" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="53.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Önce gerçek direnç</text><text x="320" y="73.5" text-anchor="middle" font-size="13" fill="#0f172a">3 sınıf, biri diüretik, en yüksek doz · psödodirenci dışla</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="186.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">4. basamak: spironolakton</text><text x="162.5" y="206.5" text-anchor="middle" font-size="13" fill="#064e3b">PATHWAY-2: SKB ~8 mmHg</text><text x="162.5" y="226.5" text-anchor="middle" font-size="13" fill="#064e3b">MRA hâlâ ilk tercih</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Aprocitentanın yeri</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">MRA kullanılamıyorsa:</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">hiperkalemi · ileri KBH</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">intolerans</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Başlamadan önce</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#78350f">gebelik testi · Hb · ALT, AST, bilirubin · sıvı durumu · KY öyküsü</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Doz: 12,5 mg/gün</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#4c1d95">25 mg ek düşüş yok</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#4c1d95">ödem 2 kat (%18 / %9)</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#4c1d95">yarı ömür uzun: tek doz</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Beklenen etki</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#1e3a8a">4 hf: ofis SKB −3,8 (plaseboya)</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#1e3a8a">kesilince +6/5 mmHg</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#1e3a8a">UACR ~%30 düşüş</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">İzlem: sıvı</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#7f1d1d">ödem ve kilo izle, diüretiği ayarla</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#7f1d1d">KBH'de ödem %32 (KBH olmayanda %15)</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#7f1d1d">KY yatışı 11 hasta, 10'u aprocitentan kolunda</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Başlama</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#7f1d1d">gebelik · ALT/AST &gt;3×ÜS · orta-ağır karaciğer yetmezliği</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#7f1d1d">NYHA III-IV ve yüksek NT-proBNP çalışmaya alınmadı</text></g>
</svg>
