<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Aprocitentan: kime, nasıl, neye dikkat</title>
<desc id="d">Önce gerçek dirençli hipertansiyon doğrulanır: biri diüretik üç farklı sınıf ilaç en yüksek tolere edilen dozda iken kan basıncı hedefin üstündedir; ölçüm hatası, beyaz önlük etkisi ve ilaç uyumsuzluğu dışlanır. PRECISION çalışmasında aday hastaların yaklaşık yüzde 44'ü bu aşamada elendi. Dördüncü basamakta ilk seçenek spironolaktondur; PATHWAY-2'de sistolik basıncı yaklaşık 8 mmHg düşürdü. Aprocitentan, mineralokortikoid reseptör antagonisti kullanılamayan, hiperkalemisi ya da ileri böbrek hastalığı olan veya ilacı tolere edemeyen hastada bir seçenektir. Başlamadan önce gebelik testi, hemoglobin, karaciğer enzimleri ve bilirubin, sıvı durumu ve kalp yetmezliği öyküsü değerlendirilir. Onaylı doz günde bir kez 12,5 miligramdır; 25 miligram ek basınç düşüşü sağlamadı, ödemi iki katına çıkardı. Dört haftada plaseboya göre ofis sistolik basıncında yaklaşık 3,8 mmHg ek düşüş, ilaç kesilince yaklaşık 6/5 mmHg yükselme ve idrar albümin/kreatinin oranında yaklaşık yüzde 30 düşüş görüldü. İzlemde ödem ve kilo artışı izlenir, diüretik ayarlanır; böbrek hastalarında ödem yüzde 32'ye çıktı ve kalp yetmezliği nedeniyle yatan 11 hastanın 10'u aprocitentan alıyordu. Gebelikte, aminotransferazlar normalin üst sınırının üç katından yüksekken ve orta-ağır karaciğer yetmezliğinde başlanmaz; NYHA III-IV kalp yetmezliği çalışmaya alınmamıştı.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
