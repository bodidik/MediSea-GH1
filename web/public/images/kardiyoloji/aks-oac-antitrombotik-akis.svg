<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AKS ve oral antikoagülan endikasyonunda zamana göre antitrombotik tedavi (ESC 2023, ACC/AHA 2025, CCS 2023)</title>
<desc id="d">Başvuru ya da PCI sırasında aspirin yüklemesi. Varsayılan: en fazla 1 hafta üçlü tedavi (NOAC, aspirin, klopidogrel), ardından 12 aya kadar NOAC ve klopidogrel, 12 aydan sonra yalnız NOAC. ACC/AHA 2025 aspirini 1–4 haftada keser. Yüksek iskemik riskte üçlü tedavi 1 aya kadar. Yüksek kanama riskinde antiplatelet 6. ayda bırakılabilir. Prasugrel ve tikagrelor üçlü tedavide önerilmez.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">AKS + uzun süreli OAC endikasyonu</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">AF (CHA₂DS₂-VASc), mekanik kapak, VTE</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="76" x2="320" y2="98" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="80" y="100" width="480" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="127" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Üçlü tedavi: NOAC + aspirin + klopidogrel</text><text x="320" y="145" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">ESC: ≤1 hafta · ACC/AHA: 1–4 hafta</text></g><g class="a" style="animation-delay:4.80s"><line x1="320" y1="162" x2="320" y2="184" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="80" y="186" width="480" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="213" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">İkili tedavi: NOAC + klopidogrel</text><text x="320" y="231" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">12. aya kadar (aspirin çıkarılır)</text></g><g class="a" style="animation-delay:7.20s"><line x1="320" y1="248" x2="320" y2="270" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="120" y="272" width="400" height="62" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="320" y="299" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">12 aydan sonra: yalnız OAC</text><text x="320" y="317" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">AFIRE · ESC Sınıf I</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="360" width="300" height="92" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="164" y="393" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Yüksek iskemik risk</text><text x="164" y="411" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Üçlü tedavi 1 haftadan uzun,</text><text x="164" y="429" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">1 aya kadar (ESC IIa)</text><rect x="326" y="360" width="300" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="476" y="393" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Yüksek kanama riski</text><text x="476" y="411" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Antiplatelet 6. ayda kesilebilir</text><text x="476" y="429" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">(ESC IIb, MASTER DAPT)</text></g><g class="a" style="animation-delay:12.00s"><rect x="14" y="470" width="614" height="54" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="321" y="502" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">NOAC tam inme dozunda · VKA ise INR 2,0–2,5, TTR &gt;%70</text></g><g class="a" style="animation-delay:14.40s"><rect x="14" y="538" width="614" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="321" y="568" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Üçlü tedavide prasugrel ve tikagrelor önerilmez (ESC Sınıf III)</text></g>
</svg>
