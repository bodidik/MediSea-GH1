e="13" fill="#1e3a8a">A: risk · B: yapısal, belirtisiz</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">C: belirtili</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">D: ileri / dirençli</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Tanı</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">NT-proBNP (yaşa göre)</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">eko: EF, E/e', LAVI</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">PCWP ≥15 / egzersiz ≥25</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Akut: perfüzyon × konjesyon</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#7f1d1d">sıcak-ıslak &gt;%70 · soğuk-ıslak &lt;%20 (şokun çoğu)</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">HFrEF: dört sütun</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">ARNİ / ACEİ / ARB</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">β-bloker · MRA</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">SGLT2 inhibitörü</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">HFpEF / HFmrEF</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#4c1d95">SGLT2i: standart</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#4c1d95">diüretikle dekonjesyon</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#4c1d95">obeziteyi tedavi et</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Cihaz (GDMT ≥3 ay sonra)</text><text x="320" y="634.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ICD: EF ≤%35 · beklenen sağkalım &gt;1 yıl</text><text x="320" y="654.5" text-anchor="middle" font-size="13" fill="#1e3a8a">CRT: EF ≤%35 · sinüs · LBBB · QRS ≥150 ms</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">İleri KY: I NEED HELP</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#7f1d1d">inotrop · NYHA III–IV · EF &lt;%20 · &gt;1 yatış/yıl</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#7f1d1d">KB &lt;100 · ilaç kesme → ileri merkeze sevk</text></g>
