<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kalp yetersizliği: tanıdan ileri evreye</title>
<desc id="d">Kalp yetersizliği, kalbin yapısal ya da işlevsel bozukluğunun yol açtığı belirti ve bulgularla giden klinik bir sendromdur. Sol ventrikül ejeksiyon fraksiyonu yüzde 40 ve altındaysa düşük, 41 ile 49 arasındaysa hafif düşük, 50 ve üstündeyse korunmuş ejeksiyon fraksiyonlu kalp yetersizliği denir. ACC/AHA evreleri risk altındaki A'dan, yapısal hastalığı olup belirtisi olmayan B'ye, belirtili C'ye ve ileri D'ye uzanır. Tanıda natriüretik peptidler, ekokardiyografi ve gerektiğinde istirahatte 15, egzersizde 25 mmHg ve üzeri pulmoner kapiller uç basıncını gösteren hemodinamik egzersiz testi kullanılır; obezitede natriüretik peptid düşük çıkabilir. Akut dekompansasyonda hastaların yüzde 70'inden fazlası sıcak ve ıslak, yüzde 20'den azı soğuk ve ıslak profildedir. Düşük ejeksiyon fraksiyonlu yetersizlikte dört temel ilaç sınıfı kullanılır: sakubitril-valsartan ya da ACE inhibitörü veya ARB, kanıtlı beta bloker, mineralokortikoid reseptör antagonisti ve SGLT2 inhibitörü; ACE inhibitöründen sakubitril-valsartana geçişte 36 saat beklenir. SGLT2 inhibitörleri ejeksiyon fraksiyonundan bağımsız olarak yarar sağlar. Tıbbi tedaviye karşın ejeksiyon fraksiyonu yüzde 35 ve altında kalan uygun hastada ICD, sinüs ritminde sol dal bloğu ve QRS 150 ms ve üzerinde CRT düşünülür. İleri kalp yetersizliği I NEED HELP ipuçlarıyla tanınır ve uzman merkeze sevk gerektirir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
