<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Beşinci Tanım: miyokard enfarktüsü sınıflaması</title>
<desc id="d">Troponinle akut miyokard hasarı gösterilir; klinik zemine göre birincil, ikincil veya işlem sonrası MI ayrılır.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="500" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="140" y="20" width="360" height="82" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="44" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Akut miyokard hasarı</text><text x="320" y="62" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Troponinde yükselme ve/veya düşüş</text><text x="320" y="80" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Cinsiyete özgü 99. persentil üstü</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="102" x2="320" y2="148" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="140" y="150" width="360" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Hangi klinik zemin?</text><text x="320" y="192" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">İskemi kanıtı + altta yatan neden</text></g><g class="a" style="animation-delay:4.80s"><line x1="230" y1="212" x2="110" y2="278" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="12" y="280" width="196" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="110" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Birincil MI</text><text x="110" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Akut koroner patoloji:</text><text x="110" y="340" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">aterotromboz, SCAD,</text><text x="110" y="358" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">vazospazm, embolizm,</text><text x="110" y="376" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">stent/greft sorunu</text><text x="110" y="394" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">(&gt;30 gün sonra)</text></g><g class="a" style="animation-delay:7.20s"><line x1="320" y1="212" x2="320" y2="278" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="222" y="280" width="196" height="150" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="320" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">İkincil MI</text><text x="320" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Başka akut durum</text><text x="320" y="340" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">iskemiye yol açar</text><text x="320" y="358" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Eski tip 2'nin</text><text x="320" y="376" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">yerine geçer</text></g><g class="a" style="animation-delay:9.60s"><line x1="410" y1="212" x2="530" y2="278" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="432" y="280" width="196" height="150" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="530" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">İşlem sonrası MI</text><text x="530" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Koroner girişim</text><text x="530" y="340" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">veya kalp cerrahisi</text><text x="530" y="358" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Eski tip 4a–c ve</text><text x="530" y="376" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">tip 5'in yerine</text></g>
</svg>
