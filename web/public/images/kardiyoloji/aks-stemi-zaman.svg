<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">STEMI reperfüzyon zamanları (ESC 2023)</title>
<desc id="d">PCI 120 dakikada mümkünse primer PCI; değilse fibrinolitik, transfer, başarıda 2 ila 24 saatte anjiyografi, başarısızlıkta kurtarıcı PCI.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="500" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="170" y="16" width="300" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="40" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">STEMI tanısı (saat 0)</text><text x="320" y="58" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">İlk EKG hedefi &lt;10 dk</text></g><g class="a" style="animation-delay:2.33s"><line x1="320" y1="78" x2="320" y2="116" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="170" y="118" width="300" height="44" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">PCI tanıdan &lt;120 dk mümkün mü?</text></g><g class="a" style="animation-delay:4.67s"><line x1="250" y1="162" x2="152" y2="208" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="12" y="210" width="280" height="104" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="152" y="234" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Evet: Primer PCI</text><text x="152" y="252" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Tanı→tel geçişi</text><text x="152" y="270" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">PCI merkezinde &lt;60 dk</text><text x="152" y="288" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Transferde &lt;90 dk</text></g><g class="a" style="animation-delay:7.00s"><line x1="390" y1="162" x2="488" y2="208" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="348" y="210" width="280" height="104" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="488" y="234" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Hayır: Fibrinoliz</text><text x="488" y="252" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Bolus tanıdan &lt;10 dk</text><text x="488" y="270" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Semptom ≤12 saat</text><text x="488" y="288" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Ardından hemen PCI merkezine</text></g><g class="a" style="animation-delay:9.33s"><line x1="445" y1="314" x2="340" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="232" y="370" width="190" height="104" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="327" y="394" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Başarılı</text><text x="327" y="412" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">ST gerilemesi ≥%50</text><text x="327" y="430" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Anjiyografi</text><text x="327" y="448" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">2–24 saatte</text></g><g class="a" style="animation-delay:11.67s"><line x1="530" y1="314" x2="533" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="438" y="370" width="190" height="104" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="533" y="394" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Başarısız</text><text x="533" y="412" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">60–90 dk'da &lt;%50</text><text x="533" y="430" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">veya instabilite:</text><text x="533" y="448" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Kurtarıcı PCI</text></g>
</svg>
