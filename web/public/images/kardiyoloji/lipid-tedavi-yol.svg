<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" width="640" height="880" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Dislipidemi: riskten hedefe, hedeften basamaklı tedaviye (ACC/AHA 2026)</title>
<desc id="d">Önce hasta sınıflanır: klinik ASCVD varsa çok yüksek riskte LDL-C hedefi 55 altı ve non-HDL-C 85 altı, çok yüksek risk değilse LDL-C 70 altı. Primer korumada 30–79 yaşta LDL-C 70–189 ise PREVENT-ASCVD 10 yıllık riski: düşük yüzde 3 altı yaşam tarzı; sınırda yüzde 3 ile 5 arası ve orta yüzde 5 ile 10 arası orta yoğunluklu statin, yüzde 30–49 düşüş, hedef LDL-C 100 altı; yüksek yüzde 10 ve üstü yüksek yoğunluklu statin, en az yüzde 50 düşüş, hedef LDL-C 70 altı. Karar belirsizse CAC: 0 ise statin ertelenebilir, 1–99 hedef 100 altı, 100–299 ya da 75. persentil üstü hedef 70 altı, 300–999 en az yüzde 50 düşüş ve hedef 70 altı, 1000 ve üstü hedef 55 altı. Hedefe ulaşılmazsa basamak: statin dozunu artır, ezetimib ekle, sonra PCSK9 monoklonal antikor ya da inklisiran ya da bempedoik asit. Her basamakta 4–12 hafta sonra lipid ölç.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="880" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M220,90 L150,118" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M420,90 L470,118" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M470,300 L470,328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M470,470 L470,498" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M150,300 L230,668" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M470,640 L420,668" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Önce sınıfla: ASCVD var mı?</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Hedef = hem % düşüş hem mutlak LDL-C ve non-HDL-C değeri</text></g>
<g class="a m s2"><rect x="10" y="120" width="280" height="180" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="150" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Sekonder koruma</text><text x="150" y="178" text-anchor="middle" font-size="12" fill="#7f1d1d">Çok yüksek risk:</text><text x="150" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">LDL-C &lt;55 · non-HDL-C &lt;85</text><text x="150" y="226" text-anchor="middle" font-size="12" fill="#7f1d1d">Çok yüksek değil:</text><text x="150" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">LDL-C &lt;70 · non-HDL-C &lt;100</text><text x="150" y="276" text-anchor="middle" font-size="11" fill="#7f1d1d">Yüksek yoğunluklu statin, ≥%50</text></g>
<g class="a m s2"><rect x="310" y="120" width="320" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="470" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Primer · PREVENT-ASCVD 10 yıl</text><text x="470" y="176" text-anchor="middle" font-size="12" fill="#1e3a8a">30–79 yaş, LDL-C 70–189 mg/dL</text><text x="470" y="200" text-anchor="middle" font-size="12" fill="#1e3a8a">&lt;%3 düşük → yaşam tarzı</text><text x="470" y="222" text-anchor="middle" font-size="12" fill="#1e3a8a">%3–&lt;5 sınırda · %5–&lt;10 orta</text><text x="470" y="242" text-anchor="middle" font-size="12" fill="#1e3a8a">→ orta yoğunluk, %30–49, &lt;100</text><text x="470" y="266" text-anchor="middle" font-size="12" fill="#1e3a8a">≥%10 yüksek → yüksek yoğunluk,</text><text x="470" y="286" text-anchor="middle" font-size="12" fill="#1e3a8a">≥%50, &lt;70</text></g>
<g class="a m s3"><rect x="310" y="330" width="320" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="470" y="358" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Karar belirsiz → CAC skoru</text><text x="470" y="384" text-anchor="middle" font-size="12" fill="#78350f">0 → ertelenebilir (FH, DM, sigara hariç)</text><text x="470" y="404" text-anchor="middle" font-size="12" fill="#78350f">1–99 → &lt;100 · 100–299 / ≥75. p → &lt;70</text><text x="470" y="424" text-anchor="middle" font-size="12" fill="#78350f">300–999 → ≥%50, &lt;70</text><text x="470" y="444" text-anchor="middle" font-size="12" fill="#78350f">≥1000 → ≥%50, &lt;55</text></g>
<g class="a m s4"><rect x="310" y="500" width="320" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="470" y="528" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Doğrudan statin</text><text x="470" y="554" text-anchor="middle" font-size="12" fill="#4c1d95">LDL-C ≥190 mg/dL (FH araştır)</text><text x="470" y="576" text-anchor="middle" font-size="12" fill="#4c1d95">Diyabet, KBH evre 3–4, HIV</text><text x="470" y="596" text-anchor="middle" font-size="12" fill="#4c1d95">(40–75 yaş, LDL-C düzeyinden</text><text x="470" y="616" text-anchor="middle" font-size="12" fill="#4c1d95">bağımsız)</text></g>
<g class="a m s5"><rect x="40" y="670" width="560" height="196" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="700" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Hedefe ulaşılmadı → basamak</text><text x="320" y="730" text-anchor="middle" font-size="13" fill="#064e3b">1 · Statini en yüksek tolere edilen doza çıkar</text><text x="320" y="756" text-anchor="middle" font-size="13" fill="#064e3b">2 · Ezetimib ekle (statine ek ~%25)</text><text x="320" y="782" text-anchor="middle" font-size="13" fill="#064e3b">3 · PCSK9 mAb (%45–64) · inklisiran (%48–52)</text><text x="320" y="806" text-anchor="middle" font-size="13" fill="#064e3b">· bempedoik asit (~%20, statin intoleransında)</text><text x="320" y="840" text-anchor="middle" font-size="12" fill="#064e3b">Her başlangıç ya da doz değişikliğinden 4–12 hafta sonra lipid profili</text></g>
</svg>
