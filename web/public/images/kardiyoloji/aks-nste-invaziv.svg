<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">NSTE-AKS invaziv zamanlama (ESC 2023)</title>
<desc id="d">Çok yüksek riskte 2 saat içinde; yüksek riskte 24 saat içinde düşünülür ve yatışta yapılır; düşük şüphede seçici yaklaşım.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="500" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="170" y="16" width="300" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="40" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">NSTE-AKS çalışma tanısı</text><text x="320" y="58" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Risk ölçütlerini tara</text></g><g class="a" style="animation-delay:2.50s"><line x1="320" y1="78" x2="320" y2="128" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="12" y="130" width="616" height="118" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="154" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Çok yüksek risk: İVEDİ, &lt;2 saat (I, C)</text><text x="320" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Hemodinamik instabilite veya kardiyojenik şok · dirençli/tekrarlayan ağrı</text><text x="320" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Hastane içi yaşamı tehdit eden aritmi · mekanik komplikasyon</text><text x="320" y="208" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">İskemiye bağlı akut kalp yetmezliği · aralıklı ST yükselmesi</text></g><g class="a" style="animation-delay:5.00s"><rect x="12" y="268" width="616" height="100" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="292" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Yüksek risk: ERKEN, &lt;24 saat düşünülmeli (IIa, A); yatışta yapılır (I, A)</text><text x="320" y="310" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Doğrulanmış NSTEMI · dinamik ST/T değişikliği</text><text x="320" y="328" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Geçici ST yükselmesi · GRACE &gt;140</text></g><g class="a" style="animation-delay:7.50s"><rect x="12" y="388" width="616" height="84" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="320" y="412" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Risk ölçütü yok, NSTE-AKS şüphesi düşük: SEÇİCİ (I, A)</text><text x="320" y="430" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Anjiyografi kararı ileri değerlendirmeye göre</text></g>
