<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Opioid toleransı: mekanizmadan kliniğe</title>
<desc id="d">Birinci adım, reseptör: sinyal reseptör fosforilasyonu ve beta-arrestin bağlanmasıyla sonlanır, reseptör hücre içine alınır; Ribeiro 2026 bunu farmakolojik toleransın en önemli süreci sayar. İkinci adım, omurilik ve beyin: NMDA reseptörü tolerans, hiperaljezi, allodini ve santral sensitizasyonda rol oynar; MASCC'ye göre opioid kaynaklı hiperaljeziyi mu dışı reseptör ve kanal etkinleşmesi ile nöroinflamasyon sürükleyebilir. Üçüncü adım, kişi: OPRM1 A118G sonuçları çelişkili ve kökene bağlıdır; OPRM1 promotor hipermetilasyonu reseptör ifadesini azaltabilir. Dördüncü adım, klinik: analjeziye tolerans birkaç haftada gelişebilir, sedasyona birkaç günde; kabızlık ve miyozise tolerans azdır. Hastalık ilerlemeden doz artışına rağmen ağrı artıyor ya da yayılıyorsa hiperaljezi düşünülür. Beşinci adım, ne yapılır: eşdeğer dozun yüzde 25 ile 50 azaltılarak opioid rotasyonu, metadona geçişte yüzde 75 ile 90'ın üstünde azaltma, dirençli ağrıda NMDA antagonisti, opioid koruyucu çok yönlü tedavi; doz azaltılırken tolerans yedi gün gibi kısa sürede kaybolabilir, nalokson ve eğitim verilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,128 L320,150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,274 L320,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,398 L320,420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,566 L320,588" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="114" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">1 · Reseptör</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#4c1d95">Fosforilasyon → β-arrestin → reseptör hücre içine alınır</text><text x="320" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Farmakolojik toleransın en önemli süreci (Ribeiro 2026)</text><text x="320" y="110" text-anchor="middle" font-size="12" fill="#4c1d95">Sinyal: AC ↓ cAMP ↓ · GIRK açılır · Ca²⁺ kanalı kapanır</text></g>
<g class="a m s2"><rect x="40" y="152" width="560" height="122" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">2 · Omurilik ve beyin</text><text x="320" y="204" text-anchor="middle" font-size="12" fill="#1e3a8a">NMDA reseptörü: tolerans · hiperaljezi · allodini</text><text x="320" y="226" text-anchor="middle" font-size="12" fill="#1e3a8a">Santral sensitizasyon → opioide duyarlılık azalır</text><text x="320" y="250" text-anchor="middle" font-size="12" fill="#1e3a8a">OIH: μ dışı reseptör, kanal ve nöroinflamasyon (MASCC)</text></g>
<g class="a m s3"><rect x="40" y="298" width="560" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="326" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">3 · Kişi</text><text x="320" y="350" text-anchor="middle" font-size="12" fill="#334155">OPRM1 A118G: sonuç çelişkili, kökene bağlı</text><text x="320" y="374" text-anchor="middle" font-size="12" fill="#334155">OPRM1 promotor hipermetilasyonu → reseptör ifadesi ↓</text></g>
<g class="a m s4"><rect x="40" y="422" width="560" height="144" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="450" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · Klinik</text><text x="320" y="474" text-anchor="middle" font-size="12" fill="#78350f">Analjeziye tolerans: birkaç hafta (remifentanil: saatler)</text><text x="320" y="496" text-anchor="middle" font-size="12" fill="#78350f">Sedasyona birkaç gün · kabızlık ve miyozise az</text><text x="320" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Hastalık ilerlemeden doz ↑ ama ağrı ↑ ya da yayılıyor</text><text x="320" y="542" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">→ hiperaljeziyi (OIH) düşün</text></g>
<g class="a m s5"><rect x="40" y="590" width="560" height="212" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="618" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">5 · Ne yapılır?</text><text x="320" y="644" text-anchor="middle" font-size="12" fill="#064e3b">Rotasyon: eşdeğer doz %25–50 azaltılır (kırılgan yaşlıda %50'ye yakın)</text><text x="320" y="666" text-anchor="middle" font-size="12" fill="#064e3b">Metadona geçiş: %75 ile %90'ın üstü azaltma</text><text x="320" y="688" text-anchor="middle" font-size="12" fill="#064e3b">Dirençli ağrı: NMDA antagonisti (ketamin, metadon) ek olarak</text><text x="320" y="710" text-anchor="middle" font-size="12" fill="#064e3b">OIH'de doz azaltma ya da rotasyon · opioid koruyucu çok yönlü tedavi</text><text x="320" y="740" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Doz azaltılırken tolerans 7 gün gibi kısa sürede kaybolabilir</text><text x="320" y="762" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Eski doza hızlı dönüş = aşırı doz riski</text><text x="320" y="784" text-anchor="middle" font-size="12" fill="#064e3b">Nalokson ve hasta-aile eğitimi</text></g>
</svg>
