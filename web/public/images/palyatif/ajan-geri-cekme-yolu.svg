<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Çoklu analjezik alan kanser hastasında hangi ajan çekilir?</title>
<desc id="d">Birinci adım, soru: geri çekmek üç ayrı iştir; rotasyon, sadeleştirme ve kademeli azaltma. İkinci adım, sadeleştir: güçlü opioide geçilince zayıf opioid olan tramadol çekilir; parasetamol ve NSAİİ opioide ek olarak sürebilir, böbrek, kanama ve mide riski tartılır. Üçüncü adım, rotasyon: eşdeğer doz hesaplanır, eksik çapraz tolerans için yüzde 25 ile 50 azaltılır, kırılgan yaşlıda yüzde 50'ye yakın; metadona geçişte yüzde 75 ile 90 azaltılır ve başlangıç günde 30 miligramı geçmez. Dördüncü adım, fentanil bandını bırakmak: bant çıkarılınca yarı ömür 20 ile 27 saattir, analjezik etki sürebilir; yeni opioidin tam dozu hemen verilmez, kurtarma dozu hazır tutulur. Beşinci adım, tolerans ya da hiperaljezi sürüyorsa: NMDA antagonisti ketamin ya da metadon eklenir; abdominopelvik kanserde sempatik blok 14. günde opioid tüketimini yaklaşık 42 miligram azaltabilir ama kanıt çok belirsizdir. Opioid tatili verisi kanser dışı kronik ağrıdandır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,96 L320,118" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,242 L320,264" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,412 L320,434" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,580 L320,602" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="82" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">1 · "Geri çekmek" üç ayrı iştir</text><text x="320" y="72" text-anchor="middle" font-size="12" fill="#334155">Rotasyon · sadeleştirme · kademeli azaltma</text></g>
<g class="a m s2"><rect x="40" y="120" width="560" height="122" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="148" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">2 · Sadeleştir</text><text x="320" y="174" text-anchor="middle" font-size="12" fill="#1e3a8a">Güçlü opioide geçildiyse zayıf opioid (tramadol) çekilir</text><text x="320" y="198" text-anchor="middle" font-size="12" fill="#1e3a8a">Parasetamol, NSAİİ opioide ek olarak sürebilir</text><text x="320" y="222" text-anchor="middle" font-size="12" fill="#1e3a8a">Böbrek, kanama, mide riski hastaya göre tartılır</text></g>
<g class="a m s3"><rect x="40" y="266" width="560" height="146" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="294" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">3 · Rotasyon</text><text x="320" y="320" text-anchor="middle" font-size="12" fill="#4c1d95">Eşdeğer doz → eksik çapraz tolerans için %25–50 azalt</text><text x="320" y="342" text-anchor="middle" font-size="12" fill="#4c1d95">(kırılgan yaşlıda %50'ye yakın · Ribeiro 2026)</text><text x="320" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Metadona geçiş: %75–90 azalt</text><text x="320" y="390" text-anchor="middle" font-size="12" fill="#4c1d95">başlangıç 30 mg/günü geçmez (UpToDate)</text></g>
<g class="a m s4"><rect x="40" y="436" width="560" height="144" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="464" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · Fentanil bandını bırakmak</text><text x="320" y="490" text-anchor="middle" font-size="12" fill="#78350f">Bant çıkınca yarı ömür 20–27 saat</text><text x="320" y="512" text-anchor="middle" font-size="12" fill="#78350f">Analjezik etki bir süre daha devam edebilir</text><text x="320" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Yeni opioidin tam dozu hemen verilmez</text><text x="320" y="562" text-anchor="middle" font-size="12" fill="#78350f">Kısa etkili kurtarma dozu hazır</text></g>
<g class="a m s5"><rect x="40" y="604" width="560" height="200" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="632" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">5 · Tolerans ya da hiperaljezi sürüyorsa</text><text x="320" y="658" text-anchor="middle" font-size="12" fill="#064e3b">Çekme değil EKLEME: ketamin ya da metadon (NMDA)</text><text x="320" y="682" text-anchor="middle" font-size="12" fill="#064e3b">Abdominopelvik kanserde sempatik blok:</text><text x="320" y="704" text-anchor="middle" font-size="12" fill="#064e3b">14. günde opioid ≈ 42 mg OME/gün daha az</text><text x="320" y="726" text-anchor="middle" font-size="12" fill="#064e3b">kanıt çok belirsiz (Cochrane 2024)</text><text x="320" y="758" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">"Opioid tatili" verisi kanser dışı kronik ağrıdan</text><text x="320" y="780" text-anchor="middle" font-size="12" fill="#064e3b">ilerleyen kansere doğrudan taşınmaz</text></g>
</svg>
