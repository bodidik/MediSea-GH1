<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Pankreas kanseri ağrısında tanı: öyküden tanısal bloğa</title>
<desc id="d">Önce acil ayrılır: kırık ya da yaklaşan kırık, nöroaksiyel metastaz, enfeksiyon, tıkalı ya da delinmiş içi boş organ, tromboembolik acil. Öykü yapılandırılmış bir araçla alınır: OPQRSTUV ya da SOCRATES; başlangıç, yer, yayılım, nitelik, en düşük ve en yüksek şiddet, artıran ve azaltan etkenler, eşlik eden belirtiler, günlük yaşama etkisi, önceki tedavi ve hastanın hedefi; total ağrı boyutları da sorulur. Ölçek: tek boyutlu (görsel analog, sözel, sayısal, Wong–Baker yüzler) ve çok boyutlu (McGill, Kısa Ağrı Envanteri); IPOS; iletişim kuramayan hastada Sözsüz Ağrı Ölçeği. ACTTION-APS çekirdek ölçütleri: tanılı pankreas kanseri; üst karında, arkaya yayılan ya da sırta vuran ağrı; muayenede üst karında palpasyonla hassasiyet; ağrıyı açıklayan başka durum, örneğin kabızlık, yok. Görüntüleme ve EUS: çölyak ganglionları hastaların yüzde 60–90'ında görülebilir; hipoekoik, oval ya da yuvarlak, 2–20 mm. Tanısal çölyak pleksus bloğu: lokal anestezik, kortikosteroidli ya da kortikosteroidsiz; pozitifse alkol, fenol ya da radyofrekansla nöroliz yapılır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,106 L320,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,276 L320,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,468 L320,492" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,614 L320,638" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Önce acili ayır</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#7f1d1d">Kırık · nöroaksiyel metastaz · enfeksiyon</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#7f1d1d">Tıkalı ya da delinmiş organ · tromboembolik acil</text></g>
<g class="a m s2"><rect x="40" y="132" width="560" height="144" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Öykü ve ölçek</text><text x="320" y="184" text-anchor="middle" font-size="12" fill="#334155">OPQRSTUV ya da SOCRATES · total ağrı boyutları</text><text x="320" y="206" text-anchor="middle" font-size="12" fill="#334155">Tek boyutlu: VAS · sözel · sayısal · Wong–Baker yüzler</text><text x="320" y="228" text-anchor="middle" font-size="12" fill="#334155">Çok boyutlu: McGill · Kısa Ağrı Envanteri · IPOS</text><text x="320" y="252" text-anchor="middle" font-size="12" fill="#334155">İletişim kuramayan hasta: Sözsüz Ağrı Ölçeği (NVPS)</text></g>
<g class="a m s3"><rect x="40" y="302" width="560" height="166" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="330" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">ACTTION-APS çekirdek ölçütleri</text><text x="320" y="354" text-anchor="middle" font-size="12" fill="#1e3a8a">1 · Tanılı pankreas kanseri</text><text x="320" y="376" text-anchor="middle" font-size="12" fill="#1e3a8a">2 · Üst karın ağrısı, arkaya yayılan ya da sırta vuran</text><text x="320" y="398" text-anchor="middle" font-size="12" fill="#1e3a8a">3 · Muayenede üst karında palpasyonla hassasiyet</text><text x="320" y="420" text-anchor="middle" font-size="12" fill="#1e3a8a">4 · Ağrıyı açıklayan başka durum yok (örn. kabızlık)</text><text x="320" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Yatarken artar, oturunca azalır (UpToDate)</text></g>
<g class="a m s4"><rect x="40" y="494" width="560" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="522" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">EUS</text><text x="320" y="546" text-anchor="middle" font-size="12" fill="#78350f">Çölyak ganglionları hastaların %60–90'ında görülebilir</text><text x="320" y="568" text-anchor="middle" font-size="12" fill="#78350f">Hipoekoik · oval ya da yuvarlak · 2–20 mm · 1–5 adet</text><text x="320" y="590" text-anchor="middle" font-size="12" fill="#78350f">Genellikle çölyak arterin solunda, aorta ile sol adrenal arasında</text></g>
<g class="a m s5"><rect x="40" y="640" width="560" height="160" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="668" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Tanısal çölyak pleksus bloğu</text><text x="320" y="692" text-anchor="middle" font-size="12" fill="#064e3b">Lokal anestezik ± kortikosteroid</text><text x="320" y="714" text-anchor="middle" font-size="12" fill="#064e3b">Soru: ağrı çölyak pleksus aracılı mı?</text><text x="320" y="736" text-anchor="middle" font-size="12" fill="#064e3b">Pozitifse → alkol, fenol ya da radyofrekansla nöroliz</text><text x="320" y="764" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Kontrendikasyon: trombosit &lt;50 000 · antikoagülan</text><text x="320" y="784" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">· koagülopati · enfeksiyon · bağırsak tıkanması</text></g>
</svg>
