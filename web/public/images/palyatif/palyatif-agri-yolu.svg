<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Palyatif bakımda ağrı: acilden dirençli ağrıya</title>
<desc id="d">Önce onkolojik acil ayrılır: kırık ya da yük taşıyan kemikte yaklaşan kırık, tehdit altındaki nöral doku ile nöroaksiyel metastaz, enfeksiyon, tıkalı ya da delinmiş içi boş organ, tromboembolik acil; ağrı ve altta yatan durum birlikte tedavi edilir. Sonra hasta opioid naif mi toleran mı belirlenir. Hafif ağrıda nonopioid ve adjuvan. Orta–şiddetli ağrıda opioid naif hastada 3–4 saatte bir 5–7,5 mg oral morfin ya da eşdeğeri; acil rahatlama gerekirse 2–5 mg IV morfin; parenteral doz oral dozun üçte biri. İdamede kurtarma dozu ASCO'ya göre MEDD'nin yüzde 5–20'si, NCCN'e göre yüzde 10–20'si, MASCC'ye göre yüzde 10–15'i. Böbrek yetmezliğinde ASCO metadonu önerir, morfin, meperidin, kodein ve tramadoldan kaçınılır; karaciğer hastalığında kodein ve meperidinden kaçınılır, hastalık ilerledikçe doz aralığı uzatılabilir. Dirençli ağrıda opioid rotasyonu, adjuvan analjezik, girişimsel tedavi ve bütüncül yaklaşım; karmaşık olgular multidisipliner palyatif konseyde tartışılabilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="900" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,128 L320,152" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,232 L320,256" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,424 L320,448" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,616 L320,640" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="114" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Önce onkolojik acili ayır</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#7f1d1d">Kırık / yaklaşan kırık · nöroaksiyel metastaz · enfeksiyon</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#7f1d1d">Tıkalı ya da delinmiş organ · tromboembolik acil</text><text x="320" y="110" text-anchor="middle" font-size="12" fill="#7f1d1d">Ağrı ve altta yatan durum BİRLİKTE tedavi edilir</text></g>
<g class="a m s2"><rect x="40" y="154" width="560" height="78" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Opioid naif mi, toleran mı?</text><text x="320" y="208" text-anchor="middle" font-size="12" fill="#334155">Toleran: ≥1 hafta ≥60 mg/gün oral morfin ya da eşdeğeri</text></g>
<g class="a m s3"><rect x="40" y="258" width="560" height="166" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Başlangıç (opioid naif)</text><text x="320" y="310" text-anchor="middle" font-size="12" fill="#1e3a8a">Hafif ağrı: nonopioid + adjuvan</text><text x="320" y="332" text-anchor="middle" font-size="12" fill="#1e3a8a">Orta–şiddetli: oral morfin 5–7,5 mg, 3–4 saatte bir, gerektikçe</text><text x="320" y="354" text-anchor="middle" font-size="12" fill="#1e3a8a">Acil rahatlama: IV morfin 2–5 mg</text><text x="320" y="376" text-anchor="middle" font-size="12" fill="#1e3a8a">Parenteral doz = oral dozun 1/3'ü</text><text x="320" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Hızlı salımlı, gerektikçe başla · sık titre et</text></g>
<g class="a m s4"><rect x="40" y="450" width="560" height="166" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="478" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">İdame, kurtarma, organ</text><text x="320" y="502" text-anchor="middle" font-size="12" fill="#78350f">Kurtarma: ASCO %5–20 · NCCN %10–20 · MASCC %10–15</text><text x="320" y="526" text-anchor="middle" font-size="12" fill="#78350f">Böbrek (ASCO): metadon; morfin, meperidin,</text><text x="320" y="546" text-anchor="middle" font-size="12" fill="#78350f">kodein, tramadoldan kaçın</text><text x="320" y="570" text-anchor="middle" font-size="12" fill="#78350f">Karaciğer: kodein ve meperidinden kaçın;</text><text x="320" y="590" text-anchor="middle" font-size="12" fill="#78350f">hastalık ilerledikçe doz aralığı uzayabilir</text></g>
<g class="a m s5"><rect x="40" y="642" width="560" height="190" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="670" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Dirençli ağrı</text><text x="320" y="696" text-anchor="middle" font-size="12" fill="#064e3b">Opioid rotasyonu · adjuvan analjezik</text><text x="320" y="718" text-anchor="middle" font-size="12" fill="#064e3b">Blok: üst karın çölyak · alt karın süperior hipogastrik</text><text x="320" y="738" text-anchor="middle" font-size="12" fill="#064e3b">· anorektal ganglion impar · göğüs duvarı interkostal</text><text x="320" y="760" text-anchor="middle" font-size="12" fill="#064e3b">Geniş alan: epidural / intratekal · litik lezyon: augmentasyon</text><text x="320" y="784" text-anchor="middle" font-size="12" fill="#064e3b">Fiziksel, bilişsel-davranışçı, manevi destek</text><text x="320" y="810" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Karmaşık olgu: multidisipliner palyatif konsey</text></g>
</svg>
