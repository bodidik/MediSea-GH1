<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kanser kaynaklı nöropatik ağrıda adjuvan seçimi</title>
<desc id="d">Nöropatik ağrı kanserin kendisinden, tedaviden (cerrahi, kemoterapi, radyoterapi) ya da eşlik eden hastalıktan kaynaklanabilir; öneriler çoğunlukla kanser dışı çalışmalardan türetilmiştir. Kemoterapi kaynaklı ağrılı periferik nöropatide ASCO yeterli kanıtı olan tek ajan olarak duloksetini önerir; Smith çalışmasında günde 60 mg duloksetin plaseboya üstündü, NNT 3,7. Tümör kaynaklı nöropatik ağrıda gabapentinoidler uluslararası derneklerce birinci basamak sayılır: gabapentin gece 300 mg başlanır, 2–3 günde bir 300 mg artırılır, en etkili doz günde üç kez 600 mg; pregabalin günde iki kez 75 mg başlanır, en çok günde iki kez 300 mg; ikisinde de böbrek işlevine göre doz azaltılır. Antidepresanlar: duloksetin 20–30 mg başlanır, haftada bir artırılır, olağan doz günde 60 mg, kreatinin klirensi 30'un altında kaçınılır; venlafaksin ER 37,5 mg başlanır, olağan doz 150–225 mg; amitriptilin gece 10–25 mg başlanır, olağan doz 50–100 mg, en çok 150 mg. Diğer: fokal ağrıda yüzde 5 lidokain bandı; sinir basısında ve ağrı krizinde 8–10 mg deksametazon test dozu; dirençli ağrıda ketamin ve metadon için uzman görüşü. Gabapentinoidi opioidle birlikte verirken solunum depresyonu riskine dikkat.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="860" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,106 L320,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,232 L320,256" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,424 L320,448" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,616 L320,640" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Nöropatik ağrının kaynağı</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Kanser · tedavi (cerrahi, kemoterapi, radyoterapi) · eşlik eden hastalık</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#334155">Öneriler çoğunlukla kanser dışı çalışmalardan</text></g>
<g class="a m s2"><rect x="40" y="132" width="560" height="100" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kemoterapi nöropatisi (ağrılı)</text><text x="320" y="184" text-anchor="middle" font-size="12" fill="#1e3a8a">ASCO: yeterli kanıtı olan tek ajan duloksetin</text><text x="320" y="206" text-anchor="middle" font-size="12" fill="#1e3a8a">Smith: 60 mg/gün plaseboya üstün · NNT 3,7</text></g>
<g class="a m s3"><rect x="40" y="258" width="560" height="166" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Gabapentinoid (birinci basamak)</text><text x="320" y="310" text-anchor="middle" font-size="12" fill="#064e3b">Gabapentin: gece 300 mg → 2–3 günde bir +300 mg</text><text x="320" y="330" text-anchor="middle" font-size="12" fill="#064e3b">en etkili 600 mg × 3 · en çok 1200 mg × 3</text><text x="320" y="354" text-anchor="middle" font-size="12" fill="#064e3b">Pregabalin: 75 mg × 2 → en çok 300 mg × 2</text><text x="320" y="374" text-anchor="middle" font-size="12" fill="#064e3b">güçsüz hastada 25–50 mg × 2</text><text x="320" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">İkisinde de böbrek işlevine göre azalt</text></g>
<g class="a m s4"><rect x="40" y="450" width="560" height="166" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="478" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Antidepresan</text><text x="320" y="502" text-anchor="middle" font-size="12" fill="#78350f">Duloksetin: 20–30 mg → haftada bir artır → 60 mg/gün</text><text x="320" y="522" text-anchor="middle" font-size="12" fill="#78350f">CrCl &lt;30 ve karaciğer hastalığında kaçın</text><text x="320" y="546" text-anchor="middle" font-size="12" fill="#78350f">Venlafaksin ER: 37,5 mg → olağan 150–225 mg</text><text x="320" y="570" text-anchor="middle" font-size="12" fill="#78350f">Amitriptilin: gece 10–25 mg → olağan 50–100, en çok 150</text><text x="320" y="592" text-anchor="middle" font-size="12" fill="#78350f">Kesmeden önce azaltarak bırak</text></g>
<g class="a m s5"><rect x="40" y="642" width="560" height="196" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="670" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Ek ve dirençli durumlar</text><text x="320" y="696" text-anchor="middle" font-size="12" fill="#7f1d1d">Fokal ağrı, yara izi: %5 lidokain bandı</text><text x="320" y="718" text-anchor="middle" font-size="12" fill="#7f1d1d">Nöropatik ağrı, ağrı krizi: 8–10 mg deksametazon test dozu</text><text x="320" y="740" text-anchor="middle" font-size="12" fill="#7f1d1d">Ketamin: kronik ağrıda kanıt yetersiz → uzman</text><text x="320" y="762" text-anchor="middle" font-size="12" fill="#7f1d1d">Metadon: NMDA + monoamin; ikinci basamak, EKG</text><text x="320" y="792" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Gabapentinoid + opioid: solunum depresyonu riski</text></g>
</svg>
