<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Mü-opioid reseptör sinyal kompleksi: akut yanıt</title>
  <desc id="d">Spinal arka boynuz sinapsı. Presinaptik uçta opioidin bağlandığı MOP, Gi/o proteinini aktive eder; Gi/o adenilat siklazı baskılar (cAMP azalır) ve voltaj kapılı N ve P/Q tipi kalsiyum kanallarını inhibe eder, böylece glutamat ve P maddesi salınımı azalır. Postsinaptik nöronda MOP–Gi/o, GIRK potasyum kanallarını açar; potasyum çıkışı hiperpolarizasyon yapar ve nöron daha zor uyarılır.</desc>
  <!--
    Animasyon: 12 sn'lik tek döngü, sıra = sinyalin sırası.
    Son kare = statik şemanın tamamı; hareket azaltma tercihinde animasyon
    hiç çalışmaz ve şekil o son kareyle durur.
  -->
  <style>
    .a { animation-duration: 12s; animation-iteration-count: 1; animation-timing-function: ease-in-out; animation-fill-mode: both; }
    .merkez { transform-box: fill-box; transform-origin: center; }
    .ciz { stroke-dasharray: 1; }

    /* 0–8 %: opioid sinaptik aralıktan gelip reseptöre bağlanır */
    .opPre  { animation-name: opPre; }
    .opPost { animation-name: opPost; }
    @keyframes opPre  { 0% { opacity: 0; transform: translateY(32px); } 8%, 100% { opacity: 1; transform: none; }  }
    @keyframes opPost { 0% { opacity: 0; transform: translateY(-30px); } 8%, 100% { opacity: 1; transform: none; }  }

    /* 8–16 %: MOP aktive olur (hale) */
    .hale { animation-name: hale; }
    @keyframes hale { 0%, 8% { opacity: 0; } 12% { opacity: .9; } 18%, 100% { opacity: .35; }  }


    .g1 { animation-name: g1; } .g1 .ciz { animation-name: c1; }
    @keyframes g1 { 0%, 12% { opacity: 0; } 13%, 100% { opacity: 1; }  }
    @keyframes c1 { 0%, 12% { stroke-dashoffset: 1; } 18%, 100% { stroke-dashoffset: 0; } }

    /* 18–26 %: Gi/o aktive olur */
    .gio { animation-name: gio; }
    @keyframes gio { 0%, 17% { opacity: .25; transform: scale(.85); } 22% { opacity: 1; transform: scale(1.12); } 27%, 100% { opacity: 1; transform: scale(1); }  }

    /* 26–36 %: AC inhibisyonu → cAMP ↓ */
    .g2 { animation-name: g2; } .g2 .ciz { animation-name: c2; }
    @keyframes g2 { 0%, 25% { opacity: 0; } 26%, 100% { opacity: 1; }  }
    @keyframes c2 { 0%, 26% { stroke-dashoffset: 1; } 33%, 100% { stroke-dashoffset: 0; } }
    .camp { animation-name: camp; }
    @keyframes camp { 0%, 32% { opacity: 0; transform: translateY(-8px); } 37%, 100% { opacity: 1; transform: none; }  }
    .ac { animation-name: ac; }
    @keyframes ac { 0%, 32% { opacity: 1; } 37%, 100% { opacity: .55; }  }

    /* 34–44 %: Ca²⁺ kanalı inhibisyonu */
    .g3 { animation-name: g3; } .g3 .ciz { animation-name: c3; }
    @keyframes g3 { 0%, 33% { opacity: 0; } 34%, 100% { opacity: 1; }  }
    @keyframes c3 { 0%, 34% { stroke-dashoffset: 1; } 42%, 100% { stroke-dashoffset: 0; } }

    /* 42–56 %: Ca²⁺ kanala yürür, giremez */
    .ca { animation-name: ca; }
    @keyframes ca { 0%, 42% { opacity: 0; transform: translateY(14px); } 45% { opacity: 1; transform: translateY(0); } 51% { transform: translateY(-58px); } 53% { transform: translateY(-50px); } 55%, 100% { opacity: 1; transform: translateY(-54px); }  }
    .engel { animation-name: engel; }
    @keyframes engel { 0%, 50% { opacity: 0; transform: scale(.3); } 54% { opacity: 1; transform: scale(1.25); } 57%, 100% { opacity: 1; transform: scale(1); }  }

    /* 56–64 %: vezikül füzyonu ve salınım azalır */
    .vez { animation-name: vez; }
    @keyframes vez { 0%, 55% { opacity: 1; } 62%, 100% { opacity: .35; }  }
    .sal { animation-name: sal; }
    @keyframes sal { 0%, 56% { opacity: 0; } 62%, 100% { opacity: 1; }  }

    /* 44–56 %: postsinaptik MOP → Gi/o → GIRK */
    .g4 { animation-name: g4; } .g4 .ciz { animation-name: c4; }
    @keyframes g4 { 0%, 43% { opacity: 0; } 44%, 100% { opacity: 1; }  }
    @keyframes c4 { 0%, 44% { stroke-dashoffset: 1; } 56%, 100% { stroke-dashoffset: 0; } }
    .kapiSol { animation-name: kapiSol; } .kapiSag { animation-name: kapiSag; }
    @keyframes kapiSol { 0%, 55% { transform: translateX(10px); } 60%, 100% { transform: none; }  }
    @keyframes kapiSag { 0%, 55% { transform: translateX(-10px); } 60%, 100% { transform: none; }  }

    /* 60–76 %: K⁺ hücreden çıkar */
    .k { animation-name: k; }
    @keyframes k { 0%, 59% { opacity: 0; transform: none; } 61% { opacity: 1; transform: none; } 74% { opacity: 1; transform: translateY(-165px); } 78% { opacity: 0; transform: translateY(-175px); } 100% { opacity: 0; } }
    .kyol { animation-name: kyol; }
    @keyframes kyol { 0%, 60% { opacity: 0; } 66%, 100% { opacity: 1; }  }

    /* 76–86 %: hiperpolarizasyon */
    .sonuc { animation-name: sonuc; }
    @keyframes sonuc { 0%, 75% { opacity: 0; transform: scale(.94); } 80% { opacity: 1; transform: scale(1.04); } 84%, 100% { opacity: 1; transform: scale(1); }  }
    .zarPost { animation-name: zarPost; }
    @keyframes zarPost { 0%, 76% { opacity: 0; } 82%, 100% { opacity: .5; }  }

    @media (prefers-reduced-motion: reduce) {
      .a { animation: none !important; }
      .hale, .zarPost { opacity: 0; }
    }
  </style>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="okGri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.5"/>
    </marker>
    <pattern id="lipit" width="10" height="30" patternUnits="userSpaceOnUse">
      <rect width="10" height="30" fill="#fef3c7"/>
      <circle cx="5" cy="4" r="3.2" fill="#f59e0b"/>
      <circle cx="5" cy="26" r="3.2" fill="#f59e0b"/>
      <path d="M4,7 L4,13 M6,7 L6,13 M4,17 L4,23 M6,17 L6,23" stroke="#d6a24a" stroke-width="0.9"/>
    </pattern>
    <radialGradient id="haleRenk">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="800" fill="#ffffff"/>

  <!-- ============ PRESİNAPTİK UÇ ============ -->
  <path d="M30,326 L30,70 Q30,30 70,30 L570,30 Q610,30 610,70 L610,326 Z" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="48" y="60" font-size="18" font-weight="800" fill="#0c4a6e">PRESİNAPTİK UÇ</text>
  <text x="48" y="81" font-size="13.5" fill="#0369a1">primer afferent lif · spinal arka boynuz</text>

  <!-- veziküller -->
  <g class="a vez">
    <circle cx="455" cy="105" r="21" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="505" cy="128" r="21" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="552" cy="100" r="21" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/>
    <g fill="#0284c7">
      <circle cx="449" cy="100" r="3"/><circle cx="460" cy="108" r="3"/><circle cx="452" cy="113" r="2.5"/>
      <circle cx="499" cy="123" r="3"/><circle cx="511" cy="131" r="3"/><circle cx="503" cy="136" r="2.5"/>
      <circle cx="546" cy="95" r="3"/><circle cx="557" cy="103" r="3"/><circle cx="549" cy="108" r="2.5"/>
    </g>
  </g>
  <text x="478" y="168" font-size="13" fill="#0c4a6e">glutamat · P maddesi</text>

  <!-- membran -->
  <rect x="30" y="296" width="580" height="30" fill="url(#lipit)"/>

  <!-- MOP (7 TM) -->
  <ellipse class="a hale" cx="129" cy="311" rx="58" ry="40" fill="url(#haleRenk)"/>
  <g fill="#2563eb">
    <rect x="96" y="290" width="7" height="42" rx="3.5"/><rect x="106" y="290" width="7" height="42" rx="3.5"/>
    <rect x="116" y="290" width="7" height="42" rx="3.5"/><rect x="126" y="290" width="7" height="42" rx="3.5"/>
    <rect x="136" y="290" width="7" height="42" rx="3.5"/><rect x="146" y="290" width="7" height="42" rx="3.5"/>
    <rect x="156" y="290" width="7" height="42" rx="3.5"/>
  </g>
  <text x="129" y="282" font-size="15" font-weight="800" text-anchor="middle" fill="#1e3a8a">MOP</text>
  <!-- opioid -->
  <g class="a opPre">
    <path d="M129,338 L140,349 L129,360 L118,349 Z" fill="#f97316" stroke="#c2410c"/>
  </g>
  <text x="148" y="356" font-size="13" font-weight="700" fill="#c2410c">opioid</text>

  <!-- Gi/o -->
  <g class="a g1">
    <path class="a ciz" pathLength="1" d="M110,258 L60,190" stroke="#15803d" stroke-width="2.2" fill="none" marker-end="url(#ok)"/>
  </g>
  <g class="a gio merkez">
    <ellipse cx="72" cy="168" rx="38" ry="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="72" y="174" font-size="16" font-weight="800" text-anchor="middle" fill="#14532d">G<tspan font-size="11" dy="4">i/o</tspan></text>
  </g>

  <!-- AC -->
  <g class="a ac">
    <rect x="236" y="286" width="56" height="50" rx="12" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="264" y="317" font-size="15" font-weight="800" text-anchor="middle" fill="#78350f">AC</text>
  </g>
  <g class="a g2">
    <path class="a ciz" pathLength="1" d="M104,176 Q200,200 252,280" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#tbar)"/>
  </g>
  <text x="264" y="236" font-size="13.5" text-anchor="middle" fill="#78350f">ATP → cAMP</text>
  <text class="a camp" x="264" y="258" font-size="16" font-weight="800" text-anchor="middle" fill="#dc2626">cAMP ↓</text>

  <!-- VGCC -->
  <rect x="440" y="284" width="20" height="54" rx="6" fill="#a78bfa" stroke="#6d28d9"/>
  <rect x="478" y="284" width="20" height="54" rx="6" fill="#a78bfa" stroke="#6d28d9"/>
  <g class="a g3">
    <path class="a ciz" pathLength="1" d="M104,160 Q300,150 462,272" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#tbar)"/>
  </g>
  <text x="510" y="258" font-size="13" fill="#4c1d95">N ve P/Q tipi</text>
  <text x="510" y="274" font-size="13" fill="#4c1d95">Ca²⁺ kanalı</text>
  <!-- Ca girişi engelli -->
  <path d="M469,360 L469,240" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#okK)"/>
  <g class="a ca">
    <circle cx="469" cy="372" r="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="469" y="376" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5b21b6">Ca</text>
  </g>
  <g class="a engel merkez">
    <path d="M455,214 L483,242 M483,214 L455,242" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- füzyon -->
  <path d="M462,200 L456,132" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#okGri)"/>
  <text x="575" y="214" font-size="12.5" text-anchor="middle" fill="#334155">vezikül</text>
  <text x="575" y="229" font-size="12.5" text-anchor="middle" fill="#334155">füzyonu ↓</text>

  <!-- ============ SİNAPTİK ARALIK ============ -->
  <text x="250" y="380" font-size="13" font-style="italic" text-anchor="middle" fill="#64748b">sinaptik aralık</text>
  <g fill="#0284c7" opacity="0.55">
    <circle cx="545" cy="358" r="3"/><circle cx="560" cy="380" r="3"/>
  </g>
  <text class="a sal" x="590" y="376" font-size="12.5" font-weight="700" text-anchor="middle" fill="#dc2626">salınım ↓</text>

  <!-- ============ POSTSİNAPTİK NÖRON ============ -->
  <path d="M30,410 L610,410 L610,690 Q610,730 570,730 L70,730 Q30,730 30,690 Z" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect class="a zarPost" x="30" y="440" width="580" height="250" fill="#bbf7d0"/>
  <rect x="30" y="410" width="580" height="30" fill="url(#lipit)"/>

  <!-- opioid + MOP -->
  <g class="a opPost">
    <path d="M129,370 L140,381 L129,392 L118,381 Z" fill="#f97316" stroke="#c2410c"/>
  </g>
  <ellipse class="a hale" cx="129" cy="425" rx="58" ry="40" fill="url(#haleRenk)"/>
  <g fill="#2563eb">
    <rect x="96" y="404" width="7" height="42" rx="3.5"/><rect x="106" y="404" width="7" height="42" rx="3.5"/>
    <rect x="116" y="404" width="7" height="42" rx="3.5"/><rect x="126" y="404" width="7" height="42" rx="3.5"/>
    <rect x="136" y="404" width="7" height="42" rx="3.5"/><rect x="146" y="404" width="7" height="42" rx="3.5"/>
    <rect x="156" y="404" width="7" height="42" rx="3.5"/>
  </g>
  <text x="129" y="466" font-size="15" font-weight="800" text-anchor="middle" fill="#1e3a8a">MOP</text>

  <!-- Gi/o -->
  <g class="a g1">
    <path class="a ciz" pathLength="1" d="M129,472 L129,500" stroke="#15803d" stroke-width="2.2" fill="none" marker-end="url(#ok)"/>
  </g>
  <g class="a gio merkez">
    <ellipse cx="129" cy="526" rx="38" ry="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="129" y="532" font-size="16" font-weight="800" text-anchor="middle" fill="#14532d">G<tspan font-size="11" dy="4">i/o</tspan></text>
  </g>

  <!-- GIRK: kapalıyken iki yarı birbirine yaslı, açılınca ayrılır -->
  <rect class="a kapiSol" x="330" y="398" width="20" height="54" rx="6" fill="#86efac" stroke="#15803d"/>
  <rect class="a kapiSag" x="372" y="398" width="20" height="54" rx="6" fill="#86efac" stroke="#15803d"/>
  <text x="361" y="476" font-size="15" font-weight="800" text-anchor="middle" fill="#14532d">GIRK</text>
  <text x="361" y="494" font-size="12.5" text-anchor="middle" fill="#166534">K⁺ kanalı açılır</text>
  <g class="a g4">
    <path class="a ciz" pathLength="1" d="M167,522 Q290,520 350,500" stroke="#15803d" stroke-width="2.2" fill="none" marker-end="url(#ok)"/>
  </g>
  <!-- K+ çıkışı -->
  <g class="a kyol">
    <path d="M361,533 L361,368" stroke="#15803d" stroke-width="2.4" fill="none" marker-end="url(#ok)"/>
    <text x="378" y="362" font-size="12.5" font-weight="700" fill="#15803d">K⁺ çıkışı</text>
  </g>
  <circle cx="361" cy="545" r="10" fill="#fff" stroke="#15803d"/>
  <text x="361" y="549.5" font-size="11" font-weight="800" text-anchor="middle" fill="#14532d">K⁺</text>
  <g class="a k">
    <circle cx="361" cy="545" r="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="361" y="549.5" font-size="11" font-weight="800" text-anchor="middle" fill="#14532d">K⁺</text>
  </g>

  <!-- sonuç -->
  <g class="a sonuc merkez">
    <rect x="226" y="580" width="352" height="80" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="402" y="606" font-size="14.5" font-weight="800" text-anchor="middle" fill="#14532d">Membran hiperpolarizasyonu</text>
    <text x="402" y="627" font-size="13" text-anchor="middle" fill="#166534">nöron daha zor uyarılır,</text>
    <text x="402" y="645" font-size="13" text-anchor="middle" fill="#166534">aksiyon potansiyeli iletimi azalır</text>
  </g>

  <text x="48" y="700" font-size="18" font-weight="800" fill="#14532d">POSTSİNAPTİK NÖRON</text>
  <text x="48" y="719" font-size="13.5" fill="#15803d">arka boynuzda ağrıyı ileten ikinci sıra nöron</text>

  <!-- ============ AÇIKLAMA ============ -->
  <g font-size="12.5" fill="#334155">
    <path d="M40,766 L72,766" stroke="#15803d" stroke-width="2.2" marker-end="url(#ok)"/>
    <text x="80" y="770">aktivasyon</text>
    <path d="M170,766 L200,766" stroke="#dc2626" stroke-width="2.2" marker-end="url(#tbar)"/>
    <text x="210" y="770">inhibisyon</text>
    <path d="M300,766 L340,766" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M308,756 L322,776 M322,756 L308,776" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="350" y="770">engellenen Ca²⁺ girişi</text>
    <text x="40" y="792" font-size="11.5" fill="#64748b">AC: adenilat siklaz · GIRK: G-proteiniyle açılan içe doğrultucu K⁺ kanalı · MOP: mü-opioid reseptörü</text>
  </g>
</svg>
