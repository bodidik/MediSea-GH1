<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Opioid rotasyonunda beş adım</title>
<desc id="d">Birinci adım, neden: doz artırmaya rağmen kontrolsüz ağrı ya da dayanılmaz yan etki. Ağrı kontrolde ama yan etki varsa yüzde 25–30 doz azaltma dönüşümsüz yetebilir; ağrı kontrolsüzse önce oral yoldan IV ya da SC yola geçmek uygun olabilir. İkinci adım: mevcut opioidin morfin eşdeğer günlük dozu hesaplanır, sonra bu dozdan yeni opioide geçilir. Dönüşüm oranı eşanaljezi değildir. Üçüncü adım, yeni opioid: böbrek yetmezliğinde buprenorfin, fentanil ya da metadon; karaciğer hastalığında hidromorfon ya da morfin; bağımlılık riskinde buprenorfin ya da metadon. Dördüncü adım, başlangıç dozu: UpToDate metadon ve fentanil dışında yüzde 25–50 otomatik doz azaltma penceresi kullanır; MASCC 2025 otomatik indirimde uzlaşamadı ve dozu kişiye göre ayarlar. Metadonu deneyimli hekim başlatır, günlük doz 30–40 mg'ı geçmez. Transdermal fentanilde üretici etiketi kullanılır. Beşinci adım, izlem: kurtarma dozu NCCN'e göre günlük dozun yüzde 10–20'si, MASCC'ye göre MEDD'nin yüzde 10–15'i. İlk 24–48 saat yakın izlem; kararlı durum 48 saatte, metadonda 5–6 günde; doz ayarı kararlı durumdan sonra, izlem 7–14 gün daha sürer.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="900" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,128 L320,152" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,252 L320,276" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,398 L320,422" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,608 L320,632" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="114" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">1 · Neden rotasyon?</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#7f1d1d">Doz artırmaya rağmen kontrolsüz ağrı · dayanılmaz yan etki</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#7f1d1d">Ağrı kontrolde, yan etki var → önce %25–30 doz azalt</text><text x="320" y="110" text-anchor="middle" font-size="12" fill="#7f1d1d">Ağrı kontrolsüz → önce oral → IV/SC yol denenebilir</text></g>
<g class="a m s2"><rect x="40" y="154" width="560" height="98" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">2 · İki adımlı hesap</text><text x="320" y="206" text-anchor="middle" font-size="12" fill="#334155">Mevcut opioid → morfin eşdeğer günlük doz (MEDD) → yeni opioid</text><text x="320" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Dönüşüm oranı ≠ eşanaljezi</text></g>
<g class="a m s3"><rect x="40" y="278" width="560" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="306" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">3 · Yeni opioidi seç</text><text x="320" y="330" text-anchor="middle" font-size="12" fill="#1e3a8a">Böbrek yetmezliği: buprenorfin · fentanil · metadon</text><text x="320" y="352" text-anchor="middle" font-size="12" fill="#1e3a8a">Karaciğer hastalığı: hidromorfon · morfin</text><text x="320" y="374" text-anchor="middle" font-size="12" fill="#1e3a8a">Bağımlılık riski: buprenorfin · metadon</text></g>
<g class="a m s4"><rect x="40" y="424" width="560" height="184" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="452" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · Başlangıç dozu</text><text x="320" y="476" text-anchor="middle" font-size="12" fill="#78350f">UpToDate: %25–50 otomatik azaltma penceresi</text><text x="320" y="496" text-anchor="middle" font-size="12" fill="#78350f">(metadon ve fentanil hariç)</text><text x="320" y="520" text-anchor="middle" font-size="12" fill="#78350f">MASCC 2025: otomatik indirimde uzlaşı yok → kişiye göre</text><text x="320" y="544" text-anchor="middle" font-size="12" fill="#78350f">Metadon: deneyimli hekim · günlük ≤30–40 mg</text><text x="320" y="566" text-anchor="middle" font-size="12" fill="#78350f">Transdermal fentanil: üretici etiketi</text><text x="320" y="590" text-anchor="middle" font-size="12" fill="#78350f">SC ↔ IV: 1:1</text></g>
<g class="a m s5"><rect x="40" y="634" width="560" height="200" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="662" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">5 · Kurtarma dozu ve izlem</text><text x="320" y="688" text-anchor="middle" font-size="12" fill="#064e3b">Kurtarma: günlük dozun %10–20'si (NCCN)</text><text x="320" y="708" text-anchor="middle" font-size="12" fill="#064e3b">· MEDD'nin %10–15'i (MASCC), sonra ayrı titre</text><text x="320" y="734" text-anchor="middle" font-size="12" fill="#064e3b">İlk 24–48 saat yakın izlem</text><text x="320" y="756" text-anchor="middle" font-size="12" fill="#064e3b">Kararlı durum: 48 saat · metadonda 5–6 gün</text><text x="320" y="778" text-anchor="middle" font-size="12" fill="#064e3b">Doz ayarı kararlı durumdan sonra; izlem 7–14 gün daha</text><text x="320" y="806" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Ağrı · işlev · yan etki · kurtarma dozu sayısı</text></g>
</svg>
