<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Palyatif bakım: tanıdan yas sürecine</title>
<desc id="d">Palyatif bakım ciddi hastalığın her evresinde, küratif ve yaşamı uzatan tedaviyle birlikte verilir; yalnız son günlere ait değildir. Tanıda ileri kanserde ilk 8 hafta içinde erken palyatif bakım önerilir; "bu hasta 12 ay içinde ölse şaşırır mıydım" sorusuna hayır yanıtı ek değerlendirme gerektirir. Birinci basamak palyatif bakımı hastayı tedavi eden her hekim verir: temel semptom yönetimi ve iletişim. Dirençli semptom, büyük aile çatışması ya da ölme isteği gibi karmaşık sorunlarda uzman palyatif bakım ekibi devreye girer. Hastalık ilerledikçe palyatif bakımın payı artar. ABD'de hospis, doğal seyrinde 6 ay ya da daha kısa ömür beklenen ve terminal hastalığının küratif tedavisinin sigorta kapsamından vazgeçen hastaya verilir; hasta istediği zaman ayrılıp yeniden girebilir. Son günlerde dirençli dayanılmaz acıda palyatif sedasyon, acıyla orantılı uygulanır ve ötanaziden ayrıdır: amacı yaşamı sonlandırmak değil, acıyı dindirmektir. Bakım ölümle bitmez, aileye yas desteği sürer.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M60,250 L580,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,506 L320,530" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,676 L320,700" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Ciddi hastalığın her evresinde</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Küratif ve yaşamı uzatan tedaviyle BİRLİKTE</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#334155">Yalnız son günlerin bakımı değil</text></g>
<g class="a m s2"><text x="60" y="140" font-size="12" font-weight="700" fill="#1e3a8a">Tanı</text><text x="580" y="140" text-anchor="end" font-size="12" font-weight="700" fill="#7f1d1d">Ölüm · yas</text><path d="M60,232 L580,232 L580,150 Z" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><path d="M60,150 L580,150 L60,232 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="150" y="176" font-size="12" font-weight="700" fill="#1e3a8a">Hastalığa yönelik tedavi</text><text x="470" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Palyatif bakım</text><text x="320" y="274" text-anchor="middle" font-size="11" fill="#334155">Hastalık ilerledikçe palyatif bakımın payı artar</text></g>
<g class="a m s3"><rect x="10" y="292" width="300" height="214" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="160" y="320" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Birinci basamak</text><text x="160" y="344" text-anchor="middle" font-size="12" fill="#064e3b">Hastayı tedavi eden her hekim</text><text x="160" y="366" text-anchor="middle" font-size="12" fill="#064e3b">(iç hastalıkları, aile hekimi,</text><text x="160" y="386" text-anchor="middle" font-size="12" fill="#064e3b">kardiyoloji, onkoloji)</text><text x="160" y="414" text-anchor="middle" font-size="12" fill="#064e3b">Temel semptom yönetimi</text><text x="160" y="434" text-anchor="middle" font-size="12" fill="#064e3b">İletişim · bakım hedefleri</text><text x="160" y="470" text-anchor="middle" font-size="11" fill="#064e3b">İleri kanserde ilk 8 hafta içinde</text><text x="160" y="488" text-anchor="middle" font-size="11" fill="#064e3b">erken palyatif bakım</text></g>
<g class="a m s3"><rect x="330" y="292" width="300" height="214" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="480" y="320" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Uzman palyatif ekip</text><text x="480" y="344" text-anchor="middle" font-size="12" fill="#4c1d95">Hekim, hemşire, sosyal hizmet,</text><text x="480" y="364" text-anchor="middle" font-size="12" fill="#4c1d95">manevi destek</text><text x="480" y="392" text-anchor="middle" font-size="12" fill="#4c1d95">Dirençli semptom</text><text x="480" y="412" text-anchor="middle" font-size="12" fill="#4c1d95">Büyük aile çatışması</text><text x="480" y="432" text-anchor="middle" font-size="12" fill="#4c1d95">Ölme isteği</text><text x="480" y="470" text-anchor="middle" font-size="11" fill="#4c1d95">"12 ay içinde ölse şaşırır mıydım?"</text><text x="480" y="488" text-anchor="middle" font-size="11" fill="#4c1d95">Hayır → ek değerlendirme</text></g>
<g class="a m s4"><rect x="40" y="532" width="560" height="144" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="560" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Hospis (ABD modeli)</text><text x="320" y="586" text-anchor="middle" font-size="12" fill="#78350f">Doğal seyrinde ≤6 ay beklenen ömür</text><text x="320" y="608" text-anchor="middle" font-size="12" fill="#78350f">Terminal hastalığın küratif tedavisinin sigorta</text><text x="320" y="628" text-anchor="middle" font-size="12" fill="#78350f">kapsamından vazgeçilir</text><text x="320" y="654" text-anchor="middle" font-size="12" fill="#78350f">Hasta istediği zaman ayrılıp yeniden girebilir</text></g>
<g class="a m s5"><rect x="40" y="702" width="560" height="104" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="730" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Son günler</text><text x="320" y="754" text-anchor="middle" font-size="12" fill="#7f1d1d">Dirençli acıda palyatif sedasyon: acıyla orantılı,</text><text x="320" y="774" text-anchor="middle" font-size="12" fill="#7f1d1d">amaç acıyı dindirmek, ötanazi değil</text><text x="320" y="796" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Ölümden sonra aileye yas desteği</text></g>
</svg>
