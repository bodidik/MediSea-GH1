<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Opioid alan hastada artan ağrı: tolerans mı, hiperaljezi mi?</title>
<desc id="d">Birinci adım, başlangıç: opioid alan hastada ağrı artıyor. İkinci adım, önce başka sebepleri ele: kanser ilerlemesi, yeni ağrı kaynağı, uyumsuzluk ve yanlış doz stratejisi, deliryum, toplam ağrı. Üçüncü adım, doz artışına yanıt: hastalık ilerlemeden opioid etkisi kayboluyor ama doz artışı yine yarıyorsa analjezik tolerans; doz artışından kısa süreli yarar, ardından kötüleşme varsa hiperaljezi. Dördüncü adım, hiperaljeziyi düşündüren tablo: agresif doz artışı sırasında kötüleşen ya da yaygınlaşan ağrı, ağrının niteliği değişir ya da birincil bölgenin dışına taşar, titreme ve belki konfüzyon, normalde ağrısız uyaranla ağrı yani allodini. Beşinci adım, ne yapılır: toleransta titrasyon ya da opioid rotasyonu; hiperaljezide doz azaltma ya da rotasyon, opioid dışı analjezik ve ilaç dışı yöntemler, dirençli ağrıda NMDA antagonisti eklenebilir; doz azaltırken geçici yoksunluk hiperaljezisi olabilir, uzun vadede ağrı çoğu kez azalır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,96 L320,118" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,250 L320,272" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,420 L320,442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,588 L320,610" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="82" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">1 · Opioid alan hastada ağrı artıyor</text><text x="320" y="72" text-anchor="middle" font-size="12" fill="#334155">Şiddet tek başına karar vermez: nitelik, yer, yayılım, yanıt sorulur</text></g>
<g class="a m s2"><rect x="40" y="120" width="560" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="148" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">2 · Önce başka sebepleri ele</text><text x="320" y="174" text-anchor="middle" font-size="12" fill="#1e3a8a">Kanser ilerlemesi · yeni ağrı kaynağı</text><text x="320" y="196" text-anchor="middle" font-size="12" fill="#1e3a8a">Uyumsuzluk · sürekli ağrıda yalnız "gerektiğinde" doz</text><text x="320" y="218" text-anchor="middle" font-size="12" fill="#1e3a8a">Deliryum · toplam ağrı (duygusal, sosyal, manevi)</text><text x="320" y="240" text-anchor="middle" font-size="11" fill="#1e3a8a">(MASCC 2025)</text></g>
<g class="a m s3"><rect x="40" y="274" width="560" height="146" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="302" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">3 · Doz artışına yanıt</text><text x="320" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Tolerans: hastalık ilerlemeden etki kaybı</text><text x="320" y="352" text-anchor="middle" font-size="12" fill="#4c1d95">doz artınca ağrı yine kontrol altına girer</text><text x="320" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">OIH: doz artışından kısa süreli yarar,</text><text x="320" y="404" text-anchor="middle" font-size="12" fill="#4c1d95">ardından kanser ilerlemeden ağrı kötüleşir</text></g>
<g class="a m s4"><rect x="40" y="444" width="560" height="144" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="320" y="472" text-anchor="middle" font-size="15" font-weight="800" fill="#881337">4 · OIH'yi düşündüren tablo</text><text x="320" y="498" text-anchor="middle" font-size="12" fill="#881337">Agresif doz artışı sırasında kötüleşen ya da yaygınlaşan ağrı</text><text x="320" y="520" text-anchor="middle" font-size="12" fill="#881337">Ağrının niteliği değişir · birincil bölgenin dışına taşar</text><text x="320" y="542" text-anchor="middle" font-size="12" fill="#881337">Titreme, belki konfüzyon · miyoklonus</text><text x="320" y="564" text-anchor="middle" font-size="12" fill="#881337">Allodini: normalde ağrısız uyaranla ağrı</text></g>
<g class="a m s5"><rect x="40" y="612" width="560" height="192" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="640" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">5 · Ne yapılır?</text><text x="320" y="666" text-anchor="middle" font-size="12" fill="#064e3b">Tolerans: titrasyon ya da opioid rotasyonu</text><text x="320" y="692" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">OIH: doz azaltma ya da rotasyon</text><text x="320" y="714" text-anchor="middle" font-size="12" fill="#064e3b">Opioid dışı analjezik · ilaç dışı yöntemler</text><text x="320" y="736" text-anchor="middle" font-size="12" fill="#064e3b">Dirençli ağrıda NMDA antagonisti (ketamin, metadon) eklenebilir</text><text x="320" y="764" text-anchor="middle" font-size="12" fill="#064e3b">Doz azaltırken geçici yoksunluk hiperaljezisi olabilir;</text><text x="320" y="786" text-anchor="middle" font-size="12" fill="#064e3b">uzun vadede ağrı çoğu kez azalır (Pisansky)</text></g>
</svg>
