<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Pankreas kanseri ağrısında çölyak bölgesi girişimleri</title>
<desc id="d">Ağrı epigastrik ya da alt torasik sırt yerleşimli, yatarken artan, oturunca azalan künt ya da delici bir ağrıdır; visseral, somatik ve çölyak pleksus invazyonuna bağlı nöropatik bileşen taşıyabilir. Ameliyat edilemeyen pankreas kanserinde opioid gereken ya da opioid istemeyen hastada nörolitik blok endikedir. Erken sevk, opioid başarısızlığını beklemeye göre daha iyi ağrı kontrolü ve daha az opioid tüketimiyle ilişkilidir. EUS kılavuzlu çölyak pleksus nörolizi hastaların yüzde 50–80'inde yaklaşık 2–3 ay rahatlama sağlar. Yanıt yoksa süperior mezenterik arter düzeyine geniş pleksus nörolizi yapılabilir. Çölyak ganglion nörolizinde veriler karışıktır; bir çalışmada sağkalım daha kısaydı. Splanknik sinirler T5–T12'den çıkar ve çölyak pleksusa katılır; üst karın visseral ağrısında çölyak bloğuna ek olarak ya da onun yerine hedeflenebilir. Yan etkiler: nörolizde genel komplikasyon yüzde 21; geçici ishal yüzde 7, geçici hipotansiyon yüzde 4; büyük olaylar yüzde 1'in altında; nadiren parapleji.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,128 L320,152" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,252 L320,276" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,398 L320,422" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,566 L320,590" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="114" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Ağrının yüzü</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Epigastrium ve/veya alt torasik sırt · künt, delici</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#334155">Yatarken artar, oturunca azalır</text><text x="320" y="110" text-anchor="middle" font-size="12" fill="#334155">Visseral + somatik + nöropatik (çölyak pleksus invazyonu)</text></g>
<g class="a m s2"><rect x="40" y="154" width="560" height="98" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kime nörolitik blok?</text><text x="320" y="206" text-anchor="middle" font-size="12" fill="#1e3a8a">Ameliyat edilemeyen kanser + opioid gerekiyor ya da istemiyor</text><text x="320" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Erken sevk: daha iyi ağrı kontrolü, daha az opioid</text></g>
<g class="a m s3"><rect x="40" y="278" width="560" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="306" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">EUS kılavuzlu çölyak pleksus nörolizi</text><text x="320" y="330" text-anchor="middle" font-size="12" fill="#064e3b">Hastaların %50–80'inde yaklaşık 2–3 ay rahatlama</text><text x="320" y="352" text-anchor="middle" font-size="12" fill="#064e3b">Alkol + lokal anestezik (UpToDate: 20 mL alkol + 4 mL %0,25 bupivakain)</text><text x="320" y="374" text-anchor="middle" font-size="12" fill="#064e3b">Çoğu hasta ilaç tedavisine de devam eder</text></g>
<g class="a m s4"><rect x="40" y="424" width="560" height="142" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="452" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Yanıt yoksa ya da anatomi uygun değilse</text><text x="320" y="476" text-anchor="middle" font-size="12" fill="#78350f">Geniş pleksus nörolizi: SMA düzeyinde (4. haftada %68 iyi yanıt)</text><text x="320" y="498" text-anchor="middle" font-size="12" fill="#78350f">Çölyak ganglion nörolizi: veri karışık, bir RKÇ'de sağkalım kısa</text><text x="320" y="520" text-anchor="middle" font-size="12" fill="#78350f">Splanknik sinirler (T5–T12): çölyak bloğuna ek ya da yerine</text><text x="320" y="544" text-anchor="middle" font-size="12" fill="#78350f">Dirençli ağrı: intratekal yol (NCCN)</text></g>
<g class="a m s5"><rect x="40" y="592" width="560" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="620" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Yan etkiler</text><text x="320" y="646" text-anchor="middle" font-size="12" fill="#7f1d1d">Nörolizde genel komplikasyon %21 (blokta %7)</text><text x="320" y="668" text-anchor="middle" font-size="12" fill="#7f1d1d">Geçici ishal %7 · geçici hipotansiyon %4 → IV sıvı</text><text x="320" y="690" text-anchor="middle" font-size="12" fill="#7f1d1d">İşlem sonrası ağrı artışı (genellikle &lt;48 saat)</text><text x="320" y="712" text-anchor="middle" font-size="12" fill="#7f1d1d">Büyük olay &lt;%1: enfeksiyon, kanama, iskemi</text><text x="320" y="734" text-anchor="middle" font-size="12" fill="#7f1d1d">Parapleji: çok nadir, iki taraflı enjeksiyonda</text><text x="320" y="764" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Cochrane 2024: kanıt kesinliği çok düşük</text></g>
</svg>
