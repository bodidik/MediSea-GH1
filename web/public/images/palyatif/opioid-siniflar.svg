<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Opioidler: mu reseptörüne göre sınıflar ve yan etki yönetimi</title>
<desc id="d">Opioidler en iyi tanınan mu, kappa ve delta reseptörlerine bağlanır. Mu reseptörüne etkilerine göre üç grup: saf mu agonistleri (morfin, hidromorfon, oksikodon, fentanil, metadon); agonist-antagonistler, iki alt tip: kısmi agonist buprenorfin (çok yüksek afinite, görece düşük içsel etkinlik; analjezi tavanının klinik önemi belirsiz; fiziksel bağımlı hastada yoksunluk başlatabilir; böbrek yetmezliğinde ve solunum depresyonu kaygısında yararlı olabilir) ve karışık agonist-antagonistler (butorfanol, dezosin, pentazosin, nalbufin; kanser ağrısında önerilmez); saf mu antagonistleri (nalokson). Karma mekanizmalılar tramadol ve tapentadol mu bağlanması ile serotonin ve noradrenalin geri alım blokajı yapar. Metadonun d-izomeri NMDA inhibitörüdür. Yan etkiler: kabızlık kanser hastasında yüzde 60–90'a kadar, dirençli olguda periferik etkili mu antagonisti tercih edilir; solunum depresyonu küçük adımlarla (yüzde 25–50) ve kararlı durum beklenerek titre edilirse nadirdir, toleransı hızlı gelişir; miyoklonus opioide bağlı nörotoksisitenin parçası olabilir; opioide bağlı hiperaljezinin klinik önemi tartışmalıdır. İlaç etkileşimi: oksikodon ve fentanil CYP3A4 ile yıkılır; indükleyiciler (rifampin, fosfenitoin, enzalutamid) düzeyi düşürür, inhibitörler (vorikonazol, eritromisin, siprofloksasin) artırır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a m s1"><rect x="40" y="14" width="560" height="64" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="40" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Mu reseptörüne göre opioid sınıfları</text><text x="320" y="62" text-anchor="middle" font-size="12" fill="#334155">En iyi tanınan reseptörler: mu, kappa, delta</text></g>
<g class="a m s2"><rect x="10" y="94" width="300" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="160" y="122" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Saf mu agonistleri</text><text x="160" y="148" text-anchor="middle" font-size="12" fill="#1e3a8a">Morfin · hidromorfon · oksikodon</text><text x="160" y="168" text-anchor="middle" font-size="12" fill="#1e3a8a">fentanil · metadon</text><text x="160" y="196" text-anchor="middle" font-size="11" fill="#1e3a8a">Metadonun d-izomeri NMDA inhibitörü</text></g>
<g class="a m s2"><rect x="330" y="94" width="300" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="480" y="122" text-anchor="middle" font-size="14" font-weight="800" fill="#064e3b">Karma mekanizma</text><text x="480" y="148" text-anchor="middle" font-size="12" fill="#064e3b">Tramadol · tapentadol</text><text x="480" y="170" text-anchor="middle" font-size="12" fill="#064e3b">Mu bağlanması + serotonin ve</text><text x="480" y="190" text-anchor="middle" font-size="12" fill="#064e3b">noradrenalin geri alım blokajı</text></g>
<g class="a m s3"><rect x="10" y="240" width="300" height="190" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="160" y="268" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">Kısmi agonist: buprenorfin</text><text x="160" y="294" text-anchor="middle" font-size="12" fill="#78350f">Çok yüksek afinite, düşük içsel etki</text><text x="160" y="316" text-anchor="middle" font-size="12" fill="#78350f">Analjezi tavanının önemi belirsiz</text><text x="160" y="338" text-anchor="middle" font-size="12" fill="#78350f">Bağımlı hastada yoksunluk başlatır</text><text x="160" y="366" text-anchor="middle" font-size="12" fill="#78350f">Böbrek yetmezliğinde ve solunum</text><text x="160" y="386" text-anchor="middle" font-size="12" fill="#78350f">depresyonu kaygısında yararlı</text><text x="160" y="410" text-anchor="middle" font-size="11" fill="#78350f">Yeni başlayan, opioidsiz hastada</text></g>
<g class="a m s3"><rect x="330" y="240" width="300" height="190" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="480" y="268" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Karışık agonist-antagonist</text><text x="480" y="294" text-anchor="middle" font-size="12" fill="#7f1d1d">Butorfanol · dezosin</text><text x="480" y="314" text-anchor="middle" font-size="12" fill="#7f1d1d">pentazosin · nalbufin</text><text x="480" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Kanser ağrısında önerilmez</text><text x="480" y="378" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Saf antagonist</text><text x="480" y="402" text-anchor="middle" font-size="12" fill="#7f1d1d">Nalokson — içsel etki yok</text></g>
<g class="a m s4"><rect x="40" y="446" width="560" height="170" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="474" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Yan etkiler</text><text x="320" y="500" text-anchor="middle" font-size="12" fill="#4c1d95">Kabızlık: kanser hastasında %60–90'a kadar; dirençlide PAMORA</text><text x="320" y="524" text-anchor="middle" font-size="12" fill="#4c1d95">Solunum depresyonu: %25–50 adımlar + kararlı durum beklenirse</text><text x="320" y="544" text-anchor="middle" font-size="12" fill="#4c1d95">nadir; toleransı hızlı gelişir</text><text x="320" y="568" text-anchor="middle" font-size="12" fill="#4c1d95">Miyoklonus: opioid nörotoksisitesinin parçası olabilir</text><text x="320" y="592" text-anchor="middle" font-size="12" fill="#4c1d95">Opioide bağlı hiperaljezi: klinik önemi tartışmalı</text></g>
<g class="a m s5"><rect x="40" y="632" width="560" height="114" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="320" y="660" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">İlaç etkileşimi: CYP3A4</text><text x="320" y="686" text-anchor="middle" font-size="12" fill="#0c4a6e">Oksikodon ve fentanil CYP3A4 ile yıkılır</text><text x="320" y="708" text-anchor="middle" font-size="12" fill="#0c4a6e">İndükleyici (rifampin, fosfenitoin, enzalutamid) → düzey düşer</text><text x="320" y="730" text-anchor="middle" font-size="12" fill="#0c4a6e">İnhibitör (vorikonazol, eritromisin, siprofloksasin) → düzey artar</text></g>
</svg>
