<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ön hipofiz hücre soyları ve sap etkisi</title>
<desc id="d">Rathke kesesinde PROP1, PIT1 (POU1F1) soyunu ve gonadotrop soyu başlatır; PIT1 somatotrop (GH), laktotrop (PRL) ve tirotrop (TSH) hücreleri belirler; SF1 gonadotrop (LH, FSH); TPIT (TBX19) kortikotrop (ACTH). PIT1 eksikliğinde GH, PRL, TSH kaybı; PROP1 eksikliğinde bunlara LH ve FSH eklenir, ACTH zamanla kaybolabilir. Altta: hipotalamus uyarıcı hormonlarla beş ekseni sürer, prolaktini dopaminle baskılar; sap basısında diğer eksenler düşerken prolaktin genellikle 25–150 ng/mL arasında yükselir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="760" fill="#ffffff"/>
<text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Ön hipofiz hücre soyları</text>

<g class="a s1"><rect x="230" y="48" width="180" height="46" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="320" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Rathke kesesi</text><text x="320" y="85" text-anchor="middle" font-size="11" fill="#3730a3">HESX1 · LHX3 · LHX4</text></g>

<g class="a s2"><path class="a ciz" pathLength="1" d="M290,94 L170,138" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M350,94 L490,138" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/>
<rect x="60" y="140" width="230" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="175" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">PROP1</text><text x="175" y="176" text-anchor="middle" font-size="11" fill="#075985">PIT1 soyu + gonadotrop soyu</text>
<rect x="390" y="140" width="200" height="44" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="490" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">TPIT (TBX19)</text><text x="490" y="176" text-anchor="middle" font-size="11" fill="#92400e">kortikotrop soyu</text></g>

<g class="a s3"><path class="a ciz" pathLength="1" d="M130,184 L100,226" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M220,184 L260,226" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M490,184 L490,226" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/>
<rect x="20" y="228" width="170" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="105" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">PIT1 (POU1F1)</text><text x="105" y="264" text-anchor="middle" font-size="11" fill="#075985">GH · PRL · TSH</text>
<rect x="200" y="228" width="140" height="44" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="270" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">SF1</text><text x="270" y="264" text-anchor="middle" font-size="11" fill="#166534">LH · FSH</text>
<rect x="420" y="228" width="140" height="44" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="490" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Kortikotrop</text><text x="490" y="264" text-anchor="middle" font-size="11" fill="#92400e">ACTH (POMC)</text></g>

<g class="a s4"><rect x="20" y="296" width="600" height="96" rx="10" fill="#fff1f2" stroke="#e11d48"/>
<text x="36" y="318" font-size="13" font-weight="800" fill="#881337">Gen kusuru → kayıp eksenler</text>
<text x="36" y="340" font-size="12" fill="#9f1239">PIT1 (POU1F1): GH · PRL · TSH; gonadotrop ve kortikotrop korunur</text>
<text x="36" y="360" font-size="12" fill="#9f1239">PROP1: GH · PRL · TSH + LH · FSH; ACTH ± (ileri yaşta kaybolabilir)</text>
<text x="36" y="380" font-size="12" fill="#9f1239">TPIT: izole ACTH eksikliği</text></g>

<text x="320" y="430" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Sap etkisi</text>
<g class="a s5"><rect x="230" y="446" width="180" height="40" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="320" y="471" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Hipotalamus</text>
<path class="a ciz" pathLength="1" d="M280,486 L180,560" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ok)"/><text x="150" y="520" font-size="11" fill="#166534">TRH · CRH · GHRH · GnRH</text><text x="150" y="534" font-size="11" fill="#166534">(uyarır)</text>
<path class="a ciz" pathLength="1" d="M360,486 L460,560" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#ok)"/><text x="420" y="520" font-size="11" fill="#9f1239">Dopamin</text><text x="420" y="534" font-size="11" fill="#9f1239">(PRL'yi baskılar)</text>
<rect x="60" y="562" width="240" height="44" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="180" y="589" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">ACTH · TSH · GH · LH · FSH</text>
<rect x="380" y="562" width="180" height="44" rx="10" fill="#ffe4e6" stroke="#e11d48"/><text x="470" y="589" text-anchor="middle" font-size="12" font-weight="700" fill="#881337">Prolaktin</text>
<rect x="20" y="628" width="600" height="108" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="36" y="652" font-size="13" font-weight="800" fill="#0f172a">Sap basısı / kesisi (makroadenom, travma, cerrahi)</text>
<text x="36" y="676" font-size="12" fill="#334155">Uyarıcı akış kesilir → diğer eksenler DÜŞER (hipopitüitarizm)</text>
<text x="36" y="698" font-size="12" fill="#334155">Dopamin baskısı kalkar → PRL YÜKSELİR: genellikle 25–150 ng/mL, nadiren &gt;150</text>
<text x="36" y="720" font-size="12" fill="#334155">(TEMD 2022). &gt;250 ng/mL genellikle prolaktinomadır.</text></g>
</svg>
