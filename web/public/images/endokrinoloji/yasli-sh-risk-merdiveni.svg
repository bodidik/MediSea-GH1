<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Subklinik hipertiroidide TSH düzeyine göre atriyal fibrilasyon, kalp yetmezliği ve kırık riski</title>
<desc id="d">60 yaş üstü 2007 kişide (Sawin 1994) TSH 0,1 ve altında 10 yıllık atriyal fibrilasyon riski 3,1 kat arttı; TSH 0,1–0,4 arasında artış anlamlı değildi. Kalp yetmezliği olaylarında (Gencer 2012, 25.390 kişi) tehlike oranı TSH 0,10–0,44'te 1,31 (anlamsız), TSH 0,10'un altında 1,94'tü. Kırıkta (Blum 2015, 70.298 kişi) tüm subklinik hipertiroidide kalça kırığı 1,36, TSH 0,10'un altında 1,61; omurga kırığı tüm grupta 1,51 (anlamsız), TSH 0,10'un altında 3,57'ydi ancak bu son tahmin yalnız 8 olaya dayanıyordu. Mutlak risk yaşla belirgin artar: atriyal fibrilasyon sıklığı 65 yaş altı kadında 1000 kişi-yılda 2,3, 65 yaş ve üstünde 22,7'dir.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.r0{animation-name:r0}@keyframes r0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.r0 .ciz{animation-name:r0c}@keyframes r0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.r1{animation-name:r1}@keyframes r1{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.r1 .ciz{animation-name:r1c}@keyframes r1c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.r2{animation-name:r2}@keyframes r2{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.r2 .ciz{animation-name:r2c}@keyframes r2c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.r3{animation-name:r3}@keyframes r3{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.r3 .ciz{animation-name:r3c}@keyframes r3c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.r4{animation-name:r4}@keyframes r4{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.r4 .ciz{animation-name:r4c}@keyframes r4c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.r5{animation-name:r5}@keyframes r5{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.r5 .ciz{animation-name:r5c}@keyframes r5c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
.cb{transform-box:fill-box;transform-origin:left center}@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="640" height="590" fill="#ffffff"/>
<g class="a r0"><text x="320" y="26" font-size="15" font-weight="800" text-anchor="middle" fill="#0f172a">Subklinik hipertiroidide risk: TSH ne kadar düşükse</text><text x="320" y="46" font-size="11" font-weight="500" text-anchor="middle" fill="#475569">(ötiroide göre göreli risk; çubuğun boyu = kat)</text><line x1="300" y1="58" x2="300" y2="470" stroke="#0f172a" stroke-dasharray="4 4"/><text x="300" y="486" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0f172a">1,0 = ötiroid</text></g>
<g class="a r1"><text x="203" y="100" font-size="12" font-weight="800" text-anchor="end" fill="#0f172a">AF</text><text x="203" y="116" font-size="10.5" font-weight="500" text-anchor="end" fill="#475569">(Sawin 1994, ≥60 yaş)</text><rect class="cb" x="215" y="70" width="85" height="28" rx="5" fill="#cbd5e1" stroke="#64748b" stroke-dasharray="4 3"/><text x="223" y="89" font-size="11" font-weight="800" fill="#334155">TSH 0,1–0,4</text><text x="308" y="89" font-size="11.5" font-weight="800" fill="#475569">anlamsız</text><rect class="cb" x="215" y="110" width="263.5" height="28" rx="5" fill="#dc2626"/><text x="223" y="129" font-size="11" font-weight="800" fill="#ffffff">TSH ≤0,1</text><text x="486.5" y="129" font-size="11.5" font-weight="800" fill="#0f172a">RR 3,1</text></g>
<g class="a r2"><text x="203" y="200" font-size="12" font-weight="800" text-anchor="end" fill="#0f172a">Kalp yetmezliği</text><text x="203" y="216" font-size="10.5" font-weight="500" text-anchor="end" fill="#475569">(Gencer 2012)</text><rect class="cb" x="215" y="170" width="111.35000000000001" height="28" rx="5" fill="#cbd5e1" stroke="#64748b" stroke-dasharray="4 3"/><text x="223" y="189" font-size="11" font-weight="800" fill="#334155">TSH 0,10–0,44</text><text x="334.35" y="189" font-size="11.5" font-weight="800" fill="#475569">HR 1,31 · anlamsız</text><rect class="cb" x="215" y="210" width="164.9" height="28" rx="5" fill="#dc2626"/><text x="223" y="229" font-size="11" font-weight="800" fill="#ffffff">TSH &lt;0,10</text><text x="387.9" y="229" font-size="11.5" font-weight="800" fill="#0f172a">HR 1,94</text></g>
<g class="a r3"><text x="203" y="300" font-size="12" font-weight="800" text-anchor="end" fill="#0f172a">Kalça kırığı</text><text x="203" y="316" font-size="10.5" font-weight="500" text-anchor="end" fill="#475569">(Blum 2015)</text><rect class="cb" x="215" y="270" width="115.60000000000001" height="28" rx="5" fill="#f97316"/><text x="223" y="289" font-size="11" font-weight="800" fill="#ffffff">TSH tüm SH</text><text x="338.6" y="289" font-size="11.5" font-weight="800" fill="#0f172a">HR 1,36</text><rect class="cb" x="215" y="310" width="136.85" height="28" rx="5" fill="#dc2626"/><text x="223" y="329" font-size="11" font-weight="800" fill="#ffffff">TSH &lt;0,10</text><text x="359.85" y="329" font-size="11.5" font-weight="800" fill="#0f172a">HR 1,61</text></g>
<g class="a r4"><text x="203" y="400" font-size="12" font-weight="800" text-anchor="end" fill="#0f172a">Omurga kırığı</text><text x="203" y="416" font-size="10.5" font-weight="500" text-anchor="end" fill="#475569">(Blum 2015)</text><rect class="cb" x="215" y="370" width="128.35" height="28" rx="5" fill="#cbd5e1" stroke="#64748b" stroke-dasharray="4 3"/><text x="223" y="389" font-size="11" font-weight="800" fill="#334155">TSH tüm SH</text><text x="351.35" y="389" font-size="11.5" font-weight="800" fill="#475569">HR 1,51 · anlamsız</text><rect class="cb" x="215" y="410" width="303.45" height="28" rx="5" fill="#dc2626"/><text x="223" y="429" font-size="11" font-weight="800" fill="#ffffff">TSH &lt;0,10</text><text x="526.45" y="429" font-size="11.5" font-weight="800" fill="#0f172a">HR 3,57 · 8 olay</text></g>
<g class="a r5"><text x="320" y="520" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Gri kesikli çubuk = istatistiksel olarak anlamlı değil. Risk TSH &lt;0,1'de belirginleşiyor.</text><text x="320" y="544" font-size="10.5" font-weight="600" text-anchor="middle" fill="#334155">Mutlak risk yaşla artar: AF, 65 yaş altı kadında 1000 kişi-yılda 2,3, 65 ve üstünde 22,7 (Selmer 2012, ATA aktarımı)</text><text x="320" y="572" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: Sawin 1994 (NEJM), Gencer 2012 (Circulation), Blum 2015 (JAMA), Selmer 2012 (BMJ)</text></g>
</svg>
