<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipertiroidide atriyal fibrilasyon: zemin, sıklık, kalp yetmezliği ve ötiroidi sonrası seyir</title>
<desc id="d">Hipertiroidide atriyal erken vurular ve kısa süreli supraventriküler taşikardiler artar, kalp hızı değişkenliği parasempatik tonus azaldığı için düşer; bu tetik ve zemin atriyal fibrilasyonu kolaylaştırır. Danimarka kaydında 40.628 hastanın yüzde 8,3'ünde tanının ±30 gününde atriyal fibrilasyon ya da flatter saptandı; risk erkekte (OR 1,8), her 10 yaşta (OR 1,7), kalp yetmezliğinde (OR 3,9) ve kapak hastalığında (OR 2,6) arttı. Kalp yetmezliğiyle başvuru yüzde 5,8'dir ve en güçlü öngördürücüsü atriyal fibrilasyondur (OR 37,4); bu hastaların yüzde 47'sinde sol ventrikül ejeksiyon fraksiyonu yüzde 50'nin altındadır ve sistolik disfonksiyonluların üçte birinde kardiyomiyopati kalıcı olabilir. Ötiroidiye ulaşıldıktan sonra 3–6 ayda AF'lerin yüzde 55–75'i sinüse döner; dönmeyenlerde ötiroid dönemde kardiyoversiyon yüzde 88 başarılıdır ve yüzde 86'sı izlemde sinüste kalır.</desc>
