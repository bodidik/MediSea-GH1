<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Plasentayı ne geçer: TRAb, antitiroid ilaç ve levotiroksin, fetüse etkileri (TEMD 2025)</title>
<desc id="d">TEMD 2025'e göre TRAb, antitiroid ilaçlar ve maternal tiroid hormonunun çoğu plasentayı etkin biçimde geçer; anneye verilen levotiroksin ise geçmez. Fetal tiroid işlev kazanınca TRAb'ye yanıt verir; TRAb'ye bağlı fetal hipertiroidi tipik olarak 18–20. haftada ya da sonra gelişir. MMI, PTU ve karbimazol fetüste anneye göre daha güçlü etki gösterir; anne ötiroid yapıldığında fetüs genellikle aşırı tedavi edilir, bu yüzden maternal sT4 üst sınırda ya da hemen üzerinde tutulur. Aşırı tedavi fetal guatr ve hipotiroidiye, yetersiz tedavi yenidoğanda geçici santral hipotiroidiye yol açar. Blok-replasman tedavisi ikinci yarıda genellikle fetal guatr ve hipotiroidi yapar; tek endikasyonu, daha önce Graves için ablatif tedavi almış annede TRAb'ye bağlı izole fetal hipertiroididir: ATD fetüsü tedavi eder, levotiroksin anneyi ötiroid tutar. Tiroidektomi sonrası TRAb kademeli olarak kaybolur; ameliyat öncesi yüksek TRAb izole fetal hipertiroidi riskini gösterir ve ATD kesildikten sonra dikkatli fetal izlem gerekir. Toksik adenom ya da toksik multinodüler guatrda TRAb yoktur; ATD fetüsün tiroidini baskılar, fetal hipotiroidi ve guatr riski ciddi artar, düşük doz kullanılır ve annenin sT4'ü üst sınırda ya da biraz üzerinde tutulur.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.p1{animation-name:p1}@keyframes p1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.p1 .ciz{animation-name:p1c}@keyframes p1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.p2{animation-name:p2}@keyframes p2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.p2 .ciz{animation-name:p2c}@keyframes p2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.p3{animation-name:p3}@keyframes p3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.p3 .ciz{animation-name:p3c}@keyframes p3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.p4{animation-name:p4}@keyframes p4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.p4 .ciz{animation-name:p4c}@keyframes p4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.p5{animation-name:p5}@keyframes p5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.p5 .ciz{animation-name:p5c}@keyframes p5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.p6{animation-name:p6}@keyframes p6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.p6 .ciz{animation-name:p6c}@keyframes p6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.p7{animation-name:p7}@keyframes p7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.p7 .ciz{animation-name:p7c}@keyframes p7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
