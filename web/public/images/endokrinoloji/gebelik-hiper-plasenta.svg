<g class="a p4"><rect x="10" y="262" width="300" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="290.5" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Fetal hipertiroidi</text><text x="160" y="311.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">TRAb kaynaklı</text><text x="160" y="329.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">18–20. hafta ve sonrası</text><text x="160" y="347.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">ablasyon sonrası annede de sürer</text><rect x="330" y="262" width="300" height="104" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="480" y="290.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Fetal guatr / hipotiroidi</text><text x="480" y="311.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">anne ötiroid yapılınca</text><text x="480" y="329.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">fetüs aşırı tedavi edilir</text><text x="480" y="347.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">→ sT4 üst sınırda tutulur</text></g>
<g class="a p5"><rect x="10" y="380" width="620" height="92" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="404.25" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Blok-replasman (ATD + LT4)</text><text x="320" y="424.25" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">2. yarıda genellikle fetal guatr ve hipotiroidi: ATD geçer, LT4 geçmez</text><text x="320" y="441.25" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">TEK endikasyon: ablatif tedavi almış annede TRAb'ye bağlı İZOLE fetal hipertiroidi</text><text x="320" y="458.25" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ATD fetüsü tedavi eder, LT4 anneyi ötiroid tutar</text></g>
