<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hiperkalsemide PHPT tanısı ve FHH ayrımı</title>
<desc id="d">Hiperkalsemi saptanınca PTH ölçülür. PTH açıkça yüksekse PHPT tanısı konur; sınırda yüksek ya da hiperkalsemiye göre uygunsuz normalse PHPT yine en olası tanıdır ama FHH ayrılmalıdır. Tüm hastalarda 24 saatlik idrar kalsiyumu ve 25-hidroksivitamin D ölçülür. Kalsiyum/kreatinin klirens oranı FHH hastalarının yaklaşık yüzde 80'inde 0,01'in altındadır; PHPT'de çoğunlukla 0,02'nin üstündedir ama PHPT hastalarının yaklaşık yüzde 20'sinde de 0,01'in altında olabilir. 0,01–0,02 arasında CASR, AP2S1 ve gerekirse GNA11 genetik testi yapılır. Lokalizasyon görüntülemesi tanı ya da cerrahi kararı için kullanılmaz; cerrahi kararından sonra yapılır.</desc>
<!-- 13 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.a{animation-name:a}@keyframes a{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.a .ciz{animation-name:ac}@keyframes ac{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.b{animation-name:b}@keyframes b{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.b .ciz{animation-name:bc}@keyframes bc{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.c1{animation-name:c1}@keyframes c1{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.c1 .ciz{animation-name:c1c}@keyframes c1c{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.c2{animation-name:c2}@keyframes c2{0%,28%{opacity:0;transform:translateY(7px)}31%,100%{opacity:1;transform:none}}
.c2 .ciz{animation-name:c2c}@keyframes c2c{0%,28%{stroke-dashoffset:1}32%,100%{stroke-dashoffset:0}}
.d{animation-name:d}@keyframes d{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.d .ciz{animation-name:dc}@keyframes dc{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.e{animation-name:e}@keyframes e{0%,52%{opacity:0;transform:translateY(7px)}55%,100%{opacity:1;transform:none}}
.e .ciz{animation-name:ec}@keyframes ec{0%,52%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.f1{animation-name:f1}@keyframes f1{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.f1 .ciz{animation-name:f1c}@keyframes f1c{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.f2{animation-name:f2}@keyframes f2{0%,68%{opacity:0;transform:translateY(7px)}71%,100%{opacity:1;transform:none}}
.f2 .ciz{animation-name:f2c}@keyframes f2c{0%,68%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.f3{animation-name:f3}@keyframes f3{0%,74%{opacity:0;transform:translateY(7px)}77%,100%{opacity:1;transform:none}}
.f3 .ciz{animation-name:f3c}@keyframes f3c{0%,74%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
.g{animation-name:g}@keyframes g{0%,86%{opacity:0;transform:translateY(7px)}89%,100%{opacity:1;transform:none}}
.g .ciz{animation-name:gc}@keyframes gc{0%,86%{stroke-dashoffset:1}90%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a a"><rect x="170" y="12" width="300" height="52" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="34.5" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Hiperkalsemi</text><text x="320" y="51.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">albüminle düzeltilmiş ya da iyonize Ca ↑</text></g>
<g class="a b"><path class="a ciz" pathLength="1" d="M320,66 L320,88" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="170" y="92" width="300" height="52" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="114.5" font-size="14" font-weight="800" text-anchor="middle" fill="#581c87">PTH ölçümü</text><text x="320" y="131.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">baskılı mı, değil mi?</text></g>
<g class="a c1"><path class="a ciz" pathLength="1" d="M230,146 L130,176" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="180" width="260" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="150" y="208.5" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">PTH açıkça yüksek</text><text x="150" y="225.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">PHPT</text></g>
<g class="a c2"><path class="a ciz" pathLength="1" d="M410,146 L510,176" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="360" y="180" width="260" height="64" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="490" y="208.5" font-size="12.5" font-weight="800" text-anchor="middle" fill="#78350f">Sınırda yüksek / uygunsuz normal</text><text x="490" y="225.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">PHPT en olası — FHH'yi ayır</text></g>
<g class="a d"><path class="a ciz" pathLength="1" d="M150,246 L280,280" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M490,246 L360,280" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="120" y="284" width="400" height="64" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="312.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Herkeste: 24 sa idrar Ca + 25(OH)D</text><text x="320" y="329.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">Ca/Cr klirens oranı = (idrar Ca × serum Cr) ÷ (serum Ca × idrar Cr)</text></g>
<g class="a e"><path class="a ciz" pathLength="1" d="M320,350 L320,372" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a f1"><path class="a ciz" pathLength="1" d="M240,376 L120,400" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="404" width="190" height="84" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="115" y="434" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">&lt;0,01</text><text x="115" y="451" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">FHH'lerin ~%80'i</text><text x="115" y="468" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">(PHPT'lerin ~%20'si de!)</text></g>
<g class="a f2"><path class="a ciz" pathLength="1" d="M320,376 L320,400" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="225" y="404" width="190" height="84" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="434" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">0,01–0,02</text><text x="320" y="451" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">gri bölge</text><text x="320" y="468" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">CASR · AP2S1 · GNA11</text></g>
<g class="a f3"><path class="a ciz" pathLength="1" d="M400,376 L520,400" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="430" y="404" width="190" height="84" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="525" y="434" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">&gt;0,02</text><text x="525" y="451" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">PHPT lehine</text><text x="525" y="468" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ cerrahi değerlendirme</text></g>
<g class="a g"><rect x="20" y="504" width="600" height="122" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="536" font-size="13" font-weight="800" text-anchor="middle" fill="#1e293b">Tuzaklar</text><text x="320" y="553" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">FHH'de PTH %15–20 hafif yüksek olabilir (özellikle FHH3) · FHH cerrahiden yarar görmez</text><text x="320" y="570" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Lityum hiperkalsemi + hipokalsiüri yapar (hastaların ~%10–30'u) — FHH'yi taklit eder</text><text x="320" y="587" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">D vitamini eksikliği hiperkalsiüriyi gizler ve PTH'yi ayrıca artırır</text><text x="320" y="604" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Görüntüleme TANI aracı DEĞİL: yalnız cerrahi kararından sonra lokalizasyon için</text></g>

</svg>
