"800" fill="#0f172a">Nedeni bul</text><text x="320" y="188" text-anchor="middle" font-size="13" fill="#0f172a">nodülsüz bez: TRAb · nodüllü bez: sintigrafi</text></g><g class="a m s3"><rect x="10" y="246" width="196" height="134" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="108" y="288" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Graves</text><text x="108" y="308" text-anchor="middle" font-size="13" fill="#1e3a8a">yaygın tutulum</text><text x="108" y="328" text-anchor="middle" font-size="13" fill="#1e3a8a">TRAb pozitif</text><text x="108" y="348" text-anchor="middle" font-size="13" fill="#1e3a8a">orbitopati</text></g><g class="a m s3"><rect x="222" y="246" width="196" height="134" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="288" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Toksik nodül</text><text x="320" y="308" text-anchor="middle" font-size="13" fill="#78350f">odaksal tutulum</text><text x="320" y="328" text-anchor="middle" font-size="13" fill="#78350f">adenom / MNG</text><text x="320" y="348" text-anchor="middle" font-size="13" fill="#78350f">ilaçla remisyon yok</text></g><g class="a m s3"><rect x="434" y="246" width="196" height="134" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="532" y="288" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Düşük tutulum</text><text x="532" y="308" text-anchor="middle" font-size="13" fill="#064e3b">tiroidit</text><text x="532" y="328" text-anchor="middle" font-size="13" fill="#064e3b">dışarıdan hormon</text><text x="532" y="348" text-anchor="middle" font-size="13" fill="#064e3b">antitiroid gereksiz</text></g><g class="a m s4"><rect x="40" y="416" width="560" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="446" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Belirtili herkese beta bloker</text><text x="320" y="466" text-anchor="middle" font-size="13" fill="#0f172a">atenolol 25–50 mg/gün · fırtınada propranolol</text></g><g class="a m s5"><rect x="15" y="522" width="295" height="148" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="571" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Graves'te üç yol</text><text x="162.5" y="591" text-anchor="middle" font-size="13" fill="#1e3a8a">metimazol 12–18 ay</text><text x="162.5" y="611" text-anchor="middle" font-size="13" fill="#1e3a8a">radyoaktif iyot (orbitopatide dikkat)</text><text x="162.5" y="631" text-anchor="middle" font-size="13" fill="#1e3a8a">total tiroidektomi</text></g><g class="a m s6"><rect x="330" y="522" width="295" height="148" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="571" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Toksik nodülde</text><text x="477.5" y="591" text-anchor="middle" font-size="13" fill="#78350f">radyoiyot ya da cerrahi</text><text x="477.5" y="611" text-anchor="middle" font-size="13" fill="#78350f">&gt;80 g ya da bası → cerrahi</text><text x="477.5" y="631" text-anchor="middle" font-size="13" fill="#78350f">uzun süreli metimazol · RFA</text></g><g class="a m s7"><rect x="40" y="712" width="560" height="170" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="762" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Uyarı: tiroid fırtınası</text><text x="320" y="782" text-anchor="middle" font-size="13" fill="#7f1d1d">ateş · taşikardi · bilinç bozukluğu · GİS</text><text x="320" y="802" text-anchor="middle" font-size="13" fill="#7f1d1d">ölüm %10–30 → yoğun bakım</text><text x="320" y="822" text-anchor="middle" font-size="13" fill="#7f1d1d">beta bloker + PTU → 1 saat sonra iyot</text><text x="320" y="842" text-anchor="middle" font-size="13" fill="#7f1d1d">hidrokortizon · kolestiramin</text></g>
</svg>
