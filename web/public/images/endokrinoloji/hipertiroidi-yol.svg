<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipertiroidi: tanıdan tedaviye</title>
<desc id="d">Hipertiroidide yol: kuşkulanınca önce TSH istenir; TSH düşükse serbest T4 ve T3 ölçülür. TSH baskılı, serbest T4 ve/veya T3 yüksekse aşikar hipertiroidi; hormonlar normalse subklinik hipertiroidi, bir ila üç ay sonra tekrarla doğrulanır. Biotin testleri bozar, en az iki gün kesilip yeniden ölçülür. Neden araştırılır: nodülsüz bezde önce TSH reseptör antikoru (TRAb), nodüllü bezde radyoiyot tutulumu ve sintigrafi. Yaygın artmış tutulum ya da pozitif TRAb Graves hastalığıdır; odaksal tutulum toksik adenom ya da toksik multinodüler guatr; düşük tutulum tiroidit ya da dışarıdan hormondur ve antitiroid ilaç gerekmez. Belirtili her hastaya beta bloker verilir. Graves'te üç yol vardır: 12–18 ay metimazol, radyoaktif iyot ya da total tiroidektomi. Toksik nodülde antitiroid ilaç remisyon sağlamaz; kalıcı tedavi radyoiyot ya da cerrahidir, uzun süreli metimazol de seçenektir. Ateş, taşikardi, bilinç bozukluğu ve sindirim yakınmaları tiroid fırtınasını düşündürür; ölüm oranı yüzde 10–30'dur ve yoğun bakımda beta bloker, tiyonamid, bir saat sonra iyot ve glukokortikoid verilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
