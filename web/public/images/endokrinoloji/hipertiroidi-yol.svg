.s5{animation-name:s5}@keyframes s5{0%,57%{opacity:0;transform:translateY(8px)}60%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,57%{stroke-dashoffset:1}62%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,71%{opacity:0;transform:translateY(8px)}74%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,71%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,86%{opacity:0;transform:translateY(8px)}89%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,86%{stroke-dashoffset:1}91%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
