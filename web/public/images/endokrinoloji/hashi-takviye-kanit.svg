<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hashimoto'da selenyum, glütensiz diyet ve LT4+LT3: antikor ya da puan değişiyor, klinik sonuç gösterilemedi</title>
<desc id="d">Selenyum: 16 kontrollü çalışmanın meta-analizinde LT4 alan hastalarda TPO antikoru 3, 6 ve 12 ayda, ilaçsız hastalarda yalnız 3. ayda düştü; klinik karşılığı gösterilemedi, kanıt düzeyi genellikle düşüktü ve selenyum alanlarda yan etki bildirimi daha sıktı (Wichman 2016). Glütensiz diyet: doku transglutaminaz antikoru pozitif 34 kadınlık pilot çalışmada 6 ayda tiroid antikorları azaldı (Krysiak 2019); çölyak belirteci olmayan hastaya genellenemez. LT4+LT3: 14 klinik çalışma tutarlı fayda göstermedi (ATA/BTA/ETA 2021); DIO2 geninin rs225014 CC genotipinde (hastaların yüzde 16'sı) kombinasyonla iyilik hali puanı 3. ayda 2,3, 12. ayda 1,4 puan daha fazla düzeldi, sonuç tekrarlanmayı bekliyor (Panicker 2009).</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.t0{animation-name:t0}@keyframes t0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.t0 .ciz{animation-name:t0c}@keyframes t0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.t1{animation-name:t1}@keyframes t1{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.t1 .ciz{animation-name:t1c}@keyframes t1c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.t2{animation-name:t2}@keyframes t2{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.t2 .ciz{animation-name:t2c}@keyframes t2c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.t3{animation-name:t3}@keyframes t3{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.t3 .ciz{animation-name:t3c}@keyframes t3c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.t4{animation-name:t4}@keyframes t4{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.t4 .ciz{animation-name:t4c}@keyframes t4c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a t0"><text x="320" y="24" font-size="15" font-weight="800" text-anchor="middle" fill="#0f172a">Ne değişiyor, ne gösterilmedi?</text></g>
<g class="a t1"><rect x="10" y="40" width="200" height="70" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="110" y="79" font-size="14" font-weight="800" text-anchor="middle" fill="#581c87">Selenyum</text><rect x="10" y="120" width="200" height="128" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="110" y="161.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#14532d">Değişen</text><text x="110" y="181.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">TPOAb ↓</text><text x="110" y="198.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">LT4 alanda 3·6·12. ay</text><text x="110" y="215.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">ilaçsızda yalnız 3. ay</text><rect x="10" y="258" width="200" height="128" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="110" y="299.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Gösterilemeyen</text><text x="110" y="319.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">klinik fayda</text><text x="110" y="336.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">TSH ve USG etkisi yok</text><text x="110" y="353.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">(TEMD aktarımı)</text><rect x="10" y="396" width="200" height="104" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="110" y="425.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0f172a">Kanıtın niteliği</text><text x="110" y="445.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">16 çalışma · düşük kanıt</text><text x="110" y="462.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">yan etki bildirimi ↑</text><text x="110" y="479.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">(Wichman 2016)</text></g>
<g class="a t2"><rect x="220" y="40" width="200" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="79" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">Glütensiz diyet</text><rect x="220" y="120" width="200" height="128" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320" y="161.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#14532d">Değişen</text><text x="320" y="181.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">TPOAb ve TgAb ↓</text><text x="320" y="198.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">6 ayda</text><text x="320" y="215.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d"></text><rect x="220" y="258" width="200" height="128" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="299.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Gösterilemeyen</text><text x="320" y="319.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">çölyak belirteci (−)</text><text x="320" y="336.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">hastada fayda</text><text x="320" y="353.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">test edilmedi</text><rect x="220" y="396" width="200" height="104" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="425.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0f172a">Kanıtın niteliği</text><text x="320" y="445.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">pilot · 34 kadın</text><text x="320" y="462.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">hepsi tTG (+)</text><text x="320" y="479.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">(Krysiak 2019)</text></g>
<g class="a t3"><rect x="430" y="40" width="200" height="70" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="530" y="79" font-size="14" font-weight="800" text-anchor="middle" fill="#1e3a8a">LT4 + LT3</text><rect x="430" y="120" width="200" height="128" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="530" y="161.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#14532d">Değişen</text><text x="530" y="181.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">DIO2 CC (%16):</text><text x="530" y="198.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">iyilik puanı +2,3 (3. ay)</text><text x="530" y="215.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">+1,4 (12. ay)</text><rect x="430" y="258" width="200" height="128" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="530" y="299.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Gösterilemeyen</text><text x="530" y="319.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">14 çalışmada tutarlı</text><text x="530" y="336.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">fayda yok</text><text x="530" y="353.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">(ATA/BTA/ETA 2021)</text><rect x="430" y="396" width="200" height="104" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="530" y="425.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0f172a">Kanıtın niteliği</text><text x="530" y="445.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">RCT alt grup analizi</text><text x="530" y="462.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">tekrarlanmayı bekliyor</text><text x="530" y="479.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">(Panicker 2009)</text></g>
<g class="a t4"><text x="320" y="534" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Antikor düşüşü bir laboratuvar sonucudur; hipotiroidi gelişimini ya da belirtiyi azalttığı gösterilmedi.</text></g>
