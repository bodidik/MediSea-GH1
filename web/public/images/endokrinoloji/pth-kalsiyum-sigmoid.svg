<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kalsiyum–PTH eğrisi ve set-point kayması</title>
<desc id="d">Serum iyonize kalsiyumu ile PTH salınımı arasında ters, dik bir sigmoid ilişki vardır; set-point PTH salınımının yarı-maksimal baskılandığı kalsiyum düzeyidir. Normalde iyonize kalsiyumdaki 0,1 mg/dL'lik bir düşüş saniyeler-dakikalar içinde büyük PTH artışı yaratır. Primer hiperparatiroidide set-point normal bezin yüzde 15–30 üstüne kayar ve PTH yüksek kalsiyumla tam baskılanmaz; hücre kitlesi arttıkça eğri yükselir. FHH1'de CaSR kayıp-işlev mutasyonu eğriyi sağa, otozomal dominant hipokalsemi 1'de kazanç-işlev mutasyonu sola kaydırır. Lityum da set-point'i sağa kaydırır (bir çalışmada 1,26'ya karşı 1,21 mmol/L). Eğri şematiktir; eksen değerleri ölçek değildir.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.eks{animation-name:eks}@keyframes eks{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.eks .ciz{animation-name:eksc}@keyframes eksc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.nor{animation-name:nor}@keyframes nor{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.nor .ciz{animation-name:norc}@keyframes norc{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.sp{animation-name:sp}@keyframes sp{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.sp .ciz{animation-name:spc}@keyframes spc{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.phpt{animation-name:phpt}@keyframes phpt{0%,34%{opacity:0;transform:translateY(7px)}37%,100%{opacity:1;transform:none}}
.phpt .ciz{animation-name:phptc}@keyframes phptc{0%,34%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.fhh{animation-name:fhh}@keyframes fhh{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.fhh .ciz{animation-name:fhhc}@keyframes fhhc{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.adh{animation-name:adh}@keyframes adh{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.adh .ciz{animation-name:adhc}@keyframes adhc{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.not{animation-name:not}@keyframes not{0%,76%{opacity:0;transform:translateY(7px)}79%,100%{opacity:1;transform:none}}
.not .ciz{animation-name:notc}@keyframes notc{0%,76%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
