<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Primer hiperparatiroidide ameliyat mı, izlem mi?</title>
<desc id="d">Biyokimyasal olarak doğrulanmış primer hiperparatiroidide FHH dışlanır, tiazid ve lityum sorgulanır, 25-hidroksivitamin D ölçülür. Böbrek taşı, kırık ya da semptomatik hiperkalsemi varsa tek kesin tedavi olan paratiroidektomi yapılır. Asemptomatik hastada 5. Uluslararası Çalıştay ölçütlerinden biri yeterlidir: serum kalsiyumunun normalin üst sınırından 1 mg/dL'den fazla yüksek olması; kalça, omurga ya da distal radiusta T-skoru −2,5 ve altı ya da vertebra kırığı; eGFR 60'ın altı ya da görüntülemede taş veya nefrokalsinoz; 24 saatlik idrar kalsiyumunun kadında 250, erkekte 300 mg/gün üstü; 50 yaş altı. Ölçüt varsa deneyimli cerraha gönderilir ve lokalizasyon görüntülemesi ancak bu kararla yapılır. Ameliyat olamayan hastada ağır hiperkalsemide sinakalset, osteoporozda bifosfonat, ikisi birlikteyse ikisi birlikte verilir; sinakalset kemiği korumaz, gebelikte bu ilaçlar verilmez. Ölçüt yoksa izlem ya da hastanın isteğiyle ameliyat seçilir; izlemde yılda bir kalsiyum ve eGFR, 1–2 yılda bir üç bölgeli kemik yoğunluğu, bel ağrısı ya da boy kısalmasında vertebra değerlendirmesi yapılır, kalsiyum alımı yaklaşık 1000 mg/gün ve 25-hidroksivitamin D 30 ng/mL üstünde tutulur, tiazid, lityum ve sıvı kaybından kaçınılır. İzlemde bir ölçüt ortaya çıkarsa ameliyat önerilir; kortikal kemik yıllar içinde eridiği için izlem ömür boyu bir strateji değildir.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,14%{opacity:0;transform:translateY(7px)}17%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,14%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,27%{opacity:0;transform:translateY(7px)}30%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,27%{stroke-dashoffset:1}31%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,41%{opacity:0;transform:translateY(7px)}44%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,41%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,55%{opacity:0;transform:translateY(7px)}58%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:s5c}@keyframes s5c{0%,55%{stroke-dashoffset:1}59%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,68%{opacity:0;transform:translateY(7px)}71%,100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:s6c}@keyframes s6c{0%,68%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a s1"><rect x="20" y="12" width="600" height="64" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="320" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Biyokimyasal olarak doğrulanmış PHPT</text><text x="320" y="53" text-anchor="middle" font-size="13" fill="#334155">FHH dışlandı · tiazid ve lityum sorgulandı · 25(OH)D ölçüldü</text></g>
<g class="a s2"><path class="ciz" pathLength="1" d="M320 78 L320 100" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="20" y="102" width="600" height="66" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="320" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Taş, kırık ya da semptomatik hiperkalsemi var mı?</text><text x="320" y="143" text-anchor="middle" font-size="13" fill="#334155">Varsa paratiroidektomi: hastalığı iyileştiren tek tedavi</text></g>
<g class="a s3"><path class="ciz" pathLength="1" d="M320 170 L320 192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="20" y="194" width="600" height="150" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="320" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Asemptomatik: 5. Çalıştay ölçütlerinden BİRİ yeterli</text><text x="320" y="235" text-anchor="middle" font-size="13" fill="#334155">Ca: normalin üst sınırından &gt;1 mg/dL yüksek</text><text x="320" y="253" text-anchor="middle" font-size="13" fill="#334155">Kemik: T ≤ −2,5 (kalça, omurga, distal radius) ya da vertebra kırığı</text><text x="320" y="271" text-anchor="middle" font-size="13" fill="#334155">Böbrek: eGFR &lt;60 · görüntülemede taş ya da nefrokalsinoz</text><text x="320" y="289" text-anchor="middle" font-size="13" fill="#334155">24 sa idrar Ca: kadında &gt;250, erkekte &gt;300 mg/gün</text><text x="320" y="307" text-anchor="middle" font-size="13" fill="#334155">Yaş &lt;50</text></g>
<g class="a s4"><path class="ciz" pathLength="1" d="M165 346 L165 372" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M475 346 L475 372" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="20" y="374" width="290" height="102" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="165" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Ölçüt VAR</text><text x="165" y="415" text-anchor="middle" font-size="13" fill="#334155">Deneyimli cerraha gönder</text><text x="165" y="433" text-anchor="middle" font-size="13" fill="#334155">Lokalizasyon ANCAK şimdi</text><text x="165" y="451" text-anchor="middle" font-size="13" fill="#334155">Ameliyat olamazsa: ilaç ↓</text><rect x="330" y="374" width="290" height="102" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="475" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Ölçüt YOK</text><text x="475" y="415" text-anchor="middle" font-size="13" fill="#334155">İzlem ya da hasta isterse</text><text x="475" y="433" text-anchor="middle" font-size="13" fill="#334155">ameliyat (kalıcı tek tedavi)</text><text x="475" y="451" text-anchor="middle" font-size="13" fill="#334155">İzlem ↓</text></g>
<g class="a s5"><path class="ciz" pathLength="1" d="M165 478 L165 504" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M475 478 L475 504" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="20" y="506" width="290" height="150" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="165" y="527" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Ameliyat olamıyorsa</text><text x="165" y="547" text-anchor="middle" font-size="13" fill="#334155">Ağır hiperkalsemi → sinakalset</text><text x="165" y="565" text-anchor="middle" font-size="13" fill="#334155">Osteoporoz → bifosfonat</text><text x="165" y="583" text-anchor="middle" font-size="13" fill="#334155">İkisi birden → ikisi birlikte</text><text x="165" y="601" text-anchor="middle" font-size="13" fill="#334155">Sinakalset kemiği korumaz</text><text x="165" y="619" text-anchor="middle" font-size="13" fill="#334155">Gebelikte bu ilaçlar verilmez</text><rect x="330" y="506" width="290" height="150" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="475" y="527" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">İzlem</text><text x="475" y="547" text-anchor="middle" font-size="13" fill="#334155">Yılda bir Ca ve eGFR</text><text x="475" y="565" text-anchor="middle" font-size="13" fill="#334155">1–2 yılda bir 3 bölgeli DXA</text><text x="475" y="583" text-anchor="middle" font-size="13" fill="#334155">Bel ağrısı, boy kısalması → VFA</text><text x="475" y="601" text-anchor="middle" font-size="13" fill="#334155">Ca ~1000 mg/gün · 25(OH)D &gt;30</text><text x="475" y="619" text-anchor="middle" font-size="13" fill="#334155">Tiazid, lityum, sıvı kaybı yok</text></g>
<g class="a s6"><path class="ciz" pathLength="1" d="M475 658 L475 684" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="20" y="686" width="600" height="64" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="320" y="707" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">İzlemde ölçüt ortaya çıkarsa → ameliyat</text><text x="320" y="727" text-anchor="middle" font-size="13" fill="#334155">Kortikal kemik yıllar içinde erir: izlem ömür boyu strateji değildir</text></g>
</svg>
