fill="#1e3a8a">gebelik (β-hCG)</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ilaç · hipotiroidi</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">KBH · makroprolaktin</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">İlaca bağlıysa</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">hekimle 3 gün kes/değiştir</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">kesilemezse ve zamanlama</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">uymuyorsa → MR</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Hipofiz MR: boyut ↔ prolaktin</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#4c1d95">&lt;1 cm genelde &lt;200 · &gt;2 cm sıklıkla &gt;1000 ng/mL</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Büyük kitle, düşük PRL</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#7f1d1d">kanca etkisi</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#7f1d1d">örneği seyrelt</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#7f1d1d">(yanlış NFPA tanısı)</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Belirtili adenom</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">kabergolin ilk seçenek</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">0,25 mg haftada 2 kez</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">&gt;2 mg/hf: 2 yılda bir EKO</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Yanıtsızlık</text><text x="320" y="634.5" text-anchor="middle" font-size="13" fill="#78350f">dozu en yüksek tolere edilene çıkar · bromokriptinden kabergoline geç</text><text x="320" y="654.5" text-anchor="middle" font-size="13" fill="#78350f">sonra transsfenoidal cerrahi · malign: temozolomid</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Kesme ve gebelik</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#064e3b">≥2 yıl, normal PRL, MR'da tümör yok → azalt/kes</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#064e3b">gebelik saptanınca DA'yı kes (seçilmiş makroda sürdür)</text></g>
