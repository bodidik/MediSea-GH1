<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hiperprolaktinemi: ölçümden tedaviye</title>
<desc id="d">Hiperprolaktinemi tanısı, aşırı damar yolu stresi olmadan alınmış tek bir serum örneğinde prolaktinin normalin üst sınırını aşmasıyla konur; dinamik test gerekmez. Önce ikincil nedenler dışlanır: gebelik, prolaktini yükselten ilaçlar, primer hipotiroidi ve kronik böbrek hastalığı; belirti yoksa makroprolaktinemi de düşünülür. İlaca bağlı olduğu düşünülen belirtili hastada ilaç hekimiyle konuşularak 3 gün kesilir ya da değiştirilir; kesilemiyor ve başlangıç ilaçla çakışmıyorsa hipofiz MR'ı çekilir. Adenom büyüklüğü ile prolaktin genellikle orantılıdır: 1 santimden küçük adenomda çoğunlukla 200 ng/mL'nin altında, 2 santimden büyükte 1000'in üstünde. Büyük kitleye karşın prolaktin düşük ölçülürse kanca etkisi için örnek seyreltilir. Belirtili mikro ve makroadenomda ilk tedavi dopamin agonistidir; kabergolin bromokriptine yeğlenir, başlangıç dozu haftada iki kez 0,25 mg. Haftada 2 mg'ın üstündeki dozlarda iki yılda bir ekokardiyografi önerilir. Belirtisiz mikroadenom tedavi gerektirmez; amenorede dopamin agonisti ya da oral kontraseptif seçilebilir. Standart doza yanıtsızlıkta doz en yüksek tolere edilen düzeye çıkarılır, sonra cerrahi düşünülür. En az 2 yıl tedavi, normal prolaktin ve MR'da görünür tümör olmaması durumunda ilaç azaltılıp kesilebilir. Gebelik saptanınca dopamin agonisti genellikle kesilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
