<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Riedel tiroiditinde tanı ve tedavi akışı</title>
<desc id="d">Sert, yapışık guatr: doku tanısıyla kanseri dışla, IgG4 ilişkili sistemik fibrozisi tara. Hipotiroidiye levotiroksin, hipoparatiroidiye kalsiyum ve D vitamini. İlerleyici ya da bası yapan hastalıkta glukokortikoid, yetersizse tamoksifen, dirençlide rituksimab ya da mikofenolat. Havayolu basısında istmus kama rezeksiyonu; total tiroidektomi değil.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="540" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="140" y="14" width="360" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Taş sert, yapışık guatr</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Bası · ses kısıklığı · hipokalsemi</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="76" x2="320" y2="104" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="140" y="106" width="360" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Doku tanısı: kalın iğne / açık biyopsi</text><text x="320" y="151" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Anaplastik kanser ve lenfomayı dışla</text></g><g class="a" style="animation-delay:4.80s"><line x1="320" y1="168" x2="320" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="140" y="198" width="360" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Sistemik fibrozisi tara</text><text x="320" y="243" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Retroperiton · mediastin · orbita · safra yolu</text></g><g class="a" style="animation-delay:7.20s"><line x1="250" y1="260" x2="140" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="302" width="250" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="139" y="329" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Yerine koyma</text><text x="139" y="347" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Hipotiroidi: levotiroksin</text><text x="139" y="365" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Hipoparatiroidi: Ca + D vitamini</text></g><g class="a" style="animation-delay:9.60s"><line x1="390" y1="260" x2="480" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="290" y="302" width="336" height="80" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="458" y="329" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">İlerleyici / bası yapan hastalık</text><text x="458" y="347" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">1. Glukokortikoid (erken başla)</text><text x="458" y="365" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">2. Tamoksifen 10–20 mg/gün</text></g><g class="a" style="animation-delay:12.00s"><line x1="458" y1="382" x2="458" y2="410" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="290" y="412" width="336" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="458" y="443" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Dirençli: rituksimab · mikofenolat</text></g><g class="a" style="animation-delay:14.40s"><line x1="458" y1="464" x2="458" y2="474" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="476" width="612" height="52" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="507" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Havayolu basısı: istmus kama rezeksiyonu — total tiroidektomi değil</text></g>
</svg>
