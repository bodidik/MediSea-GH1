<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Graves'te ATD kursunun karar yolu: GREAT, TRAb ölçümü ve nüks</title>
<desc id="d">Tanıda GREAT skoru nüks riskini kestirir; yüksek riskte RAI ya da cerrahi baştan konuşulabilir. Metimazol 12–18 ay verilir. İlacı kesmeden önce TRAb ölçülür (ETA öneri 8, ATA öneri 21). TRAb normal ya da düşükse ilaç kesilir; nüks oranı yüzde 20–30'dur, izlem ilk yıl yakın sonra yıllıktır. TRAb yüksek kalırsa nüks yüzde 80–100'e yaklaşır: metimazol sürdürülüp TRAb 12 ay sonra tekrarlanır ya da RAI veya tiroidektomiye geçilir (ETA öneri 9). Nüks olursa ETA ve ATA kalıcı tedaviyi önerir; uzun süreli düşük doz metimazol hasta tercih ederse seçenektir. TEMD 2025 uzun süreli düşük doz metimazolü hasta isteğiyle aynı düzeyde sunar.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: tiroid-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.k1{animation-name:k1}@keyframes k1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.k1 .ciz{animation-name:k1c}@keyframes k1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.k2{animation-name:k2}@keyframes k2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.k2 .ciz{animation-name:k2c}@keyframes k2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.k3{animation-name:k3}@keyframes k3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.k3 .ciz{animation-name:k3c}@keyframes k3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.k4{animation-name:k4}@keyframes k4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.k4 .ciz{animation-name:k4c}@keyframes k4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.k5{animation-name:k5}@keyframes k5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.k5 .ciz{animation-name:k5c}@keyframes k5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.k6{animation-name:k6}@keyframes k6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.k6 .ciz{animation-name:k6c}@keyframes k6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.k7{animation-name:k7}@keyframes k7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.k7 .ciz{animation-name:k7c}@keyframes k7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>
<g class="a k1"><rect x="170" y="12" width="300" height="70" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="42.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">Tanı: GREAT hesapla</text><text x="320" y="61.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">sınıf III → RAI/cerrahi baştan konuşulur</text></g>
<g class="a k2"><path class="a ciz" pathLength="1" d="M320,84 L320,110" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="170" y="114" width="300" height="60" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="139.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Metimazol 12–18 ay</text><text x="320" y="158.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">titrasyon rejimi</text></g>
<g class="a k3"><path class="a ciz" pathLength="1" d="M320,176 L320,202" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="170" y="206" width="300" height="70" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="236.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Kesmeden önce TRAb ölç</text><text x="320" y="255.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">ETA öneri 8 · ATA öneri 21</text></g>
<g class="a k4"><path class="a ciz" pathLength="1" d="M240,278 C200,300 140,306 120,326" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#okY)"/><text x="150" y="300" font-size="11" font-weight="800" text-anchor="end" fill="#16a34a">normal / düşük</text><rect x="10" y="330" width="260" height="108" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="140" y="363.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">İlacı kes</text><text x="140" y="382.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">nüks %20–30 (ATA)</text><text x="140" y="398.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">nüks çoğu ilk 6–12 ay</text><text x="140" y="414.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">ilk yıl yakın, sonra yıllık izlem</text></g>
<g class="a k5"><path class="a ciz" pathLength="1" d="M400,278 C440,300 500,306 520,326" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><text x="492" y="300" font-size="11" font-weight="800" text-anchor="start" fill="#dc2626">yüksek</text><rect x="370" y="330" width="260" height="108" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="500" y="363.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">TRAb yüksek kaldı</text><text x="500" y="382.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">nüks %80–100 (ATA)</text><text x="500" y="398.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">MMI sürdür, 12 ay sonra tekrar</text><text x="500" y="414.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ya da RAI / tiroidektomi (ETA 9)</text></g>
<g class="a k6"><path class="a ciz" pathLength="1" d="M140,440 C150,480 230,492 270,500" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#okA)"/><text x="150" y="482" font-size="11" font-weight="800" text-anchor="end" fill="#d97706">nüks</text><rect x="170" y="504" width="300" height="92" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="529.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Nüks</text><text x="320" y="548.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">ETA 13 · ATA 23: kalıcı tedavi (RAI/cerrahi)</text><text x="320" y="564.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">uzun süreli düşük doz MMI: hasta isterse</text><text x="320" y="580.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">TEMD 2025: ikisi aynı düzeyde</text></g>
<g class="a k7"><text x="320" y="624" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ETA 2018 (Kahaly), ATA 2016 (Ross), TEMD 2025 · GREAT: Vos 2016, Struja 2017</text></g>
</svg>
