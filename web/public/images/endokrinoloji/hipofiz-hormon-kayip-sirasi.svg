<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipofiz yetmezliğinde hormon kaybı sırası ve istisnaları</title>
<desc id="d">Hipofizi dıştan sıkıştıran kitlede hormonlar zaman içinde genellikle GH, FSH/LH, TSH ve ACTH sırasıyla kaybolur. Fonksiyonsuz adenom meta-analizlerinde hipopitüitarizm yüzde 37–85, panhipopitüitarizm yüzde 6–29; en sık GH eksikliği (yüzde 61–100), sonra FSH/LH (36–96), ACTH (17–62) ve TSH (8–81). Erişkinde ilk klinik belirti çoğu kez hipogonadizm, çocukta büyüme geriliğidir. İstisnalar: lenfositik hipofizitte ACTH ya da TSH ilk kaybolabilir; travmatik beyin hasarında izole eksiklik sıktır ve ACTH eksikliği erken görülebilir; kontrol noktası inhibitörü hipofizitinde santral hipotiroidi ve sekonder adrenal yetmezlik en sıktır, GH ve prolaktin genellikle korunur; PIT-1 mutasyonunda GH, prolaktin ve bazen TSH eksiktir, ACTH ve gonadotropinler korunur.</desc>
<!-- 14 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:14s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.bas{animation-name:bas}@keyframes bas{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.bas .ciz{animation-name:basc}@keyframes basc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.sira{animation-name:sira}@keyframes sira{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.sira .ciz{animation-name:sirac}@keyframes sirac{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.fna{animation-name:fna}@keyframes fna{0%,32%{opacity:0;transform:translateY(7px)}35%,100%{opacity:1;transform:none}}
.fna .ciz{animation-name:fnac}@keyframes fnac{0%,32%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.ist{animation-name:ist}@keyframes ist{0%,52%{opacity:0;transform:translateY(7px)}55%,100%{opacity:1;transform:none}}
.ist .ciz{animation-name:istc}@keyframes istc{0%,52%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,76%{opacity:0;transform:translateY(7px)}79%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,76%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="600" fill="#ffffff"/>

<g class="a bas"><text x="320" y="40" font-size="15" font-weight="800" text-anchor="middle" fill="#0f172a">Bası (kitle) ile ilerleyen hasar — tipik sıra</text></g>
<g class="a sira"><rect x="30" y="70" width="130" height="56" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="95" y="94.5" font-size="15" font-weight="800" text-anchor="middle" fill="#0c4a6e">GH</text><text x="95" y="111.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">en erken</text><path class="a ciz" pathLength="1" d="M162,98 L178,98" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="180" y="70" width="130" height="56" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="245" y="103" font-size="15" font-weight="800" text-anchor="middle" fill="#581c87">LH/FSH</text><path class="a ciz" pathLength="1" d="M312,98 L328,98" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="330" y="70" width="130" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="395" y="103" font-size="15" font-weight="800" text-anchor="middle" fill="#78350f">TSH</text><path class="a ciz" pathLength="1" d="M462,98 L478,98" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="480" y="70" width="130" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="545" y="94.5" font-size="15" font-weight="800" text-anchor="middle" fill="#7f1d1d">ACTH</text><text x="545" y="111.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">en geç, en tehlikeli</text></g>
<g class="a fna"><rect x="20" y="146" width="600" height="96" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="173.5" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Fonksiyonsuz adenom (meta-analiz, TEMD 2022)</text><text x="320" y="190.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">hipopitüitarizm %37–85 · panhipopitüitarizm %6–29</text><text x="320" y="207.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">GH %61–100 · FSH/LH %36–96 · ACTH %17–62 · TSH %8–81</text><text x="320" y="224.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">erişkinde ilk belirti çoğu kez hipogonadizm; çocukta büyüme geriliği</text></g>
<g class="a ist"><text x="320" y="270" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">Sıranın bozulduğu durumlar</text><rect x="20" y="284" width="290" height="86" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="165" y="315" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Lenfositik hipofizit</text><text x="165" y="332" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ACTH ya da TSH ilk kaybolabilir</text><text x="165" y="349" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">baş ağrısı lezyonla orantısız</text><rect x="330" y="284" width="290" height="86" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="475" y="315" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Travmatik beyin hasarı</text><text x="475" y="332" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">izole eksiklik daha sık</text><text x="475" y="349" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ACTH eksikliği erken olabilir</text><rect x="20" y="380" width="290" height="86" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="165" y="411" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Kontrol noktası inhibitörü</text><text x="165" y="428" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">santral hipotiroidi + sekonder AY en sık</text><text x="165" y="445" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">GH ve PRL genellikle korunur</text><rect x="330" y="380" width="290" height="86" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="475" y="411" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">PIT-1 (POU1F1) mutasyonu</text><text x="475" y="428" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">GH · PRL · bazen TSH eksik</text><text x="475" y="445" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">ACTH ve LH/FSH korunur</text></g>
<g class="a son"><rect x="20" y="484" width="600" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="513.5" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Klinik sonuç</text><text x="320" y="530.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">kısmi ACTH eksikliği yalnız stres altında belirti verebilir</text><text x="320" y="547.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">"GH ve gonadlar normal, öyleyse ACTH de normal" denemez</text><text x="320" y="564.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">her hipofiz/hipotalamus hastasında ACTH yeterliliği biyokimyasal sınanır</text></g>

</svg>
