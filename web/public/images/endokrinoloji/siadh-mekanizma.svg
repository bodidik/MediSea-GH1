<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SIADH: su tutulması, dilüsyon ve vazopressin kaçışı</title>
<desc id="d">Uygunsuz AVP salınımı (ektopik tümör, SSS hastalığı, akciğer hastalığı, ilaç, bulantı ve ağrı) V2 üzerinden AQP2'yi artırır ve alınan su tutulur. Vücut suyu artar, serum sodyumu seyrelerek düşer ve osmolalite düşer. Hafif hacim artışı ANP salınımını ve basınç natriürezini artırır, aldosteron baskılanır: idrar sodyumu 30 mmol/L'nin üstünde kalır. Günler içinde vazopressin kaçışı gelişir: AVP sürse de AQP2 ekspresyonu azalır ve su tutulumu sınırlanır. Sonuçta hasta klinik olarak övolemiktir, ödemi yoktur; ancak serum sodyumu düşük kalır.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: di-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.avp{animation-name:avp}@keyframes avp{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.avp .ciz{animation-name:avpc}@keyframes avpc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.v2{animation-name:v2}@keyframes v2{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.v2 .ciz{animation-name:v2c}@keyframes v2c{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.tut{animation-name:tut}@keyframes tut{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.tut .ciz{animation-name:tutc}@keyframes tutc{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.dil{animation-name:dil}@keyframes dil{0%,30%{opacity:0;transform:translateY(7px)}33%,100%{opacity:1;transform:none}}
.dil .ciz{animation-name:dilc}@keyframes dilc{0%,30%{stroke-dashoffset:1}34%,100%{stroke-dashoffset:0}}
.nat{animation-name:nat}@keyframes nat{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.nat .ciz{animation-name:natc}@keyframes natc{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.kac{animation-name:kac}@keyframes kac{0%,58%{opacity:0;transform:translateY(7px)}61%,100%{opacity:1;transform:none}}
.kac .ciz{animation-name:kacc}@keyframes kacc{0%,58%{stroke-dashoffset:1}62%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,74%{opacity:0;transform:translateY(7px)}77%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,74%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
.tank{animation-name:tank}@keyframes tank{0%,10%{transform:scaleY(.62)}38%{transform:scaleY(.9)}60%,100%{transform:scaleY(.78)}}
.na{animation-name:na}@keyframes na{0%,10%{transform:translateY(0)}38%,100%{transform:translateY(46px)}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="560" fill="#ffffff"/>

<g class="a avp"><rect x="20" y="14" width="290" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="165" y="40" font-size="14" font-weight="800" text-anchor="middle" fill="#581c87">Uygunsuz AVP</text><text x="165" y="57" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">ektopik (KHAK) · SSS · akciğer</text><text x="165" y="74" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">ilaç (SSRI, karbamazepin) · bulantı · ağrı</text></g>
<g class="a v2"><path class="a ciz" pathLength="1" d="M165,92 L165,116" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="120" width="290" height="56" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="165" y="144.5" font-size="14" font-weight="800" text-anchor="middle" fill="#0c4a6e">V2 → AQP2 apikal zarda</text><text x="165" y="161.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">serbest su geri emilir</text></g>
<g class="a tut"><path class="a ciz" pathLength="1" d="M165,178 L165,202" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="206" width="290" height="56" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="165" y="230.5" font-size="14" font-weight="800" text-anchor="middle" fill="#0c4a6e">Alınan su tutulur</text><text x="165" y="247.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">U<tspan font-size='9'>osm</tspan> &gt;100 · uygunsuz konsantre idrar</text></g>
<g class="a dil"><path class="a ciz" pathLength="1" d="M165,264 L165,288" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="292" width="290" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="165" y="316.5" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">Dilüsyonel hiponatremi</text><text x="165" y="333.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">P<tspan font-size='9'>osm</tspan> &lt;275 · ürik asit ↓ · BUN ↓</text></g>
<g class="a nat"><path class="a ciz" pathLength="1" d="M165,350 L165,374" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="378" width="290" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="165" y="401" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">Hafif hacim artışı → natriürez</text><text x="165" y="418" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">ANP ↑ · basınç natriürezi · aldosteron ↓</text><text x="165" y="435" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">U<tspan font-size='9'>Na</tspan> &gt;30 mmol/L</text></g>
<g class="a kac"><path class="a ciz" pathLength="1" d="M312,413 L338,413" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><rect x="340" y="378" width="280" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="480" y="401" font-size="14" font-weight="800" text-anchor="middle" fill="#14532d">Vazopressin kaçışı</text><text x="480" y="418" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">AVP sürse de AQP2 ekspresyonu ↓</text><text x="480" y="435" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">su tutulumu sınırlanır</text></g>
<g class="a son"><rect x="20" y="470" width="600" height="74" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="495" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Sonuç: klinik övolemi + hiponatremi</text><text x="320" y="512" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Toplam vücut suyu hafifçe artmış, ödem YOK (fazla su hücre içine de dağılır)</text><text x="320" y="529" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Sodyum eksikliği değil, su fazlalığı: tedavinin hedefi serbest suyu atmak</text></g>
<g class="a dil"><rect x="380" y="40" width="180" height="300" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="470" y="30" font-size="12" font-weight="800" text-anchor="middle" fill="#334155">Vücut suyu</text>
<g class="a tank m" style="transform-origin:470px 338px;transform-box:view-box"><rect x="383" y="44" width="174" height="294" rx="14" fill="#bae6fd" opacity=".85"/></g>
<circle cx="405" cy="230" r="10" fill="#f59e0b" stroke="#b45309"/><circle cx="465" cy="230" r="10" fill="#f59e0b" stroke="#b45309"/><circle cx="525" cy="230" r="10" fill="#f59e0b" stroke="#b45309"/><circle cx="405" cy="280" r="10" fill="#f59e0b" stroke="#b45309"/><circle cx="465" cy="280" r="10" fill="#f59e0b" stroke="#b45309"/><circle cx="525" cy="280" r="10" fill="#f59e0b" stroke="#b45309"/>
<text x="470" y="362" font-size="11" font-weight="700" text-anchor="middle" fill="#0c4a6e">Na⁺ sayısı aynı, su arttı → [Na⁺] düşer</text>
<g class="a na"><text x="590" y="110" font-size="12" font-weight="800" text-anchor="start" fill="#dc2626">[Na⁺]</text><path class="a ciz" pathLength="1" d="M600,118 L600,150" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/></g></g>

</svg>
