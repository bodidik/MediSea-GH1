>sonra PPİ'yi 7–14 gün kes</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">uzman gözetiminde</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">yüksek doz H2 blokerle köprü</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Tanı</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">açlık gastrini &gt;10× ÜS</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">(1000 pg/mL)</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">+ mide pH &lt;2</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Yer: çoğu duodenumda, milimetrik, çoklu</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#4c1d95">BT/MR + Ga-68 DOTATATE PET · pankreas için EUS</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Kalsiyumu düzelt</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">hiperkalsemi gastrini artırır</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">PTX gastrini azaltabilir</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">2025: PTX ölçütü</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Standart: yüksek doz PPİ</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">omeprazol 2×40 mg</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">pantoprazol 2×80 mg</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">PCAB seçenek · dirençte SSA</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Cerrahi tartışmalı</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#7f1d1d">&gt;2 cm pankreas tümöründe yararlı</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#7f1d1d">pankreatikoduodenektomi: biyokimyasal kür %77–100 (kanıt IIa–III)</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#7f1d1d">morbidite yüksek · uzman merkez, hastanın tercihi</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">İzlem</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#0f172a">görüntüleme (radyasyonu azalt) · B12 · mide ECLoma %15–70</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#0f172a">uzak metastaz %20–25 → 10 yıl sağkalım ~%50</text></g>
