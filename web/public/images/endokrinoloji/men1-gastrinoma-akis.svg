<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">MEN1'de gastrinoma: şüpheden izleme</title>
<desc id="d">Postbulbar ya da çoklu peptik ülser, ishal ve proton pompası inhibitörüne dirençli ülser gastrinomayı düşündürür; MEN1 hastalarının yaklaşık yüzde 60'ında Zollinger-Ellison sendromu ya da belirtisiz hipergastrinemi vardır. Önce endoskopi yapılır. Proton pompası inhibitörü 7 ile 14 gün, uzman gözetiminde ve yüksek doz H2 blokerle köprülenerek kesilir. Açlık gastrini normalin üst sınırının 10 katından (1000 pg/mL) yüksek ve mide pH'sı 2'nin altındaysa tanı konur. Lokalizasyon için kontrastlı BT ya da MR ve galyum-68 DOTATATE PET, pankreas için endoskopik ultrason kullanılır; MEN1'de tümörler çoğunlukla duodenumda, milimetrik ve çokludur. Hiperkalsemi gastrini artırır; paratiroidektomi gastrini azaltabilir ve belirtili gastrinoma 2025 kılavuzunda paratiroid cerrahisi ölçütüdür. Standart tedavi yüksek doz proton pompası inhibitörüdür: omeprazol günde iki kez 40 mg ya da pantoprazol günde iki kez 80 mg; potasyum rekabetçi asit blokerleri seçenek, dirençte somatostatin analogu eklenir. Cerrahi tartışmalıdır: 2 santimetreden büyük pankreas tümöründe yararlı, pankreatikoduodenektomi ile biyokimyasal kür yüzde 77 ile 100 bildirilir ama morbidite yüksektir. İzlemde periyodik görüntüleme, B12 düzeyi ve mide nöroendokrin tümörleri gözetilir; hastaların yüzde 20 ile 25'inde uzak metastaz gelişir ve bunlarda 10 yıllık sağkalım yaklaşık yüzde 50'dir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
