<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipofiz yetmezliğinde nedenden hormon örüntüsüne</title>
<desc id="d">Hormon örüntüsü nedeni düşündürür. Hipofiz içi kitle: sıra çoğunlukla GH, gonadotropin, TSH, ACTH; AVP eksikliği hemen hiç yok, prolaktin hafif yüksek olabilir. Sap ya da hipotalamus lezyonu, kraniyofarenjiyom, metastaz, sarkoidoz ve Langerhans hücreli histiyositoz: AVP eksikliği eşlik eder. Lenfositik hipofizit: ACTH erken kaybolur, AVP eksikliği yarıdan fazlasında. Kontrol noktası inhibitörü: ACTH ve TSH en sık, AVP eksikliği atipik. Sheehan sendromu: GH ve prolaktin eksikliği en sık ve en ağır. Genetik: kaskadın bozulan basamağından türeyen soylar eksik; PIT-1'de GH, PRL, TSH; PROP1de ACTH ileri yaşta. Anti-PIT-1 hipofizitinde aynı örüntü edinsel olarak, timoma ya da başka tümörle.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="56" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="38" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Hormon örüntüsü nedeni düşündürür</text><text x="320" y="56" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Önce sor: AVP eksikliği var mı, ACTH ne zaman gitti?</text></g><g class="a" style="animation-delay:2.40s"><line x1="220" y1="70" x2="165" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="420" y1="70" x2="475" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="102" width="300" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="164" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Hipofiz içi kitle (adenom)</text><text x="164" y="154" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">GH → LH/FSH → TSH → ACTH</text><text x="164" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">AVP eksikliği hemen hiç yok</text><text x="164" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Sap basısı: PRL hafif yüksek</text><rect x="326" y="102" width="300" height="112" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="476" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Sap ya da hipotalamus</text><text x="476" y="154" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Kraniyofarenjiyom · metastaz</text><text x="476" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Sarkoidoz · LHH</text><text x="476" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">AVP eksikliği eşlik eder</text></g><g class="a" style="animation-delay:4.80s"><rect x="14" y="234" width="300" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="164" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Lenfositik hipofizit</text><text x="164" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">ACTH erken: %59–86</text><text x="164" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">AVP eksikliği yarıdan fazlasında</text><text x="164" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Gebelik sonu ve doğum sonrası</text><rect x="326" y="234" width="300" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="476" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Kontrol noktası inhibitörü</text><text x="476" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">ACTH ve TSH en sık</text><text x="476" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">AVP eksikliği atipik:</text><text x="476" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">varsa metastazı ara</text></g><g class="a" style="animation-delay:7.20s"><rect x="14" y="366" width="300" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="164" y="391" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Sheehan sendromu</text><text x="164" y="409" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Doğumda ağır kanama</text><text x="164" y="427" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">GH ve PRL eksikliği öteki</text><text x="164" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">nedenlerden sık ve ağır</text><text x="164" y="463" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Emzirememe · adet dönmemesi</text><rect x="326" y="366" width="300" height="112" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="476" y="400" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Genetik ya da anti-PIT-1</text><text x="476" y="418" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">PIT-1: GH · PRL · TSH</text><text x="476" y="436" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">PROP1: ACTH ileri yaşta</text><text x="476" y="454" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Anti-PIT-1: timoma, tümör</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="498" width="612" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="527" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Örüntü ipucudur, kural değildir</text><text x="320" y="545" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Bir eksenin durumundan ötekisi çıkarılmaz:</text><text x="320" y="563" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">her hastada ACTH yeterliliği ayrıca sınanır</text></g>
</svg>
