<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">MEN1: 2012'den 2025'e ne değişti</title>
<desc id="d">2025 MEN1 kılavuzunun çıkış noktası fazla tanı ve fazla tedaviden kaçınmaktır; ilk kez Delphi uzlaşısı ve sistematik derlemelerle hazırlandı. Genetik test yaşamın ilk on yılında yapılır, 2012'de mümkün olan en erken yaşta, belirtisizlerde 5 yaştan önce öneriliyordu. Test ölçütleri inceltildi: 30 yaşın altında primer hiperparatiroidi, 40 yaşın altında pankreas NET'i, 19 yaşın altında her hipofiz tümörü ya da 30 yaşın altında fonksiyonel hipofiz tümörü, her yaşta timik NET ve gastrinoma. Çocukta kan taraması 10 yaşta başlar: kalsiyum, prolaktin ve IGF-1; PTH, açlık glukozu, insülin ve kromogranin A rutinden çıktı. Pankreas MR'ı 10 ile 15 yaş arasında başlar, normalse 2 ile 3 yılda bir; 2 santimetreye kadar fonksiyonsuz tümörde izlem standarttır. Toraks taraması 20 ile 25 yaşta, 3 ile 5 yılda bir BT ile başlar; 2012'de 15 yaşta ve 1 ile 2 yılda birdi. Primer hiperparatiroidide hemen ameliyat gerekmez; ölçütler kalsiyumun üst sınırı 1 mg/dL'den fazla aşması, hedef organ tutulumu ve belirtili gastrinomadır; işlem subtotal paratiroidektomidir, total paratiroidektomi ve ototransplantasyon artık önerilmez, çocukta tek taraflı temizlik seçenektir. Yeni öneriler: kadında 40 yaşta meme taraması, belirtisiz hastada 75 yaşında rutin hipofiz MR'ının bırakılabilmesi ve hipofiz adenomlarının sporadik gibi tedavisi.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
