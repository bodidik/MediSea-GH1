" fill="#4c1d95">2025: ilk on yılda</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#4c1d95">2012: en erken, &lt;5 yaş</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#4c1d95">AACE: 5–10 yaş</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Kime test</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#4c1d95">PHPT &lt;30 · pNET &lt;40</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#4c1d95">hipofiz &lt;19 ya da fonks. &lt;30</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#4c1d95">timik NET, gastrinoma: her yaş</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Çocukta kan: 10 yaşta Ca, PRL, IGF-1</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#1e3a8a">PTH, açlık glukozu, insülin, kromogranin A rutinden çıktı</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Pankreas</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">MR 10–15 yaştan, 2–3 yılda bir</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">≤2 cm fonksiyonsuz: izlem</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">EUS, PET seçilmiş durumda</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Toraks</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">2025: 20–25 yaş, BT 3–5 yıl</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">2012: 15 yaş, 1–2 yıl</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">Fransız, AACE: BT ya da MR</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">PHPT: hemen ameliyat yok</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#7f1d1d">ölçüt: Ca &gt;1 mg/dL ÜS · hedef organ · belirtili gastrinoma</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#7f1d1d">subtotal paratiroidektomi; total + ototransplantasyon önerilmez</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#7f1d1d">çocukta tek taraflı temizlik seçenek</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Yeni öneriler</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#064e3b">kadında 40 yaşta meme taraması · 75 yaşta hipofiz MR'ı bırakılabilir</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#064e3b">hipofiz adenomu sporadik gibi tedavi edilir</text></g>
