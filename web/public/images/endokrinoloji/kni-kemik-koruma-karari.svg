<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kalsinörin inhibitörü alan hastada kemik koruma kararı</title>
<desc id="d">Önce değerlendirme yapılır: kalça ve omurga kemik yoğunluğu, omurga grafisi ya da vertebral kırık analizi, kalsiyum, fosfor, PTH ve 25-hidroksi D vitamini. Herkese genel önlemler uygulanır: en düşük glukokortikoid dozu, sigarayı bırakma, hareket, düşme önleme, kalsiyum ve D vitamini. Osteoporoz, frajilite kırığı ya da yüksek risk varsa bisfosfonat başlanır. Kalp, karaciğer, akciğer ya da kök hücre naklinde UpToDate tüm hastalara korunma tedavisi önerir; TEMD tüm hastaların başlangıç kemik yoğunluğundan bağımsız olarak değerlendirilmesini ister. Kreatinin klirensi 30–35 mL/dk altındaysa bisfosfonat genellikle önerilmez; bisfosfonat kullanılamıyorsa kalsitriol ya da hipogonadizm tedavisi seçenektir. On iki ay sonra kemik yoğunluğu stabilse ve prednizon günde 5 mg altına inmişse tedavi kesilebilir.</desc>
<style>
.a{animation-duration:11s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}18%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,31%{opacity:0;transform:translateY(8px)}34%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,31%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,46%{opacity:0;transform:translateY(8px)}49%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,46%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,61%{opacity:0;transform:translateY(8px)}64%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,61%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,77%{opacity:0;transform:translateY(8px)}80%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a m s1"><rect x="90" y="16" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">KNİ başlanacak / kullanıyor</text>
<text x="320" y="62" text-anchor="middle" font-size="12" fill="#0f172a">kalça + omurga DXA · omurga grafisi ya da VFA</text>
<text x="320" y="80" text-anchor="middle" font-size="12" fill="#0f172a">Ca · P · PTH · 25(OH)D</text></g>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,92 L320,118" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s2"><rect x="60" y="122" width="520" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="320" y="146" text-anchor="middle" font-size="14" font-weight="800" fill="#064e3b">Herkese genel önlemler</text>
<text x="320" y="166" text-anchor="middle" font-size="12" fill="#064e3b">en düşük glukokortikoid dozu · sigara bırakma · erken hareket · düşme önleme</text>
<text x="320" y="186" text-anchor="middle" font-size="12" fill="#064e3b">kalsiyum + D vitamini (dozlar kaynağa göre ayrışıyor)</text></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M230,198 L160,236" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M410,198 L480,236" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s3"><rect x="15" y="240" width="295" height="120" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
<text x="162" y="266" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">Osteoporoz · frajilite kırığı</text>
<text x="162" y="286" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">ya da yüksek risk</text>
<text x="162" y="310" text-anchor="middle" font-size="12" fill="#7f1d1d">bisfosfonat (ilk basamak)</text>
<text x="162" y="330" text-anchor="middle" font-size="12" fill="#7f1d1d">yüksek riskte IV zoledronik asit</text>
<text x="162" y="348" text-anchor="middle" font-size="12" fill="#7f1d1d">tercih edilebilir (UpToDate)</text></g>
<g class="a m s3"><rect x="330" y="240" width="295" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="477" y="266" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">KMY normal / osteopeni</text>
<text x="477" y="290" text-anchor="middle" font-size="12" fill="#1e3a8a">UpToDate: kalp, karaciğer, akciğer,</text>
<text x="477" y="308" text-anchor="middle" font-size="12" fill="#1e3a8a">kök hücre naklinde herkese korunma</text>
<text x="477" y="330" text-anchor="middle" font-size="12" fill="#1e3a8a">TEMD: başlangıç KMY'den bağımsız</text>
<text x="477" y="348" text-anchor="middle" font-size="12" fill="#1e3a8a">herkes tedavi yönünden değerlendirilir</text></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M162,360 L262,398" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M477,360 L378,398" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s4"><rect x="90" y="402" width="460" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="320" y="426" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">Böbrek sınırı</text>
<text x="320" y="446" text-anchor="middle" font-size="12" fill="#78350f">KrKl &lt;30–35 mL/dk: bisfosfonat genellikle önerilmez (UpToDate)</text>
<text x="320" y="466" text-anchor="middle" font-size="12" fill="#78350f">kullanılamıyorsa: kalsitriol (Ca izlemi) · hipogonadizm tedavisi</text></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,478 L320,500" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s5"><rect x="90" y="504" width="460" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="320" y="528" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">12. ay: yeniden değerlendir</text>
<text x="320" y="548" text-anchor="middle" font-size="12" fill="#0f172a">KMY stabil ve prednizon &lt;5 mg/gün → kesilebilir</text></g>
<g class="a s6"><text x="320" y="588" text-anchor="middle" font-size="11" fill="#475569">Kaynak: TEMD 2025; UpToDate (Shane, Rosen). Böbrek nakli ayrı değerlendirilir.</text></g>
</svg>
