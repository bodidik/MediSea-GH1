<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 840" width="640" height="840" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AVP reseptör alt tipleri ve sinyal yolakları</title>
<desc id="d">Arginin vazopressin üç reseptöre bağlanır. V1a, vasküler düz kas ve mezangiyal hücrede Gq/11, fosfolipaz C, IP3 ve DAG üzerinden hücre içi kalsiyumu artırır: güçlü vazokonstriksiyon. V1b (V3), ön hipofiz kortikotrop hücresinde Gq, PLC ve PKC üzerinden CRH ile sinerjik ACTH salınımı yapar. V2, toplayıcı kanal principal hücresinin bazolateral zarında Gs, adenilat siklaz, cAMP ve PKA yolunu uyarır; AQP2 vezikülleri apikal zara ekzositozla yerleşir, AQP2 sentezi de artar; su lümenden AQP2 ile hücreye, bazolateral AQP3 ve AQP4 ile kana geçer: antidiürez.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: avp-sema.cjs -->
