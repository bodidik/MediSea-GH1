.ciz{stroke-dasharray:1}
.a1{animation-name:a1}@keyframes a1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.a1 .ciz{animation-name:a1c}@keyframes a1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.a2{animation-name:a2}@keyframes a2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.a2 .ciz{animation-name:a2c}@keyframes a2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.a3{animation-name:a3}@keyframes a3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.a3 .ciz{animation-name:a3c}@keyframes a3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.a4{animation-name:a4}@keyframes a4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.a4 .ciz{animation-name:a4c}@keyframes a4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.a5{animation-name:a5}@keyframes a5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.a5 .ciz{animation-name:a5c}@keyframes a5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.a6{animation-name:a6}@keyframes a6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.a6 .ciz{animation-name:a6c}@keyframes a6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.a7{animation-name:a7}@keyframes a7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.a7 .ciz{animation-name:a7c}@keyframes a7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
