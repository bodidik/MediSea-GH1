<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gebelikte baskılanmış TSH: Graves hastalığı ile hCG aracılı hipertiroidinin ayrımı (TEMD 2025)</title>
<desc id="d">TEMD 2025'e göre klinik olarak hipertiroidi şüphesinde TSH ölçülür; TSH 0,1 mU/L'nin altındaysa serbest ya da total T4, T4 normalse total T3 bakılır. Aşikar hipertiroidi baskılanmış (0,1'in altında) ya da saptanamayan (0,01'in altında) TSH ile gebelik için normal aralığı aşan sT4 ve/veya sT3'e dayanır; total T4 ve T3 gebelikte TBG nedeniyle 1,5 kat yüksektir. İlk trimesterde sağlıklı gebede TSH alt sınırı 0,03–0,1 arasında değişir. hCG 10–12. haftada zirve yapar, beta alt birimi TSH'ye benzer; gestasyonel geçici tirotoksikoz gebeliklerin yüzde 1–3'ünde görülür ve 14–18. haftada düzelir. Hiperemezis gravidarum gebeliklerin yüzde 0,1–0,2'sinde, yüzde 5 ya da daha fazla kilo kaybıyla görülür; sT4 hafif yükselir, T3 yükselmeyebilir, guatr ve oftalmopati yoktur, genellikle tedavi gerekmez. Trofoblastik hastalıkta tanıda yüzde 55–60 klinik olarak belirgin hipertiroidi vardır. Graves'te guatr, oftalmopati, TRAb pozitifliği (yüzde 96–97) ve Doppler'de artmış akım vardır; radyonüklid görüntüleme gebelikte kontrendikedir. Aşikar hipertiroidi birkaç haftadan uzun ya da ilk trimesterden sonra sürüyorsa hCG aracılı olması olası değildir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
