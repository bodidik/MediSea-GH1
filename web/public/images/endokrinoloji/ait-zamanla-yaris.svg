<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" width="640" height="476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AİT'de zamanla yarış: ötiroidiye ulaşma süresi ile ölüm zamanlaması</title>
<desc id="d">Cappellani 2020 kohortunda (207 hasta) total tiroidektomi grubunda ötiroidiye ortanca 26. günde ulaşıldı. Medikal tedavi alan orta–ağır sol ventrikül sistolik disfonksiyonlu hastalarda ölümler ortanca 82. günde oldu; yani bu hastalar ötiroidiye ulaşmadan kaybedildi. Tip 2 hastalıkta prednizonla ortanca iyileşme 30 gündür, ama hastaların yüzde 16'sında 90 günü aşar (Bogazzi 2007). Düşük ejeksiyon fraksiyonunda AİT mortalitesi yüzde 30–50'ye çıkabilir (ETA 2018); bu yüzden ETA ve ATA, kalbi kötüleşen ya da tedaviye yanıtsız hastada gecikmeden tiroidektomi önerir.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: tiroid-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.e0{animation-name:e0}@keyframes e0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.e0 .ciz{animation-name:e0c}@keyframes e0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.b1{animation-name:b1}@keyframes b1{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.b1 .ciz{animation-name:b1c}@keyframes b1c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.b2{animation-name:b2}@keyframes b2{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.b2 .ciz{animation-name:b2c}@keyframes b2c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.b3{animation-name:b3}@keyframes b3{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.b3 .ciz{animation-name:b3c}@keyframes b3c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.e4{animation-name:e4}@keyframes e4{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.e4 .ciz{animation-name:e4c}@keyframes e4c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
.b1b{transform-box:fill-box;transform-origin:left center;animation-name:b1b}@keyframes b1b{0%,12%{transform:scaleX(0)}26%,100%{transform:scaleX(1)}}
.b2b{transform-box:fill-box;transform-origin:left center;animation-name:b2b}@keyframes b2b{0%,34%{transform:scaleX(0)}48%,100%{transform:scaleX(1)}}
.b3b{transform-box:fill-box;transform-origin:left center;animation-name:b3b}@keyframes b3b{0%,56%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
.bar{animation-duration:16s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-out}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
