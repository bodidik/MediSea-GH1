<rect width="640" height="476" fill="#ffffff"/>
<g class="a e0"><text x="320" y="28" font-size="15" font-weight="800" text-anchor="middle" fill="#0f172a">Kalp beklemez: hangi tedavi ne zaman ötiroidi getiriyor?</text><line x1="170" y1="60" x2="170" y2="330" stroke="#94a3b8"/><line x1="170" y1="60" x2="170" y2="330" stroke="#e2e8f0"/><text x="170" y="348" font-size="10.5" text-anchor="middle" fill="#64748b">0</text><line x1="296" y1="60" x2="296" y2="330" stroke="#e2e8f0"/><text x="296" y="348" font-size="10.5" text-anchor="middle" fill="#64748b">30</text><line x1="422" y1="60" x2="422" y2="330" stroke="#e2e8f0"/><text x="422" y="348" font-size="10.5" text-anchor="middle" fill="#64748b">60</text><line x1="548" y1="60" x2="548" y2="330" stroke="#e2e8f0"/><text x="548" y="348" font-size="10.5" text-anchor="middle" fill="#64748b">90</text><text x="380" y="366" font-size="10.5" font-weight="600" text-anchor="middle" fill="#64748b">gün</text></g>
<g class="a b1"><g class="a b1"><text x="160" y="95" font-size="12" font-weight="800" text-anchor="end" fill="#0f172a">Tiroidektomi</text><text x="160" y="111" font-size="10.5" font-weight="500" text-anchor="end" fill="#475569">ötiroidi (ortanca)</text><rect class="bar b1b" x="170" y="80" width="109.2" height="34" rx="6" fill="#16a34a"/><text x="287.2" y="102" font-size="13" font-weight="900" fill="#0f172a">26. gün</text></g></g>
<g class="a b2"><g class="a b2"><text x="160" y="175" font-size="12" font-weight="800" text-anchor="end" fill="#0f172a">Prednizon, tip 2</text><text x="160" y="191" font-size="10.5" font-weight="500" text-anchor="end" fill="#475569">iyileşme (ortanca)</text><rect class="bar b2b" x="170" y="160" width="126" height="34" rx="6" fill="#7c3aed"/><text x="304" y="182" font-size="13" font-weight="900" fill="#0f172a">30. gün</text></g><text x="366" y="182" font-size="11.5" font-weight="700" fill="#5b21b6">ama hastaların %16'sında 90 günü aşar</text></g>
<g class="a b3"><g class="a b3"><text x="160" y="255" font-size="12" font-weight="800" text-anchor="end" fill="#0f172a">Medikal, düşük LVEF</text><text x="160" y="271" font-size="10.5" font-weight="500" text-anchor="end" fill="#475569">ölüm (ortanca)</text><rect class="bar b3b" x="170" y="240" width="344.40000000000003" height="34" rx="6" fill="#dc2626"/><text x="522.4000000000001" y="262" font-size="13" font-weight="900" fill="#0f172a">82. gün</text></g></g>
<g class="a e4"><text x="320" y="382" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Çubuklar farklı çalışmalardan: tiroidektomi ve düşük LVEF Cappellani 2020 (207 hasta) · prednizon Bogazzi 2007 (66 hasta)</text><rect x="20" y="392" width="600" height="68" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="421.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Düşük LVEF'de mortalite %30–50 (ETA 2018)</text><text x="320" y="440.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ETA öneri 3 · ATA öneri 116: kalp kötüleşiyor ya da yanıt yoksa gecikmeden tiroidektomi</text></g>
</svg>
