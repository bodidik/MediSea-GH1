<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">LT4 alıp TSH'si normal olduğu hâlde belirtisi süren hastada karar yolu</title>
<desc id="d">ETA 2012'ye göre LT4 alan ve TSH'si normal olan hipotiroidi hastalarının yüzde 5–10'unda belirtiler sürer (TEMD 2025 aynı oranı verir). Önce ilaç uyumu ve TSH'nin referans aralıkta olduğu doğrulanır; anemi, hiperkalsemi, gizli enfeksiyon gibi tiroid dışı nedenler ile eşlik eden otoimmün hastalıklar dışlanır, tanı konmamış psikolojik eş hastalık da düşünülür (ATA/BTA/ETA 2021). Hastaya kronik hastalıkla baş etmesi için destek verilir; ETA yaklaşık 6 ay sonra belirtiler düzelmemişse kombinasyonun düşünülebileceğini söyler. Gebe ya da gebelik planlayan, ritim bozukluğu veya yerleşik kardiyovasküler hastalığı olan hastada kombinasyon denenmez. Deneme deneysel bir yaklaşım olarak, süresi baştan hastayla kararlaştırılarak yapılır: ETA 2012 3 ay, ATA/BTA/ETA 2021 3–6 ay der. Düzelme yoksa kombinasyon kesilir ve LT4 monoterapisine dönülür; düzelme varsa kalp ve kemik açısından izlenerek sürdürülebilir. ATA 2014 ve TEMD 2025 kombinasyonu rutin olarak önermez.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.k1{animation-name:k1}@keyframes k1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.k1 .ciz{animation-name:k1c}@keyframes k1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.k2{animation-name:k2}@keyframes k2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.k2 .ciz{animation-name:k2c}@keyframes k2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.k3{animation-name:k3}@keyframes k3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.k3 .ciz{animation-name:k3c}@keyframes k3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.k4{animation-name:k4}@keyframes k4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.k4 .ciz{animation-name:k4c}@keyframes k4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.k5{animation-name:k5}@keyframes k5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.k5 .ciz{animation-name:k5c}@keyframes k5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.k6{animation-name:k6}@keyframes k6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.k6 .ciz{animation-name:k6c}@keyframes k6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.k7{animation-name:k7}@keyframes k7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.k7 .ciz{animation-name:k7c}@keyframes k7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="640" height="700" fill="#ffffff"/>
<g class="a k1"><rect x="120" y="10" width="400" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="40.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">LT4 alıyor · TSH referans aralıkta</text><text x="320" y="59.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">ama yorgunluk, beyin sisi, kilo şikâyeti sürüyor — %5–10</text></g>
<g class="a k2"><path class="a ciz" pathLength="1" d="M320,82 L320,104" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="108" width="620" height="92" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="132.25" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">1 · Önce doğrula ve dışla</text><text x="320" y="152.25" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">ilaç uyumu · TSH gerçekten referansta mı</text><text x="320" y="169.25" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">anemi, hiperkalsemi, gizli enfeksiyon · eşlik eden otoimmün hastalık</text><text x="320" y="186.25" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">tanı konmamış psikolojik eş hastalık (ATA/BTA/ETA 2021)</text></g>
<g class="a k3"><path class="a ciz" pathLength="1" d="M320,202 L320,224" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="228" width="620" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320" y="258.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">2 · Destek ver, bekle</text><text x="320" y="277.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">kronik hastalıkla baş etme · ETA: ~6 ay sonra düzelme yoksa kombinasyon düşünülebilir</text></g>
<g class="a k4"><path class="a ciz" pathLength="1" d="M320,300 L320,322" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="326" width="620" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="350.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">3 · Denenmeyecek hasta</text><text x="320" y="370.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">gebe ya da gebelik planlıyor · ritim bozukluğu · yerleşik kardiyovasküler hastalık</text><text x="320" y="387.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">(ETA 2012: gebelik + aritmi · ATA/BTA/ETA 2021: + KV hastalık)</text></g>
<g class="a k5"><path class="a ciz" pathLength="1" d="M320,404 L320,426" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="430" width="620" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="454.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">4 · Süreli deneme (deneysel, hastayla önceden kararlaştırılır)</text><text x="320" y="474.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">ETA 2012: 3 ay · ATA/BTA/ETA 2021: 3–6 ay</text><text x="320" y="491.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">doz: Şekil 2 · izlem: 6–8 hafta sonra</text></g>
<g class="a k6"><path class="a ciz" pathLength="1" d="M170,508 L170,534" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#okY)"/><rect x="10" y="538" width="300" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="560.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Düzelme var</text><text x="160" y="579.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">sürdürülebilir; plasebo etkisi olabilir</text><text x="160" y="595.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">her vizitte nabız düzeni, EKG</text><text x="160" y="611.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">postmenopozal kadında 3 yılda bir DXA</text><path class="a ciz" pathLength="1" d="M470,508 L470,534" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><rect x="330" y="538" width="300" height="86" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="568.5" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Düzelme yok</text><text x="480" y="587.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">kombinasyonu KES</text><text x="480" y="603.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">LT4 monoterapisine dön</text></g>
<g class="a k7"><text x="320" y="656" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">ATA 2014 ve TEMD 2025: kombinasyonun LT4'e üstünlüğüne kanıt yetersiz, rutin kullanım önerilmez.</text><text x="320" y="680" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ETA 2012 (Wiersinga), ATA 2014, ATA/BTA/ETA 2021 (Jonklaas), TEMD 2025</text></g>
</svg>
