.su1{animation-name:su1}@keyframes su1{0%,9%{opacity:0;transform:none}10%{opacity:1;transform:none}16%{opacity:0;transform:translate(48px,-28.799999999999997px)}100%{opacity:0}}
.su2{animation-name:su2}@keyframes su2{0%,10%{opacity:0;transform:none}11%{opacity:1;transform:none}17%{opacity:0;transform:translate(-19.200000000000003px,48px)}100%{opacity:0}}
.avp0{animation-name:avp0}@keyframes avp0{0%,51%{opacity:0;transform:none}52%{opacity:1;transform:none}59%{opacity:1;transform:translate(-60px,40px)}61%,100%{opacity:0;transform:translate(-60px,44px)}}
.avp1{animation-name:avp1}@keyframes avp1{0%,53%{opacity:0;transform:none}54%{opacity:1;transform:none}61%{opacity:1;transform:translate(0px,40px)}63%,100%{opacity:0;transform:translate(0px,44px)}}
.avp2{animation-name:avp2}@keyframes avp2{0%,55%{opacity:0;transform:none}56%{opacity:1;transform:none}63%{opacity:1;transform:translate(60px,40px)}65%,100%{opacity:0;transform:translate(60px,44px)}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
