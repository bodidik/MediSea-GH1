.hipo{animation-name:hipo}@keyframes hipo{0%,48%{opacity:0;transform:translateY(7px)}51%,100%{opacity:1;transform:none}}
.hipo .ciz{animation-name:hipoc}@keyframes hipoc{0%,48%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
