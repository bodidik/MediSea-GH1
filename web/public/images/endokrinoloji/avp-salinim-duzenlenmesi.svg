<text x="475" y="16" font-size="11" font-weight="900" text-anchor="middle" fill="#b91c1c" letter-spacing="1">HACİM / BASINÇ KOLU</text>

<g class="a osm"><rect x="30" y="24" width="270" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="165" y="51" font-size="14.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Plazma osmolalitesi ↑</text><text x="165" y="69" font-size="12" font-weight="500" text-anchor="middle" fill="#0c4a6e">%1–2 artış (&gt;288) · &lt;280’de baskılı</text></g>
