.bpanel .ciz{animation-name:bpanelc}@keyframes bpanelc{0%,26%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.nts{animation-name:nts}@keyframes nts{0%,30%{opacity:0;transform:translateY(7px)}33%,100%{opacity:1;transform:none}}
.nts .ciz{animation-name:ntsc}@keyframes ntsc{0%,30%{stroke-dashoffset:1}34%,100%{stroke-dashoffset:0}}
