.bok .ciz{animation-name:bokc}@keyframes bokc{0%,34%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.hip{animation-name:hip}@keyframes hip{0%,37%{opacity:0;transform:translateY(7px)}40%,100%{opacity:1;transform:none}}
