.opanel .ciz{animation-name:opanelc}@keyframes opanelc{0%,5%{stroke-dashoffset:1}9%,100%{stroke-dashoffset:0}}
.otext{animation-name:otext}@keyframes otext{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.otext .ciz{animation-name:otextc}@keyframes otextc{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.ook{animation-name:ook}@keyframes ook{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.ook .ciz{animation-name:ookc}@keyframes ookc{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.hac{animation-name:hac}@keyframes hac{0%,21%{opacity:0;transform:translateY(7px)}24%,100%{opacity:1;transform:none}}
.hac .ciz{animation-name:hacc}@keyframes hacc{0%,21%{stroke-dashoffset:1}25%,100%{stroke-dashoffset:0}}
