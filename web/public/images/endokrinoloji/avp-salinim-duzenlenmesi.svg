<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" width="640" height="790" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AVP salınımının düzenlenmesi</title>
<desc id="d">İki kol hipotalamusta birleşir. Osmotik kol: plazma osmolalitesi yüzde 1–2 artınca (288 mOsm/kg üstü; 280 altında salınım baskılı) OVLT ve SFO'daki osmoreseptör hücreler su kaybedip büzüşür, TRPV1 ve TRPV4 kanalları açılır. Hacim kolu: efektif dolaşan hacim ya da kan basıncı yüzde 10–15 ve üzeri düşünce sol atriyum ve büyük venlerdeki düşük basınçlı, karotis sinüs ve arkus aortadaki yüksek basınçlı baroreseptörler N. IX ve N. X ile NTS üzerinden uyarı taşır. SON ve PVN magnoselüler nöronları uyarılır; bulantı, stres ve ağrı uyarır, ANP ve kortizol baskılar. Arka hipofiz AVP salar: böbrekte V2 ile serbest su geri emilir, susama merkezi (eşiği AVP eşiğinden birkaç mOsm/kg yüksek) su içmeyi başlatır; serum osmolalitesi normale döner. Dolaşım hacmi yasası: ciddi hacim kaybında baroreseptör uyarısı hipoosmotik inhibisyonu bastırır.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: avp-reg-sema.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
