<g class="a m7"><path class="a ciz" pathLength="1" d="M150,494 L150,520" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#okA)"/><path class="a ciz" pathLength="1" d="M490,494 L490,520" stroke="#9333ea" stroke-width="2.4" fill="none" marker-end="url(#okP)"/><rect x="20" y="524" width="260" height="92" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150" y="549.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Hedef: sentezi kes</text><text x="150" y="568.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">metimazol (yüksek doz, yavaş yanıt)</text><text x="150" y="584.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">± perklorat: iyot alımını ↓</text><text x="150" y="600.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">glukokortikoid önerilmez (ETA)</text><rect x="360" y="524" width="260" height="92" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="490" y="549.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Hedef: inflamasyonu söndür</text><text x="490" y="568.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">oral glukokortikoid</text><text x="490" y="584.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">tiyonamidin yeri yok</text><text x="490" y="600.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">(Bogazzi 2009)</text></g>
