<g class="a m2"><path class="a ciz" pathLength="1" d="M220,108 C170,130 150,140 150,158" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#okA)"/><path class="a ciz" pathLength="1" d="M420,108 C470,130 490,140 490,158" stroke="#9333ea" stroke-width="2.4" fill="none" marker-end="url(#okP)"/><text x="150" y="176" font-size="14" font-weight="900" text-anchor="middle" fill="#92400e">TİP 1 · iyot yükü</text><text x="490" y="176" font-size="14" font-weight="900" text-anchor="middle" fill="#6b21a8">TİP 2 · yıkıcı tiroidit</text></g>
<g class="a m3"><rect x="20" y="188" width="260" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150" y="215.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Zemin: anormal tiroid</text><text x="150" y="234.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">otonom nodül · çok nodüllü guatr</text><text x="150" y="250.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">gizli Graves</text><rect x="360" y="188" width="260" height="80" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="490" y="215.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Zemin: normal tiroid</text><text x="490" y="234.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">amiodaron + desetilamiodaron</text><text x="490" y="250.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">foliküler hücreye doğrudan toksik</text></g>
<g class="a m4"><path class="a ciz" pathLength="1" d="M150,270 L150,296" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#okA)"/><path class="a ciz" pathLength="1" d="M490,270 L490,296" stroke="#9333ea" stroke-width="2.4" fill="none" marker-end="url(#okP)"/><rect x="20" y="300" width="260" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150" y="327.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Sentez ↑ (Jod-Basedow)</text><text x="150" y="346.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">fazla iyot hammadde olur</text><text x="150" y="362.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">YENİ hormon üretilir</text><rect x="360" y="300" width="260" height="80" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="490" y="327.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Folikül yıkılır</text><text x="490" y="346.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">depolanmış T4/T3 sızar</text><text x="490" y="362.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">yeni sentez YOK</text></g>
<g class="a m5"><rect x="20" y="396" width="260" height="96" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="150" y="423.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">İpuçları</text><text x="150" y="442.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">Doppler: vaskülarite ↑</text><text x="150" y="458.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">erken başlar (ortanca 3,5 ay)</text><text x="150" y="474.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">TRAb Graves zemininde (+)</text><rect x="360" y="396" width="260" height="96" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="490" y="423.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">İpuçları</text><text x="490" y="442.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">Doppler: vaskülarite ↓</text><text x="490" y="458.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">geç başlar (ortanca 30 ay)</text><text x="490" y="474.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">ilaç kesildikten sonra da (38/200, 36'sı tip 2)</text></g>
