<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Amiodaron ilişkili tirotoksikozun iki mekanizması: iyot yükü ve folikül yıkımı</title>
<desc id="d">Amiodaronun ağırlığının yüzde 37'si iyottur; 200 mg'lık tablette 75 mg iyot vardır. Yağda birikir ve etkisi aylarca sürer; kalpte T4'ün T3'e dönüşümünü engeller. Tip 1'de iyot yükü otonom nodül ya da gizli Graves zemininde yeni hormon sentezini artırır (Jod-Basedow); Doppler'de vaskülarite artmıştır, başlangıç erkendir (ortanca 3,5 ay). Tip 2'de amiodaron ve metabolitleri foliküler hücreye doğrudan toksiktir; folikül yıkılır, depolanmış hormon dolaşıma sızar, yeni sentez yoktur; Doppler'de vaskülarite azalmıştır, başlangıç geçtir (ortanca 30 ay) ; 200 hastalık bir seride 38 hastada tirotoksikoz ilaç kesildikten ortalama 5,5 ay sonra başlamış, bunların 36'sı tip 2 çıkmıştır. Tedavi hedefi tip 1'de sentezi durdurmak (metimazol, gerekirse tiroidin iyot alımını azaltan perklorat), tip 2'de inflamasyonu söndürmektir (oral glukokortikoid). Mikst formda iki mekanizma birliktedir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: tiroid-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.m1{animation-name:m1}@keyframes m1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.m1 .ciz{animation-name:m1c}@keyframes m1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.m2{animation-name:m2}@keyframes m2{0%,11%{opacity:0;transform:translateY(7px)}14%,100%{opacity:1;transform:none}}
.m2 .ciz{animation-name:m2c}@keyframes m2c{0%,11%{stroke-dashoffset:1}15%,100%{stroke-dashoffset:0}}
.m3{animation-name:m3}@keyframes m3{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.m3 .ciz{animation-name:m3c}@keyframes m3c{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.m4{animation-name:m4}@keyframes m4{0%,33%{opacity:0;transform:translateY(7px)}36%,100%{opacity:1;transform:none}}
.m4 .ciz{animation-name:m4c}@keyframes m4c{0%,33%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.m5{animation-name:m5}@keyframes m5{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.m5 .ciz{animation-name:m5c}@keyframes m5c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.m6{animation-name:m6}@keyframes m6{0%,55%{opacity:0;transform:translateY(7px)}58%,100%{opacity:1;transform:none}}
.m6 .ciz{animation-name:m6c}@keyframes m6c{0%,55%{stroke-dashoffset:1}59%,100%{stroke-dashoffset:0}}
.m7{animation-name:m7}@keyframes m7{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.m7 .ciz{animation-name:m7c}@keyframes m7c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
.m8{animation-name:m8}@keyframes m8{0%,77%{opacity:0;transform:translateY(7px)}80%,100%{opacity:1;transform:none}}
.m8 .ciz{animation-name:m8c}@keyframes m8c{0%,77%{stroke-dashoffset:1}81%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
