<rect width="640" height="600" fill="#ffffff"/>
<g class="a d1"><text x="320" y="28" font-size="15" font-weight="800" text-anchor="middle" fill="#0f172a">Tanı anında dört değişken</text><rect x="8" y="44" width="148" height="92" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="82" y="77.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Yaş</text><text x="82" y="96.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">&lt;40 → 1 puan</text><text x="82" y="112.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">≥40 → 0</text><rect x="164" y="44" width="148" height="92" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="238" y="69.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Guatr</text><text x="238" y="88.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">belirgin görünüyor</text><text x="238" y="104.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">→ 2 puan</text><text x="238" y="120.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">görünmüyor/hafif → 0</text><rect x="320" y="44" width="148" height="92" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="394" y="77.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Serbest T4</text><text x="394" y="96.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">≥3,1 ng/dL → 1</text><text x="394" y="112.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">&lt;3,1 → 0</text><rect x="476" y="44" width="156" height="92" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="554" y="69.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">TBII (TRAb)</text><text x="554" y="88.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">&lt;6 U/L → 0</text><text x="554" y="104.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">6–19,9 → 1</text><text x="554" y="120.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">&gt;19,9 → 2</text></g>
<g class="a d2"><path class="a ciz" pathLength="1" d="M82,138 C110,190 230,200 300,212" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M238,138 C250,180 280,196 308,206" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M394,138 C390,180 360,196 332,206" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M554,138 C530,190 410,200 340,212" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><circle cx="320" cy="236" r="34" fill="#0f172a"/><text x="320" y="232" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff">TOPLAM</text><text x="320" y="250" font-size="15" font-weight="900" text-anchor="middle" fill="#fbbf24">0–6</text></g>
<g class="a d3"><path class="a ciz" pathLength="1" d="M300,262 C220,290 140,296 110,316" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M320,270 L320,316" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M340,262 C420,290 500,296 530,316" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="320" width="200" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="110" y="360.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">Sınıf I · 0–1 puan</text><text x="110" y="382.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">Nüks</text><text x="110" y="401.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">İsviçre %33,8</text><text x="110" y="420.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">İtalya %34</text><text x="110" y="439.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">Türkiye %12*</text><rect x="220" y="320" width="200" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="360.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Sınıf II · 2–3 puan</text><text x="320" y="382.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">Nüks</text><text x="320" y="401.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">İsviçre %59,4</text><text x="320" y="420.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">İtalya %49</text><text x="320" y="439.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">Türkiye %35*</text><rect x="430" y="320" width="200" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="530" y="360.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Sınıf III · 4–6 puan</text><text x="530" y="382.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">Nüks</text><text x="530" y="401.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">İsviçre %73,6</text><text x="530" y="420.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">İtalya %64</text><text x="530" y="439.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">Türkiye %53*</text></g>
