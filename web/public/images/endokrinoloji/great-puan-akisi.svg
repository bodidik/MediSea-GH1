<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">GREAT skoru: dört değişkenden sınıfa, sınıftan nüks riskine</title>
<desc id="d">GREAT skoru tanı anında dört değişkenle hesaplanır: 40 yaş altı 1 puan; belirgin görünen guatr 2 puan; serbest T4 3,1 ng/dL ve üstü 1 puan; TBII 6 ile 19,9 U/L arası 1, 19,9 üstü 2 puan. Toplam 0 ile 6 arasıdır. Sınıf I 0–1, sınıf II 2–3, sınıf III 4–6 puandır. Nüks oranı sınıf I'de İsviçre kohortunda yüzde 33,8, İtalya'da 34, Türkiye'de 12; sınıf II'de 59,4, 49 ve 35; sınıf III'te 73,6, 64 ve 53. Türk kohortunun sonlanımı kötü kontrollü hastalığı da kapsar. Genotip eklenen GREAT+ skorunda dört sınıfın nüks oranı yüzde 4, 21, 49 ve 85'tir; bu skor yalnız türetme kohortunda (178 hasta) gösterilmiştir.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: tiroid-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.d1{animation-name:d1}@keyframes d1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.d1 .ciz{animation-name:d1c}@keyframes d1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.d2{animation-name:d2}@keyframes d2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.d2 .ciz{animation-name:d2c}@keyframes d2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.d3{animation-name:d3}@keyframes d3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.d3 .ciz{animation-name:d3c}@keyframes d3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.d4{animation-name:d4}@keyframes d4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.d4 .ciz{animation-name:d4c}@keyframes d4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.d5{animation-name:d5}@keyframes d5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.d5 .ciz{animation-name:d5c}@keyframes d5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
