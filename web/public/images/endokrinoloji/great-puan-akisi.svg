<g class="a d5"><rect x="10" y="506" width="620" height="62" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="532.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">GREAT+ (klinik + PTPN22 + HLA): I+ %4 · II+ %21 · III+ %49 · IV+ %85</text><text x="320" y="551.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">Yalnız türetme kohortu (178 hasta) — dış doğrulaması yok</text><text x="320" y="590" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">* Türk kohortunda sonlanım = nüks + kötü kontrollü hastalık. Kaynak: Struja 2017, Masiello 2018, Zuhur 2019, Vos 2016</text></g>
</svg>
