<g class="a v2"><rect x="10" y="116" width="300" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="141.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#14532d">Bunevicius 1999 · 33 hasta</text><text x="160" y="161.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">50 µg LT4 → 12,5 µg LT3</text><text x="160" y="178.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">17 testin 6'sı, 15 VAS'ın 10'u daha iyi</text><text x="160" y="195.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">5 haftalık çapraz tasarım</text><rect x="330" y="116" width="300" height="96" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="141.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Grozinsky-Glasberg 2006</text><text x="480" y="161.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">11 RCT · 1216 hasta</text><text x="480" y="178.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">ağrı, depresyon, yorgunluk, YK: fark yok</text><text x="480" y="195.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">yan etki RR 1,19 (0,63–2,24)</text></g>
<g class="a v3"><rect x="10" y="222" width="300" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="247.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#14532d">Appelhof 2005 · 141 hasta</text><text x="160" y="267.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">tercih: LT4 %29,2 · 10:1 %41,3 · 5:1 %52,2</text><text x="160" y="284.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">tercih edenlerin %44'ünde TSH &lt;0,11</text><text x="160" y="301.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">tercih kilo kaybıyla ilişkili</text><rect x="330" y="222" width="300" height="96" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="247.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Saravanan 2005 · WATTS · 697</text><text x="480" y="267.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">kontrol kolunda %39 plasebo düzelmesi</text><text x="480" y="284.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">küçük üstünlük 3. ayda</text><text x="480" y="301.75" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">12. ayda kayboldu</text></g>
