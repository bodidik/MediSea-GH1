.v4 .ciz{animation-name:v4c}@keyframes v4c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.v5{animation-name:v5}@keyframes v5{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.v5 .ciz{animation-name:v5c}@keyframes v5c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.v6{animation-name:v6}@keyframes v6{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.v6 .ciz{animation-name:v6c}@keyframes v6c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
