<g class="a v6"><text x="320" y="620" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Tercih ile belirti puanı ayrışıyor; tercihi TSH düşüşü ve kilo kaybı kısmen açıklıyor.</text><text x="320" y="646" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0f172a">ATA/BTA/ETA 2021: genotip, rT3 ya da nöropsikolojik test hasta seçiminde yararlı görünmüyor.</text><text x="320" y="678" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: yayın özetleri (PubMed); ETA 2012; ATA/BTA/ETA 2021</text></g>
