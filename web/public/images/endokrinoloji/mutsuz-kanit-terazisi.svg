<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">LT4+LT3 kombinasyonunun kanıtı: tercih ve tek tek olumlu çalışmalar karşısında meta-analizler, güvenlik verisi</title>
<desc id="d">Lehine: Bunevicius 1999'da 33 hastada 50 µg LT4 yerine 12,5 µg LT3 verilince 17 bilişsel ve duygudurum testinin 6'sı, 15 görsel analog ölçeğin 10'u daha iyiydi. Appelhof 2005'te 141 hastada çalışma ilacını tercih oranı LT4 kolunda yüzde 29,2, 10:1 kombinasyonda 41,3, 5:1 kombinasyonda 52,2 idi; ama ikincil ölçütlerde fark yoktu, kombinasyonu tercih edenlerin yüzde 44'ünün TSH'si 0,11'in altındaydı ve tercih kilo kaybıyla ilişkiliydi. Panicker 2009'da DIO2 rs225014 CC genotipinde kombinasyonla iyilik puanı daha fazla düzeldi. Aleyhine: 11 randomize çalışma ve 1216 hastalık meta-analizde ağrı, depresyon, anksiyete, yorgunluk ve yaşam kalitesinde fark yoktu, yan etki de farklı değildi (RR 1,19; 0,63–2,24). 697 hastalık WATTS çalışmasında kontrol kolunda yüzde 39'luk plasebo düzelmesi görüldü, kombinasyonun küçük üstünlüğü 12. ayda kayboldu. 7 kör randomize çalışmanın meta-analizinde kombinasyonu tercih oranı yüzde 46,2 idi ve şanstan ayırt edilemedi. Appelhof'un genotip analizinde DIO2 polimorfizmleri iyilik hali ya da tercihle ilişkili bulunmadı. Güvenlik: İskoçya'da 400 LT3 kullanıcısında kardiyovasküler hastalık, atriyal fibrilasyon ve kırık artmadı, antipsikotik reçetesi arttı (HR 2,26); İsveç'te 11.147 LT3 kullanıcısında meme kanseri ve genel kanser artmadı.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
