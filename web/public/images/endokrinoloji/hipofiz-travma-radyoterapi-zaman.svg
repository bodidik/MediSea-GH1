<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Travmatik beyin hasarı ve radyoterapi: hipofiz yetmezliğinin zaman seyri</title>
<desc id="d">İki edinsel nedenin zaman seyri terstir. Travmatik beyin hasarında ön hipofiz eksikliği akut dönemde sıktır ve sonra azalır: 46 hastalık ardışık seride akut dönemde yüzde 76, 3. ayda yüzde 13, 12. ayda yüzde 11. Eksiklik ağır travmada 12. ayda yüzde 27, hafif-orta travmada yüzde 3'tür; en sık bozukluk GH yanıtının azalmasıdır. TEMD 2022 meta-analize göre kronik dönemde (en erken 6 ay–1 yıl) yüzde 10–20 hipopitüitarizm bildirir. Radyoterapide ise eksiklik yıllar içinde birikir: gamma bıçağı sonrası 3, 5 ve 10 yılda yüzde 10, 21,7 ve 53,3. Kranial ışınlamada 18 Gy ve üstü GH, 30–40 Gy üstü LH/FSH, TSH ve ACTH için risktir. Değerlendirme ışınlamadan 6 ay sonra, sonra yılda birdir.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.eks{animation-name:eks}@keyframes eks{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.eks .ciz{animation-name:eksc}@keyframes eksc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.tb{animation-name:tb}@keyframes tb{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.tb .ciz{animation-name:tbc}@keyframes tbc{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.tbn{animation-name:tbn}@keyframes tbn{0%,26%{opacity:0;transform:translateY(7px)}29%,100%{opacity:1;transform:none}}
.tbn .ciz{animation-name:tbnc}@keyframes tbnc{0%,26%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.rt{animation-name:rt}@keyframes rt{0%,42%{opacity:0;transform:translateY(7px)}45%,100%{opacity:1;transform:none}}
.rt .ciz{animation-name:rtc}@keyframes rtc{0%,42%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.rtn{animation-name:rtn}@keyframes rtn{0%,58%{opacity:0;transform:translateY(7px)}61%,100%{opacity:1;transform:none}}
.rtn .ciz{animation-name:rtnc}@keyframes rtnc{0%,58%{stroke-dashoffset:1}62%,100%{stroke-dashoffset:0}}
.not{animation-name:not}@keyframes not{0%,74%{opacity:0;transform:translateY(7px)}77%,100%{opacity:1;transform:none}}
.not .ciz{animation-name:notc}@keyframes notc{0%,74%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
