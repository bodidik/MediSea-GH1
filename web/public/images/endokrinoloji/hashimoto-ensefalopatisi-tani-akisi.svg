<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hashimoto ensefalopatisinde tanı ve tedavi akışı (UpToDate)</title>
<desc id="d">Açıklanamayan ensefalopatide uyumlu klinik ve yüksek anti-TPO ya da anti-Tg. Önce öteki tanıları dışla: lomber ponksiyon ve kültürler, EEG, gadolinyumlu MRG, deliryum laboratuvarı; gerekirse 14-3-3, sitoloji, otoimmün ensefalit antikorları, tümör taraması. Başka neden yoksa glukokortikoid denemesi (Grade 2C), varsa tiroid işlev bozukluğunu düzelt. Yanıt varsa klinik yanıta göre azalt; nüks ya da steroid intoleransında başka immünsüpresif. Yanıt yoksa tanıyı yeniden araştır.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="140" y="14" width="360" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Açıklanamayan ensefalopati</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Uyumlu klinik + yüksek anti-TPO / anti-Tg</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="76" x2="320" y2="104" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="60" y="106" width="520" height="100" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="134" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Önce öteki tanıları dışla</text><text x="320" y="152" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">LP + bakteri, virüs, mantar, mikobakteri kültürü</text><text x="320" y="170" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">EEG · gadolinyumlu MRG · deliryum laboratuvarı</text><text x="320" y="188" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Gerekirse: 14-3-3, sitoloji, ensefalit antikorları, tümör</text></g><g class="a" style="animation-delay:4.80s"><line x1="200" y1="206" x2="130" y2="246" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="440" y1="206" x2="510" y2="246" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="20" y="248" width="220" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="130" y="275" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Başka neden bulundu</text><text x="130" y="293" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Ona göre tedavi</text><rect x="380" y="248" width="240" height="62" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="500" y="275" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Başka neden yok</text><text x="500" y="293" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Glukokortikoid denemesi (2C)</text></g><g class="a" style="animation-delay:7.20s"><line x1="500" y1="310" x2="500" y2="334" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="300" y="336" width="320" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="460" y="363" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Tiroid işlevi bozuksa düzelt</text><text x="460" y="381" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Prednizon 50–150 mg/gün ya da önce IV</text></g><g class="a" style="animation-delay:9.60s"><line x1="400" y1="398" x2="330" y2="440" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="560" y1="398" x2="560" y2="440" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="170" y="442" width="230" height="100" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="285" y="470" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Yanıt var</text><text x="285" y="488" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Klinik yanıta göre azalt</text><text x="285" y="506" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Nüks / intolerans:</text><text x="285" y="524" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">başka immünsüpresif</text><rect x="420" y="442" width="200" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="520" y="470" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Yanıt yok</text><text x="520" y="488" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Tanıyı yeniden araştır</text><text x="520" y="506" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">CJD, dejeneratif</text><text x="520" y="524" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">demans?</text></g>
</svg>
