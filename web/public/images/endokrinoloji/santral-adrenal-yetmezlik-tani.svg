<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Santral adrenal yetmezlikte tanı akışı</title>
<desc id="d">Sabah 8 ile 9 arası kortizol ve DHEA-S. Kortizol 3 mcg/dL ve altında (UpToDate) ya da 3,6'nın altında (ClinicalKey) tanı konur. 18 ve üstünde, yeni yöntemlerde 13 ile 14 ve üstünde dışlanır. Arada kalırsa 250 mcg ACTH testi: 30. dakika 15'in, 60. dakika 18'in üstü normaldir. Son 4 ile 6 haftada gelişen eksiklikte test yalancı normal çıkabilir, 23 eşiği gerekebilir, 2 ile 6 ay sonra yeniden test. Tanı konunca sabah ACTH: yüksekse primer, düşük ya da normalse santral. Steroid ya da opioid öyküsü yoksa hipofiz MR ve öteki hipofiz hormonları.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="56" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="38" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Sabah 8–9 kortizol + DHEA-S</text><text x="320" y="56" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Krizde teste bekleme: önce hidrokortizon</text></g><g class="a" style="animation-delay:2.40s"><line x1="220" y1="70" x2="120" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="320" y1="70" x2="320" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="420" y1="70" x2="520" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="102" width="196" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="112" y="137" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">≤3 mcg/dL</text><text x="112" y="155" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">(&lt;3,6: %99,2 özgül)</text><text x="112" y="173" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Tanı konur</text><rect x="222" y="102" width="196" height="96" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="137" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Arada</text><text x="320" y="155" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">250 mcg ACTH testi</text><text x="320" y="173" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">30 dk &gt;15 · 60 dk &gt;18</text><rect x="430" y="102" width="196" height="96" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="528" y="137" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">≥18 mcg/dL</text><text x="528" y="155" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">yeni yöntemde ≥13–14</text><text x="528" y="173" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Dışlanır</text></g><g class="a" style="animation-delay:4.80s"><rect x="14" y="218" width="612" height="84" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="247" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Yeni eksiklik (&lt;4–6 hafta) ya da kısmi: test yalancı normal</text><text x="320" y="265" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Eşik &gt;23 gerekebilir · sınırdaysa 2–6 ay sonra yinele</text><text x="320" y="283" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Östrojen kortizolü yükseltir · kritik hastalık düşürür</text></g><g class="a" style="animation-delay:7.20s"><line x1="320" y1="302" x2="320" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="120" y="332" width="400" height="56" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Tanı kesinse sabah ACTH</text><text x="320" y="374" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Yüksek → primer · düşük ya da normal → santral</text></g><g class="a" style="animation-delay:9.60s"><line x1="220" y1="388" x2="165" y2="418" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="420" y1="388" x2="475" y2="418" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="420" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="164" y="448" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Steroid ya da opioid öyküsü</text><text x="164" y="466" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Glukokortikoid: ESE/ES 2024</text><text x="164" y="484" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">kesme ve sabah kortizolü</text><text x="164" y="502" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Opioid: ~%15</text><rect x="326" y="420" width="300" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="476" y="448" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Öykü yoksa</text><text x="476" y="466" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Hipofiz MR (mikroadenom yapmaz)</text><text x="476" y="484" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">TSH · sT4 · IGF-1 · PRL</text><text x="476" y="502" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">LH/FSH · testosteron ya da E2</text></g><g class="a" style="animation-delay:12.00s"><rect x="14" y="540" width="612" height="50" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="570" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Hipotiroidi de varsa önce glukokortikoid, sonra levotiroksin</text></g>
</svg>
