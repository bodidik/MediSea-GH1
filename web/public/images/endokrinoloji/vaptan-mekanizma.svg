<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Vaptanların etki mekanizması: seçici akuarez</title>
<desc id="d">Tolvaptan (oral, seçici V2) ve konivaptan (IV, V1a ve V2) toplayıcı kanal esas hücresinin bazolateral V2 reseptörünü bloke eder. AVP bağlanamaz; adenilat siklaz, cAMP ve PKA uyarısı kesilir, AQP2 kanalları apikal zardan endositozla geri çekilir. Su lümende kalır ve elektrolit kaybı olmadan serbest su atılır (akuarez). Sonuçta idrar seyrelir ve serum sodyumu yükselir. Tolvaptan 15 mg ile başlanır, 30–60 mg'a titre edilir, hastanede başlanır, ilk 24 saatte sıvı kısıtlanmaz ve FDA kullanım süresini 30 günle sınırlar. Konivaptan 20 mg IV yükleme ve 20–40 mg/gün infüzyonla en fazla 4 gün verilir.</desc>
<!-- 14 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: di-semalar.cjs -->
<style>
.a{animation-duration:14s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.l{animation-name:l}@keyframes l{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.l .ciz{animation-name:lc}@keyframes lc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.avp{animation-name:avp}@keyframes avp{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.avp .ciz{animation-name:avpc}@keyframes avpc{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.blok{animation-name:blok}@keyframes blok{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.blok .ciz{animation-name:blokc}@keyframes blokc{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.camp{animation-name:camp}@keyframes camp{0%,32%{opacity:0;transform:translateY(7px)}35%,100%{opacity:1;transform:none}}
.camp .ciz{animation-name:campc}@keyframes campc{0%,32%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.aqp{animation-name:aqp}@keyframes aqp{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.aqp .ciz{animation-name:aqpc}@keyframes aqpc{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.su{animation-name:su}@keyframes su{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.su .ciz{animation-name:suc}@keyframes suc{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,76%{opacity:0;transform:translateY(7px)}79%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,76%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
.ilac{animation-name:ilac}@keyframes ilac{0%,86%{opacity:0;transform:translateY(7px)}89%,100%{opacity:1;transform:none}}
.ilac .ciz{animation-name:ilacc}@keyframes ilacc{0%,86%{stroke-dashoffset:1}90%,100%{stroke-dashoffset:0}}
.vs0{animation-name:vs0}@keyframes vs0{0%,64%{opacity:0;transform:none}65%{opacity:1;transform:none}74%{opacity:1;transform:translate(0px,-62px)}75%,100%{opacity:0;transform:translate(0px,-62px)}}
.vs1{animation-name:vs1}@keyframes vs1{0%,65.5%{opacity:0;transform:none}66.5%{opacity:1;transform:none}75.5%{opacity:1;transform:translate(0px,-62px)}76.5%,100%{opacity:0;transform:translate(0px,-62px)}}
.vs2{animation-name:vs2}@keyframes vs2{0%,67%{opacity:0;transform:none}68%{opacity:1;transform:none}77%{opacity:1;transform:translate(0px,-62px)}78%,100%{opacity:0;transform:translate(0px,-62px)}}
.vs3{animation-name:vs3}@keyframes vs3{0%,68.5%{opacity:0;transform:none}69.5%{opacity:1;transform:none}78.5%{opacity:1;transform:translate(0px,-62px)}79.5%,100%{opacity:0;transform:translate(0px,-62px)}}
.geri{animation-name:geri}@keyframes geri{0%,46%{transform:translateY(0)}58%,100%{transform:translateY(54px)}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="560" fill="#ffffff"/>

<g class="a l"><rect x="150" y="10" width="300" height="84" fill="#eff6ff"/><text x="300" y="30" font-size="11" font-weight="500" text-anchor="middle" fill="#1e40af">Tübül lümeni</text>
<rect x="150" y="96" width="300" height="230" rx="20" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.6"/><text x="300" y="200" font-size="11" font-weight="500" text-anchor="middle" fill="#6b21a8">esas hücre</text>
<rect x="150" y="328" width="300" height="70" fill="#fef2f2"/><text x="300" y="388" font-size="11" font-weight="500" text-anchor="middle" fill="#991b1b">Kan</text></g>
<g class="a avp"><circle cx="260" cy="356" r="7" fill="#f59e0b" stroke="#b45309"/><circle cx="340" cy="360" r="7" fill="#f59e0b" stroke="#b45309"/><text x="400" y="362" font-size="11" font-weight="800" text-anchor="middle" fill="#b45309">AVP</text></g>
<g class="a blok"><rect x="284" y="306" width="32" height="24" rx="5" fill="#a855f7" stroke="#6b21a8"/><text x="300" y="322" font-size="10.5" font-weight="800" text-anchor="middle" fill="#fff">V2</text><rect x="278" y="332" width="44" height="16" rx="8" fill="#dc2626"/><text x="300" y="344" font-size="10" font-weight="800" text-anchor="middle" fill="#fff">vaptan</text><text x="142" y="340" font-size="11" font-weight="700" text-anchor="end" fill="#b91c1c">AVP bağlanamaz</text></g>
<g class="a camp"><path d="M300,300 L300,250" stroke="#cbd5e1" stroke-width="2.4" stroke-dasharray="4 4"/><path d="M282,262 L318,290 M318,262 L282,290" stroke="#dc2626" stroke-width="3"/><text x="350" y="274" font-size="11" font-weight="800" text-anchor="start" fill="#b91c1c">cAMP · PKA ↓</text></g>
<g class="a aqp"><g class="a geri"><rect x="202" y="104" width="16" height="12" rx="3" fill="#0284c7"/><rect x="262" y="104" width="16" height="12" rx="3" fill="#0284c7"/><rect x="322" y="104" width="16" height="12" rx="3" fill="#0284c7"/><rect x="382" y="104" width="16" height="12" rx="3" fill="#0284c7"/></g><text x="300" y="238" font-size="11" font-weight="700" text-anchor="middle" fill="#0369a1">AQP2 endositozla geri çekilir</text></g>
<g class="hareket"><circle class="a vs0" cx="210" cy="92" r="5" fill="#38bdf8"/><circle class="a vs1" cx="270" cy="92" r="5" fill="#38bdf8"/><circle class="a vs2" cx="330" cy="92" r="5" fill="#38bdf8"/><circle class="a vs3" cx="390" cy="92" r="5" fill="#38bdf8"/></g>
<g class="a su"><text x="300" y="52" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Su lümende kalır → serbest su atılımı (akuarez)</text><text x="300" y="70" font-size="10.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">Na⁺, K⁺ atılımı artmaz</text></g>
<g class="a son"><rect x="20" y="410" width="600" height="50" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320" y="431.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">U<tspan font-size='9'>osm</tspan> ↓ · idrar hacmi ↑ · serum Na ↑</text><text x="320" y="448.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">yanıt hızlıdır: aşırı düzeltmeye karşı Na ilk 24 saatte sık izlenir</text></g>
<g class="a ilac"><rect x="20" y="472" width="292" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="166" y="489.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Tolvaptan · oral · seçici V2</text><text x="166" y="506.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">15 mg → 30–60 mg/gün</text><text x="166" y="523.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">hastanede başla · ilk 24 sa sıvı kısıtlama yok</text><text x="166" y="540.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e"></text><text x="166" y="540" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">FDA: en fazla 30 gün · karaciğer hastalığında yok</text><rect x="328" y="472" width="292" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="474" y="489.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Konivaptan · IV · V1a + V2</text><text x="474" y="506.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">20 mg yükleme (30 dk)</text><text x="474" y="523.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">20–40 mg/gün infüzyon · en fazla 4 gün</text><text x="474" y="540.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">güçlü CYP3A4 inhibitörü</text></g>

</svg>
