<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gebelikte tiroid: gebelik öncesinden doğum sonrasına yol haritası</title>
<desc id="d">Gebelik öncesinde levotiroksin alan kadında TSH 2,5'in altında tutulur, radyoaktif iyot sonrası gebelik 6 ay ertelenir. Birinci trimesterde hCG 10 ile 12. haftada tepe yapar ve TSH düşer; TBG yaklaşık iki katına çıkar, total T4 ve T3 1,5 kat yükselir. Testler trimestere özgü aralıkla yorumlanır; yoksa TSH için yaklaşık 0,1 ile 4 mU/L kullanılır, serbest T4 şüpheliyse total T4'e bakılır. Levotiroksin alan kadın gebelik doğrulanınca dozunu artırır: UpToDate Hashimoto'da yaklaşık yüzde 15, cerrahi ya da radyoaktif iyot sonrası yaklaşık yüzde 30 önerir; TSH 4 haftada bir bakılır. TSH 0,1'in altında ve serbest T4 yüksekse gebeliğin geçici tirotoksikozu ile Graves ayrılır: geçici tirotoksikoz gebelerin yüzde 1 ile 5'inde görülür, 18 ile 20. haftada düzelir ve antitiroid ilaç gerektirmez; Graves yüzde 0,5'ten azdır ve TRAb pozitiftir. Graves'te ilk trimesterde propiltiyourasil, 16. haftadan sonra metimazol verilir, dönüşüm yaklaşık 1'e 20'dir; serbest T4 gebeliğe özgü aralığın üst sınırında ya da hemen üstünde tutulur. TRAb başta ve 18. haftada bakılır; normalin üst sınırının üç katından yüksekse fetüs ultrasonla izlenir. Gebelik boyunca Türkiye'de günde 100 ile 150 mikrogram iyot önerilir, tuz kısıtlanmışsa 200 ile 250. Nodülde ultrason ve ince iğne biyopsisi güvenlidir, sintigrafi yapılmaz. Doğum sonrası tiroidit kadınların yüzde 5 ile 10'unda görülür.</desc>
