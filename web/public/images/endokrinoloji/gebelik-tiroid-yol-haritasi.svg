l="#1e3a8a">hCG 10–12. haftada tepe → TSH ↓</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">TBG ~2 kat</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">total T4/T3 ×1,5</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Testi doğru oku</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">trimestere özgü aralık</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">yoksa TSH ~0,1–4 mU/L</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">sT4 şüpheliyse total T4</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">LT4 alan gebe: dozu hemen artır</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#064e3b">~%15 (Hashimoto) · ~%30 (cerrahi/RAI) · 4 haftada bir TSH</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">TSH &lt;0,1 + sT4 ↑</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">geçici tirotoksikoz: %1–5,</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">18–20. haftada düzelir, ATİ yok</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">Graves: &lt;%0,5, TRAb +</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1