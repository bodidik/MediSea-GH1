<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">MEN1'de fonksiyonsuz pankreas NET'i: izlem mi, cerrahi mi?</title>
<desc id="d">Fonksiyonsuz pankreas nöroendokrin tümörü MEN1'de en sık pankreas tümörüdür, görüntülemeyle hastaların yüzde 30 ile 80'inde bulunur ve erken ölümün başlıca nedenlerindendir. Tarama 2025 kılavuzuna göre 10 ile 15 yaş arasında pankreas MR'ı ile başlar ve normalse 2 ile 3 yılda bir tekrarlanır; kromogranin A, pankreatik polipeptit ve glukagon gibi kan belirteçlerinin tanı değeri düşüktür. Yeni bulunan 2 santimetreden küçük tümörde MR 6 ile 12 ay sonra tekrarlanır. Karar boyuta göre verilir. 1 santimetreden küçük tümörde büyüme ve metastaz riski çok düşüktür, izlem yapılır. 1 ile 2 santimetre arasında veri azdır; hızlı büyüyen tümörü çıkarmak makuldür; 2 santimetreden küçük tümörlü hastaların yaklaşık yüzde 3'ünde uzak metastaz gelişir. 2 santimetre ve üstünde ya da büyüme gösteren tümörde cerrahi önerilir. Kötü gidişin işaretleri büyüme hızı, Dünya Sağlık Örgütü 2. derece ve artmış Ki-67, somatostatin reseptörü tutulumunun azalması ve FDG-PET'te artmış tutulumdur. Boyutu durağan, yılda 1 milimetreden az büyüyen tümörde görüntüleme 12 ay sonra, sonra 1 ile 2 yılda bir yapılır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
