reas MR 10–15 yaştan</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">normalse 2–3 yılda bir</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">CgA, PP, glukagon: yararsız</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Yeni bulunan &lt;2 cm</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">MR'ı 6–12 ay sonra tekrarla</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">EUS, SSTR-PET yalnız</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">kararı değiştirecekse</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Karar boyuta ve büyümeye göre</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#78350f">evreler aşağıda · her karar çok disiplinli kurulda</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">&lt;1 cm</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#064e3b">büyüme, metastaz riski</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#064e3b">çok düşük</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#064e3b">→ izlem</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">1 – &lt;2 cm</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">veri az; hızlı büyüyeni çıkar</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">&lt;2 cm'lilerin ~%3'ünde</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">uzak metastaz</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">≥2 cm ya da büyüme → cerrahi</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#7f1d1d">2025 kılavuzu, Fransız kılavuzu ve UpToDate uzlaşıyor</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#7f1d1d">Fransız: Ki-67, büyüme hızı, işlevsel görüntülemeyi de katar</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#7f1d1d">pankreas cerrahisinde komplikasyon %50, ağır %25</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Kötü gidiş işaretleri</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#4c1d95">büyüme hızı · WHO 2. derece / Ki-67 ↑ · SSTR tutulumu ↓ · FDG-PET ↑</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#4c1d95">durağan (&lt;1 mm/yıl): 12 ay sonra, sonra 1–2 yılda bir</text></g>
