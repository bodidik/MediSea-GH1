<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 686" width="640" height="686" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SGLT2 inhibitörü: hasta seçiminden ara vermeye</title>
<desc id="d">SGLT2 inhibitörü kullanımında beş adım. Birinci adım, kime: tip 2 diyabeti olup aterosklerotik kalp damar hastalığı, kalp yetersizliği ya da diyabetik böbrek hastalığı olan hastaya; diyabeti olmayan, NYHA sınıf 2 ile 4 arasındaki düşük ejeksiyon fraksiyonlu kalp yetersizliğinde ve kronik böbrek hastalığında; tip 2 diyabetli hastaların çoğunda ilk ilaç değildir, ilk tedavi diyet, kilo kaybı, egzersiz ve metformindir. İkinci adım, başlamadan önce: hacim durumu, serum kreatinini ve tahmini glomerüler filtrasyon hızı değerlendirilir; hipovolemi düzeltilir, diüretik ve tansiyon ilaçlarının dozu gözden geçirilir; kan şekeri 80 miligramın altına inerse insülin yüzde 10 ile 20, sülfonilüre yüzde 50 azaltılır. Üçüncü adım, glomerüler filtrasyon eşiği: yalnızca kan şekerini düşürmek için 30'un altında başlanmaz, ertugliflozin için eşik 45'tir; böbrek ve kalp koruması için 20'nin altında başlanmaz; tedavi sırasında 20'nin altına inen hastada büyük olasılıkla güvenle sürdürülebilir. Dördüncü adım, izlem: başlangıçta glomerüler filtrasyon hızı yüzde 30'a kadar düşebilir, sonra durulur; daha büyük düşüşte ilaç kesilir ve akut böbrek hasarı araştırılır; genital ve idrar yolu enfeksiyonu belirtileri ve ayak yarası izlenir. Beşinci adım, ara vermek: akut hastalıkta, uzun açlıkta, cerrahide ve ishal ya da sepsis gibi hacim kaybında ilaç bırakılır; bulantı, kusma ya da halsizlikte serum ketonuna bakılır; diyabetik ketoasidoz kan şekeri desilitrede 250 miligramın altındayken de gelişebilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,34%{opacity:0;transform:translateY(8px)}37%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,34%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,51%{opacity:0;transform:translateY(8px)}54%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,51%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(8px)}71%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,68%{stroke-dashoffset:1}73%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="686" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,130 L320,152" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,264 L320,286" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,398 L320,420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,532 L320,554" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="20" width="560" height="110" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="320" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">1 · Kime?</text><text x="320" y="72" text-anchor="middle" font-size="12" fill="#0c4a6e">Tip 2 DM + aterosklerotik KVH, kalp yetersizliği ya da DBH</text><text x="320" y="94" text-anchor="middle" font-size="12" fill="#0c4a6e">Diyabetsiz HFrEF (NYHA II–IV) ve KBH</text><text x="320" y="116" text-anchor="middle" font-size="12" fill="#0c4a6e">Çoğu tip 2 diyabette ilk ilaç değil (diyet, kilo, metformin)</text></g>
<g class="a m s2"><rect x="40" y="154" width="560" height="110" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">2 · Başlamadan önce</text><text x="320" y="206" text-anchor="middle" font-size="12" fill="#0f172a">Hacim durumu, kreatinin ve eGFR</text><text x="320" y="228" text-anchor="middle" font-size="12" fill="#0f172a">Hipovolemiyi düzelt; diüretik ve tansiyon ilacını gözden geçir</text><text x="320" y="250" text-anchor="middle" font-size="12" fill="#0f172a">İnsülin %10–20, sülfonilüre %50 azaltılabilir (glukoz &lt;80)</text></g>
<g class="a m s3"><rect x="40" y="288" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">3 · eGFR eşiği</text><text x="320" y="340" text-anchor="middle" font-size="12" fill="#064e3b">Yalnız glukoz için: &lt;30'da başlanmaz (ertugliflozin &lt;45)</text><text x="320" y="362" text-anchor="middle" font-size="12" fill="#064e3b">Böbrek ve kalp koruması için: &lt;20'de başlanmaz</text><text x="320" y="384" text-anchor="middle" font-size="12" fill="#064e3b">Düşen eGFR &lt;20'nin altına inse de büyük olasılıkla sürer</text></g>
<g class="a m s4"><rect x="40" y="422" width="560" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="450" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · İzlem</text><text x="320" y="474" text-anchor="middle" font-size="12" fill="#78350f">Başta eGFR %30'a kadar düşebilir, sonra durulur</text><text x="320" y="496" text-anchor="middle" font-size="12" fill="#78350f">Daha büyük düşüş: kes, akut böbrek hasarını araştır</text><text x="320" y="518" text-anchor="middle" font-size="12" fill="#78350f">Genital/idrar enfeksiyonu ve ayak muayenesi</text></g>
<g class="a m s5"><rect x="40" y="556" width="560" height="110" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="320" y="584" text-anchor="middle" font-size="15" font-weight="800" fill="#881337">5 · Ara ver</text><text x="320" y="608" text-anchor="middle" font-size="12" fill="#881337">Akut hastalık, uzun açlık, cerrahi, hacim kaybı</text><text x="320" y="630" text-anchor="middle" font-size="12" fill="#881337">Bulantı, kusma, halsizlikte keton bak (DKA)</text><text x="320" y="652" text-anchor="middle" font-size="12" fill="#881337">Övglisemik DKA: glukoz &lt;250 mg/dL olabilir</text></g>
</svg>
