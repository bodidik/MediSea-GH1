t-weight="800" text-anchor="middle" fill="#581c87">TİP 2</text><text x="530" y="289.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">prednizon 30–40 mg/gün</text><text x="530" y="307.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">2–4 hafta, sonra</text><text x="530" y="325.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">2–3 ayda azalt</text><text x="530" y="343.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">hafif olgu %20 kendiliğinden</text></g>
