<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Amiodaron ilişkili tirotoksikozda tedavi algoritması (ETA 2018, ATA 2016, TEMD 2025)</title>
<desc id="d">Önce kalp değerlendirilir: sol ventrikül işlevi bozuluyorsa, ağır altta yatan kalp hastalığı ya da malign aritmi varsa gecikmeden total tiroidektomi düşünülür. Kalp stabilse tip belirlenir. Tip 1: metimazol 40 mg/gün, ötiroidiye kadar (genelde 3–6 ay); ETA 4–6 hafta, günde 1 g'ı aşmayan sodyum perklorat ekleyebilir. Ötiroididen sonra tiroidektomi ya da RAI ile kalıcı tedavi. Tip 2: oral prednizon 30–40 mg/gün, 2–4 hafta sonra 2–3 ayda azaltılır; hafif tip 2'nin yaklaşık yüzde 20'si tedavisiz düzelir. Mikst ya da belirsiz form: ATA baştan metimazol ile steroidi birlikte önerir; ETA önce tiyonamid verir ve steroidin baştan mı 4–6 hafta sonra mı ekleneceğini açık bırakır. Tedaviye yanıt yoksa tiroidektomi. Amiodaronu kesme kararı kardiyologla verilir; tip 2'de sürdürmek ötiroidiyi geciktirebilir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: tiroid-semalar.cjs -->
