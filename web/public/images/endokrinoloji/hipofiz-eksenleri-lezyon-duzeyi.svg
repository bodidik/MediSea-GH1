<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipotalamus–hipofiz eksenleri ve lezyonun düzeyi</title>
<desc id="d">Hipotalamus salgılatıcı hormonlarını hipofiz sapı üzerinden ön hipofize ulaştırır; ön hipofiz ACTH, TSH, LH/FSH, GH ve prolaktin salgılar, hedef bez hormonları hipotalamus ve hipofizi negatif geri bildirimle baskılar. Hipofiz yetmezliği hipofizin kendi hastalığından ya da salgılatıcı hormonları azaltan hipotalamus hastalığından doğar. Hipotalamus ve sap hastalığı vazopressin eksikliği de yapabilir; yalnız hipofiz lezyonu yapmaz, çünkü vazopressin nöronlarının bir kısmı median eminenste sonlanır. Fonksiyonsuz makroadenomda sap basısı dopamin frenini kaldırır, prolaktin genellikle 100 ng/mL'nin altında yükselir. Santral eksiklikte hipofiz ve hedef bez hormonu birlikte düşük ya da uygunsuz normaldir.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.h{animation-name:h}@keyframes h{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.h .ciz{animation-name:hc}@keyframes hc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s{animation-name:s}@keyframes s{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.s .ciz{animation-name:sc}@keyframes sc{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.a{animation-name:a}@keyframes a{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.a .ciz{animation-name:ac}@keyframes ac{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.hd{animation-name:hd}@keyframes hd{0%,32%{opacity:0;transform:translateY(7px)}35%,100%{opacity:1;transform:none}}
.hd .ciz{animation-name:hdc}@keyframes hdc{0%,32%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.gb{animation-name:gb}@keyframes gb{0%,46%{opacity:0;transform:translateY(7px)}49%,100%{opacity:1;transform:none}}
.gb .ciz{animation-name:gbc}@keyframes gbc{0%,46%{stroke-dashoffset:1}50%,100%{stroke-dashoffset:0}}
.lz{animation-name:lz}@keyframes lz{0%,60%{opacity:0;transform:translateY(7px)}63%,100%{opacity:1;transform:none}}
.lz .ciz{animation-name:lzc}@keyframes lzc{0%,60%{stroke-dashoffset:1}64%,100%{stroke-dashoffset:0}}
.not{animation-name:not}@keyframes not{0%,76%{opacity:0;transform:translateY(7px)}79%,100%{opacity:1;transform:none}}
.not .ciz{animation-name:notc}@keyframes notc{0%,76%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a h"><rect x="170" y="14" width="300" height="62" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="41.5" font-size="15" font-weight="800" text-anchor="middle" fill="#581c87">Hipotalamus</text><text x="320" y="58.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">CRH · TRH · GnRH · GHRH · dopamin</text></g>
<g class="a s"><path class="a ciz" pathLength="1" d="M320,78 L320,118" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><text x="332" y="104" font-size="11" font-weight="500" text-anchor="start" fill="#581c87">hipofiz sapı (portal dolaşım)</text></g>
<g class="a a"><rect x="130" y="122" width="380" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="149.5" font-size="15" font-weight="800" text-anchor="middle" fill="#0c4a6e">Ön hipofiz</text><text x="320" y="166.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">ACTH · TSH · LH/FSH · GH · PRL</text></g>
<g class="a hd"><path class="a ciz" pathLength="1" d="M180,186 L90,236" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M270,186 L240,236" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M370,186 L400,236" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M460,186 L550,236" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="240" width="140" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="90" y="267.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Adrenal</text><text x="90" y="284.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">kortizol</text><rect x="170" y="240" width="140" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="240" y="267.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Tiroid</text><text x="240" y="284.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">T4</text><rect x="330" y="240" width="140" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="400" y="267.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Gonad</text><text x="400" y="284.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">testosteron / E2</text><rect x="480" y="240" width="140" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="550" y="267.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Karaciğer</text><text x="550" y="284.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">IGF-1</text></g>
<g class="a gb"><path class="a ciz" pathLength="1" d="M20,272 C2,272 2,45 168,45" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="1" marker-end="url(#okY)"/><text x="26" y="330" font-size="11" font-weight="700" text-anchor="start" fill="#15803d">negatif geri bildirim</text></g>
<g class="a lz"><rect x="20" y="352" width="290" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="165" y="391.5" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">Hipotalamus / sap lezyonu</text><text x="165" y="408.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">salgılatıcı hormon ↓ → hipofiz ↓</text><text x="165" y="425.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">vazopressin eksikliği (AVP-D) olabilir</text><text x="165" y="442.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">sap basısı: dopamin freni kalkar → PRL ↑</text><rect x="330" y="352" width="290" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="475" y="391.5" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">Hipofiz lezyonu</text><text x="475" y="408.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">hipofiz hücresi basıyla / yıkımla kaybolur</text><text x="475" y="425.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">tek başına AVP-D yapmaz</text><text x="475" y="442.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">(AVP nöronları median eminenste de biter)</text></g>
<g class="a not"><rect x="20" y="490" width="600" height="134" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="528" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Santral eksikliğin biyokimyasal imzası</text><text x="320" y="545" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">hedef bez hormonu düşük + hipofiz hormonu düşük ya da UYGUNSUZ normal</text><text x="320" y="562" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">fonksiyonsuz makroadenomda sap basısına bağlı PRL genellikle < 100 ng/mL</text><text x="320" y="579" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">hasar ani ya da yavaş, kısmi ya da tam, tek ya da çok hormonlu olabilir</text><text x="320" y="596" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">bir eksenin durumu ötekini göstermez — her eksen ayrı ölçülür</text></g>

</svg>
