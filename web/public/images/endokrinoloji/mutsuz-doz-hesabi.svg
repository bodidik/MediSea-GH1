<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">LT4+LT3 kombinasyonunda başlangıç dozunun hesabı ve izlem (ETA 2012 C yöntemi)</title>
<desc id="d">ETA 2012 kombinasyona LT4:LT3 ağırlık oranı 13:1 ile 20:1 arasında başlanmasını önerir. En basit yöntemde (C yöntemi) TSH'yi normalleştiren günlük LT4 dozu x ise LT3 dozu y = x/20, yeni LT4 dozu z = x − 3y olur; 3 katsayısı LT3 ile LT4'ün yaklaşık 1:3 terapötik eşdeğerliğinden gelir. Örnekler: x 100 µg ise LT3 5 µg, LT4 85 µg (yuvarlanınca 87,5); x 150 ise 7,5 ve 127,5 (125); x 200 ise 10 ve 170 (175); oran yaklaşık 17:1. ATA/BTA/ETA 2021 pratikte 100–200 µg LT4 alan hastaya 5 ya da 10 µg LT3 eklenip LT4'ün 12,5 ya da 25 µg azaltıldığını yazar. LT4 günde bir kez; LT3 mümkünse ikiye bölünür, küçük doz kahvaltıdan önce, büyük doz yatarken. Hazır kombine tabletlerin oranı 13:1'in altında olduğu için ayrı tabletler önerilir. İzlem: ETA 2012'ye göre 6–8 hafta sonra, sabah ilacından önce alınan kanda TSH, sT4, sT3 ve sT4/sT3 oranının normal olması hedeflenir; doz ayarında tek bileşen, tercihen LT3 değiştirilir. ATA/BTA/ETA 2021 ise doz sonrası 2–4. saatteki tepe T3 referans aralıkta ve TSH baskılanmamışsa dozun büyük olasılıkla güvenli olduğunu belirtir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.h1{animation-name:h1}@keyframes h1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.h1 .ciz{animation-name:h1c}@keyframes h1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.h2{animation-name:h2}@keyframes h2{0%,11%{opacity:0;transform:translateY(7px)}14%,100%{opacity:1;transform:none}}
.h2 .ciz{animation-name:h2c}@keyframes h2c{0%,11%{stroke-dashoffset:1}15%,100%{stroke-dashoffset:0}}
.h3{animation-name:h3}@keyframes h3{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.h3 .ciz{animation-name:h3c}@keyframes h3c{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.h4{animation-name:h4}@keyframes h4{0%,33%{opacity:0;transform:translateY(7px)}36%,100%{opacity:1;transform:none}}
.h4 .ciz{animation-name:h4c}@keyframes h4c{0%,33%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.h5{animation-name:h5}@keyframes h5{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.h5 .ciz{animation-name:h5c}@keyframes h5c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.h6{animation-name:h6}@keyframes h6{0%,55%{opacity:0;transform:translateY(7px)}58%,100%{opacity:1;transform:none}}
.h6 .ciz{animation-name:h6c}@keyframes h6c{0%,55%{stroke-dashoffset:1}59%,100%{stroke-dashoffset:0}}
.h7{animation-name:h7}@keyframes h7{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.h7 .ciz{animation-name:h7c}@keyframes h7c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
.h8{animation-name:h8}@keyframes h8{0%,77%{opacity:0;transform:translateY(7px)}80%,100%{opacity:1;transform:none}}
.h8 .ciz{animation-name:h8c}@keyframes h8c{0%,77%{stroke-dashoffset:1}81%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
