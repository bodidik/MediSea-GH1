<rect width="640" height="660" fill="#ffffff"/>
<g class="a h1"><rect x="10" y="10" width="620" height="84" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="37.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">x = TSH'yi normalleştiren günlük LT4 dozu</text><text x="320" y="58.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">LT3 dozu: y = x / 20   ·   yeni LT4 dozu: z = x − 3y</text><text x="320" y="76.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">"3": LT3 ile LT4'ün ~1:3 terapötik eşdeğerliği (10 hastalık çapraz RCT)</text></g>
<g class="a h2"><rect x="10" y="110" width="620" height="34" rx="8" fill="#f1f5f9"/><text x="80" y="132" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">LT4 (x)</text><text x="210" y="132" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">LT3 (y)</text><text x="350" y="132" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">LT4 (z) hesap</text><text x="480" y="132" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">LT4 yuvarlanmış</text><text x="580" y="132" font-size="11.5" font-weight="800" text-anchor="middle" fill="#334155">oran</text></g>
<g class="a h3"><text x="80" y="170" font-size="12" font-weight="800" text-anchor="middle" fill="#0f172a">100 µg</text><text x="210" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#0c4a6e">5 µg</text><text x="350" y="170" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">85</text><text x="480" y="170" font-size="12" font-weight="800" text-anchor="middle" fill="#14532d">87,5 µg</text><text x="580" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#78350f">17:1</text></g>
<g class="a h4"><text x="80" y="202" font-size="12" font-weight="800" text-anchor="middle" fill="#0f172a">150 µg</text><text x="210" y="202" font-size="12" font-weight="700" text-anchor="middle" fill="#0c4a6e">7,5 µg</text><text x="350" y="202" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">127,5</text><text x="480" y="202" font-size="12" font-weight="800" text-anchor="middle" fill="#14532d">125 µg</text><text x="580" y="202" font-size="12" font-weight="700" text-anchor="middle" fill="#78350f">17:1</text></g>
<g class="a h5"><text x="80" y="234" font-size="12" font-weight="800" text-anchor="middle" fill="#0f172a">200 µg</text><text x="210" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#0c4a6e">10 µg</text><text x="350" y="234" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">170</text><text x="480" y="234" font-size="12" font-weight="800" text-anchor="middle" fill="#14532d">175 µg</text><text x="580" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#78350f">17:1</text><text x="320" y="264" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0c4a6e">Pratik karşılığı (ATA/BTA/ETA 2021): 5–10 µg LT3 ekle, LT4'ü 12,5 ya da 25 µg azalt</text></g>
<g class="a h6"><rect x="10" y="284" width="300" height="116" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="160" y="311.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Nasıl verilir (ETA 2012)</text><text x="160" y="331.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">LT4 günde 1 kez</text><text x="160" y="348.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">LT3 mümkünse 2'ye bölünür:</text><text x="160" y="365.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">küçük doz kahvaltıdan önce</text><text x="160" y="382.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">BÜYÜK doz yatarken</text><rect x="330" y="284" width="300" height="116" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="311.5" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Hazır kombine tablet YOK</text><text x="480" y="331.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">oranları 13:1'in altında</text><text x="480" y="348.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ör. tiroid ekstresi ~4,2:1</text><text x="480" y="365.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ayrı LT4 + LT3 tableti kullan</text><text x="480" y="382.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">(ETA 2012, öneri 12)</text></g>
<g class="a h7"><rect x="10" y="426" width="300" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="463.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">İzlem · ETA 2012</text><text x="160" y="484.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">6–8 hafta sonra</text><text x="160" y="502.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">kan SABAH İLACINDAN ÖNCE</text><text x="160" y="520.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">TSH · sT4 · sT3 · sT4/sT3 normal</text><text x="160" y="538.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">ayar: tek bileşen, tercihen LT3</text><rect x="330" y="426" width="300" height="140" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="463.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">İzlem · ATA/BTA/ETA 2021</text><text x="480" y="484.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">doz sonrası 2–4. saat TEPE T3</text><text x="480" y="502.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">referans aralıkta</text><text x="480" y="520.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">+ TSH baskılanmamış</text><text x="480" y="538.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">= büyük olasılıkla güvenli doz</text></g>
<g class="a h8"><text x="320" y="598" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">İki kaynak T3'ü farklı saatte ölçüyor: çukur (ilaç öncesi) ile tepe (2–4. saat) aynı sayı değildir.</text><text x="320" y="632" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ETA 2012 Tablo 6 ve öneri 10–14; ATA/BTA/ETA 2021 Konu 11</text></g>
</svg>
