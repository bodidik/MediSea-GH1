<g class="a y2"><path class="a ciz" pathLength="1" d="M320,74 L320,98" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="120" y="102" width="400" height="96" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="129.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Beta bloker (ATA 2 · ETA 12)</text><text x="320" y="148.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">özellikle yaşlı · nabız &gt;90 · kalp hastalığı</text><text x="320" y="164.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">propranolol 20–40 mg 6 saatte bir</text><text x="320" y="180.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">ya da atenolol / bisoprolol</text></g>
<g class="a y3"><path class="a ciz" pathLength="1" d="M180,200 C140,222 110,228 100,244" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#okA)"/><text x="20" y="222" font-size="11" font-weight="800" text-anchor="start" fill="#d97706">kullanılamıyorsa</text><rect x="10" y="248" width="190" height="104" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="105" y="279.5" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Oral verapamil</text><text x="105" y="298.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">ya da diltiazem</text><text x="105" y="314.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">(TEMD · ATA)</text><text x="105" y="330.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">IV KKB: kollaps riski</text><path class="a ciz" pathLength="1" d="M320,200 L320,244" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><rect x="220" y="248" width="200" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="279.5" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Dekompanse KY</text><text x="320" y="298.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">taşikardiyomiyopati</text><text x="320" y="314.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">beta bloker de bozabilir</text><text x="320" y="330.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ kısa etkili esmolol</text><path class="a ciz" pathLength="1" d="M460,200 C500,222 530,228 540,244" stroke="#9333ea" stroke-width="2.4" fill="none" marker-end="url(#okP)"/><text x="620" y="222" font-size="11" font-weight="800" text-anchor="end" fill="#9333ea">AF varsa</text><rect x="440" y="248" width="190" height="104" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="535" y="279.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Antikoagülasyon</text><text x="535" y="298.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">ETA: her AF'de düşün</text><text x="535" y="314.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">UpToDate: standart</text><text x="535" y="330.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">risk skorlaması</text></g>
<g class="a y4"><path class="a ciz" pathLength="1" d="M535,354 L535,384" stroke="#9333ea" stroke-width="2.4" fill="none" marker-end="url(#okP)"/><rect x="380" y="388" width="250" height="92" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="505" y="413.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">İlaç ayarı</text><text x="505" y="432.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">warfarin duyarlılığı ↑ → doz ↓</text><text x="505" y="448.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">digoksin gereksinimi ↑</text><text x="505" y="464.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">(Williams · ETA)</text></g>
<g class="a y5"><path class="a ciz" pathLength="1" d="M320,354 L320,384" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#okY)"/><rect x="10" y="388" width="350" height="92" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="185" y="421.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Ötiroidi sağlandıktan sonra</text><text x="185" y="440.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">AF sürüyorsa kardiyoversiyon</text><text x="185" y="456.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">KY'de ekokardiyografiyi tekrarla</text></g>
<g class="a y6"><path class="a ciz" pathLength="1" d="M320,482 L320,508" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="70" y="512" width="500" height="92" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="545.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">AF, KY ya da iskemi geçirmiş yaşlı</text><text x="320" y="564.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">kalıcı tedavi, genellikle RAI</text><text x="320" y="580.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ETA öneri 44 (güçlü, orta kanıt)</text></g>
<g class="a y7"><text x="320" y="640" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">Beta bloker belirtiyi düzeltir, tiroidi değil: iki kolda tiroid testleri aynı hızda düzeldi (Tagami 2012)</text><text x="320" y="664" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ATA 2016, ETA 2018, TEMD 2025, UpToDate, Williams</text></g>
</svg>
