<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 684" width="640" height="684" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipertiroidide kalp tutulumunun yönetimi: hız kontrolü, antikoagülasyon, kalıcı tedavi</title>
<desc id="d">Temel tedavi altta yatan hipertiroidiyi düzeltmektir. Belirtili her tirotoksikozda beta bloker önerilir; özellikle yaşlıda, istirahat nabzı 90'ın üstünde olanda ve kalp hastalığında (ATA öneri 2). Propranolol 20–40 mg altı saatte bir ya da atenolol veya bisoprolol kullanılır; yüksek doz propranolol T4'ün T3'e dönüşümünü de azaltır. Beta bloker kullanılamıyorsa oral verapamil ya da diltiazem hızı kontrol eder; intravenöz kalsiyum kanal blokeri ise kollapsa yol açabilir. Dekompanse kalp yetmezliği ya da taşikardiyomiyopatide kısa etkili esmolol titre edilerek başlanabilir. Atriyal fibrilasyonda ETA her hastada antikoagülasyonu düşünmeyi önerir; UpToDate kararı standart risk değerlendirmesine bırakır. Hipertiroidide warfarin duyarlılığı artar, digoksin gereksinimi yükselir. AF, kalp yetmezliği ya da iskemi geçirmiş yaşlıda kalıcı tedavi, genellikle radyoaktif iyot önerilir (ETA öneri 44).</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.y1{animation-name:y1}@keyframes y1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.y1 .ciz{animation-name:y1c}@keyframes y1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.y2{animation-name:y2}@keyframes y2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.y2 .ciz{animation-name:y2c}@keyframes y2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.y3{animation-name:y3}@keyframes y3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.y3 .ciz{animation-name:y3c}@keyframes y3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.y4{animation-name:y4}@keyframes y4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.y4 .ciz{animation-name:y4c}@keyframes y4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.y5{animation-name:y5}@keyframes y5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.y5 .ciz{animation-name:y5c}@keyframes y5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.y6{animation-name:y6}@keyframes y6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.y6 .ciz{animation-name:y6c}@keyframes y6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.y7{animation-name:y7}@keyframes y7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.y7 .ciz{animation-name:y7c}@keyframes y7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
