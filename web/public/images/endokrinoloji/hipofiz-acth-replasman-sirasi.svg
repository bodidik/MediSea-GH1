<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sekonder adrenal yetmezliğin patofizyolojisi ve replasman sırası</title>
<desc id="d">ACTH eksikliğinde kortizol düşer ama aldosteron ACTH'ye değil renin-anjiyotensin sistemine bağlı olduğu için korunur: tuz kaybı, hacim azalması ve hiperkalemi olmaz, mineralokortikoid gerekmez. POMC ve ACTH artmadığından hiperpigmentasyon yoktur. Hiponatremi her iki adrenal yetmezlikte de görülür ve aldosteron değil kortizol eksikliğinin yol açtığı uygunsuz vazopressin salgısındandır; hiponatremi ile hiperkalemi birlikteyse primer adrenal yetmezlik düşünülür. Kortizol periferik damar tonusu için gereklidir; ağır eksiklik damar kollapsıyla öldürür. ACTH eksikliğine TSH ya da GH eksikliği eşlik ediyorsa adrenal kriz gelişmemesi için önce glukokortikoid verilir, sonra L-tiroksin ve GH başlanır. Hidrokortizon 15–20 mg/gün, 2–3 doza bölünür.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.a{animation-name:a}@keyframes a{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.a .ciz{animation-name:ac}@keyframes ac{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.k{animation-name:k}@keyframes k{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.k .ciz{animation-name:kc}@keyframes kc{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.ald{animation-name:ald}@keyframes ald{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.ald .ciz{animation-name:aldc}@keyframes aldc{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.na{animation-name:na}@keyframes na{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.na .ciz{animation-name:nac}@keyframes nac{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.pig{animation-name:pig}@keyframes pig{0%,48%{opacity:0;transform:translateY(7px)}51%,100%{opacity:1;transform:none}}
.pig .ciz{animation-name:pigc}@keyframes pigc{0%,48%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
.sira{animation-name:sira}@keyframes sira{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.sira .ciz{animation-name:sirac}@keyframes sirac{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.doz{animation-name:doz}@keyframes doz{0%,80%{opacity:0;transform:translateY(7px)}83%,100%{opacity:1;transform:none}}
.doz .ciz{animation-name:dozc}@keyframes dozc{0%,80%{stroke-dashoffset:1}84%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="620" fill="#ffffff"/>

<g class="a a"><rect x="170" y="14" width="300" height="54" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="37.5" font-size="15" font-weight="800" text-anchor="middle" fill="#581c87">Ön hipofiz: ACTH ↓</text><text x="320" y="54.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">POMC artmaz</text></g>
<g class="a k"><path class="a ciz" pathLength="1" d="M260,70 L170,104" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="108" width="290" height="86" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="165" y="130.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Kortizol ↓</text><text x="165" y="147.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">damar tonusu ↓ → postural hipotansiyon</text><text x="165" y="164.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ağırsa damar kollapsı</text><text x="165" y="181.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">halsizlik · iştahsızlık · hipoglisemi</text></g>
<g class="a ald"><path class="a ciz" pathLength="1" d="M380,70 L470,104" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><rect x="330" y="108" width="290" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="475" y="130.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">Aldosteron KORUNUR</text><text x="475" y="147.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">renin–anjiyotensin ACTH'den bağımsız</text><text x="475" y="164.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">tuz kaybı · hiperkalemi YOK</text><text x="475" y="181.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">→ fludrokortizon gerekmez</text></g>
<g class="a na"><path class="a ciz" pathLength="1" d="M165,196 L165,222" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/><rect x="20" y="226" width="290" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="165" y="249" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Hiponatremi</text><text x="165" y="266" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">kortizol ↓ → uygunsuz vazopressin</text><text x="165" y="283" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">(aldosteron değil)</text></g>
<g class="a pig"><rect x="330" y="226" width="290" height="70" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="475" y="249" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Hiperpigmentasyon YOK</text><text x="475" y="266" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Na ↓ + K ↑ birlikteyse</text><text x="475" y="283" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">→ primer adrenal yetmezlik düşün</text></g>
<g class="a sira"><text x="320" y="326" font-size="15" font-weight="800" text-anchor="middle" fill="#0f172a">Çoklu eksiklikte başlama sırası</text><rect x="20" y="340" width="180" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="110" y="366" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">1 · Glukokortikoid</text><text x="110" y="383" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ilk başlanır</text><text x="110" y="400" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">adrenal kriz önlenir</text><path class="a ciz" pathLength="1" d="M202,378 L226,378" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="230" y="340" width="180" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="366" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">2 · L-tiroksin</text><text x="320" y="383" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">~1,6 μg/kg/gün</text><text x="320" y="400" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">hedef sT4 üst yarı</text><path class="a ciz" pathLength="1" d="M412,378 L436,378" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="440" y="340" width="180" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="530" y="366" font-size="14" font-weight="800" text-anchor="middle" fill="#0c4a6e">3 · GH · seks steroidi</text><text x="530" y="383" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">GH: IGF-1 ile titre</text><text x="530" y="400" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">testten önce diğerleri</text></g>
<g class="a doz"><rect x="20" y="434" width="600" height="170" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="481.5" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Replasman ve hasta güvenliği (TEMD 2022)</text><text x="320" y="498.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">hidrokortizon 15–20 mg/gün, 2 doz (sabah yüksek) ya da 10 + 5 + 5 mg</text><text x="320" y="515.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">santral hipotiroidide TSH izlenmez — doz sT4'e göre</text><text x="320" y="532.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">stres döneminde glukokortikoid dozu artırılır; hasta bunu bilmeli</text><text x="320" y="549.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">hastalığını belirten kimlik / künye taşınır</text><text x="320" y="566.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">yılda en az iki kontrol: güvenilir izlem belirteci yok, klinik karar</text></g>

</svg>
