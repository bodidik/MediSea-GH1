<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipotonik poliürinin hücresel mekanizmaları</title>
<desc id="d">Toplayıcı kanal esas hücresinde üç durum. Normalde kandan gelen AVP bazolateral V2 reseptörüne bağlanır, cAMP ve PKA ile AQP2 vezikülleri apikal zara yerleşir; su lümenden AQP2, kana AQP3 ve AQP4 ile geçer ve idrar konsantre olur (800 mOsm/kg üstü). AVP eksikliğinde (santral DI) AVP yoktur, AQP2 veziküllerde kalır ve su lümende kalır. AVP direncinde (nefrojenik DI) AVP vardır ama AVPR2 ya da AQP2 mutasyonu, lityum veya hiperkalsemi nedeniyle yanıt yoktur. Her iki durumda idrar osmolalitesi 300 mOsm/kg'ın altındadır. Primer polidipside hücre sağlamdır; aşırı su alımı AVP'yi baskılar ve kronik poliüri medüller gradyanı yıkar.</desc>
<!-- 14 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: di-semalar.cjs -->
<style>
.a{animation-duration:14s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.p0{animation-name:p0}@keyframes p0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.p0 .ciz{animation-name:p0c}@keyframes p0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.p1{animation-name:p1}@keyframes p1{0%,6%{opacity:0;transform:translateY(7px)}9%,100%{opacity:1;transform:none}}
.p1 .ciz{animation-name:p1c}@keyframes p1c{0%,6%{stroke-dashoffset:1}10%,100%{stroke-dashoffset:0}}
.p2{animation-name:p2}@keyframes p2{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.p2 .ciz{animation-name:p2c}@keyframes p2c{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.avp{animation-name:avp}@keyframes avp{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.avp .ciz{animation-name:avpc}@keyframes avpc{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.v2{animation-name:v2}@keyframes v2{0%,32%{opacity:0;transform:translateY(7px)}35%,100%{opacity:1;transform:none}}
.v2 .ciz{animation-name:v2c}@keyframes v2c{0%,32%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.aqp{animation-name:aqp}@keyframes aqp{0%,42%{opacity:0;transform:translateY(7px)}45%,100%{opacity:1;transform:none}}
.aqp .ciz{animation-name:aqpc}@keyframes aqpc{0%,42%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.su{animation-name:su}@keyframes su{0%,52%{opacity:0;transform:translateY(7px)}55%,100%{opacity:1;transform:none}}
.su .ciz{animation-name:suc}@keyframes suc{0%,52%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.sonuc{animation-name:sonuc}@keyframes sonuc{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.sonuc .ciz{animation-name:sonucc}@keyframes sonucc{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
.pp{animation-name:pp}@keyframes pp{0%,82%{opacity:0;transform:translateY(7px)}85%,100%{opacity:1;transform:none}}
.pp .ciz{animation-name:ppc}@keyframes ppc{0%,82%{stroke-dashoffset:1}86%,100%{stroke-dashoffset:0}}
.d00{animation-name:d00}@keyframes d00{0%,52%{opacity:0;transform:none}53%{opacity:1;transform:none}64%{opacity:1;transform:translate(0px,250px)}65%,100%{opacity:0;transform:translate(0px,250px)}}
.d01{animation-name:d01}@keyframes d01{0%,53.5%{opacity:0;transform:none}54.5%{opacity:1;transform:none}65.5%{opacity:1;transform:translate(0px,250px)}66.5%,100%{opacity:0;transform:translate(0px,250px)}}
.d02{animation-name:d02}@keyframes d02{0%,55%{opacity:0;transform:none}56%{opacity:1;transform:none}67%{opacity:1;transform:translate(0px,250px)}68%,100%{opacity:0;transform:translate(0px,250px)}}
.d03{animation-name:d03}@keyframes d03{0%,56.5%{opacity:0;transform:none}57.5%{opacity:1;transform:none}68.5%{opacity:1;transform:translate(0px,250px)}69.5%,100%{opacity:0;transform:translate(0px,250px)}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
