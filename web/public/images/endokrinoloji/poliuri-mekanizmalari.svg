<rect width="640" height="500" fill="#ffffff"/>
<g class="a p0"><rect x="10" y="10" width="200" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="110" y="28" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Normal</text><text x="110" y="44" font-size="10.5" font-weight="500" text-anchor="middle" fill="#14532d">AVP → V2 → AQP2 zara</text><rect x="10" y="60" width="200" height="50" fill="#eff6ff"/><text x="110" y="80" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1e40af">Tübül lümeni (idrar)</text><rect x="20" y="110" width="180" height="170" rx="18" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.6"/><text x="110" y="200" font-size="10.5" font-weight="500" text-anchor="middle" fill="#6b21a8">esas hücre</text><rect x="10" y="280" width="200" height="60" fill="#fef2f2"/><text x="110" y="338" font-size="10.5" font-weight="500" text-anchor="middle" fill="#991b1b">Kan (interstisyum)</text><rect x="50" y="274" width="14" height="12" rx="3" fill="#0ea5e9"/><rect x="156" y="274" width="14" height="12" rx="3" fill="#0ea5e9"/><text x="110" y="300" font-size="9.5" font-weight="500" text-anchor="middle" fill="#0369a1">AQP3 · AQP4 (sabit)</text></g><g class="a avp"><circle cx="80" cy="318" r="6" fill="#f59e0b" stroke="#b45309"/><circle cx="100" cy="312" r="6" fill="#f59e0b" stroke="#b45309"/><text x="170" y="318" font-size="11" font-weight="800" text-anchor="middle" fill="#b45309">AVP</text></g><g class="a v2"><rect x="96" y="262" width="28" height="22" rx="5" fill="#a855f7" stroke="#6b21a8"/><text x="110" y="277" font-size="10" font-weight="800" text-anchor="middle" fill="#fff">V2</text><path class="a ciz" pathLength="1" d="M110,258 L110,218" stroke="#9333ea" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><text x="148" y="238" font-size="10" font-weight="700" text-anchor="middle" fill="#6b21a8">cAMP · PKA</text></g><g class="a aqp"><rect x="55" y="104" width="14" height="12" rx="3" fill="#0284c7"/><rect x="90" y="104" width="14" height="12" rx="3" fill="#0284c7"/><rect x="125" y="104" width="14" height="12" rx="3" fill="#0284c7"/><rect x="160" y="104" width="14" height="12" rx="3" fill="#0284c7"/><text x="110" y="150" font-size="10" font-weight="700" text-anchor="middle" fill="#0369a1">AQP2 apikal zarda</text></g><g class="hareket"><circle class="a d00" cx="62" cy="72" r="5" fill="#38bdf8"/><circle class="a d01" cx="107" cy="72" r="5" fill="#38bdf8"/><circle class="a d02" cx="142" cy="72" r="5" fill="#38bdf8"/><circle class="a d03" cx="177" cy="72" r="5" fill="#38bdf8"/></g><g class="a sonuc"><rect x="10" y="350" width="200" height="50" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="110" y="371.5" font-size="12.5" font-weight="800" text-anchor="middle" fill="#14532d">Su geri emilir</text><text x="110" y="388.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">konsantre idrar · U<tspan font-size='8'>osm</tspan> &gt;800</text></g><g class="a p1"><rect x="220" y="10" width="200" height="40" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="28" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">AVP-D (santral DI)</text><text x="320" y="44" font-size="10.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">AVP yok → AQP2 içeride</text><rect x="220" y="60" width="200" height="50" fill="#eff6ff"/><text x="320" y="80" font-size="10.5" font-weight="500" text-anchor="middle" fill="#1e40af">Tübül lümeni (idrar)</text><rect x="230" y="110" width="180" height="170" rx="18" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.6"/><text x="320" y="200" font-size="10.5" font-weight="500" text-anchor="middle" fill="#6b21a8">esas hücre</text><rect x="220" y="280" width="200" height="60" fill="#fef2f2"/><text x="320" y="338" font-size="10.5" font-weight="500" text-anchor="middle" fill="#991b1b">Kan (interstisyum)</text><rect x="260" y="274" width="14" height="12" rx="3" fill="#0ea5e9"/><rect x="366" y="274" width="14" height="12" rx="3" fill="#0ea5e9"/><text x="320" y="300" font-siz