eight="500" text-anchor="middle" fill="#1e40af">Tübül lümeni (idrar)</text><rect x="440" y="110" width="180" height="170" rx="18" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.6"/><text x="530" y="200" font-size="10.5" font-weight="500" text-anchor="middle" fill="#6b21a8">esas hücre</text><rect x="430" y="280" width="200" height="60" fill="#fef2f2"/><text x="530" y="338" font-size="10.5" font-weight="500" text-anchor="middle" fill="#991b1b">Kan (interstisyum)</text><rect x="470" y="274" width="14" height="12" rx="3" fill="#0ea5e9"/><rect x="576" y="274" width="14" height="12" rx="3" fill="#0ea5e9"/><text x="530" y="300" font-size="9.5" font-weight="500" text-anchor="middle" fill="#0369a1">AQP3 · AQP4 (sabit)</text></g><g class="a avp"><circle cx="500" cy="318" r="6" fill="#f59e0b" stroke="#b45309"/><circle cx="520" cy="312" r="6" fill="#f59e0b" stroke="#b45309"/><text x="590" y="318" font-size="11" font-weight="800" text-anchor="middle" fill="#b45309">AVP</text></g><g class="a v2"><rect x="516" y="262" width="28" height="22" rx="5" fill="#cbd5e1" stroke="#64748b"/><text x="530" y="277" font-size="10" font-weight="800" text-anchor="middle" fill="#fff">V2</text><path d="M510,256 L550,290 M550,256 L510,290" stroke="#dc2626" stroke-width="3"/><text x="530" y="238" font-size="9.5" font-weight="700" text-anchor="middle" fill="#b91c1c">AVPR2 / AQP2 mutasyonu</text><text x="530" y="251" font-size="9.5" font-weight="500" text-anchor="middle" fill="#b91c1c">lityum · hiperkalsemi</text></g><g class="a aqp"><circle cx="482" cy="150" r="9" fill="none" stroke="#0284c7" stroke-width="2"/><rect x="477" y="146" width="10" height="8" rx="2" fill="#0284c7"/><circle cx="517" cy="168" r="9" fill="none" stroke="#0284c7" stroke-width="2"/><rect x="512" y="164" width="10" height="8" rx="2" fill="#0284c7"/><circle cx="552" cy="150" r="9" fill="none" stroke="#0284c7" stroke-width="2"/><rect x="547" y="146" width="10" height="8" rx="2" fill="#0284c7"/><circle cx="587" cy="168" r="9" fill="n