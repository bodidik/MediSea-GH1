<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Osteoporoz: tanıdan ilaç tatiline</title>
<desc id="d">Osteoporozda yoldan geçiş. Tanı üç yoldan konur: DXA'da T-skoru −2,5 ya da altı, omurga ya da kalçada kırılganlık kırığı, ya da düşük kemik kütlesinde FRAX ile 10 yıllık majör kırık olasılığı yüzde 20 ya da kalça kırığı olasılığı yüzde 3 ve üstü. İkincil nedenler için biyokimya, kalsiyum, fosfor, alkalen fosfataz, kreatinin, tam kan sayımı ve 25-hidroksi D vitamini istenir; ipucuna göre PTH, çölyak serolojisi ve protein elektroforezi eklenir. Herkese kalsiyum ve D vitamini, egzersiz, sigarayı bırakma ve düşme önleme. Risk düzeyi ilacı seçer: yüksek riskte ağızdan bisfosfonat, alamayanda zoledronik asit, seçilmiş hastada denosumab; çok yüksek riskte (kırıkla T −2,5, kırıksız T −3,0, ağır ya da çoklu kırık) önce anabolik ilaç — teriparatid, abaloparatid ya da romosozumab — ve ardından antirezorptif. Bir ila iki yıl sonra aynı cihazda DXA; tedavide kırık olursa ya da T −2,5 altında kalırsa anaboliğe geçilir. Bisfosfonatta ağızdan beş yıl ya da damardan üç dozdan sonra risk düşükse ilaç tatili; denosumabda tatil yoktur, kesilirse bisfosfonat verilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
