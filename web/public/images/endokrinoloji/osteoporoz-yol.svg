<rect width="640" height="860" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M250,100 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M390,100 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,262 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,262 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,372 L165,404" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,372 L477,404" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,544 L220,574" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,544 L420,574" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,690 L320,718" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="60" y="18" width="520" height="82" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Tanı: üç yoldan biri</text><text x="320" y="64" text-anchor="middle" font-size="13" fill="#0f172a">T-skoru ≤ −2,5 · omurga/kalça kırılganlık kırığı</text><text x="320" y="84" text-anchor="middle" font-size="13" fill="#0f172a">osteopenide FRAX majör ≥ %20 ya da kalça ≥ %3</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="126" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">İkincil nedeni ara</text><text x="162.5" y="194" text-anchor="middle" font-size="13" fill="#1e3a8a">biyokimya · Ca · P · ALP · kreatinin</text><text x="162.5" y="214" text-anchor="middle" font-size="13" fill="#1e3a8a">tam kan · 25(OH)D</text><text x="162.5" y="234" text-anchor="middle" font-size="13" fill="#1e3a8a">ipucuyla: PTH · çölyak · SPEP</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="126" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Herkese</text><text x="477.5" y="194" text-anchor="middle" font-size="13" fill="#78350f">Ca 1200 mg + D 800 IU/gün</text><text x="477.5" y="214" text-anchor="middle" font-size="13" fill="#78350f">egzersiz · sigara · alkol</text><text x="477.5" y="234" text-anchor="middle" font-size="13" fill="#78350f">düşmeyi önleme</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="72" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="331" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Risk düzeyi ilacı seçer</text><text x="320" y="351" text-anchor="middle" font-size="13" fill="#0f172a">çok yüksek risk: kırık + T ≤ −2,5 · T ≤ −3,0 · çoklu kırık</text></g><g class="a m s5"><rect x="15" y="408" width="295" height="136" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="162.5" y="451" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Yüksek risk</text><text x="162.5" y="471" text-anchor="middle" font-size="13" fill="#064e3b">ağızdan bisfosfonat (alendronat)</text><text x="162.5" y="491" text-anchor="middle" font-size="13" fill="#064e3b">alamıyorsa: zoledronik asit</text><text x="162.5" y="511" text-anchor="middle" font-size="13" fill="#064e3b">seçilmişte: denosumab</text></g><g class="a m s6"><rect x="330" y="408" width="295" height="136" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="477.5" y="451" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Çok yüksek risk</text><text x="477.5" y="471" text-anchor="middle" font-size="13" fill="#7f1d1d">önce anabolik:</text><text x="477.5" y="491" text-anchor="middle" font-size="13" fill="#7f1d1d">teriparatid · abaloparatid</text><text x="477.5" y="511" text-anchor="middle" font-size="13" fill="#7f1d1d">romosozumab → sonra antirezorptif</text></g><g class="a m s7"><rect x="40" y="578" width="560" height="112" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="619" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">1–2 yıl sonra DXA, aynı cihaz</text><text x="320" y="639" text-anchor="middle" font-size="13" fill="#4c1d95">değişim LSC'yi aşmalı (yoksa ~%5)</text><text x="320" y="659" text-anchor="middle" font-size="13" fill="#4c1d95">tedavide kırık ya da T ≤ −2,5 → anaboliğe geç</text></g><g class="a m s8"><rect x="40" y="722" width="560" height="118" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="756" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Ne kadar sürer</text><text x="320" y="776" text-anchor="middle" font-size="13" fill="#1e3a8a">bisfosfonat: ağızdan 5 yıl / IV 3 doz → düşük riskte tatil</text><text x="320" y="796" text-anchor="middle" font-size="13" fill="#1e3a8a">en yüksek riskte ağızdan 10, IV 6 yıla kadar</text><text x="320" y="816" text-anchor="middle" font-size="13" fill="#1e3a8a">denosumab: tatil YOK — keserken bisfosfonat</text></g>
</svg>
