 font-weight="700" fill="#78350f">&lt;65–70 yaş</text><text x="164" y="261" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Belirti?</text></g><g class="a" style="animation-delay:7.20s"><line x1="290" y1="170" x2="270" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="350" y1="170" x2="370" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="224" y="212" width="96" height="70" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="272" y="243" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">&gt;65–70 yaş</text><text x="272" y="261" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Belirti?</text><rect x="326" y="212" width="96" height="70" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="374" y="243" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">&lt;65–70 yaş</text><text x="374" y="261" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">LT4</text></g><g class="a" style="animation-delay:9.60s"><line x1="530" y1="170" x2="530" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="434" y="212" width="192" height="70" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="530" y="243" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Her yaşta</text><text x="530" y="261" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">LT4</text></g><g class="a" style="animation-delay:12.00s"><line x1="164" y1="282" x2="164" y2="318" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="272" y1="282" x2="272" y2="318" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="164" y1="318" x2="272" y2="318" stroke="#64748b" stroke-width="1.6"/><line x1="218" y1="318" x2="218" y2="336" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="118" y="338" width="200" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="218" y="365" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Hipotiroidi belirtisi?</text><text x="218" y="383" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Evet → LT4 · Hayır → izlem</text></g><g class="a" style="animation-delay:14.40s"><rect x="14" y="426" width="612" height="80" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="320" y="453" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Başlama ve hedef</text><text x="320" y="471" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Yaşlı/KVH: 25–50 mcg · Genç Hashimoto: 1,0 mcg/kg</text><text x="320" y="489" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">TSH 6 haftada bir · Hedef: genç 0,5–2,5 · 65 yaş üstü 3–6 mU/L</text></g>
