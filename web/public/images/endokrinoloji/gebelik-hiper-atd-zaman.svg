.z2 .ciz{animation-name:z2c}@keyframes z2c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.z3{animation-name:z3}@keyframes z3{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.z3 .ciz{animation-name:z3c}@keyframes z3c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.z4{animation-name:z4}@keyframes z4{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.z4 .ciz{animation-name:z4c}@keyframes z4c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.z5{animation-name:z5}@keyframes z5{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.z5 .ciz{animation-name:z5c}@keyframes z5c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.z6{animation-name:z6}@keyframes z6{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.z6 .ciz{animation-name:z6c}@keyframes z6c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
