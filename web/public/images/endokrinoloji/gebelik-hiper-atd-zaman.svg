<g class="a z6"><text x="320" y="696" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Gestasyonel geçici tirotoksikoz ve hiperemezis bu çizelgenin dışında: ATD önerilmez.</text><text x="320" y="740" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: TEMD 2025, Bölüm 27 (Gebelik ve Hipertiroidi)</text></g>
