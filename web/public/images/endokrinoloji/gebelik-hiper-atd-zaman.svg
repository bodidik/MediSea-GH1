<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gebelikte antitiroid ilaç: hangi ilaç ne zaman, hangi doz, hangi hedef (TEMD 2025)</title>
<desc id="d">Düşük dozda MMI (5–10 mg/gün) ya da PTU (100–200 mg/gün) alan, ötiroid, Graves tanılı yeni gebe kadında teratojenite nedeniyle ilacı kesmek düşünülebilir; kesildikten sonra 1–2 haftada bir, ötiroid kalırsa 2. ve 3. trimesterde 2–4 haftada bir test yapılır. ATD altında hipertiroid olan ya da ötiroid kalmak için günde 5–10 mg'dan fazla MMI veya 100–200 mg'dan fazla PTU gereken gebede ilaca devam gerekebilir. Mümkünse ilk trimesterde ilaçtan kaçınılır; gerekiyorsa ilk trimesterde PTU, 16. haftadan sonra annede karaciğer yetmezliği riskini azaltmak için MMI önerilir. Dönüşüm oranı yaklaşık 1:20'dir: MMI 5 mg = PTU günde iki kez 50 mg. Başlangıç dozu düşüktür: MMI 5–10, karbimazol 5–10 mg, PTU 100–150 mg/gün. Ciddi hipertiroidide MMI 5–30 mg (ortalama 10–20), karbimazol 10–40 mg, PTU 100–600 mg (ortalama 200–400). MMI aplasia cutis, koanal veya özofageal atrezi, umbilikosel dahil karın duvarı kusurları, göz, üriner sistem ve ventriküler septal defektlerle; PTU yüz ve boyun kistleri ve idrar yolu anomalileri gibi hafif kusurlarla ilişkilendirilmiştir. Beta bloker (metoprolol 25–50 mg/gün, propranolol 6–8 saatte bir 20 mg) 2–6 haftada kesilir. Hedef: maternal sT4 trimestere özgü aralığın üst sınırında ya da hemen üzerinde, TSH referansın altında (yaklaşık 0,1–0,3). Testler 2–4 haftada bir. Üçüncü trimesterde hastaların yüzde 20–30'unda ATD kesilebilir. Tiroidektomi için en uygun zaman ikinci trimesterdir; hazırlıkta beta bloker ve 7–10 gün potasyum iyodür (50–100 mg/gün).</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
