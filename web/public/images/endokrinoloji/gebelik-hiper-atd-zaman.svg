.z1{animation-name:z1}@keyframes z1{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.z1 .ciz{animation-name:z1c}@keyframes z1c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
