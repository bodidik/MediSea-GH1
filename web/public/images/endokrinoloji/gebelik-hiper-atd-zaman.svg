<g class="a z4"><rect x="10" y="424" width="300" height="112" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="449.5" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Hedef (fetüs anneden duyarlı)</text><text x="160" y="469.5" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">sT4: trimester üst sınırında</text><text x="160" y="486.5" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">ya da hemen üzerinde</text><text x="160" y="503.5" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">TSH referans altında (~0,1–0,3)</text><text x="160" y="520.5" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">test 2–4 haftada bir · en düşük doz</text><rect x="330" y="424" width="300" height="112" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="449.5" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">β-bloker (köprü)</text><text x="480" y="469.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">metoprolol 25–50 mg/gün</text><text x="480" y="486.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">propranolol 6–8 saatte bir 20 mg</text><text x="480" y="503.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">2–6 haftada kes: uzun kullanım →</text><text x="480" y="520.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">IUGR, fetal bradikardi, hipoglisemi</text></g>
