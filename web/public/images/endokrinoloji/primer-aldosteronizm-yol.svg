<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" width="640" height="880" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Primer aldosteronizm: taramadan tedaviye</title>
<desc id="d">Primer aldosteronizmde taramadan tedaviye yol. Endocrine Society 2025 kılavuzuna göre hipertansiyonu olan herkes taranır. İlk test: sabah, oturur ve ayaktan hastada eşli plazma aldosteronu, renin (plazma renin aktivitesi ya da doğrudan renin) ve potasyum; çoğu antihipertansif sürer. Renin baskılı (renin aktivitesi 1 ng/mL/saat ya da altı) ve aldosteron immünoassayle 10 ng/dL ya da üstüyse test pozitiftir. Sonra lateralize hastalık olasılığı tartılır. Yüksek olasılık: kendiliğinden hipokalemi, renin aktivitesi 0,2'nin altında, aldosteron 20 ng/dL üstünde; baskılama testi gerekmez. Ara olasılık: hasta cerrahi isterse aldosteron baskılama testi yapılır. Düşük olasılık: normokalemi ve aldosteron yaklaşık 11 ng/dL altında; mineralokortikoid reseptör antagonistiyle deneme tedavisi. Cerrahi istemeyen her hastada antagonist başlanır. Cerrahi isteyende adrenal BT çekilir; 35 yaş altında, ağır hastalıkta ve tek taraflı 1–2 cm hipodens adenomda adrenal ven örneklemesiz ameliyat makuldür, 35 yaş ve üstünde ven örneklemesi yapılır. Kortizolle düzeltilmiş lateralizasyon oranı 4'ün üstündeyse tek taraflı hastalıktır: laparoskopik total adrenalektomi. 3'ün altındaysa iki taraflıdır: spironolakton ya da eplerenon; hedef potasyum normalin üst yarısı ve baskılanmamış renin.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,83%{opacity:0;transform:translateY(8px)}86%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,83%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="880" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,100 L320,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M300,212 L108,248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M320,212 L320,248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M340,212 L532,248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M108,384 L250,418" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M320,384 L320,418" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M260,516 L175,548" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M380,516 L465,548" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M175,670 L175,708" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M420,670 L220,708" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M500,670 L500,708" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="40" y="18" width="560" height="82" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Hipertansiyonu olan herkes</text><text x="320" y="64" text-anchor="middle" font-size="13" fill="#0f172a">sabah · oturur · eşli aldosteron + renin + K</text><text x="320" y="84" text-anchor="middle" font-size="13" fill="#0f172a">çoğu antihipertansif sürer</text></g><g class="a m s2"><rect x="40" y="130" width="560" height="82" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="156" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Tarama pozitif</text><text x="320" y="176" text-anchor="middle" font-size="13" fill="#1e3a8a">renin baskılı (PRA ≤1) · aldosteron ≥10 ng/dL</text><text x="320" y="196" text-anchor="middle" font-size="13" fill="#1e3a8a">oran yalnız destek: &gt;20 (immünoassay)</text></g><g class="a m s3"><rect x="10" y="250" width="196" height="134" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="108" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Yüksek olasılık</text><text x="108" y="312" text-anchor="middle" font-size="13" fill="#7f1d1d">hipokalemi</text><text x="108" y="332" text-anchor="middle" font-size="13" fill="#7f1d1d">PRA &lt;0,2 · aldo &gt;20</text><text x="108" y="352" text-anchor="middle" font-size="13" fill="#7f1d1d">baskılama testi yok</text></g><g class="a m s3"><rect x="222" y="250" width="196" height="134" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Ara olasılık</text><text x="320" y="312" text-anchor="middle" font-size="13" fill="#78350f">cerrahi isterse</text><text x="320" y="332" text-anchor="middle" font-size="13" fill="#78350f">baskılama testi</text><text x="320" y="352" text-anchor="middle" font-size="13" fill="#78350f">(oral tuz ya da salin)</text></g><g class="a m s3"><rect x="434" y="250" width="196" height="134" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="532" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Düşük olasılık</text><text x="532" y="312" text-anchor="middle" font-size="13" fill="#064e3b">normokalemi</text><text x="532" y="332" text-anchor="middle" font-size="13" fill="#064e3b">aldo &lt;11 ng/dL</text><text x="532" y="352" text-anchor="middle" font-size="13" fill="#064e3b">MRA denemesi</text></g><g class="a m s4"><rect x="40" y="420" width="560" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="453" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Cerrahi istiyor mu?</text><text x="320" y="473" text-anchor="middle" font-size="13" fill="#1e3a8a">hayır → MRA · evet → adrenal BT</text><text x="320" y="493" text-anchor="middle" font-size="13" fill="#1e3a8a">&gt;4 cm kitle: karsinomu düşün</text></g><g class="a m s5"><rect x="40" y="550" width="270" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="175" y="585" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">35 yaş altı</text><text x="175" y="605" text-anchor="middle" font-size="13" fill="#4c1d95">ağır hastalık + tek taraflı</text><text x="175" y="625" text-anchor="middle" font-size="13" fill="#4c1d95">1–2 cm hipodens adenom</text><text x="175" y="645" text-anchor="middle" font-size="13" fill="#4c1d95">→ AVS'siz ameliyat makul</text></g><g class="a m s5"><rect x="330" y="550" width="270" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="465" y="585" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">35 yaş ve üstü</text><text x="465" y="605" text-anchor="middle" font-size="13" fill="#4c1d95">adrenal ven örneklemesi</text><text x="465" y="625" text-anchor="middle" font-size="13" fill="#4c1d95">kortizol gradyanı ≥5:1</text><text x="465" y="645" text-anchor="middle" font-size="13" fill="#4c1d95">lateralizasyon &gt;4 / &lt;3</text></g><g class="a m s6"><rect x="40" y="710" width="270" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="175" y="750" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Tek taraflı</text><text x="175" y="770" text-anchor="middle" font-size="13" fill="#064e3b">laparoskopik total</text><text x="175" y="790" text-anchor="middle" font-size="13" fill="#064e3b">adrenalektomi</text><text x="175" y="810" text-anchor="middle" font-size="13" fill="#064e3b">ertesi gün aldosteron</text><text x="175" y="830" text-anchor="middle" font-size="13" fill="#064e3b">4 hafta haftalık K</text></g><g class="a m s6"><rect x="330" y="710" width="270" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="465" y="750" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">İki taraflı</text><text x="465" y="770" text-anchor="middle" font-size="13" fill="#78350f">spironolakton 12,5–25 mg</text><text x="465" y="790" text-anchor="middle" font-size="13" fill="#78350f">(ya da eplerenon)</text><text x="465" y="810" text-anchor="middle" font-size="13" fill="#78350f">hedef K ~4,5</text><text x="465" y="830" text-anchor="middle" font-size="13" fill="#78350f">renin baskılanmamış</text></g>
</svg>
