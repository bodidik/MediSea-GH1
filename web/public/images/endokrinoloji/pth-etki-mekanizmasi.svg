<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">PTH'nin kemik, böbrek ve barsak üzerinden etkisi</title>
<desc id="d">İyonize kalsiyum düşünce paratiroid hücresindeki CaSR bunu algılar ve PTH saniyeler içinde salınır (intakt PTH yarı ömrü 2–4 dakika). Kemikte PTH osteoblast ve osteositteki PTH1R'ye bağlanır; RANKL'yi artırıp osteoprotegerini azaltarak osteoklastları dolaylı uyarır; önce hazır kalsiyum havuzu, sonra rezorpsiyonla kalsiyum ve fosfat salınır (dakikalar). Böbrekte kalın çıkan kol ve distal kıvrımlı tübülde kalsiyum geri emilimini artırır (dakikalar); proksimal tübülde Npt2a ve Npt2c taşıyıcılarını zardan çekerek fosfatüri yapar; 1-alfa hidroksilazı artırıp 24-hidroksilazı azaltarak kalsitriol yapımını artırır. Kalsitriol bir gün ve sonrasında barsak kalsiyum emilimini artırır ve PTH yapımını doğrudan baskılar. Sürekli yüksek PTH net kemik yıkımı yapar; aralıklı PTH yapımı daha çok artırır.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.p{animation-name:p}@keyframes p{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.p .ciz{animation-name:pc}@keyframes pc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s{animation-name:s}@keyframes s{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.s .ciz{animation-name:sc}@keyframes sc{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.k{animation-name:k}@keyframes k{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.k .ciz{animation-name:kc}@keyframes kc{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.b1{animation-name:b1}@keyframes b1{0%,34%{opacity:0;transform:translateY(7px)}37%,100%{opacity:1;transform:none}}
.b1 .ciz{animation-name:b1c}@keyframes b1c{0%,34%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.b2{animation-name:b2}@keyframes b2{0%,46%{opacity:0;transform:translateY(7px)}49%,100%{opacity:1;transform:none}}
.b2 .ciz{animation-name:b2c}@keyframes b2c{0%,46%{stroke-dashoffset:1}50%,100%{stroke-dashoffset:0}}
.b3{animation-name:b3}@keyframes b3{0%,56%{opacity:0;transform:translateY(7px)}59%,100%{opacity:1;transform:none}}
.b3 .ciz{animation-name:b3c}@keyframes b3c{0%,56%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.ba{animation-name:ba}@keyframes ba{0%,68%{opacity:0;transform:translateY(7px)}71%,100%{opacity:1;transform:none}}
.ba .ciz{animation-name:bac}@keyframes bac{0%,68%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.geri{animation-name:geri}@keyframes geri{0%,80%{opacity:0;transform:translateY(7px)}83%,100%{opacity:1;transform:none}}
.geri .ciz{animation-name:geric}@keyframes geric{0%,80%{stroke-dashoffset:1}84%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,88%{opacity:0;transform:translateY(7px)}91%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,88%{stroke-dashoffset:1}92%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a p"><rect x="200" y="12" width="240" height="70" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="35" font-size="14" font-weight="800" text-anchor="middle" fill="#581c87">Paratiroid hücresi</text><text x="320" y="52" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">CaSR: iyonize Ca ↓ algılanır</text><text x="320" y="69" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">PTH (84 aa) · yarı ömür 2–4 dk</text></g>
<g class="a s"><path class="a ciz" pathLength="1" d="M250,84 L120,130" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M320,84 L320,130" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M390,84 L520,130" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a k"><rect x="20" y="134" width="200" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="120" y="171.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Kemik · dakikalar</text><text x="120" y="188.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">PTH1R: osteoblast, osteosit</text><text x="120" y="205.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">RANKL ↑ · OPG ↓</text><text x="120" y="222.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">→ osteoklast (dolaylı)</text><text x="120" y="239.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">1) hazır Ca havuzu</text><text x="120" y="256.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">2) rezorpsiyon: Ca + PO₄</text></g>
<g class="a b1"><rect x="230" y="134" width="180" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="165.5" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Distal tübül · dakikalar</text><text x="320" y="182.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">cTAL + DCT: Ca geri emilimi ↑</text></g>
<g class="a b2"><rect x="230" y="214" width="180" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="237" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Proksimal tübül</text><text x="320" y="254" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">Npt2a/2c zardan çekilir</text><text x="320" y="271" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">→ fosfatüri</text></g>
<g class="a b3"><rect x="420" y="134" width="200" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="520" y="171.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Böbrek: vitamin D</text><text x="520" y="188.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">1-α hidroksilaz ↑</text><text x="520" y="205.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">24-hidroksilaz ↓</text><text x="520" y="222.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">25(OH)D → kalsitriol</text><text x="520" y="239.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e"></text><text x="520" y="256.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e"></text></g>
<g class="a ba"><path class="a ciz" pathLength="1" d="M520,286 L520,316" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="420" y="320" width="200" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="520" y="351.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Barsak · ≥1 gün</text><text x="520" y="368.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">kalsitriol → Ca emilimi ↑</text></g>
<g class="a geri"><path class="a ciz" pathLength="1" d="M110,286 L110,420" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><path class="a ciz" pathLength="1" d="M320,286 L320,420" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><path class="a ciz" pathLength="1" d="M520,392 L520,420" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><rect x="20" y="424" width="600" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320" y="447.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Serum iyonize Ca normale döner → CaSR döngüyü kapatır</text><text x="320" y="464.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">kalsitriol PTH yapımını ve paratiroid hücre çoğalmasını DOĞRUDAN da baskılar</text></g>
<g class="a son"><rect x="20" y="492" width="295" height="134" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="167.5" y="530" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Sürekli yüksek PTH</text><text x="167.5" y="547" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">PHPT · SHPT</text><text x="167.5" y="564" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">net kemik yıkımı</text><text x="167.5" y="581" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">kortikal kemik (önkol, kalça)</text><text x="167.5" y="598" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">trabekülerden çok etkilenir</text><rect x="325" y="492" width="295" height="134" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="472.5" y="530" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">Aralıklı PTH</text><text x="472.5" y="547" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">PTH (1-84) ya da (1-34)</text><text x="472.5" y="564" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">yapım &gt; yıkım</text><text x="472.5" y="581" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">osteoporoz tedavisinin</text><text x="472.5" y="598" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">mantığı</text></g>

</svg>
