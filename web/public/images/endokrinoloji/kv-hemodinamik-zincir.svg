<g class="a h6"><path class="a ciz" pathLength="1" d="M490,490 L490,512" stroke="#9333ea" stroke-width="2.4" fill="none" marker-end="url(#okP)"/><rect x="350" y="516" width="280" height="96" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="490" y="543.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Siu 2007: PASP ≥35 → %47</text><text x="490" y="562.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">%71 yüksek debi (arteriyel)</text><text x="490" y="578.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">%29 yüksek sol dolum (venöz)</text><text x="490" y="594.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">çoğu sessiz, ötiroidiyle geriler</text><rect x="10" y="516" width="280" height="96" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="150" y="543.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Katekolaminler</text><text x="150" y="562.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">plazma düzeyi normal ya da düşük</text><text x="150" y="578.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">belirtiler artmış DUYARLILIKTAN</text><text x="150" y="594.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">→ beta blokerin işe yaraması</text></g>
