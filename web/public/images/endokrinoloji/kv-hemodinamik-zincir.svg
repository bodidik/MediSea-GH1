<g class="a h2"><path class="a ciz" pathLength="1" d="M240,74 C180,96 120,100 110,118" stroke="#0284c7" stroke-width="2.4" fill="none" marker-end="url(#okM)"/><path class="a ciz" pathLength="1" d="M320,74 L320,118" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M400,74 C460,96 520,100 530,118" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><rect x="10" y="122" width="200" height="96" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="110" y="149.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Damar</text><text x="110" y="168.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">düz kas gevşer</text><text x="110" y="184.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">doku ısı üretimi ↑</text><text x="110" y="200.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">SVR ↓ · diyastolik KB ↓</text><rect x="220" y="122" width="200" height="96" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="149.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Böbrek</text><text x="320" y="168.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">dolum basıncı ↓ algılanır</text><text x="320" y="184.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">RAAS uyarılır</text><text x="320" y="200.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">Na ve su tutulur</text><rect x="430" y="122" width="200" height="96" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="530" y="149.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Kalp</text><text x="530" y="168.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">TRα1: SERCA ↑ · α-MHC ↑</text><text x="530" y="184.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">fosfolamban ↓</text><text x="530" y="200.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">β-adrenerjik duyarlılık ↑</text></g>
<g class="a h3"><path class="a ciz" pathLength="1" d="M110,220 C120,262 220,270 270,278" stroke="#0284c7" stroke-width="2.4" fill="none" marker-end="url(#okM)"/><text x="150" y="262" font-size="11" font-weight="800" text-anchor="end" fill="#0284c7">ard yük ↓</text><path class="a ciz" pathLength="1" d="M320,220 L320,272" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#okA)"/><text x="330" y="250" font-size="11" font-weight="800" text-anchor="start" fill="#d97706">ön yük ↑</text><path class="a ciz" pathLength="1" d="M530,220 C520,262 420,270 370,278" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><text x="490" y="262" font-size="11" font-weight="800" text-anchor="start" fill="#dc2626">inotropi · kronotropi ↑</text><circle cx="320" cy="316" r="40" fill="#0f172a"/><text x="320" y="310" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff">KALP</text><text x="320" y="328" font-size="12" font-weight="900" text-anchor="middle" fill="#fbbf24">DEBİSİ ↑</text></g>
<g class="a h4"><path class="a ciz" pathLength="1" d="M286,340 C230,372 170,380 140,392" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><rect x="10" y="396" width="280" height="92" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="150" y="421.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Sistemik dolaşım</text><text x="150" y="440.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">sistolik KB ↑ (atım hacmi)</text><text x="150" y="456.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">diyastolik KB ↓ (vazodilatasyon)</text><text x="150" y="472.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ geniş nabız basıncı</text></g>
