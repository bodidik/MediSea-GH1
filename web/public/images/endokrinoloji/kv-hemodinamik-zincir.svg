<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipertiroidide yüksek debili dolaşım: T3'ten nabız basıncına ve pulmoner basınca</title>
<desc id="d">Kalpte etkin hormon T3'tür. Damar düz kasında gevşeme ve artan doku ısı üretimiyle sistemik damar direnci düşer, diyastolik basınç azalır. Etkin dolum basıncının düşmesi renin-anjiyotensin-aldosteron sistemini uyarır; böbrek sodyum ve su tutar, kan hacmi ve ön yük artar. Kalpte TR alfa-1 reseptörü üzerinden SERCA ve alfa-miyozin artar, fosfolamban azalır; kasılma ve gevşeme hızlanır. T3 beta-adrenerjik duyarlılığı artırır; kalp hızı yükselir. Sonuçta kalp debisi artar, sistolik basınç yükselir, diyastolik basınç düşer ve nabız basıncı genişler. Pulmoner damar direnci sistemik direnç gibi düşmez; artan debi pulmoner basıncı yükseltir. Bir eko çalışmasında hastaların yüzde 47'sinde pulmoner arter sistolik basıncı 35 mmHg ve üstündeydi; bunların yüzde 71'i yüksek debiye bağlı arteriyel, yüzde 29'u yüksek sol dolum basıncına bağlı venöz tipteydi ve ötiroidiyle geriledi.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.h1{animation-name:h1}@keyframes h1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.h1 .ciz{animation-name:h1c}@keyframes h1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.h2{animation-name:h2}@keyframes h2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.h2 .ciz{animation-name:h2c}@keyframes h2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.h3{animation-name:h3}@keyframes h3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.h3 .ciz{animation-name:h3c}@keyframes h3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.h4{animation-name:h4}@keyframes h4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.h4 .ciz{animation-name:h4c}@keyframes h4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.h5{animation-name:h5}@keyframes h5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.h5 .ciz{animation-name:h5c}@keyframes h5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.h6{animation-name:h6}@keyframes h6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.h6 .ciz{animation-name:h6c}@keyframes h6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.h7{animation-name:h7}@keyframes h7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.h7 .ciz{animation-name:h7c}@keyframes h7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
