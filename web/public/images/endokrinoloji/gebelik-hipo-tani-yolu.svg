<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gebelikte hipotiroidi taraması, tanı sınıfları ve tedavi kararı (TEMD 2025)</title>
<desc id="d">TEMD 2025'e göre gebe ilk başvurduğunda TSH ile taranır. TSH trimestere özgü alt sınır ile 2,5 mU/L arasındaysa bir şey yapmaya gerek yoktur; 2,5'in üzerindeyse TPO antikoru ölçülür; 4'ün üzerindeyse hipotiroidinin derecesi için serbest T4 ölçülür. Üst referans sınırı ilk trimesterde 2,5, ikinci ve üçüncü trimesterde 3,0 mU/L olarak tanımlanmıştır; trimestere özgü sınır verilemiyorsa 4,0 mU/L alınır. Aşikar hipotiroidi: TSH 2,5'in üzerinde ve T4 düşük, ya da T4'ten bağımsız olarak TSH 10'un üzerinde; en erken ve etkili biçimde tedavi edilir. Subklinik hipotiroidi: TSH 2,5–10 ve sT4 normal; TPO antikoru pozitifse LT4 önerilir, negatifse tedavi tartışmalıdır. İzole hipotiroksinemi: TSH normal, sT4 gebelik normlarının 2,5. persentilinin altında; rutin LT4 önerilmez, öncelik günde 100–150 µg iyot desteğidir. Santral hipotiroidide TSH ile değerlendirme yapılmaz, sT4'e bakılır.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.t1{animation-name:t1}@keyframes t1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.t1 .ciz{animation-name:t1c}@keyframes t1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.t2{animation-name:t2}@keyframes t2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.t2 .ciz{animation-name:t2c}@keyframes t2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.t3{animation-name:t3}@keyframes t3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.t3 .ciz{animation-name:t3c}@keyframes t3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.t4{animation-name:t4}@keyframes t4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.t4 .ciz{animation-name:t4c}@keyframes t4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.t5{animation-name:t5}@keyframes t5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.t5 .ciz{animation-name:t5c}@keyframes t5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.t6{animation-name:t6}@keyframes t6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.t6 .ciz{animation-name:t6c}@keyframes t6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.t7{animation-name:t7}@keyframes t7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.t7 .ciz{animation-name:t7c}@keyframes t7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="640" height="720" fill="#ffffff"/>
<g class="a t1"><rect x="120" y="10" width="400" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="36.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Gebe ilk başvurduğunda TSH ile tarama</text><text x="320" y="55.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">belirtilerin çoğu gebelikle karışır, hastaların çoğu belirtisiz</text></g>
<g class="a t2"><path class="a ciz" pathLength="1" d="M320,74 L320,96" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="100" width="620" height="70" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="122.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Üst referans sınırı</text><text x="320" y="141.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">1. trimester 2,5 mU/L · 2. ve 3. trimester 3,0 mU/L</text><text x="320" y="157.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">trimestere özgü sınır verilemiyorsa 4,0 mU/L</text></g>
<g class="a t3"><path class="a ciz" pathLength="1" d="M110,172 L110,196" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="200" width="196" height="84" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="108" y="229.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">TSH alt sınır–2,5</text><text x="108" y="248.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">bir şey yapmaya</text><text x="108" y="264.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">gerek yok</text><path class="a ciz" pathLength="1" d="M320,172 L320,196" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="222" y="200" width="196" height="84" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="229.5" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">TSH &gt; 2,5</text><text x="320" y="248.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">TPO antikoru ölç,</text><text x="320" y="264.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">gerekirse tedavi</text><path class="a ciz" pathLength="1" d="M530,172 L530,196" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="434" y="200" width="196" height="84" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="532" y="229.5" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">TSH &gt; 4</text><text x="532" y="248.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">derece için</text><text x="532" y="264.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">serbest T4 ölç</text></g>
<g class="a t4"><text x="320" y="312" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Tanı sınıfı → karar</text><rect x="10" y="324" width="300" height="112" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="356.5" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Aşikar hipotiroidi</text><text x="160" y="377.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">TSH &gt; 2,5 + T4 düşük</text><text x="160" y="395.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">ya da TSH &gt; 10 (T4'ten bağımsız)</text><text x="160" y="413.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ en erken ve etkili biçimde LT4</text><rect x="330" y="324" width="300" height="112" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="356.5" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Subklinik hipotiroidi</text><text x="480" y="377.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">TSH 2,5–10 · sT4 normal</text><text x="480" y="395.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">TPO (+) → LT4 önerilmeli</text><text x="480" y="413.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">TPO (−) → tedavi tartışmalı</text></g>
<g class="a t5"><rect x="10" y="448" width="300" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="160" y="480.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">İzole hipotiroksinemi</text><text x="160" y="501.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">TSH normal · sT4 &lt; 2,5. persentil</text><text x="160" y="519.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">rutin LT4 önerilmez</text><text x="160" y="537.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">→ iyot desteği 100–150 µg/gün</text><rect x="330" y="448" width="300" height="112" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="480.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Santral hipotiroidi</text><text x="480" y="501.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">TSH ile değerlendirme UYGUN DEĞİL</text><text x="480" y="519.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">sT4 izlenir</text><text x="480" y="537.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">hedef: normal aralığın üst çeyreği</text></g>
<g class="a t6"><rect x="10" y="576" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="600.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Sıklık ve zemin</text><text x="320" y="620.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">aşikar %0,3–0,5 · subklinik %2–3 · doğurganlık çağında otoantikor %5–15</text><text x="320" y="637.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">iyotu yeterli bölgede en sık neden otoimmün tiroidit · TSH'si yüksek gebenin %30–60'ında TPO (+)</text></g>
<g class="a t7"><text x="320" y="682" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">TPO (+) subklinik hipotiroidide gebelik komplikasyonu riski TPO (−) olandan yüksektir.</text><text x="320" y="706" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: TEMD 2025, Bölüm 26 (Gebelik ve Hipotiroidi)</text></g>
</svg>
