<g class="a g4"><path class="a ciz" pathLength="1" d="M320,402 L320,436" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><rect x="170" y="440" width="300" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="475.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Graves hipertiroidisi</text><rect x="10" y="440" width="150" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="85" y="459.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">ATD</text><text x="85" y="478.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">sentezi baskılar</text><text x="85" y="494.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">TRAb'ı düşürür</text><path class="a ciz" pathLength="1" d="M160,472 L168,472" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#okY)"/></g>
