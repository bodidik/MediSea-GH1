<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">GREAT+ genlerinin işleyişi: HLA ve PTPN22'den TRAb'a, ATD kesilince nükse</title>
<desc id="d">HLA sınıf II alelleri (DRB1*03, DQA1*05, DQB1*02) TSH reseptörüne ait otoreaktif peptidleri T lenfositlerine sunar ve santral ile periferik toleransın kırılmasında rol oynar. PTPN22 rs2476601 (R620W) varyantı lenfoid tirozin fosfatazı LYP'yi değiştirir, T ve B hücre reseptör sinyalini modüle eder; otoreaktif B hücreleri periferik toleranstan kaçar, düzenleyici T hücrelerinin baskılayıcı işlevi azalır. İki yol TSH reseptörünü uyaran antikorlarda (TRAb) birleşir; tiroid hiperplazisi ve kontrolsüz hormon üretimi gelişir. Antitiroid ilaç hormon sentezini baskılar ve TRAb düzeyini düşürür, ama genetik zemini değiştirmez; ilaç kesildiğinde nüks en çok ilk 6–12 ayda görülür. Bu genler GREAT skoruna eklendiğinde (GREAT+) nüks riski dört sınıfa ayrılır.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: tiroid-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.g1{animation-name:g1}@keyframes g1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.g1 .ciz{animation-name:g1c}@keyframes g1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.g2{animation-name:g2}@keyframes g2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.g2 .ciz{animation-name:g2c}@keyframes g2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.g3{animation-name:g3}@keyframes g3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.g3 .ciz{animation-name:g3c}@keyframes g3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.g4{animation-name:g4}@keyframes g4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.g4 .ciz{animation-name:g4c}@keyframes g4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.g5{animation-name:g5}@keyframes g5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.g5 .ciz{animation-name:g5c}@keyframes g5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
