<g class="a g1"><text x="320" y="26" font-size="15" font-weight="800" text-anchor="middle" fill="#0f172a">Genetik zemin</text><rect x="10" y="40" width="300" height="96" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="160" y="67.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">HLA sınıf II</text><text x="160" y="86.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">DRB1*03 · DQA1*05 · DQB1*02</text><text x="160" y="102.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">TSHR peptidini</text><text x="160" y="118.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">T lenfositine sunar</text><rect x="330" y="40" width="300" height="96" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="480" y="67.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">PTPN22 rs2476601 (R620W)</text><text x="480" y="86.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">lenfoid tirozin fosfataz (LYP)</text><text x="480" y="102.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">T ve B hücre reseptör</text><text x="480" y="118.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">sinyalini değiştirir</text></g>
<g class="a g2"><path class="a ciz" pathLength="1" d="M160,138 L160,176" stroke="#9333ea" stroke-width="2.4" fill="none" marker-end="url(#okP)"/><path class="a ciz" pathLength="1" d="M480,138 L480,176" stroke="#1e3a8a" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="180" width="300" height="82" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="160" y="208.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Tolerans kırılır</text><text x="160" y="227.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">santral ve periferik tolerans</text><text x="160" y="243.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">otoreaktif T hücresi yardımı</text><rect x="330" y="180" width="300" height="82" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="480" y="208.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">Düzenleme zayıflar</text><text x="480" y="227.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">otoreaktif B hücresi kaçar</text><text x="480" y="243.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">Treg baskılaması ↓</text></g>
