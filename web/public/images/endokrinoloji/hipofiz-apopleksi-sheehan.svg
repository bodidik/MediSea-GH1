<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipofiz apopleksisi ve Sheehan sendromu: iki vasküler yol</title>
<desc id="d">Apopleksi, çoğu kez bilinmeyen bir adenomun içine ani kanama ya da enfarktüstür (olguların yaklaşık yüzde 80'inde adenom önceden bilinmez). Sella içi basınç aniden artar: şiddetli baş ağrısı, kusma ve görme bozukluğu apopleksi triadını oluşturur; kavernöz sinüse bası 3., 4. ve 6. kraniyal sinir felcine, en sık okülomotor felcine yol açar. En sık ve hayatı tehdit eden endokrin kayıp ACTH eksikliğidir; 35 hastalık bir seride gonadotropin yüzde 79, ACTH yüzde 76, TSH yüzde 50 eksikti. Sheehan sendromunda hipotansiyon yapan, çok ünite transfüzyon gerektiren postpartum kanama hipofiz enfarktüsüne yol açar; ilk işaret emzirememe ve adetlerin dönmemesidir, sonunda normal büyüklükte sellada küçük hipofiz kalır. 114 hastalık seride ortalama tanı gecikmesi 19,7 yıl, tanıda yüzde 55 panhipopitüitarizm vardı.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.at{animation-name:at}@keyframes at{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.at .ciz{animation-name:atc}@keyframes atc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.a1{animation-name:a1}@keyframes a1{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.a1 .ciz{animation-name:a1c}@keyframes a1c{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.a2{animation-name:a2}@keyframes a2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.a2 .ciz{animation-name:a2c}@keyframes a2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.a3{animation-name:a3}@keyframes a3{0%,28%{opacity:0;transform:translateY(7px)}31%,100%{opacity:1;transform:none}}
.a3 .ciz{animation-name:a3c}@keyframes a3c{0%,28%{stroke-dashoffset:1}32%,100%{stroke-dashoffset:0}}
.st{animation-name:st}@keyframes st{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.st .ciz{animation-name:stc}@keyframes stc{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,48%{opacity:0;transform:translateY(7px)}51%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,48%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,58%{opacity:0;transform:translateY(7px)}61%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,58%{stroke-dashoffset:1}62%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,68%{opacity:0;transform:translateY(7px)}71%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,68%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,82%{opacity:0;transform:translateY(7px)}85%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,82%{stroke-dashoffset:1}86%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a at"><text x="165" y="30" font-size="16" font-weight="900" text-anchor="middle" fill="#7f1d1d">Apopleksi</text></g>
<g class="a a1"><rect x="20" y="44" width="290" height="74" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="165" y="69" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Adenom içine kanama / enfarktüs</text><text x="165" y="86" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">%80'inde adenom önceden bilinmez</text><text x="165" y="103" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">fonksiyonsuz makroadenomda sık</text></g>
<g class="a a2"><path class="a ciz" pathLength="1" d="M165,120 L165,146" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/><rect x="20" y="150" width="290" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="165" y="174.5" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">Sella içi basınç ANİ ↑</text><text x="165" y="191.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">kitle hızla büyür</text></g>
<g class="a a3"><path class="a ciz" pathLength="1" d="M100,208 L80,234" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/><path class="a ciz" pathLength="1" d="M230,208 L250,234" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#okK)"/><rect x="20" y="238" width="140" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="90" y="269" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Nörolojik</text><text x="90" y="286" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">baş ağrısı · kusma</text><text x="90" y="303" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">görme kaybı</text><text x="90" y="320" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">III · IV · VI felci</text><text x="90" y="337" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">(en sık okülomotor)</text><rect x="170" y="238" width="140" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="240" y="269" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Endokrin</text><text x="240" y="286" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ACTH ↓ (en tehlikeli)</text><text x="240" y="303" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ hipotansiyon</text><text x="240" y="320" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">LH/FSH %79 · ACTH %76</text><text x="240" y="337" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">TSH %50</text></g>
<g class="a st"><text x="475" y="30" font-size="16" font-weight="900" text-anchor="middle" fill="#78350f">Sheehan sendromu</text></g>
<g class="a s1"><rect x="330" y="44" width="290" height="74" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="475" y="69" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Ağır postpartum kanama</text><text x="475" y="86" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">hipotansiyon · çok ünite transfüzyon</text><text x="475" y="103" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">nadiren belirgin kanama olmadan</text></g>
<g class="a s2"><path class="a ciz" pathLength="1" d="M475,120 L475,146" stroke="#d97706" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="330" y="150" width="290" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="475" y="174.5" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">Hipofiz enfarktüsü</text><text x="475" y="191.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">ön hipofiz hormonları birlikte</text></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M475,208 L475,234" stroke="#d97706" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="330" y="238" width="290" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="475" y="269" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Emzirememe (PRL ↓) · adet dönmez</text><text x="475" y="286" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">ağırsa ilk günlerde letarji, kilo kaybı</text><text x="475" y="303" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">hafifse yıllarca fark edilmez</text><text x="475" y="320" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">tanı gecikmesi ort. 19,7 yıl</text><text x="475" y="337" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">geç MR: küçük hipofiz / boş sella</text></g>
<g class="a son"><rect x="20" y="378" width="600" height="246" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="438" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Ortak acil kural</text><text x="320" y="455" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">kortizol için kan al → SONUCU BEKLEMEDEN parenteral glukokortikoid</text><text x="320" y="472" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">hidrokortizon 100–200 mg IV bolus, sonra 2–4 mg/sa infüzyon</text><text x="320" y="489" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">ya da 50–100 mg / 6 sa IM (TEMD 2022)</text><text x="320" y="506" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">apopleksi: ağır/ilerleyen görme kaybı, bilinç bozukluğu → erken TSS</text><text x="320" y="523" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">hafif, düzelen olguda konservatif izlem; hastaların %80'inden fazlası replasman alır</text><text x="320" y="540" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Sheehan: kanama ağırsa adrenal yetmezlik hemen; diğer eksenler 4–6 hafta sonra</text><text x="320" y="557" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Sheehan'da tüm hastalarda GH, PRL ve gonadotropin eksikti (iki seri, 48 kadın)</text><text x="320" y="574" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">aşikar AVP-D nadir, subklinik vazopressin eksikliği sık</text></g>

</svg>
