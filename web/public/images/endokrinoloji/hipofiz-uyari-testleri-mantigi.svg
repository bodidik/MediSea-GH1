<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipofiz yetmezliği tanısında bazal ölçüm ve uyarı testlerinin mantığı</title>
<desc id="d">Tanı bazal hipofiz hormonu ile hedef bez hormonunun eşzamanlı ölçümüyle başlar. TSH, gonadotropin ve prolaktin eksikliğinde bu çoğu kez yeterlidir. ACTH ve GH eksikliğinde bazal değer genellikle yetmez, uyarı testi gerekir. Sabah 08–09 kortizolü 15 mikrogram/dL ve üstündeyse HPA aksı normaldir, 3'ün altındaysa adrenal yetmezlik büyük olasılıktır (özgüllük yüzde 99,7), arada uyarı testi yapılır. İnsülin tolerans testi altın standarttır (pik kortizol en az 18, pik GH 3 ng/mL altı ağır GH eksikliği). ACTH testi adrenali uyarır; ACTH eksikliğinin ilk 4 haftasında adrenal henüz atrofik olmadığından yanlış normal çıkabilir. Glukagon testinde normal yanıt kortizol için 9–10, GH için 1 mikrogram/L ve üstüdür.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.b{animation-name:b}@keyframes b{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.b .ciz{animation-name:bc}@keyframes bc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.b2{animation-name:b2}@keyframes b2{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.b2 .ciz{animation-name:b2c}@keyframes b2c{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.k{animation-name:k}@keyframes k{0%,24%{opacity:0;transform:translateY(7px)}27%,100%{opacity:1;transform:none}}
.k .ciz{animation-name:kc}@keyframes kc{0%,24%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}
.k2{animation-name:k2}@keyframes k2{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.k2 .ciz{animation-name:k2c}@keyframes k2c{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.t{animation-name:t}@keyframes t{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.t .ciz{animation-name:tc}@keyframes tc{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.not{animation-name:not}@keyframes not{0%,78%{opacity:0;transform:translateY(7px)}81%,100%{opacity:1;transform:none}}
.not .ciz{animation-name:notc}@keyframes notc{0%,78%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a b"><rect x="20" y="14" width="600" height="62" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="41.5" font-size="14.5" font-weight="800" text-anchor="middle" fill="#1e293b">1. adım: eşzamanlı bazal çift</text><text x="320" y="58.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">TSH + sT4 · LH/FSH + testosteron/E2 · PRL · ACTH + kortizol · GH + IGF-1</text></g>
<g class="a b2"><path class="a ciz" pathLength="1" d="M170,78 L120,104" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M470,78 L520,104" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="108" width="290" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="165" y="131" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">TSH · LH/FSH · PRL</text><text x="165" y="148" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">bazal çift çoğu kez yeterli</text><text x="165" y="165" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">(hedef ↓ + hipofiz ↓/uygunsuz normal)</text><rect x="330" y="108" width="290" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="475" y="131" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">ACTH · GH</text><text x="475" y="148" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">bazal değer genellikle YETMEZ</text><text x="475" y="165" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ uyarı testi</text></g>
<g class="a k"><rect x="20" y="196" width="600" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="222.5" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">Sabah 08–09 kortizolü (μg/dL)</text><text x="320" y="239.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">≥15 aks normal · 3–15 uyarı testi · <3 adrenal yetmezlik (özgüllük %99,7)</text></g>
<g class="a k2"><rect x="40" y="270" width="560" height="20" rx="6" fill="#e2e8f0"/><rect x="40" y="270" width="37" height="20" rx="6" fill="#fca5a5"/><rect x="77" y="270" width="186" height="20" fill="#fde68a"/><rect x="263" y="270" width="337" height="20" rx="6" fill="#bbf7d0"/><text x="77" y="306" font-size="11" font-weight="800" text-anchor="middle" fill="#334155">3</text><text x="263" y="306" font-size="11" font-weight="800" text-anchor="middle" fill="#334155">15</text><text x="170" y="284" font-size="11" font-weight="700" text-anchor="middle" fill="#78350f">uyarı testi</text><text x="430" y="284" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">normal</text></g>
<g class="a t"><rect x="20" y="322" width="190" height="150" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="115" y="359.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">İTT (altın standart)</text><text x="115" y="376.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">hipoglisemi → hipotalamus</text><text x="115" y="393.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">→ ACTH + GH</text><text x="115" y="410.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">kortizol pik ≥18</text><text x="115" y="427.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">GH pik <3 = ağır eksiklik</text><text x="115" y="444.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">KAH, SVH, epilepside yok</text><rect x="225" y="322" width="190" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="359.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">ACTH testi</text><text x="320" y="376.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">adrenali DOĞRUDAN uyarır</text><text x="320" y="393.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">aksı DOLAYLI gösterir</text><text x="320" y="410.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">250 μg: pik ≥18</text><text x="320" y="427.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">ilk 4 haftada yanlış</text><text x="320" y="444.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">normal çıkabilir</text><rect x="430" y="322" width="190" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="525" y="359.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Glukagon testi</text><text x="525" y="376.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">ACTH + GH birlikte</text><text x="525" y="393.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">kortizol pik ≥9–10</text><text x="525" y="410.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">GH pik ≥1 μg/L normal</text><text x="525" y="427.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">İTT olmayınca</text><text x="525" y="444.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">ilk seçenek</text></g>
<g class="a not"><rect x="20" y="490" width="600" height="134" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="528" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Neden ACTH testi yeni olguda aldatır?</text><text x="320" y="545" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">ACTH kesilince adrenal korteks haftalar içinde atrofiye gider</text><text x="320" y="562" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">yeni eksiklikte (ilk ~4 hafta) korteks hâlâ yanıt verir → kortizol normal yükselir</text><text x="320" y="579" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">apopleksi ve cerrahi sonrası erken dönemde bu yüzden İTT/klinik karar</text><text x="320" y="596" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">GH testinden önce diğer eksik hormonlar yerine konmuş olmalı</text></g>

</svg>
