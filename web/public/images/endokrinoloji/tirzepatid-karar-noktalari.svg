<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tirzepatid kullanımında karar noktaları (monograf 2026, TEMD 2024–2026)</title>
<desc id="d">Endikasyon: tip 2 diyabet; BKİ 30 ve üstü ya da 27 ve üstü ile kiloya bağlı hastalık; obeziteyle orta-ağır uyku apnesi. Kontrendikasyon: medüller tiroid kanseri veya MEN 2 öyküsü, gebelik, aşırı duyarlılık; pankreatit öyküsünde TEMD kullanmamayı, monograf dikkati önerir. Doz: 2,5 mg ile 4 hafta, sonra 5 mg; en az 4 haftada bir 2,5 mg artış, en çok 15 mg; sülfonilüre ve insülin dozunu azalt. Özel durumlar: gebelik planında en az 1 ay önce kes; ameliyattan önce TEMD 1 hafta kesmeyi önerir, monograf veri yetersiz der, anesteziye bildir; son dönem böbrek yetersizliğinde önerilmez. İzlem: pankreatit belirtisi, safra kesesi, retinopati, dehidratasyon ve böbrek, ani görme kaybı, ruh hali.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="70" y="14" width="500" height="80" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Endikasyon</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Tip 2 diyabet · BKİ ≥30 ya da ≥27 + kiloya bağlı hastalık</text><text x="320" y="77" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Obezite + orta-ağır uyku apnesi</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="94" x2="320" y2="118" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="70" y="120" width="500" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Önce engel var mı?</text><text x="320" y="164" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">MTK / MEN 2 öyküsü · gebelik · aşırı duyarlılık</text><text x="320" y="182" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Pankreatit öyküsü: TEMD kullanma, monograf dikkat</text><text x="320" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">GLP-1 RA ya da başka tirzepatidle birlikte değil</text></g><g class="a" style="animation-delay:4.80s"><line x1="320" y1="216" x2="320" y2="240" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="40" y="242" width="560" height="96" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="320" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Titrasyon (haftada bir, deri altı)</text><text x="320" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">2,5 mg × 4 hafta  →  5 mg</text><text x="320" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">En az 4 haftada bir +2,5 mg  →  en çok 15 mg</text><text x="320" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Sülfonilüre / insülin dozunu azalt</text></g><g class="a" style="animation-delay:7.20s"><line x1="140" y1="338" x2="110" y2="376" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="320" y1="338" x2="320" y2="376" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="500" y1="338" x2="530" y2="376" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="378" width="196" height="104" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="112" y="408" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Gebelik planı</text><text x="112" y="426" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">En az 1 ay önce kes</text><text x="112" y="444" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Oral kontraseptifte</text><text x="112" y="462" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">4 hafta bariyer</text><rect x="222" y="378" width="196" height="104" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="408" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Ameliyat / endoskopi</text><text x="320" y="426" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">TEMD: 1 hafta önce kes</text><text x="320" y="444" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Monograf: veri yetersiz</text><text x="320" y="462" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Anesteziye bildir</text><rect x="430" y="378" width="196" height="104" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="528" y="408" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Böbrek</text><text x="528" y="426" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Doz ayarı yok</text><text x="528" y="444" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Son dönemde önerilmez</text><text x="528" y="462" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Kusma-ishalde izle</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="498" width="612" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="528" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">İzlemde</text><text x="320" y="546" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Karın ağrısı (pankreatit) · safra kesesi · retinopati</text><text x="320" y="564" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Ani görme kaybı (NAION) · ruh hali ve intihar düşüncesi</text></g>
</svg>
