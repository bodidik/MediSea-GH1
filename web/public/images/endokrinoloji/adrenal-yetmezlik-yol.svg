<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Adrenal yetmezlik: şüpheden tedaviye</title>
<desc id="d">Şüphede önce hemodinami: şok varsa kan alınır ve beklemeden hidrokortizon 100 mg IV ile 1 litre salin. Stabil hastada sabah kortizolü: 3 altı yetmezlik, 18 üstü (yeni kitlerde 13–14) uzak, arada 250 mcg ACTH uyarı testi. Kortizol eksikliği doğrulanınca plazma ACTH: yüksekse primer (hidrokortizon + fludrokortizon), düşük ya da normalse santral (hidrokortizon, diğer hipofiz eksiklikleri). Herkese hasta günü kuralı.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="900" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M220,100 L150,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M420,100 L470,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M470,290 L470,318" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M150,290 L320,464" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M470,450 L360,484" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M260,572 L175,604" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M380,572 L465,604" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="18" width="560" height="82" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Şüphe</text><text x="320" y="66" text-anchor="middle" font-size="13" fill="#0f172a">halsizlik · iştahsızlık · kilo kaybı · hipotansiyon · hiponatremi</text><text x="320" y="86" text-anchor="middle" font-size="13" fill="#0f172a">primerde hiperpigmentasyon, hiperkalemi</text></g>
<g class="a m s2"><rect x="10" y="130" width="280" height="160" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="150" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Şok · adrenal kriz</text><text x="150" y="186" text-anchor="middle" font-size="13" fill="#7f1d1d">kortizol + ACTH için kan</text><text x="150" y="208" text-anchor="middle" font-size="13" fill="#7f1d1d">BEKLEMEDEN:</text><text x="150" y="230" text-anchor="middle" font-size="13" fill="#7f1d1d">hidrokortizon 100 mg IV</text><text x="150" y="252" text-anchor="middle" font-size="13" fill="#7f1d1d">→ 200 mg / 24 saat</text><text x="150" y="274" text-anchor="middle" font-size="13" fill="#7f1d1d">ilk saatte 1 L izotonik salin</text></g>
<g class="a m s2"><rect x="310" y="130" width="320" height="160" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="470" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Stabil · sabah 06–09 kortizol</text><text x="470" y="190" text-anchor="middle" font-size="13" fill="#1e3a8a">≤3 mcg/dL → yetmezlik</text><text x="470" y="214" text-anchor="middle" font-size="13" fill="#1e3a8a">≥18 → uzak</text><text x="470" y="236" text-anchor="middle" font-size="13" fill="#1e3a8a">(yeni kitlerde 13–14)</text><text x="470" y="262" text-anchor="middle" font-size="13" fill="#1e3a8a">arada → uyarı testi</text></g>
<g class="a m s3"><rect x="310" y="320" width="320" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="470" y="350" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">ACTH uyarı testi</text><text x="470" y="376" text-anchor="middle" font-size="13" fill="#78350f">250 mcg · 30 ve 60. dakika</text><text x="470" y="400" text-anchor="middle" font-size="13" fill="#78350f">zirve ≥18 → dışlar</text><text x="470" y="424" text-anchor="middle" font-size="13" fill="#78350f">&lt;14 → olası (14–18 kite bağlı)</text></g>
<g class="a m s4"><rect x="40" y="466" width="560" height="106" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="496" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Kortizol eksikliği doğrulandı · plazma ACTH</text><text x="320" y="522" text-anchor="middle" font-size="13" fill="#4c1d95">üst sınırın üstü (çoğunlukla &gt;2 kat) → primer</text><text x="320" y="546" text-anchor="middle" font-size="13" fill="#4c1d95">düşük ya da uygunsuz normal → santral</text></g>
<g class="a m s5"><rect x="40" y="606" width="270" height="170" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="175" y="636" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Primer</text><text x="175" y="662" text-anchor="middle" font-size="13" fill="#064e3b">21-OH antikoru · VLCFA · BT</text><text x="175" y="688" text-anchor="middle" font-size="13" fill="#064e3b">hidrokortizon 15–25 mg/gün</text><text x="175" y="710" text-anchor="middle" font-size="13" fill="#064e3b">+ fludrokortizon</text><text x="175" y="732" text-anchor="middle" font-size="13" fill="#064e3b">0,05–0,2 mg/gün</text><text x="175" y="756" text-anchor="middle" font-size="13" fill="#064e3b">hedef renin üst-normal</text></g>
<g class="a m s5"><rect x="330" y="606" width="270" height="170" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="465" y="636" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">Santral</text><text x="465" y="662" text-anchor="middle" font-size="13" fill="#0c4a6e">diğer hipofiz hormonları</text><text x="465" y="688" text-anchor="middle" font-size="13" fill="#0c4a6e">hidrokortizon 15–25 mg/gün</text><text x="465" y="710" text-anchor="middle" font-size="13" fill="#0c4a6e">fludrokortizon gerekmez</text><text x="465" y="732" text-anchor="middle" font-size="13" fill="#0c4a6e">önce glukokortikoid,</text><text x="465" y="756" text-anchor="middle" font-size="13" fill="#0c4a6e">sonra tiroid / GH</text></g>
<g class="a m s5"><rect x="40" y="796" width="560" height="86" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="320" y="824" text-anchor="middle" font-size="15" font-weight="800" fill="#881337">Herkese hasta günü kuralı</text><text x="320" y="848" text-anchor="middle" font-size="13" fill="#881337">ateşte 3 gün doz 2–3 kat · kusmada 100 mg enjeksiyon + acil</text><text x="320" y="868" text-anchor="middle" font-size="13" fill="#881337">enjektabl hidrokortizon yanında taşınır</text></g>
</svg>
