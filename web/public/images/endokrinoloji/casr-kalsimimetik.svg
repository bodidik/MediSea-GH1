<g class="a ca"><circle cx="178" cy="120" r="9" fill="#38bdf8" stroke="#0369a1"/><text x="178" y="124" font-size="8.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Ca</text><circle cx="200" cy="112" r="9" fill="#38bdf8" stroke="#0369a1"/><text x="200" y="116" font-size="8.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Ca</text><circle cx="222" cy="120" r="9" fill="#38bdf8" stroke="#0369a1"/><text x="222" y="124" font-size="8.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Ca</text><text x="200" y="84" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">iyonize Ca²⁺ ↑</text></g>
