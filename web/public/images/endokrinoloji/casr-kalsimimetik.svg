<g class="a salin"><path class="a ciz" pathLength="1" d="M200,376 L200,404" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#tbar)"/><g class="a vez"><circle cx="160" cy="440" r="15" fill="#fde68a" stroke="#b45309"/><text x="160" y="444" font-size="8.5" font-weight="800" text-anchor="middle" fill="#78350f">PTH</text><circle cx="200" cy="440" r="15" fill="#fde68a" stroke="#b45309"/><text x="200" y="444" font-size="8.5" font-weight="800" text-anchor="middle" fill="#78350f">PTH</text><circle cx="240" cy="440" r="15" fill="#fde68a" stroke="#b45309"/><text x="240" y="444" font-size="8.5" font-weight="800" text-anchor="middle" fill="#78350f">PTH</text></g><text x="200" y="478" font-size="12" font-weight="800" text-anchor="middle" fill="#b91c1c">PTH ekzositozu baskılanır</text></g>
<g class="a ilac1"><path class="a ciz" pathLength="1" d="M420,248 L272,248" stroke="#0f766e" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="424" y="214" width="196" height="74" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="522" y="239" font-size="12.5" font-weight="800" text-anchor="middle" fill="#14532d">Sinakalset · Evokalset</text><text x="522" y="256" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">oral · Glu837 (7TM)</text><text x="522" y="273" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">sinakalset: CYP2D6 inh. · GİS</text></g>
