<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">CaSR sinyali ve kalsimimetiklerin bağlanma yerleri</title>
<desc id="d">Kalsiyum duyarlı reseptör (CaSR) paratiroid hücre yüzeyinde dimer olarak bulunur. Hücre dışı kalsiyum bağlanınca hücre içi kalsiyum ve inozitol fosfatlar artar, cAMP birikimi azalır ve PTH salınımı baskılanır. Kalsimimetikler reseptörün kalsiyuma duyarlılığını artıran pozitif allosterik modülatörlerdir. Sinakalset ve evokalset transmembran bölgedeki Glu837'ye bağlanır; sinakalset CYP2D6'yı inhibe eder ve üst gastrointestinal yan etkisi sıktır, evokalset düşük dozda etkilidir ve CYP2D6 inhibisyonu daha zayıftır. Etelkalsetid hücre dışı bölgedeki Cys482'ye kovalent bağlanır, hemodiyaliz sonunda damar içi verilir, hipokalsemi ve QTc uzaması yapabilir. Upakalset hücre dışı bölgede Arg66, Trp70, Ser147 ve Glu297'ye bağlanır, karaciğerde yıkılmaz ve tek hemodiyaliz seansında yüzde 78–100'ü temizlenir.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.zar{animation-name:zar}@keyframes zar{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.zar .ciz{animation-name:zarc}@keyframes zarc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.ca{animation-name:ca}@keyframes ca{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.ca .ciz{animation-name:cac}@keyframes cac{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.sinyal{animation-name:sinyal}@keyframes sinyal{0%,24%{opacity:0;transform:translateY(7px)}27%,100%{opacity:1;transform:none}}
.sinyal .ciz{animation-name:sinyalc}@keyframes sinyalc{0%,24%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}
.salin{animation-name:salin}@keyframes salin{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.salin .ciz{animation-name:salinc}@keyframes salinc{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.ilac1{animation-name:ilac1}@keyframes ilac1{0%,54%{opacity:0;transform:translateY(7px)}57%,100%{opacity:1;transform:none}}
.ilac1 .ciz{animation-name:ilac1c}@keyframes ilac1c{0%,54%{stroke-dashoffset:1}58%,100%{stroke-dashoffset:0}}
.ilac2{animation-name:ilac2}@keyframes ilac2{0%,64%{opacity:0;transform:translateY(7px)}67%,100%{opacity:1;transform:none}}
.ilac2 .ciz{animation-name:ilac2c}@keyframes ilac2c{0%,64%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.ilac3{animation-name:ilac3}@keyframes ilac3{0%,74%{opacity:0;transform:translateY(7px)}77%,100%{opacity:1;transform:none}}
.ilac3 .ciz{animation-name:ilac3c}@keyframes ilac3c{0%,74%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,86%{opacity:0;transform:translateY(7px)}89%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,86%{stroke-dashoffset:1}90%,100%{stroke-dashoffset:0}}
.vez{animation-name:vez}@keyframes vez{0%,58%{transform:translateY(0);opacity:1}70%,100%{transform:translateY(-18px);opacity:.25}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
