<g class="a son"><rect x="20" y="500" width="600" height="126" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="534" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Kalsimimetik = pozitif allosterik modülatör</text><text x="320" y="551" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Reseptörün Ca'ya duyarlılığını artırır: aynı Ca düzeyi PTH'yi daha çok baskılar</text><text x="320" y="568" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Barsaktan Ca emilimini artırmadan PTH ve serum Ca'yı düşürür</text><text x="320" y="585" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Diyalizde SHPT: sinakalset (oral) ya da etelkalsetid (diyaliz sonu IV)</text><text x="320" y="602" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">PHPT'de cerrahiye uygun olmayan belirgin hiperkalsemi: sinakalset</text></g>

</svg>
