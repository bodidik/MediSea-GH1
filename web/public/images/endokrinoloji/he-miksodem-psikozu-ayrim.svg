<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tiroid hastasında yeni nöropsikiyatrik tablo: miksödem psikozu mu, Hashimoto ensefalopatisi mi</title>
<desc id="d">TSH ve serbest T4 bak. Aşikâr ağır hipotiroidi varsa: bilinç azalması, hipotermi, bradikardi varsa miksödem koması; yoksa miksödem psikozu düşün ve tiroid hormonu ver. Tablo hormonla düzelmezse ya da hipotiroidi yok veya hafifse ve nöbet, miyoklonus, dalgalı bilinç varsa anti-TPO ve anti-Tg iste; yüksekse öteki tanıları dışla ve glukokortikoid denemesi. BOS proteini ve EEG yavaşlaması iki tabloda da olabilir.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="520" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="140" y="14" width="360" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Yeni psikoz, konfüzyon, bilinç değişikliği</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">TSH + serbest T4</text></g><g class="a" style="animation-delay:2.40s"><line x1="250" y1="76" x2="160" y2="116" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="390" y1="76" x2="480" y2="116" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="20" y="118" width="280" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="160" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Ağır aşikâr hipotiroidi</text><text x="160" y="163" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">TSH &gt;10, serbest T4 düşük</text><rect x="340" y="118" width="280" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="480" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Ötiroid, subklinik ya da hafif</text><text x="480" y="163" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">ya da hipertiroidi</text></g><g class="a" style="animation-delay:4.80s"><line x1="160" y1="180" x2="160" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="20" y="208" width="280" height="84" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="160" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Bilinç azalması, hipotermi,</text><text x="160" y="246" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">bradikardi?</text><text x="160" y="264" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Evet → miksödem koması · Hayır ↓</text><text x="160" y="282" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">(ayrı acil yönetim)</text></g><g class="a" style="animation-delay:7.20s"><line x1="160" y1="292" x2="160" y2="318" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="20" y="320" width="280" height="62" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="160" y="347" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Miksödem psikozu düşün</text><text x="160" y="365" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Tiroid hormonu yerine koy</text></g><g class="a" style="animation-delay:9.60s"><line x1="480" y1="180" x2="480" y2="236" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="300" y1="351" x2="338" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><text x="300" y="318" font-size="11" fill="#334155">düzelmezse</text><rect x="340" y="238" width="280" height="116" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="480" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">HE düşün</text><text x="480" y="292" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Nöbet, miyoklonus, dalgalı bilinç?</text><text x="480" y="310" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Hormonla düzelmedi mi?</text><text x="480" y="328" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">→ anti-TPO, anti-Tg</text></g><g class="a" style="animation-delay:12.00s"><line x1="480" y1="354" x2="480" y2="380" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="340" y="382" width="280" height="62" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="480" y="409" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Öteki tanıları dışla (LP, MRG, EEG)</text><text x="480" y="427" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">sonra glukokortikoid denemesi</text></g><g class="a" style="animation-delay:14.40s"><rect x="20" y="458" width="600" height="50" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="488" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Ayırt ettirmez: BOS proteini ↑ ve EEG yavaşlaması ikisinde de olabilir</text></g>
</svg>
