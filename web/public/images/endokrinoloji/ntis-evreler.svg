<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tiroid dışı hastalık sendromunun evreleri ve hipotiroididen ayrımı: tiroid testleri (TEMD 2025 Tablo 25.1)</title>
<desc id="d">TEMD 2025 Tablo 25.1'e göre primer hipotiroidide TSH belirgin yüksek, T4 ve sT4 düşük, T3 düşük ya da normal, rT3 düşüktür. Santral hipotiroidide TSH, T4 ve sT4 düşük ya da normal, T3 normal, rT3 düşüktür. Tiroid dışı hastalık sendromunun akut fazında TSH normal, T4 ve sT4 normal ya da yüksek, T3 düşük, rT3 yüksektir. Kronik fazda TSH, T4 ve sT4 düşük, T3 belirgin düşük, rT3 normal ya da yüksektir. İyileşme fazında TSH normal ya da yüksek, T4, sT4 ve T3 düşük ya da normal, rT3 değişkendir. Zaman içinde: akut stresin ilk birkaç saatinde T3 düşer, rT3 artar; erken dönemde T4'ün T3'e dönüşümü engellendiği için T4 artabilir, sonra rT3'e dönüşerek tükenir; ağır ve uzayan hastalıkta TSH ve T4 de düşer; iyileşmede TSH 20 mU/L'ye varan geçici yükselme gösterebilir. Yatan hastalarda sendrom yüzde 70'e varan oranda görülür.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
