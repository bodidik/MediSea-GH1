.ciz{stroke-dasharray:1}
.k1{animation-name:k1}@keyframes k1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.k1 .ciz{animation-name:k1c}@keyframes k1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.k2{animation-name:k2}@keyframes k2{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.k2 .ciz{animation-name:k2c}@keyframes k2c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.k3{animation-name:k3}@keyframes k3{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.k3 .ciz{animation-name:k3c}@keyframes k3c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.k4{animation-name:k4}@keyframes k4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.k4 .ciz{animation-name:k4c}@keyframes k4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.k5{animation-name:k5}@keyframes k5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.k5 .ciz{animation-name:k5c}@keyframes k5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.k6{animation-name:k6}@keyframes k6{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.k6 .ciz{animation-name:k6c}@keyframes k6c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
