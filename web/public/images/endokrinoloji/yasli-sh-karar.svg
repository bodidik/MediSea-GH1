<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Yaşlıda subklinik hipertiroidi: kalıcılığı doğrula, TSH düzeyine ve nedene göre karar ver</title>
<desc id="d">Düşük TSH önce 3–6 ay içinde tekrar ölçülerek kalıcılığı doğrulanır; geçici tiroidit, akut hastalık ve ilaç etkisi dışlanır. TSH kalıcı olarak 0,1'in altındaysa 65 yaş ve üstünde tedavi önerilir (ATA öneri 73, güçlü öneri, orta kanıt; ETA da tedaviyi endike sayar). TSH 0,1 ile 0,4 arasındaysa ATA 65 yaş ve üstünde tedaviyi düşünmeyi önerir (öneri 75, zayıf öneri); TEMD 2025 ise 65 yaş üstünde tanı konmuş her subklinik hipertiroidide tedaviyi önerir. Tedavi nedene göre seçilir: Graves'te antitiroid ilaç, toksik adenom ve toksik multinodüler guatrda radyoaktif iyot; büyük guatr, bası, hiperparatiroidi ya da kanser şüphesinde cerrahi. Aşikar hipertiroidide AF, kalp yetmezliği ya da iskemi geçirmiş yaşlıya kalıcı tedavi, genellikle RAI önerilir (ETA öneri 44); hafif Graves'li yaşlıda uzun süreli metimazol tatmin edici bir seçenektir (ETA öneri 45).</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
