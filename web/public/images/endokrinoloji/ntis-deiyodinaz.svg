<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tiroid dışı hastalık sendromunda deiyodinaz ve hipotalamus değişiklikleri</title>
<desc id="d">TEMD 2025'e göre T4'ün tamamı tiroidde üretilir, T3'ün yalnız yüzde 20'si tiroidden gelir, kalanı periferde T4'ün deiyodinasyonuyla oluşur. Tip 1 ve tip 2 deiyodinaz T4'ü aktif T3'e çevirir; tip 3 deiyodinaz T4'ü inaktif ters T3'e (rT3), T3'ü T2'ye çevirir; tip 1 rT3'ü de yıkar. Kritik hastalıkta sendromun ana bulgusu olan düşük T3, karaciğerde tip 1 aktivitesinin azalmasından ve buna paralel rT3 yıkımının azalmasından kaynaklanır; tip 3 aktivitesindeki artış da katkıda bulunur, kastaki tip 2'nin rolü tartışmalıdır. Peeters 2003'te yoğun bakımda ölen hastaların karaciğerinde tip 1 azalmış, sağlıklı karaciğer ve kasta bulunmayan tip 3 indüklenmişti. Sitokinlerden IL-6 anahtar roldedir: sT3 ile negatif, rT3 ile pozitif ilişkilidir; TNF-alfa NF-kappa B üzerinden tip 1'i baskılar. Hipotalamusta ise inflamasyon tip 2'yi artırır, yerel T3 artar, TRH nöronları baskılanır ve TSH düşük-normal kalır. Dopamin ve glukokortikoidler TSH'yi baskılar ve T4'ün T3'e dönüşümünü bozar.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.d1{animation-name:d1}@keyframes d1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.d1 .ciz{animation-name:d1c}@keyframes d1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.d2{animation-name:d2}@keyframes d2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.d2 .ciz{animation-name:d2c}@keyframes d2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.d3{animation-name:d3}@keyframes d3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.d3 .ciz{animation-name:d3c}@keyframes d3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.d4{animation-name:d4}@keyframes d4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.d4 .ciz{animation-name:d4c}@keyframes d4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.d5{animation-name:d5}@keyframes d5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.d5 .ciz{animation-name:d5c}@keyframes d5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.d6{animation-name:d6}@keyframes d6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.d6 .ciz{animation-name:d6c}@keyframes d6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.d7{animation-name:d7}@keyframes d7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.d7 .ciz{animation-name:d7c}@keyframes d7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="640" height="720" fill="#ffffff"/>
<g class="a d1"><rect x="10" y="10" width="620" height="62" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Sağlıkta</text><text x="320" y="55.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">T4'ün tamamı tiroidden · T3'ün yalnız %20'si tiroidden, kalanı periferde T4'ten</text></g>
<g class="a d2"><rect x="250" y="92" width="140" height="56" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="117" font-size="16" font-weight="800" text-anchor="middle" fill="#1e3a8a">T4</text><text x="320" y="136" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">serumda</text><path class="a ciz" pathLength="1" d="M250,120 L170,196" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><text x="150" y="150" font-size="11" font-weight="800" text-anchor="end" fill="#dc2626">D1 · D2 ↓</text><path class="a ciz" pathLength="1" d="M390,120 L470,196" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#okY)"/><text x="490" y="150" font-size="11" font-weight="800" text-anchor="start" fill="#16a34a">D3 ↑</text></g>
<g class="a d3"><rect x="30" y="200" width="240" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="150" y="226.5" font-size="15" font-weight="800" text-anchor="middle" fill="#7f1d1d">T3 ↓ (aktif)</text><text x="150" y="245.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">düşük T3 sendromu</text><text x="150" y="261.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">sendromun ana bulgusu</text><rect x="370" y="200" width="240" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="490" y="226.5" font-size="15" font-weight="800" text-anchor="middle" fill="#78350f">rT3 ↑ (inaktif)</text><text x="490" y="245.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">üretim ↑ (D3)</text><text x="490" y="261.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">yıkım ↓ (karaciğer D1 ↓)</text><path class="a ciz" pathLength="1" d="M270,250 L368,250" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#okY)"/><text x="320" y="242" font-size="11" font-weight="800" text-anchor="middle" fill="#16a34a">D3: T3 → T2</text></g>
<g class="a d4"><rect x="10" y="296" width="620" height="92" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="320.25" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Doku düzeyi · Peeters 2003 (yoğun bakımda ölen hastalar)</text><text x="320" y="340.25" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">karaciğerde D1 azalmış · D3, sağlıklı karaciğer ve kasta yokken İNDÜKLENMİŞ</text><text x="320" y="357.25" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">en düşük T3/rT3 oranı kardiyovasküler kollapsta ölenlerde, en yüksek beyin hasarında</text><text x="320" y="374.25" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">serum düzeyi doku düzeyini yansıtmaz: organa göre azalır, değişmez ya da artar</text></g>
<g class="a d5"><rect x="10" y="404" width="300" height="116" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="160" y="431.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Sitokinler</text><text x="160" y="451.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">IL-6 anahtar: sT3 ile (−),</text><text x="160" y="468.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">rT3 ile (+) ilişkili</text><text x="160" y="485.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">TNF-α → NF-κB → D1 ↓</text><text x="160" y="502.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">IFN-α etkisini IL-6 üzerinden</text><rect x="330" y="404" width="300" height="116" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="480" y="431.5" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Hipotalamus (santral kol)</text><text x="480" y="451.5" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">inflamasyon → hipotalamusta D2 ↑</text><text x="480" y="468.5" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">yerel T3 ↑ → TRH nöronları ↓</text><text x="480" y="485.5" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">T3 ve T4 düşükken TSH</text><text x="480" y="502.5" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">normal ya da düşük kalır</text></g>
<g class="a d6"><rect x="10" y="536" width="620" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="560.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">İlaçlar tabloyu derinleştirir</text><text x="320" y="580.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">dopamin, glukokortikoid: TSH baskılanır, T4 → T3 dönüşümü bozulur</text><text x="320" y="597.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">östrojen, yüksek doz salisilat, fenitoin: tiroid hormonunun TBG'ye bağlanması bozulur</text></g>
<g class="a d7"><text x="320" y="646" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Akut fazda düşük T3, katabolizmaya karşı uyum olarak görülüyor; uzayan kritik hastalıkta uyum bozulabilir.</text><text x="320" y="700" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: TEMD 2025 Bölüm 25 (Tablo 25.2–25.4); Peeters 2003 (yayın özeti)</text></g>
</svg>
