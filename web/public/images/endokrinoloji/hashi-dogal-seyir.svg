<g class="a d5"><rect x="10" y="330" width="410" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="215" y="365.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">Kendiliğinden DÜZELEBİLİR (TEMD 2025)</text><text x="215" y="384.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">antikor (−) ve TSH &lt;10: 1–2 yılda normale dönebilir</text></g>
<g class="a d6"><text x="320" y="446" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Papiller tiroid kanseriyle iki yönlü ilişki (Lee 2013 · 38 çalışma · 10.648 kanser)</text><rect x="10" y="458" width="300" height="112" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="490.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Birliktelik</text><text x="160" y="511.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">kanserlerin %23,2'sinde histolojik HT</text><text x="160" y="529.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">benign hastalığa göre OR 2,8</text><text x="160" y="547.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">(cerrahi serilerden — seçim yanlılığı)</text><rect x="330" y="458" width="300" height="112" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="480" y="490.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">Daha uysal seyir</text><text x="480" y="511.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">lenf nodu metastazı yok: OR 1,3</text><text x="480" y="529.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">tiroid dışı yayılım yok: OR 1,3</text><text x="480" y="547.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">nükssüz sağkalım HR 0,6</text></g>
