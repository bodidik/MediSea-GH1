<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hashimoto tiroiditinin doğal seyri: ötiroididen aşikar hipotiroidiye, ilerlemeyi belirleyenler</title>
<desc id="d">Hashimoto tiroiditinde lenfositik infiltrasyon foliküler hücreleri yavaşça yıkar. Hastaların çoğu başlangıçta ötiroiddir; yıkım sırasında depolanmış hormonun dökülmesiyle geçici tirotoksikoz (hashitoksikoz) görülebilir. Rezerv azaldıkça TSH yükselir: önce subklinik, sonra aşikar hipotiroidi gelişir. TEMD 2025'e göre subklinik hipotiroidinin aşikar hipotiroidiye ilerleme oranı yıllık yüzde 2–4'tür; risk başlangıç TSH'si 12–15'in üzerindeyse ve anti-TPO pozitifse artar. Antikoru negatif, TSH'si 10'un altında olan hastalarda TSH 1–2 yılda kendiliğinden normale dönebilir. Histolojik olarak kanıtlanmış Hashimoto, papiller tiroid kanserinde benign hastalıklara göre 2,8 kat sık görülür; ancak Hashimoto zeminindeki papiller kanserin lenf nodu metastazı daha seyrek, nükssüz sağkalımı daha uzundur (meta-analiz, 10.648 kanser).</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
