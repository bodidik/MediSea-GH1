</defs>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a k1"><rect x="10" y="10" width="300" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="32.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">Tiroid şüphesi YOK</text><text x="160" y="52.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">yoğun bakımda TFT istemek</text><text x="160" y="69.75" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">gerekli değil</text><rect x="330" y="10" width="300" height="72" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="480" y="32.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Tiroid şüphesi VAR</text><text x="480" y="52.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">TSH tek başına yetersiz</text><text x="480" y="69.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">→ TSH + sT4 (± TT3, TT4)</text></g>
<g class="a k2"><path class="a ciz" pathLength="1" d="M480,84 L480,104" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="10" y="108" width="620" height="40" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="131.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Sonuç örüntüsü → TEMD önerisi</text></g>
<g class="a k3"><rect x="10" y="160" width="300" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="190" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">sT4 düşük + TSH ≥ 20</text><text x="160" y="210" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">hipotiroidi şüphesi</text><text x="160" y="227" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ tiroid hormonu VER</text><text x="160" y="244" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">iyileşince yeniden değerlendir</text><rect x="330" y="160" width="300" height="104" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="480" y="189.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#78350f">sT4 ve TT3 düşük, tiroid hastalığı yok</text><text x="480" y="209.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">→ tiroid hormonu VERME (1B)</text><text x="480" y="226.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">CABG sonrası, önceden ötiroid:</text><text x="480" y="243.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">→ VERME (1A)</text></g>
<g class="a k4"><rect x="10" y="276" width="300" height="104" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="160" y="306" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Hipertiroidi şüphesi</text><text x="160" y="326" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">TSH &lt; 0,01 (0,05'e kadar)</text><text x="160" y="343" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">+ T4/T3 normal-yüksek</text><text x="160" y="360" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">→ ATD önerilebilir (2C)</text><rect x="330" y="276" width="300" height="104" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="480" y="306" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">Santral hipotiroidi şüphesi</text><text x="480" y="326" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">öteki hipofiz hormonları</text><text x="480" y="343" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">özellikle KORTİZOL</text><text x="480" y="360" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">tanı iyileşmeye dek gecikebilir</text></g>
<g class="a k5"><rect x="10" y="392" width="620" height="50" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="420.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Altta yatan hastalık düzelince tiroid testleri TEKRARLANIR</text></g>
<g class="a k6"><text x="320" y="474" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Hormon vermek sonucu değiştirdi mi? (randomize çalışmalar)</text><rect x="10" y="488" width="196" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="108" y="525.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0f172a">Becker 1982 · yanık</text><text x="108" y="545.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">T3 sT3 indeksini düzeltti</text><text x="108" y="562.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">mortalite ve</text><text x="108" y="579.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">metabolik hız: fark yok</text><rect x="222" y="488" width="196" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="525.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0f172a">Brent 1986 · 23 YB</text><text x="320" y="545.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">düşük T4 · 2 hafta İV LT4</text><text x="320" y="562.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">mortalite %73 ↔ %75</text><text x="320" y="579.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">LT4 TSH'yi baskıladı</text><rect x="434" y="488" width="196" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="532" y="525.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0f172a">Klemperer 1995 · 142</text><text x="532" y="545.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">CABG + İV T3</text><text x="532" y="562.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">kalp indeksi 2,97 ↔ 2,67</text><text x="532" y="579.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">sonuç: fark yok</text></g>
<g class="a k7"><text x="320" y="646" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Serumdaki hormonu düzeltmek dokudaki hormonu ve etkisini düzeltmek demek değil.</text><text x="320" y="670" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0f172a">TEMD: TDHS'de hormon replasmanı öneren kanıta dayalı fikir birliği ya da kılavuz yok.</text><text x="320" y="730" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: TEMD 2025 Bölüm 25 (TEMD önerileri); yayın özetleri (PubMed)</text></g>
