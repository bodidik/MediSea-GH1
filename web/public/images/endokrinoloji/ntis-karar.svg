<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Yoğun bakımda tiroid testi: ne zaman istenir, sonuç nasıl yorumlanır, hormon verilir mi (TEMD 2025)</title>
<desc id="d">TEMD 2025 önerileri: tiroid hastalığı şüphesi yoksa yoğun bakım hastasında tiroid testi istemek gerekli değildir. Şüphe varsa tek başına TSH yetersizdir, TSH ve serbest T4 birlikte ölçülür; bazı klinisyenler total T3 ve total T4'ü de ekler. Düşük serbest T4 ile TSH 20 mU/L ve üzerindeyse hasta tiroid hormonuyla tedavi edilir ve iyileşince yeniden değerlendirilir. Düşük serbest T4 ve total T3'ü olan, altta primer tiroid hastalığı görünmeyen kritik hastada tiroid hormonu verilmez (derece 1B); daha önce ötiroid olup koroner baypas uygulanan hastaya ameliyattan hemen sonra tiroid hormonu verilmez (derece 1A). Hipertiroidi şüphesinde (TSH genellikle 0,01'in altında, 0,05'e kadar olabilir, T4 ve/veya T3 normal ya da yüksek-normal) iyileşince yeniden değerlendirme planıyla antitiroid ilaç önerilebilir (derece 2C). Santral hipotiroidi düşünülürse öteki hipofiz hormonları, özellikle kortizol bakılır. Altta yatan hastalık düzelince testler tekrarlanır. Tedavi çalışmaları: yanık hastalarında T3 serbest T3 indeksini düzeltti ama mortaliteyi ve metabolik hızı değiştirmedi (Becker 1982); düşük T4'lü 23 yoğun bakım hastasında 2 hafta damar içi LT4 ile mortalite yüzde 73, kontrolde yüzde 75 idi (Brent 1986); 142 koroner baypas hastasında T3 kalp debisini 2,97'ye 2,67 artırdı ama ritim bozukluğu, ilaç ihtiyacı, morbidite ve mortaliteyi değiştirmedi (Klemperer 1995).</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.k1{animation-name:k1}@keyframes k1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.k1 .ciz{animation-name:k1c}@keyframes k1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.k2{animation-name:k2}@keyframes k2{0%,13%{opacity:0;transform:translateY(7px)}16%,100%{opacity:1;transform:none}}
.k2 .ciz{animation-name:k2c}@keyframes k2c{0%,13%{stroke-dashoffset:1}17%,100%{stroke-dashoffset:0}}
.k3{animation-name:k3}@keyframes k3{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.k3 .ciz{animation-name:k3c}@keyframes k3c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.k4{animation-name:k4}@keyframes k4{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.k4 .ciz{animation-name:k4c}@keyframes k4c{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.k5{animation-name:k5}@keyframes k5{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.k5 .ciz{animation-name:k5c}@keyframes k5c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.k6{animation-name:k6}@keyframes k6{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.k6 .ciz{animation-name:k6c}@keyframes k6c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.k7{animation-name:k7}@keyframes k7{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.k7 .ciz{animation-name:k7c}@keyframes k7c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
