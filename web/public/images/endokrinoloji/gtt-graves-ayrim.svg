<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gebelikte düşük TSH: GTT mi Graves mi</title>
<desc id="d">TSH 0,1 mU/L'nin altında: serbest T4, gerekirse total T3 ve TRAb. GTT: bulantı-kusma, guatr ve oftalmopati yok, TRAb negatif, ilk yarıyla sınırlı; destek tedavi, antitiroid ilaç yok, 14–18. haftada düzelir. Graves: guatr, orbitopati, TRAb pozitif; tedavi.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="540" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="140" y="14" width="360" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">İlk üç ay, TSH &lt;0,1 mU/L</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Gebeliğe özgü aralıkla yorumla</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="76" x2="320" y2="104" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="140" y="106" width="360" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">sT4 (gerekirse total T3) + TRAb</text><text x="320" y="151" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Sintigrafi kontrendike</text></g><g class="a" style="animation-delay:4.80s"><line x1="250" y1="168" x2="160" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="208" width="296" height="150" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="162" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">GTT / hiperemezis</text><text x="162" y="270" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Belirgin bulantı-kusma</text><text x="162" y="288" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Guatr, oftalmopati yok</text><text x="162" y="306" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">TRAb negatif</text><text x="162" y="324" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">sT4 hafif ↑, T3 normal olabilir</text></g><g class="a" style="animation-delay:7.20s"><line x1="390" y1="168" x2="480" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="330" y="208" width="296" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="478" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Graves</text><text x="478" y="270" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Guatr, orbitopati</text><text x="478" y="288" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">TRAb pozitif (%96–97)</text><text x="478" y="306" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">sT4 ve T3 birlikte ↑</text><text x="478" y="324" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Doppler'de artmış akım</text></g><g class="a" style="animation-delay:9.60s"><line x1="160" y1="358" x2="160" y2="386" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="388" width="296" height="80" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="162" y="415" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Destek, antitiroid ilaç yok</text><text x="162" y="433" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Sıvı · elektrolit · antiemetik</text><text x="162" y="451" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Ağır belirti: kısa süre beta bloker</text></g><g class="a" style="animation-delay:12.00s"><line x1="480" y1="358" x2="480" y2="386" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="330" y="388" width="296" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="478" y="415" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Tedavi gerekir</text><text x="478" y="433" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Gebelikte antitiroid ilaç</text><text x="478" y="451" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">(ayrı sayfa)</text></g><g class="a" style="animation-delay:14.40s"><line x1="160" y1="468" x2="160" y2="482" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="484" width="612" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="512" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">14–18. haftada düzelmezse ya da ilk üç aydan sonra sürerse: Graves'i yeniden düşün</text></g>
</svg>
