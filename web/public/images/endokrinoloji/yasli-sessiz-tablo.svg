<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Yaşlıda hipertiroidi neden sessiz kalır ve neyle yakalanır</title>
<desc id="d">3049 ardışık hipertiroidi hastasında (Boelaert 2010) yaş arttıkça klasik belirtilerin çoğunun görülme olasılığı, hastalığın şiddetinden bağımsız olarak azaldı; iki istisna kilo kaybı ve nefes darlığıydı. 61 yaş üstünde beş ve daha fazla belirti bildiren hasta oranı en düşüktü. Atriyal fibrilasyonla bağımsız ilişkili etkenler ileri yaş, yüksek serbest T4, erkek cinsiyet ve toksik nodüler hastalıktı. Yazarlar 60 yaş üstünde, özellikle atriyal fibrilasyon, kilo kaybı ya da nefes darlığıyla gelen hastada tiroid testinin eşiğinin düşürülmesini önerdi. Yaşlıda neden daha sık toksik nodüler guatrdır; tablo yavaş gelişir.</desc>
<!-- 16 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:16s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(7px)}18%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,15%{stroke-dashoffset:1}19%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,29%{opacity:0;transform:translateY(7px)}32%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,29%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:s5c}@keyframes s5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:s6c}@keyframes s6c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="640" height="600" fill="#ffffff"/>
<g class="a s1"><text x="320" y="22" font-size="14" font-weight="800" text-anchor="middle" fill="#0f172a">Yaş arttıkça klasik belirtilerin çoğu azalır (Boelaert 2010 · 3049 hasta)</text><text x="320" y="40" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">örnek: ETA 2018'in saydığı tipik tablo</text><rect x="20" y="70" width="190" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8"/><text x="115" y="95" font-size="12.5" font-weight="700" text-anchor="middle" fill="#64748b">titreme</text><rect x="225" y="70" width="190" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8"/><text x="320" y="95" font-size="12.5" font-weight="700" text-anchor="middle" fill="#64748b">ajitasyon</text><rect x="430" y="70" width="190" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8"/><text x="525" y="95" font-size="12.5" font-weight="700" text-anchor="middle" fill="#64748b">sıcağa dayanamama</text></g>
<g class="a s2"><line x1="38" y1="90" x2="192" y2="90" stroke="#dc2626" stroke-width="2.4"/><line x1="243" y1="90" x2="397" y2="90" stroke="#dc2626" stroke-width="2.4"/><line x1="448" y1="90" x2="602" y2="90" stroke="#dc2626" stroke-width="2.4"/><text x="320" y="140" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b91c1c">olasılık yaşla düşüyor — hastalığın şiddetinden bağımsız</text></g>
<g class="a s3"><text x="320" y="202" font-size="14" font-weight="800" text-anchor="middle" fill="#0f172a">Yaşla KALANLAR</text><rect x="70" y="214" width="230" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="185" y="244.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Kilo kaybı</text><text x="185" y="263.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">iştah artışı OLMADAN</text><rect x="340" y="214" width="230" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="455" y="244.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Nefes darlığı</text><text x="455" y="263.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">efor dispnesi</text></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,290 L320,316" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#okK)"/><rect x="120" y="320" width="400" height="92" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="353.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Atriyal fibrilasyon</text><text x="320" y="372.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">bağımsız ilişkili: ileri yaş · yüksek sT4</text><text x="320" y="388.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">erkek cinsiyet · toksik nodüler hastalık</text></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,414 L320,440" stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#ok)"/><rect x="70" y="444" width="500" height="100" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="481.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">60 yaş üstünde tiroid testi eşiğini düşür</text><text x="320" y="500.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">özellikle: yeni AF · açıklanamayan kilo kaybı · nefes darlığı</text><text x="320" y="516.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e3a8a">(Boelaert 2010 önerisi)</text></g>
<g class="a s6"><text x="320" y="572" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: Boelaert K ve ark. J Clin Endocrinol Metab 2010;95:2715</text></g>
</svg>
