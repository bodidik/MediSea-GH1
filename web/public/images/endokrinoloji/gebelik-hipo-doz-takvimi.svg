<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" width="640" height="740" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Önceden LT4 alan kadında gebelik öncesinden doğum sonrasına doz ve izlem takvimi (TEMD 2025)</title>
<desc id="d">Normal gebelikte tiroid bezinin hormon salınımı yüzde 30–50 artar. Gebelik planlayan ya da doğurganlık potansiyeli olan hipotiroid kadında LT4 altında TSH 2,5 mU/L'nin altında tutulur. Gebelik doğrulanır doğrulanmaz doz artırılır: haftanın iki günü günlük dozun iki katı verilmesi günlük yüzde 29'luk artışa denk düşer; diğer yol günlük dozun yüzde 25–30 artırılmasıdır. Fonksiyonel tiroid dokusu olmayan, cerrahi ya da radyoaktif iyotla ablasyon yapılmış kadında artış ihtiyacı Hashimoto'ya bağlı hipotiroididen fazladır. Santral hipotiroidide doz yüzde 25–50 artırılır, sT4 normal aralığın üst çeyreğinde tutulur. İlk 24 haftada dört haftada bir izlenir; sonra doz ihtiyacı değişmiyorsa doğuma kadar bir kez değerlendirme yeterlidir. Hedef TSH'nin trimestere özgü değerlere göre normalleşmesidir. Doğumda doz gebelik öncesine indirilir, postpartum 6. haftada TSH bakılır. Gerekenden fazla doz erken doğumla ilişkilidir. Gebelik öncesi TPO pozitif ötiroid kadında gebelikte TSH yükselme riski yüzde 20'dir; ilk 24 haftada 4–6 haftada bir izlenmesi uygun görünür. Gebe ve emzirende günlük iyot alımı 250 µg olmalıdır; Türkiye'de iyotlu tuz tüketen gebede alım ortalama 100–150 µg varsayılır, tuz kısıtlaması yapılan gebeye 200 µg iyot desteği verilir.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.d0{animation-name:d0}@keyframes d0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.d0 .ciz{animation-name:d0c}@keyframes d0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.d1{animation-name:d1}@keyframes d1{0%,11%{opacity:0;transform:translateY(7px)}14%,100%{opacity:1;transform:none}}
.d1 .ciz{animation-name:d1c}@keyframes d1c{0%,11%{stroke-dashoffset:1}15%,100%{stroke-dashoffset:0}}
.d2{animation-name:d2}@keyframes d2{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.d2 .ciz{animation-name:d2c}@keyframes d2c{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.d3{animation-name:d3}@keyframes d3{0%,33%{opacity:0;transform:translateY(7px)}36%,100%{opacity:1;transform:none}}
.d3 .ciz{animation-name:d3c}@keyframes d3c{0%,33%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.d4{animation-name:d4}@keyframes d4{0%,44%{opacity:0;transform:translateY(7px)}47%,100%{opacity:1;transform:none}}
.d4 .ciz{animation-name:d4c}@keyframes d4c{0%,44%{stroke-dashoffset:1}48%,100%{stroke-dashoffset:0}}
.d5{animation-name:d5}@keyframes d5{0%,55%{opacity:0;transform:translateY(7px)}58%,100%{opacity:1;transform:none}}
.d5 .ciz{animation-name:d5c}@keyframes d5c{0%,55%{stroke-dashoffset:1}59%,100%{stroke-dashoffset:0}}
.d6{animation-name:d6}@keyframes d6{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.d6 .ciz{animation-name:d6c}@keyframes d6c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
.d7{animation-name:d7}@keyframes d7{0%,77%{opacity:0;transform:translateY(7px)}80%,100%{opacity:1;transform:none}}
.d7 .ciz{animation-name:d7c}@keyframes d7c{0%,77%{stroke-dashoffset:1}81%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
