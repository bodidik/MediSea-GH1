<rect width="640" height="740" fill="#ffffff"/>
<g class="a d0"><line x1="40" y1="44" x2="600" y2="44" stroke="#94a3b8" stroke-width="3"/><circle cx="60" cy="44" r="7" fill="#1e3a8a"/><text x="60" y="26" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">planlama</text><circle cx="190" cy="44" r="7" fill="#1e3a8a"/><text x="190" y="26" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">test (+)</text><circle cx="330" cy="44" r="7" fill="#1e3a8a"/><text x="330" y="26" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">24. hafta</text><circle cx="470" cy="44" r="7" fill="#1e3a8a"/><text x="470" y="26" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">doğum</text><circle cx="590" cy="44" r="7" fill="#1e3a8a"/><text x="590" y="26" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">6. hafta</text></g>
<g class="a d1"><rect x="10" y="64" width="620" height="62" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="90.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Fizyoloji</text><text x="320" y="109.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">normal gebelikte tiroid hormon salınımı %30–50 artar → hipotiroid annede LT4 ihtiyacı artar</text></g>
<g class="a d2"><rect x="10" y="140" width="196" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="108" y="172.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Planlama</text><text x="108" y="193.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">doğurganlık çağında</text><text x="108" y="211.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">LT4 altında</text><text x="108" y="229.5" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">TSH &lt; 2,5 mU/L</text><rect x="222" y="140" width="408" height="112" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="426" y="172.5" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Gebelik doğrulanır doğrulanmaz doz ARTIR</text><text x="426" y="193.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">haftada 2 gün çift doz = günlük ~%29 artış</text><text x="426" y="211.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">ya da günlük dozu %25–30 artır</text><text x="426" y="229.5" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">ablasyon (cerrahi/RAI) &gt; Hashimoto · şüphede hasta hekime başvurur</text></g>
<g class="a d3"><rect x="10" y="266" width="300" height="112" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="291.5" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">İzlem</text><text x="160" y="311.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">ilk 24 hafta: 4 haftada bir</text><text x="160" y="328.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">sonra (doz değişmiyorsa):</text><text x="160" y="345.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">doğuma kadar bir kez</text><text x="160" y="362.5" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">hedef: trimestere özgü normal TSH</text><rect x="330" y="266" width="300" height="112" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="298.5" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Santral hipotiroidi</text><text x="480" y="319.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">LT4 %25–50 artır</text><text x="480" y="337.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">TSH değil sT4 izlenir</text><text x="480" y="355.5" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">sT4: normal aralığın üst çeyreği</text></g>
<g class="a d4"><rect x="10" y="392" width="300" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160" y="425.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">Doğumdan sonra</text><text x="160" y="446.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">doz gebelik öncesine indirilir</text><text x="160" y="464.5" font-size="11" font-weight="500" text-anchor="middle" fill="#14532d">postpartum 6. hafta TSH</text><rect x="330" y="392" width="300" height="96" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="480" y="418" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">Fazla doz da zararlı</text><text x="480" y="438" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">gerekenden fazla LT4 → erken doğum</text><text x="480" y="455" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">Lemieux 2021: TSH &lt; 0,10 → erken doğum</text><text x="480" y="472" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">aOR 2,14 (1,51–2,78)</text></g>
<g class="a d5"><rect x="10" y="502" width="620" height="62" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="528.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">TPO (+) ama ötiroid kadın</text><text x="320" y="547.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0f172a">gebelikte TSH yükselme riski %20 · ilk 24 hafta 4–6 haftada bir izlem uygun görünür</text></g>
<g class="a d6"><rect x="10" y="578" width="620" height="92" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="320" y="602.25" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e3a8a">İyot · Türkiye</text><text x="320" y="622.25" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">gebe/emziren: 250 µg/gün · iyotlu tuzla alım ortalama 100–150 µg/gün · tuz kısıtlıda +200 µg/gün destek</text><text x="320" y="639.25" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">Trabzon 864 gebe: medyan idrar iyotu 102 µg/L (iyotlu tuz kullanımı %90,7)</text><text x="320" y="656.25" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">İstanbul 3543 gebe: medyan 73 µg/L · %90,7'si 150 µg/L'nin altında</text></g>
