<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kronik hiponatremide aşırı düzeltme ve geri düşürme</title>
<desc id="d">Zaman (saat) ve serum sodyumu grafiği. Başlangıç sodyumu 112 mmol/L. Yüksek riskli hastada 24 saatlik sınır başlangıçtan 8 mmol/L (120), standart riskte 10 mmol/L; 48 saatte 18 mmol/L. Su diürezi başlayınca sodyum 16. saatte 123,5'e çıkarak 8'lik sınırı aşar. Aktif tedavi kesilir, desmopressin 2–4 mcg IV/SC ve yüzde 5 dekstroz 3 mL/kg/saat verilir; sodyum 24. saatte 120'ye geri düşürülür, sonra kontrollü yükselir.</desc>
<!-- 14 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: di-semalar.cjs -->
<style>
.a{animation-duration:14s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.eks{animation-name:eks}@keyframes eks{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.eks .ciz{animation-name:eksc}@keyframes eksc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.sinir{animation-name:sinir}@keyframes sinir{0%,8%{opacity:0;transform:translateY(7px)}11%,100%{opacity:1;transform:none}}
.sinir .ciz{animation-name:sinirc}@keyframes sinirc{0%,8%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
.cizgi1{animation-name:cizgi1}@keyframes cizgi1{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.cizgi1 .ciz{animation-name:cizgi1c}@keyframes cizgi1c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.asim{animation-name:asim}@keyframes asim{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.asim .ciz{animation-name:asimc}@keyframes asimc{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.mud{animation-name:mud}@keyframes mud{0%,50%{opacity:0;transform:translateY(7px)}53%,100%{opacity:1;transform:none}}
.mud .ciz{animation-name:mudc}@keyframes mudc{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.cizgi2{animation-name:cizgi2}@keyframes cizgi2{0%,60%{opacity:0;transform:translateY(7px)}63%,100%{opacity:1;transform:none}}
.cizgi2 .ciz{animation-name:cizgi2c}@keyframes cizgi2c{0%,60%{stroke-dashoffset:1}64%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,80%{opacity:0;transform:translateY(7px)}83%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,80%{stroke-dashoffset:1}84%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="600" fill="#ffffff"/>

<text x="320" y="24" font-size="13" font-weight="800" text-anchor="middle" fill="#0f172a">Serum Na⁺ (mmol/L) · başlangıç 112</text>
<g class="a eks"><line x1="80" y1="380" x2="600" y2="380" stroke="#e2e8f0"/><text x="72" y="384" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">110</text><line x1="80" y1="325.45454545454544" x2="600" y2="325.45454545454544" stroke="#e2e8f0"/><text x="72" y="329.45454545454544" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">114</text><line x1="80" y1="270.9090909090909" x2="600" y2="270.9090909090909" stroke="#e2e8f0"/><text x="72" y="274.9090909090909" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">118</text><line x1="80" y1="216.36363636363637" x2="600" y2="216.36363636363637" stroke="#e2e8f0"/><text x="72" y="220.36363636363637" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">122</text><line x1="80" y1="161.8181818181818" x2="600" y2="161.8181818181818" stroke="#e2e8f0"/><text x="72" y="165.8181818181818" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">126</text><line x1="80" y1="107.27272727272731" x2="600" y2="107.27272727272731" stroke="#e2e8f0"/><text x="72" y="111.27272727272731" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">130</text><line x1="80" y1="80" x2="80" y2="380" stroke="#f1f5f9"/><text x="80" y="398" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">0 sa</text><line x1="210" y1="80" x2="210" y2="380" stroke="#f1f5f9"/><text x="210" y="398" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">12 sa</text><line x1="340" y1="80" x2="340" y2="380" stroke="#f1f5f9"/><text x="340" y="398" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">24 sa</text><line x1="470" y1="80" x2="470" y2="380" stroke="#f1f5f9"/><text x="470" y="398" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">36 sa</text><line x1="600" y1="80" x2="600" y2="380" stroke="#f1f5f9"/><text x="600" y="398" font-size="10.5" font-weight="500" text-anchor="middle" fill="#64748b">48 sa</text><line x1="80" y1="380" x2="600" y2="380" stroke="#475569" stroke-width="1.6"/><line x1="80" y1="80" x2="80" y2="380" stroke="#475569" stroke-width="1.6"/></g>
<g class="a sinir"><rect x="80" y="243.63636363636365" width="260" height="54.54545454545453" fill="#dcfce7" opacity=".7"/><text x="210" y="274.9090909090909" font-size="10.5" font-weight="700" text-anchor="middle" fill="#14532d">hedef 4–6</text><line x1="80" y1="243.63636363636365" x2="340" y2="243.63636363636365" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="86" y="237.63636363636365" font-size="10.5" font-weight="700" text-anchor="start" fill="#b91c1c">yüksek risk sınırı +8 (24 sa)</text><line x1="80" y1="216.36363636363637" x2="340" y2="216.36363636363637" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="3 4"/><text x="336" y="210.36363636363637" font-size="10" font-weight="500" text-anchor="end" fill="#b45309">standart +10</text><line x1="340" y1="107.27272727272731" x2="600" y2="107.27272727272731" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="470" y="101.27272727272731" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">48 sa sınırı +18</text></g>
<g class="a cizgi1"><path class="a ciz" pathLength="1" d="M80.0,352.7 L123.3,298.2 L166.7,257.3 L210.0,216.4 L253.3,195.9" stroke="#dc2626" stroke-width="3" fill="none"/></g>
<g class="a asim"><circle cx="253.33333333333331" cy="195.9090909090909" r="7" fill="#dc2626"/><text x="263.3333333333333" y="185.9090909090909" font-size="11" font-weight="800" text-anchor="start" fill="#b91c1c">su diürezi → sınır aşıldı</text></g>
<g class="a mud"><rect x="264.1666666666667" y="344.5454545454546" width="236" height="40" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="382.1666666666667" y="361.5454545454546" font-size="11" font-weight="800" text-anchor="middle" fill="#0c4a6e">desmopressin 2–4 mcg + D5W</text><text x="382.1666666666667" y="376.5454545454546" font-size="10.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">3 mL/kg/sa · aktif tedavi kesilir</text></g>
<g class="a cizgi2"><path class="a ciz" pathLength="1" d="M253.3,195.9 L296.7,223.2 L340.0,243.6 L470.0,189.1 L600.0,134.5" stroke="#16a34a" stroke-width="3" fill="none"/></g>
<g class="a son"><rect x="20" y="420" width="600" height="160" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="462.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Kurallar</text><text x="320" y="479.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Standart risk: ilk 24 saatte en fazla +10 (ABD: 10–12), 48 saatte en fazla +18 mmol/L</text><text x="320" y="496.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Yüksek ODS riski (Na ≤105, hipokalemi, alkolizm, malnütrisyon, karaciğer): en fazla +8, hedef +4–6</text><text x="320" y="513.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Ağır semptomda ilk saatlerde +4–6 yeterli: %3 NaCl 100–150 mL bolus, 2 kez tekrar</text><text x="320" y="530.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Su diürezi (hipovolemi, tiyazid, kortizol düzeltilmesi) ani aşırı düzeltmenin tipik sebebidir</text><text x="320" y="547.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Sınır aşılınca: sodyumu yeniden düşür (DDAVP + serbest su), 2–4 saatte bir ölç</text></g>

</svg>
