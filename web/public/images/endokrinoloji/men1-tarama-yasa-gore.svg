"13" fill="#4c1d95">yaşamın ilk on yılında</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#4c1d95">negatif sonuç: çocukların</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#4c1d95">yarısı taramadan çıkar</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">10 yaş: kan</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">kalsiyum · prolaktin · IGF-1</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">1–3 yılda bir</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">PTH, glukoz, insülin: rutin değil</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">10–15 yaş: pankreas + adrenal MR</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#78350f">normalse 2–3 yılda bir · EUS ve DOTATATE PET seçilmiş durumda</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">15 yaş: hipofiz MR</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#0f172a">belirtisiz çocukta uzlaşı yok</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#0f172a">yapılırsa 3–5 yılda bir</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#0f172a">75 yaşta bırakılabilir</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Erişkin: her yıl</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#1e3a8a">kalsiyum · gastrin</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#1e3a8a">prolaktin · IGF-1</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#1e3a8a">gerisi belirtiye göre</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">20–25 yaş: toraks BT</text><text x="320" y="624.5" text-anchor="middle" font-size="13" fill="#7f1d1d">timik ve bronş NET için 3–5 yılda bir</text><text x="320" y="644.5" text-anchor="middle" font-size="13" fill="#7f1d1d">erkekte ve sigara içende timik NET daha sık</text><text x="320" y="664.5" text-anchor="middle" font-size="13" fill="#7f1d1d">erkek taşıyıcıya sigarayı bırakma önerisi</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">40 yaş: kadında meme taraması</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#064e3b">risk genel topluma göre yaklaşık 2–3 kat, başlangıç daha erken</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#064e3b">2025 kılavuzunda ilk kez ayrı öneri</text></g>
