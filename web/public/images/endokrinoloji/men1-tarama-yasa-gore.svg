<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">MEN1 taşıyıcısında yaşa göre tarama (2025 kılavuzu)</title>
<desc id="d">2025 MEN1 kılavuzuna göre yaşa bağlı tarama basamakları. Yaklaşık 5 yaşında ebeveynle çocuk endokrinoloğu görüşmesi yapılır, yıllık klinik değerlendirmede büyüme, ergenlik ve hipoglisemi belirtileri sorulur; insülinoma taraması belirtiye dayanır. Genetik test yaşamın ilk on yılında yapılır; negatif sonuç çocukların yarısını taramadan kurtarır. 10 yaşından itibaren çocukta 1 ila 3 yılda bir serum kalsiyumu, prolaktin ve IGF-1 bakılır; PTH, açlık glukozu, insülin ve kromogranin A artık rutin değildir. Pankreas ve adrenaller için ilk MR 10 ile 15 yaş arasında çekilir, normalse 2 ila 3 yılda bir tekrarlanır. Hipofiz MR'ı belirtisiz çocukta tartışmalıdır, yapılacaksa 15 yaşında başlar ve 3 ila 5 yılda bir tekrarlanır. Erişkinde her yıl kalsiyum, gastrin, prolaktin ve IGF-1 bakılır. 20 ile 25 yaş arasında 3 ila 5 yılda bir toraks BT ile timik ve bronş nöroendokrin tümör taraması başlar. Kadında 40 yaşında meme kanseri taraması başlar. Belirtisiz hastada 75 yaşında rutin hipofiz MR'ı bırakılabilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
