.s2{animation-name:s2}@keyframes s2{0%,13%{opacity:0;transform:translateY(8px)}16%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,13%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,25%{opacity:0;transform:translateY(8px)}28%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,25%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,38%{opacity:0;transform:translateY(8px)}41%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,38%{stroke-dashoffset:1}43%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,63%{opacity:0;transform:translateY(8px)}66%, 100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:c6}@keyframes c6{0%,63%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,75%{opacity:0;transform:translateY(8px)}78%, 100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:c7}@keyframes c7{0%,75%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,88%{opacity:0;transform:translateY(8px)}91%, 100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:c8}@keyframes c8{0%,88%{stroke-dashoffset:1}93%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
