<g class="a k0"><text x="320" y="24" font-size="15" font-weight="800" text-anchor="middle" fill="#0f172a">Risk gerçek mi, tedavi onu düzeltiyor mu?</text></g>
<g class="a k1"><rect x="10" y="40" width="300" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="65.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">GÖZLEMSEL: RİSK SİNYALİ</text><text x="160" y="84.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">ilişki var, neden-sonuç değil</text><rect x="330" y="40" width="300" height="60" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="480" y="65.75" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">TEDAVİ: RCT VE META-ANALİZ</text><text x="480" y="84.75" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">LT4 neyi değiştiriyor</text></g>
<g class="a k2"><rect x="10" y="110" width="300" height="104" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="139.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#78350f">Maraka 2016 · 18 kohort</text><text x="160" y="159.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">subklinikte gebelik kaybı RR 2,01</text><text x="160" y="176.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">dekolman 2,14 · erken rüptür 1,43</text><text x="160" y="193.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">neonatal ölüm RR 2,58</text><rect x="330" y="110" width="300" height="104" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="480" y="139.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Lazarus 2012 · CATS · 21.846</text><text x="480" y="159.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">pozitif tarama 390 ↔ 404</text><text x="480" y="176.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">3 yaş IQ 99,2 ↔ 100,0 (p=0,40)</text><text x="480" y="193.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">LT4 ortanca 13 hafta 3 günde başladı</text></g>
<g class="a k3"><rect x="10" y="224" width="300" height="104" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="253.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#78350f">Konsorsiyum 2019 · 47.045 gebe</text><text x="160" y="273.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">erken doğum: subklinik %6,1 ↔ %5,0</text><text x="160" y="290.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">hipotiroksinemi %7,1 ↔ %5,0</text><text x="160" y="307.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">TPO (+) %6,6 ↔ %4,9</text><rect x="330" y="224" width="300" height="104" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="480" y="253.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0c4a6e">Casey 2017 · MFMU · 677 + 526</text><text x="480" y="273.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">5 yaş IQ: subklinik 97 ↔ 94 (p=0,71)</text><text x="480" y="290.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">hipotiroksinemi 94 ↔ 91 (p=0,30)</text><text x="480" y="307.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">LT4 ortalama 16,7 / 17,8. haftada</text></g>
