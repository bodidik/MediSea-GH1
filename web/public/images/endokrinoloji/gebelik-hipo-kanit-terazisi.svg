.k2 .ciz{animation-name:k2c}@keyframes k2c{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.k3{animation-name:k3}@keyframes k3{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
