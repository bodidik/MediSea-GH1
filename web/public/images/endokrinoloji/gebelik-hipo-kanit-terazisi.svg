<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gebelikte hafif tiroid yetmezliği: gözlemsel risk sinyali ile tedavi çalışmalarının sonucu</title>
<desc id="d">Gözlemsel risk: 18 kohortun meta-analizinde subklinik hipotiroidide gebelik kaybı RR 2,01, plasenta dekolmanı 2,14, erken membran rüptürü 1,43, neonatal ölüm 2,58 (Maraka 2016). 47.045 gebelik bireysel veri analizinde erken doğum subklinik hipotiroidide yüzde 6,1'e 5,0 (OR 1,29), izole hipotiroksinemide yüzde 7,1'e 5,0 (OR 1,46), TPO pozitiflikte yüzde 6,6'ya 4,9 (OR 1,33). Çin'de 3315 gebede düşük TSH 5,22–10 olan subklinik grupta yüzde 7,1'e 2,2, subklinik ve otoimmünite birlikteyken yüzde 15,2'ye 2,2. LT4 alan 1013 gebelikte TSH 4,51–10 düşük OR 1,80, 10'un üzerinde OR 3,95, 2,51–4,5 arasında OR 1,09 (Taylor 2014). Tedavi: CATS'ta 390 ve 404 pozitif taramalı annenin çocuğunda 3 yaş IQ 99,2'ye 100,0; LT4 ortanca 13 hafta 3 günde başladı. MFMU çalışmasında 677 subklinik hipotiroidide 5 yaş IQ ortancası 97'ye 94 (p=0,71), 526 hipotiroksinemide 94'e 91 (p=0,30); tedavi ortalama 16,7 ve 17,8. haftada başladı. 7 RCT ve 6 gözlemsel çalışmanın meta-analizinde LT4 ile gebelik kaybı RR 0,79, neonatal ölüm RR 0,35; doğum ve çocuk bilişinde fark yok (Bein 2021). Casey 2007: izole hipotiroksinemi 17.298 gebenin yüzde 1,3'ünde, olumsuz sonuç artışı yok.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: kv-semalar.cjs -->
<style>
