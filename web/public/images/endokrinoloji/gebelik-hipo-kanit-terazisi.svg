<g class="a k5"><rect x="10" y="452" width="300" height="104" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160" y="481.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#78350f">Taylor 2014 · LT4 alan 1013 gebelik</text><text x="160" y="501.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">1. trimester TSH &gt; 2,5: %62,8</text><text x="160" y="518.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">düşük: 4,51–10 OR 1,80 · &gt;10 OR 3,95</text><text x="160" y="535.75" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">2,51–4,5 OR 1,09 (anlamsız)</text><rect x="330" y="452" width="300" height="104" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="480" y="481.75" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0f172a">Casey 2007 · 17.298 gebe</text><text x="480" y="501.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">izole hipotiroksinemi %1,3</text><text x="480" y="518.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">olumsuz gebelik sonucu artmadı</text><text x="480" y="535.75" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">TPO (+) %5 (subklinikte %31)</text></g>
<g class="a k6"><text x="320" y="590" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Nörogelişim RCT'lerinde LT4 ilk trimesterden sonra başladı: erken başlamanın etkisi sınanmadı.</text><text x="320" y="614" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0f172a">Gebelik kaybı ve neonatal ölümde meta-analiz yararlı; çocuk zekâsında iki büyük RCT nötr.</text><text x="320" y="638" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0f172a">Önceden LT4 alan kadında risk TSH 4,5'in üzerinde belirginleşiyor.</text><text x="320" y="690" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: yayın özetleri (PubMed); TEMD 2025 Bölüm 26 kaynakçası</text></g>
