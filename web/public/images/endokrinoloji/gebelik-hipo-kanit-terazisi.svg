.k4 .ciz{animation-name:k4c}@keyframes k4c{0%,50%{stroke-dashoffset:1}54%,100%{stroke-dashoffset:0}}
.k5{animation-name:k5}@keyframes k5{0%,63%{opacity:0;transform:translateY(7px)}66%,100%{opacity:1;transform:none}}
.k5 .ciz{animation-name:k5c}@keyframes k5c{0%,63%{stroke-dashoffset:1}67%,100%{stroke-dashoffset:0}}
.k6{animation-name:k6}@keyframes k6{0%,75%{opacity:0;transform:translateY(7px)}78%,100%{opacity:1;transform:none}}
.k6 .ciz{animation-name:k6c}@keyframes k6c{0%,75%{stroke-dashoffset:1}79%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
