<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Subklinik hipertiroidide tedavi kararı (TEMD 2025)</title>
<desc id="d">TSH düşük, sT4 ve T3 normal, kalıcı. TSH 0,1'in altında tedavi. TSH 0,1–0,4: 65 yaş ve üstü, kardiyovasküler hastalık, osteoporoz, hipertiroidi belirtisi ya da östrojen veya bifosfonat almayan postmenopozal kadın ölçütlerinden biri varsa tedavi, hiçbiri yoksa izlem. Graves'te antitiroid ilaç, toksik nodülde radyoiyot.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="520" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="150" y="14" width="340" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">TSH düşük, sT4 ve T3 normal</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">1–3 ay sonra tekrar; taklitçiler dışlandı</text></g><g class="a" style="animation-delay:2.40s"><line x1="250" y1="76" x2="130" y2="116" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="390" y1="76" x2="470" y2="116" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="30" y="118" width="200" height="52" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="130" y="149" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">TSH &lt;0,1 mIU/L</text><rect x="330" y="118" width="280" height="52" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="470" y="149" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">TSH 0,1–0,4 mIU/L</text></g><g class="a" style="animation-delay:4.80s"><line x1="130" y1="170" x2="130" y2="226" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="30" y="228" width="200" height="62" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="130" y="255" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Tedavi</text><text x="130" y="273" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Yaştan bağımsız</text></g><g class="a" style="animation-delay:7.20s"><line x1="470" y1="170" x2="470" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="330" y="198" width="280" height="132" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="470" y="233" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">En az biri var mı?</text><text x="470" y="251" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">≥65 yaş</text><text x="470" y="269" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Kardiyovasküler hastalık</text><text x="470" y="287" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Osteoporoz · hipertiroidi belirtisi</text><text x="470" y="305" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Postmenopoz, östrojen/bifosfonat yok</text></g><g class="a" style="animation-delay:9.60s"><line x1="420" y1="330" x2="400" y2="366" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="520" y1="330" x2="540" y2="366" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="330" y="368" width="130" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="395" y="399" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Var → tedavi</text><rect x="480" y="368" width="130" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="545" y="399" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Yok → izlem</text></g><g class="a" style="animation-delay:12.00s"><line x1="130" y1="290" x2="130" y2="440" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="395" y1="420" x2="395" y2="440" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="442" width="612" height="66" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="462" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Nedene göre</text><text x="320" y="480" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Graves: antitiroid ilaç · Toksik adenom/TMNG: radyoiyot</text><text x="320" y="498" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Cerrahi: büyük guatr, bası, hiperparatiroidi, kanser şüphesi</text></g>
</svg>
