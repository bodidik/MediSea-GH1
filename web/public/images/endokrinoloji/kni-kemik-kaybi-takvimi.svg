<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Nakil sonrası kemik kaybının takvimi</title>
<desc id="d">Kemik kaybı nakilden sonraki ilk üç ila altı ayda en hızlıdır ve kırıkların büyük kısmı ilk altı ayda olur; bu dönemde glukokortikoid ve kalsinörin inhibitörü dozları en yüksektir. Altı ila yirmi dört ay arasında kayıp yavaşlar, kırık sıklığı azalır. Lomber omurga kemik yoğunluğu karaciğer naklinden sonra ilk yılın ikinci yarısında, kalp naklinden sonra ikinci ve üçüncü yıllarda toparlanmaya başlar; femur boynu ise çoğu zaman başlangıç düzeyinin altında kalır. Korunma tedavisi böbrek fonksiyonu oturunca, genellikle ilk ay içinde başlar ve on iki ay sonra yeniden değerlendirilir.</desc>
<style>
.a{animation-duration:10s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}4%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,15%{opacity:0;transform:translateY(8px)}19%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,15%{stroke-dashoffset:1}35%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,36%{opacity:0;transform:translateY(8px)}40%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,52%{opacity:0;transform:translateY(8px)}56%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(8px)}72%,100%{opacity:1;transform:none}}
.s6{animation-name:s6}@keyframes s6{0%,82%{opacity:0;transform:translateY(8px)}86%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="470" fill="#ffffff"/>
<g class="a s1">
<text x="320" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Nakil sonrası kemik kaybının takvimi</text>
<line x1="60" y1="250" x2="610" y2="250" stroke="#475569" stroke-width="2"/>
<text x="60" y="272" text-anchor="middle" font-size="12" fill="#334155">Nakil</text>
<text x="170" y="272" text-anchor="middle" font-size="12" fill="#334155">6. ay</text>
<text x="280" y="272" text-anchor="middle" font-size="12" fill="#334155">12. ay</text>
<text x="500" y="272" text-anchor="middle" font-size="12" fill="#334155">24. ay</text>
<line x1="170" y1="244" x2="170" y2="256" stroke="#475569" stroke-width="2"/><line x1="280" y1="244" x2="280" y2="256" stroke="#475569" stroke-width="2"/><line x1="500" y1="244" x2="500" y2="256" stroke="#475569" stroke-width="2"/>
<text x="40" y="90" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(-90 40 150)">KMY (başlangıca göre)</text>
<line x1="60" y1="90" x2="610" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="606" y="84" text-anchor="end" font-size="11" fill="#475569">başlangıç düzeyi</text>
</g>
<g class="a s2">
<path class="a ciz" pathLength="1" d="M60,90 C100,150 140,190 170,195 C230,200 280,175 330,140 C400,100 470,95 600,94" fill="none" stroke="#0284c7" stroke-width="3"/>
<text x="600" y="112" text-anchor="end" font-size="12" font-weight="700" fill="#075985">lomber omurga: toparlanır</text>
<path class="a ciz" pathLength="1" d="M60,90 C100,160 140,205 170,212 C260,222 400,205 600,200" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="600" y="222" text-anchor="end" font-size="12" font-weight="700" fill="#991b1b">femur boynu: çoğu zaman altta kalır</text>
</g>
<g class="a m s3"><rect x="60" y="290" width="200" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
<text x="160" y="314" text-anchor="middle" font-size="13" font-weight="800" fill="#7f1d1d">İlk 3–6 ay: en hızlı kayıp</text>
<text x="160" y="334" text-anchor="middle" font-size="12" fill="#7f1d1d">kırıkların büyük kısmı ilk 6 ay</text>
<text x="160" y="352" text-anchor="middle" font-size="12" fill="#7f1d1d">glukokortikoid ve KNİ</text>
<text x="160" y="370" text-anchor="middle" font-size="12" fill="#7f1d1d">dozları en yüksek</text></g>
<g class="a m s4"><rect x="275" y="290" width="160" height="92" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="355" y="314" text-anchor="middle" font-size="13" font-weight="800" fill="#78350f">6–24 ay</text>
<text x="355" y="334" text-anchor="middle" font-size="12" fill="#78350f">kayıp yavaşlar</text>
<text x="355" y="352" text-anchor="middle" font-size="12" fill="#78350f">kırık sıklığı azalır</text>
<text x="355" y="370" text-anchor="middle" font-size="12" fill="#78350f">dozlar azaltılır</text></g>
<g class="a m s5"><rect x="450" y="290" width="160" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="530" y="314" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">Toparlanma</text>
<text x="530" y="334" text-anchor="middle" font-size="12" fill="#1e3a8a">karaciğer: 1. yılın</text>
<text x="530" y="352" text-anchor="middle" font-size="12" fill="#1e3a8a">2. yarısı · kalp: 2.–3. yıl</text>
<text x="530" y="370" text-anchor="middle" font-size="12" fill="#1e3a8a">(lomber omurga)</text></g>
<g class="a s6"><rect x="60" y="396" width="550" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="335" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Korunma: böbrek oturunca (çoğu kez ilk ay) başla · 12. ayda değerlendir</text>
<text x="320" y="458" text-anchor="middle" font-size="11" fill="#475569">Kaynak: UpToDate (Shane, Rosen; son güncelleme 29 Oca 2025). Eğri şematiktir, ölçek değildir.</text></g>
</svg>
