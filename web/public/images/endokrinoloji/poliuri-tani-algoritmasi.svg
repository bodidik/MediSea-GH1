<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Hipotonik poliüride kopeptin temelli tanı algoritması</title>
<desc id="d">Poliüri günde 3 litreyi ya da 50 mL/kg'ı aşar ve idrar osmolalitesi 300 mOsm/kg'ın altındadır. Önce bazal kopeptin ölçülür: 21,4 pmol/L'nin üstü AVP direncini (nefrojenik DI) gösterir. Altındaysa uyarı testi yapılır. Hipertonik salinle serum sodyumu 150 mmol/L'ye ulaşınca kopeptin 4,9 pmol/L ve altıysa AVP eksikliği, üstündeyse primer polidipsi. Arginin testinde 60. dakika kopeptini 3,8 ve altıysa AVP eksikliği; 3,0 ile 5,2 arasındaki değerlerde hipertonik salin testi gerekir.</desc>
<!-- 14 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: di-semalar.cjs -->
<style>
.a{animation-duration:14s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.p1{animation-name:p1}@keyframes p1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.p1 .ciz{animation-name:p1c}@keyframes p1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.p2{animation-name:p2}@keyframes p2{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.p2 .ciz{animation-name:p2c}@keyframes p2c{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.ok1{animation-name:ok1}@keyframes ok1{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.ok1 .ciz{animation-name:ok1c}@keyframes ok1c{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.r{animation-name:r}@keyframes r{0%,25%{opacity:0;transform:translateY(7px)}28%,100%{opacity:1;transform:none}}
.r .ciz{animation-name:rc}@keyframes rc{0%,25%{stroke-dashoffset:1}29%,100%{stroke-dashoffset:0}}
.ok2{animation-name:ok2}@keyframes ok2{0%,33%{opacity:0;transform:translateY(7px)}36%,100%{opacity:1;transform:none}}
.ok2 .ciz{animation-name:ok2c}@keyframes ok2c{0%,33%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.u{animation-name:u}@keyframes u{0%,38%{opacity:0;transform:translateY(7px)}41%,100%{opacity:1;transform:none}}
.u .ciz{animation-name:uc}@keyframes uc{0%,38%{stroke-dashoffset:1}42%,100%{stroke-dashoffset:0}}
.ok3{animation-name:ok3}@keyframes ok3{0%,48%{opacity:0;transform:translateY(7px)}51%,100%{opacity:1;transform:none}}
.ok3 .ciz{animation-name:ok3c}@keyframes ok3c{0%,48%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
.sal{animation-name:sal}@keyframes sal{0%,52%{opacity:0;transform:translateY(7px)}55%,100%{opacity:1;transform:none}}
.sal .ciz{animation-name:salc}@keyframes salc{0%,52%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.arg{animation-name:arg}@keyframes arg{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.arg .ciz{animation-name:argc}@keyframes argc{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,74%{opacity:0;transform:translateY(7px)}77%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,74%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
.gri{animation-name:gri}@keyframes gri{0%,84%{opacity:0;transform:translateY(7px)}87%,100%{opacity:1;transform:none}}
.gri .ciz{animation-name:gric}@keyframes gric{0%,84%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a p1"><rect x="170" y="16" width="300" height="62" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="43.5" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Hipotonik poliüri</text><text x="320" y="60.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">&gt;3 L/gün ya da &gt;50 mL/kg/gün · U<tspan font-size='9'>osm</tspan> &lt;300</text></g>
<g class="a p2"><path class="a ciz" pathLength="1" d="M320,80 L320,104" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="195" y="108" width="250" height="50" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="129.5" font-size="14" font-weight="800" text-anchor="middle" fill="#0c4a6e">Bazal kopeptin</text><text x="320" y="146.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">susuz bırakmadan</text></g>
<g class="a ok1"><path class="a ciz" pathLength="1" d="M250,160 L120,206" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a r"><rect x="20" y="210" width="210" height="62" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="125" y="237.5" font-size="14" font-weight="800" text-anchor="middle" fill="#7f1d1d">&gt;21,4 pmol/L</text><text x="125" y="254.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">AVP-R (nefrojenik DI)</text></g>
<g class="a ok2"><path class="a ciz" pathLength="1" d="M390,160 L480,206" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a u"><rect x="370" y="210" width="250" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="495" y="237.5" font-size="14" font-weight="800" text-anchor="middle" fill="#78350f">≤21,4 pmol/L</text><text x="495" y="254.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">uyarı testi gerekir</text></g>
<g class="a ok3"><path class="a ciz" pathLength="1" d="M440,274 L170,330" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M520,274 L480,330" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a sal"><rect x="20" y="334" width="290" height="116" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="165" y="363" font-size="14" font-weight="800" text-anchor="middle" fill="#0c4a6e">%3 NaCl (salin)</text><text x="165" y="380" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">hedef: serum Na ≥150 mmol/L</text><text x="165" y="397" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">kopeptin ≤4,9 → AVP-D</text><text x="165" y="414" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">kopeptin &gt;4,9 → primer polidipsi</text><text x="165" y="431" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">doğruluk ≈ %96–97</text></g>
<g class="a arg"><rect x="330" y="334" width="290" height="116" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="475" y="363" font-size="14" font-weight="800" text-anchor="middle" fill="#581c87">Arginin</text><text x="475" y="380" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">0,5 g/kg IV, 30 dk · 60. dk</text><text x="475" y="397" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">kopeptin ≤3,8 → AVP-D</text><text x="475" y="414" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">kopeptin &gt;3,8 → primer polidipsi</text><text x="475" y="431" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">doğruluk ≈ %74 (NEJM 2023)</text></g>
<g class="a son"><path class="a ciz" pathLength="1" d="M165,452 L165,486" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><path class="a ciz" pathLength="1" d="M475,452 L475,486" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><rect x="20" y="490" width="600" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320" y="514.5" font-size="14" font-weight="800" text-anchor="middle" fill="#14532d">Ayrım: AVP-D ↔ primer polidipsi</text><text x="320" y="531.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">AVP-D: desmopressin · primer polidipsi: sıvı alımını azalt, desmopressin VERME</text></g>
<g class="a gri"><rect x="20" y="562" width="600" height="62" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="5 4"/><text x="320" y="586" font-size="13" font-weight="800" text-anchor="middle" fill="#78350f">Arginin gri bölgesi: 3,0–5,2 pmol/L</text><text x="320" y="606" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">≤3,0 AVP-D ve &gt;5,2 primer polidipsi güvenilir; aradaki değerde hipertonik salin testi yapılır</text></g>

</svg>
