<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Diyabet ve PDAC arasındaki iki yönlü ilişki</title>
<desc id="d">Bir yönde uzun süreli diyabet ve hiperinsülinemi kanser riskini artırır: 88 çalışmanın meta-analizinde göreceli risk 2,08; kanserden 10 yıl önceki insülin yüksekliği HR 2,90; adiponektin düşüklüğü olası aracıdır. Risk tip 2 diyabet tanısından sonraki ilk sekiz yılda yüksektir; sonrasında C-peptid düşerken HbA1c sabit kalır. Öbür yönde tümör diyabete yol açar: hastaların yüzde 47'sinde diyabet vardır ve yüzde 74'ü son iki yılda başlamıştır; tümör eksozomlarındaki adrenomedullin in vitro bir hipotezdir. Whipple sonrası yeni başlangıçlı diyabet 30 hastanın 17'sinde düzelmiş, eski diyabet değişmemiştir.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,23%{opacity:0;transform:translateY(7px)}26%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,23%{stroke-dashoffset:1}27%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,47%{opacity:0;transform:translateY(7px)}50%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,47%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:s5c}@keyframes s5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:s6c}@keyframes s6c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="450" fill="#ffffff"/>
<g class="a s0"><rect x="16" y="12" width="296" height="58" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="164" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Uzun süreli diyabet → kanser</text></g>
<g class="a s1"><rect x="328" y="12" width="296" height="58" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="476" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Kanser → yeni diyabet</text></g>
<g class="a s2"><path class="ciz" pathLength="1" d="M164 70 L164 96" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M476 70 L476 96" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="98" width="296" height="150" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="164" y="119" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Epidemiyoloji</text><text x="164" y="139" text-anchor="middle" font-size="13" fill="#334155">Meta-analiz RR 2,08</text><text x="164" y="157" text-anchor="middle" font-size="13" fill="#334155">Glukoz HR 2,16 · insülin HR 2,90</text><text x="164" y="175" text-anchor="middle" font-size="13" fill="#334155">(kanserden &gt;10 yıl önceki ölçüm)</text><text x="164" y="193" text-anchor="middle" font-size="13" fill="#334155">Yaklaşık 1,5 kat (Cecil)</text></g>
<g class="a s3"><rect x="328" y="98" width="296" height="150" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="476" y="119" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Epidemiyoloji</text><text x="476" y="139" text-anchor="middle" font-size="13" fill="#334155">Vakada DM %47, kontrol %7</text><text x="476" y="157" text-anchor="middle" font-size="13" fill="#334155">Son 2 yılda başlayan %74</text><text x="476" y="175" text-anchor="middle" font-size="13" fill="#334155">Asemptomatikte %20: tanıdan</text><text x="476" y="193" text-anchor="middle" font-size="13" fill="#334155">ortanca 6,5 ay önce</text></g>
<g class="a s4"><path class="ciz" pathLength="1" d="M164 248 L164 272" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M476 248 L476 272" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="274" width="296" height="110" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="164" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Olası aracı</text><text x="164" y="315" text-anchor="middle" font-size="13" fill="#334155">Hiperinsülinemi · adiponektin ↓</text><text x="164" y="333" text-anchor="middle" font-size="13" fill="#334155">İlk 8 yıl risk yüksek,</text><text x="164" y="351" text-anchor="middle" font-size="13" fill="#334155">sonra C-peptid düşer</text></g>
<g class="a s5"><rect x="328" y="274" width="296" height="110" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="476" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Olası aracı</text><text x="476" y="315" text-anchor="middle" font-size="13" fill="#334155">Adrenomedullin eksozomu</text><text x="476" y="333" text-anchor="middle" font-size="13" fill="#334155">(in vitro; klinik kanıt yok)</text><text x="476" y="351" text-anchor="middle" font-size="13" fill="#334155">Whipple sonrası 17/30 düzelme</text></g>
<g class="a s6"><rect x="16" y="398" width="608" height="42" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="320" y="419" text-anchor="middle" font-size="13" fill="#334155">Eski diyabet ve yeni diyabet aynı tablo değildir; yorum zaman ekseninde yapılır.</text></g>
</svg>
