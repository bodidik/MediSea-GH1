<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Pankreas kanserinde biyobelirteç ve tedavi haritası</title>
<desc id="d">Her metastatik hastada germline ve somatik test yapılır. Germline BRCA1/2 için platin sonrası olaparib ya da rucaparib, PALB2 ve somatik BRCA için rucaparib seçeneği vardır. dMMR/MSI-yüksek için pembrolizumab. NTRK füzyonu için larotrektinib, entrektinib ya da repotrektinib; RET füzyonu için selperkatinib; NRG1 füzyonu ikinci basamakta zenokutuzumab. KRAS G12C ikinci basamakta adagrasib ya da sotorasib; BRAF V600E ikinci basamakta dabrafenib artı trametinib. HER2 3+ son basamakta trastuzumab derukstekan. RAS mutantı tümörde daraxonrasib Haziran 2026 itibarıyla araştırma ilacıdır.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,23%{opacity:0;transform:translateY(7px)}26%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,23%{stroke-dashoffset:1}27%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,47%{opacity:0;transform:translateY(7px)}50%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,47%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:s5c}@keyframes s5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:s6c}@keyframes s6c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="560" fill="#ffffff"/>
<g class="a s0"><rect x="120" y="12" width="400" height="48" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="320" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Germline + somatik test (herkese)</text></g>
<g class="a s1"><path class="ciz" pathLength="1" d="M170 60 L170 88" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M470 60 L470 88" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="90" width="300" height="130" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="166" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">DNA onarımı</text><text x="166" y="131" text-anchor="middle" font-size="13" fill="#334155">gBRCA: platin → olaparib/rucaparib</text><text x="166" y="149" text-anchor="middle" font-size="13" fill="#334155">PALB2, somatik BRCA: rucaparib</text><text x="166" y="167" text-anchor="middle" font-size="13" fill="#334155">Eşzamanlı PARP + platin verilmez</text></g>
<g class="a s2"><rect x="324" y="90" width="300" height="130" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="474" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Bağışıklık</text><text x="474" y="131" text-anchor="middle" font-size="13" fill="#334155">MSI-H/dMMR: pembrolizumab</text><text x="474" y="149" text-anchor="middle" font-size="13" fill="#334155">(~%0,8; kısa yanıt verisi var)</text><text x="474" y="167" text-anchor="middle" font-size="13" fill="#334155">Diğer hastada ICI etkisiz</text></g>
<g class="a s3"><path class="ciz" pathLength="1" d="M170 220 L170 248" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M470 220 L470 248" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="250" width="300" height="130" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="166" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Füzyonlar</text><text x="166" y="291" text-anchor="middle" font-size="13" fill="#334155">NTRK: TRK inhibitörü</text><text x="166" y="309" text-anchor="middle" font-size="13" fill="#334155">RET: selperkatinib</text><text x="166" y="327" text-anchor="middle" font-size="13" fill="#334155">NRG1: zenokutuzumab (2. basamak)</text></g>
<g class="a s4"><rect x="324" y="250" width="300" height="130" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="474" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">MAPK yolu</text><text x="474" y="291" text-anchor="middle" font-size="13" fill="#334155">KRAS G12C: adagrasib/sotorasib</text><text x="474" y="309" text-anchor="middle" font-size="13" fill="#334155">BRAF V600E: dabrafenib+trametinib</text><text x="474" y="327" text-anchor="middle" font-size="13" fill="#334155">Çoğunlukla ikinci basamak</text></g>
<g class="a s5"><path class="ciz" pathLength="1" d="M320 380 L320 408" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="70" y="410" width="500" height="72" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="320" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">RAS(ON) inhibisyonu</text><text x="320" y="451" text-anchor="middle" font-size="13" fill="#334155">Daraxonrasib: Haziran 2026'da araştırma ilacı</text></g>
<g class="a s6"><rect x="16" y="496" width="608" height="54" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="320" y="517" text-anchor="middle" font-size="13" fill="#334155">Değişiklik yoksa standart kemoterapi; klinik çalışma her basamakta düşünülür.</text></g>
</svg>
