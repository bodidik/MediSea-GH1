<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Karaciğerde malign kitle: zemine göre olası tümör</title>
<desc id="d">Karaciğerde malign tümör en sık metastazdır; bir seride metastazlar primer malign karaciğer tümörlerinden yaklaşık 30 kat fazla. Kitle sirozlu ya da kronik hepatit B'li hastadaysa ilk düşünülen hepatosellüler karsinomdur: primer karaciğer tümörlerinin yaklaşık yüzde 75'i; yüksek riskli hastada LR-5 görüntüleme biyopsisiz tanı koyar. Safra yolu hastalığı (primer sklerozan kolanjit, koledok kisti, hepatolitiazis) varsa kolanjiyokarsinom; kalan primer tümörlerin çoğu bu gruptadır. Siroz ve viral hepatit olmadan 5–35 yaşta fibrolamellar karsinom; AFP yüzde 90'ında normaldir. 60 yaş üstü, vinil klorür, arsenik, anabolik steroid, radyasyon ya da toryum dioksit maruziyetinde anjiyosarkom. İlk iki yaştaki çocukta hepatoblastom. Bilinen karaciğer hastalığı yoksa iş-up: serolojik karaciğer hastalığı taraması, AFP, CA 19-9, CEA ve karaciğer için ayarlanmış kontrastlı BT ya da MR; tanı belirsizse ve sonuç yönetimi değiştirecekse biyopsi. Metastaz şüphesinde hepatobiliyer kontrastlı ve difüzyon ağırlıklı MR.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="800" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,104 L320,126" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,612 L320,634" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Karaciğerde malign kitle</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">En sık METASTAZ — primer tümörlerden ~30 kat fazla</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#334155">Zemin ve yaş olası tümörü söyler</text></g>
<g class="a m s2"><rect x="10" y="128" width="300" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="160" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Siroz · kronik HBV</text><text x="160" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">→ Hepatosellüler karsinom</text><text x="160" y="206" text-anchor="middle" font-size="12" fill="#1e3a8a">Primer tümörlerin ~%75'i</text><text x="160" y="228" text-anchor="middle" font-size="12" fill="#1e3a8a">Yüksek riskte LR-5 = biyopsisiz tanı</text><text x="160" y="250" text-anchor="middle" font-size="12" fill="#1e3a8a">(HCC olasılığı %95)</text></g>
<g class="a m s2"><rect x="330" y="128" width="300" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="480" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#064e3b">Safra yolu hastalığı</text><text x="480" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">→ Kolanjiyokarsinom</text><text x="480" y="206" text-anchor="middle" font-size="12" fill="#064e3b">PSK · koledok kisti · hepatolitiazis</text><text x="480" y="228" text-anchor="middle" font-size="12" fill="#064e3b">İntrahepatik · perihiler (Klatskin)</text><text x="480" y="250" text-anchor="middle" font-size="12" fill="#064e3b">· ekstrahepatik</text></g>
<g class="a m s3"><rect x="10" y="298" width="300" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="160" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">Genç · siroz yok</text><text x="160" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">→ Fibrolamellar karsinom</text><text x="160" y="376" text-anchor="middle" font-size="12" fill="#78350f">5–35 yaş · kadın = erkek</text><text x="160" y="398" text-anchor="middle" font-size="12" fill="#78350f">AFP %90'ında normal</text><text x="160" y="420" text-anchor="middle" font-size="12" fill="#78350f">Prognoz klasik HCC'den iyi</text></g>
<g class="a m s3"><rect x="330" y="298" width="300" height="150" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="480" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">&gt;60 yaş · kimyasal maruziyet</text><text x="480" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">→ Anjiyosarkom</text><text x="480" y="376" text-anchor="middle" font-size="12" fill="#7f1d1d">Vinil klorür · arsenik</text><text x="480" y="398" text-anchor="middle" font-size="12" fill="#7f1d1d">anabolik steroid · radyasyon</text><text x="480" y="420" text-anchor="middle" font-size="12" fill="#7f1d1d">· toryum dioksit</text></g>
<g class="a m s4"><rect x="10" y="468" width="300" height="144" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="160" y="496" text-anchor="middle" font-size="14" font-weight="800" fill="#4c1d95">Erken çocukluk</text><text x="160" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">→ Hepatoblastom</text><text x="160" y="546" text-anchor="middle" font-size="12" fill="#4c1d95">Çoğu ilk 2 yaşta · erkekte 2 kat</text><text x="160" y="568" text-anchor="middle" font-size="12" fill="#4c1d95">Beckwith-Wiedemann, FAP,</text><text x="160" y="588" text-anchor="middle" font-size="12" fill="#4c1d95">trizomi 18</text></g>
<g class="a m s4"><rect x="330" y="468" width="300" height="144" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="480" y="496" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Orta yaş kadın</text><text x="480" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">→ Epiteloid</text><text x="480" y="542" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">hemanjiyoendotelyom</text><text x="480" y="566" text-anchor="middle" font-size="12" fill="#334155">Düşük dereceli vasküler tümör</text><text x="480" y="588" text-anchor="middle" font-size="12" fill="#334155">Budd-Chiari yapabilir</text></g>
<g class="a m s5"><rect x="40" y="636" width="560" height="150" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="320" y="664" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">Bilinen karaciğer hastalığı yok → iş-up</text><text x="320" y="690" text-anchor="middle" font-size="12" fill="#0c4a6e">Karaciğer hastalığı serolojisi · AFP · CA 19-9 · CEA</text><text x="320" y="712" text-anchor="middle" font-size="12" fill="#0c4a6e">Karaciğere ayarlı kontrastlı BT ya da MR</text><text x="320" y="734" text-anchor="middle" font-size="12" fill="#0c4a6e">Metastaz şüphesi: hepatobiliyer kontrastlı + difüzyon MR</text><text x="320" y="760" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">Belirsiz ve sonuç yönetimi değiştirecekse biyopsi</text></g>
</svg>
