<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">HCC sürveyansı ve nodül yaklaşımı</title>
<desc id="d">Yüksek riskli hastada (Child-Pugh A ve B siroz, nakil listesindeki Child C, seçilmiş sirozsuz HBV ve ileri fibrozisli HCV SVR sonrası) 6 ayda bir ultrasonografi ve AFP yapılır; aralığın gerekçesi tümör ikilenme süresidir. Tek başına USG'nin erken evre duyarlılığı yüzde 45–47, AFP eklenince yüzde 63–64'tür. 1 cm altındaki nodül 3–6 ayda bir USG ile izlenir; 1 cm'ye ulaşırsa, yeni nodül çıkarsa ya da AFP yükselirse dinamik görüntülemeye geçilir. 1 cm ve üstü nodül doğrudan çok fazlı BT, MRG ya da CEUS ile değerlendirilir ve LI-RADS ile sınıflanır: LR-5 biyopsisiz tanıdır, LR-4 ve LR-M'de biyopsi ya da konsey, LR-3 3–6 ayda tekrar görüntülenir.</desc>
<!-- 13 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.a{animation-name:a}@keyframes a{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.a .ciz{animation-name:ac}@keyframes ac{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.b{animation-name:b}@keyframes b{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.b .ciz{animation-name:bc}@keyframes bc{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.c{animation-name:c}@keyframes c{0%,22%{opacity:0;transform:translateY(7px)}25%,100%{opacity:1;transform:none}}
.c .ciz{animation-name:cc}@keyframes cc{0%,22%{stroke-dashoffset:1}26%,100%{stroke-dashoffset:0}}
.d1{animation-name:d1}@keyframes d1{0%,32%{opacity:0;transform:translateY(7px)}35%,100%{opacity:1;transform:none}}
.d1 .ciz{animation-name:d1c}@keyframes d1c{0%,32%{stroke-dashoffset:1}36%,100%{stroke-dashoffset:0}}
.d2{animation-name:d2}@keyframes d2{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.d2 .ciz{animation-name:d2c}@keyframes d2c{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.e{animation-name:e}@keyframes e{0%,52%{opacity:0;transform:translateY(7px)}55%,100%{opacity:1;transform:none}}
.e .ciz{animation-name:ec}@keyframes ec{0%,52%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.f{animation-name:f}@keyframes f{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.f .ciz{animation-name:fc}@keyframes fc{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.g{animation-name:g}@keyframes g{0%,74%{opacity:0;transform:translateY(7px)}77%,100%{opacity:1;transform:none}}
.g .ciz{animation-name:gc}@keyframes gc{0%,74%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
.h{animation-name:h}@keyframes h{0%,84%{opacity:0;transform:translateY(7px)}87%,100%{opacity:1;transform:none}}
.h .ciz{animation-name:hc}@keyframes hc{0%,84%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a a"><rect x="20" y="12" width="600" height="74" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="37" font-size="13.5" font-weight="800" text-anchor="middle" fill="#581c87">Yüksek risk</text><text x="320" y="54" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">Child-Pugh A/B siroz · Child C nakil adayı · HCV SVR + F3/siroz</text><text x="320" y="71" font-size="11.5" font-weight="500" text-anchor="middle" fill="#581c87">sirozsuz HBV: aile öyküsü · Afrika kökeni · erkek &gt;40 / kadın &gt;50 (endemik) · PAGE-B ≥10 · HDV</text></g>
<g class="a b"><path class="a ciz" pathLength="1" d="M320,88 L320,108" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="140" y="112" width="360" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="139.5" font-size="14" font-weight="800" text-anchor="middle" fill="#0c4a6e">6 ayda bir USG ± AFP</text><text x="320" y="156.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">gerekçe: tümör ikilenme süresi · yıllığa üstün, 3 aylık ek yarar yok</text></g>
<g class="a c"><path class="a ciz" pathLength="1" d="M320,176 L320,196" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="140" y="200" width="360" height="58" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="225.5" font-size="14" font-weight="800" text-anchor="middle" fill="#1e293b">Duyarlılık (erken evre)</text><text x="320" y="242.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">USG %45–47 → USG + AFP %63–64</text></g>
<g class="a d1"><path class="a ciz" pathLength="1" d="M220,260 L130,300" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="20" y="304" width="270" height="92" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="155" y="329.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Nodül &lt;1 cm</text><text x="155" y="346.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">3–6 ayda bir USG (2 kez)</text><text x="155" y="363.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">kaybolur / &lt;1 cm kalır → rutin 6 ay</text><text x="155" y="380.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">büyür ya da AFP ↑ → dinamik görüntüleme</text></g>
<g class="a d2"><path class="a ciz" pathLength="1" d="M420,260 L510,300" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="350" y="304" width="270" height="92" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="485" y="329.5" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Nodül ≥1 cm</text><text x="485" y="346.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">çok fazlı dinamik BT / MRG</text><text x="485" y="363.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">ya da CEUS</text><text x="485" y="380.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">→ LI-RADS</text></g>
<g class="a e"><path class="a ciz" pathLength="1" d="M485,398 L485,418" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><path class="a ciz" pathLength="1" d="M155,398 L380,430" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#ok)"/></g>
<g class="a f"><rect x="20" y="422" width="190" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="115" y="449" font-size="13.5" font-weight="800" text-anchor="middle" fill="#14532d">LR-5</text><text x="115" y="466" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">%94 HCC</text><text x="115" y="483" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">biyopsisiz tanı → tedavi</text><rect x="225" y="422" width="190" height="78" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="449" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">LR-4 · LR-M</text><text x="320" y="466" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">%64 · HCC dışı malignite</text><text x="320" y="483" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">biyopsi / konsey</text><rect x="430" y="422" width="190" height="78" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="525" y="449" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">LR-3</text><text x="525" y="466" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">%31 HCC</text><text x="525" y="483" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">3–6 ayda tekrar görüntüle</text></g>
<g class="a g"><rect x="20" y="514" width="600" height="52" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="536.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">AFP: değerlendirme eşiği 20 ng/mL · &gt;200 yüksek özgüllük</text><text x="320" y="553.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">erken evre HCC'lerin %20'sinden azında yüksek — tek başına sürveyans aracı değil</text></g>
<g class="a h"><rect x="20" y="578" width="600" height="52" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="600.5" font-size="13" font-weight="800" text-anchor="middle" fill="#1e293b">Biyopsi: sirozsuz karaciğerde kitle, LR-4/LR-M, nakil öncesi LR-4</text><text x="320" y="617.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">iğne yolu ekimi ≈ %2,7 · majör komplikasyon sirozda %1,5–2,6</text></g>

</svg>
