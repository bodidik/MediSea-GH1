<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kanser ağrısında yol: değerlendirme, opioid, dönüşüm, girişim</title>
<desc id="d">Önce acil nedeni dışla: omurilik basısında yalnız opioid yetmez, glukokortikoid ve lokal radyoterapi gerekir. Değerlendirme her temasta yinelenir. Opioid naif mi toleran mı: toleran, en az 1 haftadır günde 60 mg oral morfin, saatte 25 mcg transdermal fentanil, günde 30 mg oral oksikodon, 8 mg oral hidromorfon ya da 25 mg oral oksimorfon ya da eşdeğerini alan hastadır. Ağrı orta-şiddetliyse opioid: onaylı herhangi bir opioid; morfin prototiptir ama üstünlüğü gösterilmemiştir. Meperidin ve karışık agonist-antagonistler kullanılmaz. Kurtarma dozu günlük dozun yüzde 10–20'si. Ağrı kontrolsüz ya da yan etki dayanılmazsa dönüşüm: morfin eşdeğer günlük doz hesaplanır, dönüşüm oranı eşanaljezi değildir, doz kişiye göre ayarlanır; böbrek yetmezliğinde buprenorfin, fentanil, metadon; karaciğer hastalığında hidromorfon ya da morfin. Ağrı kontrolde ama yan etki varsa yüzde 25–30 doz azaltma dönüşümsüz yetebilir. Dirençli ağrıda girişim: pankreas ve üst karında çölyak pleksus, alt karında süperior hipogastrik pleksus, anorektal bölgede ganglion impar, göğüs duvarında interkostal blok; tek taraflı ağrıda kordotomi; intratekal pompa; litik kemik lezyonunda vertebral augmentasyon. Opioid azaltılacaksa ilk adım yüzde 5–10, sonrakiler yüzde 20'nin altında.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="860" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,104 L320,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,244 L320,268" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,414 L320,438" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,604 L320,628" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="90" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Önce acil nedeni dışla</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#7f1d1d">Omurilik basısı: opioid yetmez → glukokortikoid + lokal RT</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#7f1d1d">Patolojik kırık · organ tıkanması/perforasyonu</text></g>
<g class="a m s2"><rect x="40" y="130" width="560" height="114" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="158" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Opioid naif mi, toleran mı?</text><text x="320" y="182" text-anchor="middle" font-size="12" fill="#334155">Toleran: ≥1 hafta günde ≥60 mg oral morfin · 25 mcg/sa fentanil</text><text x="320" y="202" text-anchor="middle" font-size="12" fill="#334155">· 30 mg oksikodon · 8 mg hidromorfon · 25 mg oksimorfon</text><text x="320" y="226" text-anchor="middle" font-size="12" fill="#334155">Değerlendirme her temasta yinelenir</text></g>
<g class="a m s3"><rect x="40" y="270" width="560" height="144" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="298" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Orta–şiddetli ağrı → opioid</text><text x="320" y="322" text-anchor="middle" font-size="12" fill="#1e3a8a">Onaylı herhangi bir opioid; morfin prototip, üstünlüğü yok</text><text x="320" y="344" text-anchor="middle" font-size="12" fill="#1e3a8a">Meperidin ve karışık agonist-antagonist KULLANILMAZ</text><text x="320" y="366" text-anchor="middle" font-size="12" fill="#1e3a8a">Kurtarma dozu: günlük dozun %10–20'si</text><text x="320" y="390" text-anchor="middle" font-size="12" fill="#1e3a8a">+ nonopioid ve koanaljezik (antidepresan, antikonvülzan)</text></g>
<g class="a m s4"><rect x="40" y="440" width="560" height="164" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="468" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Kontrolsüz ağrı ya da dayanılmaz yan etki</text><text x="320" y="492" text-anchor="middle" font-size="12" fill="#78350f">Ağrı kontrolde, yan etki var → %25–30 doz azalt</text><text x="320" y="514" text-anchor="middle" font-size="12" fill="#78350f">Dönüşüm: MEDD hesapla · oran ≠ eşanaljezi · kişiye göre ayarla</text><text x="320" y="538" text-anchor="middle" font-size="12" fill="#78350f">Böbrek: buprenorfin, fentanil, metadon</text><text x="320" y="560" text-anchor="middle" font-size="12" fill="#78350f">Karaciğer: hidromorfon, morfin</text><text x="320" y="582" text-anchor="middle" font-size="12" fill="#78350f">Metadon: deneyimli hekim, EKG</text></g>
<g class="a m s5"><rect x="40" y="630" width="560" height="216" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="658" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Dirençli ağrı → girişim</text><text x="320" y="684" text-anchor="middle" font-size="12" fill="#064e3b">Pankreas / üst karın: çölyak pleksus</text><text x="320" y="704" text-anchor="middle" font-size="12" fill="#064e3b">Alt karın: süperior hipogastrik · anorektal: ganglion impar</text><text x="320" y="724" text-anchor="middle" font-size="12" fill="#064e3b">Göğüs duvarı: interkostal blok</text><text x="320" y="748" text-anchor="middle" font-size="12" fill="#064e3b">Tek taraflı ağrı: kordotomi · intratekal pompa</text><text x="320" y="768" text-anchor="middle" font-size="12" fill="#064e3b">Litik kemik lezyonu: vertebral augmentasyon</text><text x="320" y="800" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Opioid azaltılacaksa: ilk adım %5–10,</text><text x="320" y="820" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">sonrakiler &lt;%20</text></g>
</svg>
