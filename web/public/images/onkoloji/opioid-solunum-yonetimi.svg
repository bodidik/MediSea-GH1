<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Opioid alan hastada solunum sorunu: ayırt et, karar ver, titre et</title>
<desc id="d">Opioid solunum ritmi üretimini doğrudan baskılar ve karbondioksit ile hipoksiye yanıtı azaltır; solunum düzensizleşir, sayı ve hacim düşer. Risk: kardiyopulmoner hastalık, uyku apnesi, benzodiazepin, gabapentinoid ya da başka santral sinir sistemi baskılayıcısı, böbrek yetmezliğinde morfin metaboliti M6G birikimi. Ayırt et: opioid uyuklama ve yavaş solunum yapar; taşipne ve anksiyeteyle giden solunum sıkıntısı hiçbir zaman birincil opioid olayı değildir; nalokson yanıtı olsa bile eşlik eden akut süreç, örneğin pulmoner emboli ya da pnömoni aranır. Karar: kolay uyandırılabilen uykulu hastaya nalokson verilmez; hafifse opioid dozları solunum sayısı artana ya da ağrı dönene kadar bekletilir. Nalokson, bilinç bulanıklığı ile dakikada 8'in altında solunumdan oluşan semptomatik solunum depresyonuna saklanır. Titre et: 0,4 mg nalokson 9 mL serum fizyolojikle 10 mL'ye seyreltilir, yani mililitrede 0,04 mg; 1–2 mL'lik küçük bolus dozlar solunum sayısına göre verilir. Hedef solunumu düzeltmektir, bilinci normale döndürmek değil. Naloksonun etkisi kısadır; 45 dakika ile bir saatte bir yinelenebilir; uzun salımlı ya da uzun yarı ömürlü opioidde, örneğin metadonda, infüzyon gerekebilir. Ayrıca: palyatif dispnede sistemik opioid plaseboya üstündür ama kanıt sınırlıdır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="860" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,148 L320,172" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,294 L320,318" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,440 L320,464" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,652 L320,676" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="134" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Etki ve risk</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Ritim üretimi baskılanır · CO₂ ve hipoksiye yanıt azalır</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#334155">Risk: kalp-akciğer hastalığı · uyku apnesi</text><text x="320" y="110" text-anchor="middle" font-size="12" fill="#334155">Benzodiazepin · gabapentinoid · başka SSS baskılayıcısı</text><text x="320" y="132" text-anchor="middle" font-size="12" fill="#334155">Böbrek yetmezliğinde morfin metaboliti M6G birikir</text></g>
<g class="a m s2"><rect x="40" y="174" width="560" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Ayırt et</text><text x="320" y="226" text-anchor="middle" font-size="12" fill="#78350f">Opioid: uyuklama + yavaş solunum</text><text x="320" y="248" text-anchor="middle" font-size="12" fill="#78350f">Taşipne + anksiyete → birincil opioid olayı DEĞİL</text><text x="320" y="270" text-anchor="middle" font-size="12" fill="#78350f">Yanıt olsa da akut süreç ara: pulmoner emboli, pnömoni</text></g>
<g class="a m s3"><rect x="40" y="320" width="560" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="348" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Nalokson gerekli mi?</text><text x="320" y="372" text-anchor="middle" font-size="12" fill="#1e3a8a">Kolay uyanan uykulu hasta → hayır; dozları beklet</text><text x="320" y="394" text-anchor="middle" font-size="12" fill="#1e3a8a">Semptomatik depresyon: bilinç bulanık + solunum &lt;8/dk</text><text x="320" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Hedef: solunum, normal bilinç DEĞİL</text></g>
<g class="a m s4"><rect x="40" y="466" width="560" height="186" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="494" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Seyreltilmiş naloksonla titre et</text><text x="320" y="518" text-anchor="middle" font-size="12" fill="#7f1d1d">0,4 mg (1 mL) + 9 mL serum fizyolojik = 0,04 mg/mL</text><text x="320" y="540" text-anchor="middle" font-size="12" fill="#7f1d1d">1–2 mL küçük bolus, solunum sayısına göre</text><text x="320" y="562" text-anchor="middle" font-size="12" fill="#7f1d1d">Etki kısa: 45 dk–1 saatte bir yinelenebilir</text><text x="320" y="584" text-anchor="middle" font-size="12" fill="#7f1d1d">Uzun salımlı ya da metadon → infüzyon gerekebilir</text><text x="320" y="612" text-anchor="middle" font-size="12" fill="#7f1d1d">Tam doz: şiddetli ağrı alevlenmesi ve yoksunluk riski</text><text x="320" y="634" text-anchor="middle" font-size="12" fill="#7f1d1d">Kaynak: UpToDate (Portenoy, Mehta, Ahmed)</text></g>
<g class="a m s5"><rect x="40" y="678" width="560" height="160" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="706" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Opioid tedavi olarak: dispne</text><text x="320" y="730" text-anchor="middle" font-size="12" fill="#064e3b">Opioidler plaseboya üstün (SMD −0,43; 7 RKÇ)</text><text x="320" y="752" text-anchor="middle" font-size="12" fill="#064e3b">Plasebo kontrollü sistemik morfin: SMD −0,78</text><text x="320" y="774" text-anchor="middle" font-size="12" fill="#064e3b">Uyuklama ve ciddi yan etki artışı gösterilmedi</text><text x="320" y="800" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Sağlam kanıt yok (Takagi 2023)</text></g>
</svg>
