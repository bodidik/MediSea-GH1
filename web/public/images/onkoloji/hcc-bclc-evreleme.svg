<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 624" width="640" height="624" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">BCLC evreleme ve tedavi eşlemesi</title>
<desc id="d">BCLC sistemi tümör yükünü, karaciğer rezervini ve ECOG performans durumunu birleştirir. Evre 0: tek, 2 cm ve altı tümör, ECOG 0, korunmuş fonksiyon; rezeksiyon, ablasyon ya da nakil. Evre A: tek 2 cm üstü tümör ya da hepsi 3 cm ve altı en fazla 3 nodül, ECOG 0; rezeksiyon, nakil ya da ablasyon. Evre B: çok nodüllü tümör, ECOG 0; TACE, downstaging sonrası nakil, yaygın tutulumda sistemik tedavi. Evre C: vasküler invazyon ve/veya ekstrahepatik yayılım, ECOG 1–2; sistemik tedavi. Evre D: Child-Pugh C ya da ECOG 3–4; destek bakım, nakil adayı hariç. Rezeksiyon için Child A, normal bilirubin ve klinik belirgin portal hipertansiyon (HVPG 10 mmHg ve üstü) yokluğu gerekir. Milan kriteri: tek tümör 5 cm ve altı ya da her biri 3 cm ve altı en fazla 3 nodül, makrovasküler invazyon ve yayılım yok.</desc>
<!-- 13 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,6%{opacity:0;transform:translateY(7px)}9%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,6%{stroke-dashoffset:1}10%,100%{stroke-dashoffset:0}}
.t0{animation-name:t0}@keyframes t0{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.t0 .ciz{animation-name:t0c}@keyframes t0c{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,21%{opacity:0;transform:translateY(7px)}24%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,21%{stroke-dashoffset:1}25%,100%{stroke-dashoffset:0}}
.t1{animation-name:t1}@keyframes t1{0%,27%{opacity:0;transform:translateY(7px)}30%,100%{opacity:1;transform:none}}
.t1 .ciz{animation-name:t1c}@keyframes t1c{0%,27%{stroke-dashoffset:1}31%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.t2{animation-name:t2}@keyframes t2{0%,42%{opacity:0;transform:translateY(7px)}45%,100%{opacity:1;transform:none}}
.t2 .ciz{animation-name:t2c}@keyframes t2c{0%,42%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,51%{opacity:0;transform:translateY(7px)}54%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,51%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.t3{animation-name:t3}@keyframes t3{0%,57%{opacity:0;transform:translateY(7px)}60%,100%{opacity:1;transform:none}}
.t3 .ciz{animation-name:t3c}@keyframes t3c{0%,57%{stroke-dashoffset:1}61%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
.t4{animation-name:t4}@keyframes t4{0%,72%{opacity:0;transform:translateY(7px)}75%,100%{opacity:1;transform:none}}
.t4 .ciz{animation-name:t4c}@keyframes t4c{0%,72%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}
.not{animation-name:not}@keyframes not{0%,86%{opacity:0;transform:translateY(7px)}89%,100%{opacity:1;transform:none}}
.not .ciz{animation-name:notc}@keyframes notc{0%,86%{stroke-dashoffset:1}90%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="624" fill="#ffffff"/>
<text x="95" y="22" font-size="11" font-weight="800" text-anchor="middle" fill="#64748b">evre</text><text x="330" y="22" font-size="11" font-weight="800" text-anchor="middle" fill="#64748b">tümör · hasta</text><text x="560" y="22" font-size="11" font-weight="800" text-anchor="middle" fill="#64748b">tedavi</text><g class="a s0"><rect x="20" y="34" width="150" height="84" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="95" y="81" font-size="14.5" font-weight="800" text-anchor="middle" fill="#14532d">0 · çok erken</text><rect x="184" y="34" width="292" height="84" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><text x="330" y="70" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e293b">tek ≤2 cm</text><text x="330" y="90" font-size="11" font-weight="500" text-anchor="middle" fill="#475569">ECOG 0 · korunmuş fonksiyon</text></g><g class="a t0"><path class="a ciz" pathLength="1" d="M478,76 L494,76" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="496" y="34" width="124" height="84" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="558" y="64" font-size="11.5" font-weight="800" text-anchor="middle" fill="#14532d">rezeksiyon</text><text x="558" y="81" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">ablasyon</text><text x="558" y="98" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">nakil</text></g><g class="a s1"><rect x="20" y="134" width="150" height="84" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="95" y="181" font-size="14.5" font-weight="800" text-anchor="middle" fill="#14532d">A · erken</text><rect x="184" y="134" width="292" height="84" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><text x="330" y="170" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e293b">tek &gt;2 cm ya da ≤3 nodül (hepsi ≤3 cm)</text><text x="330" y="190" font-size="11" font-weight="500" text-anchor="middle" fill="#475569">ECOG 0 · korunmuş fonksiyon</text></g><g class="a t1"><path class="a ciz" pathLength="1" d="M478,176 L494,176" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="496" y="134" width="124" height="84" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="558" y="164" font-size="11.5" font-weight="800" text-anchor="middle" fill="#14532d">rezeksiyon</text><text x="558" y="181" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">nakil</text><text x="558" y="198" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14532d">ablasyon</text></g><g class="a s2"><rect x="20" y="234" width="150" height="84" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="95" y="281" font-size="14.5" font-weight="800" text-anchor="middle" fill="#78350f">B · orta</text><rect x="184" y="234" width="292" height="84" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/><text x="330" y="270" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e293b">çok nodüllü (≤3 nodülden biri &gt;3 cm ya da &gt;3 nodül)</text><text x="330" y="290" font-size="11" font-weight="500" text-anchor="middle" fill="#475569">ECOG 0 · korunmuş fonksiyon</text></g><g class="a t2"><path class="a ciz" pathLength="1" d="M478,276 L494,276" stroke="#d97706" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="496" y="234" width="124" height="84" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="558" y="264" font-size="11.5" font-weight="800" text-anchor="middle" fill="#78350f">TACE</text><text x="558" y="281" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">nakil (downstaging)</text><text x="558" y="298" font-size="11.5" font-weight="500" text-anchor="middle" fill="#78350f">yaygında sistemik</text></g><g class="a s3"><rect x="20" y="334" width="150" height="84" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="95" y="381" font-size="14.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">C · ileri</text><rect x="184" y="334" width="292" height="84" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/><text x="330" y="370" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e293b">vasküler invazyon ve/veya ekstrahepatik yayılım</text><text x="330" y="390" font-size="11" font-weight="500" text-anchor="middle" fill="#475569">ECOG 1–2 · korunmuş fonksiyon</text></g><g class="a t3"><path class="a ciz" pathLength="1" d="M478,376 L494,376" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="496" y="334" width="124" height="84" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="558" y="381" font-size="11.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">sistemik tedavi</text></g><g class="a s4"><rect x="20" y="434" width="150" height="84" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="95" y="481" font-size="14.5" font-weight="800" text-anchor="middle" fill="#1e293b">D · terminal</text><rect x="184" y="434" width="292" height="84" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/><text x="330" y="470" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e293b">tümör yükünden bağımsız</text><text x="330" y="490" font-size="11" font-weight="500" text-anchor="middle" fill="#475569">Child-Pugh C ya da ECOG 3–4</text></g><g class="a t4"><path class="a ciz" pathLength="1" d="M478,476 L494,476" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><rect x="496" y="434" width="124" height="84" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="558" y="472.5" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">destek bakım</text><text x="558" y="489.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">nakil adayı hariç</text></g><g class="a not"><rect x="20" y="536" width="600" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="320" y="562" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Üç eksen birlikte: tümör yükü · karaciğer rezervi · performans durumu</text><text x="320" y="579" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">Rezeksiyon: Child A, normal bilirubin, CSPH yok (HVPG &lt;10; trombosit &lt;100 bin, varis, splenomegali uyarır)</text><text x="320" y="596" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">Nakil: Milan — tek ≤5 cm ya da ≤3 nodül ≤3 cm, makrovasküler invazyon ve yayılım yok</text></g>
</svg>
