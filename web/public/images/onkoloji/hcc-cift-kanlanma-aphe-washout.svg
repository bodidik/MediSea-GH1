<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Çift kanlanma değişimi: APHE ve washout</title>
<desc id="d">Normal karaciğer kanının yüzde 70–80'ini portal venden, yüzde 20–30'unu hepatik arterden alır; portal ven oksijenin yaklaşık yarısını taşır. HCC'de eşli portal alanlar kaybolur, eşleşmemiş tümör arterleri gelişir ve tümör kanlanması yüzde 90–100 arteriyel olur. Dinamik BT ya da MRG'de geç arteriyel fazda kontrast tümöre arterden ulaşır, parankim henüz portal kontrast almadığı için tümör parlak görünür (APHE). Portal venöz ve gecikmiş fazda parankim portal venden kontrast alarak pik yapar; tümörde portal kanlanma olmadığı ve anormal kapiller yatak kontrastı hızla temizlediği için tümör çevresine göre koyu kalır (washout). Gecikmiş fazda çevresel kapsül kontrastlanabilir.</desc>
<!-- 14 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:14s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.kan{animation-name:kan}@keyframes kan{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.kan .ciz{animation-name:kanc}@keyframes kanc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.eks{animation-name:eks}@keyframes eks{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.eks .ciz{animation-name:eksc}@keyframes eksc{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.egri{animation-name:egri}@keyframes egri{0%,20%{opacity:0;transform:translateY(7px)}23%,100%{opacity:1;transform:none}}
.egri .ciz{animation-name:egric}@keyframes egric{0%,20%{stroke-dashoffset:1}24%,100%{stroke-dashoffset:0}}
.f1{animation-name:f1}@keyframes f1{0%,34%{opacity:0;transform:translateY(7px)}37%,100%{opacity:1;transform:none}}
.f1 .ciz{animation-name:f1c}@keyframes f1c{0%,34%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.f2{animation-name:f2}@keyframes f2{0%,54%{opacity:0;transform:translateY(7px)}57%,100%{opacity:1;transform:none}}
.f2 .ciz{animation-name:f2c}@keyframes f2c{0%,54%{stroke-dashoffset:1}58%,100%{stroke-dashoffset:0}}
.f3{animation-name:f3}@keyframes f3{0%,72%{opacity:0;transform:translateY(7px)}75%,100%{opacity:1;transform:none}}
.f3 .ciz{animation-name:f3c}@keyframes f3c{0%,72%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}
.son{animation-name:son}@keyframes son{0%,86%{opacity:0;transform:translateY(7px)}89%,100%{opacity:1;transform:none}}
.son .ciz{animation-name:sonc}@keyframes sonc{0%,86%{stroke-dashoffset:1}90%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="600" fill="#ffffff"/>

<g class="a kan"><rect x="20" y="10" width="290" height="58" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="165" y="35.5" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Normal parankim</text><text x="165" y="52.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#0c4a6e">portal ven %70–80 · hepatik arter %20–30</text><rect x="330" y="10" width="290" height="58" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="475" y="35.5" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">HCC nodülü</text><text x="475" y="52.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#7f1d1d">%90–100 hepatik arter (eşleşmemiş arterler)</text></g>
<g class="a eks"><line x1="70" y1="300" x2="610" y2="300" stroke="#475569" stroke-width="1.6"/><line x1="70" y1="300" x2="70" y2="100" stroke="#475569" stroke-width="1.6"/><text x="610" y="318" font-size="10.5" font-weight="500" text-anchor="end" fill="#64748b">zaman →</text><text x="64" y="114" font-size="10.5" font-weight="500" text-anchor="start" fill="#64748b">kontrastlanma</text><line x1="194.2" y1="300" x2="194.2" y2="110" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="194.2" y="318" font-size="10.5" font-weight="700" text-anchor="middle" fill="#475569">arteriyel</text><line x1="340" y1="300" x2="340" y2="110" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="340" y="318" font-size="10.5" font-weight="700" text-anchor="middle" fill="#475569">portal venöz</text><line x1="512.8" y1="300" x2="512.8" y2="110" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="512.8" y="318" font-size="10.5" font-weight="700" text-anchor="middle" fill="#475569">gecikmiş</text></g>
<g class="a egri"><path class="a ciz" pathLength="1" d="M70.0,291.0 L124.0,264.0 L178.0,141.6 L215.8,134.4 L275.2,192.0 L367.0,228.0 L475.0,246.0 L610.0,256.8" stroke="#dc2626" stroke-width="3.2" fill="none"/><path class="a ciz" pathLength="1" d="M70.0,291.0 L134.8,278.4 L188.8,246.0 L242.8,201.0 L313.0,174.0 L394.0,181.2 L502.0,195.6 L610.0,206.4" stroke="#0284c7" stroke-width="3.2" fill="none"/><text x="223.8" y="130.4" font-size="11.5" font-weight="800" text-anchor="start" fill="#dc2626">tümör</text><text x="400" y="173.2" font-size="11.5" font-weight="800" text-anchor="start" fill="#0284c7">parankim</text></g>
<g class="a f1"><circle cx="194.2" cy="138" r="6" fill="#dc2626"/><text x="164.2" y="122" font-size="12" font-weight="900" text-anchor="middle" fill="#b91c1c">APHE</text><rect x="20" y="370" width="170" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><ellipse cx="105" cy="420" rx="70" ry="38" fill="#cbd5e1" stroke="#64748b"/><circle cx="125" cy="418" r="16" fill="#fca5a5"/><text x="105" y="474" font-size="11" font-weight="800" text-anchor="middle" fill="#334155">Arteriyel faz: tümör PARLAK</text></g>
<g class="a f2"><path d="M340,177.6 L340,217.2" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ok)"/><text x="348" y="199.2" font-size="12" font-weight="900" text-anchor="start" fill="#6d28d9">washout</text><rect x="235" y="370" width="170" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><ellipse cx="320" cy="420" rx="70" ry="38" fill="#93c5fd" stroke="#64748b"/><circle cx="340" cy="418" r="16" fill="#e2e8f0"/><text x="320" y="474" font-size="11" font-weight="800" text-anchor="middle" fill="#334155">Portal faz: tümör KOYU</text></g>
<g class="a f3"><rect x="450" y="370" width="170" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><ellipse cx="535" cy="420" rx="70" ry="38" fill="#93c5fd" stroke="#64748b"/><circle cx="555" cy="418" r="16" fill="#e2e8f0"/><circle cx="555" cy="418" r="17.5" fill="none" stroke="#f8fafc" stroke-width="2.4"/><text x="535" y="474" font-size="11" font-weight="800" text-anchor="middle" fill="#334155">Gecikmiş: koyu + kapsül</text></g>
<g class="a son"><rect x="20" y="496" width="600" height="92" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="521.5" font-size="13" font-weight="800" text-anchor="middle" fill="#1e293b">Görüntüleme bulgusu = vasküler dönüşümün izdüşümü</text><text x="320" y="538.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Erken HCC'de tümör arterleri yetersiz → sıklıkla hipovasküler (APHE yok)</text><text x="320" y="555.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">İlerlemiş HCC'de APHE + washout → yüksek riskli hastada biyopsisiz tanı (LR-5)</text><text x="320" y="572.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Kapsül: gecikmiş fazda kontrastlanan çevresel halka</text></g>

</svg>
