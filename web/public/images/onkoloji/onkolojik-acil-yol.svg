<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">İki sık onkolojik acil: ateşli nötropeni ve tümör lizis sendromu</title>
<desc id="d">Ateşli nötropeni: tek ölçümde ağızdan 38,3 derece ya da 1 saat süren 38,0 derece ateş ve mutlak nötrofil sayısı 500'ün altında; glukokortikoid ateşi baskılayabilir, taşikardi, takipne ya da hipotansiyon da uyarıdır. En az iki set kan kültüründen hemen sonra, başvurudan itibaren 60 dakika içinde ampirik antibiyotik. Risk MASCC ya da CISNE ile: yüksek riskte yatış ve antipsödomonal beta-laktam monoterapisi (sefepim, meropenem, piperasilin-tazobaktam); düşük riskte ilk dozdan sonra en az 4 saat gözlem ve oral siprofloksasin artı amoksisilin-klavulanat. Tümör lizis sendromu: hızlı çoğalan, büyük ya da tedaviye çok duyarlı tümörün yıkılmasıyla hiperkalemi, hiperfosfatemi, ikincil hipokalsemi, hiperürisemi ve akut böbrek hasarı. Laboratuvar TLS: kemoterapiden 3 gün önce ile 7 gün sonra arasında en az ikisi, ürik asit 8, potasyum 6, fosfor 4,5 ve üstü, düzeltilmiş kalsiyum 7 ve altı. Klinik TLS: buna ek kreatinin 1,5 kat, aritmi ya da ani ölüm, nöbet. Önleme riske göre: yüksek riskte damardan sıvı ve rasburikaz, orta riskte sıvı ve allopurinol.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="700" fill="#ffffff"/>
<g class="a m s1"><rect x="10" y="14" width="300" height="330" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="160" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Ateşli nötropeni</text><text x="160" y="68" text-anchor="middle" font-size="12" fill="#7f1d1d">Ateş: tek ölçüm ≥38,3 °C</text><text x="160" y="86" text-anchor="middle" font-size="12" fill="#7f1d1d">ya da 1 saat ≥38,0 °C</text><text x="160" y="106" text-anchor="middle" font-size="12" fill="#7f1d1d">ANS &lt;500/µL</text><text x="160" y="132" text-anchor="middle" font-size="11" fill="#7f1d1d">Steroid ateşi baskılar: taşikardi,</text><text x="160" y="148" text-anchor="middle" font-size="11" fill="#7f1d1d">takipne, hipotansiyon da uyarı</text><text x="160" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">≥2 set kan kültürü →</text><text x="160" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">60 dk içinde antibiyotik</text><text x="160" y="228" text-anchor="middle" font-size="12" fill="#7f1d1d">Risk: MASCC · CISNE</text></g>
<g class="a m s2"><rect x="10" y="244" width="145" height="100" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="82" y="266" text-anchor="middle" font-size="12" font-weight="800" fill="#7f1d1d">Yüksek risk</text><text x="82" y="286" text-anchor="middle" font-size="11" fill="#7f1d1d">Yatış, IV</text><text x="82" y="304" text-anchor="middle" font-size="11" fill="#7f1d1d">antipsödomonal</text><text x="82" y="322" text-anchor="middle" font-size="11" fill="#7f1d1d">β-laktam</text></g>
<g class="a m s2"><rect x="165" y="244" width="145" height="100" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="237" y="266" text-anchor="middle" font-size="12" font-weight="800" fill="#7f1d1d">Düşük risk</text><text x="237" y="286" text-anchor="middle" font-size="11" fill="#7f1d1d">≥4 saat gözlem</text><text x="237" y="304" text-anchor="middle" font-size="11" fill="#7f1d1d">siprofloksasin +</text><text x="237" y="322" text-anchor="middle" font-size="11" fill="#7f1d1d">amoks-klav</text></g>
<g class="a m s3"><rect x="330" y="14" width="300" height="330" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="480" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Tümör lizis sendromu</text><text x="480" y="68" text-anchor="middle" font-size="12" fill="#4c1d95">↑K · ↑P · ↓Ca · ↑ürik asit · ABH</text><text x="480" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Laboratuvar TLS (≥2):</text><text x="480" y="118" text-anchor="middle" font-size="11" fill="#4c1d95">KT'den 3 gün önce – 7 gün sonra</text><text x="480" y="138" text-anchor="middle" font-size="11" fill="#4c1d95">Ürik asit ≥8 · K ≥6 · P ≥4,5</text><text x="480" y="156" text-anchor="middle" font-size="11" fill="#4c1d95">düzeltilmiş Ca ≤7 (ya da %25 değişim)</text><text x="480" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Klinik TLS: + biri</text><text x="480" y="206" text-anchor="middle" font-size="11" fill="#4c1d95">Kreatinin ≥1,5×ÜS · aritmi/ani ölüm · nöbet</text><text x="480" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Önleme riske göre</text><text x="480" y="262" text-anchor="middle" font-size="11" fill="#4c1d95">Yüksek (&gt;%5): IV sıvı + rasburikaz</text><text x="480" y="282" text-anchor="middle" font-size="11" fill="#4c1d95">Orta (%1–5): IV sıvı + allopurinol</text><text x="480" y="314" text-anchor="middle" font-size="11" fill="#4c1d95">Önlemlere karşın ~%3–5'inde TLS</text></g>
<g class="a m s4"><rect x="40" y="364" width="560" height="320" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="392" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Kimde beklenir?</text><text x="320" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Ateşli nötropeni sıklığı</text><text x="320" y="444" text-anchor="middle" font-size="12" fill="#334155">Düşük riskli solid tümör %5–10</text><text x="320" y="464" text-anchor="middle" font-size="12" fill="#334155">Lösemi dışı hematolojik malignite %20–25</text><text x="320" y="484" text-anchor="middle" font-size="12" fill="#334155">Akut lösemi %85–95</text><text x="320" y="514" text-anchor="middle" font-size="12" fill="#334155">Triyaj: son 6 haftada sistemik kanser tedavisi = nötropenik olabilir</text><text x="320" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">TLS yüksek risk örnekleri</text><text x="320" y="574" text-anchor="middle" font-size="12" fill="#334155">Burkitt lösemi · ileri evre Burkitt lenfoma</text><text x="320" y="594" text-anchor="middle" font-size="12" fill="#334155">ALL ya da AML, BK ≥100 bin</text><text x="320" y="614" text-anchor="middle" font-size="12" fill="#334155">KLL + venetoklaks, büyük nod + yüksek lenfosit</text><text x="320" y="644" text-anchor="middle" font-size="11" fill="#334155">Tetikleyici: sitotoksik KT, sitolitik antikor, ışın, glukokortikoid,</text><text x="320" y="662" text-anchor="middle" font-size="11" fill="#334155">venetoklaks, obinutuzumab, CAR-T — bazen kendiliğinden</text></g>
</svg>
