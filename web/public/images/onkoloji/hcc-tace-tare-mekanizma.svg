<rect width="640" height="650" fill="#ffffff"/>

<g class="a p"><rect x="20" y="40" width="290" height="340" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="165" y="30" font-size="14" font-weight="900" text-anchor="middle" fill="#b45309">TACE</text><path d="M40,330 C100,300 120,250 160,210" stroke="#dc2626" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M160,210 L170,170 M160,210 L200,190 M160,210 L192,226" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/><circle class="m a tacet" cx="195" cy="190" r="56" fill="#57534e" opacity=".75" stroke="#b91c1c" stroke-width="2"/><text x="80" y="352" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">hepatik arter</text><text x="250" y="128" font-size="12" font-weight="900" text-anchor="middle" fill="#7f1d1d">HCC</text><path d="M290,350 C250,320 240,300 260,270" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7"/><text x="232" y="372" font-size="10" font-weight="500" text-anchor="middle" fill="#1d4ed8">portal ven → parankim</text><rect x="330" y="40" width="290" height="340" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="475" y="30" font-size="14" font-weight="900" text-anchor="middle" fill="#6d28d9">TARE (SIRT)</text><path d="M350,330 C410,300 430,250 470,210" stroke="#dc2626" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M470,210 L480,170 M470,210 L510,190 M470,210 L502,226" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/><circle class="m a taret" cx="505" cy="190" r="56" fill="#78716c" opacity=".75" stroke="#b91c1c" stroke-width="2"/><text x="390" y="352" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">hepatik arter</text><text x="560" y="128" font-size="12" font-weight="900" text-anchor="middle" fill="#7f1d1d">HCC</text><path d="M600,350 C560,320 550,300 570,270" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7"/><text x="542" y="372" font-size="10" font-weight="500" text-anchor="middle" fill="#1d4ed8">portal ven → parankim</text></g>
<g class="a ilac"><path class="a ciz" pathLength="1" d="M50,322 C100,296 120,250 156,214" stroke="#f59e0b" stroke-width="2.2" fill="none" marker-end="url(#ok)"/><text x="40" y="70" font-size="11.5" font-weight="800" text-anchor="start" fill="#92400e">1 · kemoterapi + Lipiodol</text><text x="40" y="88" font-size="10.5" font-weight="500" text-anchor="start" fill="#92400e">doksorubisin · epirubisin · sisplatin</text></g>
<g class="a part"><circle cx="115" cy="296" r="5" fill="#facc15" stroke="#a16207"/><circle cx="132" cy="264" r="4.4" fill="#facc15" stroke="#a16207"/><circle cx="146" cy="236" r="3.8" fill="#facc15" stroke="#a16207"/><text x="40" y="110" font-size="11.5" font-weight="800" text-anchor="start" fill="#92400e">2 · partikülle embolizasyon</text><path d="M128,248 L152,272 M152,248 L128,272" stroke="#111827" stroke-width="3"/><text x="40" y="128" font-size="10" font-weight="500" text-anchor="start" fill="#92400e">(DEB-TACE: ilaç salan mikroküre)</text></g>
<g class="a kure"><g class="a isin m" style="transform-origin:480px 172px;transform-box:view-box"><circle cx="480" cy="172" r="9" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="2 2"/></g><circle cx="480" cy="172" r="3.6" fill="#7c3aed"/><g class="a isin m" style="transform-origin:510px 192px;transform-box:view-box"><circle cx="510" cy="192" r="9" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="2 2"/></g><circle cx="510" cy="192" r="3.6" fill="#7c3aed"/><g class="a isin m" style="transform-origin:498px 226px;transform-box:view-box"><circle cx="498" cy="226" r="9" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="2 2"/></g><circle cx="498" cy="226" r="3.6" fill="#7c3aed"/><g class="a isin m" style="transform-origin:526px 168px;transform-box:view-box"><circle cx="526" cy="168" r="9" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="2 2"/></g><circle cx="526" cy="168" r="3.6" fill="#7c3aed"/><g class="a isin m" style="transform-origin:530px 210px;transform-box:view-box"><circle cx="530" cy="210" r="9" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="2 2"/></g><circle cx="530" cy="210" r="3.6" fill="#7c3aed"/><g class="a isin m" style="transform-origin:488px 200px;transform-box:view-box"><circle cx="488" cy="200" r="9" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="2 2"/></g><circle cx="488" cy="200" r="3.6" fill="#7c3aed"/><text x="350" y="70" font-size="11.5" font-weight="800" text-anchor="start" fill="#5b21b6">Y-90 mikroküre (~32 µm)</text><text x="350" y="88" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b21b6">mikrodamar yatağına takılır</text><text x="350" y="106" font-size="10.5" font-weight="500" text-anchor="start" fill="#5b21b6">lokal β radyasyon · arter AÇIK kalır</text></g>
<g class="a nek"><text x="195" y="196" font-size="11" font-weight="900" text-anchor="middle" fill="#ffffff">iskemi + ilaç</text><text x="505" y="254" font-size="11" font-weight="900" text-anchor="middle" fill="#4c1d95">radyasyon nekrozu</text></g>
