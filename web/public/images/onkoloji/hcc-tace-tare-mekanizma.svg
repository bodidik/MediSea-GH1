<g class="a pes"><rect x="20" y="520" width="600" height="118" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="550" font-size="13.5" font-weight="800" text-anchor="middle" fill="#1e293b">Embolizasyon sonrası sendrom</text><text x="320" y="567" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">TACE %60–80 · TARE %20–70 · RFA %36</text><text x="320" y="584" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">sağ üst kadran ağrısı · ateş · bulantı · ileus · transaminaz ve bilirubin ↑</text><text x="320" y="601" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">3–4 gün sürer, 7–10 günde düzelir</text><text x="320" y="618" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">Mantık: tümör arteriyel, sağlam parankim portal beslenir → seçicilik</text></g>

</svg>
