<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">TACE ve TARE: arteriyel tedavinin iki mekanizması</title>
<desc id="d">Her iki yöntem de tümörün kanını hepatik arterden almasından yararlanır; sağlam parankim ağırlıklı olarak portal venden beslendiği için korunur. TACE'de hepatik arter dalına kemoterapi (doksorubisin, epirubisin ya da sisplatin) ve Lipiodol verilir, ardından damar partiküllerle tıkanır: iskemi ile yüksek lokal ilaç yoğunluğu birlikte nekroz yaratır. Ana portal ven trombozunda ve dekompanze sirozda kontrendikedir. TARE'de itriyum-90 yüklü mikroküreler (yaklaşık 32 mikron) tümörün mikrodamar yatağına takılır ve büyük damarı tıkamadan beta radyasyonuyla nekroz yaratır; bu yüzden ana portal ven tümör trombozu TARE için kontrendikasyon değildir. Embolizasyon sonrası sendrom (ağrı, ateş, bulantı, enzim yükselmesi) TACE'de yüzde 60–80, TARE'de yüzde 20–70 sıklıktadır ve 7–10 günde düzelir.</desc>
<!-- 14 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:14s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.p{animation-name:p}@keyframes p{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.p .ciz{animation-name:pc}@keyframes pc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.ilac{animation-name:ilac}@keyframes ilac{0%,14%{opacity:0;transform:translateY(7px)}17%,100%{opacity:1;transform:none}}
.ilac .ciz{animation-name:ilacc}@keyframes ilacc{0%,14%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.part{animation-name:part}@keyframes part{0%,28%{opacity:0;transform:translateY(7px)}31%,100%{opacity:1;transform:none}}
.part .ciz{animation-name:partc}@keyframes partc{0%,28%{stroke-dashoffset:1}32%,100%{stroke-dashoffset:0}}
.kure{animation-name:kure}@keyframes kure{0%,40%{opacity:0;transform:translateY(7px)}43%,100%{opacity:1;transform:none}}
.kure .ciz{animation-name:kurec}@keyframes kurec{0%,40%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
.nek{animation-name:nek}@keyframes nek{0%,56%{opacity:0;transform:translateY(7px)}59%,100%{opacity:1;transform:none}}
.nek .ciz{animation-name:nekc}@keyframes nekc{0%,56%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.fark{animation-name:fark}@keyframes fark{0%,76%{opacity:0;transform:translateY(7px)}79%,100%{opacity:1;transform:none}}
.fark .ciz{animation-name:farkc}@keyframes farkc{0%,76%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
.pes{animation-name:pes}@keyframes pes{0%,86%{opacity:0;transform:translateY(7px)}89%,100%{opacity:1;transform:none}}
.pes .ciz{animation-name:pesc}@keyframes pesc{0%,86%{stroke-dashoffset:1}90%,100%{stroke-dashoffset:0}}
.tacet{animation-name:tacet}@keyframes tacet{0%,55%{fill:#fca5a5}75%,100%{fill:#57534e}}
.taret{animation-name:taret}@keyframes taret{0%,60%{fill:#fca5a5}82%,100%{fill:#78716c}}
.isin{animation-name:isin}@keyframes isin{0%,52%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1)}66%{opacity:.4;transform:scale(1.25)}72%{opacity:1;transform:scale(1)}78%,100%{opacity:.85;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
