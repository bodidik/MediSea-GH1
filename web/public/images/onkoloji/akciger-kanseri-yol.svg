<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Akciğer kanseri: riskten belirtiye</title>
<desc id="d">Akciğer kanseri dünyada kansere bağlı ölümlerin başlıca nedenidir; 2022'de yaklaşık 2,4 milyon yeni olgu ve 1,8 milyon ölüm. Sigara olguların yaklaşık yüzde 90'ından sorumludur; radon, asbest, mesleki etkenler ve pulmoner fibroz da riski artırır. Hiç sigara içmemiş kişilerde görülen akciğer kanseri ayrı bir hastalık gibidir; Asya'da kadın hastaların yüzde 60 ile 80'i hiç sigara içmemiştir ve EGFR mutasyonu sıktır. ABD Önleyici Hizmetler Görev Gücü 50 ile 80 yaş arası, en az 20 paket-yıl içmiş ve hâlâ içen ya da son 15 yılda bırakmış kişilere yıllık düşük doz BT önerir; NLST'de akciğer kanserine bağlı ölüm yüzde 20, NELSON'da erkeklerde yüzde 24 azaldı. Taranmamış hastaların yaklaşık dörtte üçü tanıda belirtilidir: öksürük, nefes darlığı, ağrı, kilo kaybı ve hemoptizi. Süperior sulkus tümörü omuz ağrısı ve Horner sendromuyla Pancoast tablosu yapar; vena kava süperior tıkanıklığı yüz ve boyunda ödem, pletora yapar. Uzak metastaz en sık karaciğer, adrenal, kemik ve beyindir. Paraneoplastik tablolar: hiperkalsemi, uygunsuz ADH salgısı, ektopik ACTH ile Cushing sendromu ve Lambert-Eaton sendromu.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
