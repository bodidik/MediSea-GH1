%90</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#7f1d1d">radon · asbest · meslek</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#7f1d1d">fibroz 8–14 kat</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Hiç içmemiş (LCINS)</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#4c1d95">Asya'da kadınların %60–80'i</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#4c1d95">adenokarsinom</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#4c1d95">EGFR mutasyonu sık</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Tarama: yıllık düşük doz BT</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#064e3b">50–80 yaş · ≥20 paket-yıl · içiyor ya da &lt;15 yıl önce bıraktı</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Kanıt</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#1e3a8a">NLST: ölüm −%20</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#1e3a8a">NELSON (erkek): −%24</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#1e3a8a">aşırı tanı ~%9</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Belirtiler (~3/4)</text><text x="477.5" y="470.5" text-anchor="middle" f