<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" width="640" height="610" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Metastatik hastalıkta tedavi seçimi</title>
<desc id="d">Tüm metastatik hastalara germline ve somatik test yapılır. Hedeflenebilir değişiklikte BRCA1/2 veya PALB2 için platin bazlı tedavi ve yanıtta PARP inhibitörü idamesi, MSI-yüksek veya dMMR için pembrolizumab, NTRK füzyonunda TRK inhibitörü, RET füzyonunda selperkatinib uygulanır; KRAS G12C ve BRAF V600E'de birinci basamak kemoterapidir. Hedeflenebilir değişiklik yoksa ECOG 0-1 ve bilirubin normalin 1,5 katından düşük ise modifiye FOLFIRINOX, alternatif gemsitabin artı nab-paklitaksel ya da NALIRIFOX; ECOG 2'de gemsitabin artı nab-paklitaksel; bilirubin yüksekse FOLFOX veya infüzyonel 5-FU; ECOG 3 ve üzerinde tek ajan veya destek tedavi seçilir. İkinci basamakta gemsitabin bazlı tedavi görene FOLFIRI ya da 5-FU artı lipozomal irinotekan, FOLFIRINOX görene gemsitabin artı nab-paklitaksel verilir. Daraxonrasib RASolute 302'de sağkalımı 7'den 13 aya çıkarmıştır ve Haziran 2026 itibarıyla araştırma ilacıdır.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,16%{opacity:0;transform:translateY(7px)}19%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,16%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,33%{opacity:0;transform:translateY(7px)}36%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,33%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,49%{opacity:0;transform:translateY(7px)}52%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,49%{stroke-dashoffset:1}53%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="610" fill="#ffffff"/>
<g class="a s0"><rect x="120" y="14" width="400" height="48" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="320" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Her hastada germline + somatik test</text></g>
<g class="a s1"><path class="ciz" pathLength="1" d="M220 62 L150 88" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M420 62 L490 88" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="90" width="296" height="300" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="164" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Hedeflenebilir</text><text x="164" y="131" text-anchor="middle" font-size="13" fill="#334155">BRCA1/2, PALB2:</text><text x="164" y="149" text-anchor="middle" font-size="13" fill="#334155">platin → yanıtta PARP idamesi</text><text x="164" y="167" text-anchor="middle" font-size="13" fill="#334155"> </text><text x="164" y="185" text-anchor="middle" font-size="13" fill="#334155">MSI-H/dMMR: pembrolizumab</text><text x="164" y="203" text-anchor="middle" font-size="13" fill="#334155"> </text><text x="164" y="221" text-anchor="middle" font-size="13" fill="#334155">NTRK: TRK inhibitörü</text><text x="164" y="239" text-anchor="middle" font-size="13" fill="#334155">RET: selperkatinib</text><text x="164" y="257" text-anchor="middle" font-size="13" fill="#334155"> </text><text x="164" y="275" text-anchor="middle" font-size="13" fill="#334155">KRAS G12C, BRAF V600E:</text><text x="164" y="293" text-anchor="middle" font-size="13" fill="#334155">önce kemoterapi; hedefe</text><text x="164" y="311" text-anchor="middle" font-size="13" fill="#334155">yönelik ilaç alternatif</text></g>
<g class="a s2"><rect x="328" y="90" width="296" height="300" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="476" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Hedeflenebilir değil</text><text x="476" y="131" text-anchor="middle" font-size="13" fill="#334155">ECOG 0–1, bil &lt;1,5×ÜSN:</text><text x="476" y="149" text-anchor="middle" font-size="13" fill="#334155">mFOLFIRINOX</text><text x="476" y="167" text-anchor="middle" font-size="13" fill="#334155">(alt: GnP, NALIRIFOX)</text><text x="476" y="185" text-anchor="middle" font-size="13" fill="#334155"> </text><text x="476" y="203" text-anchor="middle" font-size="13" fill="#334155">ECOG 2, bil &lt;1,5×ÜSN: GnP</text><text x="476" y="221" text-anchor="middle" font-size="13" fill="#334155"> </text><text x="476" y="239" text-anchor="middle" font-size="13" fill="#334155">Bil ≥1,5×ÜSN:</text><text x="476" y="257" text-anchor="middle" font-size="13" fill="#334155">FOLFOX / infüzyonel 5-FU</text><text x="476" y="275" text-anchor="middle" font-size="13" fill="#334155"> </text><text x="476" y="293" text-anchor="middle" font-size="13" fill="#334155">ECOG 3: tek ajan ya da</text><text x="476" y="311" text-anchor="middle" font-size="13" fill="#334155">yalnız destek tedavi</text></g>
<g class="a s3"><path class="ciz" pathLength="1" d="M164 390 L240 416" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M476 390 L400 416" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="70" y="418" width="500" height="108" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="320" y="439" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">İkinci basamak</text><text x="320" y="459" text-anchor="middle" font-size="13" fill="#334155">Önce gemsitabin bazlı → FOLFIRI ya da 5-FU + nal-IRI</text><text x="320" y="477" text-anchor="middle" font-size="13" fill="#334155">Önce FOLFIRINOX / NALIRIFOX → GnP</text><text x="320" y="495" text-anchor="middle" font-size="13" fill="#334155">Bilirubin yüksek → FOLFOX ya da 5-FU bazlı</text></g>
<g class="a s4"><rect x="16" y="538" width="608" height="62" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="320" y="559" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">RAS(ON): daraxonrasib (RASolute 302)</text><text x="320" y="579" text-anchor="middle" font-size="13" fill="#334155">G12 mutantta OS 13 vs 7 ay, HR 0,40; Haziran 2026'da araştırma ilacı</text></g>
</svg>
