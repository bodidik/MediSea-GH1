<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ateşli nötropenide ilk değerlendirme ve riske göre tedavi (UpToDate, Mandell 2026)</title>
<desc id="d">Ateş ve nötropeni: en az iki set kan kültüründen hemen sonra, başvurudan itibaren 60 dakika içinde ampirik antibiyotik. Risk: düşük risk (nötropeni 7 gün ve altı, MASCC 21 ve üstü ya da CISNE 0, komorbidite yok) en az 4 saat gözlem sonrası oral siprofloksasin ve amoksisilin-klavulanat; florokinolon profilaksisi alana IV. Yüksek risk (nötropeni 7 günden uzun, MASCC 21 altı ya da CISNE 3 ve üstü, komorbidite) yatış ve IV antipsödomonal beta-laktam monoterapisi; vankomisin yalnız seçili durumlarda. 2–4. günde yeniden değerlendirme. Ateş düştü ve kaynak yoksa en az 72 saat ateşsizlikten sonra kes ya da profilaksiye dön. Ateş 4–7 gün sürerse ampirik antifungal: nodül yoksa ekinokandin, nodül varsa küfe etkili azol ya da lipid amfoterisin B.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="640" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="120" y="14" width="400" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="41" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Ateş + nötropeni (ANS &lt;500/µL)</text><text x="320" y="59" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">≥38,3 °C tek ölçüm ya da ≥38,0 °C 1 saat</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="76" x2="320" y2="98" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="80" y="100" width="480" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="127" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">≥2 set kan kültürü → hemen antibiyotik</text><text x="320" y="145" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Hedef: başvurudan sonra ≤60 dakika</text></g><g class="a" style="animation-delay:4.80s"><line x1="320" y1="162" x2="320" y2="184" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="170" y="186" width="300" height="50" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="216" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Risk: süre · MASCC · CISNE · komorbidite</text></g><g class="a" style="animation-delay:7.20s"><line x1="250" y1="236" x2="170" y2="262" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="390" y1="236" x2="470" y2="262" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="264" width="300" height="122" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="164" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Düşük risk</text><text x="164" y="312" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Nötropeni ≤7 gün · MASCC ≥21</text><text x="164" y="330" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">ya da CISNE 0 · komorbidite yok</text><text x="164" y="348" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">≥4 saat gözlem → oral</text><text x="164" y="366" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">siprofloksasin + amoks-klav</text><rect x="326" y="264" width="300" height="122" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="476" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Yüksek risk</text><text x="476" y="312" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Nötropeni &gt;7 gün · MASCC &lt;21</text><text x="476" y="330" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">ya da CISNE ≥3 · komorbidite</text><text x="476" y="348" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Yatış · IV antipsödomonal</text><text x="476" y="366" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">β-laktam monoterapisi</text></g><g class="a" style="animation-delay:9.60s"><rect x="14" y="400" width="300" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="164" y="427" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">FQ profilaksisi alıyorsa</text><text x="164" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">ya da ESBL öyküsü → yatış, IV</text><rect x="326" y="400" width="300" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="476" y="427" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Vankomisin rutin değil: şok, pnömoni,</text><text x="476" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">kateter, cilt, Gram (+) kan kültürü</text></g><g class="a" style="animation-delay:12.00s"><line x1="320" y1="462" x2="320" y2="484" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="120" y="486" width="400" height="50" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="516" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">2–4. gün: kültür ve kliniğe göre yeniden bak</text></g><g class="a" style="animation-delay:14.40s"><line x1="240" y1="536" x2="170" y2="560" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><line x1="400" y1="536" x2="470" y2="560" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="14" y="562" width="300" height="66" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="164" y="591" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Ateş düştü, kaynak yok</text><text x="164" y="609" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">≥72 saat ateşsiz → kes ya da profilaksi</text><rect x="326" y="562" width="300" height="66" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="476" y="591" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Ateş 4–7 gün sürüyor</text><text x="476" y="609" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Nodül yok: ekinokandin · var: azol/L-AmB</text></g>
</svg>
