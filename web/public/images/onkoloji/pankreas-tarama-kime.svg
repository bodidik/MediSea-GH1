<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Pankreas kanseri taraması kime, ne zaman başlar</title>
<desc id="d">Bireysel ve ailesel öykü alınır, gerekli olanda germline test yapılır. Hasta akraba aranmayan gruplar: Peutz-Jeghers 30-35 yaş, CDKN2A 40 yaş, herediter pankreatitte PRSS1 varyantı ile 40 yaş ya da pankreatit başlangıcından 20 yıl sonra. UpToDate'e göre BRCA1, PALB2, ATM, Lynch ve TP53 taşıyıcılarında birinci ya da ikinci derece hasta akraba aranır ve tarama 50 yaşında ya da en genç hasta akrabadan 10 yıl önce başlar. BRCA2'de ASGE ve NCCN akraba aramaz, CAPS arar. Bilinen gen yoksa ailede en az bir çift birinci derece hasta akraba olanlar 50 yaşında ya da 10 yıl önce başlar. Tarama yıllık EUS ve/veya MRG-MRCP ile yapılır, CDKN2A ve Peutz-Jeghers'te altı ayda bir uygundur; yalnızca cerrahiye aday olanlarda ve deneyimli merkezde.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,12%{opacity:0;transform:translateY(7px)}15%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,12%{stroke-dashoffset:1}16%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,23%{opacity:0;transform:translateY(7px)}26%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,23%{stroke-dashoffset:1}27%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,47%{opacity:0;transform:translateY(7px)}50%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,47%{stroke-dashoffset:1}51%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,59%{opacity:0;transform:translateY(7px)}62%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:s5c}@keyframes s5c{0%,59%{stroke-dashoffset:1}63%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:s6c}@keyframes s6c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="500" fill="#ffffff"/>
<g class="a s0"><rect x="120" y="12" width="400" height="48" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="320" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Öykü + gerekirse germline test</text></g>
<g class="a s1"><path class="ciz" pathLength="1" d="M200 60 L114 88" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M320 60 L320 88" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M440 60 L526 88" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="90" width="196" height="170" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="114" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Akraba aranmaz</text><text x="114" y="131" text-anchor="middle" font-size="13" fill="#334155">Peutz-Jeghers: 30–35</text><text x="114" y="149" text-anchor="middle" font-size="13" fill="#334155">CDKN2A: 40</text><text x="114" y="167" text-anchor="middle" font-size="13" fill="#334155">PRSS1: 40 ya da</text><text x="114" y="185" text-anchor="middle" font-size="13" fill="#334155">pankreatitten</text><text x="114" y="203" text-anchor="middle" font-size="13" fill="#334155">20 yıl sonra</text></g>
<g class="a s2"><rect x="222" y="90" width="196" height="170" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="320" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Hasta akraba aranır</text><text x="320" y="131" text-anchor="middle" font-size="13" fill="#334155">BRCA1 · PALB2 · ATM</text><text x="320" y="149" text-anchor="middle" font-size="13" fill="#334155">Lynch · TP53</text><text x="320" y="167" text-anchor="middle" font-size="13" fill="#334155">50 yaş ya da en genç</text><text x="320" y="185" text-anchor="middle" font-size="13" fill="#334155">hastadan 10 yıl önce</text><text x="320" y="203" text-anchor="middle" font-size="13" fill="#334155">(*fark tablosu)</text></g>
<g class="a s3"><rect x="428" y="90" width="196" height="170" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="526" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Gen bulunmayan aile</text><text x="526" y="131" text-anchor="middle" font-size="13" fill="#334155">≥2 hasta birinci</text><text x="526" y="149" text-anchor="middle" font-size="13" fill="#334155">derece akraba (çift)</text><text x="526" y="167" text-anchor="middle" font-size="13" fill="#334155">50 yaş ya da en genç</text><text x="526" y="185" text-anchor="middle" font-size="13" fill="#334155">hastadan 10 yıl önce</text></g>
<g class="a s4"><rect x="16" y="274" width="608" height="62" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="320" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">BRCA2: görüş ayrılığı</text><text x="320" y="315" text-anchor="middle" font-size="13" fill="#334155">ASGE ve NCCN hasta akraba aramaz (yaşam boyu risk %7,4); CAPS arar</text></g>
<g class="a s5"><path class="ciz" pathLength="1" d="M320 336 L320 362" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="70" y="364" width="500" height="76" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="320" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Yıllık EUS ve/veya MRG-MRCP (çoğu kez dönüşümlü)</text><text x="320" y="405" text-anchor="middle" font-size="13" fill="#334155">CDKN2A ve Peutz-Jeghers'te 6 ayda bir uygun</text></g>
<g class="a s6"><rect x="16" y="452" width="608" height="38" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="320" y="473" text-anchor="middle" font-size="13" fill="#334155">Yalnız cerrahiye aday kişide; ortalama riskte tarama yok.</text></g>
</svg>
