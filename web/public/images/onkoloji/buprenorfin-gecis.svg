<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Buprenorfine geçiş: hastadan titrasyona</title>
<desc id="d">Birinci adım, hasta: opioid naif ya da az opioid almış hasta en kolay adaydır; böbrek yetmezliği, solunum depresyonu kaygısı, opioid kullanım bozukluğu ve yaşlı hasta öne çıkan gruplardır. İkinci adım, risk: yüksek afiniteli kısmi agonist tam agonisti reseptörden söker; tam agonist alan hastada ani başlangıç yoksunluk tetikleyebilir. Üçüncü adım, NCCN yolu: önce mevcut opioid günde en fazla 30 mg oral MEDD'ye, yalnız hızlı salımlı olarak indirilir; sonra düşük dozla başlanıp kademeli titre edilir. Dördüncü adım, düşük doz başlangıç: tam agonist sürerken sık aralıklarla küçük dozlar, örneğin 0,5–1 mg, verilir; kanıt çoğunlukla olgu bildirimidir; deneyimli uzman gerekir. Beşinci adım, titrasyon: bant 5 mikrogram/saatle başlar, en erken 72 saatte bir 5 mikrogram artırılır, en fazla 20; bukkal film en erken 4 günde bir 12 saatlik doza 150 mikrogram eklenir, en fazla 900 mikrogram 12 saatte bir; kırılma ağrısında kısa etkili tam agonist eklenebilir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
.s5{animation-name:s5}@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,33%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,67%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="820" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,128 L320,150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,252 L320,274" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,398 L320,420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,544 L320,566" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="14" width="560" height="114" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">1 · Hasta</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">En kolay aday: opioid naif ya da az opioid almış hasta</text><text x="320" y="88" text-anchor="middle" font-size="12" fill="#334155">Böbrek yetmezliği · solunum depresyonu kaygısı</text><text x="320" y="110" text-anchor="middle" font-size="12" fill="#334155">Opioid kullanım bozukluğu · yaşlı hasta</text></g>
<g class="a m s2"><rect x="40" y="152" width="560" height="100" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">2 · Risk: yoksunluk</text><text x="320" y="204" text-anchor="middle" font-size="12" fill="#7f1d1d">Yüksek afiniteli kısmi agonist, tam agonisti reseptörden söker</text><text x="320" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Tam agonist alan hastada ani başlangıç → akut yoksunluk</text></g>
<g class="a m s3"><rect x="40" y="276" width="560" height="122" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="304" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">3 · NCCN yolu: önce azalt</text><text x="320" y="328" text-anchor="middle" font-size="12" fill="#1e3a8a">Mevcut opioid ≤30 mg/gün oral MEDD'ye (yalnız hızlı salımlı)</text><text x="320" y="350" text-anchor="middle" font-size="12" fill="#1e3a8a">Sürekli ve uzun etkili opioidler kesilir</text><text x="320" y="374" text-anchor="middle" font-size="12" fill="#1e3a8a">Sonra düşük doz buprenorfin → kademeli titrasyon</text></g>
<g class="a m s4"><rect x="40" y="422" width="560" height="122" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="450" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · Düşük doz başlangıç</text><text x="320" y="474" text-anchor="middle" font-size="12" fill="#78350f">Tam agonist sürerken sık, küçük dozlar (ör. 0,5–1 mg)</text><text x="320" y="496" text-anchor="middle" font-size="12" fill="#78350f">Kanıt çoğunlukla olgu bildirimi</text><text x="320" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Deneyimli ağrı ya da bağımlılık uzmanıyla</text></g>
<g class="a m s5"><rect x="40" y="568" width="560" height="234" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="596" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">5 · Titrasyon (NCCN)</text><text x="320" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Bant</text><text x="320" y="646" text-anchor="middle" font-size="12" fill="#064e3b">5 mcg/sa, 7 günde bir değişir · ≥72 saatte bir +5 mcg/sa</text><text x="320" y="668" text-anchor="middle" font-size="12" fill="#064e3b">En fazla 20 mcg/sa (≈ TD fentanil 25 mcg/sa)</text><text x="320" y="696" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Bukkal film</text><text x="320" y="718" text-anchor="middle" font-size="12" fill="#064e3b">75 mcg günde 1–2 kez · ≥4 günde bir +150 mcg/12 sa</text><text x="320" y="740" text-anchor="middle" font-size="12" fill="#064e3b">En fazla 900 mcg 12 saatte bir (QTc)</text><text x="320" y="774" text-anchor="middle" font-size="12" fill="#064e3b">Kırılma ağrısı: kısa etkili tam agonist eklenebilir</text></g>
</svg>
