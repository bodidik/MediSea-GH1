<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Risk etkenlerinin kanıt gücü</title>
<desc id="d">Yerleşik etkenler: yaş, sigara (göreceli risk en az 1,5), obezite (BKİ 30 ve üzerinde 1,72), diyabet (2,08), kronik pankreatit (standart insidans oranı 26,3 ve birikimli 20 yılda yüzde 4), kalıtım. Daha zayıf ya da çelişkili: alkol (yoğun içicilerle sınırlı küçük etki), Batı tipi beslenme, H. pylori, hepatit B ve C, O dışı kan grubu (HR 1,32-1,72), meslekî klorlu çözücü ve ağır metal. Artış göstermeyen ya da çelişkili: kahve (1,13, anlamlı değil) ve aspirin. İnkretin ilaçlar için kaynaktaki yaklaşık üç kat ilişki tek cümleyle verilmektedir ve neden sonuç göstermez.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,27%{opacity:0;transform:translateY(7px)}30%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,27%{stroke-dashoffset:1}31%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,55%{opacity:0;transform:translateY(7px)}58%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,55%{stroke-dashoffset:1}59%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="470" fill="#ffffff"/>
<g class="a s0"><rect x="16" y="12" width="608" height="140" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="320" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Yerleşik</text><text x="320" y="53" text-anchor="middle" font-size="13" fill="#334155">Yaş · Sigara (RR ≥1,5; aktif içicide 2,5)</text><text x="320" y="71" text-anchor="middle" font-size="13" fill="#334155">Obezite: BKİ ≥30 → RR 1,72 · Diyabet: RR 2,08</text><text x="320" y="89" text-anchor="middle" font-size="13" fill="#334155">Kronik pankreatit: SIR 26,3; 20 yılda %4</text><text x="320" y="107" text-anchor="middle" font-size="13" fill="#334155">Kalıtsal sendromlar ve ailesel küme</text></g>
<g class="a s1"><path class="ciz" pathLength="1" d="M320 152 L320 176" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="178" width="608" height="140" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="320" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Zayıf ya da heterojen</text><text x="320" y="219" text-anchor="middle" font-size="13" fill="#334155">Alkol: yoğun içiciyle sınırlı küçük etki · Batı tipi beslenme</text><text x="320" y="237" text-anchor="middle" font-size="13" fill="#334155">H. pylori (zayıf) · HBV/HCV</text><text x="320" y="255" text-anchor="middle" font-size="13" fill="#334155">O dışı kan grubu: HR 1,32–1,72</text><text x="320" y="273" text-anchor="middle" font-size="13" fill="#334155">Mesleki: klorlu hidrokarbon, ağır metal (nitel kayıt)</text></g>
<g class="a s2"><path class="ciz" pathLength="1" d="M320 318 L320 342" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="344" width="608" height="116" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="320" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Kanıtlanmamış ya da çelişkili</text><text x="320" y="385" text-anchor="middle" font-size="13" fill="#334155">Kahve: RR 1,13 (0,99–1,29), anlamlı değil</text><text x="320" y="403" text-anchor="middle" font-size="13" fill="#334155">Aspirin: bir kohortta RR 1,86; başka kohortta ilişki yok</text><text x="320" y="421" text-anchor="middle" font-size="13" fill="#334155">İnkretin ilaçlar: nedensellik gösterilmedi</text></g>
</svg>
