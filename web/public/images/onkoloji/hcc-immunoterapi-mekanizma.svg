<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">HCC'de immünoterapi ve anti-VEGF mekanizması</title>
<desc id="d">Lenf düğümünde T hücresinin uyarılması (priming) CTLA-4 ile frenlenir; anti-CTLA-4 antikorları (tremelimumab tek doz 300 mg, ipilimumab) bu freni kaldırarak priming'i artırır. Tümörde tümör hücresinin PD-L1'i T hücresinin PD-1'ine bağlanarak T hücresini susturur; anti-PD-L1 (atezolizumab, durvalumab) ya da anti-PD-1 (nivolumab, camrelizumab) bu bağlanmayı keser ve T hücresi tümörü öldürür. VEGF anjiyogenezi ve immün baskılayıcı mikroçevreyi sürdürür; bevacizumab VEGF'i bağlar, rivoceranib VEGFR2'yi bloke eder. Birinci basamak kombinasyonlar: atezolizumab + bevacizumab (IMbrave150, OS 19,2 ve 13,4 ay, HR 0,66), tremelimumab + durvalumab (HIMALAYA, HR 0,76), nivolumab + ipilimumab (CheckMate 9DW, HR 0,79), camrelizumab + rivoceranib (CARES-310, HR 0,64). Bevacizumab kanama riski nedeniyle son 6 ayda endoskopiyle varis taraması gerekir.</desc>
<!-- 15 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: hcc-semalar.cjs -->
<style>
.a{animation-duration:15s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.lenf{animation-name:lenf}@keyframes lenf{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.lenf .ciz{animation-name:lenfc}@keyframes lenfc{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.ctla{animation-name:ctla}@keyframes ctla{0%,10%{opacity:0;transform:translateY(7px)}13%,100%{opacity:1;transform:none}}
.ctla .ciz{animation-name:ctlac}@keyframes ctlac{0%,10%{stroke-dashoffset:1}14%,100%{stroke-dashoffset:0}}
.tasi{animation-name:tasi}@keyframes tasi{0%,24%{opacity:0;transform:translateY(7px)}27%,100%{opacity:1;transform:none}}
.tasi .ciz{animation-name:tasic}@keyframes tasic{0%,24%{stroke-dashoffset:1}28%,100%{stroke-dashoffset:0}}
.pd{animation-name:pd}@keyframes pd{0%,34%{opacity:0;transform:translateY(7px)}37%,100%{opacity:1;transform:none}}
.pd .ciz{animation-name:pdc}@keyframes pdc{0%,34%{stroke-dashoffset:1}38%,100%{stroke-dashoffset:0}}
.blok{animation-name:blok}@keyframes blok{0%,46%{opacity:0;transform:translateY(7px)}49%,100%{opacity:1;transform:none}}
.blok .ciz{animation-name:blokc}@keyframes blokc{0%,46%{stroke-dashoffset:1}50%,100%{stroke-dashoffset:0}}
.oldur{animation-name:oldur}@keyframes oldur{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.oldur .ciz{animation-name:oldurc}@keyframes oldurc{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
.vegf{animation-name:vegf}@keyframes vegf{0%,72%{opacity:0;transform:translateY(7px)}75%,100%{opacity:1;transform:none}}
.vegf .ciz{animation-name:vegfc}@keyframes vegfc{0%,72%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}
.kanit{animation-name:kanit}@keyframes kanit{0%,84%{opacity:0;transform:translateY(7px)}87%,100%{opacity:1;transform:none}}
.kanit .ciz{animation-name:kanitc}@keyframes kanitc{0%,84%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
.saldir{animation-name:saldir}@keyframes saldir{0%,62%{transform:translateX(0)}72%,100%{transform:translateX(34px)}}
.olum{animation-name:olum}@keyframes olum{0%,72%{opacity:1}84%,100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}.hareket{display:none}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
<marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="tbar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M5,0 L5,10" stroke="#dc2626" stroke-width="2.6"/></marker>
</defs>
<rect width="640" height="640" fill="#ffffff"/>

<g class="a lenf"><rect x="20" y="16" width="290" height="190" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="165" y="36" font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">1 · Lenf düğümü: priming</text><path d="M60,120 l18,-30 l14,24 l20,-20 l6,30 l22,8 l-24,14 l4,26 l-26,-12 l-20,18 z" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/><text x="92" y="178" font-size="10.5" font-weight="500" text-anchor="middle" fill="#92400e">dendritik hücre</text><circle cx="230" cy="118" r="22" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="230" y="122" font-size="13" font-weight="900" text-anchor="middle" fill="#14532d">T</text></g>
<g class="a ctla"><rect x="196" y="102" width="12" height="30" rx="4" fill="#dc2626"/><text x="202" y="152" font-size="10.5" font-weight="800" text-anchor="middle" fill="#b91c1c">CTLA-4</text><rect x="150" y="78" width="40" height="16" rx="8" fill="#7c3aed"/><text x="170" y="90" font-size="9.5" font-weight="800" text-anchor="middle" fill="#fff">anti</text><text x="165" y="66" font-size="10" font-weight="700" text-anchor="middle" fill="#6d28d9">tremelimumab · ipilimumab</text><text x="165" y="196" font-size="10.5" font-weight="700" text-anchor="middle" fill="#14532d">fren kalkar → daha çok T hücresi</text></g>
<g class="a tasi"><path class="a ciz" pathLength="1" d="M310,118 C360,118 360,300 330,320" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#okY)"/><text x="380" y="210" font-size="10.5" font-weight="500" text-anchor="middle" fill="#15803d">dolaşım</text></g>
<g class="a pd"><rect x="20" y="226" width="600" height="190" rx="16" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="246" font-size="13" font-weight="800" text-anchor="middle" fill="#7f1d1d">2 · Tümör: PD-1 / PD-L1 freni</text><g class="a olum"><circle cx="470" cy="330" r="52" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><text x="470" y="334" font-size="11.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">HCC hücresi</text></g><rect x="412" y="316" width="10" height="28" rx="3" fill="#b91c1c"/><text x="404" y="300" font-size="10.5" font-weight="800" text-anchor="middle" fill="#b91c1c">PD-L1</text><g class="a saldir"><circle cx="330" cy="330" r="26" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="330" y="334" font-size="13" font-weight="900" text-anchor="middle" fill="#14532d">T</text><rect x="352" y="316" width="10" height="28" rx="3" fill="#15803d"/><text x="352" y="300" font-size="10.5" font-weight="800" text-anchor="middle" fill="#15803d">PD-1</text></g></g>
<g class="a blok"><rect x="370" y="340" width="40" height="16" rx="8" fill="#7c3aed"/><text x="390" y="352" font-size="9.5" font-weight="800" text-anchor="middle" fill="#fff">anti</text><text x="180" y="290" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6d28d9">anti-PD-L1: atezolizumab · durvalumab</text><text x="180" y="308" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6d28d9">anti-PD-1: nivolumab · camrelizumab</text></g>
<g class="a oldur"><text x="180" y="390" font-size="11.5" font-weight="800" text-anchor="middle" fill="#14532d">bağlanma kesilir → T hücresi tümörü öldürür</text></g>
<g class="a vegf"><rect x="20" y="430" width="600" height="96" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="320" y="450" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">3 · VEGF: anjiyogenez + immün baskılayıcı mikroçevre</text><circle cx="60" cy="490" r="7" fill="#f59e0b" stroke="#b45309"/><circle cx="90" cy="490" r="7" fill="#f59e0b" stroke="#b45309"/><circle cx="120" cy="490" r="7" fill="#f59e0b" stroke="#b45309"/><text x="90" y="516" font-size="10.5" font-weight="800" text-anchor="middle" fill="#b45309">VEGF</text><path d="M150,490 L190,490" stroke="#dc2626" stroke-width="2.6" marker-end="url(#tbar)"/><text x="400" y="480" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">bevacizumab: VEGF'i bağlar (anti-VEGF)</text><text x="400" y="498" font-size="11" font-weight="500" text-anchor="middle" fill="#1e40af">rivoceranib · lenvatinib · sorafenib: VEGFR kinaz inhibisyonu</text><text x="400" y="516" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">bevacizumab öncesi: son 6 ayda varis taraması (EGD)</text></g>
<g class="a kanit"><rect x="20" y="540" width="600" height="88" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="563.5" font-size="13" font-weight="800" text-anchor="middle" fill="#1e293b">Birinci basamak: genel sağkalım HR (karşılaştırma)</text><text x="320" y="580.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">atezolizumab + bevacizumab 0,66 (sorafenib) · tremelimumab + durvalumab 0,76 (sorafenib)</text><text x="320" y="597.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">nivolumab + ipilimumab 0,79 (lenvatinib/sorafenib) · camrelizumab + rivoceranib 0,64 (sorafenib)</text><text x="320" y="614.5" font-size="11.5" font-weight="500" text-anchor="middle" fill="#1e293b">TKI (lenvatinib, sorafenib): immünoterapi uygun değilse</text></g>

</svg>
