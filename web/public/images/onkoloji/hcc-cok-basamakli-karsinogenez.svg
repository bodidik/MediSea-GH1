<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 664" width="640" height="664" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Çok basamaklı hepatokarsinogenez</title>
<desc id="d">Sirotik karaciğerde hasar, nekroz ve rejenerasyon döngüsü somatik değişiklikleri biriktirir. Rejeneratif nodül ve düşük dereceli displastik nodülde retikülin çatısı ve portal alanlar korunur; düşük dereceli nodülün HCC ile güçlü ilişkisi gösterilmemiştir. Yüksek dereceli displastik nodül sirozda yüzde 11–40 sıklıkta görülür, çoğu 0,5–1,5 cm'dir, hücre plakaları kalınlaşır, retikülin odak olarak kaybolur ve eşleşmemiş arterler belirmeye başlar. Erken HCC 2 cm ve altında, kapsülsüzdür; ayırt edici özelliği stromal invazyondur ve tümör arterleri henüz yetersiz olduğundan sıklıkla hipovaskülerdir. İlerlemiş HCC kapsüllüdür, portal alanlar kaybolmuştur, mikrovasküler invazyon ve yaygın sinüzoidal kapillarizasyon (CD34) vardır ve kanlanma yüzde 90–100 arteriyeldir. TERT promotör mutasyonu yüzde 40–65 ile en sık ve en erken değişikliktir; TP53 (yüzde 25–40) ile CTNNB1 (yaklaşık yüzde 25) birbirini dışlar.</desc>
