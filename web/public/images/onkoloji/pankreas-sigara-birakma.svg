<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sigarayı bırakma ve risk</title>
<desc id="d">Bir prospektif çalışmada aktif sigara içicide göreceli risk 2,5'tir. Bırakmadan iki yıl sonra risk yüzde 48 düşer ve 10-15 yıl sonra içmeyenlerin düzeyine iner. Bırakmanın ABD'de pankreas kanseri ölümlerinin yaklaşık yüzde 25'ini önleyebileceği hesaplanmıştır. Ailesel olguda ve herediter pankreatitte sigara tanıyı yaklaşık 20 yıl öne çeker.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,16%{opacity:0;transform:translateY(7px)}19%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,16%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,33%{opacity:0;transform:translateY(7px)}36%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,33%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,49%{opacity:0;transform:translateY(7px)}52%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,49%{stroke-dashoffset:1}53%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="340" fill="#ffffff"/>
<g class="a s0"><rect x="16" y="16" width="184" height="110" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="108" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Aktif içici</text><text x="108" y="57" text-anchor="middle" font-size="13" fill="#334155">RR 2,5</text><text x="108" y="75" text-anchor="middle" font-size="13" fill="#334155">Doza bağımlı</text></g>
<g class="a s1"><path class="ciz" pathLength="1" d="M200 71 L232 71" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="234" y="16" width="184" height="110" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="326" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">2 yıl sonra</text><text x="326" y="57" text-anchor="middle" font-size="13" fill="#334155">Risk %48 düşer</text></g>
<g class="a s2"><path class="ciz" pathLength="1" d="M418 71 L450 71" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="452" y="16" width="172" height="110" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="538" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">10–15 yıl</text><text x="538" y="57" text-anchor="middle" font-size="13" fill="#334155">İçmeyen</text><text x="538" y="75" text-anchor="middle" font-size="13" fill="#334155">düzeyine iner</text></g>
<g class="a s3"><rect x="16" y="150" width="608" height="72" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="320" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Toplum düzeyinde</text><text x="320" y="191" text-anchor="middle" font-size="13" fill="#334155">Bırakma ABD'de ölümlerin yaklaşık %25'ini önleyebilir</text></g>
<g class="a s4"><rect x="16" y="240" width="608" height="84" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="320" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Kalıtsal yatkınlıkta</text><text x="320" y="281" text-anchor="middle" font-size="13" fill="#334155">Ailesel olguda ve herediter pankreatitte</text><text x="320" y="299" text-anchor="middle" font-size="13" fill="#334155">sigara tanıyı yaklaşık 20 yıl öne çeker</text></g>
</svg>
