<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Şüpheli pankreas kanserinde tanı ve evreleme yolu</title>
<desc id="d">Sarılık, epigastrik ağrı, kilo kaybı ya da yeni başlayan diyabetle gelen hastada çok fazlı pankreas protokollü toraks, batın ve pelvis bilgisayarlı tomografisi çekilir; sarılıkta görüntüleme stentten önce, tedaviden en çok dört hafta önce yapılır. Uzak metastaz varsa en kolay ulaşılan odaktan biyopsi alınır, germline ve somatik test istenir. Metastaz yoksa anatomik, biyolojik ve koşulsal ölçütlerle rezektabilite belirlenir, multidisipliner konsey karar verir. Karaciğer MRG'si cerrahi öncesi BT'nin görmediği metastazları yüzde 10 ile 23 oranında gösterir. Kemoterapi planlanıyorsa EUS eşliğinde biyopsi gerekir; tipik görünümlü, doğrudan cerrahi adayında biyopsisiz cerrahiye gidilebilir.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,9%{opacity:0;transform:translateY(7px)}12%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,9%{stroke-dashoffset:1}13%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,27%{opacity:0;transform:translateY(7px)}30%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,27%{stroke-dashoffset:1}31%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,46%{opacity:0;transform:translateY(7px)}49%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:s5c}@keyframes s5c{0%,46%{stroke-dashoffset:1}50%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,55%{opacity:0;transform:translateY(7px)}58%,100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:s6c}@keyframes s6c{0%,55%{stroke-dashoffset:1}59%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,64%{opacity:0;transform:translateY(7px)}67%,100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:s7c}@keyframes s7c{0%,64%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:s8c}@keyframes s8c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="590" fill="#ffffff"/>
<g class="a s0"><rect x="120" y="14" width="400" height="66" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="320" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Klinik şüphe</text><text x="320" y="55" text-anchor="middle" font-size="13" fill="#334155">Sarılık · epigastrik ağrı · kilo kaybı · yeni DM</text></g>
<g class="a s1"><path class="ciz" pathLength="1" d="M320 80 L320 106" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="70" y="108" width="500" height="84" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="320" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Çok fazlı pankreas protokollü BT</text><text x="320" y="149" text-anchor="middle" font-size="13" fill="#334155">Toraks + batın + pelvis</text><text x="320" y="167" text-anchor="middle" font-size="13" fill="#334155">Sarılıkta stentten ÖNCE · tedaviden ≤4 hafta önce</text></g>
<g class="a s2"><path class="ciz" pathLength="1" d="M200 192 L140 228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M440 192 L500 228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="20" y="230" width="280" height="66" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="160" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Uzak metastaz var</text><text x="160" y="271" text-anchor="middle" font-size="13" fill="#334155">En kolay odaktan biyopsi</text></g>
<g class="a s3"><rect x="340" y="230" width="280" height="66" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="480" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Uzak metastaz yok</text><text x="480" y="271" text-anchor="middle" font-size="13" fill="#334155">Rezektabilite: anatomi + biyoloji</text></g>
<g class="a s4"><path class="ciz" pathLength="1" d="M160 296 L160 322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M480 296 L480 322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="20" y="324" width="280" height="66" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="160" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Germline + somatik test</text><text x="160" y="365" text-anchor="middle" font-size="13" fill="#334155">Tedaviyi seçtirir (Şekil 4)</text></g>
<g class="a s5"><rect x="340" y="324" width="280" height="84" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="480" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Konsey + karaciğer MRG</text><text x="480" y="365" text-anchor="middle" font-size="13" fill="#334155">BT'nin görmediği metastaz</text><text x="480" y="383" text-anchor="middle" font-size="13" fill="#334155">%10–23 serilerde</text></g>
<g class="a s6"><path class="ciz" pathLength="1" d="M480 408 L480 434" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="340" y="436" width="280" height="84" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="480" y="457" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Kemoterapi planlanıyorsa</text><text x="480" y="477" text-anchor="middle" font-size="13" fill="#334155">EUS-İİB ile doku şart</text><text x="480" y="495" text-anchor="middle" font-size="13" fill="#334155">2 sonuçsuz girişimde konsey</text></g>
<g class="a s7"><rect x="20" y="436" width="280" height="84" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="160" y="457" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Tipik görünüm + cerrahi adayı</text><text x="160" y="477" text-anchor="middle" font-size="13" fill="#334155">Biyopsisiz cerrahi</text><text x="160" y="495" text-anchor="middle" font-size="13" fill="#334155">makul seçenektir</text></g>
<g class="a s8"><rect x="20" y="534" width="600" height="44" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="320" y="555" text-anchor="middle" font-size="13" fill="#334155">CA 19-9 tanı testi değildir; yanıtı izletir. Lewis-negatifte (%5–10) üretilmez.</text></g>
</svg>
