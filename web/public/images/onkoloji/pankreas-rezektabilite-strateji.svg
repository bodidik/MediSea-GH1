<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Rezektabilite sınıfından tedavi stratejisine</title>
<desc id="d">Rezektabl tümörde arter teması yoktur; ven teması yoktur ya da kontur düzgün olmak şartıyla 180 dereceye kadardır. Doğrudan cerrahi ve altı ay adjuvan modifiye FOLFIRINOX standarttır, seçilmiş hastada neoadjuvan tedavi düşünülür. Sınırda rezektabl tümörde hepatik arterde sınırlı temas, süperior mezenterik ya da çölyak arterde 180 dereceye kadar temas veya yeniden yapılandırılabilir venöz tutulum vardır; dört ila altı ay indüksiyon tedavisi, yeniden değerlendirme, cerrahi ve toplam altı ay perioperatif tedavi yapılır. Lokal ileri tümörde arter teması 180 dereceyi aşar ya da ven yeniden yapılandırılamaz; dört ila altı ay sistemik tedavi uygulanır, yaklaşık yüzde 20'si cerrahiye geçer, kalanlarda konsolidasyon radyoterapisi ya da tedavi arası değerlendirilir. Metastatik hastalıkta tedavi moleküler test ve performans durumuna göre seçilir.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,9%{opacity:0;transform:translateY(7px)}12%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,9%{stroke-dashoffset:1}13%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,27%{opacity:0;transform:translateY(7px)}30%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,27%{stroke-dashoffset:1}31%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,36%{opacity:0;transform:translateY(7px)}39%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,36%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,46%{opacity:0;transform:translateY(7px)}49%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:s5c}@keyframes s5c{0%,46%{stroke-dashoffset:1}50%,100%{stroke-dashoffset:0}}
.s6{animation-name:s6}@keyframes s6{0%,55%{opacity:0;transform:translateY(7px)}58%,100%{opacity:1;transform:none}}
.s6 .ciz{animation-name:s6c}@keyframes s6c{0%,55%{stroke-dashoffset:1}59%,100%{stroke-dashoffset:0}}
.s7{animation-name:s7}@keyframes s7{0%,64%{opacity:0;transform:translateY(7px)}67%,100%{opacity:1;transform:none}}
.s7 .ciz{animation-name:s7c}@keyframes s7c{0%,64%{stroke-dashoffset:1}68%,100%{stroke-dashoffset:0}}
.s8{animation-name:s8}@keyframes s8{0%,73%{opacity:0;transform:translateY(7px)}76%,100%{opacity:1;transform:none}}
.s8 .ciz{animation-name:s8c}@keyframes s8c{0%,73%{stroke-dashoffset:1}77%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="500" fill="#ffffff"/>
<g class="a s0"><rect x="20" y="14" width="290" height="106" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="165" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Rezektabl</text><text x="165" y="55" text-anchor="middle" font-size="13" fill="#334155">Arter teması yok</text><text x="165" y="73" text-anchor="middle" font-size="13" fill="#334155">Ven: yok ya da ≤180°</text><text x="165" y="91" text-anchor="middle" font-size="13" fill="#334155">ve kontur düzgün</text></g>
<g class="a s1"><path class="ciz" pathLength="1" d="M310 67 L340 67" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="342" y="14" width="278" height="106" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="481" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Cerrahi → 6 ay adjuvan</text><text x="481" y="55" text-anchor="middle" font-size="13" fill="#334155">mFOLFIRINOX (ECOG 0–1)</text><text x="481" y="73" text-anchor="middle" font-size="13" fill="#334155">Seçilmiş hastada neoadjuvan</text></g>
<g class="a s2"><rect x="20" y="134" width="290" height="106" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="165" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Sınırda rezektabl</text><text x="165" y="175" text-anchor="middle" font-size="13" fill="#334155">HA sınırlı · SMA/çölyak ≤180°</text><text x="165" y="193" text-anchor="middle" font-size="13" fill="#334155">Ven &gt;180° ya da tromboz,</text><text x="165" y="211" text-anchor="middle" font-size="13" fill="#334155">yeniden yapılandırılabilir</text></g>
<g class="a s3"><path class="ciz" pathLength="1" d="M310 187 L340 187" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="342" y="134" width="278" height="106" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="481" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">İndüksiyon 4–6 ay</text><text x="481" y="175" text-anchor="middle" font-size="13" fill="#334155">mFOLFIRINOX · yeniden evrele</text><text x="481" y="193" text-anchor="middle" font-size="13" fill="#334155">Cerrahi · toplam 6 ay</text></g>
<g class="a s4"><rect x="20" y="254" width="290" height="106" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="165" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Lokal ileri</text><text x="165" y="295" text-anchor="middle" font-size="13" fill="#334155">SMA/çölyak &gt;180°</text><text x="165" y="313" text-anchor="middle" font-size="13" fill="#334155">Ven yeniden</text><text x="165" y="331" text-anchor="middle" font-size="13" fill="#334155">yapılandırılamaz</text></g>
<g class="a s5"><path class="ciz" pathLength="1" d="M310 307 L340 307" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="342" y="254" width="278" height="106" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="481" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Sistemik tedavi 4–6 ay</text><text x="481" y="295" text-anchor="middle" font-size="13" fill="#334155">~%20 cerrahiye geçer</text><text x="481" y="313" text-anchor="middle" font-size="13" fill="#334155">Kalanda konsolidasyon RT / ara</text></g>
<g class="a s6"><rect x="20" y="374" width="290" height="72" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="165" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Metastatik</text><text x="165" y="415" text-anchor="middle" font-size="13" fill="#334155">Karaciğer · periton · uzak LN</text></g>
<g class="a s7"><path class="ciz" pathLength="1" d="M310 410 L340 410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="342" y="374" width="278" height="72" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="481" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Moleküler test + ECOG</text><text x="481" y="415" text-anchor="middle" font-size="13" fill="#334155">Rejim seçimi: Şekil 4</text></g>
<g class="a s8"><rect x="20" y="456" width="600" height="34" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="320" y="477" text-anchor="middle" font-size="13" fill="#334155">Biyolojik/koşulsal: CA 19-9 &gt;500 · nod (+) · ECOG ≥2 kararı değiştirir (IAP).</text></g>
</svg>
