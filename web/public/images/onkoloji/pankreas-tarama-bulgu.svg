<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tarama bulgusuna göre izlem aralığı</title>
<desc id="d">CAPS önerilerine göre: bulgu yoksa ya da endişe verici özellik yoksa 12 ay sonra görüntüleme. 3 santimetre ve üzeri kist, kistle birlikte 5-9 milimetre ana kanal, lenfadenopati, iki yılda 5 milimetre ve üzeri büyüme ya da CA 19-9 artışında 6 ay. 5 milimetreden küçük belirsiz katı lezyon, katı lezyonla birlikte 5-9 milimetre ana kanal, kitlesiz darlık ya da 6 milimetre ve üzeri kanalda 3 ay. Belirsiz 5 milimetre ve üzeri katı lezyon, pozitif sitoloji, ana kanal IPMN'de 10 milimetre ve üzeri genişleme ya da darlık ya da nodül, yan dal IPMN'de nodül, altı ayda 5 milimetreden fazla büyüme veya semptomda cerrahi. Yüksek riskli kişide yeni diyabet iki hafta içinde görüntüleme gerektirir.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,16%{opacity:0;transform:translateY(7px)}19%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,16%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,33%{opacity:0;transform:translateY(7px)}36%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,33%{stroke-dashoffset:1}37%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,49%{opacity:0;transform:translateY(7px)}52%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,49%{stroke-dashoffset:1}53%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,66%{opacity:0;transform:translateY(7px)}69%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,66%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="480" fill="#ffffff"/>
<g class="a s0"><rect x="16" y="12" width="410" height="62" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="221" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Normal ya da endişe verici özellik yok</text><text x="221" y="53" text-anchor="middle" font-size="13" fill="#334155">Düşük riskli yan dal kistleri dahil</text><path class="ciz" pathLength="1" d="M426 43 L462 43" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="464" y="12" width="160" height="62" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="544" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">12 ay</text></g>
<g class="a s1"><rect x="16" y="86" width="410" height="98" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="221" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Kist ≥3 cm · kist + kanal 5–9 mm</text><text x="221" y="127" text-anchor="middle" font-size="13" fill="#334155">Lenfadenopati · CA 19-9 artışı</text><text x="221" y="145" text-anchor="middle" font-size="13" fill="#334155">2 yılda ≥5 mm büyüme</text><path class="ciz" pathLength="1" d="M426 135 L462 135" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="464" y="86" width="160" height="98" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="544" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">6 ay</text></g>
<g class="a s2"><rect x="16" y="196" width="410" height="98" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="221" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Belirsiz katı &lt;5 mm</text><text x="221" y="237" text-anchor="middle" font-size="13" fill="#334155">Katı + kanal 5–9 mm</text><text x="221" y="255" text-anchor="middle" font-size="13" fill="#334155">Kitlesiz darlık ya da kanal ≥6 mm</text><path class="ciz" pathLength="1" d="M426 245 L462 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="464" y="196" width="160" height="98" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="544" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">3 ay</text></g>
<g class="a s3"><rect x="16" y="306" width="410" height="112" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="221" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Katı ≥5 mm belirsiz · sitoloji pozitif</text><text x="221" y="347" text-anchor="middle" font-size="13" fill="#334155">Ana kanal IPMN: ≥10 mm, darlık, nodül</text><text x="221" y="365" text-anchor="middle" font-size="13" fill="#334155">Yan dal: nodül, hızlı büyüme (&gt;5 mm/6 ay)</text><text x="221" y="383" text-anchor="middle" font-size="13" fill="#334155">Pankreatit, sarılık, pankreas tipi ağrı</text><path class="ciz" pathLength="1" d="M426 362 L462 362" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="464" y="306" width="160" height="112" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="544" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Cerrahi</text></g>
<g class="a s4"><rect x="16" y="430" width="608" height="40" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="320" y="451" text-anchor="middle" font-size="13" fill="#334155">Yüksek riskli kişide yeni diyabet: 2 hafta içinde EUS/MRCP/BT.</text></g>
</svg>
