<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SMAD4 inaktivasyonu ve TGF-beta yolağı</title>
<desc id="d">TGF-beta reseptörlerinden gelen sinyal SMAD4 proteini aracılığıyla çekirdeğe iletilir. SMAD4 18q kromozomundadır ve pankreas kanserlerinin yaklaşık yüzde 50'sinde inaktiftir: yüzde 30 homozigot delesyon, yüzde 20 intragenik varyant ile ikinci allel kaybı. Aynı yolakta SMAD3, TGFBR1 ve TGFBR2 mutasyonları da bildirilmiştir. İnaktivasyon genellikle yüksek dereceli PanIN ya da invaziv aşamada görülür. İmmünohistokimyasal protein kaybı gen durumuyla güçlü korelasyon gösterir.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,14%{opacity:0;transform:translateY(7px)}17%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,14%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,27%{opacity:0;transform:translateY(7px)}30%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,27%{stroke-dashoffset:1}31%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,41%{opacity:0;transform:translateY(7px)}44%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,41%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,55%{opacity:0;transform:translateY(7px)}58%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:s4c}@keyframes s4c{0%,55%{stroke-dashoffset:1}59%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(7px)}71%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:s5c}@keyframes s5c{0%,68%{stroke-dashoffset:1}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="450" fill="#ffffff"/>
<g class="a s0"><rect x="120" y="12" width="400" height="56" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="320" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">TGF-β reseptörleri (TGFBR1/2)</text></g>
<g class="a s1"><path class="ciz" pathLength="1" d="M320 68 L320 92" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="120" y="94" width="400" height="56" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="320" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">SMAD ileti (SMAD3) + SMAD4 (18q)</text></g>
<g class="a s2"><path class="ciz" pathLength="1" d="M320 150 L320 174" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="120" y="176" width="400" height="56" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="320" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Çekirdek: hedef gen düzenlenmesi</text></g>
<g class="a s3"><path class="ciz" pathLength="1" d="M200 232 L130 262" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><path class="ciz" pathLength="1" d="M440 232 L510 262" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="16" y="264" width="296" height="88" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="164" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Homozigot delesyon</text><text x="164" y="305" text-anchor="middle" font-size="13" fill="#334155">Tümörlerin yaklaşık %30'u</text></g>
<g class="a s4"><rect x="328" y="264" width="296" height="88" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="476" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">İntragenik varyant + allel kaybı</text><text x="476" y="305" text-anchor="middle" font-size="13" fill="#334155">Tümörlerin yaklaşık %20'si</text></g>
<g class="a s5"><rect x="16" y="366" width="608" height="74" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="320" y="387" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Saptama</text><text x="320" y="407" text-anchor="middle" font-size="13" fill="#334155">İHK ile protein kaybı gen durumuyla güçlü korele; yüksek derece PanIN/invaziv olay</text></g>
</svg>
