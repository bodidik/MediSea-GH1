<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SMAD4 için kanıt ve karar sınırı</title>
<desc id="d">Bilinen: Otopsi serisinde 76 hastanın yüzde 30'u lokal yıkıcı, yüzde 70'i yaygın metastatik hastalıkla ölmüştür ve Dpc4 durumu yaygın metastazla ilişkilidir. UpToDate kaybın bazı uzak metastazların sıklığı ve kötü prognozla ilişkili olduğunu belirtir. Bilinmeyen: nüks paterniyle ilişkiyi araştıran sonraki veriler çelişkilidir ve SMAD4 durumunun tedavi seçtirmesi kanıtlanmamıştır. Pratikte kullanım: patologda tanıya yardımcı immünohistokimya ve bilinmeyen primerde pankreas olasılığı. Radyoterapi ve cerrahi kararları hâlâ sınır durumu, damar teması ve indüksiyon yanıtıyla verilir.</desc>
<style>
.a{animation-duration:13s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.s0{animation-name:s0}@keyframes s0{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.s0 .ciz{animation-name:s0c}@keyframes s0c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.s1{animation-name:s1}@keyframes s1{0%,21%{opacity:0;transform:translateY(7px)}24%,100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:s1c}@keyframes s1c{0%,21%{stroke-dashoffset:1}25%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,41%{opacity:0;transform:translateY(7px)}44%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:s2c}@keyframes s2c{0%,41%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,62%{opacity:0;transform:translateY(7px)}65%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:s3c}@keyframes s3c{0%,62%{stroke-dashoffset:1}66%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a,.a .ciz{animation:none}.ciz{stroke-dasharray:none}}
</style>
<defs><marker id="uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="500" fill="#ffffff"/>
<g class="a s0"><rect x="16" y="12" width="296" height="200" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="164" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Bilinen</text><text x="164" y="53" text-anchor="middle" font-size="13" fill="#334155">Yaklaşık %50 inaktif</text><text x="164" y="71" text-anchor="middle" font-size="13" fill="#334155">Otopsi (76 hasta):</text><text x="164" y="89" text-anchor="middle" font-size="13" fill="#334155">%30 lokal, %70 metastatik</text><text x="164" y="107" text-anchor="middle" font-size="13" fill="#334155">Dpc4 durumu metastazla</text><text x="164" y="125" text-anchor="middle" font-size="13" fill="#334155">ilişkili (P=0,007)</text><text x="164" y="143" text-anchor="middle" font-size="13" fill="#334155">Kayıp: kötü prognoz</text></g>
<g class="a s1"><rect x="328" y="12" width="296" height="200" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/><text x="476" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Bilinmeyen</text><text x="476" y="53" text-anchor="middle" font-size="13" fill="#334155">Nüks paterni ilişkisi</text><text x="476" y="71" text-anchor="middle" font-size="13" fill="#334155">sonraki veride çelişkili</text><text x="476" y="89" text-anchor="middle" font-size="13" fill="#334155">Rejim seçtirdiği</text><text x="476" y="107" text-anchor="middle" font-size="13" fill="#334155">gösterilmedi</text><text x="476" y="125" text-anchor="middle" font-size="13" fill="#334155">Prospektif doğrulama yok</text></g>
<g class="a s2"><path class="ciz" pathLength="1" d="M320 212 L320 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="70" y="242" width="500" height="96" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="320" y="263" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Bugün gerçek kullanım</text><text x="320" y="283" text-anchor="middle" font-size="13" fill="#334155">İHK: zor biyopside tanıya yardımcı</text><text x="320" y="301" text-anchor="middle" font-size="13" fill="#334155">Bilinmeyen primerde pankreas olasılığını düşündürür</text></g>
<g class="a s3"><path class="ciz" pathLength="1" d="M320 338 L320 362" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#uc)"/><rect x="70" y="364" width="500" height="124" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><text x="320" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Tedavi kararı hâlâ ne ile verilir</text><text x="320" y="405" text-anchor="middle" font-size="13" fill="#334155">Evre ve rezektabilite · cerrahi sınır (R0/R1)</text><text x="320" y="423" text-anchor="middle" font-size="13" fill="#334155">Damar teması · indüksiyon yanıtı · performans</text><text x="320" y="441" text-anchor="middle" font-size="13" fill="#334155">SMAD4 yalnız varsayım düzeyinde katkı sağlar</text></g>
</svg>
