<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bebekte glutene başlama: ESPGHAN 2024 ne diyor</title>
<desc id="d">Glutene ne zaman ve nasıl başlanacağı, ailede çölyak riski bilinse de bilinmese de aynı ilkelere dayanır. Anne sütü, ne kadar ya da ne kadar süre verilirse verilsin, çölyak riskini azaltmaz; emzirme önerileri çölyak yüzünden değiştirilmez. Glutene emzirme sürerken başlamak da korumaz. Başlama zamanı: tamamlanmış dördüncü ay ile on ikinci ay arasında herhangi bir zaman; toplam risk değişmez, yalnız erken başlamak otoimmünitenin daha erken görünmesine yol açabilir. Miktar: gözlemsel çalışmalarda ilk iki üç, bazılarında beş yılda yüksek ve doza bağımlı gluten alımı riski artırdı; ama güvenli bir eşik yok, kısıtlamanın koruduğu gösterilmedi, genel topluma miktar önerisi yapılamıyor. Riski bilinen çocukta ilk beş yılda büyük miktarlardan kaçınmak yararlı olabilir. Tahıl ya da gıda türü için öneri yok; annenin gebelik ve emzirmede gluten alımı için de öneri yok. On iki aydan sonraya ertelemenin etkisi araştırılmadı, süren çalışmalar bekleniyor.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
