3a8a">riski azaltmaz</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">süresi fark etmez</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">emzirme önerisi değişmez</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Emzirirken başlamak</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">koruduğu gösterilmedi</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">bu amaçla önerilmez</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">(4 vaka-kontrol aksini ima)</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Zaman: tamamlanmış 4. ay (17. hafta) – 12. ay</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#064e3b">toplam risk değişmez · erken başlamak yalnız öne çekebilir</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Miktar</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">yüksek alım ilk 2–5 yılda</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">doza bağımlı risk</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">güvenli eşik YOK</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Riski bilinen çocuk</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#78350f">ilk 5 yılda büyük</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#78350f">miktarlardan kaçınmak</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#78350f">yararlı olabilir</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="320" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Öneri YOK</text><text x="320" y="634.5" text-anchor="middle" font-size="13" fill="#4c1d95">tahıl ya da gıda türü · annenin gebelik/emzirmede gluten alımı</text><text x="320" y="654.5" text-anchor="middle" font-size="13" fill="#4c1d95">HLA tipine göre ayrı miktar</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Bilinmeyen</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#7f1d1d">12 aydan sonraya ertelemenin etkisi araştırılmadı</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#7f1d1d">PreCiSe ve GRaIn çalışmaları bekleniyor</text></g>
