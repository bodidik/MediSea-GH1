<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 686" width="640" height="686" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Spontan bakteriyel peritonit: parasentezden profilaksiye</title>
<desc id="d">Spontan bakteriyel peritonitte beş adım. Birinci adım, parasentez: asiti olan ve hastaneye acil yatırılan her siroz hastasına, enfeksiyon belirtisi olmasa da tanısal parasentez yapılır; sıvı yatak başında en az 10 mililitre olarak kan kültürü şişelerine ekilir, kan kültürü de alınır, hepsi antibiyotikten önce. İkinci adım, tanı: asit sıvısında nötrofil sayısı milimetreküpte 250'nin üstündeyse spontan bakteriyel peritonit tanısı konur, kültür sonucu beklenmez; plevral sıvıda kültür pozitif ve nötrofil 250'nin üstünde ya da kültür negatif ve nötrofil 500'ün üstündeyse spontan bakteriyel ampiyem; kültürde birden çok mikrop, çok yüksek nötrofil ya da protein sekonder peritoniti düşündürür. Üçüncü adım, ampirik antibiyotik ve albümin: toplum kaynaklı enfeksiyonda üçüncü kuşak sefalosporin; hastane kaynaklı enfeksiyonda, sepsiste ya da yakın zamanda geniş spektrumlu antibiyotik almış hastada daha geniş spektrum; birinci gün kilogram başına 1,5 gram, üçüncü gün kilogram başına 1 gram damar içi albümin. Dördüncü adım, 48. saatte kontrol parasentezi: nötrofil sayısı başlangıca göre yüzde 25'ten az düşmüşse yanıt yoktur, antibiyotik spektrumu genişletilir ve sekonder peritonit için görüntüleme yapılır; tedavi süresi 5 ile 7 gündür ve kültür sonucuna göre daraltılır. Beşinci adım, profilaksi: spontan bakteriyel peritonit geçiren hastaya günde 400 miligram norfloksasin ile sekonder profilaksi; asit proteini desilitrede 1,5 gramın altında ve ileri karaciğer ya da böbrek yetmezliği olan hastada primer profilaksi; gastrointestinal kanamada günde 1 gram seftriakson.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,34%{opacity:0;transform:translateY(8px)}37%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,34%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,51%{opacity:0;transform:translateY(8px)}54%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,51%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(8px)}71%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,68%{stroke-dashoffset:1}73%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="686" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,130 L320,152" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,264 L320,286" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,398 L320,420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,532 L320,554" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="20" width="560" height="110" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="320" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">1 · Parasentez</text><text x="320" y="72" text-anchor="middle" font-size="12" fill="#0c4a6e">Acil yatan her asitli sirozluda, belirti olmasa da</text><text x="320" y="94" text-anchor="middle" font-size="12" fill="#0c4a6e">Yatakta ≥10 mL kan kültürü şişesine + kan kültürü</text><text x="320" y="116" text-anchor="middle" font-size="12" fill="#0c4a6e">Antibiyotikten ÖNCE</text></g>
<g class="a m s2"><rect x="40" y="154" width="560" height="110" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">2 · Tanı</text><text x="320" y="206" text-anchor="middle" font-size="12" fill="#0f172a">Asit nötrofili &gt;250/mm³ = SBP (kültür beklenmez)</text><text x="320" y="228" text-anchor="middle" font-size="12" fill="#0f172a">Plevrada: kültür + ve &gt;250 ya da kültür − ve &gt;500</text><text x="320" y="250" text-anchor="middle" font-size="12" fill="#0f172a">Çok mikrop, çok yüksek nötrofil/protein: sekonder?</text></g>
<g class="a m s3"><rect x="40" y="288" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">3 · Ampirik antibiyotik + albümin</text><text x="320" y="340" text-anchor="middle" font-size="12" fill="#064e3b">Toplum kaynaklı: 3. kuşak sefalosporin</text><text x="320" y="362" text-anchor="middle" font-size="12" fill="#064e3b">Nozokomiyal, sepsis, yakın geniş spektrum: daha geniş</text><text x="320" y="384" text-anchor="middle" font-size="12" fill="#064e3b">Albümin 1,5 g/kg (1. gün) + 1 g/kg (3. gün)</text></g>
<g class="a m s4"><rect x="40" y="422" width="560" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="450" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · 48. saat parasentez</text><text x="320" y="474" text-anchor="middle" font-size="12" fill="#78350f">Nötrofil düşüşü &lt;%25 = yanıtsızlık</text><text x="320" y="496" text-anchor="middle" font-size="12" fill="#78350f">Spektrumu genişlet, sekonder peritonit için görüntüle</text><text x="320" y="518" text-anchor="middle" font-size="12" fill="#78350f">Süre 5–7 gün; kültüre göre daralt</text></g>
<g class="a m s5"><rect x="40" y="556" width="560" height="110" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="320" y="584" text-anchor="middle" font-size="15" font-weight="800" fill="#881337">5 · Profilaksi</text><text x="320" y="608" text-anchor="middle" font-size="12" fill="#881337">SBP geçiren: norfloksasin 400 mg/gün (sekonder)</text><text x="320" y="630" text-anchor="middle" font-size="12" fill="#881337">Asit proteini &lt;1,5 g/dL + ileri yetmezlik: primer</text><text x="320" y="652" text-anchor="middle" font-size="12" fill="#881337">GİS kanamada seftriakson 1 g/gün</text></g>
</svg>
