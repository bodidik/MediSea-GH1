<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Çölyak serolojisi: hangi test, ne zaman</title>
<desc id="d">Çölyak şüphesinde ilk test, her yaşta, gluten içeren diyet sürerken tek başına doku transglutaminaz IgA antikorudur; aynı anda total IgA ölçülür. Total IgA 7 miligram desilitrenin altındaysa IgA testi geçersizdir; IgG temelli testler, doku transglutaminaz IgG ya da deamide gliadin peptid IgG kullanılır ve negatif sonuç tanıyı dışlamaz; malabsorpsiyon varsa biyopsi yapılır. IgA yeterliyse ve doku transglutaminaz IgA pozitifse erişkinde genellikle duodenum biyopsisi yapılır. ESsCD 2025, normalin on katı ve üzerindeki değeri ikinci kan örneğinde doğrulanan, 45 yaşından genç, alarm bulgusu olmayan erişkinde biyopsisiz tanıyı seçenek olarak sunar. Çocukta biyopsisiz tanı için normalin on katı üzerindeki değer, ayrı bir kan örneğinde pozitif endomisyum antikoruyla desteklenir. Endomisyum antikoru en özgül testtir ama emek ister; belirsiz durumlarda, özellikle otoimmün ya da karaciğer hastalığı olanda kullanılır. Doğal gliadin antikoru artık önerilmez. Rutin test kombinasyonu, tükürük ve dışkı testleri önerilmez; hasta başı test pozitifse laboratuvarla doğrulanır. HLA DQ2 ve DQ8 testi rutin değildir; negatifse çölyağı fiilen dışlar, pozitifliği tanı koydurmaz.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
