<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Refrakter çölyak: şüpheden alt tipe ve tedaviye</title>
<desc id="d">Glutensiz diyete rağmen en az 12 ay süren belirti ve villus atrofisi refrakter çölyak şüphesi doğurur. Önce ilk tanı yeniden doğrulanır; süren belirtilerin yüzde 80'e varan kısmı bilerek ya da bilmeden gluten alımıdır, uzman diyetisyen değerlendirir. Diyet uyumu doğrulanınca eşlik eden hastalıklar dışlanır: mikroskopik kolit, pankreas yetmezliği, bakteri aşırı çoğalması, otoimmün enteropati, kollajenöz sprue. Tanı zorunlu olarak açık lenfomanın dışlanmasını içerir: kapsül endoskopi, cihaz destekli enteroskopi, kesitsel görüntüleme ve PET. Epitel içi lenfositlerin akım sitometrisi ve T hücre reseptörü klonalite analizi iki alt tipi ayırır. Tip 1'de lenfosit fenotipi normaldir; ilk seçenek açık kapsül budesoniddir, seçilmiş hastada tiyopürin eklenir; beş yıllık sağkalım yüzde 90'ın üzerindedir. Tip 2'de yüzey CD3 ve CD8 kaybı olan aberran lenfosit genellikle yüzde 20 ve üzerindedir; seçenekler açık kapsül budesonid, kladribin, otolog kök hücre nakli ya da JAK inhibitörüdür; azatiyoprin önerilmez. Tip 2 hastaların yarısına varan kısmında enteropatiyle ilişkili T hücreli lenfoma gelişir; beş yıllık sağkalım yüzde 44 ile 58 arasındadır, lenfomada ortanca sağkalım bir yılın altındadır.</desc>
