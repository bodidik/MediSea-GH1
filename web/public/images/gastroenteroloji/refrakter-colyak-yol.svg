<g class="a s2"><path class="a ciz" pathLength="1" d="M260,96 L165,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M380,96 L477,132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M162,266 L240,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M477,266 L400,296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s5"><path class="a ciz" pathLength="1" d="M240,376 L165,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s6"><path class="a ciz" pathLength="1" d="M400,376 L477,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M162,540 L220,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s7"><path class="a ciz" pathLength="1" d="M477,540 L420,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s8"><path class="a ciz" pathLength="1" d="M320,684 L320,714" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="90" y="20" width="460" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="53.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">≥12 ay katı GFD'ye rağmen</text><text x="320" y="73.5" text-anchor="middle" font-size="13" fill="#0f172a">belirti + villus atrofisi sürüyor ya da yineliyor</text></g><g class="a m s2"><rect x="15" y="136" width="295" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="162.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">1. Tanıyı doğrula</text><text x="162.5" y="196.5" text-anchor="middle" font-size="13" fill="#1e3a8a">ilk biyopsi ve seroloji</text><text x="162.5" y="216.5" text-anchor="middle" font-size="13" fill="#1e3a8a">HLA-DQ2/DQ8</text><text x="162.5" y="236.5" text-anchor="middle" font-size="13" fill="#1e3a8a">yanlış tanı olabilir</text></g><g class="a m s3"><rect x="330" y="136" width="295" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="477.5" y="176.5" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">2. Gluten maruziyeti</text><text x="477.5" y="196.5" text-anchor="middle" font-size="13" fill="#78350f">süren belirtilerin %80'e varanı</text><text x="477.5" y="216.5" text-anchor="middle" font-size="13" fill="#78350f">uzman diyetisyen</text><text x="477.5" y="236.5" text-anchor="middle" font-size="13" fill="#78350f">seroloji, gerekirse GIP</text></g><g class="a m s4"><rect x="90" y="300" width="460" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="333.5" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">3. Eşlik eden nedenleri dışla</text><text x="320" y="353.5" text-anchor="middle" font-size="13" fill="#1e3a8a">mikroskopik kolit · EPY · SIBO · otoimmün enteropati</text></g><g class="a m s5"><rect x="15" y="410" width="295" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="162.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">4. Açık lenfomayı dışla</text><text x="162.5" y="470.5" text-anchor="middle" font-size="13" fill="#7f1d1d">kapsül + enteroskopi</text><text x="162.5" y="490.5" text-anchor="middle" font-size="13" fill="#7f1d1d">BT/MR enterografi</text><text x="162.5" y="510.5" text-anchor="middle" font-size="13" fill="#7f1d1d">PET</text></g><g class="a m s6"><rect x="330" y="410" width="295" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="477.5" y="450.5" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">5. Alt tip</text><text x="477.5" y="470.5" text-anchor="middle" font-size="13" fill="#4c1d95">IEL akım sitometrisi</text><text x="477.5" y="490.5" text-anchor="middle" font-size="13" fill="#4c1d95">TCR klonalitesi</text><text x="477.5" y="510.5" text-anchor="middle" font-size="13" fill="#4c1d95">JAK1/STAT3 dizileme</text></g><g class="a m s7"><rect x="40" y="574" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="614.5" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">RCD-I: fenotip normal, poliklonal</text><text x="320" y="634.5" text-anchor="middle" font-size="13" fill="#064e3b">açık kapsül budesonid 9 → 6 → 3 mg</text><text x="320" y="654.5" text-anchor="middle" font-size="13" fill="#064e3b">seçilmiş hastada tiyopürin · 5 yıl sağkalım &gt;%90</text></g><g class="a m s8"><rect x="40" y="718" width="560" height="92" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="749.5" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">RCD-II: sCD3−/CD8− aberran IEL ≥%20, klonal</text><text x="320" y="769.5" text-anchor="middle" font-size="13" fill="#7f1d1d">budesonid · kladribin ± oto-HSCT · JAK inh. · azatiyoprin YOK</text><text x="320" y="789.5" text-anchor="middle" font-size="13" fill="#7f1d1d">EATL yarısına varan kısmında · 5 yıl sağkalım %44–58</text></g>
