<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Glutensiz diyete rağmen yakınması süren hasta</title>
<desc id="d">Glutensiz diyete rağmen belirtileri süren hastada önce ilk tanının doğruluğu gözden geçirilir. Ardından en sık neden olan bilinçsiz gluten maruziyeti diyetisyenle araştırılır. Diyet uyumu doğrulanırsa duodenum histolojisi tekrarlanır ve laktoz intoleransı, irritabl bağırsak, ince bağırsakta bakteri aşırı çoğalması, mikroskopik kolit ve pankreas yetmezliği gibi eşlik eden durumlar aranır. Villus atrofisi strict diyete rağmen sürüyorsa refrakter çölyak düşünülür ve epitel içi lenfositlerin akım sitometrisi ile tip 1 ve tip 2 ayrılır.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="478" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">1. Tanı doğru muydu?</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Seroloji, histoloji, HLA</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">ilk değerlendirmeyi yeniden gözden geçir</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="620" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="138.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">2. Gluten maruziyeti</text><text x="320" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">En sık neden · diyetisyen</text><text x="320" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">değerlendirmesi, seroloji</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">3. Uyum tamsa</text><text x="160" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">Tekrar duodenum biyopsisi</text><text x="160" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">eşlik eden durumları ara</text><rect x="330" y="214" width="300" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="480" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#0c4a6e">Eşlik edenler</text><text x="480" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">Laktoz, IBS, SIBO,</text><text x="480" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0c4a6e">mikroskopik kolit, EPY</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="620" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="342.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">4. Atrofi sürüyorsa: refrakter çölyak</text><text x="320" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">Epitel içi lenfosit akım sitometrisi · TCR klonalite</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">tip 1: budesonid · tip 2: lenfoma riski</text></g>
<g class="a o5"><text x="320" y="426" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">Refrakter çölyak nadirdir; tanı konmadan önce gluten maruziyeti dışlanmalı</text><text x="320" y="454" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: ESsCD 2025 Bölüm 2 · ACG 2023</text></g>
</svg>
