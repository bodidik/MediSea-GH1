<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Karaciğer hastalığına yaklaşım: enzim paterni, akut yetmezlik, siroz</title>
<desc id="d">Karaciğer hastalığı sıklıkla sessiz gelir: taramada ya da ilaç izleminde enzim anormalliği, görüntülemede beklenmeyen bulgu. Enzim paterni: hepatitte AST ve ALT belirgin (normalin 5 katından fazla), GGT ve ALP hafif; kolestazda ALP belirgin, GGT orta, transaminazlar hafif; yağlanmada transaminaz normal ya da hafif, GGT orta, ALP normal; enzim indükleyici ilaçlarda yalnız GGT orta. Akut karaciğer yetmezliği sarılıktan ensefalopatiye geçen süreye göre: hiperakut 7 gün altı (beyin ödemi sık; parasetamol, viral), akut 8–28 gün (beyin ödemi sık; kriptojenik, ilaç, viral), subakut 29 gün–12 hafta (beyin ödemi seyrek; kriptojenik, ilaç, otoimmün hepatit; sonuç daha kötü). Dünyada en sık neden akut viral hepatit, Birleşik Krallık'ta parasetamol. Siroz: kompanse ortanca sağkalım 12 yıldan uzun; dekompanse (asit, varis kanaması, sarılık, ensefalopati) ortanca yaklaşık 2 yıl; Child-Pugh 12 ve üstü ya da MELD 21 ve üstünde ortanca sağkalım 6 ay ya da altı.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a m s1"><rect x="40" y="14" width="560" height="78" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Sıklıkla sessiz başvuru</text><text x="320" y="66" text-anchor="middle" font-size="12" fill="#334155">Taramada/ilaç izleminde enzim anormalliği · görüntülemede beklenmeyen bulgu</text></g>
<g class="a m s2"><rect x="40" y="108" width="560" height="200" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Enzim paterni</text><text x="70" y="164" font-size="12" font-weight="800" fill="#1e3a8a">Patern</text><text x="260" y="164" font-size="12" font-weight="800" fill="#1e3a8a">AST/ALT</text><text x="380" y="164" font-size="12" font-weight="800" fill="#1e3a8a">GGT</text><text x="480" y="164" font-size="12" font-weight="800" fill="#1e3a8a">ALP</text><text x="70" y="192" font-size="12" fill="#1e3a8a">Hepatit</text><text x="260" y="192" font-size="12" fill="#1e3a8a">↑↑↑</text><text x="380" y="192" font-size="12" fill="#1e3a8a">↑</text><text x="480" y="192" font-size="12" fill="#1e3a8a">↑</text><text x="70" y="216" font-size="12" fill="#1e3a8a">Kolestaz</text><text x="260" y="216" font-size="12" fill="#1e3a8a">↑</text><text x="380" y="216" font-size="12" fill="#1e3a8a">↑↑</text><text x="480" y="216" font-size="12" fill="#1e3a8a">↑↑↑</text><text x="70" y="240" font-size="12" fill="#1e3a8a">Yağlanma</text><text x="260" y="240" font-size="12" fill="#1e3a8a">N/↑</text><text x="380" y="240" font-size="12" fill="#1e3a8a">↑↑</text><text x="480" y="240" font-size="12" fill="#1e3a8a">N</text><text x="70" y="264" font-size="12" fill="#1e3a8a">Enzim indükleyici ilaç</text><text x="260" y="264" font-size="12" fill="#1e3a8a">N</text><text x="380" y="264" font-size="12" fill="#1e3a8a">↑↑</text><text x="480" y="264" font-size="12" fill="#1e3a8a">N</text><text x="320" y="292" text-anchor="middle" font-size="11" fill="#1e3a8a">↑ &lt;2 kat · ↑↑ 2–5 kat · ↑↑↑ &gt;5 kat</text></g>
<g class="a m s3"><rect x="40" y="324" width="560" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="352" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Akut karaciğer yetmezliği: sarılık → ensefalopati</text><text x="70" y="384" font-size="12" font-weight="700" fill="#7f1d1d">Hiperakut &lt;7 gün</text><text x="300" y="384" font-size="12" fill="#7f1d1d">Beyin ödemi sık · parasetamol, viral</text><text x="70" y="410" font-size="12" font-weight="700" fill="#7f1d1d">Akut 8–28 gün</text><text x="300" y="410" font-size="12" fill="#7f1d1d">Beyin ödemi sık · kriptojenik, ilaç, viral</text><text x="70" y="436" font-size="12" font-weight="700" fill="#7f1d1d">Subakut 29 gün–12 hf</text><text x="300" y="436" font-size="12" fill="#7f1d1d">Beyin ödemi seyrek · ilaç, otoimmün</text><text x="320" y="468" text-anchor="middle" font-size="12" fill="#7f1d1d">Subakut: ilaca bağlı ya da nedeni belirsiz olma olasılığı yüksek, sonuç kötü</text><text x="320" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">En sık neden: dünyada akut viral hepatit · BK'de parasetamol</text></g>
<g class="a m s4"><rect x="40" y="540" width="560" height="206" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="568" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Siroz: kompanse mi, dekompanse mi?</text><text x="320" y="596" text-anchor="middle" font-size="12" fill="#78350f">Kompanse: ortanca sağkalım &gt;12 yıl</text><text x="320" y="618" text-anchor="middle" font-size="12" fill="#78350f">Varis var ama kanamamış: 1 yıllık ölüm %3,4 (varissiz %1,0)</text><text x="320" y="646" text-anchor="middle" font-size="12" fill="#78350f">Dekompanse (asit, varis kanaması, sarılık, ensefalopati):</text><text x="320" y="666" text-anchor="middle" font-size="12" fill="#78350f">ortanca sağkalım ~2 yıl</text><text x="320" y="694" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Child-Pugh ≥12 ya da MELD ≥21 → ortanca ≤6 ay</text><text x="320" y="722" text-anchor="middle" font-size="11" fill="#78350f">Prognoz skorları: Child-Pugh, MELD (siroz) · Glasgow (alkolik hepatit) · King's College (ALF)</text></g>
</svg>
