<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Çölyak: glutenden villus atrofisine</title>
<desc id="d">Gluten sindirilince geriye sindirilemeyen gliadin peptitleri kalır. Doku transglutaminazı (TG2) bu peptitleri deamide eder ve HLA-DQ2 ya da DQ8 molekülüne çok daha sıkı bağlanır hale getirir. Antijen sunan hücreler bu peptitleri gluten-spesifik CD4 T hücrelerine sunar; bu hücreler inflamatuvar sitokinler salgılar ve B hücrelerinden TG2’ye karşı antikor yapımını destekler. Epitel içi lenfositler IL-15 etkisiyle sitotoksik hale gelir ve epitel hücrelerini öldürür. Sonuçta kript hiperplazisi ve villus atrofisi gelişir. Gluten diyetten çıkarılınca bu süreç durur.</desc>
<!-- 18 sn, tek seferlik; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. Üretici: sarkoidoz sema.py -->
<style>
.a{animation-duration:18s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.ciz{stroke-dasharray:1}
.o1{animation-name:o1}@keyframes o1{0%,0%{opacity:0;transform:translateY(7px)}3%,100%{opacity:1;transform:none}}
.o1 .ciz{animation-name:o1c}@keyframes o1c{0%,0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.o2{animation-name:o2}@keyframes o2{0%,18%{opacity:0;transform:translateY(7px)}21%,100%{opacity:1;transform:none}}
.o2 .ciz{animation-name:o2c}@keyframes o2c{0%,18%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.o3{animation-name:o3}@keyframes o3{0%,35%{opacity:0;transform:translateY(7px)}38%,100%{opacity:1;transform:none}}
.o3 .ciz{animation-name:o3c}@keyframes o3c{0%,35%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.o4{animation-name:o4}@keyframes o4{0%,53%{opacity:0;transform:translateY(7px)}56%,100%{opacity:1;transform:none}}
.o4 .ciz{animation-name:o4c}@keyframes o4c{0%,53%{stroke-dashoffset:1}57%,100%{stroke-dashoffset:0}}
.o5{animation-name:o5}@keyframes o5{0%,70%{opacity:0;transform:translateY(7px)}73%,100%{opacity:1;transform:none}}
.o5 .ciz{animation-name:o5c}@keyframes o5c{0%,70%{stroke-dashoffset:1}74%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs>
<marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="478" fill="#ffffff"/>
<g class="a o1"><rect x="10" y="10" width="620" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="320" y="36.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">Gluten</text><text x="320" y="56.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">Gliadin peptitleri sindirilmeden</text><text x="320" y="73.00" font-size="11" font-weight="500" text-anchor="middle" fill="#0f172a">lamina propriaya ulaşır</text></g>
<g class="a o2"><path class="ciz" pathLength="1" d="M320,94 L320,109" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="112" width="620" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="320" y="138.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#78350f">Doku transglutaminazı (TG2)</text><text x="320" y="158.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">Peptitleri deamide eder; HLA-DQ2/DQ8’e</text><text x="320" y="175.00" font-size="11" font-weight="500" text-anchor="middle" fill="#78350f">bağlanma gücünü artırır</text></g>
<g class="a o3"><path class="ciz" pathLength="1" d="M320,196 L320,211" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="214" width="300" height="76" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6"/><text x="160" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#1e3a8a">CD4 T hücre yanıtı</text><text x="160" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">IFN-γ, IL-21 · B hücresinden</text><text x="160" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#1e3a8a">anti-TG2 antikoru (serolojinin temeli)</text><rect x="330" y="214" width="300" height="76" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="480" y="240.00" font-size="13" font-weight="800" text-anchor="middle" fill="#581c87">Epitel içi lenfositler</text><text x="480" y="260.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">IL-15 ile sitotoksik olur,</text><text x="480" y="277.00" font-size="11" font-weight="500" text-anchor="middle" fill="#581c87">epitel hücresini öldürür</text></g>
<g class="a o4"><path class="ciz" pathLength="1" d="M320,298 L320,313" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#ok)"/><rect x="10" y="316" width="620" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="320" y="342.00" font-size="13.5" font-weight="800" text-anchor="middle" fill="#7f1d1d">Mukoza hasarı</text><text x="320" y="362.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">Lenfositoz → kript hiperplazisi → villus atrofisi</text><text x="320" y="379.00" font-size="11" font-weight="500" text-anchor="middle" fill="#7f1d1d">(Marsh I → II → III)</text></g>
<g class="a o5"><text x="320" y="426" font-size="11.5" font-weight="800" text-anchor="middle" fill="#0f172a">HLA-DQ2/DQ8 gerekli ama yeterli değil: toplumun ~%35’i taşır, bunların ~%3’ü hastalanır</text><text x="320" y="454" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">Kaynak: Marafini 2026 · ESsCD 2025</text></g>
</svg>
