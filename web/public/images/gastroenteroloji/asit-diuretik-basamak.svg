<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sirotik asitte diüretik basamakları</title>
<desc id="d">Sodyum kısıtlaması ve spironolakton 100 artı furosemid 40 mg ile başlanır, 400 ve 160 mg'a çıkılır; kilo kaybı hedefi ödem yoksa 0,5, varsa 1 kg/gün; yanıt yoksa veya yan etki varsa refrakter asit.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="500" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="140" y="16" width="360" height="80" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="40" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Orta-büyük asit</text><text x="320" y="58" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Sodyum kısıtlaması</text><text x="320" y="76" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">AASLD 2 g/gün · EASL 80–120 mmol</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="96" x2="320" y2="128" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="140" y="130" width="360" height="80" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="320" y="154" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Başla: 100 mg / 40 mg</text><text x="320" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Spironolakton + furosemid</text><text x="320" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Oran korunarak artır</text></g><g class="a" style="animation-delay:4.80s"><line x1="320" y1="210" x2="320" y2="242" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="140" y="244" width="360" height="80" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Hedef kilo kaybı</text><text x="320" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Ödem yok: ≤0,5 kg/gün</text><text x="320" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Ödem var: ≤1 kg/gün</text></g><g class="a" style="animation-delay:7.20s"><line x1="250" y1="324" x2="160" y2="364" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="12" y="366" width="296" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="160" y="390" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Yanıt var</text><text x="160" y="408" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">En düşük etkili dozda sürdür</text><text x="160" y="426" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Kilo, kreatinin, sodyum izle</text></g><g class="a" style="animation-delay:9.60s"><line x1="390" y1="324" x2="480" y2="364" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="332" y="366" width="296" height="112" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="480" y="390" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">400 / 160 mg'da yanıt yok</text><text x="480" y="408" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">ya da yan etki doz artırımını</text><text x="480" y="426" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">engelliyor</text><text x="480" y="444" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">→ Refrakter asit</text></g>
</svg>
