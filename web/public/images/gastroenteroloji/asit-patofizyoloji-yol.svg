<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 686" width="640" height="686" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sirotik asit: portal hipertansiyondan böbrek vazokonstriksiyonuna</title>
<desc id="d">Sirotik asidin oluşumunda beş halka. Birinci halka, sinüzoidal portal hipertansiyon: portal hipertansiyonu olmayan siroz hastasında asit ve ödem gelişmez; sıvı tutulumu için portal basıncın 10 milimetre cıva ya da üstünde olması gerekir; portal ven trombozu gibi sinüzoid öncesi portal hipertansiyon başka bir etken olmadan asit yapmaz. İkinci halka, splanknik arteriyel vazodilatasyon: başlıca aracı nitrik oksittir; bağırsaktan gelen endotoksin ve bakteriyel DNA nitrik oksit sentezini uyarır; sistemik damar direnci ve ortalama arter basıncı düşer, kalp debisi artar ve dolaşım hiperdinamik olur. Üçüncü halka, nörohümoral aktivasyon: karotis ve böbrek baroreseptörlerindeki basınç düşüşü renin anjiyotensin aldosteron sistemini, sempatik sinir sistemini ve antidiüretik hormonu harekete geçirir; bu hormonların salgısı hemodinamik bozukluğun ağırlığıyla orantılıdır. Dördüncü halka, sodyum ve su tutulumu: ileri hastalıkta idrarla sodyum atılımı günde 10 miliekivalanın altına iner; antidiüretik hormon serbest suyu tutar ve dilüsyonel hiponatremi gelişir; toplam vücut sodyumu artmıştır, eksik değildir. Beşinci halka, böbrek vazokonstriksiyonu: başlangıçta prostaglandinler glomerüler filtrasyonu korur; hastalık ilerledikçe bu koruma çöker, glomerüler filtrasyon hızı düşer ve kimi hastada hepatorenal sendrom gelişir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,34%{opacity:0;transform:translateY(8px)}37%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,34%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,51%{opacity:0;transform:translateY(8px)}54%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,51%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(8px)}71%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,68%{stroke-dashoffset:1}73%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="686" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,130 L320,152" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,264 L320,286" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,398 L320,420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,532 L320,554" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="20" width="560" height="110" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="320" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">1 · Sinüzoidal portal hipertansiyon</text><text x="320" y="72" text-anchor="middle" font-size="12" fill="#0c4a6e">Portal hipertansiyonsuz sirozda asit ve ödem olmaz</text><text x="320" y="94" text-anchor="middle" font-size="12" fill="#0c4a6e">Sıvı tutulumu için portal basınç ≥10 mmHg</text><text x="320" y="116" text-anchor="middle" font-size="12" fill="#0c4a6e">Presinüzoidal (portal ven trombozu) tek başına asit yapmaz</text></g>
<g class="a m s2"><rect x="40" y="154" width="560" height="110" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">2 · Splanknik arteriyel vazodilatasyon</text><text x="320" y="206" text-anchor="middle" font-size="12" fill="#0f172a">Başlıca aracı nitrik oksit</text><text x="320" y="228" text-anchor="middle" font-size="12" fill="#0f172a">Endotoksin ve bakteriyel DNA sentezini uyarır</text><text x="320" y="250" text-anchor="middle" font-size="12" fill="#0f172a">Sistemik direnç ve OAB düşer, debi artar (hiperdinamik)</text></g>
<g class="a m s3"><rect x="40" y="288" width="560" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">3 · Nörohümoral aktivasyon</text><text x="320" y="340" text-anchor="middle" font-size="12" fill="#78350f">Karotis ve böbrek baroreseptörleri</text><text x="320" y="362" text-anchor="middle" font-size="12" fill="#78350f">Renin-anjiyotensin-aldosteron · sempatik sistem · ADH</text><text x="320" y="384" text-anchor="middle" font-size="12" fill="#78350f">Salgı hemodinamik bozuklukla orantılı</text></g>
<g class="a m s4"><rect x="40" y="422" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="450" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">4 · Sodyum ve su tutulumu</text><text x="320" y="474" text-anchor="middle" font-size="12" fill="#064e3b">İleri hastalıkta idrar sodyumu &lt;10 mEq/gün</text><text x="320" y="496" text-anchor="middle" font-size="12" fill="#064e3b">ADH serbest suyu tutar: dilüsyonel hiponatremi</text><text x="320" y="518" text-anchor="middle" font-size="12" fill="#064e3b">Toplam vücut sodyumu artmıştır, eksik değildir</text></g>
<g class="a m s5"><rect x="40" y="556" width="560" height="110" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="320" y="584" text-anchor="middle" font-size="15" font-weight="800" fill="#881337">5 · Böbrek vazokonstriksiyonu</text><text x="320" y="608" text-anchor="middle" font-size="12" fill="#881337">Önce prostaglandinler GFR'yi korur</text><text x="320" y="630" text-anchor="middle" font-size="12" fill="#881337">Hastalık ilerledikçe koruma çöker</text><text x="320" y="652" text-anchor="middle" font-size="12" fill="#881337">GFR düşer; kimi hastada hepatorenal sendrom</text></g>
</svg>
