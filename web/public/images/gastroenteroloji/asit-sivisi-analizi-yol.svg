<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 796" width="640" height="796" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Asit sıvısı analizi: parasentezden ek testlere</title>
<desc id="d">Asit sıvısı analizinde beş adım. Birinci adım, kime tanısal parasentez yapılır: yeni başlayan asitte, EASL'ye göre evre 2 ya da 3 yeni asitte; sirozlu ve asitli hasta herhangi bir nedenle acil yatırıldığında, enfeksiyon belirtisi olmasa da; ateş, karın ağrısı, ensefalopati ya da gastrointestinal kanama olduğunda; böbrek ya da karaciğer işlevi kötüleştiğinde. İkinci adım, görünüm ve hücre sayımı: hücre sayımı ve ayırıcı sayım her örnekte, pıhtılaşmasın diye EDTA'lı tüpte istenir; düzeltilmiş nötrofil sayısı milimetreküpte 250 ya da üstündeyse antibiyotik başlanır; kanlı örnekte her 250 eritrosit için bir nötrofil çıkarılır; kültür için yatak başında aerobik ve anaerobik kan kültürü şişelerine en az 10 mililitre sıvı ekilir. Üçüncü adım, serum asit albümin gradiyenti: aynı gün alınan serum albümininden asit albümini çıkarılır; desilitrede 1,1 gram ya da üstü yaklaşık yüzde 97 doğrulukla portal hipertansiyonu gösterir; 1,1 gramın altı portal hipertansiyon olmadığını gösterir; ilk ölçümden sonra genellikle tekrarlanması gerekmez. Dördüncü adım, total protein: gradiyent yüksek ve protein desilitrede 2,5 gramın altındaysa siroz, 2,5 gram ya da üstündeyse kalp kaynaklı asit düşünülür; düşük protein spontan bakteriyel peritonit riskini gösterir; sekonder peritonitte protein desilitrede 1 gramın üstündedir. Beşinci adım, şüpheye göre ek testler: glukozun desilitrede 50 miligramın altında ve LDH'nin serum üst sınırının üstünde olması bağırsak perforasyonunu düşündürür; amilazın litrede 1000 ünitenin üstünde olması pankreatik asiti, trigliseridin desilitrede 200 miligramın üstünde olması şilöz asiti gösterir; sitoloji, tüberküloz kültürü ve adenozin deaminaz klinik şüpheye göre istenir.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,17%{stroke-dashoffset:1}22%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,34%{opacity:0;transform:translateY(8px)}37%,100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,34%{stroke-dashoffset:1}39%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,51%{opacity:0;transform:translateY(8px)}54%,100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,51%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
.s5{animation-name:s5}@keyframes s5{0%,68%{opacity:0;transform:translateY(8px)}71%,100%{opacity:1;transform:none}}
.s5 .ciz{animation-name:c5}@keyframes c5{0%,68%{stroke-dashoffset:1}73%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="796" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M320,152 L320,174" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s3"><path class="a ciz" pathLength="1" d="M320,308 L320,330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s4"><path class="a ciz" pathLength="1" d="M320,464 L320,486" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a s5"><path class="a ciz" pathLength="1" d="M320,620 L320,642" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g>
<g class="a m s1"><rect x="40" y="20" width="560" height="132" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="320" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">1 · Kime parasentez?</text><text x="320" y="72" text-anchor="middle" font-size="12" fill="#0c4a6e">Yeni başlayan asit (EASL: evre 2–3)</text><text x="320" y="94" text-anchor="middle" font-size="12" fill="#0c4a6e">Sirozlu asitli hasta acil yatışta, belirti olmasa da</text><text x="320" y="116" text-anchor="middle" font-size="12" fill="#0c4a6e">Ateş, karın ağrısı, ensefalopati, GİS kanama</text><text x="320" y="138" text-anchor="middle" font-size="12" fill="#0c4a6e">Böbrek ya da karaciğer işlevi kötüleşirse</text></g>
<g class="a m s2"><rect x="40" y="176" width="560" height="132" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="320" y="204" text-anchor="middle" font-size="15" font-weight="800" fill="#881337">2 · Görünüm ve hücre sayımı</text><text x="320" y="228" text-anchor="middle" font-size="12" fill="#881337">Her örnekte hücre sayımı (EDTA'lı tüp)</text><text x="320" y="250" text-anchor="middle" font-size="12" fill="#881337">PMN ≥250/mm³: antibiyotik</text><text x="320" y="272" text-anchor="middle" font-size="12" fill="#881337">Kanlı örnekte her 250 eritrosit için 1 PMN düş</text><text x="320" y="294" text-anchor="middle" font-size="12" fill="#881337">Kültür: yatak başında kan kültürü şişesine ≥10 mL</text></g>
<g class="a m s3"><rect x="40" y="332" width="560" height="132" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="360" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">3 · SAAG</text><text x="320" y="384" text-anchor="middle" font-size="12" fill="#0f172a">Serum albümini − asit albümini (aynı gün)</text><text x="320" y="406" text-anchor="middle" font-size="12" fill="#0f172a">≥1,1 g/dL: portal hipertansiyon (≈%97 doğruluk)</text><text x="320" y="428" text-anchor="middle" font-size="12" fill="#0f172a">&lt;1,1 g/dL: portal hipertansiyon yok</text><text x="320" y="450" text-anchor="middle" font-size="12" fill="#0f172a">Bir kez ölçmek genellikle yeter</text></g>
<g class="a m s4"><rect x="40" y="488" width="560" height="132" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="516" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · Total protein</text><text x="320" y="540" text-anchor="middle" font-size="12" fill="#78350f">SAAG yüksek + protein &lt;2,5 g/dL: siroz</text><text x="320" y="562" text-anchor="middle" font-size="12" fill="#78350f">SAAG yüksek + protein ≥2,5 g/dL: kalp</text><text x="320" y="584" text-anchor="middle" font-size="12" fill="#78350f">Düşük protein SBP riskini gösterir</text><text x="320" y="606" text-anchor="middle" font-size="12" fill="#78350f">Sekonder peritonitte protein &gt;1 g/dL</text></g>
<g class="a m s5"><rect x="40" y="644" width="560" height="132" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="672" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">5 · Şüpheye göre ek testler</text><text x="320" y="696" text-anchor="middle" font-size="12" fill="#064e3b">Glukoz &lt;50 + LDH &gt; serum üst sınırı: perforasyon?</text><text x="320" y="718" text-anchor="middle" font-size="12" fill="#064e3b">Amilaz &gt;1000 U/L: pankreatik asit</text><text x="320" y="740" text-anchor="middle" font-size="12" fill="#064e3b">Trigliserit &gt;200 mg/dL: şilöz asit</text><text x="320" y="762" text-anchor="middle" font-size="12" fill="#064e3b">Sitoloji · tüberküloz kültürü · ADA</text></g>
</svg>
