iddle" font-size="12.5" font-weight="400" fill="#78350f">Uyum 2 yılda</text><rect x="434" y="102" width="196" height="150" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="532" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Tip 3</text><text x="532" y="164" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Jejunoileokolik</text><text x="532" y="182" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">İÇV ve tüm kolon var</text><text x="532" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">En iyi ama en seyrek</text><text x="532" y="218" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Uyum 3 yılda</text></g><g class="a" style="animation-delay:4.80s"><rect x="10" y="272" width="196" height="92" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="108" y="305" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">PN'den ayrılma ~%20</text><text x="108" y="323" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Olasılık yüksek:</text><text x="108" y="341" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">&gt;100 cm</text><rect x="222" y="272" width="196" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="305" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">PN'den ayrılma ~%40</text><text x="320" y="323" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Olasılık yüksek:</text><text x="320" y="341" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">&gt;65 cm + kolonun &gt;%50'si</text><rect x="434" y="272" width="196" height="92" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="532" y="305" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">PN'den ayrılma ~%80</text><text x="532" y="323" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Olasılık yüksek:</text><text x="532" y="341" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">&gt;30 cm</text></g><g class="a" style="animation-delay:7.20s"><rect x="10" y="384" width="620" height="92" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="417" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Kolonun katkısı</text><text x="320" y="435" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Günde 6 L'ye kadar sıvı · enerjinin %50'sine kadar</text><text x="320" y="453" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Kolonun yarısı ≈ 50 cm ince bağırsak</text></g><g class="a" style="animation-delay:9.60s"><line x1="320" y1="476" x2="320" y2="500" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="10" y="502" width="620" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="320" y="532" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Son rezeksiyondan 2 yıl sonra</text><text x="320" y="550" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">Kendiliğinden ayrılma olasılığı &lt;%6</text><text x="320" y="568" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">→ GLP-2 analoğu · otolog rekonstrüksiyon · nakil</text><text x="320" y="586" text-anchor="middle" font-size="12.5" font-weight="400" fill="#334155">ESPEN 2023 · UpToDate</text></g>
