<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Kısa bağırsak sendromu: anatomik tip ve PN'den ayrılma</title>
<desc id="d">Kısa bağırsak sendromunda kalan anatomi prognozu belirler. Tip 1 uç jejunostomi: ileum ve kolon yok, sodyum ve su kaybeden net salgılayıcı olabilir, uyum bir yılda tamamlanır ve zayıftır, yalnız uyum ve klasik tedaviyle PN'den ayrılma yaklaşık yüzde 20, olasılık 100 santimetrenin üstünde yüksek. Tip 2 jejunokolik anastomoz: ileum ve ileoçekal valv yok, kolonun bir kısmı var, uyum iki yılda, ayrılma yaklaşık yüzde 40, 65 santimetrenin üstü ve kolonun yarısından fazlası varsa olasılık yüksek. Tip 3 jejunoileokolik anastomoz: ileoçekal valv ve kolonun tamamı korunmuş, en iyi prognoz ama en seyrek tip, uyum üç yılda, ayrılma yaklaşık yüzde 80, 30 santimetrenin üstünde olasılık yüksek. Kolon günde 6 litreye kadar sıvı ve kompleks karbonhidrat diyetinde enerjinin yarısına kadarını geri kazanır; kolonun yarısı yaklaşık 50 santimetre ince bağırsağa eşdeğerdir. Son rezeksiyondan iki yıl sonra PN'den ayrılma olasılığı yüzde 6'nın altındadır; o noktada büyüme faktörü, otolog rekonstrüksiyon ya da nakil gündeme gelir.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
