<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" width="640" height="670" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Motilite bozukluklarında belirtiden teste</title>
<desc id="d">Gastrointestinal motilite bozukluklarında belirtiden teste yol. Mekanik tıkanıklık önce dışlanır: endoskopi ve gerekirse görüntüleme. Yutma güçlüğünde, endoskopi tıkanıklık göstermezse yüksek çözünürlüklü manometri yapılır; Chicago 4.0 altı bozukluk tanımlar: akalazya (tip I, II, III), özofagogastrik bileşke çıkış obstrüksiyonu, kontraktilite yokluğu, etkisiz özofagus motilitesi, distal özofagus spazmı ve hiperkontraktil özofagus. Akalazyada kesin tedavi alt özofagus sfinkterini açmaktır: balon dilatasyonu, Heller miyotomisi ya da POEM; tip III'te POEM. Bulantı, kusma ve erken doymada mide boşalması ölçülür: dört saatlik katı öğün sintigrafisinde ikinci saatte yüzde altmıştan, dördüncü saatte yüzde ondan fazla kalması gecikmedir; kablosuz kapsülde mide boşalması beş saati geçerse anormaldir. Gastroparezide diyet (küçük partikül, sık ve az öğün), kan şekeri kontrolü, prokinetik (metoklopramid en fazla 12 hafta, domperidon EKG izlemiyle, eritromisin kısa süreli) ve antiemetik; dirençli olguda pilora yönelik girişim ya da mide elektriksel uyarısı. Kronik bulantı ve şişkinlikle birlikte ince bağırsak tıkanıklığı tablosunda kronik intestinal psödo-obstrüksiyon düşünülür ve antroduodenal manometriyle miyopati ile nöropati ayrılır. Kabızlıkta kolon transiti ölçülebilir; kablosuz kapsülde normal kolon transiti 59 saatin altındadır.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count: 1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.ciz{stroke-dasharray:1}
.s1{animation-name:s1}@keyframes s1{0%,0%{opacity:0;transform:translateY(8px)}3%, 100%{opacity:1;transform:none}}
.s1 .ciz{animation-name:c1}@keyframes c1{0%,0%{stroke-dashoffset:1}5%,100%{stroke-dashoffset:0}}
.s2{animation-name:s2}@keyframes s2{0%,25%{opacity:0;transform:translateY(8px)}28%, 100%{opacity:1;transform:none}}
.s2 .ciz{animation-name:c2}@keyframes c2{0%,25%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
.s3{animation-name:s3}@keyframes s3{0%,50%{opacity:0;transform:translateY(8px)}53%, 100%{opacity:1;transform:none}}
.s3 .ciz{animation-name:c3}@keyframes c3{0%,50%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
.s4{animation-name:s4}@keyframes s4{0%,75%{opacity:0;transform:translateY(8px)}78%, 100%{opacity:1;transform:none}}
.s4 .ciz{animation-name:c4}@keyframes c4{0%,75%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="640" height="670" fill="#ffffff"/>
<g class="a s2"><path class="a ciz" pathLength="1" d="M260,100 L120,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M320,100 L320,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s2"><path class="a ciz" pathLength="1" d="M380,100 L520,128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M108,270 L108,298" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M320,270 L320,298" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s3"><path class="a ciz" pathLength="1" d="M532,270 L532,298" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M108,450 L108,478" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a s4"><path class="a ciz" pathLength="1" d="M320,450 L320,478" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/></g><g class="a m s1"><rect x="40" y="18" width="560" height="82" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Önce mekanik tıkanıklığı dışla</text><text x="320" y="64" text-anchor="middle" font-size="13" fill="#0f172a">endoskopi · gerekirse BT / grafi</text><text x="320" y="84" text-anchor="middle" font-size="13" fill="#0f172a">ilaçları ve diyabeti gözden geçir</text></g><g class="a m s2"><rect x="10" y="130" width="196" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="108" y="175" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Yutma güçlüğü</text><text x="108" y="195" text-anchor="middle" font-size="13" fill="#1e3a8a">yüksek çözünürlüklü</text><text x="108" y="215" text-anchor="middle" font-size="13" fill="#1e3a8a">manometri</text><text x="108" y="235" text-anchor="middle" font-size="13" fill="#1e3a8a">Chicago 4.0</text></g><g class="a m s2"><rect x="222" y="130" width="196" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="175" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Bulantı · kusma</text><text x="320" y="195" text-anchor="middle" font-size="13" fill="#78350f">mide boşalması:</text><text x="320" y="215" text-anchor="middle" font-size="13" fill="#78350f">sintigrafi 4 saat</text><text x="320" y="235" text-anchor="middle" font-size="13" fill="#78350f">(2 sa &gt;%60 · 4 sa &gt;%10)</text></g><g class="a m s2"><rect x="434" y="130" width="196" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="532" y="175" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Kabızlık · şişkinlik</text><text x="532" y="195" text-anchor="middle" font-size="13" fill="#4c1d95">kolon transiti</text><text x="532" y="215" text-anchor="middle" font-size="13" fill="#4c1d95">(kablosuz kapsül:</text><text x="532" y="235" text-anchor="middle" font-size="13" fill="#4c1d95">normal &lt;59 saat)</text></g><g class="a m s3"><rect x="10" y="300" width="196" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="108" y="350" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Akalazya</text><text x="108" y="370" text-anchor="middle" font-size="13" fill="#1e3a8a">IRP yüksek +</text><text x="108" y="390" text-anchor="middle" font-size="13" fill="#1e3a8a">peristaltizm yok</text><text x="108" y="410" text-anchor="middle" font-size="13" fill="#1e3a8a">tip I · II · III</text></g><g class="a m s3"><rect x="222" y="300" width="196" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="350" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Gastroparezi</text><text x="320" y="370" text-anchor="middle" font-size="13" fill="#78350f">diyabetik · idiyopatik</text><text x="320" y="390" text-anchor="middle" font-size="13" fill="#78350f">· cerrahi sonrası</text><text x="320" y="410" text-anchor="middle" font-size="13" fill="#78350f">tıkanıklık yok</text></g><g class="a m s3"><rect x="434" y="300" width="196" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="532" y="350" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Kolon / ince bağırsak</text><text x="532" y="370" text-anchor="middle" font-size="13" fill="#4c1d95">yavaş geçiş</text><text x="532" y="390" text-anchor="middle" font-size="13" fill="#4c1d95">dissinerji · CIPO</text><text x="532" y="410" text-anchor="middle" font-size="13" fill="#4c1d95">(antroduodenal manometri)</text></g><g class="a m s4"><rect x="10" y="480" width="196" height="170" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="108" y="530" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">LES'i aç</text><text x="108" y="550" text-anchor="middle" font-size="13" fill="#064e3b">balon dilatasyonu</text><text x="108" y="570" text-anchor="middle" font-size="13" fill="#064e3b">Heller + kısmi</text><text x="108" y="590" text-anchor="middle" font-size="13" fill="#064e3b">fundoplikasyon</text><text x="108" y="610" text-anchor="middle" font-size="13" fill="#064e3b">POEM (tip III'te tercih)</text></g><g class="a m s4"><rect x="222" y="480" width="196" height="170" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="530" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Basamaklı tedavi</text><text x="320" y="550" text-anchor="middle" font-size="13" fill="#064e3b">küçük partikül diyet</text><text x="320" y="570" text-anchor="middle" font-size="13" fill="#064e3b">glisemi · prokinetik</text><text x="320" y="590" text-anchor="middle" font-size="13" fill="#064e3b">antiemetik</text><text x="320" y="610" text-anchor="middle" font-size="13" fill="#064e3b">pilor girişimi · uyarı</text></g>
</svg>
