<g class="a m s1"><rect x="40" y="20" width="560" height="132" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="320" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#0c4a6e">1 · Zemini hazırla</text><text x="320" y="72" text-anchor="middle" font-size="12" fill="#0c4a6e">Sodyum 2 g (88–90 mmol) / gün</text><text x="320" y="94" text-anchor="middle" font-size="12" fill="#0c4a6e">NSAİİ, ACE inhibitörü ve ARB'yi kes</text><text x="320" y="116" text-anchor="middle" font-size="12" fill="#0c4a6e">Alkolü bırak, altta yatan hastalığı tedavi et</text><text x="320" y="138" text-anchor="middle" font-size="12" fill="#0c4a6e">Sıvı kısıtı yalnız düşen ya da &lt;120 sodyumda</text></g>
<g class="a m s2"><rect x="40" y="176" width="560" height="132" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="204" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">2 · Başla</text><text x="320" y="228" text-anchor="middle" font-size="12" fill="#064e3b">Spironolakton 100 mg ± furosemid 40 mg, sabah tek doz</text><text x="320" y="250" text-anchor="middle" font-size="12" fill="#064e3b">EASL: ilk atakta spironolakton tek başına</text><text x="320" y="272" text-anchor="middle" font-size="12" fill="#064e3b">UpToDate: çoğu hastada baştan ikili</text><text x="320" y="294" text-anchor="middle" font-size="12" fill="#064e3b">Yaşlı, &lt;50 kg, Na &lt;130: düşük dozla başla</text></g>
<g class="a m s3"><rect x="40" y="332" width="560" height="132" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="320" y="360" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">3 · Titre et</text><text x="320" y="384" text-anchor="middle" font-size="12" fill="#0f172a">3–5 günde bir (en erken 72 saatte) artır</text><text x="320" y="406" text-anchor="middle" font-size="12" fill="#0f172a">Adım: spironolakton 100 mg · furosemid 40 mg</text><text x="320" y="428" text-anchor="middle" font-size="12" fill="#0f172a">Tavan: 400 mg + 160 mg / gün</text><text x="320" y="450" text-anchor="middle" font-size="12" fill="#0f172a">Yanıt: 4 günde ≥0,8 kg kayıp</text></g>
<g class="a m s4"><rect x="40" y="488" width="560" height="132" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="516" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">4 · İzle</text><text x="320" y="540" text-anchor="middle" font-size="12" fill="#78350f">Kilo kaybı: ödemsiz ≤0,5 · ödemli ≤1 kg / gün</text><text x="320" y="562" text-anchor="middle" font-size="12" fill="#78350f">Ayaktan: başlangıçtan 7–10 gün sonra elektrolit</text><text x="320" y="584" text-anchor="middle" font-size="12" fill="#78350f">Spot idrar Na/K &gt;1: diyeti sorgula</text><text x="320" y="606" text-anchor="middle" font-size="12" fill="#78350f">Na/K ≤1: diüretiği artır</text></g>
<g class="a m s5"><rect x="40" y="644" width="560" height="132" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="320" y="672" text-anchor="middle" font-size="15" font-weight="800" fill="#881337">5 · Azalt ya da kes</text><text x="320" y="696" text-anchor="middle" font-size="12" fill="#881337">Na ≥10 düşerse ya da &lt;125 mmol/L</text><text x="320" y="718" text-anchor="middle" font-size="12" fill="#881337">K &lt;3 (furosemid) · K &gt;6 (spironolakton)</text><text x="320" y="740" text-anchor="middle" font-size="12" fill="#881337">Kreatinin &gt;%100 artış ya da &gt;2 mg/dL</text><text x="320" y="762" text-anchor="middle" font-size="12" fill="#881337">Başka nedensiz ensefalopati · ağır kramp</text></g>
</svg>
