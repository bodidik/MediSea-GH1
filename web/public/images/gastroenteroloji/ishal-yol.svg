<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">İshalde süreye göre yol</title>
<desc id="d">İshal süresine göre üçe ayrılır. Akut ishal 14 günden kısa; nedeni genellikle enfeksiyon, çocukta çoğunlukla viral; tedavi ağızdan sıvı ve tuz-şeker çözeltisiyle hacim yerine koyma; antibiyotik rutin değil. Dışkı incelemesi gerektirenler: 5 günden uzun ağır belirti, sistemik enfeksiyon bulgusu, yaş uçları, bağışıklık baskılanması, komplikasyon, kanlı ya da mukuslu dışkı. Süren ishal 14–30 gün: parazit için dışkı incelemesi, özellikle yurt dışı seyahat, bağışıklık baskılanması. Kronik ishal 30 günden uzun: sık nedenler irritabl bağırsak sendromu, mikroskopik kolit, inflamatuvar bağırsak hastalığı, kolon kanseri, ilaçlar, diyet, safra asidi ishali, pankreas yetmezliği. İlk tetkikler: tam kan sayımı, kreatinin ve elektrolitler, tiroid işlevi, çölyak serolojisi (tTG ya da EMA), dışkı kalprotektini, dışkı kültürü, C. difficile toksini. Neden bulunmazsa fleksibl sigmoidoskopi; demir eksikliği anemisi, anormal kalprotektinle inflamatuvar bağırsak hastalığı kuşkusu ya da ileri yaşta tam kolonoskopi. Safra asidi ishalinde tanı ilaç denemesi ya da SeHCAT ile.</desc>
<!-- 12 sn; son kare = statik şemanın tamamı. Hareket azaltmada animasyon çalışmaz. -->
<style>
.a{animation-duration:12s;animation-iteration-count:1;animation-timing-function:ease-in-out;animation-fill-mode:both}
.m{transform-box:fill-box;transform-origin:center}
.s1{animation-name:s1}@keyframes s1{0%{opacity:0;transform:translateY(8px)}3%,100%{opacity:1;transform:none}}
.s2{animation-name:s2}@keyframes s2{0%,17%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
.s3{animation-name:s3}@keyframes s3{0%,33%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}
.s4{animation-name:s4}@keyframes s4{0%,50%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
<rect width="640" height="760" fill="#ffffff"/>
<g class="a m s1"><rect x="40" y="14" width="560" height="196" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="320" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Akut ishal: &lt;14 gün</text><text x="320" y="68" text-anchor="middle" font-size="12" fill="#1e3a8a">Genellikle enfeksiyon; çocukta çoğunlukla viral</text><text x="320" y="90" text-anchor="middle" font-size="12" fill="#1e3a8a">Tedavi: ağızdan sıvı + tuz-şeker çözeltisi; antibiyotik rutin değil</text><text x="320" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Dışkı incelemesi gerektirenler</text><text x="320" y="142" text-anchor="middle" font-size="12" fill="#1e3a8a">&gt;5 gün ağır belirti · sistemik enfeksiyon bulgusu</text><text x="320" y="162" text-anchor="middle" font-size="12" fill="#1e3a8a">yaş uçları · bağışıklık baskılanması · komplikasyon</text><text x="320" y="182" text-anchor="middle" font-size="12" fill="#1e3a8a">kanlı ya da mukuslu dışkı</text></g>
<g class="a m s2"><rect x="40" y="226" width="560" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="320" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">Süren ishal: 14–30 gün</text><text x="320" y="280" text-anchor="middle" font-size="12" fill="#78350f">Parazit için dışkı (yumurta, kist, parazit)</text><text x="320" y="302" text-anchor="middle" font-size="12" fill="#78350f">Özellikle seyahat, bağışıklık baskılanması</text></g>
<g class="a m s3"><rect x="40" y="342" width="560" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="320" y="370" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Kronik ishal: &gt;30 gün</text><text x="320" y="396" text-anchor="middle" font-size="12" fill="#7f1d1d">Sık nedenler: İBS · mikroskopik kolit · İBH · kolon kanseri</text><text x="320" y="416" text-anchor="middle" font-size="12" fill="#7f1d1d">ilaçlar · diyet · safra asidi ishali · pankreas yetmezliği</text><text x="320" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">İlk tetkikler</text><text x="320" y="468" text-anchor="middle" font-size="12" fill="#7f1d1d">Tam kan · kreatinin, elektrolit · tiroid · çölyak serolojisi</text><text x="320" y="488" text-anchor="middle" font-size="12" fill="#7f1d1d">dışkı kalprotektini · dışkı kültürü · C. difficile toksini</text><text x="320" y="516" text-anchor="middle" font-size="11" fill="#7f1d1d">Safra asidi ishali: ilaç denemesi ya da SeHCAT</text></g>
<g class="a m s4"><rect x="40" y="558" width="560" height="188" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="586" text-anchor="middle" font-size="15" font-weight="800" fill="#064e3b">Neden bulunmadıysa endoskopi</text><text x="320" y="614" text-anchor="middle" font-size="12" fill="#064e3b">Fleksibl sigmoidoskopi</text><text x="320" y="644" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Tam kolonoskopi:</text><text x="320" y="666" text-anchor="middle" font-size="12" fill="#064e3b">demir eksikliği anemisi</text><text x="320" y="686" text-anchor="middle" font-size="12" fill="#064e3b">anormal kalprotektin + İBH kuşkusu</text><text x="320" y="706" text-anchor="middle" font-size="12" fill="#064e3b">ileri yaş (polip ve kolorektal kanser taraması)</text></g>
</svg>
