<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Refrakter asitte karar yolu</title>
<desc id="d">Nakil değerlendirmesi; aday ise listeleme. TIPS'e uygunsa kaplı küçük çaplı stent, MELD 18 ve üstünde önerilmez. Uygun değilse seri büyük hacimli parasentez ve albümin ya da düşük akımlı pompa.</desc>
<style>.a{opacity:0;animation:g .6s ease-out forwards}@keyframes g{to{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="500" fill="#ffffff"/>
<g class="a" style="animation-delay:0.00s"><rect x="140" y="16" width="360" height="62" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="320" y="40" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">Refrakter asit</text><text x="320" y="58" text-anchor="middle" font-size="12.5" font-weight="400" fill="#312e81">Önce nakil değerlendirmesi</text></g><g class="a" style="animation-delay:2.40s"><line x1="320" y1="78" x2="320" y2="110" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="140" y="112" width="360" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Nakil adayı mı?</text><text x="320" y="154" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Adaysa TIPS'ten önce listele</text></g><g class="a" style="animation-delay:4.80s"><line x1="320" y1="174" x2="320" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="140" y="208" width="360" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="320" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">TIPS'e uygun mu?</text><text x="320" y="250" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">MELD ≥18'de önerilmez (UpToDate)</text></g><g class="a" style="animation-delay:7.20s"><line x1="250" y1="270" x2="160" y2="314" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="12" y="316" width="296" height="150" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="160" y="340" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">Uygun: TIPS</text><text x="160" y="358" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">Kaplı stent</text><text x="160" y="376" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">AASLD &lt;10 mm</text><text x="160" y="394" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">EASL 8 mm greft</text><text x="160" y="412" text-anchor="middle" font-size="12.5" font-weight="400" fill="#064e3b">(daraltılmış 10 mm değil)</text></g><g class="a" style="animation-delay:9.60s"><line x1="390" y1="270" x2="480" y2="314" stroke="#64748b" stroke-width="1.6" marker-end="url(#o)"/><rect x="332" y="316" width="296" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="480" y="340" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Uygun değil</text><text x="480" y="358" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Seri LVP + albümin</text><text x="480" y="376" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">&gt;5 L: 6–8 g/L (AASLD)</text><text x="480" y="394" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">8 g/L (EASL)</text><text x="480" y="412" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">Seçilmişte düşük akımlı pompa</text></g>
</svg>
